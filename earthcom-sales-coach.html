<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EARTHCOM SALES COACH AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="ec-auth.js" onerror="console.warn('ec-auth.js未読込：認証なしで起動')"></script>
<style>
:root{
  --ink:#1C2733; --ink2:#2B3A4A; --paper:#EEF1EF; --panel:#FFFFFF; --line:#D6DDD9;
  --muted:#5E6B75; --green:#18794E; --green-bg:#E3F1EA; --red:#B8322A; --red-bg:#FBEAE8;
  --amber:#B97E0E; --amber-bg:#FBF1DC; --blue:#2F5D8A;
  --num:'Barlow Condensed','Zen Kaku Gothic New',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
/* サイドバー */
.side{background:var(--ink);color:#E8EDEA;padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:0 8px 18px;border-bottom:1px solid #3A4A5A;margin-bottom:14px}
.brand b{display:block;font-weight:900;font-size:17px;letter-spacing:.02em}
.brand small{color:#9FB0A8;font-size:12px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;color:#C9D3CE;padding:10px 10px;border-radius:6px;cursor:pointer;font-size:14px}
.nav button:hover{background:#2A3847;color:#fff}
.nav button.on{background:#fff;color:var(--ink);font-weight:700}
.nav .grp{font-size:11px;color:#7F918A;margin:16px 10px 4px}
.nav i{font-style:normal;width:18px;text-align:center}
.kpi-mini{margin-top:22px;padding:12px;border:1px solid #3A4A5A;border-radius:8px;font-size:12px;color:#B6C3BD}
.kpi-mini div{display:flex;justify-content:space-between}
.kpi-mini strong{font-family:var(--num);font-size:20px;color:#fff}
#badge{margin-top:14px;font-size:12px}
/* メイン */
main{padding:28px clamp(16px,3vw,40px) 80px;max-width:1180px;width:100%}
h1{font-size:26px;font-weight:900;margin:0 0 4px;letter-spacing:.01em}
.lead{color:var(--muted);margin:0 0 22px}
h2{font-size:18px;font-weight:900;margin:0 0 12px}
h3{font-size:15px;font-weight:700;margin:0 0 8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
label.f{display:block;font-size:13px;font-weight:700;margin-bottom:4px}
input[type=text],input[type=url],input[type=date],select,textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:9px 10px;background:#fff}
textarea{resize:vertical}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);background:#fff;padding:9px 16px;border-radius:6px;cursor:pointer;font-weight:700;font-size:14px}
.btn:hover{background:var(--paper)}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:var(--ink2)}
.btn.go{background:var(--green);border-color:var(--green);color:#fff}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:wait}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;padding:1px 8px;border-radius:4px;font-size:12px;font-weight:700;background:var(--paper);border:1px solid var(--line)}
.tag.red{background:var(--red-bg);color:var(--red);border-color:#F0C8C3}
.tag.green{background:var(--green-bg);color:var(--green);border-color:#BFDCCB}
.tag.amber{background:var(--amber-bg);color:var(--amber);border-color:#EED8A8}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700;background:#F7F9F8}
td.n,th.n{text-align:right;font-family:var(--num);font-size:17px}
.scroll{overflow-x:auto}
/* 入力DROP */
.drop{border:2px dashed #9DB2A7;border-radius:12px;background:#F8FBF9;padding:26px;text-align:center;transition:background .15s}
.drop.over{background:var(--green-bg);border-color:var(--green)}
.drop .big{font-size:20px;font-weight:900;margin:0 0 6px}
.src-tabs{display:flex;gap:6px;margin:14px 0 10px;justify-content:center;flex-wrap:wrap}
.src-tabs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 14px;cursor:pointer;font-size:13px}
.src-tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.go-wrap{text-align:center;margin-top:18px}
.go-wrap .btn{font-size:18px;padding:14px 44px}
/* スコア */
.score-head{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.total{font-family:var(--num);font-size:72px;font-weight:700;line-height:1}
.total small{font-size:22px;color:var(--muted)}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:12px;background:#E5EAE7;border-radius:6px;overflow:hidden}
.bar .fill{height:100%;border-radius:6px}
.bar .v{font-family:var(--num);font-size:18px;text-align:right}
.bar.low .lbl{color:var(--red);font-weight:700}
.bottleneck{border-left:5px solid var(--red);background:var(--red-bg);padding:12px 16px;border-radius:0 8px 8px 0;margin-top:14px}
/* 断り文句カード（このアプリの核） */
.obj{border:1px solid #EBC9C4;border-radius:10px;overflow:hidden;margin-bottom:16px;background:#fff}
.obj-q{background:var(--red);color:#fff;padding:14px 18px;font-size:18px;font-weight:900}
.obj-q small{display:block;font-size:12px;font-weight:500;opacity:.85}
.obj-body{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chain{list-style:none;margin:0;padding:0;position:relative}
.chain li{position:relative;padding:4px 0 10px 22px;font-size:14px}
.chain li:before{content:'';position:absolute;left:5px;top:12px;width:9px;height:9px;border-radius:50%;background:#C9D3CE}
.chain li:after{content:'';position:absolute;left:9px;top:22px;bottom:-4px;width:1px;background:#C9D3CE}
.chain li:last-child:after{display:none}
.chain li:last-child:before{background:var(--red)}
.chain li:last-child{font-weight:700;color:var(--red)}
.point{background:var(--amber-bg);border-radius:6px;padding:8px 12px;font-size:13px;margin-top:6px}
.fix{border-radius:8px;padding:10px 14px;margin-bottom:10px}
.fix.q{background:#EAF1F8}
.fix.t{background:var(--green-bg)}
.fix.r{background:#F4F4F4}
.fix b{display:block;font-size:12px;color:var(--muted)}
/* 意思決定者 */
.ladder{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.rung{flex:1;min-width:100px;border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;font-size:13px}
.rung b{display:block;font-size:15px}
.rung.s0{background:#F4F5F5;color:#8C979F}
.rung.s1{background:var(--amber-bg);border-color:#EED8A8}
.rung.s2{background:var(--green-bg);border-color:#BFDCCB}
.onepager{border:1px solid var(--line);border-radius:8px;padding:18px;background:#FCFDFC;white-space:pre-wrap;font-size:14px}
/* NEXT ACTION */
.na{display:grid;grid-template-columns:120px 1fr;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.na div{padding:10px 14px;border-bottom:1px solid var(--line)}
.na .w{background:var(--ink);color:#fff;font-weight:700;font-size:13px;border-color:#33455A}
/* ファネル */
.funnel{display:grid;gap:4px}
.fstep{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:12px}
.fbar{background:var(--ink);color:#fff;border-radius:6px;padding:8px 12px;font-family:var(--num);font-size:22px;min-width:60px}
.frate{grid-column:2;font-size:13px;padding:2px 0 2px 14px;border-left:2px solid var(--line);margin-left:10px}
.frate b{font-family:var(--num);font-size:20px}
.ok{color:var(--green)} .ng{color:var(--red)}
/* チャット */
.chat{height:440px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#F8FAF9;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:78%;padding:10px 14px;border-radius:12px;font-size:14px;white-space:pre-wrap}
.msg.c{background:#fff;border:1px solid var(--line);align-self:flex-start}
.msg.s{background:var(--ink);color:#fff;align-self:flex-end}
.msg .who{font-size:11px;opacity:.7;display:block}
.result-card{border:2px solid var(--ink);border-radius:10px;padding:18px;margin-top:14px}
/* 汎用 */
.list-item{border-bottom:1px solid var(--line);padding:12px 4px;cursor:pointer}
.list-item:hover{background:#F7F9F8}
.stat{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff}
.stat .n{font-family:var(--num);font-size:34px;font-weight:700;line-height:1.1}
.banner{background:var(--amber-bg);border:1px solid #EED8A8;color:#6B4A06;padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:13px}
.loading{position:fixed;inset:0;background:rgba(28,39,51,.55);display:none;align-items:center;justify-content:center;z-index:50}
.loading.on{display:flex}
.loading div{background:#fff;padding:26px 34px;border-radius:12px;text-align:center;max-width:360px}
.spin{width:36px;height:36px;border:4px solid #DDE3E0;border-top-color:var(--green);border-radius:50%;margin:0 auto 12px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:8px;display:none;z-index:60}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;padding:12px}
  .nav{display:flex;overflow-x:auto;gap:4px}
  .nav button{white-space:nowrap;width:auto}
  .nav .grp,.kpi-mini{display:none}
  .grid2,.grid3,.obj-body{grid-template-columns:1fr}
  .bar{grid-template-columns:110px 1fr 36px}
}
@media print{.side,.no-print{display:none!important}.app{display:block}main{padding:0}}
</style>
</head>
<body>
<div class="app">
  <aside class="side no-print">
    <div class="brand"><b>SALES COACH AI</b><small>同じ断り文句で、二度負けない。</small></div>
    <nav class="nav" id="nav">
      <div class="grp">営業担当</div>
      <button data-v="home"><i>＋</i>商談をAI分析</button>
      <button data-v="karte"><i>▤</i>育成カルテ</button>
      <button data-v="bank"><i>◆</i>断り文句BANK</button>
      <button data-v="roleplay"><i>▶</i>AIロープレ</button>
      <button data-v="predict"><i>◎</i>商談前予測</button>
      <div class="grp">責任者・社長</div>
      <button data-v="dash"><i>▼</i>転換率ダッシュボード</button>
      <button data-v="ceo"><i>★</i>社長画面</button>
    </nav>
    <div class="kpi-mini">
      <div>無料診断→現調<strong id="kpiG">-</strong></div>
      <div>現調後→合意書<strong id="kpiA">-</strong></div>
      <div class="small" style="margin-top:4px;color:#7F918A">全商品共通の目標</div>
    </div>
    <div id="badge"></div>
  </aside>
  <main id="main"></main>
</div>
<div class="loading" id="loading"><div><div class="spin"></div><b id="loadingMsg">AIが分析しています</b><p class="small muted" style="margin:6px 0 0">長い商談は1〜2分かかります</p></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ 設定 ============ */
const CFG = {
  url: 'https://aakofrzurgwrkctunthw.supabase.co',
  key: 'sb_publishable_yAUGrTJjqg56S16D7BI2oQ_pbt1olLa',
  ai:  'https://aakofrzurgwrkctunthw.supabase.co/functions/v1/ai'
};
const T = { s:'sales_coach_sessions', o:'sales_coach_objections', r:'sales_coach_roleplays' };
const STAGES = ['初回商談','無料診断','現調','現調後商談','合意書','契約'];
const RESULTS = ['前進','継続','保留','失注'];
const PRODUCTS = ['ReFort（高圧）','ReFort（低圧）','系統蓄電池','産業用蓄電池','セカンダリー太陽光','サンキーパー','O&M','その他'];
const SCORE_ITEMS = ['事前準備','アイスブレイク・関係構築','ヒアリング','課題深掘り','経営課題への転換','価値訴求','反論処理','意思決定者アプローチ','クロージング','次回アクション'];
const OBJ_CATS = ['価格が高い','今は投資できない','自社で施工できる','改善効果への疑問','FIT残存期間が短い','今のままで困っていない','他社にも見積を取る','社長に相談します','検討します','今期予算がない','その他'];
const DM_LEVELS = ['担当者','課長','部長','役員','社長'];
const THEME_BY_ITEM = {
  '事前準備':'商談前の顧客調査と仮説シート作成',
  'アイスブレイク・関係構築':'最初の5分で相手の関心を引き出す入り方',
  'ヒアリング':'財務・投資方針を先に聞く質問設計',
  '課題深掘り':'「なぜ」を3回重ねる課題の掘り下げ',
  '経営課題への転換':'発電量の話をキャッシュフローの話に変える',
  '価値訴求':'現状維持コストとの比較で価値を示す',
  '反論処理':'断り文句の前に予防トークを入れる',
  '意思決定者アプローチ':'社長同席への転換',
  'クロージング':'次の一歩（無料診断・現調）を日付で決める',
  '次回アクション':'商談の最後に「誰が・何を・いつまでに」を合意する'
};

/* ============ 共通 ============ */
let sb = null, ME = { name:'', email:'', role:'' }, LOCAL = false;
/* ===== KPI目標：ここが唯一の定義元（画面の設定で上書きされ、Supabaseに保存） ===== */
const KPI_DEFAULT = { base:{ genchou:70, gouisho:30 }, byProduct:{} };
let KPI = JSON.parse(JSON.stringify(KPI_DEFAULT));
const KPI_KEY = 'kpi_targets';
function kpiFor(prod){ const p = prod && KPI.byProduct[prod]; return { genchou: p?.genchou ?? KPI.base.genchou, gouisho: p?.gouisho ?? KPI.base.gouisho, custom: !!p }; }
function kpiText(prod){ const k=kpiFor(prod); return `無料診断→現調 ${k.genchou}%、現調後商談→合意書 ${k.gouisho}%`; }
const canEditKPI = () => LOCAL || !window.EC || ME.role==='admin';
async function loadKPI(){
  try{
    if (!LOCAL){ const { data, error } = await sb.from('sales_coach_settings').select('value').eq('key',KPI_KEY).maybeSingle(); if (error) throw error; if (data?.value) KPI = normKPI(data.value); }
    else { const v = localStorage.getItem('scai_'+KPI_KEY); if (v) KPI = normKPI(JSON.parse(v)); }
  }catch(e){ console.warn('KPI設定の読込失敗（初期値を使用）', e); }
  renderKpiMini();
}
function normKPI(v){ return { base:{ genchou:+v?.base?.genchou||KPI_DEFAULT.base.genchou, gouisho:+v?.base?.gouisho||KPI_DEFAULT.base.gouisho }, byProduct: v?.byProduct||{} }; }
async function saveKPI(next){
  if (!LOCAL){ const { error } = await sb.from('sales_coach_settings').upsert({ key:KPI_KEY, value:next, updated_by:ME.email||ME.name, updated_at:new Date().toISOString() }); if (error) throw error; }
  else localStorage.setItem('scai_'+KPI_KEY, JSON.stringify(next));
  KPI = next; renderKpiMini();
}
function renderKpiMini(){ const g=document.getElementById('kpiG'), a=document.getElementById('kpiA'); if(g) g.textContent=KPI.base.genchou+'%'; if(a) a.textContent=KPI.base.gouisho+'%'; }
const DATA = { s:[], o:[], r:[] };
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d => d ? new Date(d).toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'}) : '';
const pct = (a,b) => b ? Math.round(a/b*1000)/10 : null;
function toast(m){ const t=$('#toast'); t.textContent=m; t.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display='none',2400); }
function loading(on,msg){ $('#loading').classList.toggle('on',on); if(msg) $('#loadingMsg').textContent=msg; }
async function copy(text){ try{ await navigator.clipboard.writeText(text); toast('コピーしました'); }catch(e){ prompt('コピーしてください',text); } }
const opts = (arr,sel) => arr.map(v=>`<option ${v===sel?'selected':''}>${esc(v)}</option>`).join('');

/* ============ データ層（Supabase／未作成時はブラウザ保存） ============ */
async function loadAll(){
  if (sb){
    try{
      const [a,b,c] = await Promise.all([
        sb.from(T.s).select('*').order('created_at',{ascending:false}).limit(3000),
        sb.from(T.o).select('*').order('created_at',{ascending:false}).limit(8000),
        sb.from(T.r).select('*').order('created_at',{ascending:false}).limit(3000)
      ]);
      const err = a.error||b.error||c.error; if (err) throw err;
      DATA.s=a.data; DATA.o=b.data; DATA.r=c.data; LOCAL=false; return;
    }catch(e){ console.warn('Supabase読込失敗→ブラウザ保存モード', e); }
  }
  LOCAL = true;
  for (const k of ['s','o','r']) DATA[k] = JSON.parse(localStorage.getItem('scai_'+k)||'[]');
}
function saveLocal(k){ localStorage.setItem('scai_'+k, JSON.stringify(DATA[k])); }
async function insert(k,row){
  row.id = row.id || crypto.randomUUID();
  row.created_at = row.created_at || new Date().toISOString();
  if (!LOCAL){
    const { data, error } = await sb.from(T[k]).insert(row).select().single();
    if (error) throw error; DATA[k].unshift(data); return data;
  }
  DATA[k].unshift(row); saveLocal(k); return row;
}
async function insertMany(k,rows){
  rows.forEach(r=>{ r.id=r.id||crypto.randomUUID(); r.created_at=r.created_at||new Date().toISOString(); });
  if (!rows.length) return;
  if (!LOCAL){ const { error } = await sb.from(T[k]).insert(rows); if (error) throw error; }
  DATA[k].unshift(...rows); if (LOCAL) saveLocal(k);
}
async function patch(k,id,p){
  if (!LOCAL){ const { error } = await sb.from(T[k]).update(p).eq('id',id); if (error) throw error; }
  const r = DATA[k].find(x=>x.id===id); if (r) Object.assign(r,p); if (LOCAL) saveLocal(k);
}

/* ============ AI（Edge Function `ai` 経由） ============ */
async function callAI({ prompt, system, messages, max_tokens=6000 }){
  let token = CFG.key;
  try{ const { data } = await sb.auth.getSession(); if (data?.session?.access_token) token = data.session.access_token; }catch(e){}
  const body = { system, max_tokens };
  if (messages) body.messages = messages; else body.prompt = prompt;
  const res = await fetch(CFG.ai, { method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token, 'apikey':CFG.key }, body: JSON.stringify(body) });
  const j = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(j.error || j.message || ('AI呼び出しエラー（'+res.status+'）'));
  if (typeof j === 'string') return j;
  return j.text || (Array.isArray(j.content) ? j.content.map(c=>c.text||'').join('') : '') || j.completion || j.result || '';
}
function parseJSON(t){
  const s = t.replace(/```json|```/g,''); const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a<0||b<0) throw new Error('AIの回答を読み取れませんでした。もう一度実行してください。');
  return JSON.parse(s.slice(a,b+1));
}

async function readFile(f){
  try{
    loading(true,'ファイルを読み込んでいます');
    let text='';
    const ext=f.name.split('.').pop().toLowerCase();
    if (ext==='docx'){ const r=await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()}); text=r.value; }
    else if (ext==='pdf'){
      pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
      for(let i=1;i<=pdf.numPages;i++){ const p=await pdf.getPage(i); const c=await p.getTextContent(); text+=c.items.map(x=>x.str).join(' ')+'\n'; }
    } else text = await f.text();
    SRC.text=text.trim(); SRC.fileName=f.name; SRC.mode='paste';
    VIEWS.home(); toast(f.name+' を読み込みました');
  }catch(e){ alert('読み込めませんでした：'+e.message); }
  finally{ loading(false); }
}

function topCats(objs){
  const m={}; objs.forEach(o=>{ const c=o.category||'その他'; (m[c]=m[c]||[]).push(o); });
  return Object.entries(m).map(([cat,list])=>{
    const sessIds=[...new Set(list.map(o=>o.session_id))];
    const lost=sessIds.filter(id=>(DATA.s.find(s=>s.id===id)||{}).result==='失注').length;
    return { cat, list, count:list.length, lossRate:pct(lost,sessIds.length) };
  }).sort((a,b)=>b.count-a.count);
}

    const a=s.analysis||{}; opening=a.roleplay?.opening||(a.objections?.[0]?.quote)||''; followups=a.roleplay?.followups||[]; category=a.roleplay?.category||a.objections?.[0]?.category||'';

  } else if (cat){
    const ex = DATA.o.filter(o=>o.category===cat); const pick = ex[0];

/* ============ ⑥ 転換率ダッシュボード ============ */
function funnel(sessions){
  const by={}; sessions.forEach(s=>{ const k=(s.customer||'').trim(); if(!k) return; by[k]=Math.max(by[k]??-1, STAGES.indexOf(s.stage)); });
  const v=Object.values(by); const c=i=>v.filter(x=>x>=i).length;
  return { diag:c(1), gen:c(2), gou:c(4), kei:c(5) };
}
function avgScores(sessions){
  const r={}; SCORE_ITEMS.forEach(it=>{ const vals=sessions.map(s=>(s.analysis?.scores||[]).find(x=>x.item===it)?.score).filter(v=>v!=null); r[it]=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):null; });
  return r;
}
function weakest(avg){ return Object.entries(avg).filter(([,v])=>v!=null).sort((a,b)=>a[1]-b[1])[0]?.[0]; }

  <div class="panel"><h2>担当者別：数字 → 原因 → 育成テーマ</h2><div class="scroll"><table>
    <tr><th>担当</th><th class="n">商談</th><th class="n">現調率</th><th class="n">合意書率</th><th class="n">平均点</th><th>ボトルネック</th><th>今週の重点練習</th></tr>
    ${repRows.map(r=>`<tr><td><b>${esc(r.rep)}</b></td><td class="n">${r.n}</td><td class="n ${r.a!=null&&r.a<K.genchou?'ng':'ok'}">${r.a??'-'}%</td><td class="n ${r.b!=null&&r.b<K.gouisho?'ng':'ok'}">${r.b??'-'}%</td><td class="n">${r.avg??'-'}</td><td>${esc(r.wk||'-')}${r.topObj?`<div class="small muted">頻出：${esc(r.topObj)}</div>`:''}</td><td class="small">${esc(THEME_BY_ITEM[r.wk]||'-')}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">データがありません</td></tr>'}
  </table></div></div>`;
  const upd=()=>{ VIEWS.dash.f={rep:$('#dRep').value,prod:$('#dProd').value,month:$('#dMon').value}; VIEWS.dash(); };
  ['#dRep','#dProd','#dMon'].forEach(s=>$(s).onchange=upd);
};

/* ============ ⑦ 社長画面 ============ */
function weekRange(offset=0){ const d=new Date(); const day=(d.getDay()+6)%7; const st=new Date(d.getFullYear(),d.getMonth(),d.getDate()-day+offset*7); const en=new Date(st); en.setDate(st.getDate()+7); return [st,en]; }
const inRange=(x,[a,b])=>{ const t=new Date(x.created_at); return t>=a&&t<b; };
VIEWS.ceo = () => {
  const wk=weekRange(0), pw=weekRange(-1);
  const S=DATA.s.filter(s=>inRange(s,wk)), P=DATA.s.filter(s=>inRange(s,pw));
  const O=DATA.o.filter(o=>S.some(s=>s.id===o.session_id));
  const cats=topCats(O);
  const lostCats=topCats(O.filter(o=>o.result==='失注'));
  const reps=[...new Set(S.map(s=>s.rep))];
  const avg=a=>a.length?a.reduce((t,s)=>t+(s.total_score||0),0)/a.length:null;
  const improved=reps.map(r=>{ const now=avg(S.filter(s=>s.rep===r)), prev=avg(P.filter(s=>s.rep===r)); return {r,d:(now!=null&&prev!=null)?Math.round(now-prev):null,now:Math.round(now||0)}; }).filter(x=>x.d!=null).sort((a,b)=>b.d-a.d)[0];
  const weak=weakest(avgScores(S));
  const theme = lostCats[0]?.cat ? `「${lostCats[0].cat}」への予防トーク` : (weak?THEME_BY_ITEM[weak]:'');
  const rpWeek=DATA.r.filter(r=>inRange(r,wk));
  VIEWS.ceo.stats={S,cats,lostCats,improved,weak,theme,rpWeek,wk};
  $('#main').innerHTML = `${banner()}<h1>今週の営業AIレポート</h1>
  <p class="lead">${wk[0].toLocaleDateString('ja-JP')}〜　録画を見なくても、全社の営業課題がここで分かります。</p>
  <div class="grid3" style="margin-bottom:18px">
    <div class="stat"><div class="small muted">分析した商談</div><div class="n">${S.length}<span class="small">件</span></div></div>
    <div class="stat"><div class="small muted">抽出した断り文句</div><div class="n">${O.length}<span class="small">件</span></div></div>
    <div class="stat"><div class="small muted">ロープレ合格</div><div class="n">${rpWeek.filter(r=>r.passed).length}<span class="small">／${rpWeek.length}回</span></div></div>
  </div>
  <div class="grid2">
    <div class="panel"><h2>頻出断り文句</h2><ol style="margin:0;padding-left:20px">${cats.slice(0,5).map(c=>`<li><a href="#" onclick="go('bank','${esc(c.cat)}');return false">${esc(c.cat)}</a> <span class="muted small">${c.count}回</span></li>`).join('')||'<li class="muted">今週はまだありません</li>'}</ol></div>
    <div class="panel"><h2>最も失注につながった断り文句</h2>${lostCats[0]?`<p style="font-size:20px;font-weight:900;margin:0">${esc(lostCats[0].cat)}</p><p class="small muted">失注商談で${lostCats[0].count}回。例「${esc(lostCats[0].list[0].quote)}」</p>`:'<p class="muted">今週の失注はありません</p>'}</div>
    <div class="panel"><h2>最も改善した営業</h2>${improved?`<p style="font-size:20px;font-weight:900;margin:0">${esc(improved.r)}</p><p class="small muted">平均${improved.now}点（先週比 ${improved.d>=0?'+':''}${improved.d}点）</p>`:'<p class="muted">先週との比較データがまだありません</p>'}</div>
    <div class="panel"><h2>全社員共通の弱点</h2>${weak?`<p style="font-size:20px;font-weight:900;margin:0">${esc(weak)}</p>`:'<p class="muted">-</p>'}<h3 style="margin-top:12px">来週全員でロープレすべきテーマ</h3><p style="margin:0"><span class="tag amber">${esc(theme||'-')}</span></p></div>
  </div>
  <div class="panel"><div class="row" style="justify-content:space-between"><h2 style="margin:0">AI週次講評</h2><div class="row"><button class="btn go" id="ceoAi">AIに講評を書かせる</button><button class="btn" id="ceoCp" style="display:none">Chatwork用にコピー</button></div></div>
  <div id="ceoText" class="onepager" style="margin-top:12px;display:none"></div></div>`;
  $('#ceoAi').onclick=ceoReport;
  renderKpiSettings();
};
function renderKpiSettings(){
  const ed = canEditKPI();
  const inp = (id,v,ph) => `<input type="number" min="1" max="100" step="1" id="${id}" value="${v??''}" placeholder="${ph??''}" style="width:80px;border:1px solid var(--line);border-radius:6px;padding:6px 8px" ${ed?'':'disabled'}>`;
  const el = document.createElement('div'); el.className='panel'; el.id='kpiPanel';
  el.innerHTML = `<div class="row" style="justify-content:space-between"><h2 style="margin:0">KPI目標設定</h2>${ed?'':'<span class="tag">閲覧のみ（変更は管理者）</span>'}</div>
  <p class="small muted">ここで変えた数値が、サイドバー・ファネル判定・担当者別表・AIの分析基準にすべて反映されます。商品別の欄は空欄なら全商品共通の値を使います。</p>
  <div class="scroll"><table><tr><th>対象</th><th class="n">無料診断→現調</th><th class="n">現調後→合意書</th></tr>
  <tr><td><b>全商品共通</b></td><td class="n">${inp('kb_g',KPI.base.genchou)} %</td><td class="n">${inp('kb_a',KPI.base.gouisho)} %</td></tr>
  ${PRODUCTS.map((p,i)=>{ const v=KPI.byProduct[p]||{}; return `<tr><td>${esc(p)}</td><td class="n">${inp('kp_g'+i,v.genchou,KPI.base.genchou)} %</td><td class="n">${inp('kp_a'+i,v.gouisho,KPI.base.gouisho)} %</td></tr>`; }).join('')}
  </table></div>
  ${ed?'<div class="row" style="margin-top:12px"><button class="btn primary" id="kpiSave">保存して全社に反映</button><button class="btn" id="kpiReset">初期値（70%／30%）に戻す</button></div>':''}`;
  $('#main').appendChild(el);
  if (!ed) return;
  const num = id => { const v=$('#'+id).value.trim(); if(v==='') return null; const n=Math.round(+v); if(!(n>=1&&n<=100)) throw new Error('1〜100の数値で入力してください'); return n; };
  $('#kpiSave').onclick = async ()=>{
    try{
      const next={ base:{ genchou:num('kb_g'), gouisho:num('kb_a') }, byProduct:{} };
      if(next.base.genchou==null||next.base.gouisho==null) throw new Error('全商品共通の目標は必須です');
      PRODUCTS.forEach((p,i)=>{ const g=num('kp_g'+i), a=num('kp_a'+i); if(g!=null||a!=null) next.byProduct[p]={ ...(g!=null?{genchou:g}:{}), ...(a!=null?{gouisho:a}:{}) }; });
      if(!confirm(`全商品共通：現調 ${next.base.genchou}%／合意書 ${next.base.gouisho}%\n商品別の設定：${Object.keys(next.byProduct).length}件\n\nこの目標で保存しますか？`)) return;
      await saveKPI(next); toast('KPI目標を保存しました'); go('ceo');
    }catch(e){ alert('保存できませんでした：'+e.message); }
  };
  $('#kpiReset').onclick = async ()=>{ if(!confirm('全商品共通 70%／30%、商品別の設定なし に戻しますか？')) return; try{ await saveKPI(JSON.parse(JSON.stringify(KPI_DEFAULT))); toast('初期値に戻しました'); go('ceo'); }catch(e){ alert(e.message); } };
}
async function ceoReport(){
  const st=VIEWS.ceo.stats; if(!st.S.length) return alert('今週分析した商談がまだありません。');
  const repLines=[...new Set(st.S.map(s=>s.rep))].map(r=>{ const rs=st.S.filter(s=>s.rep===r); return `${r}：${rs.length}件、平均${Math.round(rs.reduce((t,s)=>t+(s.total_score||0),0)/rs.length)}点、弱点${weakest(avgScores(rs))||'-'}、結果${rs.map(s=>s.result).join('/')}`; }).join('\n');
  const prompt=`社長向けの今週の営業AIレポートを、Chatworkに貼る文章で作ってください。
書式：HTMLタグ禁止。強調は【】、見出しは■、区切りは[hr]。先頭行だけ [info][title]今週の営業AIレポート[/title] とし、末尾を [/info] で閉じる。[title]は1回だけ。
構成：■総括（3行）■数字 ■頻出断り文句と原因地点 ■最も失注につながった断り文句と全社の予防策 ■担当者別の一言（事実→不足→次週の行動） ■来週全員でやるロープレ（テーマ・回数・完了条件）。識学ベースで感情評価は入れない。
【データ】商談${st.S.length}件
頻出断り文句：${st.cats.slice(0,5).map(c=>`${c.cat}(${c.count})`).join('、')}
失注につながった断り文句：${st.lostCats.slice(0,3).map(c=>`${c.cat}(${c.count})`).join('、')||'なし'}
代表的な原因地点：${st.cats.slice(0,3).map(c=>c.list[0].detail?.cause_point).filter(Boolean).join('／')}
担当者別：\n${repLines}
全社共通の弱点：${st.weak}／提案テーマ：${st.theme}
ロープレ：${st.rpWeek.length}回中${st.rpWeek.filter(r=>r.passed).length}回合格`;
  try{
    loading(true,'今週の講評を書いています');
    const t=await callAI({system:companyFor(),prompt,max_tokens:2500});
    $('#ceoText').style.display='block'; $('#ceoText').textContent=t.trim();
    $('#ceoCp').style.display=''; $('#ceoCp').onclick=()=>copy(t.trim());
  }catch(e){ alert('作成できませんでした：'+e.message); }
  finally{ loading(false); }
}

/* ============ 起動 ============ */
(async function boot(){
  try{ if (window.EC?.guard) await EC.guard({ allow:['admin','manager','sales'] }); }catch(e){ console.warn(e); }
  try{ sb = supabase.createClient(CFG.url, CFG.key); }catch(e){ console.warn(e); }
  try{ const m = window.EC?.me ? await EC.me() : null; if (m){ ME.name=m.full_name||m.name||''; ME.email=m.email||''; ME.role=m.role||''; } }catch(e){}
  try{ if (window.EC?.mountBadge) EC.mountBadge(document.getElementById('badge')); }catch(e){}
  await loadAll();
  await loadKPI();
  go('home');
})();
</script>
