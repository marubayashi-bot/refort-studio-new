<style>
:root{
  --navy:#0B2545; --navy2:#123A6B; --blue:#1F6FB2; --sky:#3FA9F5; --teal:#4FD8D0;
  --ink:#0E2240; --paper:#EAF2F9; --panel:rgba(255,255,255,.82); --line:#D5E2EE;
  --muted:#5C6F84; --green:#15805A; --green-bg:#E2F4EC; --red:#C23A30; --red-bg:#FCEBE9;
  --amber:#B97E0E; --amber-bg:#FCF2DD;
  --num:'Barlow Condensed','Zen Kaku Gothic New',sans-serif;
  --shadow:0 12px 32px rgba(18,58,107,.10), 0 2px 6px rgba(18,58,107,.06);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;color:var(--ink);font-size:15px;line-height:1.7;
  background:linear-gradient(180deg,#EDF4FB 0%,#E7F0F8 45%,#E4F1F2 100%);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100%}

/* ===== サイドバー ===== */
.side{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 16px 16px;color:#DCE8F5;display:flex;flex-direction:column;
  background:radial-gradient(120% 60% at 0% 0%,#1B4A80 0%,transparent 60%),linear-gradient(180deg,#0D2A4F 0%,#0A1F3C 55%,#081830 100%)}
.brand{display:flex;align-items:center;gap:12px;padding:0 4px}
.brand img{width:48px;height:46px;border-radius:12px;object-fit:cover;box-shadow:0 0 0 1px rgba(120,190,255,.35),0 0 18px rgba(63,169,245,.35)}
.brand b{display:block;white-space:nowrap;font-weight:900;font-size:17px;letter-spacing:.03em;color:#fff;line-height:1.2}
.brand small{font-size:11px;letter-spacing:.14em;color:#8FB3D9}
.tagline{margin:14px 6px 16px;padding-bottom:16px;border-bottom:1px solid rgba(143,179,217,.22);font-size:15px;letter-spacing:.12em;line-height:1.7;color:#E6EEF8}
.nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;color:#CFDDEE;padding:11px 14px;border-radius:12px;cursor:pointer;font-size:14.5px;margin-bottom:2px;transition:background .15s,color .15s}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:linear-gradient(180deg,#FFFFFF 0%,#E4F0FC 100%);color:var(--navy);font-weight:700;box-shadow:0 6px 18px rgba(63,169,245,.35),0 0 0 1px rgba(255,255,255,.6)}
.nav button.on svg{color:var(--navy)}
.nav svg{width:20px;height:20px;flex:none;color:#AFC6E0}
.nav .grp{font-size:11px;letter-spacing:.1em;color:#6F8FB3;margin:14px 14px 4px}
.kpi-mini{margin:18px 0 0;padding:14px;border:1px solid rgba(143,179,217,.3);border-radius:14px;background:rgba(255,255,255,.04)}
.kpi-mini .hd{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13.5px;color:#fff;margin-bottom:8px}
.kpi-mini .it{margin-top:8px}
.kpi-mini .lb{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px}
.kpi-mini strong{font-family:var(--num);font-size:24px;color:#fff;font-weight:700}
.kpi-mini .tr{position:relative;height:7px;border-radius:4px;background:rgba(255,255,255,.12);margin-top:3px}
.kpi-mini .tr i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:linear-gradient(90deg,#39C6D8,#6FF0D8)}
.kpi-mini .tr b{position:absolute;top:-3px;width:2px;height:13px;background:#fff;opacity:.8}
.kpi-mini .sub{font-size:11px;color:#8FB3D9}
.quote{margin:20px 10px 6px;font-size:14px;letter-spacing:.1em;line-height:1.8;color:#C9D8EA}
.ec{display:flex;align-items:center;gap:8px;margin:10px 10px 14px;font-weight:700;letter-spacing:.14em;color:#6FD2E0;font-size:14px}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 6px 0;border-top:1px solid rgba(143,179,217,.22)}
.me .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:var(--navy);background:linear-gradient(135deg,#E6F3FF,#9FD0F7)}
.me b{display:block;color:#fff;font-size:14px;line-height:1.3}
.me small{color:#8FB3D9;font-size:12px}
.me button{margin-left:auto;border:0;background:none;color:#AFC6E0;cursor:pointer;padding:6px;border-radius:8px}
.me button:hover{background:rgba(255,255,255,.08);color:#fff}
#badge{font-size:12px;margin-top:6px}

/* ===== メイン・ヒーロー ===== */
.stage{position:relative;min-width:0;overflow:hidden}
.hero-art{position:absolute;top:0;right:0;width:min(56%,720px);height:215px;pointer-events:none;z-index:0;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 22%);mask-image:linear-gradient(90deg,transparent 0%,#000 22%)}
.hero-art svg{width:100%;height:100%;display:block}
main{position:relative;z-index:1;padding:38px clamp(16px,3vw,44px) 90px;max-width:1240px;width:100%}
.eyebrow{margin:0 0 4px;font-size:15px;letter-spacing:.2em;color:#2A4467}
h1{font-size:clamp(28px,3.4vw,46px);font-weight:900;margin:0 0 8px;letter-spacing:.02em;color:var(--navy);line-height:1.25}
.lead{color:#34506F;margin:0 0 34px;max-width:640px}
h2{font-size:18px;font-weight:900;margin:0 0 12px;color:var(--navy)}
h3{font-size:15px;font-weight:700;margin:0 0 8px}
.panel{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.95);border-radius:18px;padding:22px;margin-bottom:20px;box-shadow:var(--shadow);position:relative}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.muted{color:var(--muted)} .small{font-size:13px}
label.f{display:block;font-size:13.5px;font-weight:700;margin-bottom:6px;color:var(--navy)}
input[type=text],input[type=url],input[type=date],input[type=number],select,textarea{width:100%;border:1px solid #CBD9E7;border-radius:10px;padding:10px 12px;background:#fff;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(63,169,245,.18);outline:none}
textarea{resize:vertical}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid #BCD0E4;background:#fff;padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:700;font-size:14px;color:var(--navy);transition:transform .1s,box-shadow .15s,background .15s}
.btn:hover{background:#F2F8FE;box-shadow:0 4px 12px rgba(18,58,107,.10)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,#1A4F8A,#0D3264);border-color:#0D3264;color:#fff}
.btn.primary:hover{background:linear-gradient(180deg,#215C9E,#11396F)}
.btn.go{background:linear-gradient(90deg,#0D3264 0%,#1A5C9E 60%,#2A7CC2 100%);border:0;color:#fff;box-shadow:0 10px 24px rgba(18,70,130,.35)}
.btn.go:hover{filter:brightness(1.07)}
.btn.red{background:linear-gradient(180deg,#D24A3F,#B2342B);border-color:#B2342B;color:#fff}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:17px;height:17px;flex:none}
.go-wrap .btn.go svg{width:22px;height:22px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#EEF4FA;border:1px solid var(--line)}
.tag.red{background:var(--red-bg);color:var(--red);border-color:#F2C9C4}
.tag.green{background:var(--green-bg);color:var(--green);border-color:#BFE2D1}
.tag.amber{background:var(--amber-bg);color:var(--amber);border-color:#EED8A8}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700;background:rgba(234,242,249,.8)}
td.n,th.n{text-align:right;font-family:var(--num);font-size:17px}
th.n{font-family:inherit;font-size:12px}
.scroll{overflow-x:auto}

/* ===== 入力（商談をAI分析） ===== */
.upload{padding:28px 28px 22px;overflow:hidden;background:
  radial-gradient(60% 90% at 50% 30%,rgba(120,190,255,.20),transparent 70%),
  linear-gradient(180deg,rgba(255,255,255,.88),rgba(240,247,255,.82))}
.upload.over{box-shadow:0 0 0 3px var(--sky),var(--shadow)}
.up-grid{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:18px;align-items:center}
.up-copy h2{font-size:20px;line-height:1.55;font-weight:700;margin-bottom:10px}
.up-copy p{margin:0;color:#46607E;font-size:13.5px}
.drop{text-align:center}
.cloud{width:128px;height:128px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 45%,#fff 0%,rgba(225,240,255,.9) 55%,rgba(180,220,255,.25) 72%,transparent 74%);
  box-shadow:0 0 0 10px rgba(160,210,255,.15),0 0 40px rgba(63,169,245,.35)}
.cloud svg{width:84px;height:84px;filter:drop-shadow(0 6px 10px rgba(20,90,180,.35))}
.drop .big{font-size:20px;font-weight:900;margin:6px 0 2px;color:var(--navy)}
.feat{list-style:none;margin:0;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.9)}
.feat li{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13.5px;color:#27405F}
.feat svg{width:20px;height:20px;color:var(--blue);flex:none}
.src-tabs{display:flex;gap:10px;margin:18px 0 14px;justify-content:center;flex-wrap:wrap}
.src-tabs button{display:inline-flex;align-items:center;gap:8px;border:1px solid #D2E1EF;background:#fff;border-radius:999px;padding:9px 22px;cursor:pointer;font-size:14px;font-weight:500;color:var(--navy);box-shadow:0 3px 10px rgba(18,58,107,.06)}
.src-tabs button svg{width:18px;height:18px}
.src-tabs button.on{background:linear-gradient(180deg,#1A4F8A,#0D3264);color:#fff;border-color:#0D3264;box-shadow:0 6px 16px rgba(13,50,100,.3)}
.cnt{text-align:right;font-size:12px;color:var(--muted);margin-top:4px}
.wm{position:absolute;right:26px;top:44%;font-weight:900;letter-spacing:.14em;color:rgba(31,111,178,.13);font-size:17px;line-height:1.2;text-align:right;pointer-events:none}
.go-wrap{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:6px}
.go-wrap .btn.go{font-size:19px;padding:17px 60px;border-radius:999px;letter-spacing:.04em}
.go-wrap .note{font-size:12.5px;color:var(--muted)}
.sec-h{display:flex;align-items:center;gap:10px}
.sec-h svg{width:24px;height:24px;color:var(--blue)}

/* ===== スコア・カルテ ===== */
.score-head{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.total{font-family:var(--num);font-size:76px;font-weight:700;line-height:1;color:var(--navy)}
.total small{font-size:22px;color:var(--muted)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:160px 1fr 44px;gap:10px;align-items:center;font-size:13px}
.bar .track,.track{height:12px;background:#E1EAF3;border-radius:6px;overflow:hidden}
.bar .fill{height:100%;border-radius:6px}
.bar .v{font-family:var(--num);font-size:18px;text-align:right}
.bar.low .lbl{color:var(--red);font-weight:700}
.bottleneck{border-left:5px solid var(--red);background:var(--red-bg);padding:12px 16px;border-radius:0 12px 12px 0;margin-top:14px}
.obj{border:1px solid #F0CFCA;border-radius:16px;overflow:hidden;margin-bottom:18px;background:#fff;box-shadow:var(--shadow)}
.obj-q{background:linear-gradient(90deg,#B8322A,#D2503F);color:#fff;padding:15px 20px;font-size:18px;font-weight:900}
.obj-q small{display:block;font-size:12px;font-weight:500;opacity:.85}
.obj-body{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.chain{list-style:none;margin:0;padding:0}
.chain li{position:relative;padding:4px 0 10px 22px;font-size:14px}
.chain li:before{content:'';position:absolute;left:5px;top:12px;width:9px;height:9px;border-radius:50%;background:#B9CBDD}
.chain li:after{content:'';position:absolute;left:9px;top:22px;bottom:-4px;width:1px;background:#B9CBDD}
.chain li:last-child:after{display:none}
.chain li:last-child:before{background:var(--red)}
.chain li:last-child{font-weight:700;color:var(--red)}
.point{background:var(--amber-bg);border-radius:10px;padding:8px 12px;font-size:13px;margin-top:6px}
.fix{border-radius:12px;padding:10px 14px;margin-bottom:10px}
.fix.q{background:#E8F2FC} .fix.t{background:var(--green-bg)} .fix.r{background:#F2F5F8}
.fix b{display:block;font-size:12px;color:var(--muted)}
.ladder{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.rung{flex:1;min-width:100px;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-size:13px;background:#fff}
.rung b{display:block;font-size:15px}
.rung.s0{background:#F3F6F9;color:#8C99A8}
.rung.s1{background:var(--amber-bg);border-color:#EED8A8}
.rung.s2{background:var(--green-bg);border-color:#BFE2D1}
.onepager{border:1px solid var(--line);border-radius:12px;padding:18px;background:#FBFDFF;white-space:pre-wrap;font-size:14px}
.na{display:grid;grid-template-columns:130px 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.na div{padding:10px 14px;border-bottom:1px solid var(--line)}
.na .w{background:var(--navy);color:#fff;font-weight:700;font-size:13px;border-color:#1D3E66}

/* ===== ダッシュボード ===== */
.funnel{display:grid;gap:4px}
.fstep{display:grid;grid-template-columns:130px 1fr;align-items:center;gap:12px}
.fbar{background:linear-gradient(90deg,#0D3264,#2A7CC2);color:#fff;border-radius:8px;padding:7px 12px;font-family:var(--num);font-size:22px;min-width:60px}
.frate{font-size:13px;padding:2px 0 2px 14px;border-left:2px solid var(--line);margin-left:152px}
.frate b{font-family:var(--num);font-size:20px}
.ok{color:var(--green)} .ng{color:var(--red)}
.stat{border:1px solid rgba(255,255,255,.95);border-radius:16px;padding:16px;background:var(--panel);box-shadow:var(--shadow)}
.stat .n{font-family:var(--num);font-size:38px;font-weight:700;line-height:1.1;color:var(--navy)}
.stat .n.ok{color:var(--green)} .stat .n.ng{color:var(--red)}

/* ===== ロープレ ===== */
.chat{height:440px;overflow:auto;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.7);padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:78%;padding:10px 14px;border-radius:14px;font-size:14px;white-space:pre-wrap}
.msg.c{background:#fff;border:1px solid var(--line);align-self:flex-start}
.msg.s{background:linear-gradient(180deg,#1A4F8A,#0D3264);color:#fff;align-self:flex-end}
.msg .who{font-size:11px;opacity:.7;display:block}
.result-card{border:2px solid var(--navy);border-radius:16px;padding:18px;margin-top:14px;background:#fff}

/* ===== 汎用 ===== */
.list-item{border-bottom:1px solid var(--line);padding:12px 6px;cursor:pointer;border-radius:8px}
.list-item:hover{background:#F2F8FE}
.banner{background:var(--amber-bg);border:1px solid #EED8A8;color:#6B4A06;padding:10px 14px;border-radius:12px;margin-bottom:16px;font-size:13px}
.loading{position:fixed;inset:0;background:rgba(8,24,48,.55);display:none;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(3px)}
.loading.on{display:flex}
.loading>div{background:#fff;padding:26px 34px;border-radius:16px;text-align:center;max-width:360px;box-shadow:var(--shadow)}
.spin{width:38px;height:38px;border:4px solid #DCE8F4;border-top-color:var(--sky);border-radius:50%;margin:0 auto 12px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 20px;border-radius:10px;display:none;z-index:60}
.localnote{position:fixed;right:16px;bottom:16px;z-index:40;max-width:340px;background:var(--amber-bg);border:1px solid #EED8A8;color:#6B4A06;padding:8px 12px;border-radius:10px;font-size:12px;box-shadow:var(--shadow)}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
@media (max-width:1080px){ .up-grid{grid-template-columns:1fr 1fr} .feat{grid-column:span 2;display:grid;grid-template-columns:1fr 1fr} .up-copy{order:0} }
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;padding:12px}
  .tagline,.quote,.ec,.kpi-mini,.nav .grp,.me{display:none}
  .brand{margin-bottom:10px}
  .nav{display:flex;overflow-x:auto;gap:4px}
  .nav button{white-space:nowrap;width:auto}
  .hero-art{display:none}
  .frate{margin-left:12px}
  .fstep{grid-template-columns:96px 1fr}
  .grid2,.grid3,.obj-body,.up-grid{grid-template-columns:1fr}
  .feat{grid-column:auto;grid-template-columns:1fr}
  .bar{grid-template-columns:110px 1fr 36px}
  .wm{display:none}
}
@media print{.side,.no-print,.hero-art{display:none!important}.app{display:block}main{padding:0}.panel{box-shadow:none;backdrop-filter:none}}
</style>
</head>

/* 期間（月／四半期。期首12月） */
function periodStart(d,unit){ const x=new Date(d); if(unit==='m') return new Date(x.getFullYear(),x.getMonth(),1); const m=x.getMonth(); const off=((m-11)%3+3)%3; return new Date(x.getFullYear(),m-off,1); }
const addPeriod = (st,unit,n) => new Date(st.getFullYear(), st.getMonth()+(unit==='m'?1:3)*n, 1);
function periodLabel(st,unit){ const y=st.getFullYear(), m=st.getMonth(); if(unit==='m') return `${String(y).slice(2)}/${m+1}`; const q=Math.floor(((m-11+12)%12)/3)+1; return `${q}Q ${String(y).slice(2)}/${m+1}〜`; }
function lastPeriods(unit,n){ const cur=periodStart(new Date(),unit); const a=[]; for(let i=n-1;i>=0;i--){ const st=addPeriod(cur,unit,-i); a.push({ st, en:addPeriod(st,unit,1), label:periodLabel(st,unit) }); } return a; }
/* 顧客単位の到達段階 */
function custs(model,sessions){
  const by={};
  for (const s of sessions){ if(modelIdOf(s)!==model.id) continue; const k=(s.customer||'').trim(); if(!k) continue; const i=stageIdx(model,s); if(i<0) continue; (by[k]=by[k]||{rep:s.rep,hits:[]}).hits.push({ i, t:+new Date(s.created_at) }); }
  return Object.values(by);
}
/* 転換率：from段階に入った時点（期間判定）→ 以降to段階に到達したか */
function conv(cs,fi,ti,range){
  let den=0,num=0;
  for (const c of cs){ const e=c.hits.filter(h=>h.i>=fi).map(h=>h.t); if(!e.length) continue; const et=Math.min(...e); if(range&&(et<range[0]||et>=range[1])) continue; den++; if(c.hits.some(h=>h.i>=ti)) num++; }
  return { num, den, rate:pct(num,den) };
}
function kpiConv(model,sessions,k,range){ return conv(custs(model,sessions), sIdx(model,k.from), sIdx(model,k.to), range); }
function overallConv(model,sessions,range){ return conv(custs(model,sessions), 0, model.stages.length-1, range); }

async function insert(k,row){
  row.id = row.id || crypto.randomUUID();
  row.created_at = row.created_at || new Date().toISOString();
  if (!LOCAL){
    const { data, error } = await sb.from(T[k]).insert(row).select().single();
    if (error) throw error; DATA[k].unshift(data); return data;
  }
  DATA[k].unshift(row); saveLocal(k); return row;
}
async function insertMany(k,rows){
  rows.forEach(r=>{ r.id=r.id||crypto.randomUUID(); r.created_at=r.created_at||new Date().toISOString(); });
  if (!rows.length) return;
  if (!LOCAL){ const { error } = await sb.from(T[k]).insert(rows); if (error) throw error; }
  DATA[k].unshift(...rows); if (LOCAL) saveLocal(k);
}
async function patch(k,id,p){
  if (!LOCAL){ const { error } = await sb.from(T[k]).update(p).eq('id',id); if (error) throw error; }
  const r = DATA[k].find(x=>x.id===id); if (r) Object.assign(r,p); if (LOCAL) saveLocal(k);
}

async function callAI({ prompt, system, messages, max_tokens=6000 }){
  let token = CFG.key;
  try{ const { data } = await sb.auth.getSession(); if (data?.session?.access_token) token = data.session.access_token; }catch(e){}
  const body = { system, max_tokens };
  if (messages) body.messages = messages; else body.prompt = prompt;
  const res = await fetch(CFG.ai, { method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token, 'apikey':CFG.key }, body: JSON.stringify(body) });
  const j = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(j.error || j.message || ('AI呼び出しエラー（'+res.status+'）'));
  if (typeof j === 'string') return j;
  return j.text || (Array.isArray(j.content) ? j.content.map(c=>c.text||'').join('') : '') || j.completion || j.result || '';
}
function parseJSON(t){
  const s = t.replace(/```json|```/g,''); const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a<0||b<0) throw new Error('AIの回答を読み取れませんでした。もう一度実行してください。');
  return JSON.parse(s.slice(a,b+1));
}

function renderSrc(){
  const b=$('#srcBody'); const MAX=60000;
  const ta = (rows,ph) => `<textarea id="srcText" rows="${rows}" placeholder="${ph}">${esc(SRC.text)}</textarea><div class="cnt"><span id="cnt">${SRC.text.length.toLocaleString()}</span> / ${MAX.toLocaleString()} 文字</div>`;
  if (SRC.mode==='paste') b.innerHTML = ta(5,'営業：本日はお時間ありがとうございます…&#10;お客様：太陽光については今のところ控えていて…');
  if (SRC.mode==='file') b.innerHTML = `<input type="file" id="srcFile" accept=".txt,.docx,.pdf,.vtt,.srt,.md" style="width:100%;padding:18px;border:1px dashed #9CC3E6;border-radius:12px;background:#fff"><p class="small muted">${SRC.fileName?('読込済み：'+esc(SRC.fileName)+'（'+SRC.text.length.toLocaleString()+'文字）'):'このエリア全体にドロップしても読み込めます'}</p>`;
  if (SRC.mode==='url') b.innerHTML = `<input type="url" id="srcUrl" placeholder="https://（Zoom・tl;dv・Google Meet 等の録画URL）"><p class="small muted">録画URLはカルテに保存されます。AIは動画を直接視聴できないため、分析には文字起こしも入れてください。</p>${ta(5,'文字起こしを貼り付け')}`;
  const f=$('#srcFile'); if(f) f.onchange=()=>f.files[0]&&readFile(f.files[0]);
  const t=$('#srcText'); if(t) t.oninput=()=>{ SRC.text=t.value; const c=$('#cnt'); c.textContent=t.value.length.toLocaleString(); c.parentElement.style.color = t.value.length>MAX?'var(--red)':''; };
}
function bindStageSelect(prodSel,stageSel,labelSel){
  const fill=()=>{ const m=modelForProduct($(prodSel).value); const def=(m.kpis||[])[0]?.from; $(stageSel).innerHTML=m.stages.map(s=>`<option value="${s.id}" ${s.id===def?'selected':''}>${esc(s.name)}</option>`).join(''); if(labelSel) $(labelSel).textContent='（'+m.name+'）'; };
  $(prodSel).onchange=fill; fill();
}
async function readFile(f){
  try{
    loading(true,'ファイルを読み込んでいます');
    let text='';
    const ext=f.name.split('.').pop().toLowerCase();
    if (ext==='docx'){ const r=await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()}); text=r.value; }
    else if (ext==='pdf'){
      pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
      for(let i=1;i<=pdf.numPages;i++){ const p=await pdf.getPage(i); const c=await p.getTextContent(); text+=c.items.map(x=>x.str).join(' ')+'\n'; }
    } else text = await f.text();
    SRC.text=text.trim(); SRC.fileName=f.name; SRC.mode='paste';
    VIEWS.home(); toast(f.name+' を読み込みました');
  }catch(e){ alert('読み込めませんでした：'+e.message); }
  finally{ loading(false); }
}
async function runAnalysis(){
  const t=$('#srcText'); if(t) SRC.text=t.value;
  const meta = { rep:$('#fRep').value.trim(), customer:$('#fCust').value.trim(), industry:$('#fInd').value, product:$('#fProd').value, stage:$('#fStage').selectedOptions[0]?.textContent||'', _model:modelForProduct($('#fProd').value).id, _stage:$('#fStage').value, result:$('#fRes').value, next_date:$('#fNext').value||null, recording_url:($('#srcUrl')?.value||'').trim()||null };
  if (!SRC.text || SRC.text.length<80) return alert('文字起こしを入れてください（80文字以上）。');
  if (!meta.rep || !meta.customer) return alert('担当営業と顧客名を入れてください。');
  const bankTop = topCats(DATA.o.filter(o=>o.product===meta.product)).slice(0,8).map(c=>c.cat).join('、') || 'まだなし';
  const system = companyFor(meta.product) + `\n出力は指定のJSONのみ。前置き・コードブロック禁止。日本語で具体的に。文字起こしに無い事実は作らず、推測は「可能性」と明記する。`;
  const prompt = `以下の商談を育成カルテとして分析してください。
【商談情報】担当:${meta.rep}／顧客:${meta.customer}（${meta.industry}）／商品:${meta.product}／段階:${meta.stage}／結果:${meta.result}
【同商品で過去に多い断り文句】${bankTop}

【分析ルール】
1. 10項目を各100点で採点：${SCORE_ITEMS.join('、')}。総合点は加重せず平均。
2. 総合点より「どこで転換率を落としたか」を bottleneck に書く。
3. 顧客の断り文句・保留発言・懸念をすべて抽出。各断り文句は「断られてから返す」ではなく「断られる前に潰す」視点で、発生の原因地点（商談の何分頃／どの場面の何が不足したか）まで遡る。cause_chain は原因→…→断り文句 の順に3〜5段。
4. category は次から1つ：${OBJ_CATS.join('、')}
5. 意思決定者到達度を ${DM_LEVELS.join('／')} で判定（status: 0=未接触 1=間接的に話題に出た 2=接触・同席）。
6. 社長が聞きたくなる「経営情報」と、担当者が社長に転送できる「社長向け1枚」（400〜600字、営業臭さを消し、数字比較と判断材料中心。未確定の数字は【要確認】と書く）を作る。
7. NEXT ACTION は 24時間以内／3日以内／7日以内／次回商談／ロープレ の5区分で、誰が・何を・いつまでに。
8. roleplay は、この商談で一番痛かった断り文句でお客様役が言う最初の一言と、追撃しそうな質問。

【JSON形式】
{"summary":"3行要約","total_score":0,
"scores":[{"item":"事前準備","score":0,"comment":"根拠となる発言や場面"}],
"bottleneck":{"item":"","reason":"","impact":"転換率への影響"},
"good_points":["再現すべき良かった点"],
"objections":[{"quote":"顧客の実際の発言","category":"","timing":"商談○分頃／場面","surface":"表面的理由","background":"背景","sales_issue":"営業側の問題","cause_chain":["原因","…","断り文句"],"cause_point":"原因地点の説明","prevention_question":"本来事前に聞く質問","prevention_talk":"反論される前の予防トーク","rebuttal":"言われた後の切り返し","severity":"高|中|低"}],
"decision_maker":{"levels":[{"role":"担当者","status":0,"note":""}],"analysis":"","ceo_interest":["社長が聞きたくなる経営情報"],"onepager_title":"","onepager":"社長向け1枚の本文"},
"next_actions":[{"when":"24時間以内","who":"","what":"","done":"完了条件"}],
"roleplay":{"opening":"お客様の最初の一言","followups":["追撃質問"],"category":""},
"training_theme":"今週の重点練習テーマ（1行）"}

【文字起こし】
${SRC.text.slice(0,60000)}`;
  try{
    loading(true,'AIが商談を分析しています');
    const a = parseJSON(await callAI({ system, prompt, max_tokens:8000 }));
    a._kpi = { model_id:meta._model, stage_id:meta._stage }; const { _model, _stage, ...row } = meta;
    const sess = await insert('s', { ...row, rep_email:ME.email, transcript:SRC.text, total_score:Math.round(a.total_score||0), analysis:a });
    const objs = (a.objections||[]).map(o=>({ session_id:sess.id, rep:meta.rep, customer:meta.customer, product:meta.product, result:meta.result, category:OBJ_CATS.includes(o.category)?o.category:'その他', quote:o.quote, detail:o }));
    await insertMany('o', objs);
    SRC = { mode:'paste', text:'', fileName:'' };
    go('karte', sess.id);
  }catch(e){ alert('分析できませんでした：'+e.message); }
  finally{ loading(false); }
}

    <div class="obj-body">
      <div>
        <h3>なぜ言われたか</h3>
        <p class="small" style="margin:0 0 8px"><b>表面的理由</b>：${esc(o.surface)}<br><b>背景</b>：${esc(o.background)}<br><b>営業側の問題</b>：${esc(o.sales_issue)}</p>
        <ul class="chain">${(o.cause_chain||[]).map(c=>`<li>${esc(c)}</li>`).join('')}</ul>
        ${o.cause_point?`<div class="point"><b>原因地点</b>　${esc(o.cause_point)}</div>`:''}
      </div>
      <div>
        <div class="fix q"><b>その前に聞くべきだった質問</b>${esc(o.prevention_question)}</div>

        <div class="fix r"><b>言われた後の切り返し</b>${esc(o.rebuttal)}</div>
      </div>
    </div></div>`;
}
function chatworkNA(s){
  const a=s.analysis||{};
  const lines=[`[info][title]商談NEXT ACTION｜${s.customer}（担当：${s.rep}）[/title]`];
  lines.push(`■商談結果\n${s.stage}／${s.result}　スコア【${s.total_score}点】`);
  if(a.bottleneck) lines.push(`■転換率を落とした地点\n【${a.bottleneck.item}】${a.bottleneck.reason}`);
  lines.push('[hr]');
  (a.next_actions||[]).forEach(n=>lines.push(`■${n.when}\n・${n.what}（担当：${n.who}）${n.done?'\n　完了条件：'+n.done:''}`));
  if(a.training_theme) lines.push(`[hr]■今週の重点練習\n【${a.training_theme}】`);
  lines.push('[/info]');
  return lines.join('\n');
}

function topCats(objs){
  const m={}; objs.forEach(o=>{ const c=o.category||'その他'; (m[c]=m[c]||[]).push(o); });

    const sessIds=[...new Set(list.map(o=>o.session_id))];
    const lost=sessIds.filter(id=>(DATA.s.find(s=>s.id===id)||{}).result==='失注').length;
    return { cat, list, count:list.length, lossRate:pct(lost,sessIds.length) };
  }).sort((a,b)=>b.count-a.count);
}

function trendSVG(series,labels,height=220){
  const W=680,H=height,L=40,R=12,Tp=14,B=30, n=labels.length; const x=i=>L+(n<=1?0:(W-L-R)*i/(n-1)); const y=v=>Tp+(H-Tp-B)*(1-v/100);
  let g=''; [0,25,50,75,100].forEach(v=>g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#E3E8E5"/><text x="${L-6}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="#5E6B75">${v}%</text>`);
  labels.forEach((l,i)=>g+=`<text x="${x(i)}" y="${H-8}" font-size="11" text-anchor="middle" fill="#5E6B75">${esc(l)}</text>`);
  series.forEach(s=>{
    if(s.target!=null) g+=`<line x1="${L}" x2="${W-R}" y1="${y(s.target)}" y2="${y(s.target)}" stroke="${s.color}" stroke-dasharray="5 4" opacity=".55"/>`;
    let d=''; s.values.forEach((v,i)=>{ if(v==null) return; d+=(d?'L':'M')+x(i)+' '+y(v); });
    if(d) g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5"/>`;
    s.values.forEach((v,i)=>{ if(v!=null) g+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${s.color}"><title>${esc(s.name)} ${esc(labels[i])}：${v}%</title></circle>`; });
  });
  return `<div class="scroll"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:520px;height:auto" role="img" aria-label="転換率の推移">${g}</svg></div>
  <div class="row small" style="gap:14px">${series.map(s=>`<span><span style="display:inline-block;width:14px;height:3px;background:${s.color};vertical-align:middle"></span> ${esc(s.name)}${s.target!=null?`（目標${s.target}%は点線）`:''}</span>`).join('')}</div>`;
}

    return `<div class="panel"><h2>商品 → ビジネスモデル</h2><p class="small muted">商談分析のとき、選んだ商品に応じてこのモデルの商談段階が選択肢に出ます。</p>
    <table><tr><th>商品</th><th>使うビジネスモデル</th><th></th></tr>
    ${CE.products.map((p,i)=>`<tr><td>${esc(p)}</td><td><select data-pm="${i}">${CE.models.map(m=>`<option value="${m.id}" ${(CE.productMap[p]||'std')===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></td><td><button class="btn sm" data-act="pDel" data-i="${i}">削除</button></td></tr>`).join('')}</table>
    <div class="row" style="margin-top:10px"><input type="text" id="newProd" placeholder="商品を追加（例：法人向けPPA）" style="max-width:300px"><button class="btn sm" data-act="pAdd">追加</button></div></div>`;
  }
  if (KT.tab==='team'){
    const known = [...new Set([...DATA.s.map(s=>s.rep), ...CE.teams.flatMap(t=>t.members)].filter(Boolean))];
    return `<div class="panel"><h2>チーム</h2><p class="small muted">メンバーは担当営業名（商談分析で入力した名前）と同じ表記にしてください。1人が複数チームに入っても構いません。</p>
    ${CE.teams.map((t,i)=>`<div style="border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px">
      <div class="row" style="flex-wrap:nowrap"><input type="text" data-tn="${i}" value="${esc(t.name)}" placeholder="チーム名"><button class="btn sm" data-act="tDel" data-i="${i}">削除</button></div>
      <div class="row small" style="margin-top:8px">${known.map(r=>`<label style="border:1px solid var(--line);border-radius:14px;padding:2px 10px"><input type="checkbox" data-tm="${i}" value="${esc(r)}" ${t.members.includes(r)?'checked':''}> ${esc(r)}</label>`).join('')||'<span class="muted">商談を分析すると担当者がここに並びます</span>'}</div>
      <div class="row" style="margin-top:8px"><input type="text" data-tadd="${i}" placeholder="メンバー名を直接追加" style="max-width:240px"><button class="btn sm" data-act="tmAdd" data-i="${i}">追加</button></div></div>`).join('')}
    <button class="btn sm" data-act="tAdd">＋ チームを追加</button></div>`;
  }
  // personal
  const people = [...new Set([...DATA.s.map(s=>s.rep), ...CE.teams.flatMap(t=>t.members), ...Object.keys(CE.personal)].filter(Boolean))];
  if (!KT.rep || !people.includes(KT.rep)) KT.rep = people[0]||'';
  return `<div class="panel"><h2>個人目標</h2><p class="small muted">空欄はモデル目標を使います。本人の実力・育成段階に合わせて上書きしてください。</p>
  <div class="row" style="margin-bottom:12px"><select id="pRep" style="width:auto">${people.map(p=>`<option ${p===KT.rep?'selected':''}>${esc(p)}</option>`).join('')}</select>
  <input type="text" id="newRep" placeholder="担当者を追加" style="max-width:200px"><button class="btn sm" data-act="rAdd">追加</button></div>
  ${KT.rep?CE.models.filter(m=>(m.kpis||[]).length).map(m=>`<h3 style="margin-top:14px">${esc(m.name)}</h3><table><tr><th>KPI</th><th class="n">モデル目標</th><th class="n">${esc(KT.rep)}さんの目標</th></tr>
    ${m.kpis.map(k=>`<tr><td>${k.key?'★':''}${esc(k.name)}</td><td class="n">${k.target??'-'}%</td><td class="n"><input type="number" min="0" max="100" data-pt="${m.id}|${k.id}" value="${CE.personal?.[KT.rep]?.[m.id]?.[k.id]??''}" placeholder="${k.target??''}" style="width:80px;border:1px solid var(--line);border-radius:6px;padding:5px"> %</td></tr>`).join('')}</table>`).join('') || '<p class="muted">KPIが設定されたモデルがありません。</p>' : '<p class="muted">担当者がいません。</p>'}</div>`;
}
function kpiRerender(){ const y=window.scrollY; VIEWS.kpi(); window.scrollTo(0,y); }
function kpiInput(e){
  const t=e.target, m=CE.models.find(x=>x.id===KT.mid); if(!t.dataset) return;
  if (t.dataset.f==='mname') m.name=t.value;
  else if (t.dataset.st!=null) m.stages[+t.dataset.st].name=t.value;
  else if (t.dataset.k!=null){ const k=m.kpis[+t.dataset.k], f=t.dataset.kf; if(f==='key') k.key=t.checked; else if(f==='target') k.target=t.value===''?null:+t.value; else k[f]=t.value; if(e.type==='change'&&(f==='from'||f==='to'||f==='key')) return kpiRerender(); }
  else if (t.dataset.pm!=null) CE.productMap[CE.products[+t.dataset.pm]]=t.value;
  else if (t.dataset.tn!=null) CE.teams[+t.dataset.tn].name=t.value;
  else if (t.dataset.tm!=null && e.type==='change'){ const tm=CE.teams[+t.dataset.tm]; tm.members = t.checked ? [...new Set([...tm.members,t.value])] : tm.members.filter(x=>x!==t.value); }
  else if (t.dataset.pt!=null){ const [mid,kid]=t.dataset.pt.split('|'); const p=((CE.personal[KT.rep]??={})[mid]??={}); if(t.value==='') delete p[kid]; else p[kid]=+t.value; }
  else if (t.id==='pRep' && e.type==='change'){ KT.rep=t.value; return kpiRerender(); }
  else return;
  if (e.type==='change') kpiRerender();
}
async function kpiClick(e){
  const b=e.target.closest('button'); if(!b||b.disabled) return;
  const m=CE.models.find(x=>x.id===KT.mid), i=+b.dataset.i;
  if (b.dataset.tab){ KT.tab=b.dataset.tab; return kpiRerender(); }
  if (b.dataset.mid){ KT.mid=b.dataset.mid; return kpiRerender(); }
  const a=b.dataset.act; if(!a) return;
  if (a==='save') return kpiSave();
  if (a==='discard'){ if(confirm('保存していない変更を破棄しますか？')){ CE=clone(CONF); kpiRerender(); } return; }
  if (a==='addModel'){ const n={ id:'m'+uid(), name:'新しいビジネスモデル', stages:mkStages(['商談化','提案','合意','受注']).map(s=>({...s,id:'s'+uid()})), kpis:[] }; CE.models.push(n); KT.mid=n.id; }
  if (a==='dupModel'){ const n=clone(m); n.id='m'+uid(); n.name=m.name+'（コピー）'; CE.models.push(n); KT.mid=n.id; }
  if (a==='delModel'){ const n=DATA.s.filter(s=>modelIdOf(s)===m.id).length; if(!confirm(`「${m.name}」を削除しますか？${n?`\n※このモデルで記録された商談${n}件は集計から外れます。`:''}`)) return; CE.models=CE.models.filter(x=>x.id!==m.id); Object.keys(CE.productMap).forEach(p=>{ if(CE.productMap[p]===m.id) delete CE.productMap[p]; }); Object.values(CE.personal).forEach(p=>delete p[m.id]); KT.mid=CE.models[0].id; }
  if (a==='stAdd') m.stages.push({ id:'s'+uid(), name:'新しい段階' });
  if (a==='stUp'||a==='stDown'){ const j=a==='stUp'?i-1:i+1; [m.stages[i],m.stages[j]]=[m.stages[j],m.stages[i]]; }
  if (a==='stDel'){ const st=m.stages[i]; const ks=(m.kpis||[]).filter(k=>k.from===st.id||k.to===st.id); if(!confirm(`段階「${st.name}」を削除しますか？${ks.length?`\n使っているKPI（${ks.map(k=>k.name).join('、')}）も削除されます。`:''}`)) return; m.stages.splice(i,1); m.kpis=(m.kpis||[]).filter(k=>!ks.includes(k)); }
  if (a==='kAdd'){ (m.kpis||=[]).push({ id:'k'+uid(), name:`${m.stages[0].name}→${m.stages[1].name}`, from:m.stages[0].id, to:m.stages[1].id, target:null, key:false }); }
  if (a==='kDel'){ if(!confirm(`KPI「${m.kpis[i].name}」を削除しますか？`)) return; const kid=m.kpis[i].id; m.kpis.splice(i,1); Object.values(CE.personal).forEach(p=>{ if(p[m.id]) delete p[m.id][kid]; }); }
  if (a==='pAdd'){ const v=$('#newProd').value.trim(); if(!v) return; if(CE.products.includes(v)) return alert('同じ商品があります'); CE.products.push(v); }
  if (a==='pDel'){ const p=CE.products[i]; if(!confirm(`商品「${p}」を選択肢から外しますか？（過去の商談データは残ります）`)) return; CE.products.splice(i,1); delete CE.productMap[p]; }
  if (a==='tAdd') CE.teams.push({ id:'t'+uid(), name:'新しいチーム', members:[] });
  if (a==='tDel'){ if(!confirm(`チーム「${CE.teams[i].name}」を削除しますか？`)) return; CE.teams.splice(i,1); }
  if (a==='tmAdd'){ const inp=document.querySelector(`[data-tadd="${i}"]`); const v=inp.value.trim(); if(v) CE.teams[i].members=[...new Set([...CE.teams[i].members,v])]; }
  if (a==='rAdd'){ const v=$('#newRep').value.trim(); if(!v) return; CE.personal[v] ??= {}; KT.rep=v; }
  kpiRerender();
}
async function kpiSave(){
  const errs=[];
  CE.models.forEach(m=>{
    if(!m.name.trim()) errs.push('名前のないビジネスモデルがあります');
    if(m.stages.length<2) errs.push(`${m.name}：段階は2つ以上必要です`);
    const names=m.stages.map(s=>s.name.trim()); if(names.some(n=>!n)) errs.push(`${m.name}：空欄の段階名があります`); if(new Set(names).size!==names.length) errs.push(`${m.name}：段階名が重複しています`);
    (m.kpis||[]).forEach(k=>{ if(!k.name.trim()) errs.push(`${m.name}：名前のないKPIがあります`); if(sIdx(m,k.to)<=sIdx(m,k.from)) errs.push(`${m.name}「${k.name}」：到達段階が開始段階より前です`); if(k.target!=null&&(k.target<0||k.target>100)) errs.push(`${m.name}「${k.name}」：目標は0〜100%`); });
  });
  Object.values(CE.personal).forEach(p=>Object.values(p).forEach(x=>Object.values(x).forEach(v=>{ if(v<0||v>100) errs.push('個人目標は0〜100%で入力してください'); })));
  if (errs.length) return alert('保存できません：\n・'+[...new Set(errs)].join('\n・'));
  if (!confirm('この設定を保存して全社に反映しますか？')) return;
  try{ await saveConf(clone(CE)); CE=clone(CONF); toast('KPI設定を保存しました'); kpiRerender(); }
  catch(e){ alert('保存できませんでした：'+e.message+'\n（sales-coach-kpi-settings.sql を実行済みか、管理者権限かを確認してください）'); }
}

async function ceoReport(){
  const st=VIEWS.ceo.stats; if(!st.S.length) return alert('今週分析した商談がまだありません。');
  const repLines=[...new Set(st.S.map(s=>s.rep))].map(r=>{ const rs=st.S.filter(s=>s.rep===r); return `${r}：${rs.length}件、平均${Math.round(rs.reduce((t,s)=>t+(s.total_score||0),0)/rs.length)}点、弱点${weakest(avgScores(rs))||'-'}、結果${rs.map(s=>s.result).join('/')}`; }).join('\n');
  const prompt=`社長向けの今週の営業AIレポートを、Chatworkに貼る文章で作ってください。
書式：HTMLタグ禁止。強調は【】、見出しは■、区切りは[hr]。先頭行だけ [info][title]今週の営業AIレポート[/title] とし、末尾を [/info] で閉じる。[title]は1回だけ。
構成：■総括（3行）■数字 ■頻出断り文句と原因地点 ■最も失注につながった断り文句と全社の予防策 ■担当者別の一言（事実→不足→次週の行動） ■来週全員でやるロープレ（テーマ・回数・完了条件）。識学ベースで感情評価は入れない。
【データ】商談${st.S.length}件
頻出断り文句：${st.cats.slice(0,5).map(c=>`${c.cat}(${c.count})`).join('、')}
失注につながった断り文句：${st.lostCats.slice(0,3).map(c=>`${c.cat}(${c.count})`).join('、')||'なし'}
代表的な原因地点：${st.cats.slice(0,3).map(c=>c.list[0].detail?.cause_point).filter(Boolean).join('／')}
担当者別：\n${repLines}
全社共通の弱点：${st.weak}／提案テーマ：${st.theme}
ロープレ：${st.rpWeek.length}回中${st.rpWeek.filter(r=>r.passed).length}回合格`;
  try{
    loading(true,'今週の講評を書いています');
    const t=await callAI({system:companyFor(),prompt,max_tokens:2500});
    $('#ceoText').style.display='block'; $('#ceoText').textContent=t.trim();
    $('#ceoCp').style.display=''; $('#ceoCp').onclick=()=>copy(t.trim());
  }catch(e){ alert('作成できませんでした：'+e.message); }
  finally{ loading(false); }
}

/* ============ 起動 ============ */
(async function boot(){
  try{ if (window.EC?.guard) await EC.guard({ allow:['admin','manager','sales'] }); }catch(e){ console.warn(e); }
  try{ sb = supabase.createClient(CFG.url, CFG.key); }catch(e){ console.warn(e); }
  try{ const m = window.EC?.me ? await EC.me() : null; if (m){ ME.name=m.full_name||m.name||m.user?.full_name||''; ME.email=m.email||m.user?.email||''; ME.role=m.role||m.user?.role||m.profile?.role||''; } }catch(e){}
  await resolveMe();
  try{ if (window.EC?.mountBadge) EC.mountBadge(document.getElementById('badge')); }catch(e){}
  renderMe();
  await loadAll();
  await loadConf();
  go('home');
})();
/* ログイン中の社員の氏名・権限を app_users から確定する（EC.me() が role を返さない場合の保険） */
async function resolveMe(){
  try{
    if (!ME.email){ const { data } = await sb.auth.getSession(); ME.email = data?.session?.user?.email || ''; }
    if (!ME.email) return;
    const { data, error } = await sb.from('app_users').select('full_name,role,is_active').eq('email', ME.email).maybeSingle();
    if (error) throw error;
    if (data){ if (data.is_active!==false && data.role) ME.role = data.role; if (!ME.name) ME.name = data.full_name || ''; }
  }catch(e){ console.warn('権限の取得に失敗', e); }
}
