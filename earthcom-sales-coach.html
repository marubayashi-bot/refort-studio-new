<style>
:root{
  --navy:#0B2545; --navy2:#123A6B; --blue:#1F6FB2; --sky:#3FA9F5; --teal:#4FD8D0;
  --ink:#0E2240; --paper:#EAF2F9; --panel:rgba(255,255,255,.82); --line:#D5E2EE;
  --muted:#5C6F84; --green:#15805A; --green-bg:#E2F4EC; --red:#C23A30; --red-bg:#FCEBE9;
  --amber:#B97E0E; --amber-bg:#FCF2DD;
  --num:'Barlow Condensed','Zen Kaku Gothic New',sans-serif;
  --shadow:0 12px 32px rgba(18,58,107,.10), 0 2px 6px rgba(18,58,107,.06);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;color:var(--ink);font-size:15px;line-height:1.7;
  background:linear-gradient(180deg,#EDF4FB 0%,#E7F0F8 45%,#E4F1F2 100%);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100%}

/* ===== サイドバー ===== */
.side{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 16px 16px;color:#DCE8F5;display:flex;flex-direction:column;
  background:radial-gradient(120% 60% at 0% 0%,#1B4A80 0%,transparent 60%),linear-gradient(180deg,#0D2A4F 0%,#0A1F3C 55%,#081830 100%)}
.brand{display:flex;align-items:center;gap:12px;padding:0 4px}
.brand img{width:48px;height:46px;border-radius:12px;object-fit:cover;box-shadow:0 0 0 1px rgba(120,190,255,.35),0 0 18px rgba(63,169,245,.35)}
.brand b{display:block;white-space:nowrap;font-weight:900;font-size:17px;letter-spacing:.03em;color:#fff;line-height:1.2}
.brand small{font-size:11px;letter-spacing:.14em;color:#8FB3D9}
.tagline{margin:14px 6px 16px;padding-bottom:16px;border-bottom:1px solid rgba(143,179,217,.22);font-size:15px;letter-spacing:.12em;line-height:1.7;color:#E6EEF8}
.nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;color:#CFDDEE;padding:11px 14px;border-radius:12px;cursor:pointer;font-size:14.5px;margin-bottom:2px;transition:background .15s,color .15s}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:linear-gradient(180deg,#FFFFFF 0%,#E4F0FC 100%);color:var(--navy);font-weight:700;box-shadow:0 6px 18px rgba(63,169,245,.35),0 0 0 1px rgba(255,255,255,.6)}
.nav button.on svg{color:var(--navy)}
.nav svg{width:20px;height:20px;flex:none;color:#AFC6E0}
.nav .grp{font-size:11px;letter-spacing:.1em;color:#6F8FB3;margin:14px 14px 4px}
.kpi-mini{margin:18px 0 0;padding:14px;border:1px solid rgba(143,179,217,.3);border-radius:14px;background:rgba(255,255,255,.04)}
.kpi-mini .hd{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13.5px;color:#fff;margin-bottom:8px}
.kpi-mini .it{margin-top:8px}
.kpi-mini .lb{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px}
.kpi-mini strong{font-family:var(--num);font-size:24px;color:#fff;font-weight:700}
.kpi-mini .tr{position:relative;height:7px;border-radius:4px;background:rgba(255,255,255,.12);margin-top:3px}
.kpi-mini .tr i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:linear-gradient(90deg,#39C6D8,#6FF0D8)}
.kpi-mini .tr b{position:absolute;top:-3px;width:2px;height:13px;background:#fff;opacity:.8}
.kpi-mini .sub{font-size:11px;color:#8FB3D9}
.quote{margin:20px 10px 6px;font-size:14px;letter-spacing:.1em;line-height:1.8;color:#C9D8EA}
.ec{display:flex;align-items:center;gap:8px;margin:10px 10px 14px;font-weight:700;letter-spacing:.14em;color:#6FD2E0;font-size:14px}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 6px 0;border-top:1px solid rgba(143,179,217,.22)}
.me .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:var(--navy);background:linear-gradient(135deg,#E6F3FF,#9FD0F7)}
.me b{display:block;color:#fff;font-size:14px;line-height:1.3}
.me small{color:#8FB3D9;font-size:12px}
.me button{margin-left:auto;border:0;background:none;color:#AFC6E0;cursor:pointer;padding:6px;border-radius:8px}
.me button:hover{background:rgba(255,255,255,.08);color:#fff}
#badge{font-size:12px;margin-top:6px}

/* ===== メイン・ヒーロー ===== */
.stage{position:relative;min-width:0;overflow:hidden}
.hero-art{position:absolute;top:0;right:0;width:min(56%,720px);height:215px;pointer-events:none;z-index:0;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 22%);mask-image:linear-gradient(90deg,transparent 0%,#000 22%)}
.hero-art svg{width:100%;height:100%;display:block}
main{position:relative;z-index:1;padding:38px clamp(16px,3vw,44px) 90px;max-width:1240px;width:100%}
.eyebrow{margin:0 0 4px;font-size:15px;letter-spacing:.2em;color:#2A4467}
h1{font-size:clamp(28px,3.4vw,46px);font-weight:900;margin:0 0 8px;letter-spacing:.02em;color:var(--navy);line-height:1.25}
.lead{color:#34506F;margin:0 0 34px;max-width:640px}
h2{font-size:18px;font-weight:900;margin:0 0 12px;color:var(--navy)}
h3{font-size:15px;font-weight:700;margin:0 0 8px}
.panel{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.95);border-radius:18px;padding:22px;margin-bottom:20px;box-shadow:var(--shadow);position:relative}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.muted{color:var(--muted)} .small{font-size:13px}
label.f{display:block;font-size:13.5px;font-weight:700;margin-bottom:6px;color:var(--navy)}
input[type=text],input[type=url],input[type=date],input[type=number],select,textarea{width:100%;border:1px solid #CBD9E7;border-radius:10px;padding:10px 12px;background:#fff;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(63,169,245,.18);outline:none}
textarea{resize:vertical}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid #BCD0E4;background:#fff;padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:700;font-size:14px;color:var(--navy);transition:transform .1s,box-shadow .15s,background .15s}
.btn:hover{background:#F2F8FE;box-shadow:0 4px 12px rgba(18,58,107,.10)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,#1A4F8A,#0D3264);border-color:#0D3264;color:#fff}
.btn.primary:hover{background:linear-gradient(180deg,#215C9E,#11396F)}
.btn.go{background:linear-gradient(90deg,#0D3264 0%,#1A5C9E 60%,#2A7CC2 100%);border:0;color:#fff;box-shadow:0 10px 24px rgba(18,70,130,.35)}
.btn.go:hover{filter:brightness(1.07)}
.btn.red{background:linear-gradient(180deg,#D24A3F,#B2342B);border-color:#B2342B;color:#fff}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:17px;height:17px;flex:none}
.go-wrap .btn.go svg{width:22px;height:22px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#EEF4FA;border:1px solid var(--line)}
.tag.red{background:var(--red-bg);color:var(--red);border-color:#F2C9C4}
.tag.green{background:var(--green-bg);color:var(--green);border-color:#BFE2D1}
.tag.amber{background:var(--amber-bg);color:var(--amber);border-color:#EED8A8}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700;background:rgba(234,242,249,.8)}
td.n,th.n{text-align:right;font-family:var(--num);font-size:17px}
th.n{font-family:inherit;font-size:12px}
.scroll{overflow-x:auto}

/* ===== 入力（商談をAI分析） ===== */
.upload{padding:28px 28px 22px;overflow:hidden;background:
  radial-gradient(60% 90% at 50% 30%,rgba(120,190,255,.20),transparent 70%),
  linear-gradient(180deg,rgba(255,255,255,.88),rgba(240,247,255,.82))}
.upload.over{box-shadow:0 0 0 3px var(--sky),var(--shadow)}
.up-grid{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:18px;align-items:center}
.up-copy h2{font-size:20px;line-height:1.55;font-weight:700;margin-bottom:10px}
.up-copy p{margin:0;color:#46607E;font-size:13.5px}
.drop{text-align:center}
.cloud{width:128px;height:128px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 45%,#fff 0%,rgba(225,240,255,.9) 55%,rgba(180,220,255,.25) 72%,transparent 74%);
  box-shadow:0 0 0 10px rgba(160,210,255,.15),0 0 40px rgba(63,169,245,.35)}
.cloud svg{width:84px;height:84px;filter:drop-shadow(0 6px 10px rgba(20,90,180,.35))}
.drop .big{font-size:20px;font-weight:900;margin:6px 0 2px;color:var(--navy)}
.feat{list-style:none;margin:0;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.9)}
.feat li{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13.5px;color:#27405F}
.feat svg{width:20px;height:20px;color:var(--blue);flex:none}
.src-tabs{display:flex;gap:10px;margin:18px 0 14px;justify-content:center;flex-wrap:wrap}
.src-tabs button{display:inline-flex;align-items:center;gap:8px;border:1px solid #D2E1EF;background:#fff;border-radius:999px;padding:9px 22px;cursor:pointer;font-size:14px;font-weight:500;color:var(--navy);box-shadow:0 3px 10px rgba(18,58,107,.06)}
.src-tabs button svg{width:18px;height:18px}
.src-tabs button.on{background:linear-gradient(180deg,#1A4F8A,#0D3264);color:#fff;border-color:#0D3264;box-shadow:0 6px 16px rgba(13,50,100,.3)}
.cnt{text-align:right;font-size:12px;color:var(--muted);margin-top:4px}
.wm{position:absolute;right:26px;top:44%;font-weight:900;letter-spacing:.14em;color:rgba(31,111,178,.13);font-size:17px;line-height:1.2;text-align:right;pointer-events:none}
.go-wrap{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:6px}
.go-wrap .btn.go{font-size:19px;padding:17px 60px;border-radius:999px;letter-spacing:.04em}
.go-wrap .note{font-size:12.5px;color:var(--muted)}
.sec-h{display:flex;align-items:center;gap:10px}
.sec-h svg{width:24px;height:24px;color:var(--blue)}

/* ===== スコア・カルテ ===== */
.score-head{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.total{font-family:var(--num);font-size:76px;font-weight:700;line-height:1;color:var(--navy)}
.total small{font-size:22px;color:var(--muted)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:160px 1fr 44px;gap:10px;align-items:center;font-size:13px}
.bar .track,.track{height:12px;background:#E1EAF3;border-radius:6px;overflow:hidden}
.bar .fill{height:100%;border-radius:6px}
.bar .v{font-family:var(--num);font-size:18px;text-align:right}
.bar.low .lbl{color:var(--red);font-weight:700}
.bottleneck{border-left:5px solid var(--red);background:var(--red-bg);padding:12px 16px;border-radius:0 12px 12px 0;margin-top:14px}
.obj{border:1px solid #F0CFCA;border-radius:16px;overflow:hidden;margin-bottom:18px;background:#fff;box-shadow:var(--shadow)}
.obj-q{background:linear-gradient(90deg,#B8322A,#D2503F);color:#fff;padding:15px 20px;font-size:18px;font-weight:900}
.obj-q small{display:block;font-size:12px;font-weight:500;opacity:.85}
.obj-body{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.chain{list-style:none;margin:0;padding:0}
.chain li{position:relative;padding:4px 0 10px 22px;font-size:14px}
.chain li:before{content:'';position:absolute;left:5px;top:12px;width:9px;height:9px;border-radius:50%;background:#B9CBDD}
.chain li:after{content:'';position:absolute;left:9px;top:22px;bottom:-4px;width:1px;background:#B9CBDD}
.chain li:last-child:after{display:none}
.chain li:last-child:before{background:var(--red)}
.chain li:last-child{font-weight:700;color:var(--red)}
.point{background:var(--amber-bg);border-radius:10px;padding:8px 12px;font-size:13px;margin-top:6px}
.fix{border-radius:12px;padding:10px 14px;margin-bottom:10px}
.fix.q{background:#E8F2FC} .fix.t{background:var(--green-bg)} .fix.r{background:#F2F5F8}
.fix b{display:block;font-size:12px;color:var(--muted)}
.ladder{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.rung{flex:1;min-width:100px;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-size:13px;background:#fff}
.rung b{display:block;font-size:15px}
.rung.s0{background:#F3F6F9;color:#8C99A8}
.rung.s1{background:var(--amber-bg);border-color:#EED8A8}
.rung.s2{background:var(--green-bg);border-color:#BFE2D1}
.onepager{border:1px solid var(--line);border-radius:12px;padding:18px;background:#FBFDFF;white-space:pre-wrap;font-size:14px}
.na{display:grid;grid-template-columns:130px 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.na div{padding:10px 14px;border-bottom:1px solid var(--line)}
.na .w{background:var(--navy);color:#fff;font-weight:700;font-size:13px;border-color:#1D3E66}

/* ===== ダッシュボード ===== */
.funnel{display:grid;gap:4px}
.fstep{display:grid;grid-template-columns:130px 1fr;align-items:center;gap:12px}
.fbar{background:linear-gradient(90deg,#0D3264,#2A7CC2);color:#fff;border-radius:8px;padding:7px 12px;font-family:var(--num);font-size:22px;min-width:60px}
.frate{font-size:13px;padding:2px 0 2px 14px;border-left:2px solid var(--line);margin-left:152px}
.frate b{font-family:var(--num);font-size:20px}
.ok{color:var(--green)} .ng{color:var(--red)}
.stat{border:1px solid rgba(255,255,255,.95);border-radius:16px;padding:16px;background:var(--panel);box-shadow:var(--shadow)}
.stat .n{font-family:var(--num);font-size:38px;font-weight:700;line-height:1.1;color:var(--navy)}
.stat .n.ok{color:var(--green)} .stat .n.ng{color:var(--red)}

/* ===== ロープレ ===== */
.chat{height:440px;overflow:auto;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.7);padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:78%;padding:10px 14px;border-radius:14px;font-size:14px;white-space:pre-wrap}
.msg.c{background:#fff;border:1px solid var(--line);align-self:flex-start}
.msg.s{background:linear-gradient(180deg,#1A4F8A,#0D3264);color:#fff;align-self:flex-end}
.msg .who{font-size:11px;opacity:.7;display:block}
.result-card{border:2px solid var(--navy);border-radius:16px;padding:18px;margin-top:14px;background:#fff}

/* ===== 汎用 ===== */
.list-item{border-bottom:1px solid var(--line);padding:12px 6px;cursor:pointer;border-radius:8px}
.list-item:hover{background:#F2F8FE}
.banner{background:var(--amber-bg);border:1px solid #EED8A8;color:#6B4A06;padding:10px 14px;border-radius:12px;margin-bottom:16px;font-size:13px}
.loading{position:fixed;inset:0;background:rgba(8,24,48,.55);display:none;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(3px)}
.loading.on{display:flex}
.loading>div{}
.spin{width:38px;height:38px;border:4px solid #DCE8F4;border-top-color:var(--sky);border-radius:50%;margin:0 auto 12px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 20px;border-radius:10px;display:none;z-index:60}
.localnote{position:fixed;right:16px;bottom:78px;z-index:40;max-width:340px;background:var(--amber-bg);border:1px solid #EED8A8;color:#6B4A06;padding:8px 12px;border-radius:10px;font-size:12px;box-shadow:var(--shadow)}
.ec-logo{margin:10px 6px 14px;background:#fff;border-radius:12px;padding:8px 10px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.ec-logo img{display:block;width:100%;height:auto}
.coach{display:flex;gap:14px;align-items:flex-start;margin:0 0 4px}
.coach .av{flex:none;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#FFFFFF,#DCEBFA);box-shadow:0 0 0 3px #fff,0 4px 14px rgba(18,58,107,.18);overflow:hidden}
.coach .av img{width:100%;height:100%;object-fit:cover}
.coach .bub{position:relative;flex:1;background:#fff;border:1px solid #CFE0F0;border-radius:14px;padding:12px 16px;box-shadow:0 4px 14px rgba(18,58,107,.06)}
.coach .bub:before{content:'';position:absolute;left:-8px;top:22px;width:14px;height:14px;background:#fff;border-left:1px solid #CFE0F0;border-bottom:1px solid #CFE0F0;transform:rotate(45deg)}
.coach .who{display:block;font-size:12px;font-weight:700;color:var(--blue);margin-bottom:2px}
.coach .who:before{content:'AIコーチ　';color:var(--muted);font-weight:500}
.coach-fig{display:block;height:150px;width:auto;margin-top:10px;filter:drop-shadow(0 8px 14px rgba(18,58,107,.18))}
.load-card{background:#fff;padding:22px 34px 24px;border-radius:20px;text-align:center;width:min(380px,92vw);box-shadow:var(--shadow)}
.coach-stage{position:relative;width:220px;height:200px;margin:0 auto 4px}
.coach-body{position:absolute;left:50%;bottom:14px;width:150px;margin-left:-75px;transform-origin:50% 100%;animation:ponder 3.2s ease-in-out infinite}
.coach-body img{width:100%;height:auto;display:block;animation:breathe 1.6s ease-in-out infinite;transform-origin:50% 100%}
.shadow{position:absolute;left:50%;bottom:8px;width:96px;height:12px;margin-left:-48px;border-radius:50%;background:rgba(18,58,107,.16);animation:shade 3.2s ease-in-out infinite}
@keyframes ponder{0%,100%{transform:rotate(-5deg)}20%{transform:rotate(-5deg) translateY(-2px)}50%{transform:rotate(5deg)}70%{transform:rotate(5deg) translateY(-2px)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.985)}}
@keyframes shade{0%,100%{transform:translateX(-4px) scaleX(.95)}50%{transform:translateX(4px) scaleX(1.02)}}
.think{position:absolute;right:4px;top:2px;width:86px;height:70px}
.think>i{position:absolute;border-radius:50%;background:#EAF3FC;border:2px solid #CFE0F0}
.think>i:nth-child(1){width:9px;height:9px;left:6px;bottom:0;animation:pop 2.4s infinite}
.think>i:nth-child(2){width:14px;height:14px;left:16px;bottom:10px;animation:pop 2.4s .2s infinite}
.think .cloud{position:absolute;right:0;top:0;width:62px;height:40px;border-radius:22px;background:#EAF3FC;border:2px solid #CFE0F0;display:flex;align-items:center;justify-content:center;gap:5px;animation:pop 2.4s .4s infinite}
.think .cloud span{width:7px;height:7px;border-radius:50%;background:#1F6FB2;animation:dot 1.2s infinite}
.think .cloud span:nth-child(2){animation-delay:.2s}.think .cloud span:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-5px);opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}12%,85%{transform:scale(1);opacity:1}100%{transform:scale(.9);opacity:0}}
.q{position:absolute;font-weight:900;color:#3FA9F5;font-size:22px;opacity:0;text-shadow:0 2px 6px rgba(63,169,245,.3)}
.q1{left:36px;top:26px;animation:qpop 3.2s .3s infinite}.q2{left:18px;top:56px;font-size:16px;animation:qpop 3.2s 1.9s infinite}
@keyframes qpop{0%{opacity:0;transform:translateY(8px) scale(.6) rotate(-10deg)}15%,45%{opacity:1;transform:translateY(0) scale(1) rotate(8deg)}60%,100%{opacity:0;transform:translateY(-8px) scale(.8) rotate(0)}}
.tw{position:absolute;color:#F5B82E;font-size:16px;animation:twinkle 1.8s ease-in-out infinite}
.t1{left:8px;bottom:70px}.t2{right:18px;bottom:52px;color:#3FA9F5;animation-delay:.6s}.t3{left:52px;top:4px;font-size:12px;animation-delay:1.1s}
@keyframes twinkle{0%,100%{transform:scale(.4) rotate(0);opacity:.2}50%{transform:scale(1.15) rotate(45deg);opacity:1}}
.bulb{position:absolute;left:50%;top:-4px;margin-left:-18px;font-size:36px;opacity:0;transform:scale(.3)}
.steps{display:flex;justify-content:center;gap:6px;margin-top:10px}
.steps i{width:28px;height:5px;border-radius:3px;background:#DCE8F4;transition:background .4s}
.steps i.on{background:linear-gradient(90deg,#3FA9F5,#18794E)}
/* ひらめいた！ */
.coach-stage.eureka .think,.coach-stage.eureka .q{display:none}
.coach-stage.eureka .coach-body{animation:jump .6s cubic-bezier(.3,1.6,.5,1) both}
.coach-stage.eureka .bulb{animation:bulb .6s ease-out both}
@keyframes jump{0%{transform:translateY(0) scale(1,1)}30%{transform:translateY(4px) scale(1.06,.92)}60%{transform:translateY(-22px) scale(.96,1.05)}100%{transform:translateY(0) scale(1,1)}}
@keyframes bulb{0%{opacity:0;transform:scale(.3) translateY(10px)}60%{opacity:1;transform:scale(1.25) translateY(-4px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@media (prefers-reduced-motion:reduce){.coach-body,.coach-body img,.shadow,.think *,.think .cloud,.q,.tw,.coach-stage.eureka .coach-body,.coach-stage.eureka .bulb{animation:none!important}.q{display:none}.coach-stage.eureka .bulb{opacity:1;transform:none}}
.tdots{display:inline-flex;gap:4px;padding:4px 2px}.tdots i{width:7px;height:7px;border-radius:50%;background:#8FA9C4;animation:dot 1.2s infinite}.tdots i:nth-child(2){animation-delay:.2s}.tdots i:nth-child(3){animation-delay:.4s}
.lv{display:inline-block;color:#fff;font-weight:900;font-size:13px;padding:2px 12px;border-radius:999px;letter-spacing:.06em}
.stamp-card{border-top:5px solid var(--sc)}
.stamp-card.locked{opacity:.55;filter:grayscale(.6)}
.stamp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stamp-cell{border:1px dashed #C4D4E4;background:#FBFDFF;border-radius:14px;padding:10px 6px;cursor:pointer;text-align:center;font:inherit;color:inherit;transition:transform .12s,box-shadow .15s}
.stamp-cell:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(18,58,107,.12)}
.stamp-cell.got{border-style:solid;border-color:#E6D2A0;background:#FFFBF0}
.stamp-cell .sc-t{font-size:11.5px;line-height:1.35;margin-top:6px;min-height:31px}
.slot{width:74px;height:74px;margin:0 auto;border-radius:50%;border:2px dashed #B9CBDD;display:grid;place-items:center;align-content:center;color:#8FA3B8}
.slot b{font-family:var(--num);font-size:22px;line-height:1}.slot span{font-size:16px}
.stamp{position:relative;width:74px;height:74px;margin:0 auto;border-radius:50%;border:3px solid var(--sc);background:#fff;transform:rotate(-12deg);box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 5px var(--sc);overflow:hidden}
.stamp img{width:100%;height:100%;object-fit:cover;opacity:.95}
.stamp span{position:absolute;left:0;right:0;bottom:6px;font-family:var(--num);font-weight:700;font-size:11px;color:#fff;background:var(--sc);letter-spacing:.05em;padding:0 2px}
.stamp.big{width:150px;height:150px;animation:stampIn .55s cubic-bezier(.2,1.6,.4,1) both}
.stamp.big span{font-size:18px;bottom:14px}
@keyframes stampIn{0%{transform:scale(2.4) rotate(10deg);opacity:0}100%{transform:scale(1) rotate(-12deg);opacity:1}}
@media (prefers-reduced-motion:reduce){.stamp.big{animation:none}}
.stamp-modal{position:fixed;inset:0;z-index:70;background:rgba(8,24,48,.55);display:grid;place-items:center;backdrop-filter:blur(3px)}
.stamp-box{background:#fff;border-radius:20px;padding:28px 34px;text-align:center;max-width:380px;box-shadow:var(--shadow)}
.nav .new{margin-left:auto;font-size:10px;font-weight:900;letter-spacing:.06em;color:#0A1F3C;background:#6FF0D8;border-radius:999px;padding:1px 7px}
.help-fab{position:fixed;right:18px;bottom:18px;z-index:45;width:48px;height:48px;border-radius:50%;border:0;cursor:pointer;font-size:22px;font-weight:900;color:#fff;background:linear-gradient(180deg,#1A5C9E,#0D3264);box-shadow:0 8px 20px rgba(13,50,100,.35)}
.help-fab:hover{filter:brightness(1.1)}
.dash-stamps .slot,.dash-stamps .stamp{width:54px;height:54px}.dash-stamps .stamp span{font-size:9px;bottom:4px}.dash-stamps .sc-t{font-size:10.5px}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
@media (max-width:1080px){ .up-grid{grid-template-columns:1fr 1fr} .feat{grid-column:span 2;display:grid;grid-template-columns:1fr 1fr} .up-copy{order:0} }
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;padding:12px}
  .tagline,.quote,.ec,.kpi-mini,.nav .grp,.me{display:none}
  .brand{margin-bottom:10px}
  .nav{display:flex;overflow-x:auto;gap:4px}
  .nav button{white-space:nowrap;width:auto}
  .hero-art{display:none}
  .frate{margin-left:12px}
  .fstep{grid-template-columns:96px 1fr}
  .grid2,.grid3,.obj-body,.up-grid{grid-template-columns:1fr}
  .feat{grid-column:auto;grid-template-columns:1fr}
  .bar{grid-template-columns:110px 1fr 36px}
  .wm{display:none}
  .stamp-grid,.dash-stamps{grid-template-columns:repeat(2,1fr)!important}
}
@media print{.side,.no-print,.hero-art{display:none!important}.app{display:block}main{padding:0}.panel{box-shadow:none;backdrop-filter:none}}

/* 期間（月／四半期。期首12月） */
function periodStart(d,unit){ const x=new Date(d); if(unit==='m') return new Date(x.getFullYear(),x.getMonth(),1); const m=x.getMonth(); const off=((m-11)%3+3)%3; return new Date(x.getFullYear(),m-off,1); }
const addPeriod = (st,unit,n) => new Date(st.getFullYear(), st.getMonth()+(unit==='m'?1:3)*n, 1);
function periodLabel(st,unit){ const y=st.getFullYear(), m=st.getMonth(); if(unit==='m') return `${String(y).slice(2)}/${m+1}`; const q=Math.floor(((m-11+12)%12)/3)+1; return `${q}Q ${String(y).slice(2)}/${m+1}〜`; }
function lastPeriods(unit,n){ const cur=periodStart(new Date(),unit); const a=[]; for(let i=n-1;i>=0;i--){ const st=addPeriod(cur,unit,-i); a.push({ st, en:addPeriod(st,unit,1), label:periodLabel(st,unit) }); } return a; }
/* 顧客単位の到達段階 */
function custs(model,sessions){
  const by={};
  for (const s of sessions){ if(modelIdOf(s)!==model.id) continue; const k=(s.customer||'').trim(); if(!k) continue; const i=stageIdx(model,s); if(i<0) continue; (by[k]=by[k]||{rep:s.rep,hits:[]}).hits.push({ i, t:+new Date(s.created_at) }); }
  return Object.values(by);
}
/* 転換率：from段階に入った時点（期間判定）→ 以降to段階に到達したか */
function conv(cs,fi,ti,range){
  let den=0,num=0;
  for (const c of cs){ const e=c.hits.filter(h=>h.i>=fi).map(h=>h.t); if(!e.length) continue; const et=Math.min(...e); if(range&&(et<range[0]||et>=range[1])) continue; den++; if(c.hits.some(h=>h.i>=ti)) num++; }
  return { num, den, rate:pct(num,den) };
}
function kpiConv(model,sessions,k,range){ return conv(custs(model,sessions), sIdx(model,k.from), sIdx(model,k.to), range); }
function overallConv(model,sessions,range){ return conv(custs(model,sessions), 0, model.stages.length-1, range); }

async function callAI({ prompt, system, messages, max_tokens=6000 }){
  let token = CFG.key;
  try{ const { data } = await sb.auth.getSession(); if (data?.session?.access_token) token = data.session.access_token; }catch(e){}
  const body = { system, max_tokens };
  if (messages) body.messages = messages; else body.prompt = prompt;
  const res = await fetch(CFG.ai, { method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token, 'apikey':CFG.key }, body: JSON.stringify(body) });
  const j = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(j.error || j.message || ('AI呼び出しエラー（'+res.status+'）'));
  if (typeof j === 'string') return j;
  return j.text || (Array.isArray(j.content) ? j.content.map(c=>c.text||'').join('') : '') || j.completion || j.result || '';
}
function parseJSON(t){
  const s = t.replace(/```json|```/g,''); const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a<0||b<0) throw new Error('AIの回答を読み取れませんでした。もう一度実行してください。');
  return JSON.parse(s.slice(a,b+1));
}

/* AIの発言は必ずAIコーチ（キャラクター）の吹き出しで出す */
function coachSay(title, body, opt={}){ return `<div class="coach"${opt.style?` style="${opt.style}"`:''}><div class="av"><img src="${IMG.coachHead}" alt="AIコーチ"></div><div class="bub">${title?`<span class="who">${esc(title)}</span>`:''}<div${opt.pre?' style="white-space:pre-wrap"':''}>${body}</div></div></div>`; }
const VIEWS = {};
let CURRENT = { view:'home', arg:null };
function go(view,arg){ CURRENT={view,arg}; const mn=document.getElementById('main'); mn.onclick=mn.oninput=mn.onchange=null; document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view)); window.scrollTo(0,0); VIEWS[view](arg); renderKpiMini(); try{ localStorage.setItem('scai_visited_'+view,'1'); markNavNew(); }catch(e){} if (view!=='course' && typeof autoStamps==='function') setTimeout(autoStamps,400); }
document.getElementById('nav').addEventListener('click',e=>{ const b=e.target.closest('button[data-v]'); if(b) go(b.dataset.v); });
const banner = () => { if (LOCAL && !document.getElementById('localNote')){ const n=document.createElement('div'); n.id='localNote'; n.className='localnote no-print'; n.innerHTML='ブラウザ内に保存中（Supabaseテーブル未作成）。sales-coach-setup.sql を実行すると全社共有になります。 <button class="btn sm" style="margin-left:6px" onclick="this.parentElement.remove()">閉じる</button>'; document.body.appendChild(n); } return ''; };

async function readFile(f){
  try{
    loading(true,'ファイルを読み込んでいます');
    let text='';
    const ext=f.name.split('.').pop().toLowerCase();
    if (ext==='docx'){ const r=await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()}); text=r.value; }
    else if (ext==='pdf'){
      pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
      for(let i=1;i<=pdf.numPages;i++){ const p=await pdf.getPage(i); const c=await p.getTextContent(); text+=c.items.map(x=>x.str).join(' ')+'\n'; }
    } else text = await f.text();
    SRC.text=text.trim(); SRC.fileName=f.name; SRC.mode='paste';
    VIEWS.home(); toast(f.name+' を読み込みました');
  }catch(e){ alert('読み込めませんでした：'+e.message); }
  finally{ loading(false); }
}
async function runAnalysis(){

  if (!meta.rep || !meta.customer) return alert('担当営業と顧客名を入れてください。');
  const bankTop = topCats(DATA.o.filter(o=>o.product===meta.product)).slice(0,8).map(c=>c.cat).join('、') || 'まだなし';
  const system = companyFor(meta.product) + `\n出力は指定のJSONのみ。前置き・コードブロック禁止。日本語で具体的に。文字起こしに無い事実は作らず、推測は「可能性」と明記する。`;
  const prompt = `以下の商談を育成カルテとして分析してください。
【商談情報】担当:${meta.rep}／顧客:${meta.customer}（${meta.industry}）／商品:${meta.product}／段階:${meta.stage}／結果:${meta.result}
【同商品で過去に多い断り文句】${bankTop}

【分析ルール】
1. 10項目を各100点で採点：${SCORE_ITEMS.join('、')}。総合点は加重せず平均。
2. 総合点より「どこで転換率を落としたか」を bottleneck に書く。
3. 顧客の断り文句・保留発言・懸念をすべて抽出。各断り文句は「断られてから返す」ではなく「断られる前に潰す」視点で、発生の原因地点（商談の何分頃／どの場面の何が不足したか）まで遡る。cause_chain は原因→…→断り文句 の順に3〜5段。

【JSON形式】
{"summary":"3行要約","total_score":0,
"scores":[{"item":"事前準備","score":0,"comment":"根拠となる発言や場面"}],
"bottleneck":{"item":"","reason":"","impact":"転換率への影響"},
"good_points":["再現すべき良かった点"],
"objections":[{"quote":"顧客の実際の発言","category":"","timing":"商談○分頃／場面","surface":"表面的理由","background":"背景","sales_issue":"営業側の問題","cause_chain":["原因","…","断り文句"],"cause_point":"原因地点の説明","prevention_question":"本来事前に聞く質問","prevention_talk":"反論される前の予防トーク","rebuttal":"言われた後の切り返し","severity":"高|中|低"}],
"decision_maker":{"levels":[{"role":"担当者","status":0,"note":""}],"analysis":"","ceo_interest":["社長が聞きたくなる経営情報"],"onepager_title":"","onepager":"社長向け1枚の本文"},
"next_actions":[{"when":"24時間以内","who":"","what":"","done":"完了条件"}],
"roleplay":{"opening":"お客様の最初の一言","followups":["追撃質問"],"category":""},
"training_theme":"今週の重点練習テーマ（1行）"}

【文字起こし】
${SRC.text.slice(0,60000)}`;
  try{
    loading(true,'AIが商談を分析しています');
    const a = parseJSON(await callAI({ system, prompt, max_tokens:8000 }));
    a._kpi = { model_id:meta._model, stage_id:meta._stage }; const { _model, _stage, ...row } = meta;
    const sess = await insert('s', { ...row, rep_email:ME.email, transcript:SRC.text, total_score:Math.round(a.total_score||0), analysis:a });

    go('karte', sess.id);

  finally{ loading(false); }
}

function topCats(objs){
  const m={}; objs.forEach(o=>{ const c=o.category||'その他'; (m[c]=m[c]||[]).push(o); });
  return Object.entries(m).map(([cat,list])=>{
    const sessIds=[...new Set(list.map(o=>o.session_id))];
    const lost=sessIds.filter(id=>(DATA.s.find(s=>s.id===id)||{}).result==='失注').length;
    return { cat, list, count:list.length, lossRate:pct(lost,sessIds.length) };
  }).sort((a,b)=>b.count-a.count);
}

/* ダッシュボード：学習コースの可視化（個人・チーム） */
function barSVG(labels, vals, color='#18794E', unit=''){
  const W=680,H=190,L=34,R=10,T=12,B=28, n=labels.length, max=Math.max(1,...vals); const bw=(W-L-R)/n*0.56;
  const x=i=>L+(W-L-R)*(i+.5)/n, y=v=>T+(H-T-B)*(1-v/max);
  let g=''; [0,.5,1].forEach(t=>{ const v=Math.round(max*t); g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#E3E8E5"/><text x="${L-6}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="#5E6B75">${v}</text>`; });
  labels.forEach((l,i)=>{ g+=`<rect x="${x(i)-bw/2}" y="${y(vals[i])}" width="${bw}" height="${H-B-y(vals[i])}" rx="4" fill="${color}"><title>${esc(l)}：${vals[i]}${unit}</title></rect><text x="${x(i)}" y="${y(vals[i])-4}" font-size="11" text-anchor="middle" fill="#0E2240">${vals[i]||''}</text><text x="${x(i)}" y="${H-9}" font-size="11" text-anchor="middle" fill="#5E6B75">${esc(l)}</text>`; });
  return `<div class="scroll"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:480px;height:auto" role="img" aria-label="期間別の数">${g}</svg></div>`;
}
const inP = (x,p) => { const t=+new Date(x.created_at); return t>=+p.st && t<+p.en; };
const newest = a => [...a].sort((x,y)=>new Date(y.created_at)-new Date(x.created_at))[0];
const daysAgo = d => Math.floor((Date.now()-new Date(d))/864e5);
function learnPanel(sc, model, periods, curP, prevP, unit, repList){
  const reps = sc.type==='rep' ? [sc.id] : [...new Set([...repList, ...(sc.type==='all'?DATA.p.map(p=>p.rep):[])].filter(Boolean))];

    <div class="grid2"><div><h3>スタンプ獲得数の推移</h3>${stampsTrend}</div><div><h3>ロープレ平均点の推移</h3>${rpTrend}</div></div>
    ${COURSES.filter(c=>unlocked(c,me)).map(c=>`<h3 style="margin-top:14px">${esc(c.name)}のスタンプカード</h3><div class="stamp-grid dash-stamps" style="grid-template-columns:repeat(6,1fr)">${c.ch.map((x,i)=>stampCell({...x,course:c},i,me)).join('')}</div>`).join('')}

  const stale = rows.filter(x=>!x.last || daysAgo(x.last.created_at)>=14);

    <div class="grid3" style="margin:12px 0 16px">
      ${COURSES.map(c=>`<div class="stat" style="border-top:4px solid ${c.color}"><div class="small muted">${esc(c.name)} 修了</div><div class="n">${done(c)}<span class="small">/${reps.length}人</span></div><div class="track" style="height:8px;margin-top:6px"><div style="height:100%;width:${reps.length?done(c)/reps.length*100:0}%;background:${c.color};border-radius:4px"></div></div></div>`).join('')}
      <div class="stat"><div class="small muted">今期間のスタンプ（${esc(pl)}）</div><div class="n">${P.filter(x=>inP(x,curP)).length}<span class="small">個</span></div><div class="small">前期間比 ${growthTag(P.filter(x=>inP(x,curP)).length, P.filter(x=>inP(x,prevP)).length, '個')}</div></div>
      <div class="stat"><div class="small muted">2週間以上 学習が止まっている人</div><div class="n ${stale.length?'ng':'ok'}">${stale.length}<span class="small">人</span></div><div class="small">${stale.slice(0,4).map(x=>esc(x.r)).join('、')}${stale.length>4?' ほか':''}</div></div>
    </div>
    <div class="grid2" style="margin-bottom:10px"><div><h3>スタンプ獲得数の推移</h3>${stampsTrend}</div><div><h3>ロープレ平均点の推移</h3>${rpTrend}</div></div>

async function kpiSave(){
  const errs=[];
  CE.models.forEach(m=>{
    if(!m.name.trim()) errs.push('名前のないビジネスモデルがあります');
    if(m.stages.length<2) errs.push(`${m.name}：段階は2つ以上必要です`);
    const names=m.stages.map(s=>s.name.trim()); if(names.some(n=>!n)) errs.push(`${m.name}：空欄の段階名があります`); if(new Set(names).size!==names.length) errs.push(`${m.name}：段階名が重複しています`);
    (m.kpis||[]).forEach(k=>{ if(!k.name.trim()) errs.push(`${m.name}：名前のないKPIがあります`); if(sIdx(m,k.to)<=sIdx(m,k.from)) errs.push(`${m.name}「${k.name}」：到達段階が開始段階より前です`); if(k.target!=null&&(k.target<0||k.target>100)) errs.push(`${m.name}「${k.name}」：目標は0〜100%`); });
  });
  Object.values(CE.personal).forEach(p=>Object.values(p).forEach(x=>Object.values(x).forEach(v=>{ if(v<0||v>100) errs.push('個人目標は0〜100%で入力してください'); })));
  if (errs.length) return alert('保存できません：\n・'+[...new Set(errs)].join('\n・'));
  if (!confirm('この設定を保存して全社に反映しますか？')) return;
  try{ await saveConf(clone(CE)); CE=clone(CONF); toast('KPI設定を保存しました'); kpiRerender(); }
  catch(e){ alert('保存できませんでした：'+e.message+'\n（sales-coach-kpi-settings.sql を実行済みか、管理者権限かを確認してください）'); }
}

function caseChatwork(c){

  if(b.situation) out.push(`■状況\n${b.situation}`);
  if(c.type==='win'&&b.key_points?.length) out.push(`■うまくいった理由\n${b.key_points.map(x=>'・'+x).join('\n')}`);
  if(c.type==='lose'&&b.why_failed) out.push(`■うまくいかなかった原因\n${b.why_failed}`);
  if(c.type==='lose'&&b.lessons?.length) out.push(`■教訓\n${b.lessons.map(x=>'・'+x).join('\n')}`);
  if(b.steps?.length) out.push(`■${c.type==='win'?'再現手順':'次に同じ場面が来たら'}\n${b.steps.map((x,i)=>`${i+1}. ${x}`).join('\n')}`);
  const links=[...(c.recording_url?[{kind:'録画',url:c.recording_url}]:[]),...(c.links||[])];
  if(links.length) out.push(`[hr]■資料・録画\n${links.map(l=>`・${l.kind||'資料'}：${l.label&&l.label!==l.url?l.label+' ':''}${l.url}`).join('\n')}`);
  out.push(`[hr]トークスクリプト全文・実践報告はアプリの【事例ライブラリ】へ\n${url}\n【読んだら「学習した」、使ったら「実践した結果」を必ず報告してください】`);
  out.push('[/info]'); return out.join('\n');
}

async function draftCaseFromSession(sessionId, type){
  const s = DATA.s.find(x=>x.id===sessionId); if(!s) return;
  const a = s.analysis||{}; const m = modelById(modelIdOf(s));
  const prompt = `以下の商談分析から、社内の${type==='win'?'「勝ちパターン」（うまくいったやり方を他の営業が再現するための教材）':'「失敗事例」（同じ負け方を二度しないための教材）'}の下書きを作ってください。
事実は文字起こしと分析にあることだけ。推測で数字や発言を作らない。他の営業が明日そのまま真似できる具体性で。
商談：${s.customer}（${s.industry||''}）／商品：${s.product}／段階：${s.stage}／結果：${s.result}／担当：${s.rep}
段階の候補：${m.stages.map(x=>x.name).join('、')}
分析：${JSON.stringify({ summary:a.summary, bottleneck:a.bottleneck, good_points:a.good_points, objections:(a.objections||[]).map(o=>({quote:o.quote,category:o.category,cause_point:o.cause_point,prevention_question:o.prevention_question,prevention_talk:o.prevention_talk,rebuttal:o.rebuttal})) })}
文字起こし（抜粋）：${(s.transcript||'').slice(0,20000)}
JSONのみ：{"title":"一言で何が学べるか（40字以内）","situation":"誰に・どんな場面で（2〜3文）","key_points":["うまくいった理由"],"why_failed":"うまくいかなかった原因（失敗事例のみ）","lessons":["教訓（失敗事例のみ）"],"steps":["再現手順／次に同じ場面が来たらこうする"],"script":"営業：…\\nお客様：…（${type==='win'?'実際にうまくいったやり取りを中心に':'本来こう言うべきだった改善版'}、10往復以内）","category":"${OBJ_CATS.join('|')}|なし","stage_from":"段階の候補から","stage_to":"段階の候補から"}`;
  try{
    loading(true,'AIが事例の下書きを作っています');
    const d = parseJSON(await callAI({ system:companyFor(s.product), prompt, max_tokens:3000 }));
    const draft = { type, title:d.title||'', product:s.product, stage_from:m.stages.some(x=>x.name===d.stage_from)?d.stage_from:s.stage, stage_to:m.stages.some(x=>x.name===d.stage_to)?d.stage_to:'', category:[...OBJ_CATS,'なし'].includes(d.category)?d.category:'なし', industry:s.industry||'', rep:s.rep, rep_email:s.rep_email||ME.email, session_id:s.id, customer:s.customer, recording_url:s.recording_url||'', links:[],
      body:{ situation:d.situation||'', key_points:d.key_points||[], steps:d.steps||[], script:d.script||'', why_failed:d.why_failed||'', lessons:d.lessons||[] } };
    CASE_EDIT=null; go('cases', { draft, type, from:s.id });
  }catch(e){ alert('下書きを作れませんでした：'+e.message); }
  finally{ loading(false); }
}

const unlocked = (c,me=ME.name) => !c.need || courseDone(COURSES.find(x=>x.id===c.need),me);
const rankOf = (me=ME.name) => RANKS[COURSES.filter(c=>courseDone(c,me)).length][0];

async function giveStamp(ch, score){
  const me = who(); if(!me) return false;
  if (hasStamp(ch.id,me)) return false;
  await insert('p', { rep:me, rep_email:ME.email, course_id:ch.course.id, challenge_id:ch.id, score:score??null });
  const done = courseDone(ch.course,me);
  showStampGet(ch, done);
  return true;
}
function showStampGet(ch, courseClear){
  const c=ch.course; const el=document.createElement('div'); el.className='stamp-modal';
  el.innerHTML = `<div class="stamp-box">
    <div class="stamp big" style="--sc:${c.color}"><img src="${IMG.coachHead}" alt=""><span>CLEAR</span></div>
    <h2 style="margin:14px 0 4px">${courseClear?`🎉 ${esc(c.name)} 修了！`:'スタンプGET！'}</h2>
    <p style="margin:0 0 6px"><b>${esc(ch.title)}</b></p>
    ${courseClear?`<p class="small">称号【${esc(c.badge)}】を獲得しました。${COURSES[COURSES.indexOf(c)+1]?`次は「${esc(COURSES[COURSES.indexOf(c)+1].name)}」が解放されます。`:'全コース制覇です！'}</p>`:`<p class="small muted">${esc(c.name)}　${c.ch.filter(x=>hasStamp(x.id)).length} / ${c.ch.length}</p>`}
    <div class="row" style="justify-content:center;margin-top:12px">${courseClear?'<button class="btn" id="smShare">Chatworkで報告</button>':''}<button class="btn primary" id="smOk">スタンプカードを見る</button></div></div>`;
  document.body.appendChild(el);
  el.querySelector('#smOk').onclick=()=>{ el.remove(); go('course'); };
  el.onclick=e=>{ if(e.target===el) el.remove(); };
  const sh=el.querySelector('#smShare'); if(sh) sh.onclick=()=>copy(courseChatwork(c));
}
function courseChatwork(c){
  const me=ME.name; const sc=myStamps(me).filter(p=>p.course_id===c.id&&p.score!=null).map(p=>p.score);
  return `[info][title]【学習コース修了】${me}さんが「${c.name}」をクリアしました[/title]\n■コース\n${c.name}（${c.sub}）\n■獲得した称号\n【${c.badge}】\n■チャレンジ\n${c.ch.map(x=>'・'+x.title).join('\n')}${sc.length?`\n■ロープレ平均点\n【${Math.round(sc.reduce((a,b)=>a+b,0)/sc.length)}点】`:''}\n[hr]次は「${(COURSES[COURSES.indexOf(c)+1]||{}).name||'全コース制覇'}」に挑戦します。\n[/info]`;
}
function stampCell(ch,i,me){
  const got = myStamps(me).find(p=>p.challenge_id===ch.id); const c=ch.course;
  const ic = ch.type==='rp'?'🎤':ch.type==='quiz'?'📝':'🏃';
  return `<button class="stamp-cell ${got?'got':''}" data-ch="${ch.id}" title="${esc(ch.title)}">
    ${got?`<div class="stamp" style="--sc:${c.color}"><img src="${IMG.coachHead}" alt=""><span>${fmtDate(got.created_at)}</span></div>`:`<div class="slot"><b>${i+1}</b><span>${ic}</span></div>`}
    <div class="sc-t">${esc(ch.title)}</div></button>`;
}

  const me = ME.name;

  const reps = [...new Set(DATA.p.map(p=>p.rep))].map(r=>({ r, n:DATA.p.filter(p=>p.rep===r).length, rank:rankOf(r) })).sort((a,b)=>b.n-a.n).slice(0,10);
  $('#main').innerHTML = `${banner()}${LOCAL_P&&!LOCAL?'<div class="banner">学習コースのテーブルが未作成のため、このブラウザ内に保存しています。sales-coach-course.sql を実行すると全社共有になります。</div>':''}

function challengeView(id){
  const ch = findCh(id); if(!ch) return go('course'); const c=ch.course; const me=ME.name;
  if(!unlocked(c,me)) return go('course');
  const got = hasStamp(ch.id,me);
  const typeLabel = { rp:'🎤 AIロープレ', quiz:'📝 クイズ', task:'🏃 実践ミッション' }[ch.type];
  const clearCond = ch.type==='rp'?`AIロープレで ${c.pass}点以上`:ch.type==='quiz'?'全問正解':'実際の行動が記録されたら自動でクリア';
  $('#main').innerHTML = `<button class="btn sm no-print" onclick="go('course')">← スタンプカード</button>
  <div style="margin-top:12px"><span class="lv" style="background:${c.color}">${esc(c.name)}</span> <span class="tag">${typeLabel}</span> ${got?'<span class="tag green">クリア済み</span>':''}</div>
  <h1 style="margin-top:8px">${esc(ch.title)}</h1>
  <p class="lead">クリア条件：<b>${clearCond}</b></p>
  ${coachSay('ミッション', esc(ch.desc)+(ch.type==='rp'?`<br><span class="small muted">お客様役：${esc(ch.persona||c.persona)}</span>`:''), {style:'margin-bottom:18px'})}
  <div id="chBody"></div>`;
  const body=$('#chBody');
  if (ch.type==='rp'){
    body.innerHTML = `<div class="panel"><p style="margin-top:0">お客様の最初のひと言：</p><div class="msg c" style="max-width:100%">「${esc(ch.opening)}」</div>
      <div class="go-wrap" style="margin-top:16px"><button class="btn go" id="chGo">▶ ロープレに挑戦する</button></div></div>`;
    $('#chGo').onclick=()=>{ RP={ product:'', sessionId:null, category:ch.cat, opening:ch.opening, followups:[], ctx:`${ch.persona||c.persona}（${c.name}の練習相手）`, rep:ME.name, log:[{role:'assistant',content:ch.opening}], result:null, challenge:{ id:ch.id, pass:c.pass, level:c.name } }; go('roleplay'); };
  }
  if (ch.type==='quiz'){
    const qs=QUIZ[ch.quiz];
    body.innerHTML = `<div class="panel">${qs.map((q,i)=>`<div style="margin-bottom:16px"><b>Q${i+1}. ${esc(q.q)}</b>${q.a.map((a,j)=>`<label style="display:block;margin:4px 0 0 8px;cursor:pointer"><input type="radio" name="q${i}" value="${j}"> ${esc(a)}</label>`).join('')}<div class="qe" id="qe${i}"></div></div>`).join('')}
      <div class="go-wrap"><button class="btn go" id="qSubmit">答え合わせ</button></div></div>`;
    $('#qSubmit').onclick=async()=>{
      let ok=0; qs.forEach((q,i)=>{ const v=document.querySelector(`input[name=q${i}]:checked`); const right=v&&+v.value===q.c; if(right) ok++; $('#qe'+i).innerHTML=`<div class="fix ${right?'t':'r'}" style="margin:6px 0 0"><b>${right?'⭕ 正解':'❌ 正解は「'+esc(q.a[q.c])+'」'}</b>${esc(q.e)}</div>`; });
      if (ok===qs.length){ try{ if(!(await giveStamp(ch))) toast('全問正解！（スタンプは獲得済み）'); }catch(e){ alert(e.message); } }
      else toast(`${ok} / ${qs.length} 問正解。全問正解でスタンプです！`);
    };
  }
  if (ch.type==='task'){
    const done = !!(me && TASK_RULES[ch.rule](me));
    body.innerHTML = `<div class="panel"><p style="margin-top:0">${done?'✅ 達成が確認できました。':'まだ達成が確認できません。アプリで行動すると自動で記録されます。'}</p>
      <div class="row">${done&&!got?'<button class="btn go" id="tClaim">スタンプを受け取る</button>':''}<button class="btn primary" onclick="go('${ch.go}')">${ch.go==='home'?'商談をAI分析へ':'事例ライブラリへ'}</button><button class="btn" id="tCheck">達成をチェック</button></div></div>`;
    const claim=async()=>{ const m=who(); if(!m) return; if(!TASK_RULES[ch.rule](m)) return toast('まだ達成が確認できません'); try{ if(!(await giveStamp(ch))) toast('スタンプは獲得済みです'); }catch(e){ alert(e.message); } };
    const t=$('#tClaim'); if(t) t.onclick=claim; $('#tCheck').onclick=claim;
  }
}
/* 実践ミッションは、条件を満たした時点で自動的にスタンプを付与 */
async function autoStamps(){
  const me=ME.name; if(!me) return;
  for (const ch of allCh()){ if(ch.type==='task' && unlocked(ch.course,me) && !hasStamp(ch.id,me) && TASK_RULES[ch.rule](me)){ try{ await giveStamp(ch); }catch(e){ console.warn(e); } break; } }
}

    what:'ビジネスモデルごとの商談段階・KPI・目標、チーム、個人目標を設定します。',
    steps:['「ビジネスモデルとKPI」で段階とKPI・目標を設定','「商品の割当」でモデルを選ぶ','「チーム」「個人目標」を設定して保存'],
    tips:['変更は管理者のみ可能です'] }
];
const vNum = v => String(v||'0').split('.').map(Number).reduce((a,n)=>a*1000+n,0);
const SEEN_KEY = 'scai_seen_version';
const seenVer = () => localStorage.getItem(SEEN_KEY) || '0.0.0';
const BASE_KEY = 'scai_base_version';   // 初めて使った時点のバージョン（それ以前の機能にはNEWを付けない）
if (!localStorage.getItem(BASE_KEY)) localStorage.setItem(BASE_KEY, localStorage.getItem(SEEN_KEY) || APP_VERSION);
const isNewFeature = id => { const g=GUIDE.find(x=>x.id===id); return !!g && vNum(g.since)>vNum(localStorage.getItem(BASE_KEY)) && !localStorage.getItem('scai_visited_'+id); };
const navLabel = id => (NAV.find(n=>n[0]===id)||[])[2] || id;
function markNavNew(){ document.querySelectorAll('#nav button[data-v]').forEach(b=>{ b.querySelector('.new')?.remove(); if(isNewFeature(b.dataset.v)) b.insertAdjacentHTML('beforeend','<span class="new">NEW</span>'); }); }
function guideCard(g){
  return `<div class="panel" id="g-${g.id}">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(navLabel(g.id))} ${isNewFeature(g.id)?'<span class="tag amber">NEW</span>':''}</h2><button class="btn sm" onclick="go('${g.id}')">この画面を開く</button></div>
    <div class="small muted" style="margin:4px 0 8px">対象：${esc(g.who)}　使うタイミング：${esc(g.when)}</div>
    <p style="margin:0 0 8px">${esc(g.what)}</p>
    <ol style="margin:0;padding-left:22px">${g.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
    ${g.tips.length?`<div class="fix t" style="margin:10px 0 0"><b>コツ</b>${g.tips.map(esc).join('<br>')}</div>`:''}
  </div>`;
}
VIEWS.guide = () => {
  const latest = CHANGELOG[0];
  const roles = [...new Set(GUIDE.map(g=>g.who))];
  $('#main').innerHTML = `<h1>使い方ガイド</h1>
  <p class="lead">バージョン ${APP_VERSION}（${esc(latest.date)} 更新）。アプリが改善されるたびに、このガイドも更新されます。</p>
  ${coachSay('1日の使い方', '<b>商談前</b>：商談前予測で断り文句を予測 → 事前ロープレ<br><b>商談後24時間以内</b>：商談をAI分析 → 育成カルテのNEXT ACTIONを実行<br><b>空き時間</b>：学習コースを1チャレンジ ＋ 事例ライブラリを1件学習', {style:'margin-bottom:18px'})}
  <div class="panel" style="border-top:5px solid var(--sky)">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">最新の更新情報　v${esc(latest.v)}　${esc(latest.title)}</h2>
      <div class="row"><button class="btn sm" id="gCwNew">更新情報をChatworkにコピー</button><button class="btn sm" id="gCwAll">活用ガイド全体をChatworkにコピー</button></div></div>
    <ul style="margin:10px 0 0">${latest.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>
    <details style="margin-top:12px"><summary class="small">これまでの更新履歴</summary>
      ${CHANGELOG.slice(1).map(c=>`<div style="margin-top:10px"><b>v${esc(c.v)}　${esc(c.title)}</b> <span class="small muted">${esc(c.date)}</span><ul style="margin:4px 0 0">${c.items.map(i=>`<li class="small">${esc(i)}</li>`).join('')}</ul></div>`).join('')}</details>
  </div>
  ${roles.map(r=>`<h2 style="margin:26px 0 12px">${esc(r)}向け</h2>${GUIDE.filter(g=>g.who===r).map(guideCard).join('')}`).join('')}`;
  $('#gCwNew').onclick=()=>copy(chatworkRelease(latest));
  $('#gCwAll').onclick=()=>copy(chatworkGuide());
  localStorage.setItem(SEEN_KEY, APP_VERSION);
};
const appUrl = () => location.href.split('#')[0].split('?')[0];
function chatworkRelease(c){
  const how = GUIDE.filter(g=>g.since===c.v).map(g=>`[hr]■${navLabel(g.id)}の使い方\n使うタイミング：【${g.when}】\n${g.steps.map((s,i)=>`${i+1}. ${s}`).join('\n')}\n`).join('');
  return `[info][title]【SALES COACH AI アップデート】v${c.v}　${c.title}[/title]\n■今回の改善\n${c.items.map(i=>'・'+i).join('\n')}\n${how}[hr]■URL\n${appUrl()}\n使い方はアプリの【使い方ガイド】、各画面右下の【？】からいつでも確認できます。\n[/info]`;
}
function chatworkGuide(){
  const rs=[...new Set(GUIDE.map(g=>g.who))];
  return `[info][title]【SALES COACH AI 活用ガイド】v${APP_VERSION}（${CHANGELOG[0].date}更新）[/title]\n■1日の使い方\n・商談前：【商談前予測】で断り文句を予測 → 事前ロープレ\n・商談後24時間以内：【商談をAI分析】→ 育成カルテのNEXT ACTIONを実行\n・空き時間：【学習コース】を1チャレンジ ＋【事例ライブラリ】を1件学習\n${rs.map(r=>`[hr]■${r}向け\n${GUIDE.filter(g=>g.who===r).map(g=>`【${navLabel(g.id)}】${g.what}\n使うタイミング：${g.when}\n${g.steps.map((s,i)=>`${i+1}. ${s}`).join('\n')}`).join('\n\n')}`).join('\n')}\n[hr]■URL\n${appUrl()}\n[/info]`;
}
/* 画面ごとの「？」ヘルプ */
function openHelp(){
  const g=GUIDE.find(x=>x.id===CURRENT.view); const el=document.createElement('div'); el.className='stamp-modal';
  el.innerHTML=`<div class="stamp-box" style="max-width:520px;text-align:left">${g?`${coachSay(navLabel(g.id)+'の使い方', esc(g.what))}
    <div class="small muted" style="margin:10px 0 6px">使うタイミング：${esc(g.when)}</div><ol style="margin:0;padding-left:22px">${g.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
    ${g.tips.length?`<div class="fix t" style="margin:10px 0 0"><b>コツ</b>${g.tips.map(esc).join('<br>')}</div>`:''}`:coachSay('ヘルプ','この画面の使い方は「使い方ガイド」にまとめています。')}
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="hAll">使い方ガイドを開く</button><button class="btn primary" id="hOk">閉じる</button></div></div>`;
  document.body.appendChild(el);
  el.querySelector('#hOk').onclick=()=>el.remove(); el.onclick=e=>{ if(e.target===el) el.remove(); };
  el.querySelector('#hAll').onclick=()=>{ el.remove(); go('guide'); };
}
/* 新しいバージョンを初めて開いたときのお知らせ */
function showWhatsNew(){
  const seen=seenVer();
  if (vNum(seen)===0){ localStorage.setItem(SEEN_KEY, APP_VERSION); return; } // 初めての人には出さない
  if (vNum(seen)>=vNum(APP_VERSION)) return;
  const news=CHANGELOG.filter(c=>vNum(c.v)>vNum(seen));
  const el=document.createElement('div'); el.className='stamp-modal';
  el.innerHTML=`<div class="stamp-box" style="max-width:520px;text-align:left">
    <div style="text-align:center"><img src="${IMG.coach}" alt="" style="height:120px"><h2 style="margin:6px 0 2px">アプリが新しくなりました！</h2><div class="small muted">v${esc(seen)} → v${esc(APP_VERSION)}</div></div>
    ${news.map(c=>`<div style="margin-top:12px"><b>${esc(c.title)}</b><ul style="margin:4px 0 0">${c.items.map(i=>`<li class="small">${esc(i)}</li>`).join('')}</ul></div>`).join('')}
    <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" id="wnOk">閉じる</button><button class="btn primary" id="wnGo">使い方を見る</button></div></div>`;
  document.body.appendChild(el);
  const close=()=>{ localStorage.setItem(SEEN_KEY, APP_VERSION); el.remove(); markNavNew(); };
  el.querySelector('#wnOk').onclick=close; el.querySelector('#wnGo').onclick=()=>{ el.remove(); go('guide'); };
}

/* ============ 起動 ============ */
(async function boot(){
  try{ if (window.EC?.guard) await EC.guard({ allow:['admin','manager','sales'] }); }catch(e){ console.warn(e); }
  try{ sb = supabase.createClient(CFG.url, CFG.key); }catch(e){ console.warn(e); }
  try{ const m = window.EC?.me ? await EC.me() : null; if (m){ ME.name=m.full_name||m.name||m.user?.full_name||''; ME.email=m.email||m.user?.email||''; ME.role=m.role||m.user?.role||m.profile?.role||''; } }catch(e){}
  await resolveMe();
  try{ if (window.EC?.mountBadge) EC.mountBadge(document.getElementById('badge')); }catch(e){}
  renderMe();
  await loadAll();
  await loadCases();
  await loadProgress();
  await loadConf();
  go('home');
  markNavNew();
  showWhatsNew();
})();
/* ログイン中の社員の氏名・権限を app_users から確定する（EC.me() が role を返さない場合の保険） */
async function resolveMe(){
  try{
    if (!ME.email){ const { data } = await sb.auth.getSession(); ME.email = data?.session?.user?.email || ''; }
    if (!ME.email) return;
    const { data, error } = await sb.from('app_users').select('full_name,role,is_active').eq('email', ME.email).maybeSingle();
    if (error) throw error;
    if (data){ if (data.is_active!==false && data.role) ME.role = data.role; if (!ME.name) ME.name = data.full_name || ''; }
  }catch(e){ console.warn('権限の取得に失敗', e); }
}
</script>
