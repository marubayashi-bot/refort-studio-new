<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日報OS | EARTHCOM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1B2B; --ink-2:#2C3E52; --muted:#6B7C8F; --line:#DDE4EC;
  --paper:#F4F7FA; --card:#FFFFFF; --accent:#1F6B52; --accent-soft:#E4EFEA;
  --warn:#B4541F; --warn-soft:#FBEDE4; --amber:#C8901C;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans JP",system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;font-size:14px;line-height:1.7}
.num{font-variant-numeric:tabular-nums}
header{background:var(--ink);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
header .mark{font-size:10.5px;letter-spacing:.22em;color:#5FBFA0;font-weight:700}
header h1{font-size:16px;margin:0;font-weight:700}
header .t{display:flex;align-items:baseline;gap:14px}
nav{background:var(--ink-2);display:flex;gap:2px;padding:0 14px;overflow-x:auto}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;color:#B7C6D5;padding:11px 14px;font-size:13px;cursor:pointer;
  border-bottom:3px solid transparent;white-space:nowrap;font-family:inherit}
nav button.on{color:#fff;border-bottom-color:#5FBFA0;font-weight:700}
main{max-width:960px;margin:0 auto;padding:22px 18px 80px}
h2{font-size:14px;margin:0 0 4px;letter-spacing:.03em}
.sub{color:var(--muted);font-size:12px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 6px;font-size:13px;display:flex;align-items:center;gap:9px}
.eyebrow{font-size:10px;letter-spacing:.16em;color:var(--accent);font-weight:700}
label{display:block;font-size:11.5px;color:var(--muted);font-weight:700;margin:12px 0 4px}
input,textarea,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;
  background:#fff;font-family:inherit;font-size:14px;color:var(--ink)}
textarea{min-height:78px;resize:vertical;line-height:1.8}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
button.act{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:11px 18px;font-weight:700;
  cursor:pointer;font-family:inherit;font-size:14px}
button.act:hover{background:var(--ink-2)}
button.act:disabled{opacity:.4;cursor:default}
button.ghost{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:12px;
  cursor:pointer;font-family:inherit;color:var(--ink-2)}
button.ghost:hover{border-color:var(--accent);color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:9px;padding:11px;background:#FBFCFD}
.kpi .v{font-size:22px;font-weight:700}
.kpi .l{font-size:11px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font-size:11px;padding:2px 9px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--muted)}
.p5{background:#FBE9E7;border-color:#E3B4AE;color:#9A2E25;font-weight:700}
.p4{background:var(--warn-soft);border-color:#E7C4A6;color:var(--warn);font-weight:700}
.p3{background:#FBF5DE;border-color:#E0D191;color:#7A6510}
.p2{background:var(--accent-soft);border-color:#A9D2BE;color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
th{color:var(--muted);font-size:11px;font-weight:700}
.bar{height:6px;background:#E8EDF3;border-radius:99px;overflow:hidden;min-width:70px;flex:1}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.warn i{background:var(--warn)}
.rep{border:1px solid var(--line);border-radius:12px;background:#fff;padding:15px;margin-bottom:12px}
.rep .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.rep .nm{font-weight:700}
.sec{margin-top:10px;padding-left:11px;border-left:3px solid #E8EDF3}
.sec .lab{font-size:11px;color:var(--muted);font-weight:700}
.line{display:flex;margin-top:12px;font-size:10px;color:var(--muted)}
.line div{flex:1;text-align:center;border-top:3px solid #E8EDF3;padding-top:5px}
.line div.done{border-top-color:var(--accent);color:var(--accent);font-weight:700}
.cmt{background:#F6F9FB;border-radius:9px;padding:9px 11px;margin-top:9px;font-size:12.5px}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:10px}
.note{color:var(--muted);font-size:11.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:#fff;
  padding:10px 20px;border-radius:99px;font-size:13px;opacity:0;transition:.2s;z-index:60}
.toast.on{opacity:1}

/* --- 重要度で色分け --- */
.rep{border-left:4px solid var(--line)}
.rep.i5{border-left-color:#C0392B}
.rep.i4{border-left-color:#D9822B}
.rep.i3{border-left-color:#C8A21C}
.rep.i2{border-left-color:#5FBFA0}
.rep .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-bottom:9px;border-bottom:1px solid var(--line);margin-bottom:4px}
.rep .nm{font-weight:700;font-size:14.5px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
/* --- 項目ごとの色 --- */
.sec{border-left-width:3px;border-left-style:solid;padding:2px 0 2px 11px;margin-top:11px}
.sec .lab{display:inline-block;font-size:10.5px;letter-spacing:.06em;padding:1px 8px;border-radius:20px;margin-bottom:3px}
.s-num{border-left-color:#7A8CA6}   .s-num .lab{background:#EEF2F7;color:#48607D}
.s-voice{border-left-color:#1F6B52} .s-voice .lab{background:var(--accent-soft);color:var(--accent)}
.s-rival{border-left-color:#B4541F} .s-rival .lab{background:var(--warn-soft);color:var(--warn)}
.s-ind{border-left-color:#2F6FA8}   .s-ind .lab{background:#E7F0F8;color:#245A8C}
.s-think{border-left-color:#8A5AB8} .s-think .lab{background:#F1E9F8;color:#6B3E96}
.s-good{border-left-color:#C8901C}  .s-good .lab{background:#FBF3DE;color:#8A6410}
.s-sub{border-left-color:#5C6D86}   .s-sub .lab{background:#EEF1F5;color:#4A5A70}
.mv{display:inline-flex;align-items:baseline;gap:5px;background:#F5F8FB;border:1px solid var(--line);
  border-radius:8px;padding:4px 10px;font-size:12px}
.mv b{font-size:15px}
.mv small{color:var(--muted)}
.mv.over b{color:var(--accent)}
.mv.under b{color:var(--warn)}
/* --- KPI・見出し --- */
.kpi{background:linear-gradient(180deg,#FFFFFF 0%,#F7FAFC 100%)}
.kpi.alert{border-color:#E7C4A6;background:linear-gradient(180deg,#FFFFFF 0%,var(--warn-soft) 100%)}
h2{padding-left:11px;border-left:4px solid var(--accent)}
.card h3{padding-bottom:7px;border-bottom:1px solid var(--line)}
.lnk{color:var(--accent);text-decoration:underline;word-break:break-all}
.lnk:hover{color:#134C3A}
.sec div{word-break:break-word}
.hotrow{border-bottom:1px solid var(--line);padding:11px 10px;margin:0 -10px;cursor:pointer;border-radius:8px}
.hotrow:last-child{border-bottom:0}
.hotrow:hover{background:#F4F8FB}
.hotbody{font-size:13px;margin-top:5px;line-height:1.75;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rep.flash{box-shadow:0 0 0 3px var(--accent-soft);border-color:var(--accent)}
.lvrow{display:flex;align-items:center;gap:11px;padding:9px 10px;margin:0 -10px;border-bottom:1px solid var(--line);
  border-radius:8px;cursor:pointer}
.lvrow:last-of-type{border-bottom:0}
.lvrow:hover{background:#F4F8FB}
.lvrow.off{cursor:default;opacity:.5}
.lvrow.off:hover{background:none}
.lvn{min-width:36px;height:30px;display:flex;align-items:center;justify-content:center;
  border-radius:8px;font-size:16px;background:#EEF2F7;color:var(--muted)}
.lvrow:not(.off) .lvn.l2{background:var(--accent-soft);color:var(--accent)}
.lvrow:not(.off) .lvn.l3{background:#FBF5DE;color:#7A6510}
.lvrow:not(.off) .lvn.l4{background:var(--warn-soft);color:var(--warn)}
.lvrow:not(.off) .lvn.l5{background:#FBE9E7;color:#9A2E25}
.rep.off{border-left-color:#C8D2DE;background:#FAFCFD;padding:12px 15px}
button.ghost.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.rep.unseen{background:#FFFCF7;border-color:#E7C4A6;box-shadow:0 0 0 2px rgba(180,84,31,.08)}
.rep.unseen .head{border-bottom-color:#E7C4A6}
.onode{margin:2px 0}
.orow{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:8px;flex-wrap:wrap}
.orow:hover{background:#F4F8FB}
.orow.me{background:var(--accent-soft)}
.okids{margin-left:13px;padding-left:12px;border-left:2px solid var(--line)}
.deptbox{border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:10px;background:#FBFCFD}
.depthead{font-weight:700;font-size:13px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.pcard{display:inline-flex;flex-direction:column;gap:1px;border:1px solid var(--line);background:#fff;
  border-radius:8px;padding:6px 10px;line-height:1.4}
.pcard.me{border-color:var(--accent);background:var(--accent-soft)}
</style>
</head>
<body>
<header>
  <div class="t"><span class="mark">EARTHCOM</span><h1>日報OS</h1></div>
  <div id="userBadge"></div>
</header>
<nav id="nav"></nav>
<main id="view"><div class="empty">読み込み中</div></main>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./ec-auth.js"></script>
<script>
let GRADES = ['一般','主任','係長','課長','次長','部門長','役員・経営'];  // 起動時にDBから読み直す
const IMP = [
  [5,'経営判断が必要','p5'], [4,'上司判断が必要','p4'],
  [3,'部署で共有','p3'],     [2,'記録のみ','p2']
];
const LEVELS = ['LEVEL1 個人日報','LEVEL2 チーム課題','LEVEL3 部署課題','LEVEL4 全社課題','LEVEL5 経営判断'];
const BASE_TABS = [['write','日報を書く'],['feed','日報一覧'],['status','提出・確認状況'],['dash','ダッシュボード']];
const AI_TABS   = [['ai','AI分析'],['search','AI検索'],['meeting','会議資料']];
const TAIL_TABS = [['todo','実行管理'],['guide','使い方']];
let TABS = BASE_TABS.concat(TAIL_TABS);

let ME = null;          // app_users の自分の行
let USERS = [];         // 在籍者
let ALL_USERS = [];     // 退職者を含む全員
let METRICS = [];       // 自部署の数値項目（入力用）
let METRICS_ALL = [];   // 全部署の項目（表示用）
let REPORTS = [];       // 閲覧できる日報
let TAB = 'write';
let TODAY = new Date().toISOString().slice(0,10);
let EDIT_DATE = null;   // 過去の日報を編集しているときの日付
let LOAD_SAVED = false; // 提出済みの内容を読み込んで書き直すとき true
let DEPTS = [];
/* AIの利用範囲：役職で決まる。ec-users側の個別設定(ai_access)があればそちらが優先 */
function aiAccess(){
  const ov = ME.ai_access;
  if (ov === 'none') return 'none';
  if (ov === 'manager') return 'manager';
  if (ov === 'exec') return 'exec';
  if (ME.job_grade === '役員・経営') return 'exec';
  if (['次長','部長'].includes(ME.job_grade) || isDeptHead()) return 'manager';
  return 'none';
}
function canUseAI(){ return aiAccess() !== 'none'; }
function allowedLayers(){
  const a = aiAccess();
  if (a === 'exec') return ['personal','boss','dept','company','exec'];
  if (a === 'manager') return ['personal','boss','dept'];
  return [];
}
/* 部門長は役職ではなく「その部署を任されている人」。課長でも係長でも就ける */
function isDeptHead(uid){ return DEPTS.some(d => d.head_user_id === (uid || ME.id)); }
function headOfDept(deptId){ const d = DEPTS.find(x => x.id === deptId); return d ? d.head_user_id : null; }
function canAdmin(){ return ME.role === 'admin' || ['次長','部長','役員・経営'].includes(ME.job_grade) || isDeptHead(); }

/* ---------- 起動 ---------- */
EC.guard({
  app:  'nippo',
  name: '日報OS',
  allow: ['admin','manager','sales','field']
}).then(async () => {
  EC.mountBadge('#userBadge');
  await boot();
});

async function boot(){
  const meId = EC.me ? EC.me.id : null;
  const email = EC.me ? EC.me.email : null;

  const { data: us, error: ue } = await EC.supabase
    .from('app_users')
    .select('id,email,full_name,dept_name,department_id,manager_id,job_grade,exec_watch,is_active,role,ai_access')
    ;
  if (ue) { fail('社員情報を読み込めませんでした: ' + ue.message); return; }
  ALL_USERS = us || [];
  USERS = ALL_USERS.filter(u => u.is_active !== false);
  ME = USERS.find(u => u.id === meId)
    || USERS.find(u => email && u.email.toLowerCase() === email.toLowerCase());
  if (!ME) { fail('あなたの社員情報が見つかりません。管理者に連絡してください。'); return; }

  const { data: ma } = await EC.supabase.from('report_metrics')
    .select('id,name,unit,target,department_id,job_grades').order('sort_order');
  METRICS_ALL = ma || [];

  const { data: gs } = await EC.supabase.from('job_grades')
    .select('name,sort_order').eq('is_active', true).order('sort_order');
  if (gs && gs.length) GRADES = gs.map(g => g.name);

  const { data: ds, error: de } = await EC.supabase.from('departments')
    .select('id,name,sort_order,head_user_id').order('sort_order');
  DEPTS = ds || [];
  if (de) console.warn('departments 読み込みエラー', de.message);
  if (!DEPTS.length){
    const seen = {};
    USERS.forEach(u => { if (u.department_id && !seen[u.department_id]){
      seen[u.department_id] = true; DEPTS.push({ id: u.department_id, name: u.dept_name || '(部署)' }); } });
  }

  if (ME.department_id) {
    const { data: ms } = await EC.supabase.from('report_metrics')
      .select('id,name,unit,target,is_required,sort_order,job_grades,user_id')
      .eq('department_id', ME.department_id).eq('is_active', true).order('sort_order');
    const dept = (ms || []).filter(m => !m.user_id).filter(metricAppliesToMe);
    const { data: mine } = await EC.supabase.from('report_metrics')
      .select('id,name,unit,target,is_required,sort_order,job_grades,user_id')
      .eq('user_id', ME.id).eq('is_active', true).order('sort_order');
    METRICS = dept.concat(mine || []);
  }
  await loadGoals();
  await loadReports();
  if (OPEN_ID) TAB = 'feed';
  render();
}

async function loadReports(fromDate){
  const since = new Date(); since.setDate(since.getDate() - 30);
  if (fromDate && fromDate < since.toISOString().slice(0,10)) {
    LOAD_FROM = fromDate;
  } else if (!LOAD_FROM || since.toISOString().slice(0,10) < LOAD_FROM) {
    LOAD_FROM = since.toISOString().slice(0,10);
  }
  const { data, error } = await EC.supabase.from('daily_reports')
    .select('*, report_metric_values(metric_id,value), report_comments(id,author_id,body,created_at,read_at), report_views(viewer_id,viewed_at)')
    .gte('report_date', LOAD_FROM)
    .order('report_date', { ascending: false });
  if (error) { toast('日報の読み込みに失敗: ' + error.message); REPORTS = []; return; }
  REPORTS = data || [];
}

function fail(msg){ document.getElementById('view').innerHTML = `<div class="empty">${esc(msg)}</div>`; }

/* ---------- 画面枠 ---------- */
function render(){
  const nUnread = myNotifs().length;
  const canWeekly = ['次長','部長','役員・経営'].includes(ME.job_grade) || isDeptHead() || QGOALS.length > 0;
  TABS = [['write','日報を書く'],['feed','日報一覧']]
    .concat(canWeekly ? [['weekly','週次報告']] : [])
    .concat([
          ['notify', '通知' + (nUnread ? '（' + nUnread + '）' : '')],
          ['status','提出・確認状況'],['dash','ダッシュボード'],['result','実績一覧']])
         .concat(canUseAI() ? AI_TABS : []).concat(TAIL_TABS);
  const tabs = TABS.concat([['admin','管理']]);
  if (!TABS.some(t => t[0] === TAB) && TAB !== 'admin') TAB = 'write';
  document.getElementById('nav').innerHTML = tabs.map(([k,t]) =>
    `<button class="${TAB===k?'on':''}" onclick="go('${k}')">${t}</button>`).join('');
  document.getElementById('view').innerHTML =
    ({ write:vWrite, feed:vFeed, weekly:vWeekly, notify:vNotify, status:vStatus, dash:vDash, result:vResult, ai:vAI, search:vSearch, meeting:vMeeting, todo:vTodo, guide:vGuide, admin:vAdmin })[TAB]();
}
function go(k){ TAB = k; render(); window.scrollTo(0,0); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'), 2200); }
/* 本文中のURLをクリックできるリンクにする（エスケープ後に適用するので安全） */
function linkify(text){
  return esc(text).replace(/(https?:\/\/[^\s<>"'）」、]+)/g,
    '<a href="$1" target="_blank" rel="noopener noreferrer" class="lnk">$1</a>');
}
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function uname(id){ const u = USERS.find(x=>x.id===id); return u ? (u.full_name || u.email) : '—'; }
function udept(id){ const u = USERS.find(x=>x.id===id); return u ? (u.dept_name || '') : ''; }
function impMeta(v){ return IMP.find(i => i[0] === v) || IMP[3]; }
function isBossOf(uid){ const u = USERS.find(x=>x.id===uid); return u && u.manager_id === ME.id; }
function isExec(){ return ME.job_grade === '役員・経営'; }

/* ---------- 1. 日報を書く ---------- */
function vWrite(){
  const day = EDIT_DATE || TODAY;
  const saved = REPORTS.find(r => r.author_id === ME.id && r.report_date === day);
  // 編集を選んだとき、または「読み込む」を押したときだけ内容を差し込む
  const mine = (EDIT_DATE || LOAD_SAVED) ? saved : null;
  const v = f => mine ? esc(mine[f] || '') : '';
  const mv = id => { if (!mine) return '';
    const f = (mine.report_metric_values||[]).find(x => x.metric_id === id); return f ? f.value : ''; };
  return `
  <h2>${esc(ME.full_name)} さんの日報</h2>
  <p class="sub">${day}　${esc(ME.dept_name||'')}　${saved ? (saved.status === 'off' ? '休みとして登録済み' : '提出済み') : '未提出'}</p>
  ${saved && !mine && saved.status !== 'off' ? `<div class="card" style="background:var(--warn-soft);border-color:#E7C4A6">
    <b>この日はすでに提出済みです</b>
    <p class="note" style="margin-top:4px">このまま書いて提出すると、提出済みの内容は新しい内容に置き換わります。
      前の内容を直したい場合は、読み込んでから修正してください。</p>
    <div class="row" style="margin-top:8px">
      <button class="ghost" onclick="LOAD_SAVED=true;render()">提出済みの内容を読み込む</button>
      <button class="ghost" onclick="go('feed')">提出済みの日報を見る</button>
    </div></div>` : ''}
  ${EDIT_DATE ? `<div class="card" style="background:var(--warn-soft);border-color:#E7C4A6">
    <b>${EDIT_DATE} の日報を編集しています</b>
    <div class="row" style="margin-top:8px">
      <button class="ghost" onclick="EDIT_DATE=null;LOAD_SAVED=false;render()">本日の日報に戻る</button></div></div>` : ''}

  ${METRICS.length ? `<div class="card"><h3><span class="eyebrow">必須 01</span>数値情報</h3>
    <div class="grid">${METRICS.map(m => `
      <div><label>${esc(m.name)}（${esc(m.unit)}）　目標 ${m.target ?? '—'}</label>
      <input type="number" step="any" id="mt_${m.id}" value="${mv(m.id)}" placeholder="0"></div>`).join('')}
    </div></div>` : `<div class="card"><h3>数値情報</h3>

      ? `<div class="row" style="margin-top:10px"><span class="pill p2">この日は「休み」で登録済みです</span>

      : `<button class="ghost" style="margin-top:10px" onclick="markDayOff()">この日は休みだった</button>`}

function futureOff(){
  return REPORTS.filter(r => r.author_id === ME.id && r.status === 'off' && r.report_date >= TODAY)
    .sort((a,b) => a.report_date.localeCompare(b.report_date));
}
async function markRangeOff(){
  const f = (document.getElementById('off_from')||{}).value;
  const t = (document.getElementById('off_to')||{}).value || f;
  if (!f){ toast('開始日を選んでください'); return; }
  if (t < f){ toast('終了日が開始日より前になっています'); return; }
  const rows = [];
  for (let d = new Date(f); d <= new Date(t); d.setDate(d.getDate() + 1)){
    rows.push({ author_id: ME.id, report_date: d.toISOString().slice(0,10),
                status: 'off', importance: 2 });
  }
  if (rows.length > 62){ toast('一度に登録できるのは2か月分までです'); return; }
  if (!confirm(f + ' 〜 ' + t + ' の ' + rows.length + '日間を休みとして登録します。よろしいですか。')) return;
  const { error } = await EC.supabase.from('daily_reports')
    .upsert(rows, { onConflict: 'author_id,report_date' });
  if (error){ toast('登録できませんでした: ' + error.message); return; }
  await loadReports(); render(); toast(rows.length + '日分を休みで登録しました');
}

async function markDayOff(){
  const day = EDIT_DATE || TODAY;
  if (!confirm(day + ' を「休み」として登録します。よろしいですか。')) return;
  const { error } = await EC.supabase.from('daily_reports').upsert(
    { author_id: ME.id, report_date: day, status: 'off', importance: 2 },
    { onConflict: 'author_id,report_date' });
  if (error){ toast('登録できませんでした: ' + error.message); return; }
  await loadReports(); EDIT_DATE = null; toast('休みとして登録しました'); go('feed');
}
async function undoDayOff(id){
  const { error } = await EC.supabase.from('daily_reports').delete().eq('id', id);
  if (error){ toast('取り消せませんでした: ' + error.message); return; }
  await loadReports(); render(); toast('取り消しました');
}

async function submitReport(scheduled){
  const btn = document.getElementById('submitBtn');
  const pub = scheduled ? (document.getElementById('f_publish') || {}).value : '';
  if (scheduled && !pub){ toast('提出したい日時を選んでください'); return; }
  const g = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const day = EDIT_DATE || TODAY;
  const body = {
    author_id: ME.id, report_date: day,
    voice: g('f_voice'), rival: g('f_rival'), industry: g('f_industry'),
    thought: g('f_thought'), good_news: g('f_good'), subordinate: g('f_sub'),
    attachments: g('f_attach') ? [g('f_attach')] : [],
    importance: Number(g('f_imp')) || 2,
    status: scheduled ? 'scheduled' : 'submitted',
    publish_at: scheduled ? new Date(pub).toISOString() : null
  };
  if (!body.voice && !body.thought){ toast('お客様の声か、自分の考えのどちらかは入力してください'); return; }

  btn.disabled = true; btn.textContent = '送信中';
  const { data, error } = await EC.supabase.from('daily_reports')
    .upsert(body, { onConflict: 'author_id,report_date' }).select().single();
  if (error){ btn.disabled = false; btn.textContent = '提出する'; toast('保存できませんでした: ' + error.message); return; }

  const vals = METRICS.map(m => ({ report_id: data.id, metric_id: m.id, value: Number(g('mt_' + m.id)) }))
    .filter(x => !Number.isNaN(x.value) && document.getElementById('mt_' + x.metric_id).value !== '');
  if (vals.length) await EC.supabase.from('report_metric_values').upsert(vals);

  await loadReports();
  toast(scheduled ? '予約しました。指定時刻に自動で提出されます'
                  : (EDIT_DATE ? '更新しました' : '提出しました'));
  EDIT_DATE = null; LOAD_SAVED = false;
  go('feed');
}

/* ---------- 昇格レベルで絞り込む ---------- */
let LEVEL_FILTER = 0;
let FEED_FILTER = '';   // '' すべて / 'direct' 直属部下 / 役職名
let FEED_FROM = '', FEED_TO = '', FEED_USER = '', FEED_DEPT = '';
let LOAD_FROM = '';     // 読み込み済みの最古日
let OPEN_ID = (new URLSearchParams(location.search)).get('r') || '';
function showLevel(n){ LEVEL_FILTER = n; OPEN_ID = ''; TAB = 'feed'; render(); window.scrollTo(0,0); }
function clearLevel(){ LEVEL_FILTER = 0; render(); }

/* 自分から見た近さで並べる（直属部下を先頭に） */
function lineRank(uid){
  if (USERS.some(u => u.id === uid && u.manager_id === ME.id)) return 0;  // 直属部下
  if (inMyLine(uid)) return 1;                                            // 配下（孫以降）
  if (uid === ME.id) return 2;                                            // 自分
  return 3;
}
function inMyLine(uid){
  let cur = USERS.find(u => u.id === uid), depth = 0;
  while (cur && cur.manager_id && depth < 10){
    if (cur.manager_id === ME.id) return true;
    cur = USERS.find(u => u.id === cur.manager_id); depth++;
  }
  return false;
}
function sortFeed(list){
  return list.slice().sort((a,b) =>
    lineRank(a.author_id) - lineRank(b.author_id) ||
    b.report_date.localeCompare(a.report_date) ||
    (uname(a.author_id)).localeCompare(uname(b.author_id), 'ja'));
}
async function applyFeedRange(){
  FEED_FROM = (document.getElementById('ff_from')||{}).value || '';
  FEED_TO   = (document.getElementById('ff_to')||{}).value || '';
  FEED_DEPT = (document.getElementById('ff_dept')||{}).value || '';
  FEED_USER = (document.getElementById('ff_user')||{}).value || '';
  OPEN_ID = ''; LEVEL_FILTER = 0;
  if (FEED_FROM && FEED_FROM < LOAD_FROM){ toast('過去の日報を読み込んでいます…'); await loadReports(FEED_FROM); }
  render(); window.scrollTo(0,0);
}
function clearFeedRange(){
  FEED_FROM = FEED_TO = FEED_DEPT = FEED_USER = ''; FEED_FILTER = ''; render();
}
function setFeedFilter(v){ FEED_FILTER = v; LEVEL_FILTER = 0; OPEN_ID = ''; render(); window.scrollTo(0,0); }


/* ---------- 通知（自分あての未読コメント） ---------- */
function myNotifs(){
  const out = [];
  REPORTS.forEach(r => {
    (r.report_comments || []).forEach(c => {
      if (c.read_at) return;
      if (c.author_id === ME.id) return;                    // 自分が書いたものは除く
      const isMine = r.author_id === ME.id;                 // 自分の日報へのコメント
      const isReplyToMe = c.author_id === r.author_id &&     // 部下からの返信
        USERS.some(u => u.id === r.author_id && u.manager_id === ME.id);
      if (isMine || isReplyToMe) out.push({ c: c, r: r });
    });
  });
  return out.sort((a,b) => String(b.c.created_at).localeCompare(String(a.c.created_at)));
}

function vNotify(){
  const list = myNotifs();
  const read = REPORTS.flatMap(r => (r.report_comments || [])
    .filter(c => c.read_at && c.author_id !== ME.id &&
      (r.author_id === ME.id ||
       USERS.some(u => u.id === r.author_id && u.manager_id === ME.id)))
    .map(c => ({ c: c, r: r })))
    .sort((a,b) => String(b.c.created_at).localeCompare(String(a.c.created_at))).slice(0, 10);

  return `<h2>通知</h2>
  <p class="sub">自分の日報についたコメントと、部下からの返信が届きます。</p>
  ${list.length ? `<div class="row" style="margin-bottom:12px">
      <button class="ghost" onclick="markAllRead()">すべて既読にする</button></div>` : ''}
  <div class="card"><h3>未読 ${list.length}件</h3>
    ${list.length ? list.map(x => notifRow(x, false)).join('')
      : '<div class="empty">未読の通知はありません。</div>'}</div>
  ${read.length ? `<div class="card"><h3>既読</h3>
    ${read.map(x => notifRow(x, true)).join('')}</div>` : ''}`;
}

function notifRow(x, isRead){
  const c = x.c, r = x.r;
  return `<div class="hotrow" onclick="openNotif('${c.id}','${r.id}')">
    <div class="row" style="gap:7px">
      ${isRead ? '' : '<span class="pill p4">未読</span>'}
      <b>${esc(uname(c.author_id))}</b>
      <span class="note">${esc(uname(r.author_id))}さんの${r.report_date}の日報へ</span>
      <span class="note num" style="margin-left:auto">${(c.created_at||'').slice(5,16).replace('T',' ')}</span>
    </div>
    <div class="hotbody">${esc(c.body)}</div></div>`;
}

async function openNotif(commentId, reportId){
  await EC.supabase.from('report_comments')
    .update({ read_at: new Date().toISOString() }).eq('id', commentId);
  await loadReports();
  OPEN_ID = reportId; LEVEL_FILTER = 0; FEED_FILTER = ''; TAB = 'feed';
  render(); window.scrollTo(0,0);
}

async function markAllRead(){
  const ids = myNotifs().map(x => x.c.id);
  if (!ids.length) return;
  const { error } = await EC.supabase.from('report_comments')
    .update({ read_at: new Date().toISOString() }).in('id', ids);
  if (error){ toast('更新できませんでした: ' + error.message); return; }
  await loadReports(); render(); toast('すべて既読にしました');
}

/* ---------- 2. 日報一覧 ---------- */
function vFeed(){
  if (OPEN_ID) {
    const one = REPORTS.find(r => r.id === OPEN_ID || r.id.slice(0,8) === OPEN_ID);
    if (one) return `<h2>日報一覧</h2>
      <div class="card" style="background:var(--accent-soft);border-color:#A9D2BE;padding:11px 14px">
        <div class="row"><b>${esc(uname(one.author_id))} さんの ${one.report_date} の日報</b>
        <button class="ghost" style="margin-left:auto" onclick="OPEN_ID='';render()">すべての日報を見る</button></div>
      </div>` + card(one);
    return `<h2>日報一覧</h2>
      <div class="card"><p class="note">指定された日報が見つかりません。
        閲覧できる範囲外か、30日より前の日報の可能性があります。</p>
        <button class="ghost" onclick="OPEN_ID='';render()">すべての日報を見る</button></div>`;
  }
  let list = LEVEL_FILTER ? REPORTS.filter(r => r.level === LEVEL_FILTER) : REPORTS;
  if (FEED_FROM) list = list.filter(r => r.report_date >= FEED_FROM);
  if (FEED_TO)   list = list.filter(r => r.report_date <= FEED_TO);
  if (FEED_DEPT) list = list.filter(r => udept(r.author_id) === FEED_DEPT);
  if (FEED_USER) list = list.filter(r => r.author_id === FEED_USER);
  if (FEED_FILTER === 'direct')
    list = list.filter(r => USERS.some(u => u.id === r.author_id && u.manager_id === ME.id));
  else if (FEED_FILTER === 'unchecked')
    list = list.filter(r => r.author_id !== ME.id
      && !(r.report_views || []).some(v => v.viewer_id === ME.id));
  else if (FEED_FILTER)
    list = list.filter(r => (USERS.find(u => u.id === r.author_id) || {}).job_grade === FEED_FILTER);
  list = sortFeed(list);

  const nDirect = REPORTS.filter(r => USERS.some(u => u.id === r.author_id && u.manager_id === ME.id)).length;
  const chip = (v, label, n) => `<button class="ghost${FEED_FILTER===v?' on':''}"
    onclick="setFeedFilter('${v}')">${label}${n !== undefined ? '（' + n + '）' : ''}</button>`;
  const grades = GRADES.slice().reverse();
  const bar = `<div class="row" style="margin-bottom:12px">
    ${chip('', 'すべて', REPORTS.length)}
    ${nDirect ? chip('direct', '直属部下', nDirect) : ''}
    ${chip('unchecked', '未確認', REPORTS.filter(r => r.author_id !== ME.id
        && !(r.report_views||[]).some(v => v.viewer_id === ME.id)
        && (isBossOf(r.author_id) || isExec() || ['部長','次長'].includes(ME.job_grade) || isDeptHead())).length)}
    ${(isExec() || canAdmin()) ? grades.map(g => {
        const n = REPORTS.filter(r => (USERS.find(u => u.id === r.author_id) || {}).job_grade === g).length;
        return n ? chip(g, g, n) : ''; }).join('') : ''}
  </div>`;

  const finder = `<div class="card" style="padding:12px 14px">
    <div class="grid" style="gap:8px">
      <div><label>開始日</label><input type="date" id="ff_from" value="${FEED_FROM}"></div>
      <div><label>終了日</label><input type="date" id="ff_to" value="${FEED_TO}"></div>
      <div><label>部署</label><select id="ff_dept">
        <option value="">すべて</option>
        ${DEPTS.map(d => `<option value="${esc(d.name)}"${FEED_DEPT===d.name?' selected':''}>${esc(d.name)}</option>`).join('')}
      </select></div>
      <div><label>社員</label><select id="ff_user">
        <option value="">すべて</option>
        ${USERS.slice().sort((a,b)=>(a.full_name||'').localeCompare(b.full_name||'','ja'))
          .map(u => `<option value="${u.id}"${FEED_USER===u.id?' selected':''}>${esc(u.full_name)}</option>`).join('')}
      </select></div>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="act" style="padding:8px 16px;font-size:13px" onclick="applyFeedRange()">この条件で表示</button>
      <button class="ghost" onclick="clearFeedRange()">条件をクリア</button>
      ${(FEED_FROM||FEED_TO||FEED_USER||FEED_DEPT) ? `<span class="note">絞り込み中：
        ${FEED_FROM||'最古'}〜${FEED_TO||'最新'}${FEED_DEPT?'／'+esc(FEED_DEPT):''}${FEED_USER?'／'+esc(uname(FEED_USER)):''}</span>` : ''}
    </div></div>`;

  const head = `<h2>日報一覧</h2>` + finder + bar + (LEVEL_FILTER
    ? `<div class="card" style="background:var(--accent-soft);border-color:#A9D2BE;padding:11px 14px">
        <div class="row"><b>${LEVELS[LEVEL_FILTER-1]}</b>
        <span class="note">${list.length}件</span>
        <button class="ghost" style="margin-left:auto" onclick="clearLevel()">絞り込みを解除</button></div></div>`
    : `<p class="sub">直近30日／直属部下を先頭に表示しています</p>`);
  if (!list.length) return head + '<div class="empty">該当する日報がありません。</div>';
  return head + list.map(card).join('');
}

function card(r){
  const m = impMeta(r.importance);
  const seen = (r.report_views || []).length;
  const cmts = r.report_comments || [];
  const isMine = r.author_id === ME.id;
  const canAct = isBossOf(r.author_id) || isExec() || ['部長','次長'].includes(ME.job_grade)
                 || (isDeptHead() && headOfDept(USERS.find(u => u.id === r.author_id)?.department_id) === ME.id);
  const iSaw  = (r.report_views || []).some(v => v.viewer_id === ME.id);
  const isDirect = USERS.some(u => u.id === r.author_id && u.manager_id === ME.id);
  const needCheck = !isMine && !iSaw && (isDirect || canAct);
  const vals = r.report_metric_values || [];
  const who = uname(r.author_id);
  if (r.status === 'scheduled') return `<div class="rep off" id="rep_${r.id}">
    <div class="row"><span class="avatar">${esc(who.slice(0,1))}</span>
      <span class="nm">${esc(who)}</span><span class="note num">${r.report_date}</span>
      <span class="pill p3" style="margin-left:auto">予約中 ${r.publish_at ? hhmm(r.publish_at) : ''}</span></div>
    ${r.author_id === ME.id ? `<div class="row" style="margin-top:9px">
      <button class="ghost" onclick="editReport('${r.id}')">編集</button>
      <button class="ghost" onclick="deleteReport('${r.id}','${r.report_date}')">取り消す</button></div>` : ''}
  </div>`;
  if (r.status === 'off') return `<div class="rep off" id="rep_${r.id}">
    <div class="row"><span class="avatar">${esc(who.slice(0,1))}</span>
      <span class="nm">${esc(who)}</span><span class="pill">${esc(udept(r.author_id))}</span>
      <span class="note num">${r.report_date}</span>
      <span class="pill p2" style="margin-left:auto">休み</span></div>
    ${r.author_id === ME.id ? `<div class="row" style="margin-top:9px">
      <button class="ghost" onclick="undoDayOff('${r.id}')">取り消す</button></div>` : ''}
  </div>`;
  return `<div class="rep i${r.importance}${needCheck ? ' unseen' : ''}" id="rep_${r.id}">
    <div class="head">
      ${needCheck ? `<span class="pill p4">${isDirect ? '直属部下・未確認' : '未確認'}</span>` : ''}
      <span class="avatar">${esc(who.slice(0,1))}</span>
      <span class="nm">${esc(who)}</span>
      <span class="pill">${esc(udept(r.author_id))}</span>
      <span class="note num">${r.report_date}${r.submitted_at ? ' ' + hhmm(r.submitted_at) : ''}</span>
      <span class="pill ${m[2]}" style="margin-left:auto">${m[1]}</span>
      ${r.level > 1 ? `<span class="pill p5" style="cursor:pointer"
        onclick="showLevel(${r.level})" title="同じレベルの日報を見る">${LEVELS[r.level-1]}</span>` : ''}
    </div>
    ${vals.length ? `<div class="sec s-num"><span class="lab">数値</span><div class="row num" style="gap:14px">
      ${vals.map(v => { const mm = METRICS_ALL.find(x=>x.id===v.metric_id) || METRICS.find(x=>x.id===v.metric_id);
        return mm ? `<span class="mv">${esc(mm.name)}<b>${v.value}</b><small>${esc(mm.unit)}</small></span>`
                  : `<span class="mv"><b>${v.value}</b></span>`; }).join('')}
    </div></div>` : ''}
    ${r.voice ? `<div class="sec s-voice"><span class="lab">お客様の声</span><div>${linkify(r.voice)}</div></div>` : ''}
    ${r.rival ? `<div class="sec s-rival"><span class="lab">ライバル</span><div>${linkify(r.rival)}</div></div>` : ''}
    ${r.industry ? `<div class="sec s-ind"><span class="lab">本部・業界</span><div>${linkify(r.industry)}</div></div>` : ''}
    ${r.thought ? `<div class="sec s-think"><span class="lab">本人の考え</span><div>${linkify(r.thought)}</div></div>` : ''}

/* ---------- AI共通 ---------- */
async function callAI(prompt, maxTokens){
  const { data, error } = await EC.supabase.functions.invoke('ai', {
    body: { prompt, max_tokens: maxTokens || 2000 }
  });
  if (error) return { error: error.message || 'AIの呼び出しに失敗しました' };
  if (data && data.error) return { error: data.error };
  return { text: (data && data.text) || '' };
}
function parseJSON(t){
  if (!t) return null;
  try {
    const s = t.replace(/```json|```/g, '').trim();
    return JSON.parse(s.slice(s.indexOf('{'), s.lastIndexOf('}') + 1));
  } catch (e) { return null; }
}
function salvage(t){
  if (!t) return null;
  const out = [];
  const re = /"fact"\s*:\s*"((?:[^"\\]|\\.)*)"\s*,\s*"analysis"\s*:\s*"((?:[^"\\]|\\.)*)"\s*,\s*"proposal"\s*:\s*"((?:[^"\\]|\\.)*)"/g;
  let m;
  while ((m = re.exec(t)) !== null){
    const un = (x) => x.replace(/\\n/g, '\n').replace(/\\"/g, '"').replace(/\\\\/g, '\\');
    out.push({ fact: un(m[1]), analysis: un(m[2]), proposal: un(m[3]), who: [] });
  }
  return out.length ? out : null;
}
function cut(s, n){ return s ? String(s).replace(/\s+/g,' ').slice(0, n) : ''; }
function packReports(list, days, len){
  const from = new Date(); from.setDate(from.getDate() - (days || 21));
  const f = from.toISOString().slice(0,10);
  return list.filter(r => r.report_date >= f).slice(0, 160).map(r => ({
    id: r.id.slice(0,8), who: uname(r.author_id), dept: udept(r.author_id), date: r.report_date,
    voice: cut(r.voice, len||300), rival: cut(r.rival, len||300),
    industry: cut(r.industry, len||200), thought: cut(r.thought, len||300),
    good: cut(r.good_news, 120), imp: r.importance
  }));
}

      .insert({ title: it.proposal.slice(0,200), owner_id: ME.id, created_by: ME.id, source: 'ai' });

    res = await EC.supabase.from('meeting_agenda')
      .insert({ body: it.proposal.slice(0,500), created_by: ME.id, meeting_type: '経営会議' });
  if (kind === 'knowledge')

      .insert({ title: cut(it.analysis, 60), body: it.analysis + '\n\n【提案】' + it.proposal, created_by: ME.id });

}

  return `<h2>実行管理</h2>
  <p class="sub">日報とAI提案から生まれたものが、実行されるまで追いかけます。</p>
  <div id="todoBox"><div class="empty">読み込み中…</div></div>`;
}
async function loadTodos(){
  const [t, a, k] = await Promise.all([
    EC.supabase.from('report_tasks').select('*').order('created_at', { ascending: false }).limit(60),
    EC.supabase.from('meeting_agenda').select('*').order('created_at', { ascending: false }).limit(40),
    EC.supabase.from('knowledge_items').select('*').order('created_at', { ascending: false }).limit(40)
  ]);
  const err = (t.error || a.error || k.error);
  const box = document.getElementById('todoBox');
  if (!box) return;
  if (err){ box.innerHTML = `<div class="empty">読み込めませんでした：${esc(err.message)}</div>`; return; }
  TODOS = { tasks: t.data || [], agenda: a.data || [], knowledge: k.data || [] };
  const open = TODOS.tasks.filter(x => x.status !== 'done');
  const done = TODOS.tasks.filter(x => x.status === 'done');
  box.innerHTML = `
  <div class="grid">
    <div class="kpi"><div class="v num">${open.length}</div><div class="l">未完了タスク</div></div>
    <div class="kpi"><div class="v num">${TODOS.agenda.length}</div><div class="l">会議議題</div></div>
    <div class="kpi"><div class="v num">${TODOS.knowledge.length}</div><div class="l">ナレッジ</div></div>
  </div>
  <div class="card"><h3>タスク</h3>
    ${open.length ? open.map(x => `<div style="border-bottom:1px solid var(--line);padding:9px 0;font-size:13px">
      <label style="display:flex;gap:9px;align-items:flex-start;margin:0;color:var(--ink);font-weight:400;font-size:13px">
        <input type="checkbox" style="width:auto;margin-top:4px" onchange="doneTask('${x.id}')">
        <span>${esc(x.title)}<br><span class="note">${x.source === 'ai' ? 'AI提案' : '日報'}／${uname(x.owner_id)}／${(x.created_at||'').slice(0,10)}</span></span>
      </label></div>`).join('') : '<div class="empty">未完了のタスクはありません。</div>'}
    ${done.length ? `<p class="note" style="margin-top:12px">完了済み ${done.length}件</p>` : ''}
  </div>
  <div class="card"><h3>会議議題</h3>
    ${TODOS.agenda.length ? TODOS.agenda.map(x => `<div class="cmt">
      <span class="pill">${esc(x.meeting_type || '会議')}</span> ${esc(x.body)}
      <br><span class="note">${uname(x.created_by)}／${(x.created_at||'').slice(0,10)}</span></div>`).join('')
      : '<div class="empty">まだありません。AI分析の提案から追加できます。</div>'}
  </div>
  <div class="card"><h3>ナレッジ</h3>
    ${TODOS.knowledge.length ? TODOS.knowledge.map(x => `<div class="cmt">
      <b>${esc(x.title || '')}</b><br>${esc(x.body)}
      <br><span class="note">${(x.created_at||'').slice(0,10)}</span></div>`).join('')
      : '<div class="empty">まだありません。</div>'}
  </div>`;
}
async function doneTask(id){
  const { error } = await EC.supabase.from('report_tasks')
    .update({ status: 'done', done_at: new Date().toISOString() }).eq('id', id);
  if (error){ toast('更新できませんでした: ' + error.message); return; }
  toast('完了にしました'); loadTodos();
}



/* 数値項目の対象役職（プリセット） */
const SCOPES = [
  ['all','全員', null],
  ['staff','一般のみ', ['一般']],
  ['leader','リーダー・課長', ['リーダー','課長']],
  ['kacho','課長以上', ['課長','次長','部門長','役員・経営']],
  ['head','次長・部門長以上', ['次長','部門長','役員・経営']]
];
function scopeKey(arr){
  if (!arr || !arr.length) return 'all';
  const hit = SCOPES.find(s => s[2] && s[2].length === arr.length && s[2].every(g => arr.includes(g)));
  return hit ? hit[0] : 'all';
}
function scopeLabel(arr){ const k = scopeKey(arr); return (SCOPES.find(s => s[0] === k) || SCOPES[0])[1]; }
function scopeValue(key){ return (SCOPES.find(s => s[0] === key) || SCOPES[0])[2]; }
function metricAppliesToMe(m){
  return !m.job_grades || !m.job_grades.length || m.job_grades.includes(ME.job_grade);
}

async function loadAdminMetrics(){
  const box = document.getElementById('adList'); if (!box) return;
  if (!ADMIN_DEPT){ box.innerHTML = '<div class="empty" style="margin-top:12px">部署が選べません。管理者にご連絡ください。</div>'; return; }
  const memberIds = USERS.filter(u => u.department_id === ADMIN_DEPT).map(u => u.id);
  const { data, error } = await EC.supabase.from('report_metrics')
    .select('*').eq('is_active', true).order('sort_order');
  if (error){ box.innerHTML = `<p class="note">読み込めませんでした：${esc(error.message)}</p>`; return; }
  ADMIN_METRICS = (data || []).filter(m =>
    (!m.user_id && m.department_id === ADMIN_DEPT) || (m.user_id && memberIds.indexOf(m.user_id) >= 0));
  box.innerHTML = ADMIN_METRICS.length
    ? `<table style="margin-top:12px"><tr><th>項目</th><th>対象</th><th>単位</th><th>目標</th><th>入力する層</th><th></th></tr>
       ${ADMIN_METRICS.map(m => `<tr>
         <td>${esc(m.name)}</td>
         <td class="note">${m.user_id ? esc(uname(m.user_id)) + ' 専用' : '部署全体'}</td>
         <td>${esc(m.unit)}</td>
         <td><input type="number" step="any" value="${m.target ?? ''}" style="width:80px;padding:5px"
              onchange="setTarget('${m.id}',this.value)"></td>
         <td>${m.user_id ? '<span class="note">—</span>' : `<select style="padding:5px;font-size:12px" onchange="setScope('${m.id}',this.value)">`}
              ${m.user_id ? '' : SCOPES.map(sc => `<option value="${sc[0]}"${scopeKey(m.job_grades)===sc[0]?' selected':''}>${sc[1]}</option>`).join('')}
             ${m.user_id ? '' : '</select>'}</td>
         <td><button class="ghost" onclick="delMetric('${m.id}','${esc(m.name)}')">削除</button></td></tr>`).join('')}
       </table>
       <p class="note" style="margin-top:8px">「入力する層」で選んだ役職の社員にだけ、その項目が日報画面に出ます。</p>`
    : '<div class="empty" style="margin-top:12px">この部署にはまだ数値項目がありません。</div>';
}
async function addMetric(){
  const name = document.getElementById('ad_name').value.trim();
  if (!name){ toast('項目名を入力してください'); return; }
  const uid = (document.getElementById('ad_user') || {}).value || null;
  const target = uid ? (USERS.find(u => u.id === uid) || {}).department_id : null;
  const { error } = await EC.supabase.from('report_metrics').insert({
    department_id: uid ? (target || ADMIN_DEPT) : ADMIN_DEPT, name,
    unit: document.getElementById('ad_unit').value.trim() || '件',
    target: Number(document.getElementById('ad_target').value) || 0,
    job_grades: scopeValue(document.getElementById('ad_scope').value),
    user_id: uid,
    sort_order: (ADMIN_METRICS.length + 1) * 10
  });
  if (error){ toast('追加できませんでした: ' + error.message); return; }
  document.getElementById('ad_name').value = '';
  document.getElementById('ad_target').value = '';
  toast('追加しました');
  if (ADMIN_DEPT === ME.department_id) await reloadMyMetrics();
  loadAdminMetrics();
}
async function setTarget(id, v){
  const { error } = await EC.supabase.from('report_metrics').update({ target: Number(v) || 0 }).eq('id', id);
  toast(error ? '更新できませんでした' : '目標を更新しました');
  if (ADMIN_DEPT === ME.department_id) reloadMyMetrics();
}
async function setScope(id, key){
  const { error } = await EC.supabase.from('report_metrics')
    .update({ job_grades: scopeValue(key) }).eq('id', id);
  toast(error ? '更新できませんでした: ' + error.message : '入力する層を変更しました');
  if (ADMIN_DEPT === ME.department_id) reloadMyMetrics();
  loadAdminMetrics();
}
async function delMetric(id, name){
  if (!confirm(name + ' を削除します。過去に入力された数値は残ります。よろしいですか。')) return;
  const { error } = await EC.supabase.from('report_metrics').update({ is_active: false }).eq('id', id);
  if (error){ toast('削除できませんでした: ' + error.message); return; }
  toast('削除しました');
  if (ADMIN_DEPT === ME.department_id) await reloadMyMetrics();
  loadAdminMetrics();
}
async function reloadMyMetrics(){
  const { data } = await EC.supabase.from('report_metrics')
    .select('id,name,unit,target,is_required,sort_order,job_grades,user_id')
    .eq('department_id', ME.department_id).eq('is_active', true).order('sort_order');
  const { data: mine2 } = await EC.supabase.from('report_metrics')
    .select('id,name,unit,target,is_required,sort_order,job_grades,user_id')
    .eq('user_id', ME.id).eq('is_active', true).order('sort_order');
  METRICS = (data || []).filter(m => !m.user_id).filter(metricAppliesToMe).concat(mine2 || []);
}

/* ---------- 組織図の可視化 ---------- */
let ORG_VIEW = 'tree';
function setOrgView(v){ ORG_VIEW = v; drawOrgChart(); }

function drawOrgChart(){
  const box = document.getElementById('orgChart'); if (!box) return;
  const act = USERS.filter(u => u.is_active !== false && u.department_id);

  const t = document.getElementById('ovTree'), d = document.getElementById('ovDept');
  if (t) t.className = 'ghost' + (ORG_VIEW === 'tree' ? ' on' : '');
  if (d) d.className = 'ghost' + (ORG_VIEW === 'dept' ? ' on' : '');

  if (ORG_VIEW === 'dept'){
    box.innerHTML = DEPTS.map(dep => {
      const list = act.filter(u => u.department_id === dep.id)
        .sort((a,b) => GRADES.indexOf(b.job_grade) - GRADES.indexOf(a.job_grade)
                    || (a.full_name||'').localeCompare(b.full_name||'','ja'));
      if (!list.length) return '';
      return `<div class="deptbox">
        <div class="depthead">${esc(dep.name)}<span class="note">　${list.length}名</span></div>
        <div class="row" style="gap:6px">
          ${list.map(u => `<span class="pcard${u.id===ME.id?' me':''}" title="上司：${esc(uname(u.manager_id))}">
            <b>${esc(u.full_name)}</b>
            <span class="note">${esc(u.job_grade||'')}${isDeptHead(u.id) ? '・部門長' : ''}</span>
            <span class="note" style="font-size:10px">▲${esc(uname(u.manager_id))}</span>
          </span>`).join('')}
        </div></div>`;
    }).join('') || '<div class="empty">表示できる社員がいません。</div>';
    return;
  }

  const roots = act.filter(u => !u.manager_id || !act.some(x => x.id === u.manager_id));
  box.innerHTML = (roots.length ? roots.map(u => orgNode(u, act, 0)).join('')
    : '<div class="empty">頂点となる社員が見つかりません。</div>')
    + '<p class="note" style="margin-top:10px">上司の下に部下が並びます。名前の右は役職と所属部署です。</p>';
}

function orgNode(u, act, depth){
  const kids = act.filter(x => x.manager_id === u.id)
    .sort((a,b) => GRADES.indexOf(b.job_grade) - GRADES.indexOf(a.job_grade)
                || (a.full_name||'').localeCompare(b.full_name||'','ja'));
  return `<div class="onode">
    <div class="orow${u.id===ME.id?' me':''}">
      <span class="avatar">${esc((u.full_name||'?').slice(0,1))}</span>
      <b>${esc(u.full_name)}</b>
      <span class="pill">${esc(u.job_grade || '役職未設定')}</span>
      ${isDeptHead(u.id) ? '<span class="pill p4">部門長</span>' : ''}
      <span class="note">${esc(u.dept_name || '')}</span>
      ${kids.length ? `<span class="pill p2">部下${kids.length}</span>` : ''}
    </div>
    ${kids.length ? `<div class="okids">${kids.map(k => orgNode(k, act, depth+1)).join('')}</div>` : ''}
  </div>`;
}


/* ---------- 社員の追加・編集・退職 ---------- */
async function renameUser(id, name){
  name = (name || '').trim(); if (!name) return;
  const { error } = await EC.supabase.from('app_users').update({ full_name: name }).eq('id', id);
  if (error){ toast('変更できませんでした: ' + error.message); return; }
  const u = USERS.find(x => x.id === id); if (u) u.full_name = name;
  const a = ALL_USERS.find(x => x.id === id); if (a) a.full_name = name;
  toast('氏名を変更しました');
}
async function retireUser(id, name){
  if (!confirm(name + ' を退職として登録します。\n過去の日報・週次報告は残りますが、組織図や一覧には表示されなくなります。よろしいですか。')) return;
  const { error } = await EC.supabase.from('app_users')
    .update({ is_active: false, manager_id: null }).eq('id', id);
  if (error){ toast('変更できませんでした: ' + error.message); return; }
  // この人を上司にしていた社員は上司なしに戻す
  const kids = USERS.filter(u => u.manager_id === id);
  for (const k of kids){
    await EC.supabase.from('app_users').update({ manager_id: null }).eq('id', k.id);
    k.manager_id = null;
  }
  USERS = USERS.filter(u => u.id !== id);
  const a = ALL_USERS.find(x => x.id === id); if (a) a.is_active = false;
  toast(kids.length ? '退職にしました。部下' + kids.length + '名の上司が未設定になりました' : '退職として登録しました');
  loadOrgLine((document.getElementById('orgFilter')||{}).value); drawOrgChart(); loadRetired();
}
async function reviveUser(id){
  const { error } = await EC.supabase.from('app_users').update({ is_active: true }).eq('id', id);
  if (error){ toast('戻せませんでした: ' + error.message); return; }
  const a = ALL_USERS.find(x => x.id === id);
  if (a){ a.is_active = true; USERS.push(a); }
  toast('在籍に戻しました');
  loadOrgLine(); drawOrgChart(); loadRetired();
}
async function addUser(){
  const name  = (document.getElementById('nu_name')||{}).value.trim();
  const email = (document.getElementById('nu_email')||{}).value.trim();
  if (!name || !email){ toast('氏名とメールアドレスを入力してください'); return; }
  const dept  = (document.getElementById('nu_dept')||{}).value || null;
  const d = DEPTS.find(x => x.id === dept);
  const { data, error } = await EC.supabase.from('app_users').insert({
    full_name: name, email: email, is_active: true, role: 'field',
    department_id: dept, dept_name: d ? d.name : null,
    job_grade: (document.getElementById('nu_grade')||{}).value || '一般',
    manager_id: (document.getElementById('nu_boss')||{}).value || null
  }).select().single();
  if (error){
    toast('追加できませんでした: ' + error.message +
      '（初回ログイン時に自動登録される仕組みのため、本人にログインしてもらう方法もあります）');
    return;
  }
  USERS.push(data); ALL_USERS.push(data);
  document.getElementById('nu_name').value = '';
  document.getElementById('nu_email').value = '';
  toast('社員を追加しました');
  loadOrgLine(); drawOrgChart();

function loadRetired(){
  const box = document.getElementById('retiredBox'); if (!box) return;
  const list = ALL_USERS.filter(u => u.is_active === false)
    .sort((a,b) => (a.full_name||'').localeCompare(b.full_name||'','ja'));

/* ---------- 報告ライン（直属上司）の編集 ---------- */
function loadOrgLine(q){
  const box = document.getElementById('orgList'); if (!box) return;
  try { drawOrgLine_(box, q); }
  catch (e) { box.innerHTML = `<div class="empty">表示できませんでした：${esc(String(e))}</div>`; }
}
function drawOrgLine_(box, q){
  const key = String(q || '').replace(/[\s　]/g, '');
  const hit = u => {
    if (!key) return true;
    const hay = [u.full_name, u.dept_name, u.job_grade, u.email]
      .map(x => String(x || '').replace(/[\s　]/g, '')).join('｜');
    return hay.indexOf(key) >= 0;
  };
  const sorted = USERS.filter(hit).sort((a,b) =>
    (a.dept_name||'').localeCompare(b.dept_name||'','ja') ||
    (a.full_name||'').localeCompare(b.full_name||'','ja'));

  const depts = [];
  USERS.forEach(u => { if (u.dept_name && depts.indexOf(u.dept_name) < 0) depts.push(u.dept_name); });
  const chips = `<div class="row" style="margin:8px 0">
    ${depts.sort().map(d => `<button class="ghost" onclick="filterOrg('${esc(d)}')">${esc(d)}</button>`).join('')}
    ${key ? `<button class="ghost" onclick="filterOrg('')">すべて表示</button>` : ''}</div>`;

  if (!sorted.length){
    box.innerHTML = chips +
      `<div class="empty">「${esc(q)}」に一致する社員がいません。上の部署名から選ぶか、氏名の一部で探してください。</div>`;
    return;
  }
  box.innerHTML = chips + `<table style="margin-top:4px">
    <tr><th>氏名</th><th>部署</th><th>役職</th><th>直属上司</th><th>在籍</th></tr>
    ${sorted.map(u => {
      const ng = [u.id].concat(descendantsOf(u.id));
      return `<tr><td><input type="text" value="${esc(u.full_name||'')}" style="padding:5px;min-width:110px"
        onchange="renameUser('${u.id}', this.value)"></td>
        <td><select style="padding:5px;font-size:12px" onchange="setDept('${u.id}',this.value)">
          <option value="">（未設定）</option>
          ${DEPTS.map(d => `<option value="${d.id}"${u.department_id===d.id?' selected':''}>${esc(d.name)}</option>`).join('')}
        </select></td>
        <td><select style="padding:5px;font-size:12px" onchange="setGrade('${u.id}',this.value)">
          ${GRADES.map(g => `<option${u.job_grade===g?' selected':''}>${g}</option>`).join('')}
        </select></td>
        <td><select style="padding:5px;font-size:12px" onchange="setManager('${u.id}',this.value)">
          <option value="">（上司なし）</option>
          ${USERS.filter(x => ng.indexOf(x.id) < 0)
                 .sort((a,b)=>(a.full_name||'').localeCompare(b.full_name||'','ja'))
                 .map(x => `<option value="${x.id}"${u.manager_id===x.id?' selected':''}>${esc(x.full_name)}（${esc(x.dept_name||'')}）</option>`).join('')}
        </select></td>
        <td><button class="ghost" onclick="retireUser('${u.id}','${esc(u.full_name)}')">退職</button></td></tr>`;}).join('')}
  </table>
  <p class="note" style="margin-top:8px">${sorted.length}名を表示中／自分の部下は上司の候補に出ません（ループ防止）。</p>`;
}
function filterOrg(v){
  const el = document.getElementById('orgFilter');
  if (el) el.value = v;
  loadOrgLine(v);
}
function descendantsOf(id, acc){
  acc = acc || [];
  USERS.filter(u => u.manager_id === id).forEach(c => { acc.push(c.id); descendantsOf(c.id, acc); });
  return acc;
}
async function setDept(id, deptId){
  const d = DEPTS.find(x => x.id === deptId);
  const { error } = await EC.supabase.from('app_users')
    .update({ department_id: deptId || null, dept_name: d ? d.name : null }).eq('id', id);
  if (error){ toast('変更できませんでした: ' + error.message); return; }
  const u = USERS.find(x => x.id === id);
  if (u){ u.department_id = deptId || null; u.dept_name = d ? d.name : null; }
  if (id === ME.id){ ME.department_id = deptId || null; ME.dept_name = d ? d.name : null; }
  toast('所属部署を変更しました');
  loadOrgLine((document.getElementById('orgFilter')||{}).value);
}
async function setGrade(id, grade){
  const { error } = await EC.supabase.from('app_users').update({ job_grade: grade }).eq('id', id);
  if (error){ toast('変更できませんでした: ' + error.message); return; }
  const u = USERS.find(x => x.id === id); if (u) u.job_grade = grade;
  toast('役職を変更しました。Chatworkの通知先も切り替わります');

async function setManager(id, bossId){
  const { error } = await EC.supabase.from('app_users')
    .update({ manager_id: bossId || null }).eq('id', id);
  if (error){ toast('変更できませんでした: ' + error.message); return; }
  const u = USERS.find(x => x.id === id); if (u) u.manager_id = bossId || null;
  toast('報告ラインを変更しました');
  loadOrgLine((document.getElementById('orgFilter')||{}).value);
}
function hhmm(ts){
  try { const d = new Date(ts);
    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
  catch(e){ return ''; }
}

async function setNSet(key, on){

/* ================= 週次報告 ================= */
let QGOALS = [], WTARGETS = [], WREPORT = null, WEEK_START = '';

function mondayOf(d){
  const dow = ME.week_start_dow == null ? 1 : ME.week_start_dow;
  const x = new Date(d); const diff = (x.getDay() - dow + 7) % 7;
  x.setDate(x.getDate() - diff);
  return x.toISOString().slice(0,10);
}
function addDays(ymd, n){ const d = new Date(ymd); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); }

async function loadGoals(){
  const { data } = await EC.supabase.from('quarter_goals')
    .select('*').eq('is_active', true);
  QGOALS = (data || []).filter(g => g.user_id === ME.id ||
    (!g.user_id && g.department_id === ME.department_id));
}

/* 日報の数値から期間内の実績を合計する */
function actualSum(metricId, from, to, uid){
  let sum = 0;
  REPORTS.forEach(r => {
    if (r.author_id !== (uid || ME.id)) return;
    if (r.report_date < from || r.report_date > to) return;
    (r.report_metric_values || []).forEach(v => {
      if (v.metric_id === metricId) sum += Number(v.value) || 0;
    });
  });
  return sum;
}

function vWeekly(){
  if (!WEEK_START) WEEK_START = mondayOf(new Date());
  setTimeout(loadWeekly, 0);
  return `<h2>週次報告</h2>
  <p class="sub">結果は日報の数値から自動集計します。書くのは要因・行動変化・次週目標だけです。</p>
  <div id="wkBox"><div class="empty">読み込み中…</div></div>`;
}

async function loadWeekly(){
  const box = document.getElementById('wkBox'); if (!box) return;
  const weekEnd = addDays(WEEK_START, 6);

  // 四半期の開始まで日報を読み込む
  const oldest = QGOALS.reduce((a, g) => (!a || g.period_from < a) ? g.period_from : a, '');
  if (oldest && oldest < LOAD_FROM){ await loadReports(oldest); }

  const [wr, wt] = await Promise.all([
    EC.supabase.from('weekly_reports').select('*, weekly_comments(*)')
      .eq('user_id', ME.id).eq('week_start', WEEK_START).maybeSingle(),
    EC.supabase.from('weekly_targets').select('*').eq('user_id', ME.id).eq('week_start', WEEK_START)
  ]);
  WREPORT = wr.data || null;
  WTARGETS = wt.data || [];

  if (!QGOALS.length){
    box.innerHTML = `<div class="card"><div class="empty">
      四半期目標がまだ登録されていません。「管理」タブの「四半期目標」から登録してください。</div></div>`;
    return;
  }

  const rows = QGOALS.map(g => {
    const total   = actualSum(g.metric_id, g.period_from, g.period_to);
    const week    = actualSum(g.metric_id, WEEK_START, weekEnd);
    const wt      = WTARGETS.find(x => x.goal_id === g.id);
    const perWeek = Number(g.target) / (g.weeks || 13);
    const wTarget = wt ? Number(wt.target) : Math.round(perWeek * 10) / 10;
    // 残り週数と必要ペース
    const today   = TODAY;
    const left    = Math.max(1, Math.ceil((new Date(g.period_to) - new Date(today)) / 604800000));
    const need    = Math.max(0, (Number(g.target) - total) / left);
    return { g, total, week, wTarget, perWeek, left, need,
             qRate: g.target ? Math.round(total / g.target * 100) : 0,
             wRate: wTarget ? Math.round(week / wTarget * 100) : 0 };
  });

  const miss = rows.filter(r => r.wRate < 100);

  box.innerHTML = `
  <div class="card">
    <div class="row">
      <button class="ghost" onclick="moveWeek(-7)">← 前の週</button>
      <b>${WEEK_START} 〜 ${weekEnd}</b>
      ${WEEK_START < mondayOf(new Date()) ? `<button class="ghost" onclick="moveWeek(7)">次の週 →</button>` : ''}
      <span class="pill ${WREPORT ? 'p2' : 'p4'}" style="margin-left:auto">
        ${WREPORT ? '提出済み' : '未提出'}</span>
    </div>
  </div>

  <div class="card"><h3>四半期の進捗</h3>
    <table><tr><th>項目</th><th>目標</th><th>実績</th><th>達成率</th><th>残り</th><th>必要ペース／週</th></tr>
    ${rows.map(r => `<tr>
      <td>${esc(r.g.name)}${r.g.kind === 'KGI' ? ' <span class="pill">KGI</span>' : ''}</td>
      <td class="num">${r.g.target}${esc(r.g.unit)}</td>
      <td class="num">${Math.round(r.total*10)/10}</td>
      <td class="num" style="color:${r.qRate >= 100 ? 'var(--accent)' : r.qRate >= 70 ? 'var(--amber)' : 'var(--warn)'}">${r.qRate}%</td>
      <td class="num">${r.left}週</td>
      <td class="num"><b>${Math.round(r.need*10)/10}</b>${esc(r.g.unit)}</td></tr>`).join('')}
    </table>
    <p class="note" style="margin-top:8px">必要ペースは、残りの週数から毎週引き直しています。遅れは翌週以降に跳ね返ります。</p>
  </div>

  <div class="card"><h3>今週の目標と結果</h3>
    <table><tr><th>項目</th><th>今週目標</th><th>実績</th><th>過不足</th><th>達成率</th></tr>
    ${rows.map(r => `<tr>
      <td>${esc(r.g.name)}</td>
      <td class="num">${r.wTarget}${esc(r.g.unit)}</td>
      <td class="num">${Math.round(r.week*10)/10}</td>
      <td class="num" style="color:${r.week >= r.wTarget ? 'var(--accent)' : 'var(--warn)'}">
        ${r.week >= r.wTarget ? '+' : '▲'}${Math.abs(Math.round((r.week - r.wTarget)*10)/10)}</td>
      <td class="num" style="color:${r.wRate >= 100 ? 'var(--accent)' : 'var(--warn)'}">${r.wRate}%</td></tr>`).join('')}
    </table>
    <p class="note" style="margin-top:8px">日報に入力された数値の合計です。手入力は不要です。</p>
  </div>

  ${miss.length ? `<div class="card" style="border-color:#E7C4A6">
    <h3>未達の項目（${miss.length}）</h3>
    ${miss.map(r => `<div class="sec s-rival"><span class="lab">${esc(r.g.name)}</span>
      <div>目標 ${r.wTarget}${esc(r.g.unit)} に対して実績 ${Math.round(r.week*10)/10}（${r.wRate}%）</div></div>`).join('')}
  </div>` : `<div class="card"><div class="ok" style="padding:0">今週の目標はすべて達成しています。</div></div>`}

  <div class="card">
    <div class="row"><h3 style="border:0;padding:0;margin:0">書き方</h3>
      <button class="ghost" style="margin-left:auto" onclick="toggleWkGuide()">サンプルを見る</button></div>
    <div id="wkGuide" style="display:none">${wkGuideHtml()}</div>
  </div>

  <div class="card">
    <h3>未達要因</h3>
    <p class="note">なぜ足りなかったか。「頑張りが足りない」ではなく、事実で書きます。
      数字のどこが詰まったか（入口が少ない／途中で止まった／決め切れない）を特定してください。</p>
    <textarea id="w_cause" placeholder="例：現調6件の目標に対し3件。うち2件は先方都合の延期だが、残り1件は打診が水曜以降になり日程が取れなかった。週前半の架電が0件だったことが直接の要因。">${esc(WREPORT ? WREPORT.gap_cause : '')}</textarea>

    <h3 style="margin-top:16px">行動変化</h3>
    <p class="note">来週、何をやめて何を始めるか。<b>やめることを1つは書いてください。</b>
      足し算だけの計画は、時間が足りずに実行されません。</p>
    <textarea id="w_action" placeholder="例：やめる…金曜午後の資料作成（月曜午前に移す）／始める…月曜9時までに現調候補5件へ架電し、水曜までに日程を確定させる">${esc(WREPORT ? WREPORT.action_change : '')}</textarea>

    <h3 style="margin-top:16px">次週の目標</h3>
    <p class="note">初期値は「残り週数から逆算した必要ペース」です。遅れた分が上乗せされています。
      下げる場合は、四半期目標に届く筋道を未達要因か行動変化に書いてください。</p>
    <div class="grid">${rows.map(r => `
      <div><label>${esc(r.g.name)}（${esc(r.g.unit)}）　推奨 ${Math.round(r.need*10)/10}</label>
      <input type="number" step="any" id="wt_${r.g.id}" value="${Math.round(r.need*10)/10}"></div>`).join('')}
    </div>

    <h3 style="margin-top:16px">その他相談</h3>
    <p class="note">自分では決められないこと、上司に判断してほしいことを書きます。なければ空欄で構いません。</p>
    <textarea id="w_consult" style="min-height:56px" placeholder="例：A社の値引き要請について、どこまで対応してよいか判断をお願いしたい">${esc(WREPORT ? WREPORT.consult : '')}</textarea>

    <button class="act" style="margin-top:14px" onclick="submitWeekly()">
      ${WREPORT ? '更新する' : '提出する'}</button>
  </div>

  ${WREPORT && (WREPORT.weekly_comments||[]).length ? `<div class="card"><h3>上司コメント</h3>
    ${WREPORT.weekly_comments.map(c => `<div class="cmt"><b>${esc(uname(c.author_id))}</b>
      <span class="note num">${(c.created_at||'').slice(5,16).replace('T',' ')}</span><br>${linkify(c.body)}</div>`).join('')}
  </div>` : ''}`;
}

function moveWeek(n){ WEEK_START = addDays(WEEK_START, n); render(); }

async function submitWeekly(){
  const g = id => (document.getElementById(id) || {}).value || '';
  const weekEnd = addDays(WEEK_START, 6);
  const results = {};
  QGOALS.forEach(x => { results[x.name] = actualSum(x.metric_id, WEEK_START, weekEnd); });

  const { error } = await EC.supabase.from('weekly_reports').upsert({
    user_id: ME.id, week_start: WEEK_START, results: results,
    gap_cause: g('w_cause'), action_change: g('w_action'), consult: g('w_consult'),
    status: 'submitted'
  }, { onConflict: 'user_id,week_start' });
  if (error){ toast('保存できませんでした: ' + error.message); return; }

  // 次週の目標を登録
  const next = addDays(WEEK_START, 7);
  const rows = QGOALS.map(x => ({
    goal_id: x.id, user_id: ME.id, week_start: next,
    target: Number(g('wt_' + x.id)) || 0, is_manual: true
  })).filter(x => x.target > 0);
  if (rows.length) await EC.supabase.from('weekly_targets')
    .upsert(rows, { onConflict: 'goal_id,user_id,week_start' });

  toast('週次報告を提出しました');
  loadWeekly();
}

async function loadGoalList(){

        <td>${esc(g.name)}</td>
        <td>${g.kind === 'KGI' ? '<span class="pill p4">KGI</span>' : 'KPI'}</td>

        <td class="num" style="font-size:11px">${g.period_from}〜${g.period_to}</td>

      </table>`
    : '<div class="empty" style="margin-top:12px">四半期目標がまだ登録されていません。</div>';
}
async function addGoal(){
  const mid = (document.getElementById('qg_metric')||{}).value;
  const m = METRICS_ALL.find(x => x.id === mid);
  if (!m){ toast('数値項目を選んでください'); return; }
  const uid = (document.getElementById('qg_user')||{}).value || null;
  const from = (document.getElementById('qg_from')||{}).value;
  const to   = (document.getElementById('qg_to')||{}).value;
  const target = Number((document.getElementById('qg_target')||{}).value);
  if (!from || !to){ toast('期間を選んでください'); return; }
  if (!target){ toast('目標値を入力してください'); return; }
  const weeks = Math.max(1, Math.round((new Date(to) - new Date(from)) / 604800000));

  const { error } = await EC.supabase.from('quarter_goals').insert({
    user_id: uid, department_id: uid ? null : ADMIN_DEPT, metric_id: mid,
    name: m.name, unit: m.unit, kind: (document.getElementById('qg_kind')||{}).value || 'KPI',
    target: target, period_from: from, period_to: to, weeks: weeks, created_by: ME.id });
  if (error){ toast('追加できませんでした: ' + error.message); return; }
  toast('四半期目標を追加しました（週割 ' + Math.round(target/weeks*10)/10 + m.unit + '）');
  document.getElementById('qg_target').value = '';
  loadGoalList(); loadGoals();
}
async function delGoal(id){
  if (!confirm('この四半期目標を削除します。よろしいですか。')) return;
  const { error } = await EC.supabase.from('quarter_goals').update({ is_active: false }).eq('id', id);
  if (error){ toast('削除できませんでした: ' + error.message); return; }
  toast('削除しました'); loadGoalList(); loadGoals();
}

async function loadGradeAdmin(){
  const box = document.getElementById('gradeBox'); if (!box) return;
  const { data, error } = await EC.supabase.from('job_grades')
    .select('*').eq('is_active', true).order('sort_order');
  if (error){ box.innerHTML = `<p class="note">読み込めませんでした：${esc(error.message)}</p>`; return; }
  const list = data || [];
  box.innerHTML = `<table style="margin-top:10px">
    <tr><th>役職</th><th>人数</th><th>並び順</th><th></th></tr>
    ${list.map(g => {
      const n = USERS.filter(u => u.job_grade === g.name).length;
      return `<tr>
        <td><input type="text" value="${esc(g.name)}" style="padding:5px"
             onchange="renameGrade('${g.id}', this.value, '${esc(g.name)}')"></td>
        <td class="num">${n}名</td>
        <td><input type="number" value="${g.sort_order}" style="width:70px;padding:5px"
             onchange="setGradeOrder('${g.id}', this.value)"></td>
        <td><button class="ghost" onclick="delGrade('${g.id}','${esc(g.name)}',${n})">削除</button></td></tr>`;
    }).join('')}
  </table>
  <div class="row" style="margin-top:10px">
    <input type="text" id="ng_name" placeholder="新しい役職" style="flex:2;min-width:150px">
    <input type="number" id="ng_order" placeholder="並び順" style="flex:1;min-width:90px">
    <button class="act" style="padding:8px 16px;font-size:13px" onclick="addGrade()">追加</button>
  </div>
  <p class="note" style="margin-top:8px">新しい役職を追加したら、Chatworkの通知先ルームの設定も必要です。ご相談ください。</p>`;
}
async function renameGrade(id, name, before){
  name = (name || '').trim();
  if (!name || name === before) return;
  const n = USERS.filter(u => u.job_grade === before).length;
  if (n && !confirm(before + ' を「' + name + '」に変更します。該当する ' + n + '名の役職も更新されます。よろしいですか。')){
    loadGradeAdmin(); return;
  }
  const { error } = await EC.supabase.from('job_grades').update({ name: name }).eq('id', id);
  if (error){ toast('変更できませんでした: ' + error.message); return; }
  await EC.supabase.from('app_users').update({ job_grade: name }).eq('job_grade', before);
  await EC.supabase.from('chatwork_rooms').update({ job_grade: name }).eq('job_grade', before);
  USERS.forEach(u => { if (u.job_grade === before) u.job_grade = name; });
  if (ME.job_grade === before) ME.job_grade = name;
  GRADES = GRADES.map(g => g === before ? name : g);
  toast('役職を変更しました');
  loadGradeAdmin(); loadOrgLine(); drawOrgChart();
}
async function setGradeOrder(id, v){
  const { error } = await EC.supabase.from('job_grades').update({ sort_order: Number(v) || 100 }).eq('id', id);
  if (error){ toast('変更できませんでした'); return; }
  const { data } = await EC.supabase.from('job_grades')
    .select('name').eq('is_active', true).order('sort_order');
  if (data) GRADES = data.map(g => g.name);
  toast('並び順を変更しました'); loadGradeAdmin();
}
async function addGrade(){
  const name = (document.getElementById('ng_name')||{}).value.trim();
  if (!name){ toast('役職を入力してください'); return; }
  const { error } = await EC.supabase.from('job_grades').insert({
    name: name, sort_order: Number((document.getElementById('ng_order')||{}).value) || 100 });
  if (error){ toast('追加できませんでした: ' + error.message); return; }
  GRADES.push(name);
  toast('追加しました。この役職の通知先ルームの設定をお忘れなく');
  loadGradeAdmin();
}
async function delGrade(id, name, n){
  if (n > 0){ toast(name + ' には ' + n + '名が該当します。先に別の区分へ変更してください'); return; }
  if (!confirm(name + ' を削除します。よろしいですか。')) return;
  const { error } = await EC.supabase.from('job_grades').update({ is_active: false }).eq('id', id);
  if (error){ toast('削除できませんでした: ' + error.message); return; }
  GRADES = GRADES.filter(g => g !== name);
  toast('削除しました'); loadGradeAdmin();
}

/* ---------- 部署マスタの編集 ---------- */
async function loadDeptAdmin(){
  const box = document.getElementById('deptBox'); if (!box) return;
  const { data, error } = await EC.supabase.from('departments')
    .select('*').eq('is_active', true).order('sort_order');
  if (error){ box.innerHTML = `<p class="note">読み込めませんでした：${esc(error.message)}</p>`; return; }
  const list = data || [];
  box.innerHTML = `<table style="margin-top:10px">
    <tr><th>部署名</th><th>部門長</th><th>人数</th><th>表示順</th><th></th></tr>
    ${list.map(d => {
      const n = USERS.filter(u => u.department_id === d.id).length;
      return `<tr>
        <td><input type="text" value="${esc(d.name)}" style="padding:5px"
             onchange="renameDept('${d.id}', this.value, '${esc(d.name)}')"></td>
        <td><select style="padding:5px;font-size:12px" onchange="setDeptHead('${d.id}',this.value)">
          <option value="">（未設定）</option>
          ${USERS.slice().sort((a,b)=>(a.full_name||'').localeCompare(b.full_name||'','ja'))
            .map(u => `<option value="${u.id}"${d.head_user_id===u.id?' selected':''}>${esc(u.full_name)}（${esc(u.job_grade||'')}）</option>`).join('')}
        </select></td>
        <td class="num">${n}名</td>
        <td><input type="number" value="${d.sort_order || 100}" style="width:70px;padding:5px"
             onchange="setDeptOrder('${d.id}', this.value)"></td>
        <td><button class="ghost" onclick="delDept('${d.id}','${esc(d.name)}',${n})">削除</button></td></tr>`;
    }).join('')}
  </table>
  <div class="row" style="margin-top:10px">
    <input type="text" id="nd_name" placeholder="新しい部署名" style="flex:2;min-width:160px">
    <input type="number" id="nd_order" placeholder="表示順" style="flex:1;min-width:90px">
    <button class="act" style="padding:8px 16px;font-size:13px" onclick="addDept()">部署を追加</button>
  </div>`;
}
async function setDeptHead(deptId, uid){
  const { error } = await EC.supabase.from('departments')
    .update({ head_user_id: uid || null }).eq('id', deptId);
  if (error){ toast('変更できませんでした: ' + error.message); return; }
  const d = DEPTS.find(x => x.id === deptId); if (d) d.head_user_id = uid || null;
  toast(uid ? uname(uid) + ' を部門長に設定しました' : '部門長を解除しました');
  loadDeptAdmin(); drawOrgChart();
}
async function renameDept(id, name, before){
  name = (name || '').trim();
  if (!name || name === before) return;
  const { error } = await EC.supabase.from('departments').update({ name: name }).eq('id', id);
  if (error){ toast('変更できませんでした: ' + error.message); return; }
  // 所属社員の表示名もまとめて更新
  await EC.supabase.from('app_users').update({ dept_name: name }).eq('department_id', id);
  USERS.forEach(u => { if (u.department_id === id) u.dept_name = name; });
  const d = DEPTS.find(x => x.id === id); if (d) d.name = name;
  if (ME.department_id === id) ME.dept_name = name;
  toast('部署名を変更しました');
  loadDeptAdmin();
}
async function setDeptOrder(id, v){
  const { error } = await EC.supabase.from('departments').update({ sort_order: Number(v) || 100 }).eq('id', id);
  toast(error ? '変更できませんでした' : '表示順を変更しました');
  loadDeptAdmin();
}
async function addDept(){
  const name = (document.getElementById('nd_name')||{}).value.trim();
  if (!name){ toast('部署名を入力してください'); return; }
  const code = 'd' + Date.now();
  const { error } = await EC.supabase.from('departments').insert({
    code: code, name: name, sort_order: Number((document.getElementById('nd_order')||{}).value) || 100 });
  if (error){ toast('追加できませんでした: ' + error.message); return; }
  const { data } = await EC.supabase.from('departments').select('id,name,sort_order')
    .eq('is_active', true).order('sort_order');
  DEPTS = data || [];
  toast('部署を追加しました'); loadDeptAdmin();
}
async function delDept(id, name, n){
  if (n > 0){ toast(name + ' には ' + n + '名が所属しています。先に異動させてください'); return; }
  if (!confirm(name + ' を削除します。よろしいですか。')) return;
  const { error } = await EC.supabase.from('departments').update({ is_active: false }).eq('id', id);
  if (error){ toast('削除できませんでした: ' + error.message); return; }
  DEPTS = DEPTS.filter(d => d.id !== id);
  toast('削除しました'); loadDeptAdmin();
}


/* ================= 実績一覧 ================= */
let RES_FROM = '', RES_TO = '', RES_UNIT = 'dept', RES_DEPT = '';

function vResult(){
  if (!RES_FROM){
    const d = new Date(); d.setDate(d.getDate() - 27);
    RES_FROM = d.toISOString().slice(0,10); RES_TO = TODAY;
  }
  setTimeout(drawResult, 0);
  return `<h2>実績一覧</h2>
  <p class="sub">日報に入力された数値を、期間・単位ごとに集計します。</p>
  <div class="card" style="padding:12px 14px">
    <div class="grid" style="gap:8px">
      <div><label>開始日</label><input type="date" id="rs_from" value="${RES_FROM}"></div>
      <div><label>終了日</label><input type="date" id="rs_to" value="${RES_TO}"></div>
      <div><label>集計単位</label><select id="rs_unit">
        <option value="all"${RES_UNIT==='all'?' selected':''}>全社（合計）</option>
        <option value="dept"${RES_UNIT==='dept'?' selected':''}>部署別</option>
        <option value="user"${RES_UNIT==='user'?' selected':''}>個人別</option>
      </select></div>
      <div><label>部署で絞る</label><select id="rs_dept">
        <option value="">すべて</option>
        ${DEPTS.map(d => `<option value="${esc(d.name)}"${RES_DEPT===d.name?' selected':''}>${esc(d.name)}</option>`).join('')}
      </select></div>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="act" style="padding:8px 16px;font-size:13px" onclick="applyResult()">集計する</button>
      ${[[7,'直近7日'],[28,'直近4週'],[91,'直近3か月'],[182,'直近半年']].map(([d,t]) =>
        `<button class="ghost" onclick="quickResult(${d})">${t}</button>`).join('')}
    </div>
  </div>
  <div id="resBox"><div class="empty">集計しています…</div></div>`;
}

async function applyResult(){
  RES_FROM = (document.getElementById('rs_from')||{}).value || RES_FROM;
  RES_TO   = (document.getElementById('rs_to')||{}).value || RES_TO;
  RES_UNIT = (document.getElementById('rs_unit')||{}).value || 'dept';
  RES_DEPT = (document.getElementById('rs_dept')||{}).value || '';
  if (RES_FROM < LOAD_FROM){ toast('過去の日報を読み込んでいます…'); await loadReports(RES_FROM); }
  render();
}
async function quickResult(days){
  const d = new Date(); d.setDate(d.getDate() - days + 1);
  RES_FROM = d.toISOString().slice(0,10); RES_TO = TODAY;
  if (RES_FROM < LOAD_FROM){ toast('過去の日報を読み込んでいます…'); await loadReports(RES_FROM); }
  render();
}

async function drawResult(){
  const box = document.getElementById('resBox'); if (!box) return;
  if (RES_FROM < LOAD_FROM){ await loadReports(RES_FROM); }

  const inRange = REPORTS.filter(r => r.report_date >= RES_FROM && r.report_date <= RES_TO
    && r.status !== 'off' && (!RES_DEPT || udept(r.author_id) === RES_DEPT));

  // 集計キーごとに { 提出件数, 人数, 数値項目合計 }
  const buckets = {};
  inRange.forEach(r => {
    const key = RES_UNIT === 'all' ? '全社'
              : RES_UNIT === 'dept' ? (udept(r.author_id) || '部署なし')
              : uname(r.author_id);
    const b = buckets[key] = buckets[key] || { n: 0, users: {}, m: {} };
    b.n++; b.users[r.author_id] = true;
    (r.report_metric_values || []).forEach(v => {
      b.m[v.metric_id] = (b.m[v.metric_id] || 0) + (Number(v.value) || 0);
    });
  });

  const keys = Object.keys(buckets);
  if (!keys.length){ box.innerHTML = '<div class="empty">対象の日報がありません。</div>'; return; }

  // 期間内に使われた数値項目だけを列にする
  const used = [];
  keys.forEach(k => Object.keys(buckets[k].m).forEach(id => { if (used.indexOf(id) < 0) used.push(id); }));
  const cols = used.map(id => METRICS_ALL.find(m => m.id === id)).filter(Boolean)
    .sort((a,b) => (a.sort_order||0) - (b.sort_order||0));

  const days = Math.max(1, Math.round((new Date(RES_TO) - new Date(RES_FROM)) / 86400000) + 1);
  box.innerHTML = `
  <div class="card">
    <h3>${RES_FROM} 〜 ${RES_TO}（${days}日間）${RES_DEPT ? '／' + esc(RES_DEPT) : ''}</h3>
    <div style="overflow-x:auto">
    <table><tr><th>${RES_UNIT === 'user' ? '氏名' : RES_UNIT === 'dept' ? '部署' : '対象'}</th>
      <th>日報</th><th>人数</th>
      ${cols.map(m => `<th>${esc(m.name)}<br><span class="note">${esc(m.unit)}</span></th>`).join('')}</tr>
    ${keys.sort().map(k => {
      const b = buckets[k];
      return `<tr><td><b>${esc(k)}</b></td>
        <td class="num">${b.n}</td>
        <td class="num">${Object.keys(b.users).length}</td>
        ${cols.map(m => `<td class="num">${b.m[m.id] !== undefined
            ? Math.round(b.m[m.id]*10)/10 : '<span class="note">—</span>'}</td>`).join('')}
      </tr>`;}).join('')}
    ${keys.length > 1 ? `<tr style="background:#F5F8FB"><td><b>合計</b></td>
      <td class="num"><b>${inRange.length}</b></td>
      <td class="num"><b>${Object.keys(inRange.reduce((a,r)=>{a[r.author_id]=1;return a;},{})).length}</b></td>
      ${cols.map(m => {
        const t = keys.reduce((a,k) => a + (buckets[k].m[m.id] || 0), 0);
        return `<td class="num"><b>${Math.round(t*10)/10}</b></td>`;}).join('')}
    </tr>` : ''}
    </table></div>
    <p class="note" style="margin-top:8px">「日報」は提出件数、「人数」は提出した人の数です。休みで登録された日は除いています。</p>
  </div>`;
}

/* ---------- 4. ダッシュボード ---------- */
function vDash(){
  const todays = REPORTS.filter(r => r.report_date === TODAY);
  const offIds = todays.filter(r => r.status === 'off').map(r => r.author_id);
  const submitted = todays.filter(r => r.status !== 'off');
  const targets = USERS.filter(u => u.department_id && u.job_grade !== '役員・経営'
                                    && !offIds.includes(u.id));
  const rate = targets.length ? Math.round(submitted.length / targets.length * 100) : 0;
  const hot = REPORTS.filter(r => r.importance >= 4);
  const unhandled = hot.filter(r => !(r.report_comments||[]).length);
  const lv = [1,2,3,4,5].map(n => REPORTS.filter(r => r.level === n).length);

  return `<h2>ダッシュボード</h2><p class="sub">${esc(ME.full_name)}／${esc(ME.dept_name||'')}／${TODAY}</p>
  <div class="grid">
    <div class="kpi"><div class="v num">${rate}%</div><div class="l">本日の提出率（見える範囲）</div></div>
    <div class="kpi"><div class="v num">${submitted.length}</div><div class="l">本日の日報${offIds.length ? `（休み${offIds.length}名）` : ''}</div></div>
    <div class="kpi${unhandled.length ? ' alert' : ''}"><div class="v num" style="color:var(--warn)">${unhandled.length}</div><div class="l">未対応の重要情報</div></div>
    <div class="kpi"><div class="v num">${REPORTS.length}</div><div class="l">直近30日の日報</div></div>
  </div>
  <div class="card"><h3>情報の昇格レーン</h3>
    ${LEVELS.map((l,i) => `<div class="lvrow${lv[i]?'':' off'}" onclick="${lv[i]?`showLevel(${i+1})`:''}">
      <b class="num lvn l${i+1}">${lv[i]}</b><span>${l}</span>
      ${lv[i] ? '<span class="note" style="margin-left:auto">一覧を見る →</span>' : ''}</div>`).join('')}
    <p class="note" style="margin-top:8px">数字をクリックすると、そのレベルの日報だけを表示します。</p></div>
  <div class="card"><h3>今日、先に見るべき日報</h3>
    ${hot.length ? hot.slice(0,5).map(r => `
      <div class="hotrow" onclick="openReport('${r.id}')" title="クリックで日報を開きます">
        <div class="row" style="gap:7px">
          <span class="pill ${impMeta(r.importance)[2]}">${impMeta(r.importance)[1]}</span>
          <b>${esc(uname(r.author_id))}</b>
          <span class="note num">${r.report_date}</span>
          <span class="note" style="margin-left:auto">日報を開く →</span>
        </div>
        <div class="hotbody">${esc(r.voice || r.thought || r.industry || r.rival || '（本文なし）')}</div>
      </div>`).join('')
      : '<div class="empty">重要度の高い日報はありません。</div>'}</div>`;
}
</script>
