<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIPPO ONE ヘッダー（新デザイン）</title>
<style>
:root{
  --navy-900:#0B253E;   /* 上段バー・信頼 */
  --navy-800:#123152;   /* ナビ行 */
  --navy-700:#1B4068;   /* ホバー面 */
  --line:rgba(255,255,255,.12);
  --orange:#F26A21;     /* 行動 */
  --orange-hi:#FF8340;
  --mint:#25D0B0;       /* 達成 */
  --ink:#FFFFFF;
  --ink-dim:#9DB3CA;
  --font:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:#EEF2F6;color:#0B253E}

/* ============ ヘッダー本体 ============ */
.nx{position:sticky;top:0;z-index:50;font-family:var(--font)}

.nx-top{
  display:flex;align-items:center;gap:20px;
  padding:0 20px;height:78px;
  background:var(--navy-900);color:var(--ink);
}

/* ロゴ：チェック＋上昇矢印 */
.nx-brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;flex:0 0 auto}
.nx-brand svg{display:block}
.nx-name{font-size:21px;font-weight:800;letter-spacing:.02em;line-height:1.1}
.nx-tag{
  font-size:11.5px;line-height:1.35;color:var(--ink-dim);
  padding-left:12px;margin-left:2px;border-left:1px solid var(--line);
  max-width:132px;
}

/* 最重要ボタン */
.nx-cta{
  display:inline-flex;align-items:center;gap:10px;
  height:48px;padding:0 22px 0 18px;border:0;border-radius:12px;
  background:var(--orange);color:#fff;cursor:pointer;
  font-family:inherit;font-size:16px;font-weight:800;letter-spacing:.02em;
  box-shadow:0 6px 16px rgba(242,106,33,.34);
  transition:background .15s,transform .1s,box-shadow .15s;
}
.nx-cta:hover{background:var(--orange-hi)}
.nx-cta:active{transform:translateY(1px);box-shadow:0 3px 10px rgba(242,106,33,.3)}
.nx-cta:focus-visible{outline:3px solid #fff;outline-offset:2px}
.nx-cta[data-state="done"]{background:var(--mint);color:#04352C;box-shadow:0 6px 16px rgba(37,208,176,.3)}
.nx-cta[data-state="done"]:hover{background:#3AE0C1}

/* 指標 */
.nx-stats{display:flex;align-items:center;gap:22px;margin-left:4px;padding-left:22px;border-left:1px solid var(--line)}
.nx-metric{display:flex;align-items:center;gap:10px}
.nx-metric-label{font-size:11.5px;color:var(--ink-dim);line-height:1.3}
.nx-streak-num{font-size:26px;font-weight:800;color:var(--orange);line-height:1;font-variant-numeric:tabular-nums}
.nx-streak-num span{font-size:14px;font-weight:700;color:#fff;margin-left:2px}
.nx-ring{position:relative;width:52px;height:52px;flex:0 0 auto}
.nx-ring svg{transform:rotate(-90deg)}
.nx-ring-track{stroke:rgba(255,255,255,.14)}
.nx-ring-bar{stroke:var(--mint);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.nx-ring-val{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;
}
.nx-ring-val i{font-size:9px;font-style:normal;font-weight:700;margin-left:1px}

/* マスコット＋吹き出し */
.nx-mascot{margin-left:auto;display:flex;align-items:flex-end;gap:6px;height:78px}
.nx-bubble{
  position:relative;align-self:center;
  background:#fff;color:#0B253E;border-radius:12px;
  padding:8px 13px;font-size:13.5px;font-weight:700;line-height:1.3;white-space:nowrap;
  box-shadow:0 4px 12px rgba(0,0,0,.25);
}
.nx-bubble::after{
  content:"";position:absolute;right:-7px;bottom:9px;
  border:7px solid transparent;border-left-color:#fff;border-right:0;
}
.nx-mascot img{
  height:86px;width:auto;display:block;margin-bottom:-8px;
  image-rendering:-webkit-optimize-contrast;
}

/* ユーザー */
.nx-user{display:flex;align-items:center;gap:14px;padding-left:18px;margin-left:4px;border-left:1px solid var(--line)}
.nx-account{display:flex;align-items:center;gap:9px;background:none;border:0;color:inherit;font-family:inherit;cursor:pointer;padding:6px;border-radius:10px}
.nx-account:hover{background:var(--navy-700)}
.nx-avatar{width:34px;height:34px;border-radius:50%;background:var(--navy-700);display:grid;place-items:center;flex:0 0 auto}
.nx-account-txt{text-align:left;line-height:1.25}
.nx-account-name{font-size:14px;font-weight:700;display:block}
.nx-role{font-size:10.5px;color:var(--mint);font-weight:700}
.nx-logout{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink-dim);text-decoration:none;font-size:10px;font-weight:700;padding:4px 2px;border-radius:8px}
.nx-logout:hover{color:#fff}

/* ============ ナビ ============ */
.nx-nav{
  display:flex;align-items:stretch;gap:2px;
  background:var(--navy-800);padding:0 14px;
  border-top:1px solid var(--line);
  overflow-x:auto;scrollbar-width:thin;
}
.nx-nav a{
  display:flex;align-items:center;gap:7px;
  padding:0 13px;height:50px;flex:0 0 auto;
  color:var(--ink-dim);text-decoration:none;
  font-size:13.5px;font-weight:700;white-space:nowrap;
  border-bottom:3px solid transparent;
  transition:color .15s,background .15s;
}
.nx-nav a:hover{color:#fff;background:rgba(255,255,255,.06)}
.nx-nav a[aria-current="page"]{color:#fff;border-bottom-color:var(--mint)}
.nx-nav a[aria-current="page"] svg{color:var(--mint)}
.nx-nav a svg{flex:0 0 auto}
.nx-nav-right{margin-left:auto;display:flex;align-items:stretch;padding-left:10px}
.nx-nav-right a{padding:0 11px}
.nx-badge{
  position:absolute;top:11px;right:5px;min-width:16px;height:16px;padding:0 4px;
  background:var(--orange);color:#fff;border-radius:8px;
  font-size:10px;font-weight:800;display:grid;place-items:center;line-height:1;
}
.nx-icon-link{position:relative}

@media (max-width:1200px){
  .nx-tag{display:none}
  .nx-mascot .nx-bubble{display:none}
}
@media (max-width:900px){
  .nx-top{gap:12px;height:70px;padding:0 12px}
  .nx-stats{display:none}
  .nx-mascot img{height:70px}
  .nx-cta{font-size:14px;height:42px;padding:0 16px}
  .nx-account-txt{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ============ 以下はデモ用（本番では削除） ============ */
.demo{max-width:1100px;margin:36px auto;padding:0 20px}
.demo h2{font-size:15px;margin:0 0 12px}
.demo-btns{display:flex;flex-wrap:wrap;gap:8px}
.demo-btns button{
  padding:9px 14px;border-radius:9px;border:1px solid #C6D3E0;background:#fff;
  font-family:var(--font);font-size:13px;font-weight:700;color:#0B253E;cursor:pointer;
}
.demo-btns button:hover{border-color:var(--orange);color:var(--orange)}
.demo p{font-size:13px;color:#4A6076;line-height:1.7}
</style>
</head>

<div class="demo">
  <h2>状態を切り替えて確認</h2>
  <div class="demo-btns">
    <button data-s="empty">未入力</button>
    <button data-s="partial">入力途中（あと2項目）</button>
    <button data-s="done">提出完了</button>
    <button data-s="streak">連続達成（10日）</button>
  </div>
  <p>吹き出しの文言・オレンジボタンのラベル・進捗リングが状態に連動して変わります。<br>
  本番では、その日の日報レコード（未作成／下書き／提出済み）と連続提出日数から <code>setNippoState()</code> を呼ぶだけです。</p>
</div>

<script>
const RING_C = 2 * Math.PI * 21;              // 131.9
const $ = id => document.getElementById(id);

function setRing(pct){
  $('ringBar').setAttribute('stroke-dasharray', RING_C.toFixed(1));
  $('ringBar').setAttribute('stroke-dashoffset', (RING_C * (1 - pct/100)).toFixed(1));
  $('ringNum').textContent = pct;
}

/**
 * state: 'empty' | 'partial' | 'done' | 'streak'
 * opts : { remaining:残り項目数, streak:連続日数, rate:今月の達成率 }
 */
function setNippoState(state, opts = {}){
  const streak = opts.streak ?? 12;
  const rate   = opts.rate   ?? 85;
  const rest   = opts.remaining ?? 2;

  const msg = {
    empty  : 'まずは今日の成果から書こう！',
    partial: `あと${rest}項目で完成！`,
    done   : '今日も前進！お疲れさまでした',
    streak : `${streak}日連続達成！次は${Math.ceil((streak+1)/10)*10}日へ！`
  }[state];

  const label = {
    empty:'今日の日報を書く', partial:'日報の続きを書く',
    done:'今日の日報を見る',  streak:'今日の日報を見る'
  }[state];

  $('bubble').textContent = msg;
  $('ctaLabel').textContent = label;
  $('ctaBtn').dataset.state = (state === 'done' || state === 'streak') ? 'done' : 'open';
  $('streakNum').innerHTML = streak + '<span>日</span>';
  setRing(rate);
}

document.querySelectorAll('.demo-btns button').forEach(b => {
  b.onclick = () => {
    const s = b.dataset.s;
    if (s === 'streak') setNippoState('streak', {streak:10, rate:92});
    else if (s === 'done') setNippoState('done', {streak:12, rate:88});
    else if (s === 'partial') setNippoState('partial', {remaining:2, rate:85});
    else setNippoState('empty', {rate:85});
  };
});

setNippoState('empty', {rate:85});
</script>
</body>
