<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>部門長会議ボード｜EARTHCOM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#151A22;        /* 墨 */
  --ink-2:#3D4756;
  --ink-3:#6B788B;
  --paper:#E8EBF0;      /* 冷たい紙 */
  --card:#FFFFFF;
  --rule:#C7CFDB;
  --rule-2:#E2E7EF;
  --ai:#23477E;         /* 藍 */
  --ai-soft:#EAF0FA;
  --achieve:#0E6B55;    /* 達成 */
  --achieve-soft:#E4F3EE;
  --warn:#A8720A;       /* 注意 */
  --warn-soft:#FBF1DC;
  --short:#B32D1B;      /* 未達 */
  --short-soft:#FBE9E6;
  --r:3px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;
  font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,.disp{font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif}
.mono{font-family:"Roboto Mono",monospace;font-variant-numeric:tabular-nums}
button,select,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--ai)}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}

/* ===== 骨格 ===== */
.wrap{display:flex;min-height:100vh}
.rail{
  width:264px;flex:0 0 264px;background:var(--ink);color:#DDE3EC;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.rail-head{padding:18px 18px 14px;border-bottom:1px solid #2A323F}
.brand{font-size:11px;letter-spacing:.22em;color:#8C99AC;margin:0 0 6px}
.rail-head h1{font-size:19px;font-weight:900;margin:0;letter-spacing:.02em;color:#fff}
.rail-sub{font-size:11px;color:#8C99AC;margin-top:4px}
.ver{font-size:9.5px;color:#5E6C80;letter-spacing:.08em;margin-top:8px}
.ver.live{color:#6FCF97}
.rail-scroll{overflow-y:auto;flex:1;padding:8px 0 20px}
.rail-label{font-size:10px;letter-spacing:.18em;color:#7A8798;padding:14px 18px 6px}
.deptbtn{
  display:block;width:100%;text-align:left;background:none;border:0;color:#C3CCD9;
  padding:9px 18px;border-left:3px solid transparent;font-size:13px;line-height:1.4;
}
.deptbtn:hover{background:#1D2531;color:#fff}
.deptbtn.on{background:#202A38;color:#fff;border-left-color:#5B8FE0;font-weight:700}
.deptbtn .meta{display:flex;align-items:center;gap:8px;margin-top:5px}
.minibar{flex:1;height:4px;background:#2E3846;border-radius:2px;overflow:hidden}
.minibar i{display:block;height:100%}
.deptbtn .pct{font-size:10px;color:#93A0B2;font-family:"Roboto Mono",monospace}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  background:var(--card);border-bottom:1px solid var(--rule);
  padding:12px 26px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  position:sticky;top:0;z-index:20;
}
.tabs{display:flex;gap:2px;background:var(--paper);padding:3px;border-radius:var(--r)}
.tab{border:0;background:none;padding:6px 14px;border-radius:2px;font-size:13px;font-weight:500;color:var(--ink-2)}
.tab.on{background:var(--ink);color:#fff;font-weight:700}
.grow{flex:1}
select.sel{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:6px 10px;max-width:220px}
input.search{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:6px 10px;width:210px}
.ghost{background:none;border:1px solid var(--rule);border-radius:var(--r);padding:6px 12px;font-size:12px;color:var(--ink-2)}
.ghost:hover{border-color:var(--ink-3)}
.stale{font-size:11px;color:var(--ink-3)}
.content{padding:22px 26px 70px;max-width:1360px;width:100%}

/* ===== 見出し ===== */
.sec{margin:30px 0 12px;display:flex;align-items:baseline;gap:12px}
.sec:first-child{margin-top:0}
.sec h2{font-size:15px;font-weight:900;margin:0;letter-spacing:.04em}
.sec .note{font-size:11px;color:var(--ink-3)}
.sec::after{content:"";flex:1;height:1px;background:var(--rule)}

/* ===== 報告ヘッダ ===== */
.rephead{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:16px 20px;display:flex;gap:26px;flex-wrap:wrap;align-items:center}
.rephead .dept{font-family:"Zen Kaku Gothic New";font-size:24px;font-weight:900;letter-spacing:.02em}
.kv{font-size:12px;color:var(--ink-2)}
.kv b{display:block;font-size:10px;letter-spacing:.14em;color:var(--ink-3);font-weight:500}

/* ===== 成果A カード ===== */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r)}
.card .ch{padding:11px 16px;border-bottom:1px solid var(--rule-2);display:flex;align-items:center;justify-content:space-between}
.ch .t{font-size:12px;font-weight:700;letter-spacing:.08em}
.ch .u{font-size:10px;color:var(--ink-3)}
.card .cb{padding:16px}
.bignum{font-family:"Roboto Mono";font-size:36px;font-weight:700;line-height:1;letter-spacing:-.02em}
.bignum small{font-size:14px;font-weight:400;color:var(--ink-3);margin-left:4px}
.vsline{display:flex;gap:18px;margin-top:12px;flex-wrap:wrap}
.vs{font-size:11px}
.vs b{display:block;color:var(--ink-3);font-weight:500;letter-spacing:.1em;font-size:10px}
.vs span{font-family:"Roboto Mono";font-size:14px;font-weight:500}
.bar{height:7px;background:var(--rule-2);border-radius:0;margin-top:14px;position:relative;overflow:hidden}
.bar i{display:block;height:100%}
.bar .tick{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--ink)}
.pos{color:var(--achieve)}.neg{color:var(--short)}
.rank{font-family:"Zen Kaku Gothic New";font-size:30px;font-weight:900;padding:2px 14px;border-radius:var(--r)}
.rk-S,.rk-A{background:var(--achieve-soft);color:var(--achieve)}
.rk-B{background:var(--ai-soft);color:var(--ai)}
.rk-C{background:var(--warn-soft);color:var(--warn)}
.rk-D{background:var(--short-soft);color:var(--short)}
.rk-{background:var(--rule-2);color:var(--ink-3)}
.empty{color:var(--ink-3);font-size:12px;padding:6px 0}

/* ===== 施策 ===== */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.msr .cb{padding:14px 16px 16px}
.msr .name{font-family:"Zen Kaku Gothic New";font-weight:700;font-size:15px;line-height:1.35;min-height:2.7em}
.msr .kpi{font-size:11px;color:var(--ink-3);margin-top:4px;min-height:1.6em}
.msr .rate{font-family:"Roboto Mono";font-size:28px;font-weight:700;margin-top:10px}
.msr .ratio{font-size:11px;color:var(--ink-3);font-family:"Roboto Mono"}
.no{font-family:"Roboto Mono";font-size:11px;color:var(--ink-3);letter-spacing:.1em}

/* ===== 三段レール（署名要素） ===== */
.railset{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.rgh{display:grid;grid-template-columns:150px 1fr 1.15fr 300px;background:#F5F7FA;border-bottom:1px solid var(--rule)}
.rgh div{padding:9px 14px;font-size:10px;letter-spacing:.16em;color:var(--ink-3);font-weight:500}
.rgh div+div{border-left:1px solid var(--rule-2)}
.rrow{display:grid;grid-template-columns:150px 1fr 1.15fr 300px;border-bottom:1px solid var(--rule-2)}
.rrow:last-child{border-bottom:0}
.rrow:hover{background:#FAFBFD}
.rrow>div{padding:14px;font-size:12.5px;white-space:pre-wrap;word-break:break-word}
.rrow>div+div{border-left:1px solid var(--rule-2)}
.rsec{color:var(--ink-3);font-size:11px;letter-spacing:.06em;background:#FBFCFE}
.rsec .badge{display:inline-block;font-family:"Zen Kaku Gothic New";font-weight:900;font-size:15px;color:var(--ink);background:var(--rule-2);width:24px;height:24px;line-height:24px;text-align:center;border-radius:2px;margin-bottom:6px}
.rfact{font-weight:500}
.rcause{color:var(--ink-2)}
.rphase{background:#FCFDFE}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{font-size:10.5px;padding:2px 8px;border-radius:2px;font-family:"Roboto Mono";letter-spacing:.02em;white-space:nowrap}
.chip.who{background:var(--ai-soft);color:var(--ai)}
.chip.due{background:var(--warn-soft);color:var(--warn)}
.chip.done{background:var(--achieve-soft);color:var(--achieve)}
.chip.over{background:var(--short-soft);color:var(--short)}
mark{background:#FFF0A8;padding:0 1px}

/* ===== 全社ビュー ===== */
.tablewrap{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);overflow:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--rule-2);white-space:nowrap}
th{background:#F5F7FA;font-size:10px;letter-spacing:.14em;color:var(--ink-3);font-weight:500;position:sticky;top:0}
td.n{font-family:"Roboto Mono";text-align:right}
tr.clk:hover{background:#F3F6FB;cursor:pointer}
.pill{display:inline-block;min-width:52px;text-align:center;padding:2px 8px;border-radius:2px;font-family:"Roboto Mono";font-size:11.5px;font-weight:500}
.hm td.c{text-align:center;font-family:"Roboto Mono";font-size:11px;padding:6px 4px;color:#fff;border:1px solid #fff}
.hm td.lab{font-size:11.5px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.hm th{font-size:10px;text-align:center;padding:6px 4px}

/* ===== マニュアル ===== */
.manhead{background:var(--ink);color:#E4E9F1;border-radius:var(--r);padding:20px 24px;margin-bottom:6px}
.mantitle{font-size:20px;font-weight:900;margin:0;color:#fff;letter-spacing:.02em}
.mansub{font-size:12px;color:#9FADC0;margin:6px 0 0;line-height:1.75}
.mansub code{background:#2A3441;padding:1px 6px;border-radius:2px;font-family:"Roboto Mono";font-size:11.5px;color:#CFE0FF}
.chapnav{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 4px}
.chapchip{font-size:11.5px;text-decoration:none;color:var(--ink-2);background:var(--card);border:1px solid var(--rule);padding:4px 12px;border-radius:2px}
.chapchip:hover{border-color:var(--ai);color:var(--ai)}
.mangrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.mancard .cb{padding:16px 18px 14px}
.manrow{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.mancard h3{font-family:"Zen Kaku Gothic New";font-size:15px;font-weight:700;margin:0 0 8px;line-height:1.4}
.aud{flex:0 0 auto;font-size:10px;letter-spacing:.08em;color:var(--ai);background:var(--ai-soft);padding:2px 8px;border-radius:2px;white-space:nowrap}
.manbody p{margin:0 0 7px;font-size:12.5px;line-height:1.85;color:var(--ink-2)}
.manbody .li{margin:0 0 6px 2px;padding-left:14px;position:relative;font-size:12.5px;line-height:1.8;color:var(--ink-2)}
.manbody .li::before{content:"";position:absolute;left:0;top:.72em;width:5px;height:5px;background:var(--ai);border-radius:50%}
.manupd{font-size:10px;color:var(--ink-3);margin-top:10px;border-top:1px solid var(--rule-2);padding-top:8px}
@media(max-width:900px){.mangrid{grid-template-columns:1fr}}


/* ===== 数値タブ ===== */
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.schip{font-size:11.5px;color:var(--ink-2);background:var(--card);border:1px solid var(--rule);padding:5px 12px;border-radius:2px;line-height:1.3}
.schip:hover{border-color:var(--ai);color:var(--ai)}
.schip.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
.suchibar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.seg{display:flex;background:var(--paper);padding:3px;border-radius:var(--r)}
.seg button{border:0;background:none;padding:5px 14px;border-radius:2px;font-size:12px;color:var(--ink-2)}
.seg button.on{background:var(--ink);color:#fff;font-weight:700}
table.num td,table.num th{white-space:nowrap}
table.num td.k{text-align:right;font-family:"Roboto Mono";font-variant-numeric:tabular-nums}
table.num td.item{font-weight:700;white-space:normal;max-width:230px;position:sticky;left:0;background:var(--card);border-right:1px solid var(--rule)}
table.num td.kubun{color:var(--ink-3);font-size:11px;position:sticky;left:0;background:var(--card);border-right:1px solid var(--rule)}
table.num tr.gap td{border-top:1px solid var(--rule)}
table.num td.cur{background:#F3F6FB;font-weight:700}
table.num th.cur{background:#E7EEF9;color:var(--ai)}
.notecard{white-space:pre-wrap;font-size:12.5px;line-height:1.85;color:var(--ink-2)}
.bigunit{font-size:13px;font-weight:400;color:var(--ink-3);margin-left:4px}

/* ===== 状態 ===== */
.banner{background:var(--warn-soft);border:1px solid #E8D094;border-radius:var(--r);padding:12px 16px;font-size:12.5px;margin-bottom:18px;color:#6B4A05}
.banner b{font-weight:700}
.banner code{background:#fff;padding:1px 5px;border-radius:2px;font-family:"Roboto Mono";font-size:11.5px}
.connect{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.connect input{flex:1;min-width:260px;border:1px solid #DBC38F;border-radius:var(--r);padding:7px 11px;font-family:"Roboto Mono";font-size:11.5px;background:#fff}
.connect button{background:var(--ink);color:#fff;border:0;border-radius:var(--r);padding:7px 20px;font-size:12.5px;font-weight:700}
.connect button:hover{background:#2A3441}
.bnote{font-size:11px;color:#8A6A22;margin-top:8px}
.loading{padding:60px;text-align:center;color:var(--ink-3)}
.hide{display:none!important}
.menu{display:none;background:none;border:0;font-size:20px;padding:0 6px}

/* ===== 応答 ===== */
@media(max-width:1080px){
  .grid3,.grid4{grid-template-columns:1fr 1fr}
  .rgh,.rrow{grid-template-columns:110px 1fr 1fr}
  .rgh div:nth-child(4),.rrow>div:nth-child(4){grid-column:1/-1;border-left:0;border-top:1px dashed var(--rule-2)}
}
@media(max-width:760px){
  .rail{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:transform .2s}
  .rail.open{transform:none}
  .menu{display:block}
  .content{padding:16px 14px 60px}
  .topbar{padding:10px 14px}
  .grid3,.grid4{grid-template-columns:1fr}
  .rgh{display:none}
  .rrow{grid-template-columns:1fr}
  .rrow>div+div{border-left:0;border-top:1px dashed var(--rule-2)}
  input.search{width:140px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="rail" id="rail">
    <div class="rail-head">
      <p class="brand">EARTHCOM</p>
      <h1>部門長会議ボード</h1>
      <div class="rail-sub" id="railSub">実行計画達成状況報告書 ＋ 経営計画資料</div>
      <div class="ver mono" id="ver">v1.3 · 2026-08-17</div>
    </div>
    <div class="rail-scroll">
      <div class="rail-label">全社</div>
      <button class="deptbtn" data-dept="__ALL__">経営サマリー</button>
      <div class="rail-label" id="deptLabel">部門</div>
      <div id="deptList"></div>
    </div>
  </nav>

  <div class="main">
    <div class="topbar">
      <button class="menu" id="menuBtn" aria-label="メニュー">☰</button>
      <div class="tabs" id="viewTabs">
        <button class="tab on" data-view="report">当月レポート</button>
        <button class="tab" data-view="trend">推移</button>
        <button class="tab" data-view="suchi">数値</button>
        <button class="tab" data-view="manual">使い方</button>
      </div>
      <select class="sel" id="monthSel" aria-label="会議日"></select>
      <div class="grow"></div>
      <input class="search" id="q" type="search" placeholder="総括を全文検索">
      <button class="ghost" id="reload">最新を読み込む</button>
      <span class="stale" id="stamp"></span>
    </div>
    <div class="content" id="content"><div class="loading">読み込み中…</div></div>
  </div>
</div>

<script>
/* ============================================================
   接続設定
   GASウェブアプリのURLをここに貼るとスプレッドシートと常時連動します。
   URLは ?api=... でも上書きできます。
   ============================================================ */
const API_URL = "https://script.google.com/macros/s/AKfycbyIeXQL4otLztuQObqddKJIW6dWpbtOW5ZwoVVmJFGkMZit8mg04VqcLo7paZTmpS2S/exec";

/* 「数値」タブ用。スプレッドシート「18期_経営計画資料（部門長会議）」に
   keikaku_suchi.gs を入れてデプロイした /exec のURLをここに貼る。
   ?suchi=... でも上書きできる。 */
const SUCHI_API_URL = "";

const DEFAULT_MANUAL = [{"chapter":"はじめに","title":"このボードは何か","body":"毎月の部門長会議で使う「実行計画達成状況報告書」を、そのまま画面で見られるようにしたものです。\n紙の帳票と同じ並び（成果A → 成果B → 総括）で表示されるので、会議中はこの画面を映しながら進められます。","audience":"全員","updated":""},{"chapter":"はじめに","title":"データはどこから来るか","body":"大元はスプレッドシート「18期_部門長会議報告書」です。アプリは各「実行計画報告・◯◯」シートを読み取って表示しているだけで、アプリ側にデータは持っていません。\n数字を直すときは必ずスプレッドシートを直してください。","audience":"全員","updated":""},{"chapter":"はじめに","title":"いつ反映されるか","body":"スプレッドシートを書き換えると、次にアプリを開いたときに反映されます。\n最大10分ほど前の内容が表示されることがあるため、書いた直後に確認したいときは右上の「最新を読み込む」を押してください。","audience":"全員","updated":""},{"chapter":"画面の見かた","title":"経営サマリー","body":"左上の「経営サマリー」を押すと、その月の全部門が実行計画達成率の高い順に並びます。\n「提出 ◯ / 稼働 ◯部門」で、その月に誰が報告を上げたかが分かります。行をクリックするとその部門の詳細に飛べます。","audience":"全員","updated":""},{"chapter":"画面の見かた","title":"当月レポート","body":"左の一覧から部門を選ぶと、その部門の帳票が出ます。上から順に、会議日と参加者 → 成果A（MQ・G・FM比率）→ 成果B（実行計画達成率と重点施策）→ 総括、という並びです。","audience":"全員","updated":""},{"chapter":"画面の見かた","title":"推移","body":"部門×月の達成率をマス目で表示します。色が赤い月が続いている部門は、単月の問題ではなく構造の問題です。\n部門を選んでから「推移」を開くと、その部門のMQ実績と目標の折れ線も出ます。","audience":"社長・部門長","updated":""},{"chapter":"画面の見かた","title":"検索","body":"右上の検索窓に言葉を入れると、全部門の総括から該当箇所を探して黄色く光らせます。\n「クレーム」「単価」「人員」など、横断で状況を掴みたいときに使ってください。","audience":"全員","updated":""},{"chapter":"画面の見かた","title":"会議日の切り替え","body":"上部のプルダウンで月を変えられます。過去の回もすべて残っているので、「先月なんて言っていたか」をその場で確認できます。","audience":"全員","updated":""},{"chapter":"数値の見かた","title":"MQ","body":"粗利です。カードには「実績 / 目標」が大きく出て、下にバーが伸びます。バー右端の縦線が目標100%の位置です。\n目標差の▲は未達を表します。","audience":"全員","updated":""},{"chapter":"数値の見かた","title":"FM比率","body":"固定費 ÷ MQ × 100 です。低いほど良い指標で、右側にS〜Dの評価が出ます。\nS：59%以下 ／ A：60〜79% ／ B：80〜99% ／ C：90〜99% ／ D：100%以上（赤字）。Dが出た部門は最優先で議題に上げてください。","audience":"全員","updated":""},{"chapter":"数値の見かた","title":"実行計画 達成率","body":"合計評価点 ÷（施策数 × 5点）です。重点施策をどれだけやり切ったかを示します。\n100%以上は緑、80%以上は青、50%以上は黄、それ未満は赤で表示されます。","audience":"全員","updated":""},{"chapter":"数値の見かた","title":"達成率とMQのズレ","body":"実行計画達成率が高いのにMQ達成率が低い場合、「決めた施策はやったが成果につながっていない」状態です。\nこれは部門長の努力不足ではなく、施策の選び方が間違っているサインなので、行動量ではなく施策そのものを見直してください。","audience":"社長","updated":""},{"chapter":"部門長の使い方","title":"会議の前に","body":"自部門の当月レポートを開き、前月の「実行フェーズ」に書いた担当と期限が消化できているかを確認してください。\n期限を過ぎたものは赤いチップで表示されます。ここが埋まらないまま次の施策を足しても積み上がりません。","audience":"部門長","updated":""},{"chapter":"部門長の使い方","title":"会議の中で","body":"この画面を映しながら、成果A → 成果B → 総括の順に報告してください。数字はすでに出ているので、読み上げるのではなく「なぜその数字になったか」と「次に何をするか」に時間を使ってください。","audience":"部門長","updated":""},{"chapter":"部門長の使い方","title":"会議の後に","body":"決まったことは必ずスプレッドシートの「実行フェーズ」欄に書き戻してください。書かなければアプリにも残らず、翌月に確認できません。","audience":"部門長","updated":""},{"chapter":"社長の使い方","title":"提出状況の確認","body":"経営サマリーの「提出 ◯ / 稼働 ◯部門」で未提出が分かります。会議前日にここを見て、出ていない部門長に催促してください。","audience":"社長","updated":""},{"chapter":"社長の使い方","title":"未達の見つけ方","body":"経営サマリーは実行計画達成率の低い順に下へ並びます。下から3部門と、FM評価がC・Dの部門を優先的に見てください。","audience":"社長","updated":""},{"chapter":"社長の使い方","title":"期限の管理","body":"経営サマリー下部の「実行フェーズ｜担当と期限」に、全部門の約束が担当者と期限つきで一覧化されます。\n翌月、ここが消化されたかどうかだけを確認すれば、実行されたか否かが判定できます。","audience":"社長","updated":""},{"chapter":"入力ルール","title":"新しい月の報告を足す","body":"各部門のシートで、いちばん上のブロックの上に前回と同じ形の帳票を追加してください。アプリは「事業部名」というセルを目印にブロックを認識します。\n新しい月ほど上に置いてください。","audience":"部門長","updated":""},{"chapter":"入力ルール","title":"担当と期限の書き方","body":"実行フェーズ欄に「担当：森作」「期限：7/31」の形で書くと、アプリが自動で担当・期限のラベルに変換します。\n期限を過ぎているものは赤、完了と書けば緑になります。この書き方を崩すとラベルが出ません。","audience":"部門長","updated":""},{"chapter":"入力ルール","title":"シート名のルール","body":"アプリはシート名に「実行計画報告」が含まれるシートだけを読みます。\n使わなくなったシートは、名前からこの言葉を外すか削除すると、アプリの部門一覧から消えます。","audience":"管理者","updated":""},{"chapter":"入力ルール","title":"空欄について","body":"記入がない項目は「記載なし」と表示されます。エラーではありません。ただし総括が空のまま続く部門は、報告そのものが形骸化しているサインです。","audience":"全員","updated":""},{"chapter":"困ったとき","title":"「サンプル表示中」と出る","body":"スプレッドシートと接続できていません。管理者に連絡してください。","audience":"全員","updated":""},{"chapter":"困ったとき","title":"書いたのに反映されない","body":"右上の「最新を読み込む」を押してください。それでも変わらない場合は、書いた場所が「実行計画報告」を含むシートかどうか、また上から900行以内かを確認してください。","audience":"全員","updated":""},{"chapter":"困ったとき","title":"部門が一覧に出ない","body":"その月の報告が未提出か、シート名に「実行計画報告」が入っていない可能性があります。会議日を前の月に切り替えると出るかどうかで判別できます。","audience":"全員","updated":""},{"chapter":"困ったとき","title":"このマニュアルを直したい","body":"スプレッドシートの「マニュアル」シートを編集してください。章・見出し・本文を書き換えれば、そのままアプリの「使い方」に反映されます。行を足せば項目も増やせます。","audience":"管理者","updated":""}];

カンダリー15件の商談化をしている\n改善:毎日19時までの報告と朝礼で現在のキャンペーンを報告を実施し変化率を起こします。","phase":""},{"section":"B商品に関する方針より","fact":"❶３ . 独自能力\n（１） 節税商品\nフロー・マニュアル・チェックリスト・スケジュール（FMCS）を標準化し、属人化な業務を仕組みに変える。","cause":"❶-1\n要因: FMCSを標準化することで、認識や業務を体系的に理解し仕組化するため\n分析: FIP転のFMCSを作成する必要がある\n改善: FIP転提案のFMCSを作成したので下記で運用し無料診断取得＞商談化実施いたします。\nFIP転トークマニュアル_251201","phase":""},{"section":"B商品に関する方針より","fact":"❷３ . 重点商品・サービス\n（１） セカンダリー\n既存発電所調達後、リフォート・O＆M・保険を組み合わせた「再資産化投資商品」として再商品化する。","cause":"❷-2\n要因: セカンダリーをリフォートとOMを組み合わせて販売している\n分析: セカンダリーは融資必須のお客様が多い\n改善:京葉銀行の融資枠として法人は関東に支店があること&個人の場合は千葉県在住が必要\nのためターゲットを絞り提案いたします。","phase":""},{"section":"B商品に関する方針より","fact":"❸１．基 本\n（6）全スタッフが商品知識・税務知識・法令知識を体系的に習得し、\nお客様が安心して投資判断を行えるよう、わかりやすく誠実な説明責任を果たす。","cause":"❸-3\n要因：体系的に習得し説明できるスキルまで達していない\n分析：勉強会などの知識習得の仕組みを作成していないから\n改善：月2回の内の1回の勉強会を商品、税務知識への勉強へと組み換えスキルアップを実施します。","phase":""},{"section":"C お客様の声","fact":"❶アミューズメント企画様\n\n「まだ本当にこの数字が出るのかっていう不安はもちろんありますけど、経営をする上でここっていうときには決めないといけないなっていうのは思っていますね。あとは大河原さんを信じてやるだけだよ」","cause":"❶-1\n要因: 初期課題の強度計算書がないところを訴求したから\n分析: 社長同席での訪問商談、競合との違いをAIにて明確化してご案内したため\n改善: PH05は訪問商談を実施します","phase":""},{"section":"C お客様の声","fact":"❷未来テクノス様 堀内社長\n「銀行からの連絡がこっちに来るんだよね、銀行とアースコムさんでやりとりしてよ」","cause":"❷-2\n要因: 銀行からの連絡をすべてアースコムでやりとりを希望している\n分析: 契約者である堀内社長に連絡がくることを認識していただけていないのと\n当社と銀行へのやりとりが不明なため\n改善: 銀行へのやりとりは堀内社長をｃｃに入れて対応します。","phase":""},{"section":"C お客様の声","fact":"❸西馬様\n「今の私の状態にフィットはしないかなと。」\n「そもそも利益が今ない会社で、節税物件から始めてもちょっと意味がないかな。」\n「残FIT10年で10％は厳しいかなと思います。残FITが20年で10年ならいいですけどね」","cause":"❸-3\n要因:提案した「節税案件」が、お客様の真のニーズである「収益性追求」と合致しなかったため。\n分析: 節税対策としての商品でのアプローチ先を間違えているターゲット先のミス\n改善:お客様の投資目的（なぜ投資するのか）や事業背景（法人/個人の状況）を初回商談で徹底的にヒアリングする。\n節税だけでなく収益性など複数の観点から提案を用意し、お客様の状況に合わせた最適なプランを提示する。","phase":""},{"section":"D 従業員の声","fact":"❶相河さん：「リフォートしないセカンダリーについては節税以外の方もアプローチ可能ですか？」","cause":"❶-1\n要因：リフォート工事をしないため除却損が発生しないため\n改善：節税目的ではない人にも一度提案し、その声を再度報告し当たるのか当たっていないのか\nを19日までに報告いたします。","phase":""},{"section":"D 従業員の声","fact":"❷庭さん：「だいたいおおよそ銀行金利は何パーセントですかとお客様から来ますが、どのくらいですか？」","cause":"❷-2\n要因：銀行融資がコーポレート審査であることを認識ができていないため\n改善：トークマニュアルに「銀行融資はコーポレート審査のため金利等は法人様ごとに異なります。\nおおよそ1%~2%」との内容を追加します","phase":""},{"section":"D 従業員の声","fact":"❸渡慶次さん「いま特にセカンダリーの商談化の指示だとおもうのですが、無料診断も続けてとった方が\n良いですか？」","cause":"❸-3\n要因：突発的にはセカンダリーを商談化しているがリフォートの無料診断も必要なため\n改善：役割定義の数字上でセカンダリーに特化していることによって疑念がでている可能性がある\n中長期的に見てリフォートの無料診断は必要であることを説明し3か月の目標設定として走ります。","phase":""},{"section":"Eライバル・業界・取引先情報","fact":"❶未来テクノス様 担当銀行\n山形銀行 仙台支店 藤山様\n「２．最新の事業計画書・算出根拠について\n→添付資料（シュミレーション条件整理、リパワリング後の発電量実績）について、見方が不明ですいません。\n想定発電量1,116,561kwhとなる計算式をご教示ください。","cause":"❶-1\n要因: 返済状況を確認しないとロスタイムになるため\n改善:：左記条件を融資を検討される方は先に確認し、七十七銀行に繋げていきます\n銀行融資先提出資料一覧のチェックリストにて必要資料を提出いたします。","phase":""},{"section":"Eライバル・業界・取引先情報","fact":"❷Tensor Energy 古賀様\n「FIP転は売りませんか？という切り口を提案しています」\n「その次の課題がファイナンスでジャックスはFITを担保にしているのと地方銀行さんはなかなか難しいので\nアプラスか公庫などがいいと思います」","cause":"❷-2\n要因: 勉強会にてターゲット先などを教えていただいたため\n分析: 実際提案している川上に情報を確認した方がはやい\n改善:下記のトークスクリプトとターゲット先にて提案いたします。\nFIP転トークマニュアル_251201","phase":""},{"section":"Eライバル・業界・取引先情報","fact":"❸\n京葉銀行 安原様\n「個人様の場合は千葉県在住かつ物件も千葉県であることが条件ですね」\n「FIT期間での期間が多いです」","cause":"❸-3\n要因：地方銀行のため支店がなく管理できないとのこと\n改善：個人の場合でファイナンスが必要な場合は千葉県在住に絞りターゲット先を選定\nいたします。","phase":""},{"section":"注：①エピソードは口頭で報告します。","fact":"作成時の留意点","cause":"","phase":""},{"section":"注：①エピソードは口頭で報告します。","fact":"① 実績のマイナスは赤字で不足は▲を表記する。 例） 3 ▲5\n②    達成率（％）は黒字で記載する。\n③    数字の相違（記載・計算ミス）は努力文の提出をする。会議後３時間以内の提出。\n④    声は「」で記載する。\n⑤ 結果（総括）プラス要因は文字背景色青（明るい青3）・マイナス要因は文字背景色赤（明るい赤3）","cause":"","phase":""}],"auth":"","sheet":"新・見本　実行計画報告"},{"dept":"営業","date":"2026-07-06","time":"18：00-18：30","members":"大河原・石井・庭・相河・村田・渡慶次","mq":{"month":{"actual":16.0,"prev":3.0,"diffPrev":13.0,"target":120.0,"diffTarget":-104.0},"total":{"actual":16.0,"prev":42.0,"diffPrev":-26.0,"target":400.0,"diffTarget":-384.0}},"g":{"month":{"actual":null,"prev":null,"diffPrev":null,"target":null,"diffTarget":null},"total":{"actual":null,"prev":null,"diffPrev":null,"target":null,"diffTarget":null}},"fm":{"month":{"actual":77.0,"target":59.0,"rank":"A"},"total":{"actual":647.0,"target":59.0,"rank":"D"}},"plan":{"month":{"score":7.0,"max":15.0,"rate":0.4666666667},"total":{"score":7.0,"max":15.0,"rate":0.4666666667}},"actions":[{"no":"①","name":"無料診断","kpi":"27/16 ▲11","month":{"actual":3.0,"target":5.0,"rate":0.6},"total":{"actual":3.0,"target":5.0,"rate":0.6}},{"no":"②","name":"訪問商談","kpi":"15/9 ▲6","month":{"actual":3.0,"target":5.0,"rate":0.6},"total":{"actual":3.0,"target":5.0,"rate":0.6}},{"no":"③","name":"勉強会（基礎構築）","kpi":"合格者3/0 ▲3","month":{"actual":1.0,"target":5.0,"rate":0.2},"total":{"actual":1.0,"target":5.0,"rate":0.2}}],"summary":[{"section":"A数値報告","fact":"❶\n四半期数字\n営業本部予算進行PQ 1000/103 ▲897\n営業本部予算進行MQ 400/16 ▲384\n\n\nリフォート1\nPCS1\nサンキーパー4\nエックスモバイル1","cause":"❶-1\n要因\n高額案件の決済者同席の遅れ、稟議スケジュールの把握不足など担当者から決裁者への価値提案が\nできていないこと。\n\n分析\n高圧RF1メガ分×19区画 or 低圧RF×213区画の契約締結が必要。\n\n\n改善\n庄和商事様の成功要因である埼玉事業者×関東物件での提案を実施てリードタイムの短縮\nと受注率向上を実施する。","phase":"埼玉事業者×関東物件での提案\n担当：営業 \n期日：7/29"},{"section":"A数値報告","fact":"❷訪問商談数\n15/9 ▲8","cause":"❷-2\n要因：高圧RFの商談設定の不足＞また低圧RFでの訪問商談も設定していない。\n分析：西日本の提案を整理して、関東、浜通りでの提案を実施する。\n改善：埼玉事業者×関東物件でのリストでのインサイドの提案を実施する。\n>DM送付を定期的に実施する。","phase":"埼玉事業者×関東物件へのDM送付\n担当：営業 \n期日：7/29"},{"section":"A数値報告","fact":"❸メンテナンス契約数\n10/1 ▲9（先月対比▲6件）","cause":"❸-3\n要因：現状の契約内容の見直し提案が出来ていない\n分析：契約中の内容のヒアリングが出来ていない\n改善：反射シート管理のメリットと保証制度の資料を改善し、現地時には別途管理の加入が可能かを提案する","phase":"反射シートのみ、遠隔監視のみの価格試算表の作成（完了済み）\n担当：FS\n期限：完了"},{"section":"B,営業に関する方針より","fact":"❶ ３ . 独自能力\n（１） 節税商品\nフロー・マニュアル・チェックリスト・スケジュール（FMCS）を標準化し、属人化な業務を仕組みに変える。","cause":"❶-1\n要因：電力申請、リフォートの着工確認がFMSCにてできていない\n分析：大澤さんに頼り切りになっている。\n改善：電力申請についてCS主導にて実施する。工程管理は全案件をアナログで管理する","phase":"アナログ管理表作成。\n担当：石井\n期限：7/6"},{"section":"B,営業に関する方針より","fact":"❷１．基 本\n（２） 営業活動における全お客様情報を数値化・データベース化し、フェーズ管理・成約率・粗利益率・リピート率などをAIで分析し、営業効率と品質を同時に高める。","cause":"❷-2\n要因：完工済み案件のデータ蓄積により、発電量エビデンスとして提示ができるようになってきた\n分析：現地案内と実績資料の提示によって、シミュレーション根拠を示すことが可能になる\n改善：毎月経過を確認し、Before/Afterでの提示が出来るよう、年間発電量を収集する","phase":"実績データをもとに発電量資料を作成し、蓄積・更新を行っていく\n担当：FS\n期限：完工後1か月経過時点"},{"section":"B,営業に関する方針より","fact":"❸３.３.見直し・改善・開発\n（６） 全体スキーム・契約条件・納期・保証内容を文書で明示し、お客様・金融機関・社内全体で共有することで、誤解・トラブルのない透明な取引を実現する","cause":"❸-3\n要因：契約後にお客様の経産省への地番登録漏れ等が判明し、申請完了よりも工事の方が先に終了するという状況が発生している\n分析：4Qに契約したお客様に関しては契約時に地番登録や認定書の確認実施ができていなかった\n改善：合意書締結・契約締結のFMCSに追加し、契約後に懸念が発生しないようにする","phase":"合意時・契約締結時のマニュアル、チェックシートへの追加（完了済み）\n担当：FS\n期限：完了"},{"section":"C お客様の声","fact":"❶未来テクノス様 堀内社長\n「下請けに丸投げなのが問題ですよ」","cause":"❶-1\n要因：完工完了報告が反射シートがしばらくかかると報告した次の日に実施したため\n分析：エイタイからくる工事報告と堀内社長に報告する内容に差異がでている。\n改善：着工報告、完工報告、ならびに施工中の工程管理についてルール設定を実施する。","phase":"着工報告、完工報告、ならびに施工中の工程管理についてルール設定を実施する。\n担当：部門長\n期限：7/6"},{"section":"C お客様の声","fact":"❷山本社長 低圧RF\n「最初提案したときは450万だったのに、突然900万は違うでしょ。」","cause":"❷-2\n要因：6月中旬まで提案していたお客様がパネルのみのシミュかつ価格が安いシミュで提案していた\n分析：現調後の見積もりが現調前とくらべて高額なためお客様が決定しづらい\n改善：最新のシミュレーションにはkW単価が入っているためそのシミュレーションで提案する。","phase":"実績データをもとに発電量資料を作成し、蓄積・更新を行っていく\n担当：IS\n期限：完工後から毎月実施"},{"section":"C お客様の声","fact":"❸ マルダイフレッシュフーズ 大曽根社長\n「前年対比50％もあがったの！？これだけシミュレーションよりもよかったらまたもう1件ってなりますよね、金額上がるのならあの時やっておけばよかったかなあ」","cause":"❸-3\n要因：下金沢発電所の完工後訪問を実施した際に頂いた声\n分析：前年比+50%、シミュレーション日+15%の実績が直近1か月で出ている状況\n改善：完工訪問の際は必ず1か月分のデータを持参し、追加提案や紹介依頼を行う","phase":"完工後訪問のFMCS更新（完了済み）\n担当：FS\n期限：完了"},{"section":"D 従業員の声","fact":"❶庭さん\n「南相馬のＤＭリストから1件アポとりました。ただＤＭは見ていないようでした。」","cause":"❶-1\n要因：1回のＤＭ送付では、担当者が見てないケースが多い\n分析：4日送付のためまだ届いていない可能性あり\n改善：ＤＭ送付後は2営業日後に架電を実施する。","phase":"簡易シミュレーションにて案内する\n担当：営業 \n期日：無量診断報告日"},{"section":"D 従業員の声","fact":"❷村田さん\n「低圧RFってバルクの場合、1件ずつ役割定義に反映していいんですか？相河さんがそういうカウントしていたんですけど、そうなると僕もバルク11区画あるので、役割定義の部分も簡単に達成できちゃうからどうなのかなって思ったのですが」","cause":"❷-2\n要因：低圧バルクの場合の役割定義カウント基準が不明確な状態\n分析：10名10区画と1名10区画の基準が同じになっており、ラッキー案件が優位になっている\n改善：商談シートは1件ずつ作成するが、1件当たり1カウントとする","phase":"商談管理を実施するために、ISはその日の商談ログを上司に提出し蓄積する\n担当：大河原\n期限：毎日"},{"section":"D 従業員の声","fact":"❷渡慶次さん\n「6月1週目とかに低圧RF提案していたお客様はキロワット10万円で400万円位で話をして現調を取っていたので、今PCS込みで800万円ってなった時に、話が違うじゃんってすでに2名のお客様から言われてしまって」","cause":"❷-2\n要因：申込書取得前には400万円ほどの試算状況だったが、PCS込みかつキロワット10万→13万になったことで800万円にまで価格上昇している\n分析：序盤に提案したお客様に関しては、価格差が不満要素に繋がっている\n改善：現調後の結果をもとにPCSの故障リスクなどもお伝えし、再度ご検討いただく流れにする","phase":"収支試算後の提案\n担当：IS\n期日：随時"},{"section":"Eライバル・業界・取引先情報","fact":"❶GRAND WORKS株式会社\n条件：高い金額提示したところに売る、8億～10憶」\n・中電管轄\n・2027年度連系合計5件\n・4月\n・8月×2つ\n・10月\n・2月","cause":"❶-1\n要因：\n分析：\n改善：","phase":"提案時のフローへ追加（完了済み）\n担当：FS\n期日：完了済み"},{"section":"Eライバル・業界・取引先情報","fact":"❷岩渕薬品 岩渕専務\n直近１ヶ月で2社から蓄電池のご提案あり\nどちらも6億だが、売電市場が異なるとの事\n他社は融資は難しいという見解だが、千葉銀行が蓄電池の実績があるため、岩渕薬品さま規模であれば、可能性はある","cause":"❷-2\n要因：前回訪問から1か月ほどしか経過していない中、蓄電池の提案を2社からされていたが、コンタクトが取れているお客様のため、他社の情報開示も実施いただけた\n分析：当社のご提案後、千葉銀行へ蓄電池の融資実績の確認を実施されたとのこと\n改善：エイタイさんは千葉銀行での蓄電池の融資実績もあるため、融資のご検討を希望されるお客様は積極的にお繋ぎする","phase":"関東エリアの法人で蓄電池融資をご希望のお客様は、千葉銀行の実績をお伝えしお繋ぎする\n担当：営業\n期限：随時"},{"section":"Eライバル・業界・取引先情報","fact":"❸GOOG 櫻井社長\n「上里建設さんはPCSとアルミケーブルに変えたりの工事で1600～1800万円くらいでした。工事とかも上建さんで、遠隔監視とかは無料でやってくれていますね」","cause":"❸-3\n要因：AC500kwの案件で上里建設さんからPCS交換のリパワリング提案されている\n分析：金額だけで見たときに当社の7000万円は高いとの声あり\n改善：機器故障対策と再試算化は全く違うものであることをお伝えし、実績データを用いた卒FIT後も見据えたご案内を実施","phase":"切り返しトークへ追加（完了済み）\n担当：FS\n期限：完了"}],"auth":"","sheet":"実行計画報告・営業（5分）"},{"dept":"東北アセット","date":"2026-06-01","time":"18:00～18:30","members":"狐塚、佐藤、清水、大場、内間、晝間","mq":{"month":{"actual":12.0,"prev":null,"diffPrev":null,"target":100.0,"diffTarget":-88.0},"total":{"actual":12.0,"prev":null,"diffPrev":null,"target":100.0,"diffTarget":-88.0}},"g":{"month":{"actual":null,"prev":null,"diffPrev":null,"target":null,"diffTarget":null},"total":{"actual":null,"prev":null,"diffPrev":null,"target":null,"diffTarget":null}},"fm":{"month":{"actual":438.0,"target":59.0,"rank":"D"},"total":{"actual":543.0,"target":59.0,"rank":"D"}},"plan":{"month":{"score":10.0,"max":15.0,"rate":0.6666666667},"total":{"score":10.0,"max":15.0,"rate":0.6666666667}},"actions":[{"no":"①","name":"","kpi":"","month":{"actual":5.0,"target":5.0,"rate":1.0},"total":{"actual":5.0,"target":5.0,"rate":1.0}},{"no":"②","name":"","kpi":"","month":{"actual":3.0,"target":5.0,"rate":0.6},"total":{"actual":3.0,"target":5.0,"rate":0.6}},{"no":"③","name":"","kpi":"","month":{"actual":2.0,"target":5.0,"rate":0.4},"total":{"actual":2.0,"target":5.0,"rate":0.4}}],"summary":[{"section":"A 数値報告","fact":"❶丸紅ＰＪ\n・引き渡し件数：１件\n※PJ全体未入金合計金額：▲702,306,145（当月入金金額：62,710,593）","cause":"❶要因：外線工事日程がでたものから随時引渡し依頼をかけ、資料格納等期日に間に合わせたから。\n改善：契約済み未引渡しが57件あるため、完工までのスケジュール・外線工事日程調整を３Q中に終わらせるよう、13日までに各案件の歩留まりチェック・解消対応をする。","phase":"開発次長が、13日までに契約未引渡し案件58件分のスケジュールを見直して、対応に着手した状態にする。"},{"section":"A 数値報告","fact":"❷リエネ新規契約：３件\n見込みMQ：12","cause":"❷要因：現調依頼からQA対応をして期日設定ができたから。\n改善：２週間に５件をリエネ契約条件クリアした状態を作り、毎月10件の契約目標設定をして対応する。","phase":"開発内勤にてハザードチェック後、土地PH04以上＆法令許認可確認＆現地確認を２週間単位で対応する。"},{"section":"A 数値報告","fact":"❸\n物件化（税制） 1件 前月対比▲2\nhttps://earthcom.lightning.force.com/lightning/r/Report/00OJ3000000OwrWMAS/view\n物件化(アセット） \nA判定 1区画 前月対比▲4\nhttps://app.salescore.jp/o/68b01538-874e-4c4e-9499-477056b95557/v2\nBC判定 6区画+1\nhttps://app.salescore.jp/o/68b01538-874e-4c4e-9499-477056b95557/v2","cause":"❸‐3\n要因\n税制：アセット物件の調達を特化したため\nアセット：物件化7区画できているものの、通過率が19％と低く、A判定物件が1区画のみとなっている\n\n行動変化\n税制：申込書お客様が4名7区画いらっしゃるため11月7区画目標に物件化を進めてまいります。\n10月未対応で特措法の担保が19区画あるため、その中から7区画リリースした状態にいたします。\nアセット：BC物件での担保が5区画、情報取得の歩留まりが33区画あるため、物件化を進めてまいります。","phase":""},{"section":"B 商品に関する方針より","fact":"❶【商品】２．商品・サービス \n（４） 指定アセット物件条件の明確なアセット案件（FIT・非FIT問わず）を選定し、金融機関・投資家・ファンドが安心して運用できる商品として展開する。","cause":"❶要因：工事仕様書・包括契約をもとにした条件・施工がマストになるから。\n改善：完工確認時に、今までの是正項目を入れて完工確認をする。","phase":"開発外勤にて、29日までに完工済み案件の是正の有無をチェックした状態にする。"},{"section":"B 商品に関する方針より","fact":"❷【商品】１．基本\n（６） 全スタッフが商品知識・税務知識・法令知識を習得し、お客様が安心して投資判断できるよう、わかりやすく誠実な説明責任を果たす。","cause":"❷要因：近隣問題による丸紅ＰＪで解約が他社で発生したから。\n改善：住宅地での開発は整理する。","phase":"開発内勤・外勤にて22日までに契約案件の見直しをして近隣住民の懸念の無い案件を契約に進める。"},{"section":"C お客様の声","fact":"❶知念様（錦台A発電所ご契約のお客様）\n「これなら安心できますね、1200万くらいの物件はないんですか？」","cause":"❶要因：現地確認時に、防草シートとサンキーパーの物件を見ていただいたから。\n改善：来期で1,200-1,300万くらいの物件があれば検討したいということでしたので、営農型・野立てのリリース準備を並行して行う。","phase":"東北アセットにて、営農型・野立てのリリース準備を並行して行う。"},{"section":"C お客様の声","fact":"❷岩渕薬品 岩渕専務 村木A発電所について\n「ご説明につきましては、内容を理解できましたので、ご足労いただかなくても結構です。  \n今後はこのようなことがないよう、管理体制を強化いただけますようお願い申し上げます。」","cause":"❷要因：除外申請について、当初の計画段階では本来組み込むべきはずのところをスケジュールに組み込まれておらず、農転申請の準備の段階で除外申請を把握、実施する形となったから。\n改善：工程表作成時に行政書士に各行政へ事前相談を入れ、スケジュールを確定させたものを提示する。","phase":"工程表は行政書士からの回答があったものを確認してから提示する。"},{"section":"C お客様の声","fact":"❸丸紅 池田様\n「６月30日に振り込まれる予定だったものが、まだ着金の確認が取れていません。丸紅か丸紅新電力か名義もややこしくしまっている部分もあるため、至急ご確認いただけますか？」","cause":"❸要因：個人のメールアドレス向けに送信があり、返信後のワークフロー申請がなかったから。\n改善：窓口を１本にまとめ、メール受信から３営業日以内にワークフロー申請まで完了させる。","phase":"支払については、PJリーダーが窓口となり、請求書受領後３営業日以内にワークフロー申請を行い、経理へチェックを受ける。"},{"section":"D 従業員の声","fact":"❶大場さん\n「岩渕薬品様案件について、社内では共有していたと思いますが、先方へ伝えたかは不明でした。」","cause":"❶要因：社内スケジュール会議の内容がお客様へ伝わっているかまでは不明だったから。\n改善：CSが窓口となり、開発は遅延要素が発生した場合、要因と対策を当日中に報告する。","phase":"開発は遅延要素が発生した場合、要因と対策を当日中に報告する。"},{"section":"D 従業員の声","fact":"❶晝間さん\n「今PJが多くて業務の幅も広くなってきて、これは誰がやって誰に聞けばいいんだろう状態なんです。AI使うと言っても限界を感じていて、体制含めて見直しはできないでしょうか。」","cause":"❶要因：各業務担当に尺度のあるスタッフを配置できていないから。\n改善：各ＰＪのフロー・マニュアル・チェックリストとＬＭを整備して、尺度がないスタッフでも対応できるようにする。","phase":"狐塚が17日までにツールを作成・横展開する。"},{"section":"D 従業員の声","fact":"❸佐藤さん\n「作物がサカキなら1,000㎡の土地でも営農型で基準クリアできます。」","cause":"❸要因：遮光率を下げると面積が必要だから。\n改善：2,000㎡以降はブルーベリーとし、1,000㎡前後で基準クリアできるものは、サカキでリリースする。","phase":"狐塚にて、19日までに圃場整備計画の有無を行政から回答を得る。"},{"section":"E ライバル・業界・取引先情報","fact":"❶リエネ 工事仕様に変更あり\nアルミケーブルの起用・遠隔監視用の電源を追加で設置にて提案。","cause":"❶要因：盗難対策をした区画が盗難されたり、遠隔監視用の太陽光パネルから発火して一号柱が燃えた事例が発生したから。\n改善：原価とkW単価の見直しを12日までに行い、リエネ様へ提示した状態にする。","phase":"清水さんにて10日までに原価出しを行い、狐塚にて15日までにリエネ様へkW単価見直しの提案をする。"},{"section":"E ライバル・業界・取引先情報","fact":"❷アグリサスについて\n・マイナビバイト（184,800円） 応募数10件 → 面接5件 → 採用３名\n・インドネシア人雇用開始","cause":"❷要因：管理圃場の増加・収穫作業等が新たに始まるため。\n改善：販路開拓を狐塚が行い、現場対応を富岡支社メンバーとアルバイト・インドネシア人にて役割分担する。","phase":"狐塚が17日に商品を持って販路先へ訪問を行う。"},{"section":"E ライバル・業界・取引先情報","fact":"❸フォスター・アデルフォ・大翔建設\n東京都の補助金で住宅用のパネルや蓄電池をやっている","cause":"❸要因：東京都から補助金が出るから。\n改善：提携先の動きは２か月に１回はコミュニケーションを取って、動向を把握する。","phase":"30日までに各会社ごとの確認表を作成し、７月から運用を開始する。"},{"section":"E ライバル・業界・取引先情報","fact":"【中間報告】\n東北アセットが工程管理に分かれたため、今月分から実行計画を再作成いたしました。下記で承認をお願いいたします（左：before / 右：after）。\n第一施策：営農型リリース10件    → 丸 回収期間の許容範囲を確認し、提案内容を最適化する。","phase":"現調前の依頼チェック\n担当：森作\n期限：毎週水、金曜日"},{"section":"営業に関する方針より","fact":"❷２．重 点\n③ 商談進捗はフェーズ管理（PH01～PH08）で行い、各段階の成約確度・課題・次アクションを明確化する。","cause":"要因：商談化後20日以上経過しても、商談化への移行が進まず、PH歩留まりが解消できていない。\n分析：商談化へ進める明確な判断基準がなく、案件ごとの優先順位付けや見極めが曖昧なため、商談化までのスピードが低下している。\n改善：現地調査前の商談時に、自己資金の有無・過積載率・設備年数・投資意向などを事前ヒアリングし、商談化の優先順位を見極めたうえで、現地調査からの最終提案まで進める。","phase":"現調前の依頼チェック\n担当：森作\n期限：毎週水、金曜日"},{"section":"営業に関する方針より","fact":"❸ ３ . 独自能力\n（１） 節税商品\nフロー・マニュアル・チェックリスト・スケジュール（FMCS）を標準化し、属人化な業務を仕組みに変える。","cause":"❸-3\n要因：必要な確認事項や手順が明文化されておらず、経験や個人の判断に依存している。\n分析：担当者不在時の対応漏れや手戻りが発生しやすく、組織として再現性のある運営ができていない。\n改善：定期的にFMCSを見直し、成功事例や改善点を反映することで、継続的な業務改善につなげる。","phase":"FMCSチェック\n担当：石野\n期限：月初第一水曜日"},{"section":"C お客様の声","fact":"❶","cause":"❶-1\n要因：\n分析：\n改善：","phase":"セカンダリー\n担当：石野\n期限：PH03時"},{"section":"C お客様の声","fact":"❷水掫文浩様 個人 低圧リフォート\n「今回の取り外し、輸送費、産廃費が削減できる費用を見積に正しく反映して頂きたいだけです。このVA提案に対して、下がるどころか逆に工事費が高くなっているのは納得できません。」","cause":"❷-2\n要因：お客様の負担軽減を目的に、72kWのパネルを半分交換する提案を受け、その条件で商談を進めていた。\n分析：お客様の要望を優先し、当社の施工可否や収益性の整理が後手になった。\n改善：施工可否と収益性を踏まえて条件を再整理し、フルリフォートを軸に再提案する。","phase":"出口戦略も合わせた提案\n担当：森作\n期限：7/8 現調後提案"},{"section":"C お客様の声","fact":"❸サンセット 竹澤様 紹介者\n「千葉は蓄電池の土地売ってくださいってすごいんだよ。毎週のようにチラシ来るからな。でも細かいところ持ってる人なんて相違ないから逆に太陽光を攻めるなら今だな。」","cause":"❸-3\n要因：千葉エリアで蓄電池用地の競争が激化しており、他社から地主への営業も増えている。\n分析：蓄電池用地は競合が多くなっている一方、太陽光用地はまだ獲得余地があると判断できる。\n改善：千葉エリアでは蓄電池用地だけに偏らず、競合が少ない太陽光用地の開拓を強化する。","phase":"現調前の依頼チェック\n担当：森作\n期限：毎週水、金曜日"},{"section":"D 従業員の声","fact":"❶三浦さん\n蓄電池用地確保なら不動産のほうがいいですよね。細かい雑種地とかもありますし。」","cause":"❶-1\n要因：DMの送付エリアの選定基準が明確でなく、一部地域へ偏った送付となっている。\n分析：地域ごとに発電所の設置件数やターゲット件数が異なるにもかかわらず、実績や市場性を踏まえたエリア選定ができていないため\n改善：各都道府県の発電所件数・過去の反響率・商談実績を分析し、実績の高いエリアを優先してDMを送付する。また、定期的に反響データを検証し、送付エリアを見直すことでDMの費用対効果を最大化する。","phase":"DM送付選定\n担当：森作・三浦・岩井 \n期日：毎週月曜日"},{"section":"D 従業員の声","fact":"❷岩井さん\n「今自分がどこの仕事をしているのかがわからないんですよね。」","cause":"❷-2\n要因：業務における役割や優先順位が明確になっていないから。\n分析：取り組むべき業務や目標が整理されていないため、優先順位の判断に迷いが生じている。\n改善：毎日の業務開始時に優先順位・目標・役割を明確化し、タスクを整理する。","phase":"小MTGでのすり合わせ\n担当：森作\n期限：毎日"},{"section":"D 従業員の声","fact":"❸江藤さん \n「利益が出ている段階で追加投資をする理由がわからない人に対してはどうしてますか？」","cause":"❸-3\n要因：回収年数が1年切る事業者へPR商談PHUPができないから。\n\n分析：卒FIT後の優位性をお客様へPR出来ていないから。\n\n改善：残FIT1年切る事業者は整理、またインサイド時点での簡易シミュレーションでの発電量ヒアリングで診断獲得するかを精査する。","phase":"経産省 残FIT7年以下は優先で提案しない\n担当：全員\n期限：毎日"},{"section":"Eライバル・業界・取引先情報","fact":"❶ 大和ハウスグループ 大和エネルギー株式会社 \n太陽光リパワリングをした発電量40%アップ見込み","cause":"❶-1\n要因：\n分析：経年劣化やホットスポットの発生が進行している可能性が高い。今後さらに発電効率の低下や故障リスクが高まることが想定される。\n改善：現地調査およびPR時にパネルメーカー・設置年数・現在の発電状況をヒアリングする。サニックス製パネルの実際の劣化事例（変色・焼損）を共有し、お客様へリスクを具体的に伝えたうえで、商談化およびリフォート提案につなげる。","phase":"サニックスパネル事例\n担当：営業 \n期日：完了"},{"section":"Eライバル・業界・取引先情報","fact":"❷福島エナジー \n東電管内でも100区画仕込んでいる","cause":"❷-2\n要因：低圧蓄電池の選考販売の完売になった。\n分析：先行で契約締結の実施をしている。\n改善：電力の申請方法を確認し自社で取り入れる。","phase":"関東エリアの法人で蓄電池融資をご希望のお客様は、千葉銀行の実績をお伝えしお繋ぎする\n担当：営業\n期限：随時"},{"section":"Eライバル・業界・取引先情報","fact":"❸株式会社アポロ 湯村さん\n償却の起点日\nローン・自己資金でのお支払いの決済が起点となる。","cause":"❸-3\n要因：セカンダリー案件の疑問点をお客様として聞いている。\n分析：不動産知識が豊富で比較は不動産投資を出している。\n改善：使用できるツールは自社用に変更し活用する。","phase":"随時取扱商品の見直し・比較を行う\n担当：営業\n期限：月1回"},{"section":"Eライバル・業界・取引先情報","fact":"作成時の留意点","cause":"","phase":""},{"section":"Eライバル・業界・取引先情報","fact":"① 実績のマイナスは赤字で不足は▲を表記する。 例） 3 ▲5\n②    達成率（％）は黒字で記載する。\n③    数字の相違（記載・計算ミス）は努力文の提出をする。会議後３時間以内の提出。\n④    声は「」で記載する。\n⑤ 結果（総括）プラス要因は文字背景色青（明るい青3）・マイナス要因は文字背景色赤（明るい赤3）","cause":"","phase":""}],"auth":"","sheet":"実行計画報告・関東アセット（5分）"},{"dept":"生産管理部","date":"2026-07-02","time":"8:00～8:30","members":"鈴木・久安・長・砂川・吉田・金子・荒熊・加藤・鈴木陸","mq":{"month":{"actual":7.5,"prev":6.5,"diffPrev":1.0,"target":7.1,"diffTarget":0.4},"total":{"actual":16.3,"prev":11.9,"diffPrev":4.4,"target":14.2,"diffTarget":2.1}},"g":{"month":{"actual":null,"prev":null,"diffPrev":null,"target":null,"diffTarget":null},"total":{"actual":null,"prev":null,"diffPrev":null,"target":null,"diffTarget":null}},"fm":{"month":{"actual":null,"target":null,"rank":""},"total":{"actual":null,"target":null,"rank":""}},"plan":{},"actions":[{"no":"①","name":"新規リード","kpi":"新規リード数","month":{"actu :"A 数値報告","fact":"❸勉強会 2 / 2","cause":"❸-3 \n要因：開催時間のブロックをしたため。\n分析：ゴールの状態を把握してフェーズごとのやるべき事を認識する。\n改善：課長が中心に、現場対応のFMCSを用いて勉強会を実施する。","phase":"課長が、3/19（木）までに既存のFMCSが格納されており、疑念がないかを確認し、生産管理チャットで疑念有無の報告をする。"},{"section":"B 商品に関する方針より","fact":"❶３．実 行\n（４） 保険対応・修繕見積り・部品交換は、お客様代理として保険会社・メーカーと調整し、迅速に完了させる。\n\n遠隔監視回線切り替え受注 10件","cause":"❶-1  \n要因：期限を明確にし売電ロスリスクを訴求できたため。\n分析：切り替えをしなかった際のリスクをを伝えることで訴求ができた。\n改善：メールでつながらないお客様へは電話にて提案をしていく。","phase":"生産管理メンバーが3/19（木）までに切り替え提案を5件を実施した状態にする。"},{"section":"B 商品に関する方針より","fact":"❷２．重点商品・サービス（５） パッケージ商品FIP転・サンキーパー・保険・メンテナンス・パネル洗浄などを一体化した「防犯・発電・管理」を兼ね備えた統合ソリューションとして提供する。\n\nパネル洗浄受注 2件","cause":"❷-2 \n要因：メンテナンス時の現地写真から提案できたため。\n分析：現地状況からの発電量改善を訴求できた。\n改善：パネル洗浄は現地写真をもとに提案を行う。","phase":"生産管理メンバーが3/19（木）までに駆けつけ対応物件での追加提案を5件実施した状態にする。"},{"section":"B 商品に関する方針より","fact":"❸１．基本（５） メンテナンス・保険・共済制度を一体化した「安心パッケージ」を確立し、特許取得のサンキーパーおよび免責０円の保険制度を活用して、盗難リスク・維持コストを軽減する。\n\nサンキーパー申込 0件（生産管理での）","cause":"❸-3 \n要因：現地からの改善提案をパネル洗浄のみで実施していたため。\n分析：現場からの提案は現地写真を用いての実施が必要。\n改善：受注が入ったパネル洗浄と同様に現地写真を用いてサンキーパー提案を実施する","phase":"生産管理メンバーが3/19（木）までにメンテ時に現場写真を用いてサンキーパー提案を10件提案した状態にする。"},{"section":"C お客様の声","fact":"❶加藤一夫様\n「交換完了ありがとうございます。これで発電再開ですね。」","cause":"❶-1 \n要因：現場から都度進捗を電話にてご報告ができたため。\n分析：メールのみではなく電話にて進捗報告が実施できた。\n改善：メール返信のないお客様に関しては電話にて報告する。","phase":"都度対応"},{"section":"C お客様の声","fact":"❷株式会社ジェイ・アイ・エム 佐藤様\n「わかりました。3/27に現地入る予定なのでそこでお願いします。」","cause":"❷-2 \n要因：現調時に寸法取りを間違えて施工ができていない。\n分析：現調時に数値のみを記載しており第3者がチェックできる体制ではなかった。\n改善：現調時にスケールの写真を格納することで第3者が数値のチェックをできる体制にします。","phase":"サンキーパー現調マニュアル更新済み。"},{"section":"C お客様の声","fact":"❸株式会社クロスオン 古田様\n「4月5月の日照が増える時期に、雑草の繁茂に対し手をこまねいているのは得策でないと思います。」","cause":"❸-3 \n要因：メンテナンス実施時期に関してこちらの見解で伝えていたため。\n分析：お客様のご要望をお聞きする前に予定時期を提案したため。\n改善：お客様のご要望をお聞きした上で実施時期を判断する。","phase":"久安が3/19（木）までにメンテナンス実施を外注へ依頼した状態にする。"},{"section":"D 従業員の声","fact":"❶吉田さん \n「遠隔監視機器の回線切り替えで入金2件もらえました。」","cause":"❶ｰ1 \n要因：期限を明確にし売電ロスリスクを訴求できたため。\n分析：切り替えをしなかった際のリスクをを伝えることで訴求ができた。\n改善：メールでつながらないお客様へは電話にて提案をしていく。","phase":"生産管理メンバーが3/19（木）までに切り替え提案を5件を実施した状態にする。"},{"section":"D 従業員の声","fact":"❷金子なおさん  \n「パネル洗浄を受注できました。」","cause":"❷-2 \n要因：部署でのＦＭＣＳを回すことで、ＰＱ19の獲得ができたため。\n分析：パネル洗浄提案の数を週5件に増やしたことで提案メールの改善ができた。\n改善：現場提案でのうまく言った事例を増やして他の人でも成果が生まれるよう改善していく。","phase":"金子なおさんが3/19（木）までにうまくいったメール事例の更新をおこなう。"},{"section":"D 従業員の声","fact":"❸坂本さん\n 「３ｍを超えるサンキーパーは追加料金もらわないのですか。」","cause":"❸-3  \n要因：3.8ｍのサンキーパーであっても一律の値段設定になっているため。\n分析：。\n改善：現調時に３ｍを超えるものは追加料金が発生するルール提案を実施する。","phase":"久安が3/17（火）までにルール提案をおこなう。"},{"section":"E ライバル・業界・取引先情報","fact":"❶パワーエンジニアリング 青尾様\n「ソーラーフロンティアのパネル洗浄は、パネルの特性上\n洗浄の効果が数字に現れにくいです。」","cause":"❶-1 \n要因：ソーラーフロンティアは洗浄しても効果が出にくい\n分析：化合物でのパネルで数字上だと効果がでにくい。\n改善：数字ではなく現地写真から提案実施する。","phase":"提案マニュアルに追加済み\n太陽光パネル洗浄提案マニュアル"},{"section":"E ライバル・業界・取引先情報","fact":"❷竹森保温工業 竹森様\n「3月後半、GWあたりは現場が入ってるから確定してるものは早めに図面ちょうだい」","cause":"❷-2 \n要因：現状4月半ばまで前倒しで発注できているため\n分析：訪問回数を増やすことで竹森さん側のスケジュールを把握できているため。\n改善：週1回発注日をカレンダーに入れて発注漏れがない状態にする。","phase":"3/16（月）までに追加5件の新規発注を実施した状態にする。"},{"section":"E ライバル・業界・取引先情報","fact":"❸エナジーソリューションズ株式会社 福島様\n「3G切り替えも新規申し込みの場合も交換方法は特に変わらないです。」","cause":"❸-3 \n要因：3G回線が終わるため4G対応に切り替えるため。\n分析：通信費10年前払いしている場合は月額通信費で継続するより新規申し込みで遠隔を新しくすることで機械自体の保証もつく。\n改善：10年の更新時には新規申し込みを提案してクロスセルにつなげていく","phase":"課長が3/19（木）までにメンテ備考を更新した状態にする。"}],"auth":"","sheet":"実行計画報告・生産管理（久安）（5分） "},{"dept":"蓄電池企画営業","date":"2026-07-03","time":"18:00～18:15","members":"大澤","mq":{"month":{"actual":8.0,"prev":42.0,"diffPrev":-34.0,"target":12.0,"diffTarget":-4.0},"total":{"actual":42.0,"prev":171.0,"diffPrev":-129.0,"target":84.0,"diffTarget":-42.0}},"g":{"month":{"actual":null,"prev":null,"diffPrev":null,"target":null,"diffTarget":null},"total":{"actual":null,"prev":null,"diffPrev":null,"target":null,"diffTarget":null}},"fm":{"month":{"actual":344.0,"target":59.0,"rank":"D"},"total":{"actual":344.0,"target":59.0,"rank":"D"}},"plan":{"month":{"score":12.0,"max":15.0,"rate":0.8},"total":{"score":12.0,"max":15.0,"rate":0.8}},"actions":[{"no":"①","name":"納品数・着工数","kpi":"","month":{"actual":3.0,"target":5.0,"rate":0.6},"total":{"actual":4.0,"target":5.0,"rate":0.8}},{"no":"②","name":"FMCS","kpi":"","month":{"actual":5.0,"target":5.0,"rate":1.0},"total":{"actual":3.0,"target":5.0,"rate":0.6}},{"no":"③","name":"勉強会","kpi":"","month":{"actual":5.0,"target":5.0,"rate":1.0},"total":{"actual":5.0,"target":5.0,"rate":1.0}}],"summary":[{"section":"A 数値報告","fact":"❶申請数差し撮り率 目標 30%以下 / 14.7%","cause":"❶-1 \n要因：東電の様式変更に伴い再申請が必要となったから。\n分析：電力会社自体の負担金発行事例が無いため、初回審査に時間か掛かっている。\n改善：様式変更時はマニュアルを更新し、対応漏れ・二度手間を防ぐ運用に統一する。","phase":"継続実施中"},{"section":"A 数値報告","fact":"❷申請マニュアル 目標 5 / 3","cause":"❷-2 \n要因：AIで作成したマニュアルと電力会社の申請手順が異なっていたから。\n分析：今回、低圧系統蓄電池の申請例がネットに無いため、誤情報からの生成がされたから。\n改善：作成した手順であっているか電力会社に確認を行ない対応する。","phase":"継続実施中"},{"section":"A 数値報告","fact":"❸商品ライバル 2 / 2","cause":"❸-3 \n要因：低圧系統蓄電池の売価設定が各社異なるから。\n分析：同じシステムでの価格の比較が出来る商品の為、利幅が想定されてしまう。\n改善：システムが同じ他社の価格を基準として価格設定を行う。","phase":"継続実施中"},{"section":"B 商品に関する方針より","fact":"❶低圧リフォート現調・提案の標準化","cause":"❶-1  \n要因：レイアウト・シミュレーションチェックが大澤個人に依存し、外出時に対応できない状態だったから。\n分析：マニュアル・勉強会により、社内のWチェックで対応できる状態にする。\n改善：シュミレーション確認時のチェックシートを作成し7月7日に勉強会を実施する。","phase":"継続実施中"},{"section":"B 商品に関する方針より","fact":"❷蓄電池商品の価格設定・売り方の適正化","cause":"❷-2 \n要因：競合（ピンク社長）の「2,500万円〜」というYouTubeの価格情報をお客様が基準として見ていたから。\n分析：「売価設定を知られている」は事実でなく主観であり、実際のお客様反応を確認せずに判断していた。\n改善：蓄電池容量比較からお客様へ説明を行う。価格差は蓄電池の価格による差となるため。","phase":"継続実施中"},{"section":"B 商品に関する方針より","fact":"❸電力会社様式変更・法令順守の徹底","cause":"❸-3 \n要因：東電の託送申込様式変更に伴う再申請ルールの認識共有が遅れたから。\n分析：新規の蓄電池単独申請と、既存リフォート案件の余剰地申請が混同されていた。\n改善：新規の系統蓄電池申請は、申請歩留まりが解消してから行う。","phase":"継続実施中"},{"section":"C お客様の声","fact":"❶ 白帆運輸株式会社 根﨑社長：「パネルの状態もそうですけど現地で聞いた事を回答いただけて安心しました。」（現地で購入意思を口頭表明）","cause":"❶-1 \n要因：現地同行時に、事前ヒアリングした確認ポイント（近隣トラブル・故障歴等）にその場で回答できたから。\n分析：決裁者本人が現地で状況を確認できたことが、その場での意思決定につながった。\n改善：決裁者が現地確認を行なう際は、担当営業と技術スタッフが現地にて対応しお客様の疑念を解消する。","phase":"継続実施中"},{"section":"C お客様の声","fact":"❷ 東急不動産 川嶋様：「3者間契約の場合は一度御社に名義を変えてからではないと黒ですよ。」","cause":"❷-2 \n要因：セカンダリー案件のスキーム（名義移転タイミング）についての事前確認が不足していたから。\n分析：契約スキームの適法性は、事前に法務・税務面の整理が必要。\n改善：3者間契約が絡む案件は、設備認定手続きの違反となる事の無いように直契約での契約に切り替えて紹介料で利益を取得する。","phase":"現場チェックシートで納品チェックをするFMCSを作る"},{"section":"C お客様の声","fact":"❸ 未来テクノス 堀内様：「電力会社の承認が得られていない状態で売電してて本当に良いの。電力に確認してください。」","cause":"❸-3 \n要因：使用前自己確認・承認状況の進捗共有がお客様に十分届いていなかったから。\n分析：承認前の売電は法令リスクに直結するため、お客様の不安が表面化した。\n改善：承認状況は「できる／できない」ではなく法令違反の有無を基準に判断し、進捗を都度お客様へ共有する。","phase":"報告"},{"section":"D 従業員の声","fact":"❶坂本さん\n「どうやってシュミ―ションが低いとか高いとか判断されていますか。」","cause":"❶-1 \n要因：容量とシュミレーション値から整合性の回答をしていたから。\n分析：容量・方位・遮蔽物からシュミレーション値を想定し乖離敷いている物は詳細確認。\n改善：シュミレーション時のチェック項目を作成し7月7日までに勉強会を実施する。","phase":"継続実施中"},{"section":"D 従業員の声","fact":"❷三浦さん\n「申請のマニュアルの確認をしてください。」","cause":"❷-2 \n要因：蓄電池申請のマニュアルの修正を行ないながら精度を上げている段階だから。\n分析：成功例が明確ではない為、AIで調べた回答と現場が異なる状態。\n改善：1申請実施後に電力担当者のチェックを受け認識を合わせて申請を実施する。","phase":"継続実施中"},{"section":"D 従業員の声","fact":"❸久安さん\n「サカイホールディングスの吉田主技からPCSの電源の入り切りも主技が行うって言われたのでですがどう対応したら良いでしょうか。」","cause":"❸-3  \n要因：主技自身の判断で現場での発言をされている状態だから。\n分析：主技が現場に関しての決定権が自身にあると錯覚してる状態。\n改善：工事前打ち合わせの内容と異なる事案が出た際には決裁者に、スケジュールや価格費用が異なる事を伝え認識の齟齬が無い状態で実施できるよう記録に腰対応する。","phase":"継続実施中"},{"section":"E ライバル・業界・取引先情報","fact":"❶ピンク社長（グリーンエナジープラス経由情報）：低圧系統蓄電池を2,500万円〜の売価設定で集客","cause":"❶-1 \n要因：選択できるシステムが限られており原価が業界内で共有されているから。\n分析：価格のみで比較されると差別化が効かず、値下げ競争に巻き込まれるリスクがある。\n改善：価格提示前にお客様の反応を先に取得し、実績・スピード等の付加価値で差別化する。","phase":"報告"},{"section":"E ライバル・業界・取引先情報","fact":"❷ シグエナジー：商社（ノビス・エクソル）からの発注が可能となり、納品まで4カ月待ち\n蓄電池容量を217kwに設定するのは1年後、2次・3次市場に入る事を計画しているから。","cause":"❷-2 \n要因：一次調整市場での実績があるシグエナジーへ発注が集中しているから。\n分析：実績のある商品ほど電力会社の審査が通りやすく、申請期間の短縮につながる。\n改善：実績のある機種を優先選定し、申請リードタイムの短縮を図る。","phase":"報告"},{"section":"E ライバル・業界・取引先情報","fact":"❸シグエナジー\n商社は、ノビス、エクソルからの発注が可能となり、現状の納品は4カ月待ちになります。","cause":"❸-3 \n要因：一次に入った実績がシグエナジーにはあるから。\n分析：一次の実績の有無で電力会社の申請期間が2ケ月以上伸びる状態。\n改善：実績のある商品を選定することで電力の審査を受けやすい状態にする。","phase":"報告"},{"section":"E ライバル・業界・取引先情報","fact":"【相談】ナシ 価格の件回答済の為","cause":"","phase":""}],"auth":"","sheet":"実行計画報告・蓄電池（5分）"},{"dept":"CS","date":"2026-07-01","time":"12：00～12：15","members":"山田・金子・あさひ・名古・明奈・田村・小林怜未","mq":{"month":{"actual":32.0,"prev":null,"diffPrev":null,"target":67.0,"diffTarget":-35.0},"total":{"actual":32.0,"prev":null,"diffPrev":null,"target":67.0,"diffTarget":-35.0}},"g":{"month":{"actual":null,"prev":null,"diffPrev":null,"target":null,"diffTarget":null},"total":{"actual":null,"prev":null,"diffPrev":null,"target":null,"diffTarget":null}},"fm":{"month":{"actual":null,"target":59.0,"rank":"D"}},"plan":{"month":{"score":15.0,"max":25.0,"rate":0.6},"total":{"score":15.0,"max":25.0,"rate":0.6}},"actions":[{"no":"①","name":"","kpi":"","month":{"actual":5.0,"target":10.0,"rate":0.5},"total":{"actual":5.0,"target":10.0,"rate":0.5}},{"no":"②","name":"アンケート回収と改善","kpi":"","month":{"actual":5.0,"target":10.0,"rate":0.5},"total":{"actual":5.0,"target":10.0,"rate":0.5}},{"no":"③","name":"","kpi":"","month":{"actual":5.0,"target":5.0,"rate":1.0},"total":{"actual":5.0,"target":5.0,"rate":1.0}}],"summary":[{"section":"A 数値報告","fact":"❶お客様進捗報告 目標21/実績65 +44","cause":"❶-1 \n要因：前日に翌日の予定確認と朝会での当日確認により漏れなく実施できている。\n分析：低圧太陽光・リフォート案件別に発注・着工・完工・連系日にGASを設定し、朝礼時に発表することで課全体で把握ができた。\n改善：実施予定日の3日前にもGASを設定し、予定の変更が無いか確認を行う。","phase":"3日前予定確認のGAS設定実装済み。"},{"section":"A 数値報告","fact":"❷未回収 目標0/実績０ ▲０","cause":"➋-1 \n要因：3日前、前日、当日のリマインド実施が漏れなくできた。\n分析：事前に電話・メール・ショートメールで入金期日をリマインドすることにより、お客様の失念防止になっている。\n改善：当月の予実管理を行い、回収を実施する。","phase":"毎日朝礼で経理担当者が当日・3日前の入金期日者をチェックし、13時までにリマインドを実施する。\n毎月1日に当月の入金予定表を作成する。（山田）"},{"section":"A 数値報告","fact":"❸ お客様・他部署からの指摘 目標0/実績２ ▲２","cause":"❸-2\n要因：報告方法について、お客様の要望変更を把握できていなかった。\n分析：オンラインで報告することにより、お客様の懸念や要望をタイムリーで把握できる。\n改善：問題のある無しに関わらず、着工後の週1回の定期報告はオンラインで行う。","phase":"各担当：オンライン報告実施日に、次回の予定を決めてカレンダー登録を実施する。チェック：部門長"},{"section":"A 数値報告","fact":"❹入金済売上報告 \n総額 141,176,476円","cause":"","phase":""},{"section":"B 太陽光発電事業\nお客様に関する方針\nお客様への正しい姿勢","fact":"❶２、関係性強化\n（５） 定期的にアンケートを実施し、結果を社内で開示しながら改善に取り組む。\n＞＞アンケート取得 目標25/実績13\n  回答からの改善 目標2/実績1","cause":"❶-1\n要因：報告時の依頼がメインで、回答依頼の母数が不足している。\n分析：メンテ報告、サンキーパー設置報告時の依頼だけでは回収率10％-30％想定で月25件の取得は難しい。\n改善：部署で80件のメールでの依頼と架電をセットで実施する。","phase":"CS：月80件メールでの依頼と架電をセットで実施する。"},{"section":"B 太陽光発電事業\nお客様に関する方針\nお客様への正しい姿勢","fact":"❷２、関係性強化\n（６） 懸念点やリスクを誠実に伝え、最善策を提示する。\n＞＞盈泰ジャパンからの報告書をそのままお客様へ送っていた。","cause":"❷-2\n要因：下請け・孫請けからの写真報告書をそのまま送付していた。\n分析：元請業者として報告が必要。\n改善：社名をアースコムの修正して送付する。","phase":"CSで対応する。"},{"section":"B 太陽光発電事業\nお客様に関する方針\nお客様への正しい姿勢","fact":"❸２．姿 勢\n（４） お客様のお問い合わせには、全てに優先し、誰が聞いても快く、対応する。嘘やいい加減なことは言わない。\n櫻井紀雄 様\n「メールが色々なところから来るから確認できなくて。メールのみだと気づけなくて、メンテナンス行ったときに電話とかしてくれたらわかりやすいですね。」","cause":"❸-3\n要因：メンテ報告はメンテのみで実施している。\n分析：年１～２回のメールは、気付かれず埋もれてしまう。\n改善：お客様の要望により、メール送付時は架電対応を行う。","phase":"CS:お客様からのご指摘事項は、朝会後の部署MTGで共有をする。"},{"section":"C お客様の声","fact":"❶太平地所株式会社 横治様\n「ケーブル盗難ですが社長はじめ担当者の中では危機感はありますが、あまりにも施設数が多いため、社内でも検討はしましたが、ご承知のとおり何も対応ができていないのが現状です。」","cause":"❶-1\n要因：ケーブル盗難に対し、危機感が共有されているものの、管理対象の施設数が非常に多く、個別対策の検討が進まない状況。\n分析：盗難リスクの高低を判断する材料が不足している。\n改善：盗難リスクの簡易スクリーニング（立地・過去事例・夜間状況・フェンス等）を実施し、優先度を可視化して提案する。","phase":"生産管理に共有して、優先順位を付けて3～5区画を順次提案する。"},{"section":"C お客様の声","fact":"❷株式会社セブンアーチザン 森田様\n「住民から反対を受けている方の案件がもし難しそうであれば別の案件に変更してもらうことは問題ないのでよろしくお願いします。」","cause":"❷-2\n要因：4286【双葉】福島長塚谷沢町Dのガイドライン対応で住民反対があり長引いているため。\n分析：3月の決算に間に合わせるために差し替えの期限を設けなければならない（８か月で考えると８月）。\n改善：行政側も尺度が無く対応に時間を要しているため今回の対応事例をもとに実施マニュアルの作成を提案する（開発へ）","phase":"金子雪；7月15日までに石澤様の成功例とセブンアーチザン様、M&TLABO様の対応例をドキュメントにまとめる。"},{"section":"C お客様の声","fact":"❸未来テクノス株式会社 堀内社長\n「下請けに丸投げをして何もしないから、安全面も品質面も、何もかもダメなんだと思います。」","cause":"❸-3\n要因：下請け業者の工事内容について、当社によるダブルチェックが実施されていなかった。\n分析：元請けとして工事内容や進捗を適切に確認・管理する体制が必要である。\n改善：着工・完工を含め、当社でも工事状況を確認する運用を徹底する。","phase":"CS：電力申請の実務（入力・メール送信・郵送）を請け負う。"},{"section":"D 従業員の声","fact":"❶田村さん\n「メンテ報告書の差し戻しが増えています。」","cause":"❶-2\n要因：新卒の毛行け不足 と、作成方法の変更がまだ十分に定着していない。\n分析：作成方法の変更後、旧ルールとの混在や、チェック観点の統一が不十分なため、入力漏れ・相違が発生しやすくなっている。\n改善：入力漏れ・相違を防ぐため、MRAGを活用し、作成プロセスを標準化する。","phase":"生産管理に依頼"},{"section":"D 従業員の声","fact":"❷金子（雪）さん\n「電力の対応をCSも入る際の役割のすり合わせが必要と考えます。」","cause":"❷-2\n要因：リフォート案件で電力の申請にCSも入るため。\n分析：役割分担空白の未実施が発生しないよう具体的な認識の統一が必要。\n改善：FMCSの整備、実施の見える化。","phase":"開発で作成しているFMCSの見直しから実施する。"},{"section":"D 従業員の声","fact":"❸小林怜未さん\n「検索しても出てこない商談がある」","cause":"❸-3\n要因：完全にhubspotに移行できていないため。\n分析：ほかの方がいれた添付ファイルも見れないため移行期間の情報がどうなるか気になる。\n改善：使い方の横展開をする。","phase":"CS内でも情報共有していく"},{"section":"E ライバル・業界・取引先情報","fact":"❶経産省の地番確認方法ツール\n・マップル\nhttps://labs.mapple.com/mapplexml.html#16/34.693122/135.194165","cause":"❶-3\n要因：リフォート案件において土地に関する問題が発生した際は、マップルおよび登記情報サービス内の地番検索サービス等を活用し、\n対象地の地番や状況の精査を行っている。\n分析：一部地番の登録が確認できないケースもあるものの、地番特定の補助として有効に機能している。\n改善：有用なサイトやツールがあれば積極的に情報収集を行い、社内での横展開を図る。","phase":"CS：設備認定申請時に活用"},{"section":"E ライバル・業界・取引先情報","fact":"❷長繁生様（他社から購入された発電所のメンテ写真報告書）","cause":"❷-2\n要因：他社のメンテナンス報告書の内容を知るため。\n分析：写真により報告がメインとなっており、電気点検等は不明。\n改善：写真撮影日が記載されていると良い。","phase":"生産管理に提案"},{"section":"E ライバル・業界・取引先情報","fact":"❸FIT認定設備において、認定地番と実際の設置地番が一致していないケースが最近契約後に判明するケースが増えている。","cause":"❸-3\n要因：契約前の認定地番確認不足。\n分析：地番相違は認定手続きの遅延やトラブルにつながる可能性が高いため、契約前の確認が重要。\n改善：契約前にFIT認定地番と施工地番を照合してから契約。\n変更がある場合は、速やかにお客様に遅延リスクのご説明をした上で手続きを進める。","phase":"CS：契約書作成時、地番詳細を確認する。"}],"auth":"","sheet":"実行計画報告・CS（5分）"},{"dept":"採用","date":"2026-07-08","time":"12:30～13:15","members":"大河原・東田","mq":{"month":{"actual":null,"prev":null,"diffPrev":null,"target":null,"diffTarget":null},"total":{"actual":null,"prev":null,"diffPrev":null,"target":null,"diffTarget":null}},"g":{"month":{"actual":null,"prev":null,"diffPrev":null,"target":null,"diffTarget":null},"total":{"actual":null,"prev":null,"diffPrev":null,"target":null,"diffTarget":null}},"fm":{"month":{"actual":77.0,"target":59.0,"rank":"A"},"total":{"actual":647.0,"target":59.0,"rank":"D"}},"plan":{"month":{"score":4.0,"max":5.0,"rate":0.8},"total":{"score":4.0,"max":5.0,"rate":0.8}},"actions":[{"no":"①","name":"エントリー数","kpi":"25名","month":{"actual":1.0,"target":5.0,"rate":0.2},"total":{"actual":1.0,"target":5.0,"rate":0.2}},{"no":"②","name":"インターン通過率","kpi":"88%","month":{"actual":3.0,"target":5.0,"rate":0.6},"total":{"actual":3.0,"target":5.0,"rate":0.6}},{"no":"③","name":"勉強会","kpi":"月2回","month":{"actual":5.0,"target":5.0,"rate":1.0},"total":{"actual":5.0,"target":5.0,"rate":1.0}}],"su "fact":"❷2・我が社の強み\n（２） ミルクドドレイクFC \n① オペレーションを強化し、高品質の味を維持する。","cause":"❷-1\n要因：平日は1～2名でシフト構成で対応できるようになっている\n分析：今の販売個数で3名は不要\n改善：16－19時対応が吉田さんに偏っているため入れるスタッフがいる際は依頼する","phase":""},{"section":"B FC事業に関する方針商品に関する\n方針より","fact":"❸2.重点・サービス\n（２） ミルクドドレイクFC \n① お客様の声・口を元に、共有会議にて協議・決定する。\n\n「さまざまな質問をしたところ、初めての来店だと分かったようで、割引になる方法なども分かりやすく説明していただき、とても利用しやすかったです」","cause":"❸-1\n要因：店舗内で質問に対する回答例を共有していることで案内ができている\n分析：新しい方もトークスクリプトを確認すれば同じ品質の案内ができ\n改善：16－19時対応が吉田さんに偏っているため入れるスタッフがいる際は依頼する","phase":""},{"section":"C お客様の声","fact":"❶\n「クリームの味わいは期待していたほどではなく、印象に残りづらかったです。クリームにもこだわりが感じられると、知人にも積極的に勧めたくなると思います。」","cause":"❶-1\n要因：クリームの特徴をスタッフ全員が同じ説明できるようする必要がある\n分析：品物ごとのPOPをお客様が見ることが多いので軽い口当たりである特徴を追記する\n改善：7月10日までにPOPの改善を実施する","phase":""},{"section":"C お客様の声","fact":"❷\n「家族とおやつの時間帯にドーナツを食べました。生ドーナツであることにとても興味があり、クリームの味よりも生地についての感想が多く出ました。」","cause":"❷-1 \n要因：生地はしっとりふんわりしていることを特に感じていただけたから\n分析：生地のおいしさの説明が店舗に無い状態\n改善：生地のトークスクリプト作成する（7月10日まで）","phase":""},{"section":"C お客様の声","fact":"❸「前のお客様の購入が終わり、お店を出られたので次に入店しました。その際、スタッフさんから「暑い中大変お待たせいたしました」と、丁寧な言葉をかけてくださいました。お客様への気遣いを感じ、とても嬉しい気持ちになりました。」","cause":"❸-1 \n要因：お客様が並んだ場合、待っていただく時間少しでもあった場合は声をかけているから\n分析：待っていただいたことに感謝を伝えられているから\n改善：今後も並んでいない時以外は声掛けを必須で行う","phase":""},{"section":"D 従業員の声","fact":"❶吉田さん\n「外の物置に保管していた袋に虫が入ってしまったので防虫剤等で対策します。」","cause":"❶-1 \n要因：昨年までは発生が無かったが今後は防虫剤の対策を実施が必要\n分析：油の酸化臭で虫が増えている可能性がある\n改善：まだ虫が発見していない物置もすべて防虫剤をセットする（7月8日まで）","phase":""},{"section":"D 従業員の声","fact":"❷渡邉さん\n「期間限定の商品の紹介POPを描いてみました」","cause":"❷-2 \n要因：初めての総菜系ドーナツの販売のため紹介POPを手書きで作成してくれた\n分析：お客様の正面になる壁面にも紹介のポスターを掲示するとより情報が目に入る\n改善：7月10日までにポスター作成し掲示","phase":""},{"section":"D 従業員の声","fact":"❸高橋さん\n「ストーカー被害にあったので店舗で防犯の対策をしていただくことは可能でしょうか」","cause":"❸-3 \n要因：ストーカー被害が発生し警察へ引き渡された状態\n分析：今まで対策をしていなかった状態\n改善：防犯対策設置済み","phase":""},{"section":"E ライバル・業界・取引先情報","fact":"❶JACK IN THE DONUTS \n📍 埼玉県さいたま市大宮区錦町630\nhttps://www.instagram.com/jackinthedonuts/","cause":"❸-3 \n要因：年始の福袋販売実施（最大950円お得）","phase":""},{"section":"E ライバル・業界・取引先情報","fact":"➋ 4、PARC de VAGUE C
