se":""},{"section":"A 数値報告","fact":"❹契約後オンラインお客様QA勉強会 開催2回","cause":"❹-1\n要因：課員が契約後オンラインや通常業務内でいただくお客様からの質問にすぐ縫回答ができず宿題で受けることが多いため\n分析：QA内容や契約内容でよくいただく質問は対応者全員ができる必要がある\n改善：契約時のQA、ＣＳのQA集を使用し勉強会とロープレを週1回実施していきます。","phase":""},{"section":"B 商品に関する方針より","fact":"❶１．基 本\n（１） 太陽光発電\n\n④ 保険での更新時やお困りごとに対応し、サンキーパーとメンテナンスを提供する。","cause":"❶-1\n要因：他社のメンテナンスに不満を持ったお客様からメンテナンスの切り替えの問い合わせを受けた際に、保険更新時のリスクを説明したことで、サンキーパーも検討に入ったから\n分析：スケジュールの問題で検討が歩留まりした際はZAM合金にて提案する\n改善：提案時お客様が何を重視されているかヒアリングするスクリプト作成し\n    フロー図を見ながら提案ができる状態にします。","phase":""},{"section":"B 商品に関する方針より","fact":"❷ ２．我が社の強み （１） 太陽光発電 ④ スタッフ教育を徹底し、レベルの高いサービスを提供する。\n  ・QA勉強会実施\n  ・GPUサーバー勉強会実施","cause":"❷-1\n要因：お客様のお困りごとを察知した時に提案ができるようパートさんまで一次対応ができる状態にするため\n分析：その場で一次提案実施し課長または営業課へトス上げができる状態にするため\n改善：新しい商品が始まった際は勉強会と対応方法・注意点の共有を実施","phase":""},{"section":"B 商品に関する方針より","fact":"❸カスタマーサクセスに関する方針\n ３.活動\n （４） 予想シミュレーションと実績シミュレーションの差異をお客様に共有し、アップセルクロスセル\n    に繋げる。\n  \n  みんな電力が現状売電単価10円（税抜）に下がっており12円のファラデー社への切り替え提案\n  を実施中 手数料PQ50000円 \n  結果：３件変更承諾取得","cause":"❸-1\n要因：実績シミュレーションを確認した際に現在の単価が判明したから\n分析：自社物件も５件みんな電力があるため切替の提案\n改善：メンテナンス報告書送付対象のお客様以外のみんな電力物件は\n    提案を実施する","phase":""},{"section":"C お客様の声","fact":"❶伸陽軽金属株式会社 栗原様\n「たしかにみんな電力物件は下がってますね。提案ありがとうございます。切り替えてください。」","cause":"❶-1 \n要因：みんな電力が現状売電単価10円（税抜）に下がっており12円のファラデー社への切り替え提案を実施したから\n分析：「下がっている」問題の問い合わせ前に提案することが重要\n改善：みんな電力のお客様197件提案実施します。","phase":""},{"section":"C お客様の声","fact":"❷真田 裕子 様\n「瀧澤さんから電話もらって良かったです、うっかり忘れていましたので。\n どんどん電話下さい。」","cause":"❷-1  \n要因：請求期日3日前リマインドの際に喜んでいただけた\n分析：伝え方を配慮し、期日は守っていただけるよう連絡は必須\n改善：朝会での３日前リマインド確認を継続し承諾の回答を得るまで連絡を実施します","phase":""},{"section":"C お客様の声","fact":"❸経済産業省 東北経済産業局\n発電所検査の際の指摘内容\n\n「設置されていた標識 (運転開始日の文字)が劣化し、判読できない箇所がありました。」\n「草木が繁茂し敷地外へと飛び出しているため、周辺環境への影響が懸念されます。」","cause":"❸-1 \n要因：管理が不足がある状態では売電が継続できないリスクがあるから\n分析：継続的な保守管理ができていない場合のリスクをお客様に説明する\n    必要がある\n改善：契約後オンラインで実際に指摘が入るリスクと保守契約の重要性と\n    アースコムの取り組みを説明します。","phase":""},{"section":"D 従業員の声","fact":"❶瀧澤さん\n「東京海上に盗難の項目を補足するためにあいおいを付けていましたが、あいおいを共済に変更する提案が可能です」","cause":"❶-1 \n要因：東京海上に盗難の項目が無いためあいおいと一緒にかけることで成立していたから\n分析：共済の母数を増やすためにも今後の更新は東京海上＋共済で進める必要がある\n改善：今後の保険提案の際は動産は東京海上＋共済を必須で進めます。","phase":""},{"section":"D 従業員の声","fact":"❷名古さん\n「清水F発電所 INF様様の営農登記に関して、先生と福島県法務局でやり取りしていますが、非常に難航しています。」","cause":"❷-2 \n要因：福島県法務局でも営農の土地の登記の事例があまりないため\n分析：事例が無いため想定以上に時間を要することをお客様に理解いただく必要がある\n改善：お客様との関係性によりますが、基本的には営農物件登記はできない説明をいたします。","phase":""},{"section":"D 従業員の声","fact":"❸金子あさひさん\n 「特措法勉強会は資料を作ることで自分の確認にもなり、皆さんが使える資料になってたらうれしいです」","cause":"❸-3 \n要因：勉強会で晝間さんから引き継いだ特措法を講師で行ったから\n分析：覚えてきたところで講師をしたことでアウトプットにもなった\n改善：作成した勉強会資料が営業がの新人の方の特措法理解のため共有します。","phase":""},{"section":"E ライバル・業界・取引先情報","fact":"❶浪江町の太陽光発電施設から銅線ケーブルを盗んだ疑い ラオス国籍の男を逮捕\n https://news.yahoo.co.jp/articles/80a1a7ab539dc58d8e0e1c0419fb3b70f1ab27ac","cause":"❸-3 \n要因：浪江町でも盗難が発生。北上している。\n分析：福島北部へのリスクが広がっていることをお客様にも遡及が必要\n改善：実例を出してお客様へサンキーパー提案する","phase":""},{"section":"E ライバル・業界・取引先情報","fact":"❷FIT計画認定「失効」三陸まり吉浜区市有地の太陽光発電事業者 事業者に対し経済産業省が通知\nhttps://tohkaishimpo.com/2025/09/03/489934/","cause":"❷-2 \n要因：FIT物件失効が実際に発令されている\n分析：アースコムのメンテ実施時に布武対象になる項目のチェックができているか確認が必要\n改善：9月15日までに生産管理と情報共有してチェックリストの見直しを実施します","phase":""},{"section":"E ライバル・業界・取引先情報","fact":"❸【次世代のトレンド】GPUサーバー投資で節税&高収益！将来性のあるGPUサーバー投資について徹底解説！\n株式会社戦略財務総研\nhttps://s-finance.co.jp/company/","cause":"❸-3 \n要因：GPUサーバーは提案方法の注意が必要\n分析：税理士の理解を取得する必要あり\n改善：提案時は税理士の確認を並行して実施する","phase":""},{"section":"E ライバル・業界・取引先情報","fact":"サンキーパー受注キャンペーン \n100％目標区画数達成後に受注した分を1区画1000円のカウントの承認をいただきたいです。\nキャンペーングラフは提案数も一緒に記載し突き抜けるよう作成します。","cause":"","phase":""}],"auth":"","sheet":"実行計画報告・CS部"},{"dept":"営業","date":"2026-03-02","time":"18：00-18：30","members":"大河原、石井、庭、相河、渡慶次、村田","mq":{"month":{"actual":3.0,"prev":5.0,"diffPrev":-2.0,"target":146.0,"diffTarget":-143.0},"total":{"actual":7.0,"prev":7.0,"diffPrev":0.0,"target":218.0,"diffTarget":-211.0}},"g":{"month":{"actual":null,"prev":null,"diffPrev":null,"target":null,"diffTarget":null},"total":{"actual":null,"prev":null,"diffPrev":null,"target":null,"diffTarget":null}},"fm":{"month":{"actual":234.0,"target":59.0,"rank":"D"},"total":{"actual":282.0,"target":59.0,"rank":"D"}},"plan":{"month":{"score":13.0,"max":20.0,"rate":0.65},"total":{"score":29.0,"max":60.0,"rate":0.4833333333}},"actions":[{"no":"①","name":"訪問商談数","kpi":"12/4 ▲8","month":{"actual":6.0,"target":10.0,"rate":0.6},"total":{"actual":11.0,"target":30.0,"rate":0.3666666667}},{"no":"②","name":"03>06 移行率","kpi":"20%/0% ▲20％","month":{"actual":2.0,"target":5.0,"rate":0.4},"total":{"actual":3.0,"target":15.0,"rate":0.2}},{"no":"③","name":"勉強会（基礎構築）","kpi":"2/2","month":{"actual":5.0,"target":5.0,"rate":1.0},"total":{"actual":10.0,"target":15.0,"rate":1.5}}],"summary":[{"section":"A数値報告","fact":"❶営業課予算進行\nPQ：569/1 ▲568\nMQ：215/1 ▲214\n\n\n低圧サンキーパー 3件\n保守 2件","cause":"❶-1\n要因：高単価商材であるリフォートの受注がゼロであったため。 \n分析：注力するべき商談に対して訪問商談を設定できていない。\n改善：PH04以上で現調済みの商談は、訪問商談・EXPO動員を実施する。","phase":"大河原が3/16までにPH04以上で現調済みの商談の訪問・EXPO来場設定を行う"},{"section":"A数値報告","fact":"❷商談PH内訳\nPH01\n 14件\nPH02\n 10件\nPH03\n 12件\nPH04\n 6件\nPH07\n 2件","cause":"❷-2\n要因：合意書取得済みPH06商談の契約締結が3月にスリップしてしまったため。\n分析：契約書の回覧スピードから逆算した契約日設定ができていない。\n改善：合意書意向をいただいた商談は、社内・リーガルチェックのスピードを確認の上、契約・入金日の設定をする","phase":"大河原が3/13までにサカイホールディングス様の入金が完了できた状態にする"},{"section":"A数値報告","fact":"❸\nPH03滞在日数：平均68日","cause":"❸-3\n要因：次回コンタクト時に繋がらず、そのまま滞在させてしまっているため\n分析：繋がらなかった時点で、繋がるための次の対策が打てていない\n改善：30日以上滞在している商談は未来の日付が入っているかどうかを確認し、進まない商談は再度ISに戻してホットリードにしてから再商談する\n＞30日以上の停滞商談はISに戻す","phase":"大河原が3/23までにPH03滞在中の9件へ架電し、繋がらない場合はISに戻す"},{"section":"B 営業に関する方針より","fact":"❶１．基 本\n（１） 「データに基づく科学的営業」「再現性のあるプロセス構築」「お客様との信頼関係を深める営業」を基本とする。","cause":"❶-1\n要因：1枚資料を商談時の「提案」「まとめ」資料として使い分けをすることで、視覚的に内容の認識をすることが出来る\n分析：MRAGにかけた検討基準、懸念点、希望内容をもとに、Gemにて次回提案の1枚資料を作成している\n改善：事前ヒアリングのドキュメントをもとにPH03商談時にも1枚資料を活用する","phase":"ISがPH03商談の1日前までに事前ヒアリングシートを埋めて、大河原へ報告し、1枚資料の作成を行う"},{"section":"B 営業に関する方針より","fact":"❷２．重 点\n（１） 太陽光発電事業における重点テーマを以下に定める。\n⑤ AIツールを活用し、商談音声を文字起こし・分析することで、提案力・傾聴力・クロージング力を定量的に評価・改善する。","cause":"❷-2\n要因：商談・提案ログをMRAGにかけることで、報告内容の標準化ができている\n分析：SF入力時間が15分/件削減できている\n改善：商談設定を45分とし、次の商談までの15分で活動記録、ボイス、メール送付まで完了する","phase":"営業にて実施済み"},{"section":"B 営業に関する方針より","fact":"❸３．価 格\n（１） アースコムは「価格競争ではなく価値提案」で勝つ。信用・信頼・技術力・サービス品質で差別化し、他社より高い価格でも選ばれる営業を目指す。","cause":"❸-3\n要因：屋根付けリパワリングと比較をして、回収年数5年以内をご希望されているお客様がいらっしゃる\n分析：工事内容が異なるため、別物だとご判断いただく必要がある\n改善：他社との差別化として、パネル性能、ストリング設計、120%補償を一枚資料でまとめ、シミュレーションの整合性を訴求する","phase":"大河原が3/16の商談までに他社比較の1枚資料を作成する"},{"section":"C お客様の声","fact":"❶マルダイフレッシュフーズ 大曽根社長\n「雪解けを待って、すぐに工事できると思っていたのに、そもそもまだ部材が届かないってことは先日来ていただいた時に伝えたことを何もくみ取ってくれていないですよね？」","cause":"❶-1\n要因：工程表作成時に例年よりも雪が降る時期が早いことを想定したスケジュール組ができていなかったため\n分析：雪が降り始めたタイミングでご訪問を実施し、工程表の遅れが生じることをお伝えすべきだった\n改善：天候や自然災害などで工程が送れる際には、発覚した時点でご訪問を実施し、事実と今後の対応策をもとにご説明を行う\n＞工程遅延発生時：即訪問、即オンラインを実施する","phase":"CSにてフロー変更済み"},{"section":"C お客様の声","fact":"❷山田養蜂場 仲 様\n「回収年数が5年とかなら安いなって思いますよね。6年とかだとシミュレーションの数値とか根拠とかで最終判断をします」","cause":"❷-2\n要因：屋根付け太陽光のリフォートの費用対効果を基準として検討されているため\n分析：工事内容が異なるため、別物だとご判断いただく必要がある\n改善：他社との差別化として、パネル性能、ストリング設計、120%補償を一枚資料でまとめ、シミュレーションの整合性を訴求する\n＞標準化する","phase":"大河原が3/16の商談までに他社比較の1枚資料を作成する"},{"section":"C お客様の声","fact":"❸田島電工 田島様\n「この発電所で両面パネル、PCS交換、反射シートを考慮すると127%UPは妥当ですね。入江社長がなんとおっしゃられるかはわからないですけど、シミュレーションは整合性あると思います」","cause":"❸-3\n要因：商談中の発電所の主技さんを含めて、シミュレーション提案を実施したため\n分析：すべて管理会社に任せているという会社さんで、主技さんの意見を発電所の運用検討の軸とされている\n改善：数字の整合性、妥当性を懸念されるお客様に関しては、銀行やO&M業者などプロの視点を第三者の声として取り入れる","phase":"営業にて実施済み"},{"section":"D 従業員の声","fact":"❶相河さん：「リフォートで一度失注になったお客様に対して、『蓄電池の設置完了前までにリフォート工事が完了していたら、そこから収益はさらに増加しますよね』っていう提案をしたら、再検討していただけることになりました」","cause":"❶-1\n要因：失注リストからの掘り起こし提案を実施し、「今」実施することのメリットをお伝え出来たため\n分析：失注理由が時期尚早のお客様は、検討時期を設定し、適切なタイミングで再提案が出来る仕組みにする\n改善：ToDoリストを作成し、いつ・だれが・どのお客様に再コンタクトを実施するのかを見える化する","phase":"ISにて3/13までに時期商談リストを作成し、定期コンタクトを行う"},{"section":"D 従業員の声","fact":"❷村田さん：「現調予定の発電所の近くに屋根付け太陽光があるお客様で、その発電所とあわせての屋根部分も見積もりしてほしいとのことでした」","cause":"❷-2\n要因：シミュレーション試算した近隣にも屋根、野立ての発電所を複数所有しており、まとめてRFの検討をされたいため\n分析：王さんへ確認したところ、単体ではNGだが、まとめてであれば検討できるとの回答をいただいている状態\n改善：屋根でもRF出来る可能性があるため、野立てとセットでご案内することを条件にエイタイさんへ相談する","phase":"ISにて無料診断提案時に屋根もあわせて検討希望の場合は、随時エイタイさんへ確認を行う"},{"section":"D 従業員の声","fact":"❸東田さん：「運転費用報告の提案は、1件ずつ申請状況を確認しなければならないので、架電自体が1時間に5件とかしかできないです」","cause":"❸-3\n要因：仕事の準備を業務時間内で行っており、集中TIMEに探す時間が発生してしまっているため\n分析：数字報告などで管理される環境がなく、本人の主体性にまかせられてしまっている\n改善：営業部の朝の時間の使い方と比較をし、8時30分からの30分間は仕事の準備の時間に充てることを指示する","phase":"大河原にてルール設定済み（運用中）"},{"section":"Eライバル・業界・取引先情報","fact":"❶東テク 榛葉さん\n「大手発電事業者様への提案の件ですが、先日、東急不動産様を訪問しました。東急不動産様は、1,200MW超の太陽光発電所を保有しており、これまでに10～20MW規模のリパワリングを実施済みとのことです」","cause":"❶-1\n要因：すでにエイタイさんでのRF実績があり、アースコムからのご提案はできないため\n分析：大手の場合、ご提案いただく前にエイタイさんへ取引状況の確認をする必要がある\n改善：無料診断取得の際、お客様が大手の場合は、資料取得前にエイタイさんへ必ず確認を実施する","phase":"営業にて実施中"},{"section":"Eライバル・業界・取引先情報","fact":"❷三心 見永さん\n「うちのところは九電が多いので、中には東北、関東エリアで発電所欲しいって方もいらっしゃいます。利回りももちろんですけど、価格とFIT残年数は気にされますね」","cause":"❷-2\n要因：セカンダリー物件のご紹介と合わせて、当社の発電所をエンドへ提案していただくように依頼したため\n分析：西日本のエリアに強い会社さんのため、関電・中電をご希望のお客様に向けての提案ができる\n改善：販売物件を一覧でお送りし、エンドのご紹介をいただく","phase":"大河原にて3/13までに資料作成し、送付する"},{"section":"Eライバル・業界・取引先情報","fact":"❸エイタイ 野賀さん\n「『本件工事の前後において、目的物の力率設定が同一であり、変更されないこと。』現在の契約内容は、この条件を精査している際の鞠の表現、鞠の指示の通りにしておりましたが、王さんの変更ご指示の内容が非常に分かりやすく、鞠の意図にも沿ったものになります。」","cause":"❸-3\n要因：契約書の雛形の「力率」の記載箇所をサカイホールディングス様からのご指摘を受けて変更いただいたため\n分析：力率90％以上の発電所も多く存在しているため、以前までの記載内容だと補償適用外のお客様がいらっしゃった\n改善：トリナは125%補償だが、HTは120%補償になるため、契約書の雛形を変更いただく","phase":"CSへ依頼の上、3/11に修正完了いたしました"},{"section":"Eライバル・業界・取引先情報","fact":"作成時の留意点","cause":"","phase":""},{"section":"Eライバル・業界・取引先情報","fact":"① 実績のマイナスは赤字で不足は▲を表記する。 例） 3 ▲5\n②    達成率（％）は黒字で記載する。\n③    数字の相違（記載・計算ミス）は努力文の提出をする。会議後３時間以内の提出。\n④    声は「」で記載する。\n⑤ 結果（総括）プラス要因は文字背景色青（明るい青3）・マイナス要因は文字背景色赤（明るい赤3）","cause":"","phase":""}],"auth":"","sheet":"実行計画報告・営業（大河原）（5分）  "},{"dept":"営業","date":"2026-03-02","time":"18：00-18：30","members":"大河原、石井、庭、相河、渡慶次、村田","mq":{"month":{"actual":43.0,"prev":5.0,"diffPrev":38.0,"target":73.0,"diffTarget":-30.0},"total":{"actual":50.0,"prev":12.0,"diffPrev":38.0,"target":219.0,"diffTarget":-169.0}},"g":{"month":{"actual":null,"prev":null,"diffPrev":null,"target":null,"diffTarget":null},"total":{"actual":null,"prev":null,"diffPrev":null,"target":null,"diffTarget":null}},"fm":{"month":{"actual":234.0,"target":59.0,"rank":"D"},"total":{"actual":282.0,"target":59.0,"rank":"D"}},"plan":{"month":{"score":13.0,"max":20.0,"rate":0.65},"total":{"score":29.0,"max":60.0,"rate":0.4833333333}},"actions":[{"no":"①","name":"訪問商談数","kpi":"12/4 ▲8","month":{"actual":6.0,"target":10.0,"rate":0.6},"total":{"actual":11.0,"target":30.0,"rate":0.3666666667}},{"no":"②","name":"03>06 移行率","kpi":"20%/0% ▲20％","month":{"actual":2.0,"target":5.0,"rate":0.4},"total":{"actual":3.0,"target":15.0,"rate":0.2}},{"no":"③","name":"勉強会（基礎構築）","kpi":"2/2","month":{"actual":5.0,"target":5.0,"rate":1.0},"total":{"actual":15.0,"target":15.0,"rate":1.0}}],"summary":[{"section":"A数値報告","fact":"❶営業進行\n月間\nPQ：192/258 66\nMQ：73/43 ▲30\n\n高圧リフォート 2件\n高圧遠隔監視 1件","cause":"❶-1\n要因： 見込みがスリップした場合の商談担保を設定できていない\n分析： 受注率5％のため必要な商談が120件であったと分析する。\n    また受注率は2月までの数字で訪問商談数が少ないことが原因であげられる。\n改善： 決裁者との訪問商談を27件実施して受注率を11％までに引き上げる。","phase":"フィールドセールスにて現状の\n進行中商談に訪問商談を実施する。\n目標27件\n期日3月31日まで"},{"section":"A数値報告","fact":"❷リフォート請負金額回収率\n14％","cause":"❷-2\n要因： 着工金までに70％の金額を回収しねければお金がまわらない\n分析： 12月まで契約していたリフォート案件が契約金額、30、40、30で契約していた\n改善： 契約の割合は50、40、10で修正済みであるが追加で\nエイタイの着工日より前倒しでアースコムが現地に立ち入り、ドローン撮影、鍵の受け渡し等を発電事業者様と行う。\n上記の日付を着工日と起算して請求する","phase":"石井が3月16日までにルールを提案し\n関係者に周知された状態を作る"},{"section":"A数値報告","fact":"❸\nリフォート保守契約\nアミューズメント企画様\n13/2▲11","cause":"❸-3\n要因： アースコムに保守契約を切り替えのメリットをリフォート商談時に提案できていない\n分析： お客様によってまずは先に工事を完成させてくださいとの声がある。\n改善： 契約前の提案と契約後対面訪問にてメンテナンス契約提案を実施する。","phase":"契約後の定期訪問にて各営業担当が\n保守契約を再提案する。"},{"section":"B商品に関する方針より","fact":"❶３ . 独自能力\n（１） 節税商品\nフロー・マニュアル・チェックリスト・スケジュール（FMCS）を標準化し、属人化な業務を仕組みに変える。","cause":"❶-1\n要因: FMCSを標準化することで、認識や業務を体系的に理解し仕組化するため\n分析: FMCSのPDCAが必要\n改善: 高圧サンキーパーのFMCSを作成したので運用する。\n高圧サンキーパー FMCS","phase":"運用済み"},{"section":"B商品に関する方針より","fact":"❷１．基 本\n（１） お客様は以下の３つです。\n① 売りたいお客様（発電所オーナー）：資産価値を最大化し、スムーズに売却したい方。\n② 買いたいお客様（投資家）：節税・即時償却を活用し、安定収益を確保したい方。\n③ 改善したいお客様（発電所オーナー）：発電効率改善や維持コスト削減を通じて、発電所の価値を高めたい方。","cause":"❷-2\n要因: カテゴリーにすることでターゲットを明確にするため\n分析: リフォートのターゲット像が明確に理解できていない可能性がある。\n改善:ペルソナを設定し、営業フロアに掲示して、ターゲット先を明確にする","phase":"掲示済み"},{"section":"B商品に関する方針より","fact":"❸❷１．基 本\n（１） お客様は以下の３つです。\n① 売りたいお客様（発電所オーナー）：資産価値を最大化し、スムーズに売却したい方。\n② 買いたいお客様（投資家）：節税・即時償却を活用し、安定収益を確保したい方。\n③ 改善したいお客様（発電所オーナー）：発電効率改善や維持コスト削減を通じて、発電所の価値を高めたい方。","cause":"❸-3\n要因：どのお客様にも節税のニーズがある可能性がある。\n分析 リフォートにも即時償却太陽光のような表記をする。\n改善：リフォートシミュレーションを税効果後の回収年数、利回りで表記する。","phase":"石井が2月3日に、税効果後のシミュレーションの運用\nを朝会にて周知済み。"},{"section":"C お客様の声","fact":"❶\n未来テクノス堀内社長\n 「副頭取が来る会社はすごいですね。銀行がつぶさないって決めてますよ」\n「保守契約については着工が始まってからの検討をさせてください。営農型のところ視察をしてその際にしましょう」","cause":"❶-1\n要因： 営農型太陽光に興味があるが、保守契約の契約スタートは施工後を求められているため\n分析： 契約前の提案と契約後の訪問にて保守契約の提案をセットにする\n改善： 契約後の定期訪問にて保守契約のプランの提示を行う。","phase":"着工が3月23日以降予定なので営農型の視察のアポイントを取得し、保守契約の提案を行う。"},{"section":"C お客様の声","fact":"❷\n福島発電株式会社様\n「単なる発電所の売買仲介ではなく、県のエネルギー目標達成という大局的な課題を共に\n解決してくれる「信頼できるパートナー」」だと感じました」","cause":"❷-2\n要因： 当社のリフォートの資産価値提供がお客様のニーズとマッチしたため \n分析： 売却ではなく長期的に保有する事業者とマッチする可能性がたかい。\n改善： 初期ヒアリングの段階で卒FIT後の構想をヒアリングし訴求する。","phase":"石井が3月16日のMTGにてお客様の声\n掲載の許可を取得する。"},{"section":"C お客様の声","fact":"❸\nPPTエナジー甲斐さん\n「セカンダリーのエビデンス資料が都度都度なのでまとめていただきたいです」","cause":"❸-3\n要因： 物件によって事前のデューデリジェンス資料の有無が異なっているため\n分析： 売主によって買い付け証明が必要な場合がある\n改善： 詳細なエビデンス資料が必要な場合は意向証明書を取得する。","phase":"詳細なエビデンス資料が必要場合は\n意向証明書そ取得する。"},{"section":"D 従業員の声","fact":"❶庭さん： 「現状ルールに、以下文言を付け足す形で修正を提案します。\n\n・最終活動日が2カ月以前に記録されている商談に関しては架電OKとする。\n」","cause":"❶-1\n要因： ルール改善フォームにて改善の声を求めたため\n分析： 営業部門長の権限にて修正を実施したことで停滞している案件へのアプローチが可能になった\n改善： 月1回メンバーからルール提案を収集し改善する。","phase":"営業部にてルール改善、相談フォームにて\n収集し、改善を実施\n次回4月5日"},{"section":"D 従業員の声","fact":"❷村田さん： 「営業部ルールのヒアリングアポという共通認識の言語がないためルールの削除または\n文言の更新がよいと思います。」","cause":"❷-2\n要因： アポイント、再コンタクトという現在定義づけている言葉以外でルールを作成していたため\n分析： 不要な言葉のため削除をする必要がある\n改善： 定義づけられている言葉でルールを設定する。","phase":"営業部にてルール改善、相談フォームにて\n収集し、改善を実施\n次回4月5日"},{"section":"D 従業員の声","fact":"❸渡慶次さん：「1週間はどこからスタートして良いか 例2月2日にPRをして、9日か10日に架電して良いかが曖昧である。」","cause":"❸-3\n要因： ISのリード保有期間の定義づけが曖昧であったため\n分析：1週間と記載があるが、コンタクト日を含めるのか含めないかで日数が変わり、曖昧であった\n改善：ルールにて例文を追加し解釈が人によって相違しないように改善いたしました。","phase":"営業部にてルール改善、相談フォームにて\n収集し、改善を実施\n次回4月5日"},{"section":"Eライバル・業界・取引先情報","fact":"❶えいたい 王さん\n「基本的に全部残置はできないです。工事場所がなくなってしまうので」","cause":"❶-1\n要因： 今まで営業にてパネルを残置できるとお客様に案内していたため\n分析： すべてのパネルの残置などはエイタイにて不可なためお客様との相違が発生する恐れがある\n改善： 原則残置は不可とお伝えし、残置希望の場合はえいたいに確認する。","phase":"石井が２月12日までに、変更認定\n申請先行プランのフローを作成する。"},{"section":"Eライバル・業界・取引先情報","fact":"❷エネサーブ株式会社\n金額：140000円/kw\n施工方法：\n・両面パネル\n・分散型パワコン\n・配線は埋設\n\n契約携帯：エネサーブが元請けのみ\n（アースコムは元請け不可）＞紹介料であれば対応可能\n一回の工事金額ではなく、10年プランとしてメンテナンス込みで10年の契約プランで提示している。","cause":"❷-2\n要因：えいたいが工事不可のお客様に提案するため\n分析： w単価が高いが、10年プランを提示して資金面のお客様課題を解決している。\n改善： 当社と協業可能なＥＰＣを選定しえいたいが工事不可のお客様に提案する。","phase":"expoにて当社と協業可能なＥＰＣ業者を見つける"},{"section":"Eライバル・業界・取引先情報","fact":"❸エイタイ王さん： 「低圧のパワコン1台分ならサービスしますよ」","cause":"❸-3\n要因：福島発電様の変更認定申請の件で王さんからパワコン1台増やした方がよいと提案があった\n分析： 部材はサービスだが工事の価格が変更できるか確認が必要\n改善： アデルフォに工事価格の変更有無を確認し王さんに報告する","phase":"アデルフォに工事価格の変更有無を確認し王さんに報告する"},{"section":"Eライバル・業界・取引先情報","fact":"作成時の留意点","cause":"","phase":""},{"section":"Eライバル・業界・取引先情報","fact":"① 実績のマイナスは赤字で不足は▲を表記する。 例） 3 ▲5\n②    達成率（％）は黒字で記載する。\n③    数字の相違（記載・計算ミス）は努力文の提出をする。会議後３時間以内の提出。\n④    声は「」で記載する。\n⑤ 結果（総括）プラス要因は文字背景色青（明るい青3）・マイナス要因は文字背景色赤（明るい赤3）","cause":"","phase":""}],"auth":"","sheet":"実行計画報告・営業（石井）（5分） "},{"dept":"営業（IS)","date":"2026-06-05","time":"17：30-18：00","members":"森作・奥田・江藤・庭・相河・渡慶次・村田","mq":{"month":{"actual":18.0,"prev":18.0,"diffPrev":0.0,"target":40.0,"diffTarget":-22.0},"total":{"actual":84.0,"prev":116.0,"diffPrev":-32.0,"target":120.0,"diffTarget":-36.0}},"g":{"month":{"actual":null,"prev":null,"diffPrev":null,"target":null,"diffTarget":null},"total":{"actual":null,"prev":null,"diffPrev":null,"target":null,"diffTarget":null}},"fm":{"month":{"actual":77.0,"target":59.0,"rank":"A"},"total":{"actual":647.0,"target":59.0,"rank":"D"}},"plan":{"month":{"score":13.0,"max":15.0,"rate":0.8666666667},"total":{"score":50.0,"max":60.0,"rate":0.8333333333}},"actions":[{"no":"①","name":"アポ獲得","kpi":"","month":{"actual":3.0,"target":5.0,"rate":0.6},"total":{"actual":11.0,"target":15.0,"rate":0.7333333333}},{"no":"②","name":"商談化","kpi":"商談化25/33 +8","month":{"actual":5.0,"target":5.0,"rate":1.0},"total":{"actual":11.0,"target":15.0,"rate":0.7333333333}},{"no":"③","name":"勉強会","kpi":"2/2","month":{"actual":5.0,"target":5.0,"rate":1.0},"total":{"actual":15.0,"target":15.0,"rate":1.0}}],"summary":[{"section":"A数値報告","fact":"❶アポ獲得\nインサイド全体 140/124 ▲16\n\n前月対比 ＋12","cause":"❶-1\n要因：PR数全体目標1220に対して1304 ＋84を実施出来たから。\n\n分析：インサイドメンバーでの日目標15に対して平均1日18件のPRができたことで84件の増加に繋がったから。\n\n改善：日目標最低PR15件の実施を継続で、成果の出ているトーク、診断数の多いエリア、kWなどでのエリア改善を実施する。","phase":"2Qの無料診断分析\n担当：森作\n期限：6/15"},{"section":"A数値報告","fact":"❷無料診断数\n25/33 ＋8\n\n前月対比 ▲7 \n\n商談化率 54% \n\n前月対比 ＋6%","cause":"❷-2\n要因：PR数+84件でのアポ数増加、又前月より+6%商談化率での向上が出来た。\n分析：過去失注での再提案、又有限会社などの決裁者に向けての提案ができたから。\n\n改善：質の向上としてうまくいっているミドルソーラー、有限会社へのPR、また低圧リフォートでの決済者商談の創出を行う。","phase":"2Qの無料診断分析\n担当：森作\n期限：6/15"},{"section":"A数値報告","fact":"❸商談化PHアップ数\n33件 18件 商談化率54% 失注8件\n\n商談化率 54% \n\n前月対比 ＋6%","cause":"❸-3\n要因：33件中18件での通過率54%だが8件は失注となってしまった。\n分析：アポイントが目的となり、事前のヒアリングでのお客様の購入基準をヒアリングできていないまま、FSにつないでいるから。\n改善：インサイド時点での簡易シミュレーションを使用した事前の診断、診断取得時点でのヒアリングで検討できるかのヒアリングを行い診断を獲得する。","phase":"2Qの無料診断分析\n担当：森作\n期限：6/15"},{"section":"営業に関する方針より","fact":"❶（４） 新規お客様との関係構築を通じて、紹介を自然に生む信頼関係を築く。紹介インセンティブ制度、接触回数の管理、営業ツールの強化により、「紹介が生まれる営業文化」を定着させる。","cause":"❶-1\n要因： リフォートでの失注、受注時の紹介提案、追加提案ができていない。\n\n分析： 受注後の追加提案、またなぜ失注したのかの分析が不足しているから。\n\n改善：過去失注への再PRで再度商談設定できない場合もどこが懸念かのヒアリングをインサイド全員で実施し、リスト，ターゲット改善を実施する。","phase":"受注、失注お客様への再PR\n担当：全員\n期限：6/22日まで"},{"section":"営業に関する方針より","fact":"❷⑤ AIツールを活用し、商談音声を文字起こし・分析することで、提案力・傾聴力・クロージング力を定量的に評価・改善する。","cause":"❷-2\n要因： 商談の録音・文字起こしによるにトークマニュアルの改善が不足している。\n\n分析： お客様の「疑念（シミュレーションへの不信など）」に対し、どの言葉で、どのタイミングで解消しているかという成功パターンの抽出できていない\n\n改善： 低圧リフォートでのQA集切り替えしトーク集を作成し、改善する。","phase":"商談AI文字起こしから「シミュレーションへの疑念」を解消したベストシーンを3つ抽出し、全メンバーへチャットで共有。\n担当：全員\n期限：毎週金曜"},{"section":"営業に関する方針より","fact":"❸（２） 失注を最大のお客様の声と捉え、原因分析と共有で営業力を高める。","cause":"❸-3\n要因： 失注後の分析ヒアリングが不足しているから。\n\n分析： 失注案件からのヒアリング不足により、どこがお客様での検討に至らないのかのヒアリングが不足しているから\n\n改善： 失注顧客への再PRでの要因分析、毎日失注があった場合を全体で小ミーティングで毎日全員でに共有し、同じ失敗を起こさない仕組みにする。","phase":"小ミーティングでの失注共有\n担当：全員\n期限：毎日"},{"section":"C お客様の声","fact":"❶庄和商事 遠藤様\n「20年後どうするかは決まってないよ、まあそういうのも考えないといけないよね。ないといけないんだね。そうだね5月いっぱい忙しくて6月なら時間取れるからそれでもう一回連絡くれる？お宅越谷の会社なのね。」","cause":"❶-1\n要因：会社周辺の事業者へのアプロ―トでの当日訪問提案で3件の診断獲得が出来た。\n分析：会社周辺の事業者様へPRしたことにより、訪問で翌日診断の獲得ができた。\n\n改善： ミドルソーラー、低圧所有の事業者様をターゲットとし、有限会社を提案し、検討しやすい価格帯+決裁者への提案を念頭に経産省へのPRを実施する。","phase":"ミドルソーラー、低圧リフォートの提案\n担当：全員\n期限：随時"},{"section":"C お客様の声","fact":"❷石原電機株式会社様 専務取締役 石原徹 様\n「両面パネルの扱いは正直あまり知らなかった話。そういうこともあるんだなと、社長や会長とも共通認識を持ちたい。」","cause":"❷-2\n要因：窓口でブロックからの突破で専務と話せたことで商談設定が出来た。\n分析：インサイドでローテションで番号を変えて、ローラー作戦でのコールPRを行い提案ができた。\n改善：歩留まりの際は別担当でのコールを行い、再度リフォートの資産価値の提案を行います。","phase":"不通の際の担当変更\n担当：全員  \n期限：随時"},{"section":"C お客様の声","fact":"❸エンバイオネクテス 河合様 \n「私のお客様としては、FIT期間残り七年間で1.4億円の収益が確保できるのに、あえて設備と投資しなくてもよいのではないかと言っていますね。」","cause":"❸-3\n要因： 残7年間に対してリフォート収益増加の優位性をPR出来ていない 残8年 7.1年 約7,400万\n\n分析： 1.4億の収益からさらに増加する部分での投資対効果でのPR 回収年数が残8年での7.1年で1年残っていないから。\n\n改善：回収年数に対して1年残らない場合、役員、上司に相談し、PHアップ商談設定、残FIT7年以下は提案しない。","phase":"経産省 残FIT7年以下は優先で提案しない\n担当：全員\n期限：毎日"},{"section":"D 従業員の声","fact":"❶庭さん\n「再コンタクトで結構もう一回話聞いてみるって人いますよ」","cause":"❶-1\n要因：期間をおいて再提案したことでの再商談化ができた。\n分析：期間が経ったことでのお客様の予算などのタイミング、またパネルのみでの価格が下がったことでの再商談化ができた。\n\n改善：過去の商談化、またフェーズ歩留まりのお客様へ定期コンタクト、また低圧リフォートからの診断を訴求する。","phase":"過去失注再提案\n担当：全員        \n期限：毎日"},{"section":"D 従業員の声","fact":"❷渡慶次さん\n「パネルのみの提案で再商談化できました」","cause":"❷-2\n要因：過去失注からパネルのみの再提案で再商談化ができた。\n\n分析：パネルのみにしたことにより価格が下がったことでの再商談化ができたから。\n\n改善：過去失注へのパネルのみの提案での再度リフォートの提案を実施、商談化を実施する。","phase":"過去失注再提案\n担当：全員        \n期限：毎日"},{"section":"D 従業員の声","fact":"❸江藤さん \n「利益が出ている段階で追加投資をする理由がわからない人に対してはどうしてますか？」","cause":"❷-2\n要因：回収年数が1年切る事業者へPR商談PHUPができないから。\n\n分析：卒FIT後の優位性をお客様へPR出来ていないから。\n\n改善：残FIT1年切る事業者は整理、またインサイド時点での簡易シミュレーションでの発電量ヒアリングで診断獲得するかを精査する。","phase":"経産省 残FIT7年以下は優先で提案しない\n担当：全員\n期限：毎日"},{"section":"Eライバル・業界・取引先情報","fact":"❶サニックスエンジニアリング\nリパワリングのワードを知らない 自社でPCSの交換はしているとのことで他社への対応はない","cause":"❶-1\n要因：自社発電所の施工の実績での相見積もりで商談歩留まりが発生している。\n分析：お客様見積もり依頼から2週間経っても出てこないためリパワリングに対応していない。\n\n改善：軽井沢、奈良の実績をもとに、パネルまで交換することの収益増加をシミュレーションをもとに提案する。","phase":"訪問提案\n担当：石野さん\n期限：6/8\nシミュレーションを活用しての収益増加額、数字での提案"},{"section":"Eライバル・業界・取引先情報","fact":"❷ 東洋計器株式会社\n146％発電所UPで鹿児島にリパワリング実績あり。保証なし","cause":"❸-3\n要因：リパワリングでの146%アップ実績がある。\n\n分析：発電量の保証、強度計算書などは行っていない。\n\n改善：自社の実績をもとに保証とセットで提案する。","phase":"自社実績でのPR  \n担当：全員\n期限：随時"},{"section":"Eライバル・業界・取引先情報","fact":"作成時の留意点","cause":"","phase":""},{"section":"Eライバル・業界・取引先情報","fact":"① 実績のマイナスは赤字で不足は▲を表記する。 例） 3 ▲5\n②    達成率（％）は黒字で記載する。\n③    数字の相違（記載・計算ミス）は努力文の提出をする。会議後３時間以内の提出。\n④    声は「」で記載する。\n⑤ 結果（総括）プラス要因は文字背景色青（明るい青3）・マイナス要因は文字背景色赤（明るい赤3）","cause":"","phase":""}],"auth":"","sheet":"実行計画報告・営業　IS（5分） 　"},{"dept":"営業・CS","date":"2026-04-07","time":"17：30-18：00","members":"","mq":{"month":{"actual":3.3,"prev":38.0,"diffPrev":-34.7,"target":79.6,"diffTarget":-76.3},"total":{"actual":12.0,"prev":128.0,"diffPrev":-116.0,"target":800.0,"diffTarget":-788.0}},"g":{"month":{"actual":null,"prev":null,"diffPrev":null,"target":null,"diffTarget":null},"total":{"actual":null,"prev":null,"diffPrev":null,"target":null,"diffTarget":null}},"fm":{"month":{"actual":234.0,"target":59.0,"rank":"D"},"total":{"actual":234.0,"target":59.0,"rank":"D"}},"plan":{"month":{"score":13.0,"max":15.0,"rate":0.8666666667},"total":{"score":37.0,"max":45.0,"rate":0.8222222222}},"actions":[{"no":"①","name":"アポイント取得・PHアップ数","kpi":"120/72   20/22","month":{"actual":3.0,"target":5.0,"rate":0.6},"total":{"actual":9.0,"target":15.0,"rate":0.6}},{"no":"②","name":"スケジュール遅延データ活用","kpi":"5/5  15%/0%","month":{"actual":5.0,"target":5.0,"rate":1.0},"total":{"actual":13.0,"target":15.0,"rate":0.8666666667}},{"no":"③","name":"勉強会（基礎構築）","kpi":"2/2","month":{"actual":5.0,"target":5.0,"rate":1.0},"total":{"actual":15.0,"target":15.0,"rate":1.0}}],"summary":[{"section":"A数値報告","fact":"❶1月\n PQ：791/6.1（達成率：1％）\n MQ：79/3.3（達成率：4％）\n 成約件数：17件（目標：RF 8件）","cause":"❶-1\n要因：PH03・17件が停滞し、キーマン以上の提案までが実施出来ていない。\n分析： 移行率25％、社内稟議の前倒しにて訴求の不足が出ている\n改善： PH01～03までの43件の停滞件の再商談を実施し、キーマン以上の同席を再設定し訪問・現地商談を実施します。","phase":"PH01～03までの43件の商談設定しアポ取得の段階で意思決定者か否かの提案をする\n担当：営業 \n期日：3/27"},{"section":"A数値報告","fact":"❷PHアップ数\n20/22+2","cause":"❷-2\n要因：保有商談54件に対して次回スケジュール切り、社内稟議用の資料作成をデフォルトにしました。\n分析：社内での検討前に部内での会議等が入り、役員会に上げられる資料をサポートした。\n改善：社内の役員会の日程や提案の流れを確認し、次回の商談日・社内資料のFBを行う事で担当者との認識の相違が無く、フォローをして頂ける様に実施する。","phase":"保有商談54件に対し商談設定しアポ取得の段階で意思決定者への提案をする\n担当：営業 \n期日：3/27"},{"section":"A数値報告","fact":"❸2月【CS】クロスセル金額\nPQ6,550,000  全体目標389,000,000/ 達成率1.6％\n\n＜内訳＞\nZAMサンキーパー\n３G回線交換対応\nファラデー社切替\nモバイル事業","cause":"❸-3\n要因：盗難がいわき周辺で増えていることから再提案実施。\n    提案時のスーパーダイマ金額から9万円下がったことから決定いただけた\n分析：盗難があったエリアを中心にサンキーパーの提案を実施したが提案数が不足をしていた\n改善：CSは２Qはサポートで対応に注力し追加、Google口コミでプラスをいただけるよう対応漏れ\n    の無い応対で実施する","phase":"保険更新・メンテ後の洗浄提案・盗難時のサンキーパー提案の情報のトス上げを行う\n担当：CS\n期限：3/27"},{"section":"営業に関する方針より","fact":"❶（３） 商社・仕入先から定期的に合見積りを取得し、 原価を下げて粗利益率を最大化する。同時にコストだけでなく「品質・保証・供給安定性」を総合的に評価する。","cause":"❶-1\n要因：セカンダリー案件にて180万円の値引き交渉があった\n分析：お客様の収支FIT期間内NET13％の収支に合わせる為\n改善：仕入れ先への値引き交渉・メンテ付帯での提案にて対応できるかを交渉します。","phase":"セカンダリーの提案後の声より、基準となる収支シミュレーションを修正します。\n担当：石野\n期限：3/20"},{"section":"営業に関する方針より","fact":"❷（２） 失注を最大のお客様の声と捉え、原因分析と共有で営業力を高める。","cause":"❷-2\n要因：失注商談より次回提案時期・改善を行う\n分析：時期尚早の案件に関しては、次回の提案予定日が決まっていない\n改善：失注分析RAGを活用し、失注前に壁打ちをして最終の提案を行います。","phase":"失注前相談を実施し、失注前の相談を実施します。\n期限：失注前"},{"section":"営業に関する方針より","fact":"❸（３） セカンダリー案件については、保守管理期間を原則15年とし、長期安定運用をサポートする。","cause":"❸-3\n要因：セカンダリー物件は保守管理をマストで加入であるから\n分析：販売・管理にて保守の契約を加入で販売をしている\n改善：リフォートセット時は15年・セカンダリーのみは残FIT年数での保守契約での締結は可能かを確認します。","phase":"提案時に保守管理の契約もお伝えし商談シートに追記して行きます。\n担当：FS"},{"section":"C お客様の声","fact":"❶小豆島サン樹株式会社 代表取締役 田村 樹雄様\n「わざわさ来てもらって、御社とは良い付き合いがずっと出来ると思うてます」","cause":"❶-1\n要因：田村石材様購入物件で部材高騰によりお客様持ち出しの提案をした。\n分析：契約時（11/27）の内容と相違し、エイタイとの契約が未締結だった為在庫の確保が出来ていなかった。\n改善：合意書へ事前に起因となった経産省の確認項目を追加しました。","phase":"合意書にて確認事項のチェックリストを追加しました。\n合意書 【原本】"},{"section":"C お客様の声","fact":"❷西田通商株式会社様 代表取締役 西田吉彦様\n「抵当権が入っているので、契約締結は良いが当社の株主が抹消を確認しないと支払いはしない方が良いと言ってきているんですが」","cause":"❷-2\n要因：現事業者との面談前に抵当権が入っているのを確認した\n分析：謄本を取得していなかった為、抵当権が入っているのに気が付かなかった\n改善：物件調達時のチェックリストの確認項目を追加しました。","phase":"チェックリストに追加しました。\n【原本】セカンダリーFMCS"},{"section":"C お客様の声","fact":"❸マルダイフレッシュフーズ株式会社 大曽根利幸様\n「なんで3月末の売電再開の契約だったのが6月までのびてしまうんでしょうか。高圧は1日40万円くらいになるんです。もっと自分事として考えてもらいたいです。」","cause":"❸-3\n要因：再検討となるまで1カ月経過したが、雪が早く降り始めたことなど踏まえ、そこからの\n    工事スケジュールで契約時にスケジュールの最終確認をしなかったから\n分析：リフォートは提案時から契約まで数か月かかる場合があるため\n改善：現状契約時に最新の工程表取得する項目をフローにいれ改善済みです","phase":"リリース時のチェックに近隣対応や電力への進捗確認を2週間に1度行いスケジュール会議で対象者へ共有する\n担当：開発・CS\n期限：隔週"},{"section":"D 従業員の声","fact":"❶瀧澤さん\n「いわきのお客様への提案はサンキーパーはCSからも送ってるのでそこは確認してください」","cause":"❶-1\n要因：同じ内容のメールを2重で送ってしまっている\n分析：商談、取引先を紐づけてメール送付できていないから\n改善：商談シート、取引先の過去履歴を確認したうえで、提案メール、コールを行う。","phase":"活動記録を確認し提案が被らないようにします。"},{"section":"D 従業員の声","fact":"❷瀧澤さん\n「パネル洗浄25万でメールで訴求してますが、そこから最終的に高いといわれるので標準価格で最終着地してます」","cause":"❷-2\n要因：お客様への洗浄メール文で高めの設定で提案している。\n分析：比較対象がないため25万円が唐突な高額アンカーとなり、心理的な拒絶を招いているため\n改善：「汚損による売電ロス額」を可視化し、洗浄を「投資」として一枚画像でメール提案を行う。","phase":"パネルの汚れ具合により、依頼する会社を変えて提案して行きます。\n連絡先一覧（早見表）を作成済み\n担当：CS"},{"section":"D 従業員の声","fact":"❷金子あさひさん\n「特措法は下りてしまうと取消ができないので遅れが発生した際は、認定前に取り下げがしています。再開のスケジュールがわかりにくいです。」","cause":"❷-2\n要因：物件シートの連系予定が遅れが発生してもその後更新されるルールが決められておらずそのままになっているから\n分析：遅延発生後に開発へ更新完了までの依頼をする必要がある\n改善：開発課にて遅延発生時の物件シート更新のルールを3月15日までに作成いただきCSは更新がされるまでスケジュール会議で確認をしていきます","phase":"雛形作成済み\n追加の際には、追加した項目を全体へ周知をし完了とする\n担当：CS\n期日：毎日"},{"section":"Eライバル・業界・取引先情報","fact":"❶上里建設 リパワリング\n施工実績200MW 自社施工ができる","cause":"❶-1\n要因：劣化した設備の交換や誠実なリスク提示による「安心」を重視。\n分析：地元オーナーなど「安心・安全」な運用を求める層に「誠実さ」で訴求。\n改善：HPでも具体的な実績、数字の分で根拠をもとにお客様への提案、HP改善を行う。","phase":"日報にてライバル情報を収集・報告し対象の部署へ共有する"},{"section":"Eライバル・業界・取引先情報","fact":"❷福島エナジー\n低圧蓄電池販売","cause":"❷-2\n要因：特措法太陽光が在庫がなくなり、低圧蓄電池の販売をしている\n分析：特措法の物件が無い為、低圧蓄電池の販売をしている\n改善：提案書・契約書一式の他に、提案内容をオンラインで受けリサーチします。","phase":"3月にオンラインにて提案を受けます"},{"section": "},{"section":"A 数値報告","fact":"❸車両事故（3月）\n  3月車両事故0回","cause":"❸-3 \n要因：安全運転チームの発足とアナウンスでの注意勧告、ルールの厳罰化を行ったため。\n分析：2026年の車両保険金額は2024年10月～2025年9月で確定するため、無事故の継続が必要です。\n対策：安全運転チームの力を借り、発信と意識改革を継続していきます。","phase":""},{"section":"B \n \n\n内部体制に関する方針","fact":"❶２．勤 務\n（１） キングオブタイムを出勤・退勤時に位置情報付きで打刻する。\n\n3月の勤怠漏れ合計65件です。\n2月は53件で12件増加です。","cause":"❶-1 \n要因：2回以上の打刻漏れが15名いる為。\n分析：全社ルール適用し、努力文25枚発令いたしました。\n改善：修正と努力文の発令を各部署で行っていただきます。","phase":""},{"section":"B \n \n\n内部体制に関する方針","fact":"➋５．個人情報\n（１） 個人情報に関する書類の紛失や貸与物の紛失等その他情報漏洩に関する事項が発生した場合は役員・上司・個人情報保護管理者の（総務）に速やかに連絡をする。","cause":"❷-2\n要因：個人情報保護管理者として機能していない状態です。\n分析：個人情報保護管理者として法令や個人情報保護に関する知識が不足しているため。\n改善：「個人情報保護士」や「プライバシーマーク審査員」といった資格を取得することで個人情報保護管理体制の整備を整え、企業イメージを損なうリスクを軽減できます。","phase":""},{"section":"B \n \n\n内部体制に関する方針","fact":"❸（３） 過失による盗難・紛失・無断での持ち帰りは下記の内容とする。\n● 努力文……個人に貸与している物紛失は１万円以内会社からの貸与物を忘れた場合に報告がない場合該当する\n● 反省文……共有物（個人への特定で貸与していないもの、会社所有物）\n● 始末書……携帯やタブレットなど商品と個人情報が絡むもの","cause":"❸-3\n要因：努力文を出し、ＤＸ登録漏れが発生しています。\n分析：努力文を出して終わりだと考えているため。\n改善：ＤＸ登録漏れに関してルール提案いたします。","phase":""},{"section":"C お客様の声","fact":"❶久安さん\n「3/21の副社長質問会について全日有休をいただくのですが質問会のみの参加は大丈夫でしょうか。」","cause":"❶-1 \n要因：会社行事が有給や業務でブッキングするケースがあるため。\n分析：総務での個人調整は整理する仕組みが必要です。\n改善：懇親会等で参加できない場合は代わりの参加者を自身で手配するようにいたしました。","phase":""},{"section":"C お客様の声","fact":"➋株式会社武蔵野 遠田さん\n「会社全体が明るく、皆様のご挨拶、対応が素晴らしかったです！掲示物に関しても、なぜそこにあるのか、意味が明確で勉強になりました。」","cause":"➋-1 \n要因：案内役もメインに運営メンバーが声掛けと質疑応答を実施していたため。\n分析：普段の環境整備で掲示物の必要性が機能していることを見せられました。\n改善：お客様目線であいさつや返事が全体ができるように発信していきます。","phase":""},{"section":"C お客様の声","fact":"❸中村電設工業株式会社\t中村康宏様\n「金子さんの方から声をかけて頂いた。一年目とは思えないくらい明るく丁寧に説明を頂きました。」","cause":"❸-3\n要因：新卒社員へ内定者期間から教育投資をしているため。\n分析：実際のお客様の声になるのでハッピーな点として活用ができます。\n改善：アンケート内容をAIでまとめ、全社へアウトプットいたします。","phase":""},{"section":"D 従業員の声","fact":"❶村田さん\n「フライング手当のワークフロー画面が出てこないです。」","cause":"❶-1 \n要因：楽楽精算での設定が未完了だったため。\n分析：総務の動画マニュアルで解決いたしました。\n改善：ITツールの操作方法については手打ちではなく、動画でマニュアルを残していきます。","phase":""},{"section":"D 従業員の声","fact":"➋久安さん\n「スライドの発表がメインになってしまっているので実際に操作しているところを見せて欲しい。」","cause":"➋-1 \n要因：全社員勉強会でスライドのみでなく、実演の時間も設けたため。\n分析：実演時間を増やすことで活用のイメージがつき、活用につながると考えられます。\n改善：スライドの読み上げは3分までとし、残り時間を実演時間として設定いたします。","phase":""},{"section":"D 従業員の声","fact":"❸名古さん\n「商談シートの仕様が変わっていて、原因わかりますか？」","cause":"❸-3\n要因：salesforceのポップアップでレイアウトの仕様変更が起きたため。\n分析：SFのサポートと連携し設定を戻すことができた。\n改善：SFサポートを使うことで私がわからない設定なども回答がもらえるのでDX問い合わせを整理し、サポートの活用を促します。","phase":""},{"section":"E ライバル・業界・取引先情報","fact":"❶埼玉地域会の回答アンケートより輝いていたスタッフの集計結果\n〇輝いていたスタッフ\n大場+7\n大河原+3 \n小林+2\n金子+2 \n石井+1、\n（発表者全員+7）\n\n発表者以外 古屋+1","cause":"❶-1\n要因：司会原稿とリハを繰り返し行い、当日を迎えたため。\n分析：4点のステップアップがあり、運営面での改善が課題です。\n改善：社内行事やイベントは前回の振り返り内容をチェックリストに反映させたうえでPDCAを回していきます。","phase":""},{"section":"E ライバル・業界・取引先情報","fact":"❷XSOL SOLAR STAR制度\n包括的な評価: 設備、施工、土地、法的DD、地域への告知、ハザードなど、多角的な視点から発電所を評価します。\n第三者機関による評価: 株式会社CO2OSや一般社団法人日本資産評価士協会(JaSIA)との連携により、公平かつ中立的な評価を実現しています。\nリパワリング提案: 評価結果に基づき、必要に応じてリパワリングの提案を行います。\n保険サービスとの連携: XSOL SOLAR STAR制度の評価ランクE以上の場合、「XSOL SOLAR STAR 補償」に加入することができます。\n売却サポート: XSOL SOLAR STAR 補償加入者は、発電所売却時の価格提示や売却先マッチングサービスを利用することができます。","cause":"❷-2 \n要因：XSOL SOLAR STAR制度は発電所の価値を客観的に評価できる点や、リパワリング提案、保険サービスとの連携、売却サポートなどのサービスが充実している点で強みがあります。\n分析：売却サポートについてアースコム側で対策が必要です。\n改善：サンキーパーを付けることで保険会社や業界の人の声を資料に入れ、第三者から見て安心な太陽光発電所というイメージを持ってもらえるよう訴求します。","phase":""},{"section":"E ライバル・業界・取引先情報","fact":"❸株式会社プリマベーラエアコン風よけで経費削減\nメーカーの記載では電気代が年間約2万円削減の見込みです。","cause":"❸-3 \n要因：風よけを活用しているため\n分析：実際の向きを効果的に使えていない可能性があります。\n改善：プリマベーラの改善レポートを掲示し、活用いたします。","phase":""}],"auth":"","sheet":"【整理】実行計画報告・総務課（5分） "},{"dept":"FC事業部","date":"2025-04-02","time":"30分","members":"副社長・金子","mq":{},"g":{"month":{"actual":116.8,"prev":0.0,"diffPrev":116.8,"target":79.95,"diffTarget":36.85},"total":{"actual":490.2,"prev":0.0,"diffPrev":490.2,"target":335.7,"diffTarget":154.5}},"fm":{"month":{"actual":26.0,"target":59.0,"rank":"S"}},"plan":{"month":{"score":15.0,"max":15.0,"rate":1.0},"total":{"score":15.0,"max":15.0,"rate":1.0}},"actions":[{"no":"①","name":"店内イベントの企画開催","kpi":"実施","month":{"actual":5.0,"target":5.0,"rate":1.0},"total":{"actual":5.0,"target":5.0,"rate":1.0}},{"no":"②","name":"MS全国１位キャンペーン","kpi":"実施","month":{"actual":5.0,"target":5.0,"rate":1.0},"total":{"actual":5.0,"target":5.0,"rate":1.0}},{"no":"③","name":"定期MTG・親睦会の実施","kpi":"実施","month":{"actual":5.0,"target":5.0,"rate":1.0},"total":{"actual":5.0,"target":5.0,"rate":1.0}}],"summary":[{"section":"A 数値報告","fact":"①売上目標109％で達成 目標533 実績584 ＋7 （単位：万円）","cause":"❶-1\n要因：人件費は先月比マイナス７万円に変化している\n    土日は672個完売ができている。\n分析：行列がつくられる時間が12時くらいまでに落ち着いてきている。\n    人件費は4名稼働が可能になり先月比３日営業日が多かったが\n    70,000円の削減ができている\n対策：LINE登録者数を目標2000名に継続し、予約・新商品定期告知を実施\n    地域イベントへの参加情報を収集し出店","phase":""},{"section":"A 数値報告","fact":"②1日の最大廃棄数 97個","cause":"❷-2\n要因：雨・雪の日の湿度50％以上になったから\n分析：湿度40%20℃の高温多湿の際は過発酵・乾燥不足のため揚げの状態が\n    悪くなるためエアコン・除湿調整が必要\n改善：店舗に温度湿度対策の注意内容の掲示を実施","phase":""},{"section":"A 数値報告","fact":"③覆面調査結果162/200点 全国25店舗中17位","cause":"要因：商品提供時「お勧めの商品」の説明・案内の要素で失点があったから\n分析：スタッフ全員が均一で案内ができる教育が必要\n改善：均一の接客・コミュニケーションスキルを付けるためマニュアルの作成とロープレの実施","phase":""},{"section":"B 商品に関する方針より","fact":"①清潔の徹底","cause":"❶-1\n要因：販売時お客様と至近距離での対応のためマット、商品のディスプレイの清潔が必要\n分析：店内が狭い分お客様の目線に入る部分の清潔が必須\n改善：毎日マット、床の清掃の実施の徹底・開店前のチェックリストの作成・実施","phase":""},{"section":"B 商品に関する方針より","fact":"②新商品・キャンペーン商品\n  ：3月新商品 桜 完売が2月商品より平均２時間早い","cause":"❷-2\n要因：金額が他の商品に比べ高めだが季節を感じられるためコンスタントに売れ\n    ている。\n分析：季節を感じられるためひな祭り、卒入学、花見などイベントにお土産等に\n    使用されている\n対策：LINEで新商品の訴求の実施を定期的に実施する","phase":""},{"section":"B 商品に関する方針より","fact":"③売上数継続","cause":"❸-3\n要因：平均完売時間15：30越え\n分析：雨、雪など気温低下の場合ユニクロにも来客が少なくなるため\n改善：天気予報に合わせ平日は製造数の調整の実施をする","phase":""},{"section":"C お客様の声","fact":"①口コミ\n「店のドアは常時開放されている、ドーナツはショーケースに入れられているわけではない（店に入ったらすぐ目の前にドーナツがある）ので品質や衛生上どうなのだろう？と入った瞬間に思いました。」","cause":"❶-1\n要因：インフルエンザ等流行があるが商品がむき出しになった状態だから\n分析：お客様はマスクの強制ができない、飛沫対策が必須\n改善：アクリルの商品カバーの導入をします","phase":""},{"section":"C お客様の声","fact":"②口コミ\n「今来ましたが営業終了していました。時間まで販売がないなら、終了した事も発信してほしいです。」","cause":"❷-2\n要因：完売時間がわかる方法の訴求が不足しているから\n分析：予約方法のお知らせや完売の確認方法のお知らせの実施が必要\n改善：完売後に来店のお客様にはチラシのお渡しとLINE予約のご案内。インスタのQRコードを店内に掲示する","phase":""},{"section":"C お客様の声","fact":"③来店のお客様\n「クリームが入っていませんでした」","cause":"要因：製造時にクリームの入っていないものと混ぜてしまいそのまま販売してしまったため\n分析：製造時クリームの有無の判別をしやすくすることが必要\n改善：製造時生地をクリーム入れた前後にて列を明確に分ける","phase":""},{"section":"D 従業員の声","fact":"①川西さん\n「気が付けないスタッフにどう対応したらよいかわかりません」","cause":"❶-1\n要因：スタッフの中には問題点に気が付けない時があるため\n分析：注意事項の見える状態にできていない\n改善：EGの取得を実施し、様々な顕性があることを訴求する。\n    よくあるトラブルの予防策など掲示物にて貼り注意を促す","phase":""},{"section":"D 従業員の声","fact":"②吉田さん\n「温度も湿度も高い状態でいつもよりなかなか生地が乾きにくい感じでした」","cause":"❷-2\n要因：雨・雪で湿度が高い状態で乾燥が十分にできないから\n分析：本部に確認。湿度温度の調整の実施が必要\n改善：今後の梅雨時期、夏に向け生地の発酵がスムーズに行えるよう\n    温度湿度計を設置しデータを蓄積し、コントロールしていく","phase":""},{"section":"D 従業員の声","fact":"③沖田さん\n「もう一つの仕事との両立が難しくなってきてしまいました」","cause":"❸-3\n要因：出勤回数が少なく他のスタッフについていけないと感じる状態ができて\n    いるから\n分析：注意する点、実施すべき点をマニュアルに明確にする\n改善：できない方のサポート方法をリーダー副リーダーに教育する。マニュアルの使用しやすい状態にする","phase":""},{"section":"E ライバル・業界・取引先情報","fact":"①ドレイク本部\n「ポイント制でランキングにしました」\n25店舗中やってみたい他店の限定商品１位：埼玉岩槻店 ホワイトチョコオレオ","cause":"❶-1\n要因：お客様に選ばれる可能性が高く感じられるから\n対策：全国の店舗中でも１位に選ばれている商品であることをスタッフに共有し\n    お客様へのトークのひな型に入れる","phase":""},{"section":"E ライバル・業界・取引先情報","fact":"② 埼玉県 生ドーナツ販売店５選\nhttps://metsa-hanno.com/media/%E5%9F%BC%E7%8E%89/11339/","cause":"❷-2\n要因：埼玉岩槻店紹介欄あり「生ドーナツブームの火付け役・埼玉第一号店」と表記あり。\n対策：埼玉西部（所沢、鶴ヶ島など）に多く出店がされている状態\n    広報誌などの依頼があった際は本部に相談の上受けていく","phase":""},{"section":"E ライバル・業界・取引先情報","fact":"③TOUJOURS\n（トゥージュール）\nhttps://www.instagram.com/toujours_donut/?hl=ja","cause":"❸-3\n要因：グラハム(全粒粉)のドーナツとお豆腐のドーナツのお店\n    キャッシュレス決済のみ\n    お客様に製造の体験イベントなども開催\n対策：お客様参加型のイベントも検討する","phase":""},{"section":"自分の考え","fact":"在庫の管理・発注を3月中にリーダー・サブリーダー実施へ移行完了しました。\n引き続きLINE登録数増加や予約方法の普及、地域イベント出店企画を本社で行っていきます。","cause":"","phase":""}],"auth":"","sheet":"【整理】実行計画報告・FCドレイク"},{"dept":"営業企画部","date":"2024-12-09","time":"1800-1815","members":"古屋","mq":{"month":{"actual":null,"prev":null,"diffPrev":0.0,"target":null,"diffTarget":0.0},"total":{"actual":null,"prev":null,"diffPrev":0.0,"target":null,"diffTarget":0.0}},"g":{"month":{"actual":null,"prev":null,"diffPrev":null,"target":null,"diffTarget":null},"total":{"actual":null,"prev":null,"diffPrev":null,"target":null,"diffTarget":null}},"fm":{"month":{"actual":32.0,"target":59.0,"rank":"S"},"total":{"actual":20.0,"target":59.0,"rank":"S"}},"plan":{"month":{"score":10.0,"max":15.0,"rate":66.0},"total":{"score":31.0,"max":45.0,"rate":68.0}},"actions":[{"no":"①","name":"ダイレクトマーケティング施策","kpi":"施策数合計24回","month":{"actual":5.0,"target":5.0,"rate":100.0},"total":{"actual":15.0,"target":15.0,"rate":100.0}},{"no":"②","name":"SEO 指定ワード順位3位以内","kpi":"「太陽光 ケーブル盗難 対策」「太陽光 ケーブル盗難 保険」「太陽光 ケーブル盗難 防止」","month":{"actual":0.0,"target":5.0,"rate":0.0},"total":{"actual":1.0,"target":15.0,"rate":6.0}},{"no":"③","name":"勉強会","kpi":"市場調査 資料改善","month":{"actual":5.0,"target":5.0,"rate":100.0},"total":{"actual":15.0,"target":15.0,"rate":100.0}}],"summary":[{"section":"A 数値報告","fact":"❶サンキーパー問合せ 25/17 ▲8 68%","cause":"❶-1\n要因：PVEXPOからのリードかつホットリードが18件あったため。\n⇒全体リードの約50％がPVEXPOからのリードでした。メルマガリードが15%と、アベレージで40%のところが減ってきているため、メルマガを週3回、休日含め対応を行い、ELITEの内容を訴求していきます。","phase":"ｃ"},{"section":"A 数値報告","fact":"❷太陽光リード獲得数 10/13  130%\nマーケ起因 PQMQ：1.5/1.5","cause":"❷-2\n年内償却にてお問い合わせで、冷凍自販機で受注をいただいております。\n年内は冷凍自販機でも難しいため、太陽光含め来年の7月以降決算のお客様を狙います。","phase":"ｃ"},{"section":"A 数値報告","fact":"❸営業予算進行PQ183/46 25%\n*マーケ関与：PQ6.2","cause":"❸-3\n要因：サンキーパーの保険範囲で盗難対象部分がどこなのかなどの懸念を払しょくできたため\n▼\n山崎光太様\n\n「盗難に悩まされてきましたが、説明を聞いてみて懸念だったところもなくなったので申し込ませていただきました。」\n\n⇒ELITEや自社共済などこれから拡大していくため、お客様からの疑念が少しでも出ないように営業ツールを改善していきます。","phase":"c"},{"section":"B 商品に関する方針より","fact":"❶（２） お客様へのサービスは我が社の最高の商品です。","cause":"❶-1\n宣伝会議 森 様\n「ご相談いただいた社会課題としての設備盗難の季刊『環境ビジネス』特集につきまして、\nさっそく編集に相談したところ、前向きに検討できそうでした。」\n⇒社会的価値の高い商品、サービスと編集部が評価をしていただき、次回来年の環境ビジネスにて、編集記事の相談が来る可能性があります。","phase":"ｃ"},{"section":"B 商品に関する方針より","fact":"❷（４） お客様のニーズを把握し、要望に合った商品・サービスを、定期的に商品化する。","cause":"❷-2\nCINC 東様\n「WEB上だと、タイナビが競合です。この会社の上位表示されているテキストやタイトルをマネしていくと良いです。」\n⇒12月目途で保険×タイナビプロテクターのリリースがされるとのことでしたので、その動向を見てテキストをマネしていきます。","phase":"ｃ"},{"section":"B 商品に関する方針より","fact":"❸\n（１） アースコムで働いてるスタッフ全てが商品です。","cause":"❸-3\n有限会社佐々木 佐々木様\n「1か月前にお願いした案件で、入金ばかり先にさせて現地調査もしてないっておかしくないですか？」\n「対応が後手に回っててとにかく弁護士にも一度話しているので、今日中にいつやるか報告をしてください。」\n⇒フローとルールが曖昧。また、いまどこにボールがあるのかが可視化されていない。\nJOOTO等のタスク管理ツールで見える化する等していくことで解決できる。\n\nディレクションする人間が1人～2人必要だと考えます。","phase":"ｃ"},{"section":"C お客様の声","fact":"❶三田 修 様\n「ストックオプションで1億5000万円の収入が入ってくるので、1年で一括償却できるのはとても良いね。」","cause":"❶-1\n寳船さんの返信スピードが遅いと指摘があり、大河原さんへ担当変更したお客様になります。ストックオプションにて、他の役員も同様に1億5000万の収入が入ってくるため、対応次第で紹介をいただける可能性が高いです。\n怒っていると思いましたが、全然そうではなかったです。実際に顔を突き合わせることが大事です。","phase":"c"},{"section":"C お客様の声","fact":"❷UNIVERGY 今田様\n「単年であれば、14円～15円もいけるかもしれません。長期は法人のみで、大手買取会社を紹介します」","cause":"❷-2\n事業用太陽光の提案をした時に、業務提携をしたお客様になります。\n⇒リスクを取りたくないお客様で、個人は１年から5年。長期で法人であれば、大手買取会社を紹介するとのことで、取引先も大手としかやらないと仰ってました。大手買取会社を紹介してもらいINF HD様などに提案するのが良いと考えます。","phase":"ｃ"},{"section":"C お客様の声","fact":"❸株式会社日本総険トラストテクノロジーズ \n「商品が良い内容なのでサンキーパーの代理店をしたいが、\nそれよりも盗難のリスクが付けられるのであれば安心をして頂けるかなと思っている。」","cause":"❸-3\n当初は代理店契約について問い合わせをいただきましたが、補償制度「ELITE」に興味を持っていただきました。結果としてはあちらが保険代理店であり、「ELITEの」代理店条件もO&Mを実施していることが必須であるため、旨味が無いとのことでお見送りになりました。","phase":""},{"section":"D 従業員の声","fact":"❶古屋さん\n「SEO対策向けのコラムを作成しました。」","cause":"❶-1\nhttps://earthcom-eco.jp/column/investment/sunkeeper\n⇒「太陽光 ケーブル盗難 保険」の分野で3位です。約1ヵ月で9位⇒5位⇒3位と、上がってきてます。キーワードマップというSEO対策ツールを1週間無料で登録しAIを使ったコラムで作成。野寄さんにも監修していただいてます。","phase":"ｃ"},{"section":"D 従業員の声","fact":"❷寳船さん\n 「お客様から共有いただきました。ふくしまエナジーも盗難対策ツール作ってます 」","cause":"❷-2\nライバル情報にて共有いたしましすが、当社のおきゃくさまはふくしまエナジーからも情報を共有もらっているため、市場にはお客様の自由とライバルの勝手しかないことがまさによくわかりました。チラシの配布エリアを確認しに行くべきだと考えます。⇒要は早い者勝ちということです。","phase":"ｃ"},{"section":"D 従業員の声","fact":"❸内定者 村田さん\n「俺は常に高みを目指したいからアースコムに入社しようと思った。何もしない仕事しないおっさんとかいると思うけど、俺はそうゆうふうにはなりたくないんだよね。」","cause":"❸-3\nインターンの学生さんに対して、熱く語ってました。彼はバイタリティがすごいなと思いました。この気持ちを忘れずに頑張ってほしいと思います。","phase":"ｃ"},{"section":"E ライバル・業界・取引先情報","fact":"❶グッドフェーローズ 星野様\n「タイナビプロテクターは12月リリース予定で保険とセットで提案していきます」","cause":"❶-1\nSEOの観点からも、タイナビプロテクターは一番の競合になります。\n当社よりも価格が安く抑止力中心に作られているため、利回りを担保した状態で中古物件などを提案ができるようになるとのことでした。\n\n商談詳細：https://earthcom.lightning.force.com/lightning/r/Event/00UJ300000IzefUMAR/view","phase":"ｃ"},{"section":"E ライバル・業界・取引先情報","fact":"❷ふくしまエナジー\n\nケーブル盗難対策ツールのチラシ\n※お客様より、情報共有いただきました。\nふくしまエナジー ケーブル盗難対策.pdf","cause":"❷-2\n寳船さんのお客様より、共有をいただきました。\nチラシを見ると、インパクトとかはあまりないですが、金額が当社より安いこと。\n当社と訴求ポイントは似てますが、免責0円やスーパーダイマを使っていることで、差別化していきます。","phase":"ｃ"},{"section":"E ライバル・業界・取引先情報","fact":"➌株式会社ダイコーブランド\n「太陽光発電施設における電線盗難防止対策として自社開発製品を貴社にぜひご提案させて頂きたく、メールさせて頂きました。」","cause":"➌-3\n自社で盗難被害に遭い、900万円の損失を出したため、自社でケーブル盗難対策ツールの開発を行っている会社です。太陽光の会社でもなんでも無いので一旦は情報収集のみでしたが、市場規模的に盗難対策ツールは儲かるとみられているように感じます。市場を荒らされる前に少なくとも当社のお客様には購入を促進してまいります。","phase":"ｃ"}],"auth":"","sheet":"【整理】実行計画報告・営業企画（5分） "},{"dept":"開発部","date":"2025-01-07","time":"8:00～8:30","members":"大澤、堀口、小島、大場","mq":{"month":{"actual":3.9,"prev":80.0,"diffPrev":-76.1,"target":10.0,"diffTarget":-6.1},"total":{"actual":3.9,"prev":80.0,"diffPrev":-76.1,"target":10.0,"diffTarget":-6.1}},"g":{"month":{"actual":null,"prev":null,"diffPrev":null,"target":null,"diffTarget":null},"total":{"actual":null,"prev":null,"diffPrev":null,"target":null,"diffTarget":null}},"fm":{"month":{"actual":128.0,"target":59.0,"rank":"D"},"total":{"actual":128.0,"target":59.0,"rank":"D"}},"plan":{"month":{"score":15.0,"max":15.0,"rate":1.0},"total":{"score":15.0,"max":15.0,"rate":1.0}},"actions":[{"no":"①","name":"工程管理","kpi":"農転申請","month":{"actual":5.0,"target":5.0,"rate":1.0},"total":{"actual":5.0,"target":5.0,"rate":1.0}},{"no":"②","name":"物件開発","kpi":"負担金受領","month":{"actual":5.0,"target":5.0,"rate":1.0},"total":{"actual":5.0,"target":5.0,"rate":1.0}},{"no":"③","name":"勉強会","kpi":"勉強会開数","month":{"actual":5.0,"target":5.0,"rate":1.0},"total":{"actual":5.0,"target":5.0,"rate":1.0}}],"summary":[{"section":"A 数値報告","fact":"❶農転申請 4/4","cause":"❶-1 \n要因：行政書士の先生との定期MTGで問題点を把握し対応していたから。\n分析：定期MTGで双方でチェックを行いモレがない状態を継続する。\n改善：農転申請予定の物件に対し、前倒しができないか齊間先生へ交渉し、着工可能件数の増加を図る。","phase":""},{"section":"A 数値報告","fact":"❷アセット負担金受領の交渉 33/52","cause":"❷-2 \n要因：負担金催促をダッシュボードで見える化し、ルーティンで実施できたから。\n分析：タスク化し優先対応が出来たから。\n改善：Geminiで分析し、催促方法を改善いたします。","phase":""},{"section":"A 数値報告","fact":"❸第三施策：PJフロー勉強会 30/28","cause":"❸-3 \n要因：サンキーパーの図面作成・設置について体験を踏まえて学ぶ事ができたから。\n分析：入社2年目のスタッフが講師になる事で事前に認識の確認も出来た。\n改善：アウトプットさせることで理解しているか確認する。","phase":""},{"section":"B 商品に関する方針より","fact":"❶商品の組み合わせを工夫して、粗利額を確保できる商品開発を行う。","cause":"❶-1  \n要因：配送費費用の負担を軽減させたいから。\n分析：納品後の移動に関しては30万の経費が掛かる。\n改善：再配送に関しては内製化を検討します。","phase":""},{"section":"B 商品に関する方針より","fact":"❷定期コンタクトで購入物件の要因を聞き出し商品開発に繋げる。","cause":"❷-2 \n要因：栃木県真岡市は農転確認の回答が当日得られたから。\n分析：栃木は茨城に比べ農転への確認が容易に得られる可能性が高い。\n改善：継続して農転解答の早いエリアに関しては土地に共有を行う。","phase":""},{"section":"B 商品に関する方針より","fact":"❸条例・ガイドライン等の関係法令の調査を定期的に行い、透明性のある商品を作る。","cause":"❸-3 \n要因：丸紅の近隣同意に関しては電話でも対応が可能だったから。\n分析：近隣同意に関する認識が相違していたから。\n改善：再来の時間を削減す為、電話での対応を進める。","phase":""},{"section":"C お客様の声","fact":"❶ 栃木県真岡市農業委員会 室町様\n「1,2筆であれば電話で対応します。」","cause":"❶-1  \n要因：即日で回答を取得することができました。\n分析：茨城以外は茨城ほど太陽光が厳しくないと推測されるから。\n改善：真岡市への依頼は2筆までにし電話で確認をすることで即日回答をえます。","phase":""},{"section":"C お客様の声","fact":"❷ 齊間先生\n「水戸市2件の農転許可が下りました。」","cause":"❷-2 \n要因：市町村により条例に差があり予定よりも早く回答が得らえたから。\n分析：市町村ごとの予測を行政書士へ確認、対応していたから。\n改善：行政書士とのMTGで進捗スプレッドの確認を行い対応する。","phase":""},{"section":"C お客様の声","fact":"❸ 恩田先生\n「大子町の申請日が近づいているので、準備をお願いします。」","cause":"❸-3 \n要因：電力からの回答待ちが歩留まりとなる懸念があるから。\n分析：電力への毎日連絡を入れ回答を急がせる。\n改善：毎日3時間、電力への問い合わせを行い取得する。","phase":""},{"section":"D 従業員の声","fact":"❶小島さん\n「丸紅から部材発注の件、進めて良いとは電話解答のみです。」","cause":"❶-1 \n要因：年始の発注に関して架台のみとパッケージの認識の齟齬があったから。\n分析：金銭、スケジュールに関する決定事項はエビデンスに残す。\n改善：丸紅 佐久間さんとの対応で電話での回答を頂いた内容は必ずメールで返信を行いエビデンスを残す。","phase":""},{"section":"D 従業員の声","fact":"❷大場さん  \n「SS試験は必須で無いと架台の仕様が変わる為発注出来ないようです。」","cause":"❷-2 \n要因：地盤の強度により架台の仕様が異なる事例が派生したから。\n分析：BSL様は注はエリアにより架台の太さ等が考慮され納品されました。\n改善：測量後面積に問題がない物件はSS試験の予定組を行い実施する。","phase":""},{"section":"D 従業員の声","fact":"❸堀口さん \n「土地の契約書で地番が書いていない、もしくは地番が間違っている物も上司チェックが通っています。」","cause":"❸-3  \n要因:：進捗確認時に地番の相違があり確認に時間を要したから。\n分析：フローの見直し修正を行いました。\n改善：上司ダブルチェックを行い相違がない状態にするよう土地とフローの確認を行い変更しました。","phase":""},{"section":"E ライバル・業界・取引先情報","fact":"❶東北経済産業局\nSWS/SS式の試験結果を提出を求めら始めました。","cause":"❶-1 \n要因：崩落・地盤沈下の問題から重視され始めたから。\n分析：SS試験が今後完工の物件はマストになります。\n改善：今後の物件は原価に11万のコストを上乗せして計算を行います。\n（実質掛かる費用が地元業者により7万～11万の為）","phase":""},{"section":"E ライバル・業界・取引先情報","fact":"❷佐久間さん\n「地質調査報告書がないと正式な発注できないです。」","cause":"❷-2 \n要因：地盤調査により架台の仕様がかわるから。\n分析：契約書に記載がある為、マストの内容になります。\n改善：丸紅からの個別回答後に対応する。","phase":""},{"section":"E ライバル・業界・取引先情報","fact":"❸丸紅 佐久間さん\n旧正月が絡むため、架台に関しては事前相談後に別初注可能で対応。","cause":"❸-3 \n要因：旧正月により納品時期が遅れるから。\n分析：納品を優先して完工を有する。\n改善：発注相談時にメールで履歴を残し齟齬がない状態にする。","phase":""}],"auth":"","sheet":"【整理】実行計画報告　開発部"},{"dept":"開発部 調達課","date":"2023-07-06","time":"30分","members":"森作、武居、江藤","mq":{"month":{"actual":115.0,"prev":18.0,"diffPrev":97.0,"target":99.0,"diffTarget":16.0},"total":{"actual":115.0,"prev":18.0,"diffPrev":97.0,"target":99.0,"diffTarget":16.0}},"g":{"month":{"actual":null,"prev":null,"diffPrev":null,"target":null,"diffTarget":null},"total":{"actual":null,"prev":null,"diffPrev":null,"target":null,"diffTarget":null}},"fm":{"month":{"actual":0.72,"target":59.0,"rank":"A"},"total":{"actual":0.72,"target":59.0,"rank":"A"}},"plan":{"month":{"score":12.0,"max":15.0,"rate":80.0},"total":{"score":12.0,"max":15.0,"rate":80.0}},"actions":[{"no":"①","name":"","kpi":"","month":{"actual":2.0,"target":5.0,"rate":40.0},"total":{"actual":2.0,"target":5.0,"rate":40.0}},{"no":"②","name":"","kpi":"","month":{"actual":5.0,"target":5.0,"rate":100.0},"total":{"actual":5.0,"target":5.0,"rate":100.0}},{"no":"③","name":"","kpi":"","month":{"actual":5.0,"target":5.0,"rate":100.0},"total":{"actual":5.0,"target":5.0,"rate":100.0}}],"summary":[{"section":"A 数値報告","fact":"❶全社予算完工PQ  目標270/309 39","cause":"❶-2\n着工前挨拶を実施する事で、近隣反対等の歩留まりを無くし、スムーズに完工まで進められました。","phase":""},{"section":"A 数値報告","fact":"❶情報取得 目標30/36  ＋6\nhttps://lookerstudio.google.com/u/0/reporting/539862f3-a79a-433b-b6dc-16e06c0ff2d3/page/nDgRD","cause":"❷-2新卒の人員増加\n7月復興住宅1人当たり100件訪問を実施し、郡山市、福島市を中心に訪問、チラシ送付を行います。（反響件数は2022/08/04で送付数1 const $ = s=>document.querySelector(s);
const state = {rows:[], manual:null, dept:"__ALL__", date:null, view:"report", q:"", source:"demo",
  suchi:null, suchiSheet:0, suchiMonth:null, suchiMode:"当月"};

/* ---------- ユーティリティ ---------- */
const n = v => (v===null||v===undefined||v==="") ? null : (typeof v==="number"?v:parseFloat(String(v).replace(/[,%％]/g,"").replace("▲","-")));
const fmt = (v,d=1) => v===null||v===undefined||isNaN(v) ? "—" : v.toLocaleString("ja-JP",{minimumFractionDigits:0,maximumFractionDigits:d});
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ym = d => (d||"").slice(0,7);

function rate(actual,target){
  const a=n(actual), t=n(target);
  if(a===null||t===null||t===0) return null;
  return a/t*100;
}
/* 達成率セル。0.46 のような小数保存も 46.6% として扱う */
function normRate(v){
  const x=n(v); if(x===null) return null;
  return Math.abs(x)<=2 ? x*100 : x;
}
function rateColor(p){
  if(p===null) return "var(--rule)";
  if(p>=100) return "var(--achieve)";
  if(p>=80) return "var(--ai)";
  if(p>=50) return "var(--warn)";
  return "var(--short)";
}
function highlight(t){
  const s=esc(t);
  if(!state.q) return s;
  try{ return s.replace(new RegExp(state.q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"), m=>`<mark>${m}</mark>`); }catch(e){ return s; }
}

/* 実行フェーズから 担当／期限 を抜き出す */
function parsePhase(text){
  const t = String(text||"");
  const who = [...t.matchAll(/(?:担当|責任者)\s*[：:]\s*([^\n]+)/g)].map(m=>m[1].trim()).filter(Boolean);
  const due = [...t.matchAll(/(?:期日|期限|納期)\s*[：:]\s*([^\n]+)/g)].map(m=>m[1].trim()).filter(Boolean);
  const body = t.replace(/(?:担当|責任者|期日|期限|納期)\s*[：:]\s*[^\n]*/g,"").replace(/\n{2,}/g,"\n").trim();
  return {who,due,body};
}
function dueClass(s){
  if(/完了|済/.test(s)) return "done";
  const m = s.match(/(\d{1,2})\s*[\/月]\s*(\d{1,2})/);
  if(m && state.date){
    const y = +state.date.slice(0,4);
    const d = new Date(y, +m[1]-1, +m[2]);
    const base = new Date(state.date);
    if(d < new Date(base.getFullYear(), base.getMonth(), base.getDate()-1)) return "over";
  }
  return "due";
}

/* ---------- データ取得 ---------- */
function apiUrl(){
  const p = new URLSearchParams(location.search).get("api");
  return (p || API_URL || "").trim();
}
async function load(force){
  const url = apiUrl();
  if(!url){ state.rows = DEMO; state.source="demo"; boot(); return; }
  $("#content").innerHTML = '<div class="loading">スプレッドシートから読み込み中…</div>';
  try{
    const res = await fetch(url + (url.includes("?")?"&":"?") + "t=" + Date.now());
    const j = await res.json();
    const rows = Array.isArray(j) ? j : (j.rows || j.blocks || []);
    if(!rows.length) throw new Error("データが0件でした");
    state.rows = rows; state.source="live";
    if(!Array.isArray(j) && Array.isArray(j.manual) && j.manual.length) state.manual = j.manual;
    $("#stamp").textContent = "取得 " + new Date().toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
  }catch(e){
    state.rows = DEMO; state.source="error"; state.err = e.message;
  }
  boot();
}

/* ---------- 初期化 ---------- */
function boot(){
  const rows = state.rows.filter(r=>r.date);
  rows.sort((a,b)=> b.date.localeCompare(a.date));
  state.rows = rows;

  // 部門一覧（シート単位＝報告単位）
  const map = new Map();
  rows.forEach(r=>{
    const k = r.sheet || r.dept;
    if(!map.has(k)) map.set(k,{key:k, label:cleanName(k), latest:r, count:0});
    map.get(k).count++;
  });
  state.depts = [...map.values()].sort((a,b)=> b.latest.date.localeCompare(a.latest.date));

  // 月一覧
  state.months = [...new Set(rows.map(r=>ym(r.date)))].sort().reverse();
  if(!state.date || !state.months.includes(state.date)) state.date = state.months[0];

  renderRail(); renderMonths(); render();
}
function cleanName(s){
  return String(s||"").replace(/実行計画報告[・　\s]*/,"").replace(/（\s*\d+\s*分）/g,"").replace(/【[^】]*】/g,"").replace(/\s+/g," ").trim() || s;
}
function renderMonths(){
  $("#monthSel").innerHTML = state.months.map(m=>{
    const [y,mo]=m.split("-");
    return `<option value="${m}"${m===state.date?" selected":""}>${y}年${+mo}月 会議</option>`;
  }).join("");
}
function renderRail(){
  $("#deptList").innerHTML = state.depts.map(d=>{
    const r = pick(d.key, state.date) || d.latest;
    const p = rate(r?.mq?.month?.actual, r?.mq?.month?.target);
    const hasThis = !!pick(d.key, state.date);
    return `<button class="deptbtn${state.dept===d.key?" on":""}" data-dept="${esc(d.key)}" style="${hasThis?"":"opacity:.45"}">
      ${esc(d.label)}
      <span class="meta"><span class="minibar"><i style="width:${Math.min(100,p||0)}%;background:${rateColor(p)}"></i></span>
      <span class="pct">${p===null?"—":Math.round(p)+"%"}</span></span>
    </button>`;
  }).join("");
  $("#deptList").querySelectorAll(".deptbtn").forEach(b=>b.onclick=()=>{state.dept=b.dataset.dept;$("#rail").classList.remove("open");
    if(state.view==="suchi"){state.view="report";syncTabs();}
    renderRail();render();});
  document.querySelector('[data-dept="__ALL__"]').className = "deptbtn" + (state.dept==="__ALL__"?" on":"");
  document.querySelector('[data-dept="__ALL__"]').onclick = ()=>{state.dept="__ALL__";$("#rail").classList.remove("open");
    if(state.view==="suchi"){state.view="report";syncTabs();}
    renderRail();render();};
}
function shiftM(m,d){const[y,mo]=m.split("-").map(Number);const t=new Date(y,mo-1+d,1);return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0");}
function pick(key, month){
  return state.rows.find(r=> (r.sheet||r.dept)===key && ym(r.date)===month);
}

/* ---------- 描画 ---------- */
function render(){
  const c = $("#content");
  let html = banner();
  if(state.view==="manual") html += viewManual();
  else if(state.view==="suchi") html += viewSuchi();
  else if(state.view==="trend") html += viewTrend();
  else if(state.dept==="__ALL__") html += viewAll();
  else html += viewReport();
  c.innerHTML = html;
  bindSuchi(c);
  c.querySelectorAll("tr.clk").forEach(tr=>tr.onclick=()=>{state.dept=tr.dataset.k;state.view="report";syncTabs();renderRail();render();window.scrollTo(0,0);});
  const go=c.querySelector("#apiGo");
  if(go) go.onclick=()=>{
    const u=(c.querySelector("#apiIn").value||"").trim();
    if(!u) return;
    location.search = "?api=" + encodeURIComponent(u);
  };
  const ver=$("#ver");
  if(ver){ ver.classList.toggle("live", state.source==="live"); ver.textContent = "v1.3 · " + (state.source==="live"?"連動中":"サンプル"); }
}
function banner(){
  if(state.view==="manual"||state.view==="suchi") return "";
  if(state.source==="live") return "";
  const why = state.source==="error"
    ? `<b>スプレッドシートに接続できませんでした。</b>（${esc(state.err||"")}）デプロイの「アクセスできるユーザー」設定と、URLが <code>/exec</code> で終わっているかを確認してください。`
    : `<b>サンプル表示中です。</b> 各部門の最新1回分だけを表示しています。下にGASのウェブアプリURLを貼ると、全部門・全期間が出ます。`;
  return `<div class="banner">${why}
    <div class="connect">
      <input id="apiIn" type="url" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(apiUrl())}">
      <button id="apiGo">接続する</button>
    </div>
    <div class="bnote">HTMLの <code>API_URL</code> に貼れば毎回入力せずに済みます。ここから接続した場合は、そのURLをブックマークしてください。</div>
  </div>`;
}

/* --- 単一部門レポート --- */
function viewReport(){
  const key = state.dept;
  const r = pick(key, state.date);
  const d = state.depts.find(x=>x.key===key);
  if(!r) return `<div class="rephead"><div class="dept">${esc(d?.label||key)}</div>
    <div class="kv"><b>会議</b>${state.date} の報告はありません</div></div>
    <p class="empty">直近の報告は ${esc(d?.latest?.date||"—")} です。上の会議日を切り替えてください。</p>`;

  const S=[];
  S.push(`<div class="rephead">
    <div><div class="dept">${esc(r.dept||d.label)}</div><div class="kv" style="color:var(--ink-3)">${esc(cleanName(r.sheet||""))}</div></div>
    <div class="kv"><b>会議日</b><span class="mono">${esc(r.date)}</span></div>
    <div class="kv"><b>時間</b><span class="mono">${esc(r.time||"—")}</span></div>
    <div class="kv" style="max-width:420px"><b>参加者</b>${esc((r.members||"—").replace(/\n/g,"、"))}</div>
  </div>`);

  /* 成果A */
  S.push(`<div class="sec"><h2>１｜成果Ａ（計数）</h2><span class="note">当月／累計</span></div>`);
  S.push(`<div class="grid3">${kpiCard("MQ",r.mq,"百万円")}${kpiCard("Ｇ",r.g,"")}${fmCard(r.fm)}</div>`);

  /* 成果B */
  const pm = r.plan?.month, pt = r.plan?.total;
  const prate = normRate(pm?.rate) ?? rate(pm?.score, pm?.max);
  S.push(`<div class="sec"><h2>２｜成果Ｂ（重点施策の達成度）</h2><span class="note">達成率＝合計評価点 ÷（施策数×5点）</span></div>`);
  S.push(`<div class="grid4">
    <div class="card msr"><div class="ch"><span class="t">実行計画 達成率</span><span class="u">当月</span></div>
      <div class="cb"><div class="rate" style="color:${rateColor(prate)}">${prate===null?"—":Math.round(prate)+"%"}</div>
      <div class="ratio">${fmt(n(pm?.score))} / ${fmt(n(pm?.max))} 点</div>
      <div class="bar"><i style="width:${Math.min(100,prate||0)}%;background:${rateColor(prate)}"></i></div>
      <div class="ratio" style="margin-top:10px">累計 ${(()=>{const x=normRate(pt?.rate)??rate(pt?.score,pt?.max);return x===null?"—":Math.round(x)+"%";})()}</div>
      </div></div>
    ${(r.actions||[]).slice(0,3).map(msrCard).join("") || `<div class="card"><div class="cb empty">重点施策の記載なし</div></div>`}
  </div>`);

  /* 三段レール */
  const items = (r.summary||[]).filter(x=>!state.q || (x.fact+x.cause+x.phase).toLowerCase().includes(state.q.toLowerCase()));
  S.push(`<div class="sec"><h2>３｜結果（総括）</h2><span class="note">事実 → 要因・分析・改善 → 実行フェーズ</span></div>`);
  if(!items.length) S.push(`<p class="empty">${state.q?"検索に一致する記載はありません。":"総括の記載なし。"}</p>`);
  else{
    S.push(`<div class="railset"><div class="rgh"><div>区分</div><div>事実</div><div>要因・分析・改善</div><div>実行フェーズ</div></div>`);
    let prev="";
    items.forEach(it=>{
      const ph = parsePhase(it.phase);
      const chips = [...ph.who.map(w=>`<span class="chip who">担当 ${esc(w)}</span>`),
                     ...ph.due.map(w=>`<span class="chip ${dueClass(w)}">期限 ${esc(w)}</span>`)].join("");
      const sec = it.section||"";
      const badge = (sec.match(/^[A-Ea-e]/)||[""])[0].toUpperCase();
      const show = sec!==prev; prev=sec;
      S.push(`<div class="rrow">
        <div class="rsec">${show?`<span class="badge">${esc(badge||"・")}</span><br>${esc(sec.replace(/^[A-Ea-e][,、\s]*/,""))}`:""}</div>
        <div class="rfact">${highlight(it.fact)}</div>
        <div class="rcause">${highlight(it.cause||"—")}</div>
        <div class="rphase">${chips?`<div class="chips">${chips}</div>`:""}${highlight(ph.body||(chips?"":"—"))}</div>
      </div>`);
    });
    S.push(`</div>`);
  }
  if(r.auth) S.push(`<div class="sec"><h2>権限相談</h2></div><div class="card"><div class="cb" style="white-space:pre-wrap">${highlight(r.auth)}</div></div>`);
  return S.join("");
}
function kpiCard(title,k,unit){
  const m=k?.month||{}, t=k?.total||{};
  const a=n(m.actual), tg=n(m.target), p=rate(a,tg);
  if(a===null&&tg===null) return `<div class="card"><div class="ch"><span class="t">${title}</span></div><div class="cb empty">記載なし</div></div>`;
  return `<div class="card"><div class="ch"><span class="t">${title}</span><span class="u">当月${unit?" ／ "+unit:""}</span></div>
    <div class="cb">
      <div class="bignum">${fmt(a)}<small>/ ${fmt(tg)}</small></div>
      <div class="bar"><i style="width:${Math.min(100,p||0)}%;background:${rateColor(p)}"></i><span class="tick" style="left:100%"></span></div>
      <div class="vsline">
        <span class="vs"><b>目標差</b><span class="${n(m.diffTarget)<0?"neg":"pos"}">${diff(m.diffTarget)}</span></span>
        <span class="vs"><b>前年</b><span>${fmt(n(m.prev))}</span></span>
        <span class="vs"><b>前年差</b><span class="${n(m.diffPrev)<0?"neg":"pos"}">${diff(m.diffPrev)}</span></span>
        <span class="vs"><b>累計 実績/目標</b><span>${fmt(n(t.actual))} / ${fmt(n(t.target))}</span></span>
      </div>
    </div></div>`;
}
function diff(v){const x=n(v);return x===null?"—":(x<0?"▲"+fmt(Math.abs(x)):"+"+fmt(x));}
function fmCard(f){
  const m=f?.month||{}, t=f?.total||{};
  if(n(m.actual)===null&&n(t.actual)===null) return `<div class="card"><div class="ch"><span class="t">ＦＭ比率</span></div><div class="cb empty">記載なし</div></div>`;
  const rk=(m.rank||"").trim().charAt(0);
  return `<div class="card"><div class="ch"><span class="t">ＦＭ比率</span><span class="u">F ÷ MQ × 100</span></div>
    <div class="cb" style="display:flex;align-items:center;gap:18px">
      <div><div class="bignum">${fmt(n(m.actual))}<small>%</small></div>
      <div class="vsline"><span class="vs"><b>目標</b><span>${fmt(n(m.target))}%</span></span>
      <span class="vs"><b>累計</b><span>${fmt(n(t.actual))}%</span></span>
      <span class="vs"><b>累計評価</b><span>${esc((t.rank||"—").trim())}</span></span></div></div>
      <div class="rank rk-${esc(rk)}">${esc(rk||"—")}</div>
    </div></div>`;
}
function msrCard(a){
  const m=a.month||{}, p = normRate(m.rate) ?? rate(m.actual,m.target);
  return `<div class="card msr"><div class="ch"><span class="no">施策 ${esc(a.no||"")}</span><span class="u">当月</span></div>
    <div class="cb">
      <div class="name">${esc(a.name||"（未記入）")}</div>
      <div class="kpi">${esc(a.kpi||"")}</div>
      <div class="rate" style="color:${rateColor(p)}">${p===null?"—":Math.round(p)+"%"}</div>
      <div class="ratio">${fmt(n(m.actual))} / ${fmt(n(m.target))}</div>
      <div class="bar"><i style="width:${Math.min(100,p||0)}%;background:${rateColor(p)}"></i></div>
    </div></div>`;
}

/* --- 経営サマリー --- */
function viewAll(){
  const rows = state.depts.map(d=>({d, r:pick(d.key,state.date)})).filter(x=>x.r);
  if(!rows.length) return `<p class="empty">${state.date} の報告はまだありません。</p>`;
  const withRate = rows.map(x=>{
    const mq = rate(x.r.mq?.month?.actual, x.r.mq?.month?.target);
    const pm = x.r.plan?.month;
    const plan = normRate(pm?.rate) ?? rate(pm?.score, pm?.max);
    return {...x, mq, plan};
  }).sort((a,b)=> (b.plan??-1)-(a.plan??-1));

  const S=[];
  const active = state.depts.filter(d=> d.latest.date.slice(0,7) >= shiftM(state.date,-3)).length;
  S.push(`<div class="sec"><h2>${state.date.replace("-","年")}月 会議｜全部門一覧</h2><span class="note">提出 ${withRate.length} / 稼働 ${active} 部門・実行計画達成率順</span></div>`);
  S.push(`<div class="tablewrap"><table><thead><tr>
    <th>部門</th><th>会議日</th><th style="text-align:right">実行計画</th><th style="text-align:right">MQ 実績</th><th style="text-align:right">MQ 目標</th><th style="text-align:right">目標差</th><th style="text-align:right">MQ達成</th><th>FM評価</th><th style="text-align:right">総括</th><th style="text-align:right">期限あり</th>
  </tr></thead><tbody>`);
  withRate.forEach(x=>{
    const nPhase = (x.r.summary||[]).filter(s=>/(期日|期限|納期)\s*[：:]/.test(s.phase||"")).length;
    const rk=(x.r.fm?.month?.rank||"").trim().charAt(0);
    S.push(`<tr class="clk" data-k="${esc(x.d.key)}">
      <td><b>${esc(x.d.label)}</b></td>
      <td class="n" style="text-align:left">${esc(x.r.date)}</td>
      <td class="n"><span class="pill" style="background:${rateColor(x.plan)};color:#fff">${x.plan===null?"—":Math.round(x.plan)+"%"}</span></td>
      <td class="n">${fmt(n(x.r.mq?.month?.actual))}</td>
      <td class="n">${fmt(n(x.r.mq?.month?.target))}</td>
      <td class="n ${n(x.r.mq?.month?.diffTarget)<0?"neg":"pos"}">${diff(x.r.mq?.month?.diffTarget)}</td>
      <td class="n" style="color:${rateColor(x.mq)}">${x.mq===null?"—":Math.round(x.mq)+"%"}</td>
      <td><span class="rank rk-${esc(rk)}" style="font-size:13px;padding:1px 8px">${esc(rk||"—")}</span></td>
      <td class="n">${(x.r.summary||[]).length}</td>
      <td class="n">${nPhase}</td>
    </tr>`);
  });
  S.push(`</tbody></table></div>`);

  /* 期限が今月に集まっている実行フェーズ */
  const acts=[];
  withRate.forEach(x=>(x.r.summary||[]).forEach(s=>{
    const ph=parsePhase(s.phase);
    if(ph.due.length) acts.push({dept:x.d.label,key:x.d.key,sec:s.section,body:ph.body||s.fact,who:ph.who,due:ph.due});
  }));
  if(acts.length){
    S.push(`<div class="sec"><h2>実行フェーズ｜担当と期限</h2><span class="note">${acts.length} 件</span></div>`);
    S.push(`<div class="tablewrap"><table><thead><tr><th>部門</th><th>区分</th><th style="white-space:normal">やること</th><th>担当</th><th>期限</th></tr></thead><tbody>`);
    acts.forEach(a=>S.push(`<tr class="clk" data-k="${esc(a.key)}"><td>${esc(a.dept)}</td>
      <td style="color:var(--ink-3);font-size:11px">${esc((a.sec||"").slice(0,14))}</td>
      <td style="white-space:normal;max-width:520px">${esc(a.body.split("\n")[0])}</td>
      <td>${a.who.map(w=>`<span class="chip who">${esc(w)}</span>`).join(" ")||"—"}</td>
      <td>${a.due.map(w=>`<span class="chip ${dueClass(w)}">${esc(w)}</span>`).join(" ")}</td></tr>`));
    S.push(`</tbody></table></div>`);
  }
  return S.join("");
}

/* --- 推移（ヒートマップ＋折れ線） --- */
function viewTrend(){
  const months = state.months.slice(0,14).reverse();
  const S=[];
  S.push(`<div class="sec"><h2>実行計画 達成率｜部門 × 月</h2><span class="note">直近${months.length}回・空欄は未提出</span></div>`);
  S.push(`<div class="tablewrap"><table class="hm"><thead><tr><th style="text-align:left">部門</th>${months.map(m=>`<th>${+m.slice(5)}月</th>`).join("")}</tr></thead><tbody>`);
  state.depts.forEach(d=>{
    const cells = months.map(m=>{
      const r=pick(d.key,m); if(!r) return `<td class="c" style="background:#F1F3F7;color:var(--ink-3)">·</td>`;
      const pm=r.plan?.month, p=normRate(pm?.rate) ?? rate(pm?.score,pm?.max);
      if(p===null) return `<td class="c" style="background:#DDE2EA;color:var(--ink-3)">—</td>`;
      return `<td class="c" style="background:${rateColor(p)}">${Math.round(p)}</td>`;
    }).join("");
    S.push(`<tr class="clk" data-k="${esc(d.key)}"><td class="lab">${esc(d.label)}</td>${cells}</tr>`);
  });
  S.push(`</tbody></table></div>`);

  if(state.dept!=="__ALL__"){
    const d=state.depts.find(x=>x.key===state.dept);
    const series = months.map(m=>{const r=pick(state.dept,m);return {m, a:n(r?.mq?.month?.actual), t:n(r?.mq?.month?.target)};});
    if(series.some(s=>s.a!==null)){
      S.push(`<div class="sec"><h2>${esc(d.label)}｜MQ 実績と目標</h2><span class="note">当月値</span></div>`);
      S.push(`<div class="card"><div class="cb">${lineChart(series)}</div></div>`);
    }
  }else{
    S.push(`<p class="empty">左の部門を選ぶと、その部門のMQ推移グラフが出ます。</p>`);
  }
  return S.join("");
}
function lineChart(s){
  const W=1000,H=260,P={l:56,r:16,t:16,b:28};
  const max = Math.max(1,...s.flatMap(x=>[x.a??0,x.t??0]))*1.1;
  const x = i=> P.l + i*(W-P.l-P.r)/Math.max(1,s.length-1);
  const y = v=> H-P.b - (v/max)*(H-P.t-P.b);
  const path = key => s.map((d,i)=> d[key]===null?null:`${x(i)},${y(d[key])}`).filter(Boolean).join(" ");
  const grid=[0,.25,.5,.75,1].map(f=>`<line x1="${P.l}" x2="${W-P.r}" y1="${y(max*f)}" y2="${y(max*f)}" stroke="#E2E7EF"/><text x="${P.l-8}" y="${y(max*f)+4}" text-anchor="end" font-size="10" fill="#6B788B" font-family="Roboto Mono">${Math.round(max*f)}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="MQ推移">
    ${grid}
    <polyline points="${path("t")}" fill="none" stroke="#8FA4C4" stroke-width="2" stroke-dasharray="5 4"/>
    <polyline points="${path("a")}" fill="none" stroke="#23477E" stroke-width="2.5"/>
    ${s.map((d,i)=> d.a===null?"":`<circle cx="${x(i)}" cy="${y(d.a)}" r="3.5" fill="#23477E"/>`).join("")}
    ${s.map((d,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#6B788B" font-family="Roboto Mono">${+d.m.slice(5)}</text>`).join("")}
    <text x="${W-P.r}" y="${P.t}" text-anchor="end" font-size="11" fill="#23477E" font-family="Noto Sans JP">実線＝実績／破線＝目標</text>
  </svg>`;
}


/* --- 使い方（マニュアル） --- */
function viewManual(){
  const src = (state.manual && state.manual.length) ? state.manual : DEFAULT_MANUAL;
  const live = !!(state.manual && state.manual.length);
  const q = state.q.toLowerCase();
  const items = src.filter(m=> !q || ((m.chapter||"")+(m.title||"")+(m.body||"")).toLowerCase().includes(q));
  const S=[];
  S.push(`<div class="manhead">
    <div><h2 class="mantitle">部門長会議ボード 活用マニュアル</h2>
    <p class="mansub">${live
      ? `スプレッドシートの「マニュアル」シートを編集すると、この内容がそのまま更新されます。`
      : `現在は初期版を表示しています。GASエディタで <code>setupManual()</code> を1回実行すると「マニュアル」シートができ、以降はそこを編集すれば自動で反映されます。`}</p></div>
  </div>`);
  if(!items.length) return S.join("")+`<p class="empty">「${esc(state.q)}」に一致する項目はありません。</p>`;

  const chapters=[]; const byCh=new Map();
  items.forEach(m=>{const c=m.chapter||"その他"; if(!byCh.has(c)){byCh.set(c,[]);chapters.push(c);} byCh.get(c).push(m);});
  S.push(`<div class="chapnav">${chapters.map((c,i)=>`<a class="chapchip" href="#ch${i}">${esc(c)}</a>`).join("")}</div>`);
  chapters.forEach((c,i)=>{
    S.push(`<div class="sec" id="ch${i}"><h2>${esc(c)}</h2><span class="note">${byCh.get(c).length}項目</span></div>`);
    S.push(`<div class="mangrid">`);
    byCh.get(c).forEach(m=>{
      const aud=(m.audience||"").trim();
      S.push(`<div class="card mancard"><div class="cb">
        <div class="manrow"><h3>${highlight(m.title||"")}</h3>${aud?`<span class="aud">${esc(aud)}</span>`:""}</div>
        <div class="manbody">${manBody(m.body||"")}</div>
        ${m.updated?`<div class="manupd mono">更新 ${esc(m.updated)}</div>`:""}
      </div></div>`);
    });
    S.push(`</div>`);
  });
  return S.join("");
}
function manBody(t){
  return String(t).split("\n").map(l=>{
    l=l.trim(); if(!l) return "";
    if(/^[・･]/.test(l)) return `<div class="li">${highlight(l.replace(/^[・･]\s*/,""))}</div>`;
    return `<p>${highlight(l)}</p>`;
  }).join("");
}


/* ============================================================
   数値（経営計画資料）
   ============================================================ */
function suchiUrl(){
  const p = new URLSearchParams(location.search).get("suchi");
  return (p || SUCHI_API_URL || "").trim();
}
async function loadSuchi(force){
  const url = suchiUrl();
  if(!url){ state.suchi = {error:"NOURL"}; render(); return; }
  $("#content").innerHTML = '<div class="loading">経営計画資料を読み込み中…</div>';
  try{
    const res = await fetch(url + (url.includes("?")?"&":"?") + (force?"nocache=1&":"") + "t=" + Date.now());
    const j = await res.json();
    if(!j.sheets || !j.sheets.length) throw new Error(j.error || "データが0件でした");
    state.suchi = j; state.suchiSheet = 0; state.suchiMonth = null;
    $("#stamp").textContent = "取得 " + new Date().toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
  }catch(e){
    state.suchi = {error:e.message};
  }
  render();
}

/* 今期・実績の行 */
const CUR_K  = ["今期","実績"];
const BASE_K = ["前期","目標"];
const DIFF_K = ["増減","差"];
function lineOf(item, keys){
  return (item.lines||[]).find(l=> keys.some(k=> String(l.kubun).indexOf(k)>=0 ));
}
/* 実績が入っている最後の月 */
function latestMonth(sh){
  let last = -1;
  (sh.items||[]).forEach(it=>{
    const cur = lineOf(it, CUR_K); if(!cur) return;
    cur.v.forEach((pair,i)=>{ if(pair[0]!==null && pair[0]!=="") last = Math.max(last,i); });
  });
  return last<0 ? (sh.months||[]).length-1 : last;
}
function num(v){ return typeof v==="number" ? v : n(v); }
function cellTxt(v){
  if(v===null||v===undefined||v==="") return "—";
  if(typeof v==="number") return fmt(v,2);
  return esc(v);
}

function viewSuchi(){
  const d = state.suchi;
  if(!d) return `<div class="loading">読み込み中…</div>`;
  if(d.error) return suchiNoLink(d.error);

  const sheets = d.sheets;
  const sh = sheets[Math.min(state.suchiSheet, sheets.length-1)];
  const S = [];

  S.push(`<div class="chiprow" id="suchiChips">${sheets.map((x,i)=>
    `<button class="schip${i===state.suchiSheet?" on":""}" data-i="${i}">${esc(shortSheet(x.name))}</button>`
  ).join("")}</div>`);

  if(sh.type==="raw") return S.join("") + viewSuchiRaw(sh, d);

  const months = sh.months||[];
  if(state.suchiMonth===null || state.suchiMonth>=months.length) state.suchiMonth = latestMonth(sh);
  const mi = state.suchiMonth;
  const ti = state.suchiMode==="累計" && sh.hasTotal ? 1 : 0;

  S.push(`<div class="suchibar">
    <select class="sel" id="suchiMonthSel">${months.map((m,i)=>
      `<option value="${i}"${i===mi?" selected":""}>${esc(m)}</option>`).join("")}</select>
    ${sh.hasTotal ? `<div class="seg" id="suchiSeg">
      <button data-m="当月" class="${state.suchiMode==="当月"?"on":""}">当月</button>
      <button data-m="累計" class="${state.suchiMode==="累計"?"on":""}">累計</button>
    </div>` : ``}
    <span class="stale">原本：${esc(d.book||"")}　更新 ${esc(d.updated||"")}</span>
  </div>`);

  /* 主要科目カード */
  const q = state.q.toLowerCase();
  const items = (sh.items||[]).filter(it=> !q || String(it.item).toLowerCase().includes(q));
  const cards = items.slice(0,4).map(it=> suchiCard(it, mi, ti)).join("");
  if(cards){
    S.push(`<div class="sec"><h2>${esc(months[mi]||"")}｜${esc(sh.title||sh.name)}</h2><span class="note">${state.suchiMode}の値</span></div>`);
    S.push(`<div class="grid4">${cards}</div>`);
  }

  /* 全科目 × 月 */
  S.push(`<div class="sec"><h2>科目別 推移</h2><span class="note">${state.suchiMode}・${items.length}科目</span></div>`);
  if(!items.length){
    S.push(`<p class="empty">${state.q?`「${esc(state.q)}」に一致する科目はありません。`:"数値の記載がありません。"}</p>`);
  }else{
    S.push(`<div class="tablewrap"><table class="num"><thead><tr>
      <th style="text-align:left">科目</th><th>区分</th>
      ${months.map((m,i)=>`<th class="${i===mi?"cur":""}" style="text-align:right">${esc(m)}</th>`).join("")}
    </tr></thead><tbody>`);
    items.forEach((it,idx)=>{
      it.lines.forEach((l,li)=>{
        const isDiff = DIFF_K.some(k=> String(l.kubun).indexOf(k)>=0 );
        S.push(`<tr class="${li===0&&idx>0?"gap":""}">
          ${li===0
            ? `<td class="item" rowspan="${it.lines.length}">${highlight(it.item)}${it.amount!==null&&it.amount!==undefined?`<div class="kv" style="font-weight:400">年間 ${cellTxt(it.amount)}</div>`:""}</td>`
            : ``}
          <td class="kubun">${esc(l.kubun)}</td>
          ${l.v.map((pair,i)=>{
            const raw = pair[ti]!==undefined ? pair[ti] : null;
            const x = num(raw);
            const col = isDiff && x!==null ? (x<0?"var(--short)":x>0?"var(--achieve)":"") : "";
            return `<td class="k ${i===mi?"cur":""}" style="${col?`color:${col}`:""}">${cellTxt(raw)}</td>`;
          }).join("")}
        </tr>`);
      });
    });
    S.push(`</tbody></table></div>`);
  }

  if((sh.notes||[]).length){
    S.push(`<div class="sec"><h2>要因事項</h2><span class="note">原本の記載そのまま</span></div>`);
    S.push(`<div class="card"><div class="cb notecard">${highlight(sh.notes.join("\n"))}</div></div>`);
  }
  return S.join("");
}

function suchiCard(it, mi, ti){
  const cur  = lineOf(it, CUR_K);
  const base = lineOf(it, BASE_K);
  const dif  = lineOf(it, DIFF_K);
  const gv = (l)=> l && l.v[mi] ? num(l.v[mi][ti]!==undefined?l.v[mi][ti]:null) : null;
  const a = gv(cur), b = gv(base);
  let dv = gv(dif); if(dv===null && a!==null && b!==null) dv = a-b;
  const p = (a!==null && b!==null && b!==0) ? a/b*100 : null;
  return `<div class="card msr"><div class="ch"><span class="t">${esc(String(it.item).slice(0,18))}</span><span class="u">${esc(state.suchiMode)}</span></div>
    <div class="cb">
      <div class="bignum">${a===null?"—":fmt(a,2)}<small>/ ${b===null?"—":fmt(b,2)}</small></div>
      <div class="bar"><i style="width:${Math.min(100,p||0)}%;background:${rateColor(p)}"></i><span class="tick" style="left:100%"></span></div>
      <div class="vsline">
        <span class="vs"><b>${esc(base?base.kubun:"比較")}差</b><span class="${dv<0?"neg":"pos"}">${dv===null?"—":diff(dv)}</span></span>
        <span class="vs"><b>比率</b><span>${p===null?"—":Math.round(p)+"%"}</span></span>
      </div>
    </div></div>`;
}

function viewSuchiRaw(sh, d){
  const g = sh.grid||[];
  return `<div class="sec"><h2>${esc(sh.title||sh.name)}</h2><span class="note">決まった形の表ではないため、原本のまま表示しています</span></div>
    <div class="tablewrap"><table class="num"><tbody>${
      g.map(row=>`<tr>${row.map((c,i)=>`<td class="${typeof c==="number"?"k":""}" style="${i===0?"font-weight:600":""}">${cellTxt(c)}</td>`).join("")}</tr>`).join("")
    }</tbody></table></div>`;
}

function shortSheet(nm){
  return String(nm||"").replace(/原本/g,"").replace(/[（(]\s*[^）)]*\s*[）)]/g, m=> m.length>10?"":m).replace(/\s+/g," ").trim();
}

function suchiNoLink(msg){
  const why = msg==="NOURL"
    ? `<b>「数値」はまだ接続されていません。</b> 経営計画資料のスプレッドシートに <code>keikaku_suchi.gs</code> を入れてデプロイし、その <code>/exec</code> のURLを下に貼ってください。`
    : `<b>経営計画資料に接続できませんでした。</b>（${esc(msg)}）デプロイの「アクセスできるユーザー」設定と、URLが <code>/exec</code> で終わっているかを確認してください。`;
  return `<div class="banner">${why}
    <div class="connect">
      <input id="suchiIn" type="url" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(suchiUrl())}">
      <button id="suchiGo">接続する</button>
    </div>
    <div class="bnote">HTMLの <code>SUCHI_API_URL</code> に貼れば、全員の画面で毎回つながります。</div>
  </div>`;
}

function bindSuchi(c){
  const chips = c.querySelector("#suchiChips");
  if(chips) chips.querySelectorAll(".schip").forEach(b=> b.onclick = ()=>{
    state.suchiSheet = +b.dataset.i; state.suchiMonth = null; render(); window.scrollTo(0,0);
  });
  const ms = c.querySelector("#suchiMonthSel");
  if(ms) ms.onchange = e=>{ state.suchiMonth = +e.target.value; render(); };
  const seg = c.querySelector("#suchiSeg");
  if(seg) seg.querySelectorAll("button").forEach(b=> b.onclick = ()=>{ state.suchiMode = b.dataset.m; render(); });
  const go = c.querySelector("#suchiGo");
  if(go) go.onclick = ()=>{
    const u = (c.querySelector("#suchiIn").value||"").trim();
    if(!u) return;
    const p = new URLSearchParams(location.search); p.set("suchi", u);
    location.search = "?" + p.toString();
  };
}

/* ---------- 操作 ---------- */
$("#monthSel").onchange = e=>{state.date=e.target.value; renderRail(); render();};
$("#reload").onclick = ()=>{ if(state.view==="suchi") loadSuchi(true); else load(true); };
$("#menuBtn").onclick = ()=>$("#rail").classList.toggle("open");
let t; $("#q").oninput = e=>{clearTimeout(t); t=setTimeout(()=>{state.q=e.target.value.trim(); render();},220);};
function syncTabs(){document.querySelectorAll("#viewTabs .tab").forEach(b=>b.classList.toggle("on", b.dataset.view===state.view));
  $("#q").placeholder = state.view==="manual" ? "マニュアルを検索"
                      : state.view==="suchi"  ? "科目を検索"
                      : "総括を全文検索";
  $("#monthSel").classList.toggle("hide", state.view==="suchi");}
document.querySelectorAll("#viewTabs .tab").forEach(b=>b.onclick=()=>{
  state.view=b.dataset.view; syncTabs();
  if(state.view==="suchi" && !state.suchi) loadSuchi(); else render();
});

load();
</script>
</body>
</html>
