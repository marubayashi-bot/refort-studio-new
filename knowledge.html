<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ナレッジ｜EARTHCOM</title>
<style>
:root{
  --navy:#0d2340;--navy2:#163a5f;--navy3:#1f4e7a;
  --gold:#c8a24a;--gold2:#e3c878;--gold-soft:#f3ead0;
  --ink:#15202e;--muted:#6a7787;--line:#e1e8f0;--line2:#cdd8e4;
  --bg:#eef1f5;--surface:#fff;--surface2:#f5f8fb;
  --pos:#1f8a55;--neg:#c0392b;--warn:#b8791d;
  --r:11px;--shadow:0 1px 3px rgba(13,35,64,.08),0 4px 16px rgba(13,35,64,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:1px solid transparent;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
a{color:var(--navy3)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- header ---------- */
header{background:var(--navy);border-bottom:2px solid var(--gold);color:#fff;position:sticky;top:0;z-index:30}
.hbar{max-width:1080px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;font-size:15px;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--gold)}
.hbar .sp{flex:1}
.hbtn{border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:700;color:#fff}
.hbtn:hover{background:rgba(255,255,255,.1)}
.hbtn.pri{background:var(--gold);border-color:var(--gold);color:#0d2340}
.hbtn.pri:hover{background:var(--gold2)}

/* ---------- search hero ---------- */
.hero{background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%);padding:0 16px 22px}
.hero-in{max-width:1080px;margin:0 auto}
.searchwrap{position:relative}
.searchwrap .ic{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;opacity:.5}
#q{width:100%;padding:15px 16px 15px 46px;border-radius:12px;border:2px solid transparent;
  font-size:16px;background:#fff;box-shadow:0 6px 22px rgba(0,0,0,.22)}
#q:focus{outline:none;border-color:var(--gold)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.chip{border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:5px 13px;font-size:12.5px;
  color:#dce6f2;font-weight:600;transition:background .12s}
.chip:hover{background:rgba(255,255,255,.12)}
.chip.on{background:var(--gold);border-color:var(--gold);color:#0d2340}
.hint{color:#9fb3c9;font-size:11.5px;margin-top:9px}

/* ---------- list ---------- */
main{max-width:1080px;margin:0 auto;padding:18px 16px 60px}
.meta-line{display:flex;align-items:center;gap:10px;margin-bottom:11px;flex-wrap:wrap}
.count{font-size:12px;color:var(--muted);font-weight:600}
.seg{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:#fff}
.seg button{padding:5px 11px;font-size:12px;font-weight:600;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--navy);color:#fff}

.cards{display:grid;gap:11px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;
  border-left:4px solid var(--line2);cursor:pointer;transition:box-shadow .13s,transform .13s}
.card:hover{box-shadow:0 3px 8px rgba(13,35,64,.12),0 10px 26px rgba(13,35,64,.1)}
.card.c-term{border-left-color:var(--navy3)}
.card.c-qa{border-left-color:var(--gold)}
.card.c-know{border-left-color:var(--pos)}
.card h3{font-size:15.5px;font-weight:800;color:var(--navy);line-height:1.4}
.card .snip{font-size:12.8px;color:#46586c;margin-top:5px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .foot{display:flex;align-items:center;gap:7px;margin-top:9px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.tag{background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:2px 7px;font-size:11px;color:#46586c}
.badge{border-radius:5px;padding:2px 8px;font-size:10.5px;font-weight:800;letter-spacing:.02em}
.b-ok{background:#e6f4ec;color:var(--pos);border:1px solid #b9e0cb}
.b-draft{background:#f1f4f8;color:var(--muted);border:1px solid var(--line2)}
.b-re{background:#fdf3e2;color:var(--warn);border:1px solid #f0dcb4}
.b-cat{background:var(--navy);color:#fff}
.attach{font-size:11px;color:var(--muted)}

.empty{background:#fff;border-radius:var(--r);padding:40px 22px;text-align:center;box-shadow:var(--shadow)}
.empty h3{font-size:15px;color:var(--navy);margin-bottom:6px}
.empty p{font-size:13px;color:var(--muted);margin-bottom:16px}

/* ---------- modal ---------- */
.ov{display:none;position:fixed;inset:0;z-index:100;background:rgba(13,35,64,.55);overflow:auto;padding:20px 12px}
.ov.show{display:block}
.modal{max-width:760px;margin:0 auto;background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.mhead{background:var(--navy);color:#fff;padding:13px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:2}
.mhead .t{font-weight:800;font-size:14px;flex:1}
.mbody{padding:18px}
.mfoot{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:9px;flex-wrap:wrap;background:var(--surface2)}
.mfoot .sp{flex:1}

.fld{margin-bottom:13px}
.fld label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:4px;letter-spacing:.03em}
.fld input[type=text],.fld textarea,.fld select{width:100%;padding:9px 11px;border:1px solid var(--line2);
  border-radius:8px;background:#fff}
.fld textarea{min-height:150px;resize:vertical;line-height:1.7}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--navy3);box-shadow:0 0 0 3px rgba(31,78,122,.1)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.sub-h{font-size:11.5px;font-weight:800;color:var(--navy);letter-spacing:.05em;
  border-bottom:1px solid var(--line);padding-bottom:5px;margin:18px 0 10px}
.mini{border:1px solid var(--line2);border-radius:7px;padding:5px 11px;font-size:12px;font-weight:700;color:var(--navy);background:#fff}
.mini:hover{background:var(--surface2)}
.mini.del{color:var(--neg);border-color:#eec9c4}
.btn{border-radius:8px;padding:9px 16px;font-size:13px;font-weight:700}
.btn.pri{background:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy2)}
.btn.gold{background:var(--gold);color:#0d2340}
.btn.gold:hover{background:var(--gold2)}
.btn.gh{border:1px solid var(--line2);color:var(--muted);background:#fff}
.btn.gh:hover{background:var(--surface2)}
.btn.danger{color:var(--neg);border:1px solid #eec9c4;background:#fff}

.itemrow{display:flex;gap:7px;margin-bottom:7px;align-items:center}
.itemrow input{flex:1;padding:8px 10px;border:1px solid var(--line2);border-radius:7px}
.itemrow input.lab{flex:0 0 32%}
.thumbs{display:flex;gap:9px;flex-wrap:wrap;margin-top:9px}
.thumb{position:relative;width:104px;height:78px;border-radius:8px;overflow:hidden;border:1px solid var(--line2);background:var(--surface2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:3px;right:3px;background:rgba(13,35,64,.8);color:#fff;border-radius:5px;
  width:20px;height:20px;font-size:12px;line-height:1;display:grid;place-items:center}
.drop{border:2px dashed var(--line2);border-radius:9px;padding:16px;text-align:center;font-size:12px;color:var(--muted);background:var(--surface2)}
.drop.over{border-color:var(--gold);background:var(--gold-soft)}

/* ---------- detail ---------- */
.d-title{font-size:20px;font-weight:800;color:var(--navy);line-height:1.35;margin-bottom:8px}
.d-meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:15px}
.d-body{font-size:14px;line-height:1.85;white-space:pre-wrap;word-break:break-word}
.d-sec{font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.05em;margin:20px 0 9px}
.d-imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.d-imgs a{display:block;border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:var(--surface2)}
.d-imgs img{width:100%;display:block}
.linklist{display:grid;gap:6px}
.linklist a{display:flex;gap:8px;align-items:center;padding:9px 12px;background:var(--surface2);
  border:1px solid var(--line);border-radius:8px;font-size:13px;text-decoration:none;font-weight:600}
.linklist a:hover{background:var(--gold-soft);border-color:var(--gold)}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(70px);background:var(--navy);
  color:#fff;padding:10px 20px;border-radius:9px;font-size:13px;font-weight:600;opacity:0;transition:.22s;z-index:300;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sql{background:#0d2340;color:#cfe0f0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;
  padding:12px;border-radius:8px;white-space:pre-wrap;word-break:break-all;line-height:1.6}
.note{font-size:11.5px;color:var(--muted);line-height:1.7}
@media(max-width:640px){
  .row2{grid-template-columns:1fr}
  .hbar{padding:9px 12px;gap:8px}
  .brand{font-size:13.5px}
  main{padding:14px 12px 50px}
  .d-title{font-size:17px}
}
</style>
</head>
<body>

<header>
  <div class="hbar">
    <div class="brand"><span class="dot"></span>EARTHCOM ナレッジ</div>
    <div class="sp"></div>
    <span id="userBadge"></span>
    <button class="hbtn" id="btnSetup">設定</button>
    <button class="hbtn pri" id="btnNew">＋ 新規</button>
  </div>
</header>

<div class="hero"><div class="hero-in">
  <div class="searchwrap">
    <span class="ic">🔍</span>
    <input id="q" type="text" placeholder="用語・質問・キーワードで検索（例：一次調整力、出力制御、償却）" autocomplete="off">
  </div>
  <div class="chips" id="catChips"></div>
  <div class="chips" id="bizChips"></div>
  <div class="hint" id="hint">全件表示中</div>
</div></div>

<main>
  <div class="meta-line">
    <span class="count" id="count"></span>
    <div class="sp" style="flex:1"></div>
    <div class="seg" id="statusSeg">
      <button data-st="all" class="on">すべて</button>
      <button data-st="approved">公式のみ</button>
      <button data-st="pending">要確認</button>
    </div>
  </div>
  <div class="cards" id="cards"></div>
</main>

<!-- 詳細 -->
<div class="ov" id="ovView"><div class="modal">
  <div class="mhead"><span class="t" id="vHead">ナレッジ</span>
    <button class="hbtn" id="vClose">閉じる</button></div>
  <div class="mbody" id="vBody"></div>
  <div class="mfoot">
    <button class="btn gh" id="vCopy">本文をコピー</button>
    <div class="sp"></div>
    <button class="btn gold" id="vApprove">公式として承認</button>
    <button class="btn pri" id="vEdit">編集する</button>
  </div>
</div></div>

<!-- 編集 -->
<div class="ov" id="ovEdit"><div class="modal">
  <div class="mhead"><span class="t" id="eHead">ナレッジを追加</span>
    <button class="hbtn" id="eClose">閉じる</button></div>
  <div class="mbody">
    <div class="row2">
      <div class="fld"><label>種別</label><select id="eCat">
        <option value="term">用語</option><option value="qa">QA</option><option value="know">ナレッジ</option>
      </select></div>
      <div class="fld"><label>事業</label><select id="eBiz"></select></div>
    </div>
    <div class="fld"><label id="eTitleLab">タイトル</label>
      <input id="eTitle" type="text" placeholder="例：一次調整力市場（FCR）"></div>
    <div class="fld"><label id="eBodyLab">本文</label>
      <textarea id="eBody" placeholder="そのままお客様に説明できる言葉で書いてください。"></textarea></div>
    <div class="fld"><label>タグ（カンマ区切り）</label>
      <input id="eTags" type="text" placeholder="例：市場, 収益, 投資家説明"></div>

    <div class="sub-h">関連リンク（スライド・スプレッドシート・社内資料）</div>
    <div id="eLinks"></div>
    <button class="mini" id="eAddLink">＋ リンクを追加</button>

    <div class="sub-h">画像</div>
    <div class="drop" id="eDrop">画像をここにドロップ／クリックして選択<br>
      <span class="note">Supabase Storage にアップロードします</span></div>
    <div class="itemrow" style="margin-top:9px">
      <input id="eImgUrl" type="text" placeholder="画像URLを貼り付ける場合はこちら">
      <button class="mini" id="eAddImg">追加</button>
    </div>
    <div class="thumbs" id="eThumbs"></div>
  </div>
  <div class="mfoot">
    <button class="btn danger" id="eDel">削除</button>
    <div class="sp"></div>
    <button class="btn gh" id="eCancel">やめる</button>
    <button class="btn pri" id="eSave">保存する</button>
  </div>
</div></div>

<!-- 設定 -->
<div class="ov" id="ovSetup"><div class="modal">
  <div class="mhead"><span class="t">設定</span><button class="hbtn" id="sClose">閉じる</button></div>
  <div class="mbody">
    <div class="fld"><label>接続状態</label><div id="sStat" class="note"></div></div>
    <div class="sub-h">初回のみ：Supabase で実行してください</div>
    <div class="sql" id="sqlBox"></div>
    <p class="note" style="margin-top:10px">画像アップロードを使う場合は、Storage で <b>knowledge</b> という公開バケットを作成してください。作成しない場合でも、画像URLの貼り付けは使えます。</p>
    <div class="sub-h">はじめのデータ</div>
    <p class="note">蓄電池提案で使う市場用語3件（スポット市場／一次調整力市場／容量市場）を登録します。すでにある場合は追加されません。</p>
    <button class="btn gold" id="sSeed" style="margin-top:10px">市場用語3件を登録する</button>
  </div>
  <div class="mfoot"><div class="sp"></div><button class="btn pri" id="sDone">閉じる</button></div>
</div></div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./ec-auth.js"></script>
<script>
'use strict';
(function(){
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const LS='ec_knowledge_cache_v1';
const CATS=[['all','すべて'],['term','用語'],['qa','QA'],['know','ナレッジ']];
const BIZ=['共通','蓄電池','ReFort','セカンダリー','太陽光','採用・組織'];
const CAT_LABEL={term:'用語',qa:'QA',know:'ナレッジ'};
const CAT_CLASS={term:'c-term',qa:'c-qa',know:'c-know'};
const SQL="create table if not exists knowledge (\n"+
  "  id text primary key,\n  category text,\n  biz text,\n  title text,\n  body text,\n  tags text,\n"+
  "  links jsonb default '[]'::jsonb,\n  images jsonb default '[]'::jsonb,\n"+
  "  status text default 'draft',\n  author text,\n  approved_by text,\n"+
  "  updated_at timestamptz default now()\n);\n"+
  "alter table knowledge enable row level security;\n"+
  "create policy \"knowledge rw\" on knowledge for all\n  to authenticated using (true) with check (true);";

let sb=null, ME=null, DATA=[], EDIT=null;
let F={q:'',cat:'all',biz:'all',status:'all'};

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2000);}
function uid(){return 'k'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function canEdit(){return ME && ['admin','manager','sales','field'].indexOf(ME.role)>=0;}
function canApprove(){return ME && ['admin','manager'].indexOf(ME.role)>=0;}
function fmtDate(v){if(!v)return '';const d=new Date(v);return isNaN(d)?'':d.toLocaleDateString('ja-JP');}

/* ---------- storage ---------- */
function cacheRead(){try{return JSON.parse(localStorage.getItem(LS))||[];}catch(e){return [];}}
function cacheWrite(){try{localStorage.setItem(LS,JSON.stringify(DATA));}catch(e){}}

async function loadAll(){
  if(sb){
    const r=await sb.from('knowledge').select('*').order('updated_at',{ascending:false});
    if(r.error){toast('読み込みに失敗しました。設定を確認してください');DATA=cacheRead();}
    else{DATA=r.data||[];cacheWrite();}
  }else{DATA=cacheRead();}
  render();
}
async function saveOne(rec){
  DATA=[rec].concat(DATA.filter(x=>x.id!==rec.id));
  cacheWrite();
  if(sb){const r=await sb.from('knowledge').upsert(rec);
    if(r.error){toast('保存できませんでした：'+r.error.message);return false;}}
  return true;
}
async function delOne(id){
  DATA=DATA.filter(x=>x.id!==id); cacheWrite();
  if(sb){const r=await sb.from('knowledge').delete().eq('id',id);
    if(r.error){toast('削除できませんでした：'+r.error.message);return false;}}
  return true;
}

/* ---------- filters ---------- */
function buildChips(){
  $('#catChips').innerHTML=CATS.map(c=>
    `<button class="chip${F.cat===c[0]?' on':''}" data-cat="${c[0]}">${c[1]}</button>`).join('');
  $('#bizChips').innerHTML=`<button class="chip${F.biz==='all'?' on':''}" data-biz="all">事業すべて</button>`+
    BIZ.map(b=>`<button class="chip${F.biz===b?' on':''}" data-biz="${esc(b)}">${esc(b)}</button>`).join('');
  $$('[data-cat]').forEach(b=>b.onclick=()=>{F.cat=b.dataset.cat;buildChips();render();});
  $$('[data-biz]').forEach(b=>b.onclick=()=>{F.biz=b.dataset.biz;buildChips();render();});
}
function matches(x){
  if(F.cat!=='all'&&x.category!==F.cat)return false;
  if(F.biz!=='all'&&x.biz!==F.biz)return false;
  if(F.status==='approved'&&x.status!=='approved')return false;
  if(F.status==='pending'&&x.status==='approved')return false;
  const q=F.q.trim().toLowerCase();
  if(!q)return true;
  const hay=[x.title,x.body,x.tags,x.biz].join(' ').toLowerCase();
  return q.split(/\s+/).every(w=>hay.indexOf(w)>=0);
}
function statusBadge(x){
  if(x.status==='approved')return '<span class="badge b-ok">公式</span>';
  if(x.status==='review')return '<span class="badge b-re">要再確認</span>';
  return '<span class="badge b-draft">下書き</span>';
}

/* ---------- render ---------- */
function render(){
  const list=DATA.filter(matches);
  $('#count').textContent=list.length+' 件';
  $('#hint').textContent=F.q?('「'+F.q+'」の検索結果'):(DATA.length?'全'+DATA.length+'件から検索できます':'まだ登録がありません');
  if(!list.length){
    $('#cards').innerHTML=`<div class="empty"><h3>${DATA.length?'該当するものがありません':'ナレッジがまだありません'}</h3>
      <p>${DATA.length?'キーワードや絞り込みを変えてみてください。':'よく聞かれる用語やQAを1件登録してみてください。'}</p>
      <button class="btn gold" id="emptyNew">＋ 追加する</button></div>`;
    const b=$('#emptyNew'); if(b)b.onclick=()=>openEdit(null);
    return;
  }
  $('#cards').innerHTML=list.map(x=>{
    const imgs=(x.images||[]).length, lks=(x.links||[]).length;
    const at=[]; if(imgs)at.push('画像'+imgs); if(lks)at.push('リンク'+lks);
    const tags=(x.tags||'').split(',').map(s=>s.trim()).filter(Boolean).slice(0,3);
    return `<div class="card ${CAT_CLASS[x.category]||''}" data-id="${esc(x.id)}">
      <h3>${esc(x.title||'（無題）')}</h3>
      <div class="snip">${esc((x.body||'').replace(/\s+/g,' ').slice(0,110))}</div>
      <div class="foot">
        <span class="badge b-cat">${CAT_LABEL[x.category]||''}</span>
        ${statusBadge(x)}
        <span class="tag">${esc(x.biz||'共通')}</span>
        ${tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')}
        ${at.length?'<span class="attach">'+at.join('・')+'</span>':''}
        <span style="flex:1"></span>
        <span>${esc(x.author||'')} ${fmtDate(x.updated_at)}</span>
      </div></div>`;
  }).join('');
  $$('#cards .card').forEach(c=>c.onclick=()=>openView(c.dataset.id));
}

/* ---------- detail ---------- */
let VIEW=null;
function openView(id){
  const x=DATA.find(v=>v.id===id); if(!x)return;
  VIEW=x;
  $('#vHead').textContent=CAT_LABEL[x.category]||'ナレッジ';
  const imgs=(x.images||[]), lks=(x.links||[]);
  const tags=(x.tags||'').split(',').map(s=>s.trim()).filter(Boolean);
  $('#vBody').innerHTML=
    `<div class="d-title">${esc(x.title||'')}</div>
     <div class="d-meta">${statusBadge(x)}<span class="tag">${esc(x.biz||'共通')}</span>
       ${tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')}
       <span style="flex:1"></span>
       <span class="attach">${esc(x.author||'')}　更新 ${fmtDate(x.updated_at)}</span></div>
     <div class="d-body">${esc(x.body||'')}</div>
     ${imgs.length?'<div class="d-sec">画像</div><div class="d-imgs">'+
        imgs.map(u=>'<a href="'+esc(u)+'" target="_blank" rel="noopener"><img src="'+esc(u)+'" alt=""></a>').join('')+'</div>':''}
     ${lks.length?'<div class="d-sec">関連リンク</div><div class="linklist">'+
        lks.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">🔗 '+esc(l.label||l.url)+'</a>').join('')+'</div>':''}`;
  $('#vApprove').style.display=(canApprove()&&x.status!=='approved')?'':'none';
  $('#vEdit').style.display=canEdit()?'':'none';
  $('#ovView').classList.add('show');
}
$('#vClose').onclick=$('#ovView').onclick=e=>{if(e.target===$('#ovView')||e.currentTarget===$('#vClose'))$('#ovView').classList.remove('show');};
$('#vCopy').onclick=async()=>{
  if(!VIEW)return;
  const t=(VIEW.title||'')+'\n\n'+(VIEW.body||'');
  try{await navigator.clipboard.writeText(t);toast('本文をコピーしました');}
  catch(e){toast('コピーできませんでした');}
};
$('#vApprove').onclick=async()=>{
  if(!VIEW)return;
  VIEW.status='approved'; VIEW.approved_by=ME?ME.full_name||ME.email:''; VIEW.updated_at=new Date().toISOString();
  if(await saveOne(VIEW)){toast('公式として承認しました');render();openView(VIEW.id);}
};
$('#vEdit').onclick=()=>{$('#ovView').classList.remove('show');openEdit(VIEW.id);};

/* ---------- editor ---------- */
function blank(){return {id:uid(),category:'term',biz:'共通',title:'',body:'',tags:'',
  links:[],images:[],status:'draft',author:ME?(ME.full_name||ME.email):'',approved_by:'',updated_at:new Date().toISOString()};}

function openEdit(id){
  EDIT=id?JSON.parse(JSON.stringify(DATA.find(x=>x.id===id))):blank();
  if(!EDIT)return;
  $('#eHead').textContent=id?'ナレッジを編集':'ナレッジを追加';
  $('#eBiz').innerHTML=BIZ.map(b=>`<option${EDIT.biz===b?' selected':''}>${esc(b)}</option>`).join('');
  $('#eCat').value=EDIT.category||'term';
  $('#eTitle').value=EDIT.title||'';
  $('#eBody').value=EDIT.body||'';
  $('#eTags').value=EDIT.tags||'';
  $('#eDel').style.display=id?'':'none';
  catLabels(); drawLinks(); drawThumbs();
  $('#ovEdit').classList.add('show');
  setTimeout(()=>$('#eTitle').focus(),50);
}
function catLabels(){
  const c=$('#eCat').value;
  $('#eTitleLab').textContent = c==='qa'?'質問':(c==='term'?'用語':'タイトル');
  $('#eBodyLab').textContent  = c==='qa'?'回答':'説明';
  $('#eTitle').placeholder = c==='qa'?'例：FIT終了後はどうなりますか？':'例：一次調整力市場（FCR）';
}
$('#eCat').onchange=()=>{catLabels();};

function drawLinks(){
  $('#eLinks').innerHTML=(EDIT.links||[]).map((l,i)=>
    `<div class="itemrow"><input class="lab" data-li="${i}" data-k="label" type="text" value="${esc(l.label||'')}" placeholder="表示名">
     <input data-li="${i}" data-k="url" type="text" value="${esc(l.url||'')}" placeholder="https://…">
     <button class="mini del" data-lrm="${i}">削除</button></div>`).join('');
  $$('[data-li]').forEach(i=>i.oninput=e=>{EDIT.links[+i.dataset.li][i.dataset.k]=e.target.value;});
  $$('[data-lrm]').forEach(b=>b.onclick=()=>{EDIT.links.splice(+b.dataset.lrm,1);drawLinks();});
}
$('#eAddLink').onclick=()=>{EDIT.links=EDIT.links||[];EDIT.links.push({label:'',url:''});drawLinks();};

function drawThumbs(){
  $('#eThumbs').innerHTML=(EDIT.images||[]).map((u,i)=>
    `<div class="thumb"><img src="${esc(u)}" alt=""><button data-irm="${i}">×</button></div>`).join('');
  $$('[data-irm]').forEach(b=>b.onclick=()=>{EDIT.images.splice(+b.dataset.irm,1);drawThumbs();});
}
$('#eAddImg').onclick=()=>{
  const u=$('#eImgUrl').value.trim();
  if(!/^https?:\/\//.test(u)){toast('URLは https:// から始めてください');return;}
  EDIT.images=EDIT.images||[];EDIT.images.push(u);$('#eImgUrl').value='';drawThumbs();
};

/* 画像アップロード */
const drop=$('#eDrop');
const picker=document.createElement('input');
picker.type='file';picker.accept='image/*';picker.multiple=true;
picker.onchange=()=>{upload([...picker.files]);picker.value='';};
drop.onclick=()=>picker.click();
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop',e=>{if(e.dataTransfer&&e.dataTransfer.files)upload([...e.dataTransfer.files]);});

async function upload(files){
  files=files.filter(f=>/^image\//.test(f.type));
  if(!files.length)return;
  if(!sb){toast('画像アップロードにはSupabase接続が必要です。URL貼り付けをお使いください');return;}
  toast('アップロード中…');
  for(const f of files){
    const ext=(f.name.split('.').pop()||'png').toLowerCase();
    const path=(EDIT.id||'tmp')+'/'+Date.now()+'_'+Math.random().toString(36).slice(2,7)+'.'+ext;
    const up=await sb.storage.from('knowledge').upload(path,f,{upsert:false,contentType:f.type});
    if(up.error){toast('アップロードできませんでした：'+up.error.message);return;}
    const pub=sb.storage.from('knowledge').getPublicUrl(path);
    EDIT.images=EDIT.images||[];EDIT.images.push(pub.data.publicUrl);
  }
  drawThumbs();toast('画像を追加しました');
}

$('#eSave').onclick=async()=>{
  EDIT.category=$('#eCat').value;
  EDIT.biz=$('#eBiz').value;
  EDIT.title=$('#eTitle').value.trim();
  EDIT.body=$('#eBody').value.trim();
  EDIT.tags=$('#eTags').value.trim();
  if(!EDIT.title){toast('タイトルを入れてください');$('#eTitle').focus();return;}
  EDIT.links=(EDIT.links||[]).filter(l=>l.url&&l.url.trim());
  EDIT.author=ME?(ME.full_name||ME.email):'';
  EDIT.updated_at=new Date().toISOString();
  /* 公式記事を承認権限のない人が直した場合は「要再確認」に戻す */
  if(EDIT.status==='approved'&&!canApprove())EDIT.status='review';
  if(await saveOne(EDIT)){$('#ovEdit').classList.remove('show');render();
    toast(EDIT.status==='review'?'保存しました（幹部の再確認待ちになります）':'保存しました');}
};
$('#eDel').onclick=async()=>{
  if(!EDIT||!EDIT.id)return;
  const own=EDIT.author===(ME?(ME.full_name||ME.email):'');
  if(!canApprove()&&!own){toast('自分が作ったもの以外は削除できません');return;}
  if(!confirm('この項目を削除します。よろしいですか？'))return;
  if(await delOne(EDIT.id)){$('#ovEdit').classList.remove('show');render();toast('削除しました');}
};
$('#eCancel').onclick=$('#eClose').onclick=()=>$('#ovEdit').classList.remove('show');
$('#btnNew').onclick=()=>{ if(!canEdit()){toast('編集の権限がありません');return;} openEdit(null); };

$('#sSeed').onclick=async()=>{
  let n=0;
  for(const s of SEED){
    if(DATA.some(x=>x.title===s.title))continue;
    const rec=Object.assign(blank(),s,{status:'approved',approved_by:ME?(ME.full_name||ME.email):''});
    if(await saveOne(rec))n++;
  }
  render();toast(n?n+'件を登録しました':'すでに登録済みです');
};
