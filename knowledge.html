*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:120px}
body{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
  background:var(--bg) var(--bgimg) center top/100% auto no-repeat;min-height:100vh;color:var(--ink);font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:1px solid transparent;background:none;color:inherit;font-size:inherit}
button:disabled{opacity:.5;cursor:default}
.daily .opts button:disabled,.qbox .opts button:disabled{opacity:1}
#iUse{max-width:210px}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
a{color:var(--navy3)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* header */
header{background:transparent;color:#fff;position:sticky;top:0;z-index:40;transition:background .2s,box-shadow .2s}
header.solid{background:rgba(13,35,64,.96);box-shadow:0 2px 0 var(--gold);backdrop-filter:blur(6px)}
.brand img{width:30px;height:30px;border-radius:8px;align-self:center;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.hbar{max-width:1180px;margin:0 auto;padding:10px 16px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;text-shadow:0 1px 6px rgba(0,0,0,.35);font-weight:900;font-size:15.5px;letter-spacing:.03em}
.brand small{font-weight:500;font-size:11.5px;color:#a9bbcf;letter-spacing:.02em}
.hbar .sp{flex:1}
.hbtn{border:1px solid rgba(255,255,255,.28);border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:700;color:#fff}
.hbtn:hover{background:rgba(255,255,255,.1)}
.hbtn.pri{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.hbtn.pri:hover{background:var(--gold2)}
nav.tabs{max-width:1180px;margin:0 auto;padding:6px 10px 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{padding:9px 14px 10px;font-size:13px;font-weight:700;color:#b9c8d9;border-radius:8px 8px 0 0;white-space:nowrap;position:relative}
nav.tabs button:hover{color:#fff;background:rgba(255,255,255,.06)}
nav.tabs button.on{color:var(--navy);background:rgba(244,247,252,.97)}
nav.tabs button{text-shadow:0 1px 4px rgba(0,0,0,.3)}nav.tabs button.on{text-shadow:none}
nav.tabs .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;font-size:10.5px;
  background:var(--neg);color:#fff;line-height:17px;text-align:center}

main{max-width:1180px;margin:0 auto;padding:20px 16px 70px}
.pagehero{max-width:1180px;margin:0 auto;padding:18px 16px 0;min-height:clamp(96px,calc(21vw - 96px),330px);color:#fff;
  display:flex;flex-direction:column;justify-content:center}
.pagehero h1{font-size:clamp(22px,2.4vw,30px);font-weight:900;letter-spacing:.04em;text-shadow:0 2px 12px rgba(0,0,0,.45)}
.pagehero p{font-size:13px;color:#d6e2f0;margin-top:4px;max-width:640px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.pagehero+main{padding-top:6px}
h2.sec{display:none}
.view{display:none}.view.on{display:block}
.banner{background:var(--warn-soft);border:1px solid #efd7ad;color:#6c4a10;border-radius:9px;padding:10px 14px;font-size:12.5px;margin-bottom:14px;display:none}
.banner.show{display:block}
.banner button{text-decoration:underline;font-weight:700;color:#6c4a10}

/* common parts */
h2.sec{font-size:17px;font-weight:900;color:var(--navy);margin:0 0 4px}
main{position:relative}
p.lead{font-size:12.5px;color:#46586c;margin-bottom:14px;background:rgba(255,255,255,.9);padding:7px 12px;border-radius:8px;box-shadow:var(--shadow)}
.panel{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px}
.panel h3{font-size:13.5px;font-weight:800;color:var(--navy);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.panel h3 .sp{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stack{display:grid;gap:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .sp{flex:1}
.inp{padding:8px 11px;border:1px solid var(--line2);border-radius:8px;background:#fff}
.inp:focus{outline:none;border-color:var(--navy3);box-shadow:0 0 0 3px rgba(31,78,122,.1)}
.btn{border-radius:8px;padding:8px 15px;font-size:13px;font-weight:700;white-space:nowrap}
.btn.pri{background:var(--navy);color:#fff}.btn.pri:hover{background:var(--navy2)}
.btn.gold{background:var(--gold);color:var(--navy)}.btn.gold:hover{background:var(--gold2)}
.btn.gh{border:1px solid var(--line2);color:var(--navy);background:#fff}.btn.gh:hover{background:var(--surface2)}
.btn.danger{color:var(--neg);border:1px solid #eec9c4;background:#fff}
.btn.sm{padding:5px 10px;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:#fff}
.seg button{padding:6px 11px;font-size:12px;font-weight:700;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--navy);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;color:var(--navy);background:#fff}
.chip:hover{background:var(--surface2)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tag{display:inline-block;background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:1px 7px;font-size:11px;color:#46586c}
.badge{display:inline-block;border-radius:5px;padding:1px 7px;font-size:10.5px;font-weight:800;line-height:18px}
.b-ok{background:var(--pos-soft);color:var(--pos)}
.b-draft{background:#eef2f6;color:var(--muted)}
.b-re{background:var(--warn-soft);color:var(--warn)}
.b-old{background:var(--neg-soft);color:var(--neg)}
.b-kind{background:var(--navy);color:#fff}
.b-ai{background:#eef0fb;color:#4a4f9a}
.b-chance{background:var(--pos-soft);color:var(--pos)}
.b-risk{background:var(--neg-soft);color:var(--neg)}
.b-both{background:var(--warn-soft);color:var(--warn)}
.star{color:var(--gold);font-weight:900}
.muted{color:var(--muted)}
.note{font-size:11.5px;color:var(--muted);line-height:1.7}
.empty{background:#fff;border-radius:var(--r);padding:34px 20px;text-align:center;box-shadow:var(--shadow);color:var(--muted);font-size:13px}
.empty b{display:block;color:var(--navy);font-size:14.5px;margin-bottom:5px}
.bar{height:7px;background:#e6ebf1;border-radius:9px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--navy3);border-radius:9px}
.bar.gold>i{background:var(--gold)}

/* home */
.daily{background:var(--navy);color:#fff;border-radius:14px;padding:20px 22px;position:relative;overflow:hidden}
.daily::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;
  border:28px solid rgba(200,162,74,.16)}
.daily .k{font-size:12px;color:var(--gold2);font-weight:700;display:flex;gap:10px;align-items:center}
.daily .q{font-size:18px;font-weight:900;line-height:1.5;margin:8px 0 14px;max-width:760px;position:relative;z-index:1}
.daily .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:820px;position:relative;z-index:1}
.daily .opts button{text-align:left;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);border-radius:9px;
  padding:10px 13px;font-size:13.5px;color:#fff;font-weight:500}
.daily .opts button:hover:not(:disabled){background:rgba(255,255,255,.14)}
.daily .opts button.ok{background:#1f8a55;border-color:#1f8a55}
.daily .opts button.ng{background:#8f2c22;border-color:#8f2c22}
.daily .exp{margin-top:12px;font-size:13px;color:#d9e3ee;max-width:820px;position:relative;z-index:1}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--num);font-size:34px;font-weight:700;color:var(--navy);line-height:1.05}
.stat .v small{font-size:16px;color:var(--muted);margin-left:3px}
.stat .l{font-size:12px;color:var(--muted);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.lvl{display:flex;align-items:center;gap:10px}
.lvl .medal{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:12px;
  background:var(--gold-soft);color:var(--warn);border:2px solid var(--gold)}
.mini-list{display:grid;gap:2px}
.mini-list button{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:8px 6px;border-radius:7px;width:100%}
.mini-list button:hover{background:var(--surface2)}
.mini-list .t{font-weight:700;font-size:13px;color:var(--ink);flex:1;line-height:1.45}
.mini-list .d{font-size:11px;color:var(--muted);white-space:nowrap}

/* matrix (業界情報) */
.matrix{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}
.mcol{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;min-width:170px}
.mcol .mh{background:var(--navy);color:#fff;padding:9px 12px;font-weight:800;font-size:13px;display:flex;align-items:center;gap:6px}
.mcol .mh .n{margin-left:auto;font-family:var(--num);font-size:17px;color:var(--gold2)}
.mcell{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 12px;border-top:1px solid var(--line);font-size:12.5px}
.mcell:hover{background:var(--surface2)}
.mcell.on{background:var(--gold-soft);box-shadow:inset 3px 0 0 var(--gold)}
.mcell .nm{flex:1;line-height:1.35}
.mcell .ct{font-family:var(--num);font-size:16px;font-weight:700;min-width:26px;height:24px;border-radius:6px;display:grid;place-items:center;padding:0 5px}
.h0{background:#fff;color:var(--neg);border:1px dashed #e7b2ab}
.h1{background:#f6efd9;color:#7a5a12}
.h2{background:#ecd9a3;color:#5a420c}
.h3{background:var(--gold);color:var(--navy)}
.legend{display:flex;gap:12px;align-items:center;font-size:11.5px;color:var(--muted);flex-wrap:wrap;margin:8px 0 16px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px}

/* cards */
.cards{display:grid;gap:10px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:13px 16px;border-left:4px solid var(--line2);cursor:pointer}
.card:hover{box-shadow:0 2px 6px rgba(13,35,64,.12),0 8px 22px rgba(13,35,64,.08)}
.card h4{font-size:15px;font-weight:800;color:var(--navy);line-height:1.45}
.card .snip{font-size:12.8px;color:#46586c;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .talk{font-size:12.5px;color:#5a420c;background:var(--gold-soft);border-radius:7px;padding:6px 10px;margin-top:8px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .foot{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.card .foot .sp{flex:1}
.k-term{border-left-color:var(--navy3)}.k-qa{border-left-color:var(--gold)}.k-rule{border-left-color:var(--neg)}
.k-know{border-left-color:var(--pos)}.k-product{border-left-color:#6a5acd}.k-case{border-left-color:#d07a1f}
.i-3{border-left-color:var(--neg)}.i-2{border-left-color:var(--gold)}.i-1{border-left-color:var(--line2)}
.done-mark{color:var(--pos);font-weight:800}

/* knowledge hero */
.khero{background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.searchwrap{position:relative}
.searchwrap .ic{position:absolute;left:15px;top:50%;transform:translateY(-50%);opacity:.5}
.searchwrap input{width:100%;padding:13px 14px 13px 42px;border-radius:10px;border:2px solid transparent;font-size:15.5px;background:#fff}
.searchwrap input:focus{outline:none;border-color:var(--gold)}
.khero .chips{margin-top:10px}
.khero .chip{background:transparent;color:#dce6f2;border-color:rgba(255,255,255,.28)}
.khero .chip:hover{background:rgba(255,255,255,.1)}
.khero .chip.on{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.fieldnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}

/* curriculum */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.stepc{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px}
.stepc .s{font-size:11.5px;color:var(--muted);font-weight:700}
.stepc .t{font-weight:900;color:var(--navy);font-size:14px;margin:2px 0 8px}
.stepc .p{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:5px}
table.tb{width:100%;border-collapse:collapse;background:#fff;font-size:12.8px}
.tbwrap{overflow-x:auto;border-radius:var(--r);box-shadow:var(--shadow);background:#fff;margin-bottom:16px}
.tb th{background:var(--surface2);color:var(--muted);font-size:11.5px;font-weight:700;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tb tr.grp td{background:var(--navy);color:#fff;font-weight:800;font-size:13px;padding:8px 12px}
.tb tr.grp td .muted{color:#a9bbcf;font-weight:500;margin-left:8px}
.tb td.no{font-family:var(--num);font-size:15px;color:var(--muted);width:40px}
.tb td .it{font-weight:800;color:var(--navy)}
.tb input.inp,.tb select.inp{padding:4px 7px;font-size:12px;width:100%}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.chk input{width:16px;height:16px;accent-color:var(--pos)}
.st-done{color:var(--pos);font-weight:800}.st-plan{color:var(--warn);font-weight:800}.st-none{color:var(--muted)}

/* quiz */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.qcard{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.qcard .t{font-weight:900;color:var(--navy);font-size:14.5px}
.qcard .m{font-size:12px;color:var(--muted)}
.qcard .acts{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap}
.score{font-family:var(--num);font-size:24px;font-weight:700}
.pass{color:var(--pos)}.fail{color:var(--neg)}
.qbox .qn{font-size:12px;color:var(--muted);font-weight:700}
.qbox .qq{font-size:17px;font-weight:800;color:var(--navy);margin:6px 0 14px;line-height:1.55}
.qbox .opts{display:grid;gap:8px}
.qbox .opts button{text-align:left;border:1px solid var(--line2);border-radius:9px;padding:11px 14px;font-size:14px;background:#fff}
.qbox .opts button:hover:not(:disabled){background:var(--surface2)}
.qbox .opts button.ok{background:var(--pos-soft);border-color:var(--pos);color:#135c38;font-weight:700}
.qbox .opts button.ng{background:var(--neg-soft);border-color:var(--neg);color:#7d2219}
.qbox .exp{margin-top:12px;background:var(--surface2);border-radius:9px;padding:11px 14px;font-size:13px;line-height:1.75}
.heat{border-collapse:collapse;font-size:12px;background:#fff}
.heat th{font-size:11px;color:var(--muted);padding:6px 8px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
.heat th.l,.heat td.l{text-align:left}
.heat td{padding:5px 6px;text-align:center;border-bottom:1px solid var(--line)}
.heat td span{display:inline-block;min-width:38px;padding:3px 0;border-radius:5px;font-family:var(--num);font-size:14px;font-weight:700}
.hs-p{background:var(--pos-soft);color:var(--pos)}.hs-m{background:var(--warn-soft);color:var(--warn)}.hs-f{background:var(--neg-soft);color:var(--neg)}.hs-n{color:#c3ccd6}

/* ask */
.ask textarea{width:100%;min-height:96px;padding:12px 14px;border:1px solid var(--line2);border-radius:10px;font-size:14.5px;line-height:1.7;resize:vertical}
.ask textarea:focus{outline:none;border-color:var(--navy3)}
.answer{white-space:pre-wrap;line-height:1.85;font-size:14px}
.refs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.refs button{font-size:12px;border:1px solid var(--line2);border-radius:7px;padding:4px 10px;background:var(--surface2);color:var(--navy);font-weight:700}

/* modal */
.ov{display:none;position:fixed;inset:0;z-index:100;background:rgba(13,35,64,.55);overflow:auto;padding:22px 12px}
.ov.show{display:block}
.modal{max-width:780px;margin:0 auto;background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.modal.wide{max-width:960px}
.mhead{background:var(--navy);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:2}
.mhead .t{font-weight:800;font-size:14px;flex:1}
.mbody{padding:18px}
.mfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;background:var(--surface2)}
.mfoot .sp{flex:1}
.fld{margin-bottom:12px}
.fld>label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:4px}
.fld input[type=text],.fld input[type=date],.fld input[type=url],.fld textarea,.fld select{width:100%;padding:8px 11px;border:1px solid var(--line2);border-radius:8px;background:#fff}
.fld textarea{min-height:110px;resize:vertical;line-height:1.7}
.fld textarea.s{min-height:70px}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--navy3);box-shadow:0 0 0 3px rgba(31,78,122,.1)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.sub-h{font-size:12px;font-weight:800;color:var(--navy);border-bottom:1px solid var(--line);padding-bottom:5px;margin:16px 0 10px}
.checks{display:flex;gap:6px 14px;flex-wrap:wrap}
.checks label{display:inline-flex;gap:5px;align-items:center;font-size:12.5px;cursor:pointer}
.d-title{font-size:20px;font-weight:900;color:var(--navy);line-height:1.4;margin-bottom:8px}
.d-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:14px;font-size:11.5px}
.d-body{font-size:14px;line-height:1.9;white-space:pre-wrap;word-break:break-word}
.d-talk{margin-top:14px;background:var(--gold-soft);border-left:4px solid var(--gold);border-radius:8px;padding:11px 14px}
.d-talk .h,.d-caution .h,.d-src .h{font-size:11.5px;font-weight:800;margin-bottom:3px}
.d-talk .h{color:#7a5a12}
.d-talk div:last-child{white-space:pre-wrap;line-height:1.8}
.d-caution{margin-top:10px;background:var(--neg-soft);border-left:4px solid var(--neg);border-radius:8px;padding:10px 14px;white-space:pre-wrap;line-height:1.75}
.d-caution .h{color:var(--neg)}
.d-src{margin-top:10px;background:var(--surface2);border-radius:8px;padding:10px 14px;font-size:12.5px}
.d-src .h{color:var(--muted)}
.d-sec{font-size:11.5px;font-weight:800;color:var(--muted);margin:18px 0 8px}
.d-imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.d-imgs a{display:block;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.d-imgs img{width:100%;display:block}
.linklist{display:grid;gap:6px}
.linklist a{display:block;padding:8px 12px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;font-size:13px;text-decoration:none;font-weight:700}
.linklist a:hover{background:var(--gold-soft);border-color:var(--gold)}
.itemrow{display:flex;gap:7px;margin-bottom:7px;align-items:center}
.itemrow input{flex:1;padding:7px 10px;border:1px solid var(--line2);border-radius:7px}
.itemrow input.lab{flex:0 0 32%}
.thumbs{display:flex;gap:9px;flex-wrap:wrap;margin-top:9px}
.thumb{position:relative;width:104px;height:78px;border-radius:8px;overflow:hidden;border:1px solid var(--line2);background:var(--surface2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:3px;right:3px;background:rgba(13,35,64,.8);color:#fff;border-radius:5px;width:20px;height:20px;font-size:12px;line-height:1;display:grid;place-items:center}
.drop{display:block;border:2px dashed var(--line2);border-radius:9px;padding:14px;text-align:center;font-size:12px;color:var(--muted);background:var(--surface2);cursor:pointer}
.drop.over{border-color:var(--gold);background:var(--gold-soft)}
.sql{background:var(--navy);color:#cfe0f0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;padding:12px;border-radius:8px;white-space:pre-wrap;word-break:break-all;line-height:1.6;max-height:300px;overflow:auto}
.cw{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:12px;white-space:pre-wrap;font-size:12.5px;line-height:1.75;max-height:420px;overflow:auto}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{color:var(--neg);font-size:12.5px;font-weight:700;margin-top:8px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(70px);background:var(--navy);color:#fff;padding:10px 20px;border-radius:9px;font-size:13px;font-weight:700;opacity:0;transition:.22s;z-index:300;pointer-events:none;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.news li{margin:0 0 8px 18px;font-size:13px}
.guide h4{font-size:13.5px;color:var(--navy);margin:14px 0 4px}
.guide p,.guide li{font-size:13px;line-height:1.8}
.guide ol,.guide ul{margin-left:20px}
@media(max-width:900px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid2,.grid3{grid-template-columns:1fr}
  .steps{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:900px){body{background-size:auto 560px;background-position:82% top}.pagehero{min-height:96px}}
@media(max-width:640px){.pagehero{min-height:70px;padding-top:6px}.pagehero p{display:none}.hbar{flex-wrap:nowrap;gap:6px}.brand{font-size:13.5px;white-space:nowrap}.hbtn{padding:5px 8px;font-size:11.5px;white-space:nowrap}}
@media(max-width:640px){
  .row2,.row3{grid-template-columns:1fr}
  .daily .opts{grid-template-columns:1fr}
  .daily .q{font-size:16px}
  .brand small{display:none}
  main{padding:14px 10px 60px}
  .d-title{font-size:17px}
}
</style>

  talk:'「天気のせいなのか、設備のせいなのかを切り分けるのが最初の一歩です。直近3年の発電量をいただければ、設備の問題かどうかを無料で診断します。」',caution:''},
 {c:'term',f:'tech',t:'低圧・高圧・特別高圧',tags:'区分, 低圧, 高圧',
  b:'実務上、出力50kW未満が低圧、50kW以上2,000kW未満が高圧、2,000kW以上が特別高圧として扱われます。\n\n区分によって、電力会社との連系の方法、電気主任技術者の要否、使用前自己確認、届出などの手続きが変わります。',
  talk:'',caution:'厳密な区分は電圧で決まります。個別案件では設備の構成で確認してください。'},
 {c:'term',f:'tech',t:'ホットスポット',tags:'劣化診断, パネル',
  b:'部分的な影やセルの不良により、パネルの一部が発電せず抵抗となって発熱する現象です。\n\n出力の低下だけでなく、バックシートの焼損やガラス割れにつながることがあります。サーモカメラやIVカーブ測定で見つけます。',
  talk:'「赤外線カメラで見ると、熱を持っているパネルがすぐわかります。見た目ではわからない不良が、発電量を下げていることが多いんです。」',caution:''},
 /* FIT・FIP */
 {c:'rule',f:'fit',t:'FIT制度の基本（調達期間20年）',tags:'FIT, 調達期間, 再エネ特措法',
  b:'再エネで発電した電気を、国が定めた価格で一定期間買い取る制度です（2012年7月開始）。事業用（10kW以上）の太陽光は調達期間20年、住宅用（10kW未満）は10年です。\n\n調達期間は運転開始日から数えます。リパワリングをしても調達期間は延びません。',
  talk:'「売電単価は20年間変わりませんが、期間も延びません。だからこそ、残りの年数で何kWh取り戻せるかが勝負になります。」',
  caution:'「リパワリングで期間が延びる」「単価が上がる」とは絶対に言わないでください。'},
 {c:'rule',f:'fit',t:'FIP制度とFITの違い',tags:'FIP, プレミアム, 市場',
  b:'FIP（2022年4月開始）は、市場で売った価格にプレミアムを上乗せして受け取る制度です。\n\nFIT：固定価格で買い取り。計画・市場の責任は小さい。\nFIP：市場価格＋プレミアム。発電計画と実績のズレ（インバランス）の責任を負う。蓄電池の併設で高い時間帯に売るなどの工夫で収益を伸ばせる。\n\n既存のFIT認定からFIPへ移ることもできますが、FITには戻れません。',
  talk:'「FIPは、市場の高い時間に売れれば収益が伸びる一方、手間とリスクも増えます。蓄電池とセットで考えると選択肢が広がります。」',
  caution:'FIPへの移行は戻れない判断です。お客様に移行を勧める場合は、収益の試算と専門家の確認を前提にしてください。'},
 {c:'term',f:'fit',t:'バランシングコストとインバランス',tags:'FIP, インバランス',
  b:'インバランス：発電計画と実際の発電量のズレ。FIPでは発電事業者側が精算の責任を負います。\n\nバランシングコスト：そのズレの負担を和らげるため、プレミアムに上乗せされる金額です。段階的に小さくなる設計です。\n\n実務では、アグリゲーターに計画の作成とインバランスの管理を委託することが一般的です。',
  talk:'',caution:''},
 {c:'rule',f:'fit',t:'認定取消し・交付金の一時停止',tags:'認定取消し, 交付金, 法令違反, 2024年改正',
  b:'関係法令（森林法、農地法、電気事業法など）への違反や、認定計画どおりに事業を行わない場合、認定の取消しにつながります。\n\n2024年4月施行の改正再エネ特措法で、違反が認められた事業者へのFIT・FIP交付金の一時停止の仕組みが入りました。違反が解消されれば支払いが再開されますが、解消されない場合は返還を求められることがあります。\n\n典型例：無断での設備変更、標識・柵の未設置、保守点検の不実施、変更認定の申請漏れ。',
  talk:'「最近は法令違反があると売電の入金そのものが止まる仕組みになりました。点検記録や柵・標識まで含めて、きちんと整っているかを一緒に確認させてください。」',
  caution:'違反の有無を当社が断定することはしないでください。事実の確認と、必要な手続きの案内にとどめます。',star:'香川観音・まんのう発電所'},
 {c:'rule',f:'fit',t:'パネル増設・更新時の調達価格の扱い',tags:'増設, 更新, 調達価格, 変更認定',
  b:'パネルを増やして出力を増やすと、調達価格に影響することがあります。\n\n2024年4月から、既存の太陽光に増設・更新する場合、増えた部分には最新の価格を当て、既存部分は元の価格を維持する考え方が導入されたとされています（要確認）。出力を増やさない同等品への交換は、価格への影響が出ないのが基本です。\n\nいずれの場合も、変更認定・事後変更届出の要否を事前に確認します。',
  talk:'「出力を増やすかどうかで、手続きと単価の扱いが変わります。設計の段階で、単価を守れる方法をご提案します。」',
  caution:'ルールは改正が多い分野です。案件ごとに資源エネルギー庁の最新資料で必ず確認してください。'},
 {c:'rule',f:'fit',t:'廃棄等費用の積立制度',tags:'廃棄費用, 積立, 卒FIT',
  b:'10kW以上の太陽光（FIT・FIP認定）が対象で、2022年7月に始まりました。原則として調達期間の終了前10年間、売電収入から差し引く形で外部（電力広域的運営推進機関）に積み立てます。\n\n積み立てたお金は、発電所の解体・廃棄のときに取り戻せます。',
  talk:'「売電の入金が少し減ったのは、将来の撤去費用の積立が始まったためです。お金がなくなったのではなく、外に貯めている状態です。」',
  caution:''},
 {c:'qa',f:'fit',t:'FITが終わったら、発電所はどうなりますか？',tags:'卒FIT, 出口戦略',
  b:'設備は動き続けます。調達期間が終わると固定価格での買取がなくなるため、主な選択肢は次の3つです。\n\n1. 小売電気事業者・アグリゲーターとの相対契約で売る\n2. 自家消費や近隣への供給に切り替える\n3. 発電所を売却する（セカンダリー）\n\nどの道を選ぶ場合も、設備が健全で発電量が出ていることが価値の前提になります。',
  talk:'「FITが終わっても発電所の価値はなくなりません。ただ、壊れた設備では売り先も買い手も見つかりにくくなります。残りの期間で稼ぎつつ、終わった後の価値も上げておくのがリパワリングです。」',
  caution:'卒FIT後の買取価格は確約できません。具体的な金額を言わないでください。'},
 /* 系統 */
 {c:'rule',f:'grid',t:'出力制御のルール（旧・新・指定）',tags:'出力制御, 30日, 360時間, 無制限無補償',
  b:'電気が余るときに、電力会社の指示で発電を止める（抑える）仕組みです。適用されるルールは、エリアと接続の時期で変わります。\n\n旧ルール：年間30日まで無補償\n新ルール：年間360時間まで無補償（時間単位）\n指定ルール：上限なし・無補償（無制限無補償）\n\n九州をはじめ、多くのエリアで実績が出ています。オンライン制御に対応すると、制御の割り当てが小さくなる運用もあります。',
  talk:'「出力制御は避けられない時代になっています。だからこそ、制御されていない時間の発電量を最大にする設備と、オンライン対応が大切です。」',
  caution:'将来の制御量を予測して断言しないでください。エリアの公表資料を示して説明します。',star:'山形遊佐・京都中台'},
 {c:'rule',f:'grid',t:'系統連系の申請フロー',tags:'連系, 接続検討, 工事費負担金',
  b:'1. 接続検討の申込（連系できるか・費用と期間の回答）\n2. 契約申込\n3. 工事費負担金の契約・支払い\n4. 電力会社側の工事\n5. 連系・受給開始\n\n各ステップの日付は工程表で管理します。申込内容と実際の設備が違うと、やり直しや補填の原因になります。',
  talk:'',caution:'',star:'東電・東北電の管理案件'},
 {c:'term',f:'grid',t:'系統空き容量・ノンファーム型接続',tags:'空き容量, ノンファーム, 系統増強',
  b:'空き容量：送電線・変電所にあとどれだけ電気を流せるか。各一般送配電事業者がマップで公表しています。\n\nノンファーム型接続：空きがない場合でも、混雑する時間帯に出力制御を受けることを条件に接続する方式です。\n\n系統増強の工事計画も公表されるため、連系時期や負担金に影響します。',
  talk:'「この地域の空き容量と増強計画は事前に調べてあります。連系の見込みも含めてご説明します。」',caution:''},
 {c:'qa',f:'grid',t:'出力制御が増えているのに、リパワリングして意味がありますか？',tags:'出力制御, 断り文句, ReFort',
  b:'あります。出力制御は「止められている時間」の話で、ReFortは「動いている時間」の発電量を増やす話です。\n\n劣化やPCSの停止で失っている発電量は、出力制御よりも大きいことが多くあります。直近の発電実績と制御の実績を分けて比べると、改善できる量がはっきりします。',
  talk:'「出力制御で止まる時間は、どの会社の設備でも同じです。差がつくのは、それ以外の時間にどれだけ発電できるかです。実績データで、制御の影響と劣化の影響を分けてお見せします。」',
  caution:'「出力制御の影響がなくなる」とは言わないでください。'},
 /* 法令・保安 */
 {c:'rule',f:'law',t:'使用前自己確認',tags:'電気事業法, 自己確認, 売電開始',
  b:'設置者が、設備が技術基準に合っているかを自ら確認し、結果を国（産業保安監督部）に届け出る手続きです。\n\n高圧（50kW以上2,000kW未満）の太陽光に加え、2023年3月からは低圧の事業用（10kW以上50kW未満）も対象になりました。\n\n更新工事でも、変更の内容によって必要になる場合があります。売電開始前に終わっていないと、開始が遅れます。',
  talk:'',caution:'対象の範囲・要否は変更内容で変わります。案件ごとに確認してください。',star:'小野メガ発電所'},
 {c:'rule',f:'law',t:'小規模事業用電気工作物（低圧10〜50kW）の義務',tags:'低圧, 届出, 技術基準',
  b:'2023年3月から、10kW以上50kW未満の太陽光は「小規模事業用電気工作物」となり、次の義務があります。\n\n・基礎情報の届出（設置者・保守の連絡先など）\n・技術基準への適合維持\n・使用前自己確認と結果の届出（新設・一定の変更時）\n\n既存の低圧発電所も基礎情報の届出が必要です。',
  talk:'「低圧でも、今は国への届出や保守の責任が明確になっています。届出が済んでいるか、一緒に確認しませんか。」',caution:''},
 {c:'term',f:'law',t:'電気主任技術者',tags:'保安, 高圧',
  b:'高圧以上の発電所（自家用電気工作物）では、保安の監督をする電気主任技術者の選任が必要です。多くは外部委託（保安法人・個人事業者）で対応します。\n\n保安規程の届出も必要です。',talk:'',caution:''},
 /* 自治体・土地 */
 {c:'rule',f:'local',t:'営農型太陽光と農地法',tags:'営農型, 農地, 一時転用',
  b:'農地に支柱を立てて上部に太陽光を設置し、下で営農を続ける方式です。支柱の部分は農地の一時転用許可が必要で、期間ごとに更新します。\n\n下部農地で適切に営農を続け、収量を大きく落とさないことが条件です。営農状況の報告も求められます。',
  talk:'「発電だけでなく、下の農業をきちんと続けていただくことが前提の制度です。営農計画も一緒に考えます。」',
  caution:'許可の基準・期間は改正があります。農林水産省・農業委員会の最新情報で確認してください。'},
 {c:'know',f:'local',t:'補助金の探し方',tags:'補助金, 助成金, 公募',
  b:'1. 国：資源エネルギー庁・環境省・経済産業省の公募情報、執行団体（SIIなど）のサイト\n2. 都道府県：環境・産業振興の部署のページ\n3. 市区町村：ゼロカーボン関連の補助制度\n\n確認すること：対象設備、補助率と上限、公募期間、交付決定前の発注・着工の可否、実績報告と財産処分の制限。',
  talk:'「使える補助金がないかは、こちらで調べてからご提案します。公募の時期によっては、契約のタイミングを合わせたほうが得になります。」',
  caution:'補助金は採択を約束できません。「必ずもらえます」は禁句です。'},
 {c:'know',f:'local',t:'太陽光条例・規制の確認ポイント',tags:'条例, 規制, 林地開発, 景観',
  b:'自治体によって、太陽光の設置・変更に独自の条例や指導要綱があります。\n\n確認するもの：設置の届出・許可、住民説明、景観、林地開発許可、土砂災害区域、廃棄・撤去の計画。\n\n更新工事でも、届出が必要な自治体があります。',talk:'',caution:''},
 /* 税制 */
 {c:'term',f:'tax',t:'法定耐用年数（太陽光17年）',tags:'減価償却, 耐用年数',
  b:'減価償却の計算で使う年数で、太陽光発電設備は一般に17年です。FITの調達期間20年とは別物です。\n\n取得価額を耐用年数にわたって費用にしていきます。特別償却・即時償却の制度を使うと、初年度に多く費用にできる場合があります。',
  talk:'',caution:'業種や用途で扱いが変わることがあります。最終判断は顧問税理士にお願いしてください。'},
 {c:'rule',f:'tax',t:'中小企業経営強化税制（即時償却・税額控除）',tags:'即時償却, 税額控除, 経営強化',
  b:'中小企業が一定の設備を取得したとき、即時償却または税額控除を選べる制度です。\n\n太陽光の場合、発電した電気の半分を超えて売電が見込まれる設備は対象外になります。自家消費型の設備は対象になり得ます。経営力向上計画の認定など、事前の手続きが必要です。\n\n適用期限・要件は税制改正で変わるため、毎年確認します。',
  talk:'「自家消費の割合が高い設備なら、税制の優遇が使える可能性があります。顧問の先生に確認していただくための資料は、こちらで揃えます。」',
  caution:'当社は税務の判断をしません。「節税になります」と断言しないでください。'},
 {c:'rule',f:'tax',t:'中小企業投資促進税制（特別償却・税額控除）',tags:'特別償却, 税額控除',
  b:'中小企業が一定の機械装置などを取得したとき、特別償却または税額控除を選べる制度です。売電目的の発電設備は対象外になる点は、経営強化税制と同じです。\n\n適用期限・要件は毎年の税制改正で確認します。',talk:'',caution:'最終判断は顧問税理士です。'},
 {c:'rule',f:'tax',t:'償却資産税（固定資産税）',tags:'固定資産税, 償却資産, 申告',
  b:'事業用の償却資産にかかる市町村の税金です。毎年1月1日現在の資産を、1月31日までに申告します。標準税率は1.4%です。\n\n再エネ設備には、一定の要件で課税標準を軽くする特例がある場合があります（対象や期間は年度・自治体で異なります）。\n\nリパワリングで設備を入れ替えた場合は、除却と取得の申告が必要です。',
  talk:'',caution:'特例の適用可否は必ず自治体・顧問税理士に確認してください。'},
 {c:'know',f:'tax',t:'リパワリング時の除却損と取得価額の配分',tags:'除却損, 取得価額, 算定書',
  b:'中古発電所を取得して更新する場合など、旧設備の除却損が論点になります。\n\n役割分担：\n・評価会社：設備の現況、再調達価格、劣化、撤去範囲、設備別の参考価格を算定\n・アースコム：工事内容、撤去・廃棄・継続使用の事実を証明\n・お客様の顧問税理士：取得価額の配分と除却損の税務処理を最終判断\n\n金額が大きい案件は、契約前に顧問税理士へ資料一式を送り、見解を書面やメールで残していただきます。',
  talk:'「税務上どう扱うかは顧問の先生のご判断になります。判断に必要な設備の評価と工事の証明は、こちらでしっかり揃えます。」',
  caution:'除却損の計上や金額を保証しないでください。算定書は参考額を示すものです。',star:'設備価格評価・取得価額配分算定書'},
 /* 電力市場 */
 {c:'term',f:'market',t:'需給調整市場',tags:'需給調整, 一次調整力, 蓄電池',
  b:'電力の需要と供給のズレを調整する力（調整力）を取引する市場です。応動の速さ・継続時間で、一次調整力から三次調整力までの区分があります。2024年4月にすべての区分の取引が始まりました。\n\n一次調整力は10秒以内の応動が求められ、蓄電池が強みを発揮できる区分です。待機している容量（ΔkW）に対して対価が支払われます。',
  talk:'',caution:'市場価格は大きく変動します。過去の価格が将来も続く前提で説明しないでください。'},
 {c:'term',f:'market',t:'非化石証書',tags:'環境価値, RE100',
  b:'再エネなど化石燃料を使わない電気の「環境価値」を、電気そのものと切り離して取引する証書です。\n\n企業の脱炭素（RE100など）の取組みで需要があり、FIT電気の環境価値も取引されています。',talk:'',caution:''},
 {c:'know',f:'market',t:'系統用・併設型・需要家用蓄電池の違い',tags:'系統用蓄電池, 併設, 自家消費',

async function token(){
  try{if(sb){const r=await sb.auth.getSession();const s=r&&r.data&&r.data.session;if(s&&s.access_token)return s.access_token;}}catch(e){}
  return SB_KEY;
}
async function callAI(system,prompt,maxTokens){
  const res=await fetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+await token(),'apikey':SB_KEY},
    body:JSON.stringify({system,max_tokens:maxTokens||2000,messages:[{role:'user',content:prompt}]})});
  const raw=await res.text(); let j={}; try{j=JSON.parse(raw);}catch(e){}
  if(!res.ok){const em=j.error?(typeof j.error==='string'?j.error:(j.error.message||JSON.stringify(j.error))):raw.slice(0,160);
    throw new Error('AIの呼び出しに失敗しました（'+res.status+'）：'+em);}
  const t=(typeof j==='string')?j:(j.text||(Array.isArray(j.content)?j.content.map(c=>c.text||'').join(''):'')||j.result||'');
  if(!t)throw new Error('AIから回答が返ってきませんでした。少し待ってもう一度押してください');
  return t.trim();
}
function parseJSON(t){
  t=String(t).replace(/```json|```/g,'').trim();
  const a=t.indexOf('{'),b=t.indexOf('['); let s=-1;
  if(a<0)s=b;else if(b<0)s=a;else s=Math.min(a,b);
  if(s>0)t=t.slice(s);
  const end=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']')); if(end>0)t=t.slice(0,end+1);
  return JSON.parse(t);
}

function renderKnow(){
  $('#kindChips').innerHTML=[['all','すべて']].concat(KINDS.map(k=>[k.k,k.n])).map(c=>`<button class="chip${F.kind===c[0]?' on':''}" data-kind="${c[0]}">${c[1]}</button>`).join('');
  const live=liveK();
  $('#fieldChips').innerHTML=`<button class="chip${F.field==='all'?' on':''}" data-field="all">全分野 ${live.length}</button>`+
    FIELDS.map(f=>{const n=live.filter(x=>x.ext.field===f.k).length;return n||F.field===f.k?`<button class="chip${F.field===f.k?' on':''}" data-field="${f.k}">${esc(f.n)} ${n}</button>`:'';}).join('');
  $$('#kSeg button').forEach(b=>b.classList.toggle('on',b.dataset.f===F.flt));
  $$('[data-kind]').forEach(b=>b.onclick=()=>{F.kind=b.dataset.kind;renderKnow();});
  $$('[data-field]').forEach(b=>b.onclick=()=>{F.field=b.dataset.field;renderKnow();});
  const q=F.kq.trim().toLowerCase();
  const list=live.filter(x=>{
    if(F.kind!=='all'&&x.category!==F.kind)return false;
    if(F.field!=='all'&&x.ext.field!==F.field)return false;
    if(F.flt==='official'&&x.status!=='approved')return false;
    if(F.flt==='talk'&&!x.ext.talk)return false;
    if(F.flt==='stale'&&!isStale(x))return false;
    if(F.flt==='unread'&&hasRead(x.id))return false;
    if(q){const h=[x.title,x.body,x.tags,x.ext.talk,x.ext.caution,(FIELD[x.ext.field]||{}).n].join(' ').toLowerCase();if(!q.split(/\s+/).every(w=>h.indexOf(w)>=0))return false;}
    return true;
  }).sort((a,b)=>(a.status==='approved'?0:1)-(b.status==='approved'?0:1)||FORD(a)-FORD(b)||String(b.updated_at).localeCompare(String(a.updated_at)));
  $('#kCount').textContent=list.length+'件';
  $('#kList').innerHTML=list.length?list.map(kCard).join(''):`<div class="empty"><b>${live.length?'該当するものがありません':'ナレッジがまだありません'}</b>${live.length?'キーワードや絞り込みを変えてみてください。':'設定から「基本ナレッジ」を取り込むか、1件追加してください。'}</div>`;
  $$('#kList .card').forEach(c=>c.onclick=()=>openK(c.dataset.id));
  $('#btnKNew').style.display=canEdit()?'':'none';
}

function normImgUrl(u){const m=u.match(/drive\.google\.com\/file\/d\/([^/?&]+)/)||u.match(/drive\.google\.com\/(?:open|uc)\?(?:[^&]*&)*id=([^&]+)/);return m?'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w1600':u;}
function upStat(m,ok){const e=$('#eUp');if(!e)return;e.textContent=m||'';e.style.color=ok===false?'var(--neg)':ok===true?'var(--pos)':'';}

async function upload(files){
  files=(files||[]).filter(f=>/^image\//.test(f.type));
  if(!files.length){upStat('画像ファイルを選んでください',false);return;}
  if(!sb){upStat('Supabaseに接続していません。画像URLを貼る方法をお使いください',false);return;}
  if(files.some(f=>f.size>10*1024*1024)){upStat('10MBを超える画像があります',false);return;}
  upStat(files.length+'件をアップロード中…');
  for(const f of files){
    const ext=(f.name.split('.').pop()||'png').toLowerCase().replace(/[^a-z0-9]/g,'')||'png';
    const path=EDIT.id+'/'+Date.now()+'_'+Math.random().toString(36).slice(2,7)+'.'+ext;
    const up=await sb.storage.from(BUCKET).upload(path,f,{upsert:false,contentType:f.type});
    if(up.error){upStat('アップロードできませんでした：'+up.error.message,false);return;}
    const pub=sb.storage.from(BUCKET).getPublicUrl(path);
    EDIT.images=(EDIT.images||[]).concat([pub.data.publicUrl]);
  }
  drawThumbs(); upStat('追加しました。保存を押すと確定します',true);
}

function renderHeat(){

function rankHtml(people,fs){

function startQuiz(field,qs,title){
  qs=qs||shuffle(questionsOf(field)).slice(0,10);
  if(!qs.length){toast('問題がありません');return;}
  const Q=qs.map(q=>{const ord=shuffle(q.o.map((_,i)=>i));return {q:q.q,o:ord.map(i=>q.o[i]),a:ord.indexOf(q.a),e:q.e||''};});
  let idx=0,score=0,answered=false;
  const draw=()=>{
    const q=Q[idx];
    $('#mBody').innerHTML=`<div class="qbox"><div class="qn">${idx+1}／${Q.length}問　正解 ${score}</div><div class="qq">${esc(q.q)}</div>
      <div class="opts">${q.o.map((o,i)=>`<button data-i="${i}">${esc(o)}</button>`).join('')}</div><div id="qExp"></div></div>`;
    $('#mFoot').innerHTML=`<div class="sp"></div><button class="btn pri" id="qNext" disabled>${idx+1<Q.length?'次へ':'結果を見る'}</button>`;
    answered=false;
    $$('#mBody .opts button').forEach(b=>b.onclick=()=>{
      if(answered)return; answered=true; const i=+b.dataset.i; if(i===q.a)score++;
      $$('#mBody .opts button').forEach((x,j)=>{x.disabled=true;if(j===q.a)x.classList.add('ok');else if(j===i)x.classList.add('ng');});
      $('#qExp').innerHTML=`<div class="exp"><b>${i===q.a?'正解':'不正解'}</b>　${esc(q.e)}</div>`; $('#qNext').disabled=false;});
    $('#qNext').onclick=async()=>{
      if(idx+1<Q.length){idx++;draw();return;}
      const pct=Math.round(score/Q.length*100);
      if(field)await addProg('quiz',field,score,Q.length);
      $('#mBody').innerHTML=`<div style="text-align:center;padding:20px 0"><div class="score ${pct>=PASS?'pass':'fail'}" style="font-size:64px">${pct}</div>
        <div style="font-weight:900;color:var(--navy);font-size:17px">${pct>=PASS?'合格です':'合格は'+PASS+'点です。もう一度挑戦しましょう'}</div>
        <div class="note" style="margin-top:6px">${score}／${Q.length}問 正解${field?'　記録しました':''}</div></div>`;
      $('#mFoot').innerHTML=`${field?`<button class="btn gh" id="qK">この分野の知識を読む</button>`:''}<div class="sp"></div><button class="btn gh" id="qAgain">もう一度</button><button class="btn pri" data-close>閉じる</button>`;
      $$('#mFoot [data-close]').forEach(b=>b.onclick=closeModal);
      if($('#qK'))$('#qK').onclick=()=>{closeModal();F.field=field;F.kind='all';F.flt='all';go('know');};
      $('#qAgain').onclick=()=>startQuiz(field,field?null:qs,title);
      renderView();
    };
  };
  openModal(title||('確認テスト：'+FIELD[field].n),'','');
  draw();
}
async function aiQuizFromK(x){
  openModal('この内容で3問テスト','<div class="note"><span class="spin"></span> AIが問題を作っています…</div>','');
  try{
    const qs=await aiMakeQs(`タイトル：${x.title}\n説明：${x.body}\nトーク：${x.ext.talk||''}\n注意：${x.ext.caution||''}`,3);
    startQuiz(null,qs,'テスト：'+x.title);
  }catch(e){$('#mBody').innerHTML='<div class="err">'+esc(e.message)+'</div>';$('#mFoot').innerHTML='<div class="sp"></div><button class="btn pri" data-close>閉じる</button>';$$('#mFoot [data-close]').forEach(b=>b.onclick=closeModal);}
}
async function aiMakeQs(material,n){
  const t=await callAI(AI_BASE,`次の社内ナレッジだけを根拠に、営業社員向けの4択問題を${n}問作ってください。ナレッジに書かれていない事実は問わないでください。正解は1つだけ、誤答は紛らわしいが明確に誤りのものにします。
JSONだけを返してください：[{"q":"問題文","o":["選択肢1","選択肢2","選択肢3","選択肢4"],"a":正解の番号(0〜3),"e":"解説（1〜2文）"}]
ナレッジ：
${material.slice(0,8000)}`,2500);
  const j=parseJSON(t); const arr=Array.isArray(j)?j:(j.questions||[]);
  const ok=arr.filter(q=>q&&q.q&&Array.isArray(q.o)&&q.o.length===4&&q.a>=0&&q.a<4);
  if(!ok.length)throw new Error('問題をうまく作れませんでした。もう一度お試しください');
  return ok.map(q=>({q:q.q,o:q.o,a:+q.a,e:q.e||''}));
}
async function aiQuizForField(field,btn){
  const src=liveK().filter(x=>x.ext.field===field&&x.status==='approved');
  const use=src.length?src:liveK().filter(x=>x.ext.field===field);
  if(!use.length){toast('この分野のナレッジがまだありません');return;}
  btn.disabled=true; btn.innerHTML='<span class="spin"></span> 作成中…';
  try{
    const mat=use.slice(0,12).map(x=>`■${x.title}\n${x.body}`).join('\n\n');
    const qs=await aiMakeQs(mat,5);
    openModal('AIが作った問題（'+FIELD[field].n+'）',`<p class="note" style="margin-bottom:10px">正しいものだけチェックを残して追加してください。追加した問題は、この分野のテストに全員分出題されます。</p>`+
      qs.map((q,i)=>`<div class="panel" style="margin-bottom:10px;box-shadow:none;border:1px solid var(--line)"><label class="chk"><input type="checkbox" data-aq="${i}" checked>追加する</label>
        <div style="font-weight:800;margin:6px 0">${esc(q.q)}</div>${q.o.map((o,j)=>`<div style="font-size:13px;${j===q.a?'color:var(--pos);font-weight:800':''}">${j===q.a?'○':'・'} ${esc(o)}</div>`).join('')}<div class="note" style="margin-top:4px">${esc(q.e)}</div></div>`).join(''),
      `<div class="sp"></div><button class="btn gh" data-close>やめる</button><button class="btn pri" id="aqAdd">チェックした問題を追加</button>`);
    $('#aqAdd').onclick=async()=>{
      const pick=$$('[data-aq]').filter(c=>c.checked).map(c=>qs[+c.dataset.aq]);
      CSET._quiz=CSET._quiz||{}; CSET._quiz[field]=(CSET._quiz[field]||[]).concat(pick);
      await saveCSet(); closeModal(); renderQuiz(); toast(pick.length+'問を追加しました');

  }catch(e){toast(e.message,4000);}
  btn.disabled=false; btn.textContent='AIで問題を追加';
}

/* =====================================================================
   AIに聞く
   ===================================================================== */
function grams(s){s=String(s||'').toLowerCase().replace(/[\s、。・「」（）()？?！!,.:：]/g,'');const g=new Set();for(let i=0;i<s.length-1;i++)g.add(s.slice(i,i+2));return g;}
function retrieve(q,n){
  const qg=grams(q); if(!qg.size)return [];
  const score=(title,body)=>{let s=0;const t=String(title).toLowerCase(),b=String(body).toLowerCase();qg.forEach(g=>{if(t.indexOf(g)>=0)s+=3;if(b.indexOf(g)>=0)s+=1;});return s;};
  const ks=liveK().map(x=>({type:'k',x,s:score(x.title+' '+x.tags,x.body+' '+(x.ext.talk||''))+(x.status==='approved'?2:0)}));
  const is=INFO.map(x=>({type:'i',x,s:score(x.title+' '+x.item,x.summary+' '+(x.impact||''))}));
  return ks.concat(is).filter(o=>o.s>4).sort((a,b)=>b.s-a.s).slice(0,n||8);
}
$('#askGo').onclick=async()=>{
  const q=$('#askQ').value.trim(); if(q.length<4){toast('質問を入れてください');return;}
  const refs=retrieve(q,8);
  const b=$('#askGo'); b.disabled=true; b.innerHTML='<span class="spin"></span> 考えています…';
  $('#askOut').innerHTML='';
  try{
    const ctx=refs.map((r,i)=>r.type==='k'?`[${i+1}] ナレッジ「${r.x.title}」（${r.x.status==='approved'?'公式':'下書き'}）\n${r.x.body}\nトーク：${r.x.ext.talk||''}\n注意：${r.x.ext.caution||''}`
      :`[${i+1}] 業界情報「${r.x.title}」\n${r.x.summary}\n影響：${r.x.impact||''}`).join('\n\n');
    const t=await callAI(AI_BASE,`社員からの質問に答えてください。下の社内ナレッジを最優先の根拠にし、使ったものは文中に[番号]で示してください。社内ナレッジにない内容は「一般的には」と前置きし、制度・数値は（要確認）をつけます。
構成：結論（2〜3文）→ 理由・根拠 → 判断のポイントや確認すべきこと${$('#askTalk').checked?' → お客様向けトーク例（「」付き）':''} → 言ってはいけないこと（あれば）。見出しは【】で書きます。

質問：${q}

社内ナレッジ：
${ctx||'（該当なし）'}`,2500);
    $('#askOut').innerHTML=`<div class="panel"><div class="answer">${esc(t)}</div>
      ${refs.length?`<div class="d-sec">根拠にしたナレッジ・業界情報</div><div class="refs">${refs.map((r,i)=>`<button data-ref="${i}">[${i+1}] ${esc(r.x.title)}</button>`).join('')}</div>`:'<div class="note" style="margin-top:10px">社内に該当するナレッジがありませんでした。一般的な知識での回答です。</div>'}
      <div class="toolbar" style="margin:14px 0 0"><button class="btn gh sm" id="askCp">回答をコピー</button>${canEdit()?'<button class="btn gold sm" id="askSave">QAとして登録（下書き）</button>':''}</div></div>`;
    $$('[data-ref]').forEach(x=>x.onclick=()=>{const r=refs[+x.dataset.ref];r.type==='k'?openK(r.x.id):openInfo(r.x.id);});
    $('#askCp').onclick=()=>copyText(t);
    if($('#askSave'))$('#askSave').onclick=()=>{const rec=blankK();rec.category='qa';rec.title=q;rec.body=t;rec.ext.field=(refs.find(r=>r.type==='k')||{x:{ext:{field:'common'}}}).x.ext.field;rec.ext.source='AIに聞く（要確認）';editK(null,rec);};
  }catch(e){$('#askOut').innerHTML='<div class="err">'+esc(e.message)+'</div>';}
  b.disabled=false; b.textContent='質問する';
};
