<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI利用状況｜EARTHCOM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d2340;--navy2:#163a5f;--navy3:#1f4e7a;--ink:#15202e;--gold:#c8a24a;--gold2:#e3c878;--gold-soft:#f6efd9;
  --muted:#667487;--line:#e2e8ef;--line2:#cdd7e3;--bg:#eef1f5;--surface:#fff;--surface2:#f6f8fb;
  --pos:#1f8a55;--neg:#bf3a2b;--neg-soft:#fbeae7;--warn-soft:#fbf1df;--warn:#a96f14;
  --shadow:0 1px 2px rgba(13,35,64,.07),0 3px 12px rgba(13,35,64,.05);--num:"Barlow Condensed","Noto Sans JP",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6}
button{font-family:inherit;cursor:pointer;border:1px solid transparent;background:none;color:inherit;font-size:inherit}
input{font-family:inherit;font-size:14px}
header{background:var(--navy);color:#fff;box-shadow:0 2px 0 var(--gold);position:sticky;top:0;z-index:10}
.hbar{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:900;font-size:15.5px;letter-spacing:.03em}.brand small{font-weight:500;font-size:11.5px;color:#a9bbcf;margin-left:8px}
.sp{flex:1}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:#fff}
.seg button{padding:7px 13px;font-size:12.5px;font-weight:700;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}.seg button.on{background:var(--navy);color:#fff}
.inp{padding:7px 10px;border:1px solid var(--line2);border-radius:8px;background:#fff;width:110px}
.lbl{font-size:12px;color:var(--muted);font-weight:700;display:inline-flex;align-items:center;gap:6px}
.btn{border-radius:8px;padding:7px 14px;font-size:12.5px;font-weight:700;border:1px solid var(--line2);background:#fff;color:var(--navy)}
.btn:hover{background:var(--surface2)}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
.kpi{background:#fff;border-radius:10px;box-shadow:var(--shadow);padding:13px 15px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:700}
.kpi .v{font-family:var(--num);font-size:32px;font-weight:700;color:var(--navy);line-height:1.1}
.kpi .v small{font-size:15px;color:var(--muted);margin-left:3px}
.kpi .s{font-size:11.5px;color:var(--muted)}
.kpi.err .v{color:var(--neg)}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-bottom:14px}
.panel{background:#fff;border-radius:10px;box-shadow:var(--shadow);padding:15px 17px;margin-bottom:14px}
.grid2 .panel{margin-bottom:0}
.panel h3{font-size:13.5px;font-weight:800;color:var(--navy);margin-bottom:10px;display:flex;gap:8px;align-items:baseline}
.panel h3 .n{font-size:11.5px;color:var(--muted);font-weight:500}
table{width:100%;border-collapse:collapse;font-size:12.8px}
th{font-size:11.5px;color:var(--muted);font-weight:700;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td.name{white-space:normal;font-weight:700;color:var(--navy)}
td.name .f{display:block;font-size:11px;color:var(--muted);font-weight:500}
.share{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.share .bar{width:90px;height:7px;background:#e6ebf1;border-radius:9px;overflow:hidden}
.share .bar i{display:block;height:100%;background:var(--gold)}
.cost{font-weight:800;color:var(--navy)}
.chart{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:6px;border-bottom:1px solid var(--line)}
.chart .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:6px;height:100%;position:relative}
.chart .c i{display:block;width:100%;background:var(--navy3);border-radius:3px 3px 0 0}
.chart .c i.e{background:var(--neg)}
.chart .c:hover i{background:var(--gold)}
.xl{display:flex;gap:3px;font-size:10px;color:var(--muted);margin-top:3px}
.xl span{flex:1;text-align:center;min-width:6px;overflow:hidden}
.note{font-size:11.5px;color:var(--muted);line-height:1.75}
.errl div{padding:7px 0;border-bottom:1px solid var(--line);font-size:12px}
.errl b{color:var(--neg)}
.banner{background:var(--warn-soft);border:1px solid #efd7ad;color:#6c4a10;border-radius:9px;padding:12px 14px;font-size:12.5px;margin-bottom:14px;display:none;line-height:1.8}
.banner.show{display:block}
.sql{background:var(--navy);color:#cfe0f0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;padding:12px;border-radius:8px;white-space:pre-wrap;margin-top:8px}
.tip{position:fixed;pointer-events:none;background:var(--navy);color:#fff;font-size:11.5px;padding:6px 9px;border-radius:6px;display:none;z-index:50;white-space:nowrap}
.empty{color:var(--muted);font-size:12.5px;padding:14px 0;text-align:center}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.share .bar{width:50px}}
</style></head><body>
<header><div class="hbar"><div class="brand">AI利用状況<small>どのアプリ・誰が・どれだけAIを使ったか</small></div><div class="sp"></div><span id="userBadge"></span></div></header>
<main>
  <div class="banner" id="banner"></div>
  <div class="toolbar">
    <div class="seg" id="seg">
      <button data-p="month" class="on">今月</button><button data-p="last">先月</button><button data-p="7">過去7日</button><button data-p="30">過去30日</button>
    </div>
    <div class="sp"></div>
    <label class="lbl">Consoleの使用額 $<input class="inp" id="bill" type="number" step="0.01" min="0" placeholder="例 7.39"></label>
    <label class="lbl">1ドル<input class="inp" id="rate" type="number" step="1" min="1" style="width:70px">円</label>
    <button class="btn" id="reload">更新</button>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="grid2">
    <div class="panel"><h3>アプリ別<span class="n" id="appNote"></span></h3><div id="byApp"></div></div>
    <div class="panel"><h3>日別の使用量<span class="n">棒の高さ＝重み付きトークン、赤＝エラー</span></h3><div id="daily"></div></div>
  </div>
  <div class="grid2">
    <div class="panel"><h3>社員別</h3><div id="byUser"></div></div>
    <div class="panel"><h3>モデル別</h3><div id="byModel"></div>
      <h3 style="margin-top:16px">最近のエラー</h3><div class="errl" id="errs"></div></div>
  </div>
  <p class="note">金額は、Anthropic Console の「今月の使用額」を入力すると、アプリごとの使用量の割合で按分して表示します（目安）。割合は「重み付きトークン＝入力＋出力×5＋キャッシュ書込×1.25＋キャッシュ読込×0.1」で計算しています。出力の文字は入力より料金が高いためです。記録はEdge Functionを更新した日から始まります。それ以前の分はアプリ別には分かりません。</p>
</main>
<div class="tip" id="tip"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./ec-auth.js"></script>
<script>
'use strict';
(function(){
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const SQL=`create table if not exists ai_usage_log (
  id bigserial primary key,
  created_at timestamptz default now(),
  app text, user_email text, model text,
  input_tokens int default 0, output_tokens int default 0,
  cache_read_tokens int default 0, cache_write_tokens int default 0,
  status int, error text, ms int
);
create index if not exists ai_usage_log_created on ai_usage_log (created_at);
alter table ai_usage_log enable row level security;
drop policy if exists "ai_usage_log read" on ai_usage_log;
create policy "ai_usage_log read" on ai_usage_log for select to authenticated using (true);`;
let sb=null, ROWS=[], APPMAP={}, USERMAP={}, PERIOD='month';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=n=>Math.round(n).toLocaleString('ja-JP');
const tk=n=>n>=1e6?(n/1e6).toFixed(n>=1e7?0:1)+'M':n>=1e3?(n/1e3).toFixed(n>=1e4?0:1)+'K':String(Math.round(n));
const W=r=>(r.input_tokens||0)+(r.output_tokens||0)*5+(r.cache_write_tokens||0)*1.25+(r.cache_read_tokens||0)*0.1;
const ls=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v;}catch(e){return d;}};
const lss=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
$('#rate').value=ls('ec_aiu_rate','150'); $('#bill').value=ls('ec_aiu_bill_'+PERIOD,'');

function range(p){
  const now=new Date(); let from,to=new Date(now.getTime()+60000);
  if(p==='month')from=new Date(now.getFullYear(),now.getMonth(),1);
  else if(p==='last'){from=new Date(now.getFullYear(),now.getMonth()-1,1);to=new Date(now.getFullYear(),now.getMonth(),1);}
  else{from=new Date(now.getFullYear(),now.getMonth(),now.getDate()-(+p-1));}
  return {from,to};
}
async function load(){
  $('#kpis').innerHTML='<div class="kpi"><div class="l">読み込み中…</div></div>';
  const {from,to}=range(PERIOD); let all=[],off=0;
  while(true){
    const r=await sb.from('ai_usage_log').select('*').gte('created_at',from.toISOString()).lt('created_at',to.toISOString()).order('created_at',{ascending:true}).range(off,off+999);
    if(r.error){showSetup(r.error);ROWS=[];render();return;}
    all=all.concat(r.data||[]); if(!r.data||r.data.length<1000||all.length>=50000)break; off+=1000;
  }
  $('#banner').classList.remove('show'); ROWS=all; render();
}
function showSetup(err){
  const b=$('#banner');
  b.innerHTML='<b>記録用のテーブルがまだありません。</b> SupabaseのSQL Editorで次のSQLを1回実行してから、Edge Function「ai」を新しいコードに差し替えてください。<div class="sql">'+esc(SQL)+'</div><div style="margin-top:6px">（'+esc(err.message||err)+'）</div>';
  b.classList.add('show');
}
function group(key){
  const m={};
  ROWS.forEach(r=>{const k=key(r)||'（不明）';const g=m[k]=m[k]||{k,n:0,inp:0,out:0,w:0,err:0,last:''};
    g.n++;g.inp+=(r.input_tokens||0)+(r.cache_read_tokens||0)+(r.cache_write_tokens||0);g.out+=r.output_tokens||0;g.w+=W(r);
    if(r.status&&r.status>=400)g.err++; if(r.created_at>g.last)g.last=r.created_at;});
  return Object.values(m).sort((a,b)=>b.w-a.w);
}
function yen(usd){const rate=+$('#rate').value||150;return '約'+nf(usd*rate)+'円';}
function table(rows,label){
  if(!rows.length)return '<div class="empty">この期間の記録はありません</div>';
  const tw=rows.reduce((s,g)=>s+g.w,0)||1, bill=+$('#bill').value||0;
  return `<div style="overflow-x:auto"><table><thead><tr><th>${label}</th><th>回数</th><th>入力</th><th>出力</th><th>割合</th>${bill?'<th>推定金額</th>':''}<th>エラー</th></tr></thead><tbody>
  ${rows.map(g=>{const sh=g.w/tw;return `<tr><td class="name">${g.label||esc(g.k)}</td><td>${nf(g.n)}</td><td>${tk(g.inp)}</td><td>${tk(g.out)}</td>
    <td><div class="share"><span>${(sh*100).toFixed(1)}%</span><span class="bar"><i style="width:${(sh*100).toFixed(1)}%"></i></span></div></td>
    ${bill?`<td class="cost">$${(bill*sh).toFixed(2)}<div class="note">${yen(bill*sh)}</div></td>`:''}<td style="${g.err?'color:var(--neg);font-weight:800':''}">${g.err||''}</td></tr>`;}).join('')}
  </tbody></table></div>`;
}
function render(){
  const n=ROWS.length, inp=ROWS.reduce((s,r)=>s+(r.input_tokens||0)+(r.cache_read_tokens||0)+(r.cache_write_tokens||0),0),
    out=ROWS.reduce((s,r)=>s+(r.output_tokens||0),0), err=ROWS.filter(r=>r.status>=400).length,
    users=new Set(ROWS.map(r=>r.user_email).filter(Boolean)).size, bill=+$('#bill').value||0;
  const credit=ROWS.filter(r=>/credit balance/i.test(r.error||'')).length;
  $('#kpis').innerHTML=`
    <div class="kpi"><div class="l">AIの呼び出し回数</div><div class="v">${nf(n)}<small>回</small></div><div class="s">利用した社員 ${users}人</div></div>
    <div class="kpi"><div class="l">入力トークン</div><div class="v">${tk(inp)}</div><div class="s">AIが読んだ量</div></div>
    <div class="kpi"><div class="l">出力トークン</div><div class="v">${tk(out)}</div><div class="s">AIが書いた量</div></div>
    <div class="kpi err"><div class="l">エラー</div><div class="v">${nf(err)}<small>件</small></div><div class="s">${credit?'うち残高不足 '+credit+'件':'&nbsp;'}</div></div>
    <div class="kpi"><div class="l">期間の使用額（入力値）</div><div class="v">${bill?'$'+bill.toFixed(2):'—'}</div><div class="s">${bill?yen(bill):'右上に入力すると按分します'}</div></div>`;
  const apps=group(r=>r.app); apps.forEach(g=>{const a=APPMAP[g.k];g.label=a?esc(a)+'<span class="f">'+esc(g.k)+'</span>':esc(g.k==='（不明）'?'（不明・ec-auth.js 更新前の呼び出し）':g.k);});
  $('#byApp').innerHTML=table(apps,'アプリ'); $('#appNote').textContent=apps.length?apps.length+'アプリ':'';
  const us=group(r=>r.user_email); us.forEach(g=>{g.label=USERMAP[g.k]?esc(USERMAP[g.k])+'<span class="f">'+esc(g.k)+'</span>':esc(g.k);});
  $('#byUser').innerHTML=table(us,'社員');
  $('#byModel').innerHTML=table(group(r=>r.model),'モデル');
  const errs=ROWS.filter(r=>r.status>=400).slice(-15).reverse();
  $('#errs').innerHTML=errs.length?errs.map(r=>`<div><b>${r.status}</b>　${new Date(r.created_at).toLocaleString('ja-JP')}　${esc(APPMAP[r.app]||r.app||'')}　${esc(USERMAP[r.user_email]||r.user_email||'')}<div class="note">${esc(r.error||'')}</div></div>`).join(''):'<div class="empty">エラーはありません</div>';
  drawDaily();
}
function drawDaily(){
  const {from,to}=range(PERIOD); const days=[]; const d=new Date(from.getFullYear(),from.getMonth(),from.getDate());
  const end=new Date(Math.min(to.getTime(),Date.now()));
  while(d<=end){days.push(new Date(d));d.setDate(d.getDate()+1);}
  const key=x=>x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate();
  const m={}; ROWS.forEach(r=>{const k=key(new Date(r.created_at));m[k]=m[k]||{w:0,n:0,e:0};m[k].w+=W(r);m[k].n++;if(r.status>=400)m[k].e++;});
  const mx=Math.max(1,...days.map(x=>(m[key(x)]||{w:0}).w));
  $('#daily').innerHTML=`<div class="chart">${days.map(x=>{const v=m[key(x)]||{w:0,n:0,e:0};
    return `<div class="c" data-t="${x.getMonth()+1}/${x.getDate()}　${v.n}回　${tk(v.w)}${v.e?'　エラー'+v.e:''}">${v.e&&!v.w?'<i class="e" style="height:4px"></i>':`<i style="height:${Math.max(v.n?2:0,v.w/mx*100)}%"></i>`}</div>`;}).join('')}</div>
    <div class="xl">${days.map((x,i)=>`<span>${(i%Math.ceil(days.length/10)===0)?(x.getMonth()+1)+'/'+x.getDate():''}</span>`).join('')}</div>`;
  $$('.chart .c').forEach(c=>{c.onmousemove=e=>{const t=$('#tip');t.textContent=c.dataset.t;t.style.display='block';t.style.left=(e.clientX+12)+'px';t.style.top=(e.clientY-30)+'px';};c.onmouseleave=()=>$('#tip').style.display='none';});
}
$$('#seg button').forEach(b=>b.onclick=()=>{PERIOD=b.dataset.p;$$('#seg button').forEach(x=>x.classList.toggle('on',x===b));$('#bill').value=ls('ec_aiu_bill_'+PERIOD,'');load();});
$('#bill').oninput=()=>{lss('ec_aiu_bill_'+PERIOD,$('#bill').value);render();};
$('#rate').oninput=()=>{lss('ec_aiu_rate',$('#rate').value);render();};
$('#reload').onclick=load;

async function boot(){
  sb=EC.supabase; if(EC.mountBadge)EC.mountBadge('#userBadge');
  const a=await sb.from('apps').select('id,label,url');
  if(!a.error)(a.data||[]).forEach(x=>{if(x.url)APPMAP[x.url]=x.label;APPMAP[x.id]=APPMAP[x.id]||x.label;});
  const u=await sb.from('app_users').select('email,full_name');
  if(!u.error)(u.data||[]).forEach(x=>{if(x.email)USERMAP[x.email]=x.full_name||x.email;});
  load();
}
EC.guard({app:'ai-usage',name:'AI利用状況',allow:['admin','manager']}).then(boot);
})();
</script></body></html>
