<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ECEDE7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="検印帳">
<link rel="manifest" href="./manabi-techo.webmanifest">
<title>学びの検印帳 — EARTHCOM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ECEDE7;
  --raised:#F7F8F4;
  --ink:#1C2430;
  --ink-soft:#616B79;
  --rule:#CBD1C7;
  --rule-soft:#DDE1D9;
  --seal:#B0392F;
  --grow:#3B6B57;
  --amber:#9C7420;
  --shadow:0 1px 0 rgba(28,36,48,.06), 0 8px 24px -18px rgba(28,36,48,.5);
  --disp:'Shippori Mincho B1', serif;
  --body:'Zen Kaku Gothic New', system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--body);
  font-size:15px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ink)}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.rail{
  width:76px;flex:0 0 76px;
  border-right:1px solid var(--rule);
  background:linear-gradient(180deg,#E4E7DF,#EDEEE8);
  display:flex;flex-direction:column;align-items:center;
  padding:22px 0 18px;gap:26px;
}
.rail .brand{
  writing-mode:vertical-rl;font-family:var(--disp);font-weight:700;
  font-size:20px;letter-spacing:.30em;line-height:1;
}
.rail .brand span{color:var(--seal)}
.rail .rule{width:1px;flex:1;background:var(--rule)}
.rail .who{writing-mode:vertical-rl;font-size:10px;letter-spacing:.24em;color:var(--ink-soft)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}

.tabs{
  display:flex;gap:0;border-bottom:1px solid var(--rule);
  background:var(--raised);position:sticky;top:0;z-index:20;
  overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  appearance:none;background:none;border:0;border-bottom:2px solid transparent;
  padding:15px 22px;cursor:pointer;white-space:nowrap;
  font-family:var(--disp);font-weight:500;font-size:15px;letter-spacing:.10em;color:var(--ink-soft);
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--seal)}
.tab:focus-visible{outline:2px solid var(--seal);outline-offset:-4px}
.tab .n{font-size:11px;color:var(--ink-soft);margin-left:7px;letter-spacing:0}

.page{padding:30px 34px 80px;max-width:1080px;width:100%}
.eyebrow{
  font-size:10px;letter-spacing:.30em;color:var(--ink-soft);
  text-transform:uppercase;margin:0 0 6px;
}
h1{font-family:var(--disp);font-weight:700;font-size:27px;letter-spacing:.06em;margin:0 0 4px}
.lede{color:var(--ink-soft);font-size:13px;margin:0 0 26px;max-width:60ch}

/* ---------- form ---------- */
.sheet{
  background:var(--raised);border:1px solid var(--rule);
  box-shadow:var(--shadow);padding:0;
}
.row{display:flex;border-bottom:1px solid var(--rule-soft)}
.row:last-child{border-bottom:0}
.row > .cell{flex:1;min-width:0;border-left:1px solid var(--rule-soft);padding:14px 16px}
.row > .cell:first-child{border-left:0}
.lab{
  display:block;font-size:10.5px;letter-spacing:.20em;color:var(--ink-soft);
  margin-bottom:7px;
}
.lab em{font-style:normal;color:var(--seal);margin-left:5px;letter-spacing:0}
input[type=text],input[type=date],input[type=number],input[type=url],select,textarea{
  width:100%;background:transparent;border:0;border-bottom:1px dashed var(--rule);
  padding:5px 1px 6px;border-radius:0;
}
textarea{resize:vertical;min-height:34px;line-height:1.6}
input:focus,select:focus,textarea:focus{outline:none;border-bottom-color:var(--seal);border-bottom-style:solid}
select{appearance:none;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='9' height='6'><path d='M0 0h9L4.5 6z' fill='%23616B79'/></svg>") no-repeat right 2px center}
.hint{font-size:11px;color:var(--ink-soft);margin-top:6px}

.chipset{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  border:1px solid var(--rule);background:transparent;padding:5px 11px;
  cursor:pointer;font-size:12.5px;letter-spacing:.04em;border-radius:2px;
}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--raised);border-color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--seal);outline-offset:2px}

.actbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
.btn{
  border:1px solid var(--ink);background:var(--ink);color:var(--raised);
  padding:10px 22px;cursor:pointer;letter-spacing:.10em;font-size:13.5px;border-radius:2px;
}
.btn:hover{background:#0F1620}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:rgba(28,36,48,.06)}
.btn.seal{border-color:var(--seal);background:var(--seal);color:#fff}
.btn.seal:hover{background:#983027}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
.btn.sm{padding:5px 12px;font-size:12px;letter-spacing:.04em}

/* AI candidates */
.cands{margin-top:12px;display:grid;gap:8px}
.cand{
  display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
  border:1px solid var(--rule);background:#fff;padding:11px 13px;cursor:pointer;border-radius:2px;
}
.cand:hover{border-color:var(--seal)}
.cand .k{font-family:var(--disp);color:var(--seal);font-size:13px;flex:0 0 auto}
.cand .d{font-size:11.5px;color:var(--ink-soft);margin-top:3px}

/* ---------- entry cards ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.filters input[type=text]{border:1px solid var(--rule);background:var(--raised);padding:8px 11px;max-width:230px}
.list{display:grid;gap:12px}
.card{
  background:var(--raised);border:1px solid var(--rule);box-shadow:var(--shadow);
  display:grid;grid-template-columns:1fr 96px;
}
.card .body{padding:16px 18px;min-width:0}
.card .meta{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:11px;color:var(--ink-soft);letter-spacing:.06em}
.kind{
  font-family:var(--disp);font-size:11px;letter-spacing:.14em;color:var(--ink);
  border:1px solid var(--rule);padding:1px 8px;
}
.card h3{font-family:var(--disp);font-weight:700;font-size:17px;margin:8px 0 10px;letter-spacing:.03em;line-height:1.45}
.takeaways{margin:0 0 12px;padding:0;list-style:none;display:grid;gap:3px}
.takeaways li{
  font-size:13px;padding-left:20px;position:relative;color:#2A3442;
}
.takeaways li::before{
  content:attr(data-i);position:absolute;left:0;top:0;
  font-family:var(--disp);font-size:11px;color:var(--seal);
}
.action{
  border-top:1px dashed var(--rule);padding-top:11px;display:flex;gap:10px;
  align-items:flex-start;flex-wrap:wrap;
}
.action .txt{flex:1;min-width:180px;font-size:13.5px}
.action .txt b{font-family:var(--disp);font-weight:500;font-size:10.5px;letter-spacing:.20em;color:var(--ink-soft);display:block;margin-bottom:3px}
.status{font-size:11px;letter-spacing:.10em;padding:3px 9px;border:1px solid currentColor;white-space:nowrap}
.st-declared{color:var(--ink-soft)}
.st-doing{color:var(--amber)}
.st-done{color:var(--grow)}
.st-dropped{color:#9AA2AC}
.st-late{color:var(--seal);border-style:solid}
.card .sealbox{
  border-left:1px solid var(--rule-soft);display:flex;align-items:center;justify-content:center;
  padding:12px;
}
.card .ops{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}

/* ---------- 添付 ---------- */
.linkrow{display:flex;gap:8px;align-items:center;margin-bottom:7px;flex-wrap:wrap}
.linkrow input{flex:1;min-width:120px}
.linkrow input[data-f="label"]{max-width:200px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumb{position:relative;width:74px;height:74px;border:1px solid var(--rule);background:#fff}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.thumb .x{
  position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;
  border:1px solid var(--rule);background:var(--raised);cursor:pointer;line-height:1;
  font-size:13px;color:var(--ink-soft);padding:0;
}
.thumb .x:hover{border-color:var(--seal);color:var(--seal)}
.attached{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 12px}
.linkchip{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);
  padding:4px 10px;font-size:12px;text-decoration:none;background:#fff;border-radius:2px;max-width:100%;
}
.linkchip:hover{border-color:var(--seal)}
.linkchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkchip::before{content:"";width:5px;height:5px;background:var(--seal);flex:0 0 5px;transform:rotate(45deg)}
.note{
  border-left:2px solid var(--rule);padding:2px 0 2px 12px;margin:11px 0 0;
  font-size:12.5px;color:#2A3442;white-space:pre-wrap;
}
.note b{display:block;font-family:var(--disp);font-weight:500;font-size:10px;letter-spacing:.20em;color:var(--ink-soft);margin-bottom:3px}
#lb{max-width:min(94vw,900px);width:auto;padding:0;border:0;background:transparent}
#lb img{display:block;max-width:100%;max-height:86vh;object-fit:contain}
#lb::backdrop{background:rgba(20,26,34,.86)}

/* ---------- seal ---------- */
.seal-mark{
  width:60px;height:60px;display:grid;place-items:center;position:relative;
  font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:.02em;
}
.seal-mark::before{
  content:"";position:absolute;inset:0;border:2.5px solid var(--seal);border-radius:50%;
  opacity:.9;
}
.seal-mark{color:var(--seal);transform:rotate(-7deg)}
.seal-mark.again{color:var(--ink-soft);}
.seal-mark.again::before{border-color:var(--ink-soft);border-style:dashed;border-width:1.5px}
.seal-mark.drop{color:#A7AEB6;transform:rotate(0)}
.seal-mark.drop::before{border-color:#C3C9CF;border-width:1px}
.seal-empty{
  width:60px;height:60px;border:1px dashed var(--rule);display:grid;place-items:center;
  font-size:10px;color:var(--ink-soft);letter-spacing:.12em;text-align:center;line-height:1.4;
  background:transparent;cursor:default;border-radius:2px;
}
.seal-empty.due{border-color:var(--seal);color:var(--seal);cursor:pointer}
.seal-empty.due:hover{background:rgba(176,57,47,.07)}

/* ---------- 検印帳 ---------- */
.ledger{
  background:var(--raised);border:1px solid var(--rule);box-shadow:var(--shadow);
  padding:24px;margin-bottom:22px;
}
.ledger h2{font-family:var(--disp);font-size:15px;letter-spacing:.18em;margin:0 0 3px;font-weight:500}
.ledger .sub{font-size:11.5px;color:var(--ink-soft);margin:0 0 20px}
.grid-seals{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px;
}
.grid-seals .cellwrap{display:grid;place-items:center;gap:5px}
.grid-seals .cap{font-size:9.5px;color:var(--ink-soft);text-align:center;line-height:1.3;
  max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin-bottom:22px}
.stat{background:var(--raised);padding:18px 18px 16px}
.stat .k{font-size:10px;letter-spacing:.22em;color:var(--ink-soft)}
.stat .v{font-family:var(--disp);font-weight:700;font-size:33px;line-height:1.15;margin-top:6px;letter-spacing:.02em}
.stat .v small{font-size:14px;font-weight:500;margin-left:2px}
.stat .n{font-size:11px;color:var(--ink-soft);margin-top:2px}
.bars{display:flex;align-items:flex-end;gap:10px;height:120px;padding-top:8px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bars .b .stack{width:100%;max-width:40px;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars .b .fill{background:var(--grow);width:100%}
.bars .b .rest{background:var(--rule);width:100%}
.bars .b .lb{font-size:10px;color:var(--ink-soft);letter-spacing:.04em}

/* ---------- board ---------- */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.col{background:var(--raised);border:1px solid var(--rule);min-height:200px}
.col > h2{
  font-family:var(--disp);font-size:13px;letter-spacing:.18em;font-weight:500;
  margin:0;padding:13px 15px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;
}
.col > h2 span{color:var(--ink-soft);font-size:11px}
.col .items{padding:12px;display:grid;gap:10px}
.mini{border:1px solid var(--rule-soft);background:#fff;padding:11px 12px;border-radius:2px}
.mini .t{font-size:13px;line-height:1.5}
.mini .s{font-size:10.5px;color:var(--ink-soft);margin-top:6px;letter-spacing:.06em;display:flex;justify-content:space-between;gap:8px}
.mini .ops{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.mini.late{border-left:3px solid var(--seal)}
.mini.soon{border-left:3px solid var(--amber)}

.empty{
  border:1px dashed var(--rule);padding:34px 22px;text-align:center;color:var(--ink-soft);
  font-size:13px;background:transparent;
}
.empty b{display:block;font-family:var(--disp);color:var(--ink);font-size:15px;margin-bottom:6px;font-weight:500}

.banner{
  background:#F3E7E4;border:1px solid #E0C4BF;color:#7B2F27;
  padding:9px 14px;font-size:12px;letter-spacing:.04em;
}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--ink);color:var(--raised);padding:11px 22px;font-size:13px;
  letter-spacing:.06em;box-shadow:var(--shadow);z-index:80;
}
dialog{border:1px solid var(--rule);background:var(--raised);box-shadow:0 20px 60px -20px rgba(28,36,48,.6);padding:0;max-width:440px;width:92%}
dialog::backdrop{background:rgba(28,36,48,.35)}
dialog .dh{padding:18px 22px 0}
dialog .db{padding:14px 22px 20px}
dialog h3{font-family:var(--disp);font-size:17px;margin:0 0 4px;letter-spacing:.04em}
dialog p{font-size:12.5px;color:var(--ink-soft);margin:0}
.verdicts{display:grid;gap:8px;margin-top:14px}
.verdict{display:flex;gap:13px;align-items:center;border:1px solid var(--rule);background:#fff;padding:11px 13px;cursor:pointer;text-align:left;border-radius:2px}
.verdict:hover{border-color:var(--seal)}
.verdict .mk{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-size:13px;font-weight:700}
.verdict .mk.keep{border:2px solid var(--seal);color:var(--seal)}
.verdict .mk.again{border:1.5px dashed var(--ink-soft);color:var(--ink-soft)}
.verdict .mk.drop{border:1px solid #C3C9CF;color:#A7AEB6}
.verdict .tx{font-size:13.5px}
.verdict .tx small{display:block;font-size:11px;color:var(--ink-soft);margin-top:1px}

@media (max-width:820px){
  .rail{display:none}
  .page{padding:22px 16px calc(70px + env(safe-area-inset-bottom))}
  .tabs{padding-top:env(safe-area-inset-top)}
  .row{flex-direction:column}
  .row > .cell{border-left:0;border-top:1px solid var(--rule-soft);padding:15px 16px}
  .row > .cell:first-child{border-top:0}
  .card{grid-template-columns:1fr}
  .card .sealbox{border-left:0;border-top:1px solid var(--rule-soft);justify-content:flex-start;padding:12px 18px}
  .board{grid-template-columns:1fr}
  h1{font-size:22px}
  /* iOS が入力時に勝手にズームしないよう 16px 以上にする */
  input[type=text],input[type=date],input[type=number],input[type=url],select,textarea{font-size:16px;padding:8px 1px 9px}
  textarea{min-height:44px}
  .tab{padding:14px 18px}
  .btn{padding:12px 20px}
  .btn.sm{padding:9px 14px}
  .chip{padding:9px 14px}
  .filters input[type=text]{max-width:none;width:100%}
  .grid-seals{grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="shell">
  <nav class="rail" aria-hidden="true">
    <div class="brand">学びの<span>検印</span>帳</div>
    <div class="rule"></div>
    <div class="who" id="railWho">EARTHCOM</div>
  </nav>
  <div class="main">
    <div id="banner"></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="add">記帳</button>
      <button class="tab" role="tab" data-view="index">索引<span class="n" id="cntIndex"></span></button>
      <button class="tab" role="tab" data-view="board">実行板<span class="n" id="cntBoard"></span></button>
      <button class="tab" role="tab" data-view="ledger">検印帳<span class="n" id="cntLedger"></span></button>
    </div>
    <div id="view" class="page"></div>
  </div>
</div>

<dialog id="dlg">
  <div class="dh"><h3 id="dlgTitle">検印</h3><p id="dlgSub"></p></div>
  <div class="db">
    <div class="verdicts">
      <button class="verdict" data-v="keep"><span class="mk keep">定</span><span class="tx">定着した<small>もう自分の型になっている</small></span></button>
      <button class="verdict" data-v="again"><span class="mk again">再</span><span class="tx">もう一度<small>効きそうだが、まだ身についていない</small></span></button>
      <button class="verdict" data-v="drop"><span class="mk drop">要</span><span class="tx">不要だった<small>自分の仕事には効かなかった</small></span></button>
    </div>
    <div style="margin-top:16px">
      <label class="lab" for="dlgNote">振り返りメモ <span style="letter-spacing:0">（任意）</span></label>
      <textarea id="dlgNote" placeholder="何が変わったか。効かなかったなら、その理由。" style="border:1px solid var(--rule);background:#fff;padding:9px 10px;min-height:70px"></textarea>
    </div>
    <div class="actbar"><button class="btn ghost sm" id="dlgClose">閉じる</button></div>
  </div>
</dialog>

<dialog id="lb"><img id="lbImg" src="" alt=""></dialog>

<script type="module">
/* ============================================================
   設定 — デプロイ時にここだけ触る
   ============================================================ */
const SUPABASE_URL  = 'https://aakofrzurgwrkctunthw.supabase.co';
const SUPABASE_KEY  = 'sb_publishable_yAUGrTJjqg56S16D7BI2oQ_pbt1olLa';
const TABLE         = 'learning_log';
const BUCKET        = 'manabi-techo';           // 写真の置き場（Supabase Storage・非公開）
const OWNER_EMAIL   = 'hankyo@earthcom-eco.jp';   // 社長個人ログ。EC認証があればログイン者で上書き
const REVIEW_DAYS   = 30;                          // 何日後に検印するか
// AI（アウトプット案の自動提案）の呼び先。
//   日報アプリで使っている既存の中継 `ai` をそのまま借りている。
//   受け口は { prompt, system, max_tokens }。Authorization ヘッダ必須。
const AI_ENDPOINT   = 'https://aakofrzurgwrkctunthw.supabase.co/functions/v1/ai';

const KINDS = ['研修','動画','書籍','セミナー','現場・同行','失敗経験'];

/* ============================================================
   保存層（Supabase / メモリ）
   ============================================================ */
let sb = null, MODE = 'memory', mem = [];

async function initStore(){
  try{
    const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    sb = createClient(SUPABASE_URL, SUPABASE_KEY);
    const { error } = await sb.from(TABLE).select('id').limit(1);
    if(error) throw error;
    MODE = 'supabase';
  }catch(e){
    MODE = 'memory';
    mem = seed();
    document.getElementById('banner').innerHTML =
      '<div class="banner">お試しモードで表示しています。保存はされません。（Supabase の '+TABLE+' テーブル作成とログインが済むと本番モードになります）</div>';
  }
}
async function listAll(){
  if(MODE==='memory') return [...mem];
  const { data, error } = await sb.from(TABLE).select('*')
    .eq('owner_email', OWNER_EMAIL).order('learned_on',{ascending:false});
  if(error){ toast('読み込みに失敗しました'); return []; }
  return data;
}
async function saveNew(rec){
  if(MODE==='memory'){ mem.unshift({...rec, id:crypto.randomUUID()}); return; }
  const { error } = await sb.from(TABLE).insert(rec);
  if(error){ toast('保存できませんでした: '+error.message); throw error; }
}
async function patch(id, fields){
  if(MODE==='memory'){ const i=mem.findIndex(r=>r.id===id); if(i>-1) mem[i]={...mem[i],...fields}; return; }
  const { error } = await sb.from(TABLE).update(fields).eq('id',id);
  if(error){
    const miss = /column .*(links|photos|review_note)/.test(error.message||'');
    toast(miss ? '列がまだありません。learning_log_v2.sql を実行してください'
               : '更新できませんでした: ' + (error.message||''));
    console.error('[update]', error);
    throw error;
  }
}

const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today = () => new Date().toISOString().slice(0,10);
const addDays = (d,n)=>{const t=new Date(d);t.setDate(t.getDate()+n);return t.toISOString().slice(0,10)};
const daysBetween = (a,b)=>Math.round((new Date(b)-new Date(a))/86400000);
const fmtDate = d => d ? d.slice(5).replace('-','.') : '';
function toast(msg){
  const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  document.body.appendChild(el); setTimeout(()=>el.remove(),2600);
}

function actionState(r){
  if(r.action_status==='done')    return {cls:'st-done',    label:'実行ずみ'};
  if(r.action_status==='dropped') return {cls:'st-dropped', label:'取り下げ'};
  if(r.action_due && r.action_due < today()) return {cls:'st-late', label:'期限ごえ'};
  if(r.action_status==='doing')   return {cls:'st-doing',   label:'着手ずみ'};
  return {cls:'st-declared', label:'宣言のみ'};
}
function reviewDue(r){
  return r.action_status==='done' && !r.review_verdict &&
         r.action_done_on && daysBetween(r.action_done_on, today()) >= REVIEW_DAYS;
}

function blankDraft(){
  return { id:null, kind:KINDS[0], title:'', source_url:'', learned_on:today(), minutes:'',
    takeaways:['','',''], use_scene:'', action:'', action_due:addDays(today(),14),
    links:[], photos:[], action_status:'declared', action_result:'', review_note:'' };
}
function draftFromRow(r){
  const t=(r.takeaways||[]).slice(0,3); while(t.length<3) t.push('');
  return { id:r.id, kind:r.kind||KINDS[0], title:r.title||'', source_url:r.source_url||'',
    learned_on:r.learned_on||today(), minutes:r.minutes??'', takeaways:t,
    use_scene:r.use_scene||'', action:r.action||'', action_due:r.action_due||'',
    links:(r.links||[]).map(x=>({label:x.label||'',url:x.url||''})), photos:[...(r.photos||[])],
    action_status:r.action_status||'declared', action_result:r.action_result||'', review_note:r.review_note||'' };
}
function photoSrc(p){
  if(!p) return '';
  if(p.startsWith('blob:')||p.startsWith('http')) return p;
  return signed[p] || '';
}
async function signPhotos(paths){
  const need = paths.filter(p=>p && !p.startsWith('blob:') && !p.startsWith('http') && !signed[p]);
  if(!need.length || MODE!=='supabase') return;
  const { data } = await sb.storage.from(BUCKET).createSignedUrls(need, 3600);
  (data||[]).forEach(d=>{ if(d.path && d.signedUrl) signed[d.path]=d.signedUrl; });
}

async function onPhoto(e){
  const files=[...e.target.files]; e.target.value='';
  const note=$('#upNote');
  for(const f of files){
    if(f.size > 8*1024*1024){ toast('8MBを超える写真は貼れません'); continue; }
    if(MODE!=='supabase'){ draft.photos.push(URL.createObjectURL(f)); continue; }
    note.textContent='写真を送っています…';
    const ext=(f.name.split('.').pop()||'jpg').toLowerCase();
    const path=`${OWNER_EMAIL}/${crypto.randomUUID()}.${ext}`;
    const { error } = await sb.storage.from(BUCKET).upload(path, f, {contentType:f.type||'image/jpeg'});
    if(error){ toast('写真を送れませんでした'); continue; }
    await signPhotos([path]);
    draft.photos.push(path);
  }
  note.textContent='';
  renderAttach();
}

function syncDraft(){
  draft.title=$('#i_title').value.trim();
  draft.source_url=$('#i_url').value.trim();
  draft.learned_on=$('#i_date').value||today();
  draft.minutes=$('#i_min').value;
  draft.takeaways=[$('#i_t1').value,$('#i_t2').value,$('#i_t3').value];
  draft.use_scene=$('#i_scene').value.trim();
  draft.action=$('#i_action').value.trim();
  draft.action_due=$('#i_due').value;
  if($('#i_status')){
    draft.action_status=$('#i_status').value;
    draft.action_result=$('#i_result').value.trim();
    draft.review_note=$('#i_note').value.trim();
  }
}

function draftToRecord(){
  const r = {
    kind: draft.kind,
    title: draft.title,
    source_url: draft.source_url || null,
    learned_on: draft.learned_on,
    minutes: draft.minutes!=='' && draft.minutes!==null ? Number(draft.minutes) : null,
    takeaways: draft.takeaways.map(t=>t.trim()).filter(Boolean),
    use_scene: draft.use_scene || null,
    links: draft.links.filter(l=>l.url.trim()).map(l=>({label:(l.label.trim()||l.url.trim()), url:l.url.trim()})),
    photos: draft.photos.filter(p=>!p.startsWith('blob:')),
    action: draft.action,
    action_due: draft.action_due || null,
  };
  if(draft.id){
    r.action_status = draft.action_status;
    r.action_result = draft.action_result || null;
    r.review_note   = draft.review_note || null;
    if(draft.action_status==='done'){
      const cur = cache.find(x=>x.id===draft.id);
      r.action_done_on = cur?.action_done_on || today();
    }
  }
  return r;
}

async function onSave(){
  syncDraft();
  if(!draft.title){ toast('表題を入れてください'); $('#i_title').focus(); return; }
  if(!draft.action){ toast('アウトプット宣言がないと記帳できません'); $('#i_action').focus(); return; }
  const rec = draftToRecord();
  try{
    if(draft.id){ await patch(draft.id, rec); toast('なおしました'); }
    else{ await saveNew({...rec, owner_email:OWNER_EMAIL, action_status:'declared'}); toast('記帳しました'); }
  }catch(e){ return; }
  draft = blankDraft();
  render('index');
}

/* ai 関数の返り方（素通し / 整形済み）どちらでも本文を取り出す */
function extractText(data){
  if(!data) return '';
  if(typeof data === 'string') return data;
  if(Array.isArray(data.content)) return data.content.filter(b=>b.type==='text').map(b=>b.text).join('\n');
  return data.text || data.result || data.output || data.answer || data.message || '';
}

async function onAI(){
  syncDraft();
  const v = { kind:draft.kind, title:draft.title, use_scene:draft.use_scene,
              takeaways:draft.takeaways.map(t=>t.trim()).filter(Boolean) };
  if(!v.title && !v.takeaways.length){ toast('表題か学びを入れてください'); return; }
  const btn=$('#aiBtn'); btn.disabled=true; const old=btn.textContent; btn.textContent='考えています…';
  $('#cands').innerHTML='';
  const system = 'あなたは再生可能エネルギー事業会社アースコムの社長の学習パートナーです。'
    + '指示された形式を厳密に守り、JSON以外は一切出力しません。';
  const prompt = `以下のインプットに対して、社長本人が実際にやれるアウトプット行動を3案出してください。

種類: ${v.kind}
表題: ${v.title}
学び: ${v.takeaways.join(' / ') || '(未記入)'}
使う場面: ${v.use_scene || '(未記入)'}

条件:
- 「意識する」「心がける」など測れない表現は禁止。誰が見ても実行の有無が判定できる行動にする。
- 社長の立場（経営会議、部門長への指示、商談同行、社内資料や仕組みづくり）で成立する内容にする。
- 各案は40字以内。
- 期限の目安は3日/1週間/1か月のいずれか。
JSON配列のみを返す。前置き・コードフェンス禁止。形式:
[{"action":"...","due":"1週間","why":"20字程度の狙い"}]`;
  try{
    // ai 関数は Authorization ヘッダが無いと401を返す。
    // ログイン中ならそのトークン、無ければ公開キーを付ける。
    let bearer = SUPABASE_KEY;
    try{
      const { data } = await sb?.auth?.getSession() ?? {};
      if(data?.session?.access_token) bearer = data.session.access_token;
    }catch(_){}
    const res = await fetch(AI_ENDPOINT,{
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+bearer },
      body: JSON.stringify({ prompt, system, max_tokens:1000 })
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    const text = extractText(data);
    const arr = JSON.parse(text.replace(/```json|```/g,'').trim());
    $('#cands').innerHTML = arr.slice(0,3).map((c,i)=>`
      <button type="button" class="cand" data-a="${esc(c.action)}" data-d="${esc(c.due||'')}">
        <span class="k">${['一','二','三'][i]}</span>
        <span><span>${esc(c.action)}</span><span class="d">${esc(c.why||'')}${c.due?' ／ 目安 '+esc(c.due):''}</span></span>
      </button>`).join('');
    $('#cands').querySelectorAll('.cand').forEach(el=>el.onclick=()=>{
      $('#i_action').value = el.dataset.a;
      const map = {'3日':3,'1週間':7,'1か月':30,'1ヶ月':30};
      if(map[el.dataset.d]) $('#i_due').value = addDays(today(), map[el.dataset.d]);
      $('#cands').innerHTML='';
      $('#i_action').focus();
    });
  }catch(e){
    $('#aiNote').textContent = '案を取得できませんでした。手で書いてください。';
  }finally{ btn.disabled=false; btn.textContent=old; }
}

  return `<div class="mini ${late?'late':soon?'soon':''}">
    <div class="t">${esc(r.action)}</div>
    <div class="s"><span>${esc(r.title)}</span><span>${r.action_due?fmtDate(r.action_due):''}</span></div>
    <div class="ops">${opsHTML(r)}</div>
  </div>`;
}
function viewBoard(rows){
  const declared = rows.filter(r=>r.action_status==='declared');
  const doing    = rows.filter(r=>r.action_status==='doing');
  const done     = rows.filter(r=>r.action_status==='done').slice(0,8);
  const col=(t,arr,note)=>`<section class="col"><h2>${t}<span>${arr.length}</span></h2><div class="items">${
    arr.length?arr.map(miniHTML).join(''):`<div class="empty" style="padding:22px 12px">${note}</div>`}</div></section>`;
  return `
  <p class="eyebrow">実行板</p>
  <h1>宣言したことは、やったか</h1>
  <p class="lede">期限をこえた宣言には左に朱の線が入ります。ここが赤いままなら、インプットが増えても何も変わっていないということです。</p>
  <div class="board">
    ${col('宣言',declared,'宣言待ちはありません')}
    ${col('着手',doing,'着手中はありません')}
    ${col('実行ずみ',done,'まだありません')}
  </div>`;
}

/* ============================================================
   画面：検印帳
   ============================================================ */
function viewLedger(rows){
  const withAction = rows.filter(r=>r.action);
  const done = rows.filter(r=>r.action_status==='done');
  const reviewed = rows.filter(r=>r.review_verdict);
  const kept = rows.filter(r=>r.review_verdict==='keep');
  const rate = withAction.length? Math.round(done.length/withAction.length*100):0;
  const keepRate = reviewed.length? Math.round(kept.length/reviewed.length*100):0;
  const hours = Math.round(rows.reduce((s,r)=>s+(r.minutes||0),0)/60);

  const cells = rows.filter(r=>r.review_verdict || reviewDue(r)).slice(0,40).map(r=>{
    const mk = r.review_verdict
      ? `<div class="seal-mark ${r.review_verdict==='keep'?'':r.review_verdict}">${({keep:'定',again:'再',drop:'要'})[r.review_verdict]}</div>`
      : `<button class="seal-empty due" data-review="${r.id}">検印<br>待ち</button>`;
    return `<div class="cellwrap">${mk}<div class="cap" title="${esc(r.title)}">${esc(r.title)}</div></div>`;
  }).join('');

  // 月別：インプット件数と実行件数
  const months=[]; const now=new Date();
  for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push(d.toISOString().slice(0,7));}
  const mdata = months.map(m=>({
    m, all: rows.filter(r=>(r.learned_on||'').startsWith(m)).length,
    done: rows.filter(r=>(r.learned_on||'').startsWith(m) && r.action_status==='done').length
  }));
  const max = Math.max(1,...mdata.map(d=>d.all));

  return `
  <p class="eyebrow">検印帳</p>
  <h1>身についたものだけが残る</h1>
  <p class="lede">実行から${REVIEW_DAYS}日たったものに検印を押します。押した印だけが、あなたの能力として残った分です。</p>

  <div class="ledger">
    <h2>検 印 欄</h2>
    <p class="sub">定＝定着した／再＝もう一度／要＝不要だった</p>
    ${cells? `<div class="grid-seals">${cells}</div>`
      : `<div class="empty"><b>まだ押せる印がありません</b>宣言を実行し、${REVIEW_DAYS}日たつとここに枠が出ます。</div>`}
  </div>

  <div class="stats">
    <div class="stat"><div class="k">インプット</div><div class="v">${rows.length}<small>件</small></div><div class="n">のべ ${hours} 時間</div></div>
    <div class="stat"><div class="k">実行率</div><div class="v">${rate}<small>%</small></div><div class="n">宣言 ${withAction.length} 件中 ${done.length} 件</div></div>
    <div class="stat"><div class="k">定着率</div><div class="v">${keepRate}<small>%</small></div><div class="n">検印 ${reviewed.length} 件中 ${kept.length} 件</div></div>
    <div class="stat"><div class="k">検印待ち</div><div class="v">${rows.filter(reviewDue).length}<small>件</small></div><div class="n">${REVIEW_DAYS}日を過ぎたもの</div></div>
  </div>

  <div class="ledger">
    <h2>月 別</h2>
    <p class="sub">濃い部分が、実行まで到達した件数</p>
    <div class="bars">
      ${mdata.map(d=>`<div class="b">
        <div class="stack">
          <div class="rest" style="height:${(d.all-d.done)/max*100}%"></div>
          <div class="fill" style="height:${d.done/max*100}%"></div>
        </div>
        <div class="lb">${d.m.slice(5)}月</div>
      </div>`).join('')}
    </div>
  </div>`;
}

/* ============================================================
   検印ダイアログ
   ============================================================ */
let reviewTarget=null;
function openReview(r){
  reviewTarget=r;
  $('#dlgTitle').textContent = r.review_verdict ? '検印しなおす' : '検印';
  $('#dlgSub').textContent=r.title;
  $('#dlgNote').value = r.review_note || '';
  $('#dlg').showModal();
}
$('#dlgClose').onclick=()=>$('#dlg').close();
$('#lb').onclick=()=>$('#lb').close();
document.querySelectorAll('.verdict').forEach(b=>b.onclick=async()=>{
  if(!reviewTarget) return;
  await patch(reviewTarget.id,{
    review_verdict:b.dataset.v, reviewed_at:today(),
    review_note:$('#dlgNote').value.trim() || null
  });
  $('#dlg').close(); toast('検印しました'); render(current);
});

/* ============================================================
   ルーティング
   ============================================================ */
let current='add', cache=[];

async function render(v){
  current=v;
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', t.dataset.view===v));
  const el=$('#view');
  if(v==='add'){ el.innerHTML=viewAdd(); bindAdd(); return; }
  cache = await listAll();
  await signPhotos(cache.flatMap(r=>r.photos||[]));
  $('#cntIndex').textContent = cache.length||'';
  $('#cntBoard').textContent = cache.filter(r=>r.action_status==='declared'||r.action_status==='doing').length||'';
  $('#cntLedger').textContent = cache.filter(reviewDue).length||'';
  el.innerHTML = v==='index'?viewIndex(cache) : v==='board'?viewBoard(cache) : viewLedger(cache);
  if(v==='index'){
    $('#q').oninput=e=>{filterQ=e.target.value; const p=e.target.selectionStart; render('index').then(()=>{const q=$('#q');q.focus();q.setSelectionRange(p,p)});};
    el.querySelectorAll('[data-fk]').forEach(b=>b.onclick=()=>{filterKind=b.dataset.fk; render('index')});
  }
}

document.addEventListener('click', async e=>{
  const big=e.target.closest('[data-big]');
  if(big && big.dataset.big){ $('#lbImg').src=big.dataset.big; $('#lb').showModal(); return; }
  const tab=e.target.closest('.tab'); if(tab){ render(tab.dataset.view); return; }
  const ed=e.target.closest('[data-edit]');
  if(ed){ const r=cache.find(x=>x.id===ed.dataset.edit); if(r) startEdit(r); return; }
  const rev=e.target.closest('[data-review]');
  if(rev){ const r=cache.find(x=>x.id===rev.dataset.review); if(r) openReview(r); return; }
  const done=e.target.closest('[data-done]');
  if(done){ await patch(done.dataset.done,{action_status:'done', action_done_on:today()}); toast('実行を記録しました'); render(current); return; }
  const set=e.target.closest('[data-set]');
  if(set){ const o=JSON.parse(set.dataset.set); const {id,...f}=o; await patch(id,f); render(current); return; }
});
