<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>進捗報告スタジオ｜アースコム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho+B1:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#FBFBF7; --card:#FFFFFF; --ink:#2A2A26; --ink-soft:#7C7C70;
  --line:#E5E3D9; --pine:#1F4A3C; --pine-soft:#EAF1ED; --sun:#E3B23C;
  --alert:#B5442F; --alert-soft:#FBEDE9;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Zen Kaku Gothic New',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.7;}
h1,h2,h3{font-family:'Shippori Mincho B1',serif;font-weight:700;margin:0;letter-spacing:.04em;}
button{font-family:inherit;}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 80px;}

/* ---- ヘッダー ---- */
header{background:var(--pine);color:#fff;padding:14px 0;}
header .wrap{display:flex;align-items:center;gap:12px;padding-bottom:0;flex-wrap:wrap;}
header .logo{font-family:'Shippori Mincho B1',serif;font-size:16px;letter-spacing:.1em;flex:1;min-width:200px;}
header .who{font-size:12px;opacity:.8;}
.ghost{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;padding:5px 12px;font-size:12px;cursor:pointer;}
.ghost:hover{background:rgba(255,255,255,.12);}

/* ---- 共通パーツ ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px;}
.card > h2{font-size:15px;color:var(--pine);margin-bottom:4px;}
.sub{font-size:12px;color:var(--ink-soft);}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.btn{border:none;border-radius:9px;padding:8px 16px;font-weight:700;font-size:13px;cursor:pointer;background:var(--pine);color:#fff;}
.btn:hover{opacity:.88;}
.btn-o{background:#fff;color:var(--pine);border:1px solid var(--pine);}
.btn-s{background:var(--sun);color:#3A2A08;}
.btn-d{background:#fff;color:var(--alert);border:1px solid #E6C4BC;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
label.f{display:block;font-size:12px;color:var(--ink-soft);margin:12px 0 4px;font-weight:500;}
input,select,textarea{font-family:inherit;font-size:14px;width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:#fff;color:var(--ink);}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pine-soft);border-color:var(--pine);}
textarea{resize:vertical;min-height:70px;line-height:1.7;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px;}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr;}}
.hint{font-size:11px;color:var(--ink-soft);}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 10px;}
.badge.pub{background:var(--pine-soft);color:var(--pine);}
.badge.draft{background:#F2F1EA;color:var(--ink-soft);}

/* ---- ログイン ---- */
#login{max-width:380px;margin:14vh auto;padding:0 20px;}
#login .card{margin-top:0;padding:26px;}
#login h1{font-size:19px;color:var(--pine);text-align:center;}
#login p.lead{text-align:center;font-size:12px;color:var(--ink-soft);margin:6px 0 18px;}

/* ---- 案件リスト ---- */
.proj-line{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:11px 0;border-top:1px solid var(--line);}
.proj-line:first-of-type{border-top:none;}
.proj-line .nm{flex:1;min-width:180px;font-weight:700;}
.url-box{margin-top:12px;background:#F7F7F1;border:1px dashed var(--line);border-radius:10px;padding:11px 13px;font-size:12px;word-break:break-all;color:var(--ink-soft);}
.url-box b{color:var(--ink);}

/* ---- 報告リスト ---- */
.rep-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line);}
.rep-meta{flex:1;min-width:210px;}
.rep-meta .d{font-weight:700;}
.rep-actions{display:flex;gap:7px;flex-wrap:wrap;}

/* ---- エディタの繰り返し行 ---- */
.item{border:1px solid var(--line);border-radius:11px;padding:12px;margin-top:9px;background:#FDFDFA;}
.item .top{display:flex;gap:8px;align-items:center;}
.item .top .no{font-family:'Shippori Mincho B1',serif;color:var(--sun);font-size:13px;width:22px;}
.x{border:none;background:transparent;color:var(--alert);cursor:pointer;font-size:12px;padding:3px 6px;}
.add{background:#fff;border:1px dashed var(--pine);color:var(--pine);border-radius:9px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;margin-top:9px;}
.sec-h{font-family:'Shippori Mincho B1',serif;font-size:14px;color:var(--pine);margin:22px 0 2px;padding-top:16px;border-top:1px solid var(--line);}

/* ---- プレビュー ---- */
#modal{position:fixed;inset:0;background:rgba(20,25,22,.55);display:none;z-index:50;padding:18px;}
#modal .box{background:#fff;border-radius:14px;max-width:900px;height:100%;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;}
#modal .mh{display:flex;gap:8px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);}
#modal .mh span{flex:1;font-family:'Shippori Mincho B1',serif;font-size:14px;color:var(--pine);}
#pvFrame{flex:1;border:none;width:100%;}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--pine);color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:80;}
#toast.on{opacity:1;}
.empty{padding:26px 0;text-align:center;color:var(--ink-soft);font-size:13px;}
</style>

<!-- ===== EARTHCOM 共通認証（社員アカウント） ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./ec-auth.js"></script>
</head>
<body>

<!-- ============ ログイン ============ -->
<!-- 旧ログイン画面は廃止。会社のGoogleアカウントでログインします -->
<div id="login" style="display:none"></div>

<!-- ============ 本体 ============ -->
<div id="app" style="display:none">
  <header>
    <div class="wrap">
      <div class="logo">進捗報告スタジオ</div>
      <div class="who" id="whoami"></div>
      <button class="ghost" onclick="doLogout()">ログアウト</button>
    </div>
  </header>

  <div class="wrap">

    <!-- 案件 -->
    <div class="card">
      <h2>案件</h2>
      <p class="sub">発電所ごとに1件登録します。お客様用URLは案件ごとに発行されます。</p>
      <div id="projList"></div>
      <div style="margin-top:14px" class="row">
        <button class="btn btn-o" onclick="toggleNewProj()">＋ 新規案件を登録</button>
      </div>
      <div id="newProj" style="display:none;margin-top:12px;border-top:1px solid var(--line);padding-top:6px">
        <div class="grid3">
          <div><label class="f">発電所名（必須）</label><input id="npName" placeholder="埼玉いわつき発電所"></div>
          <div><label class="f">顧客名</label><input id="npCust" placeholder="〇〇 様"></div>
          <div><label class="f">工事期間の表記</label><input id="npPeriod" placeholder="2026年5月7日〜"></div>
        </div>
        <div class="row" style="margin-top:14px">
          <button class="btn" onclick="createProj()">登録する</button>
          <button class="btn btn-o" onclick="toggleNewProj()">やめる</button>
        </div>
      </div>
    </div>

    <!-- 選択中案件 -->
    <div class="card" id="curCard" style="display:none">
      <h2 id="curName">－</h2>
      <p class="sub" id="curSub"></p>
      <div class="url-box">
        <b>お客様用URL</b>（このURLを知っている方が閲覧できます。公開中の報告のみ表示されます）<br>
        <span id="viewUrl"></span>
        <div class="row" style="margin-top:9px">
          <button class="btn btn-o" onclick="copyUrl()">URLをコピー</button>
          <button class="btn btn-o" onclick="window.open(document.getElementById('viewUrl').textContent,'_blank')">開いて確認</button>
        </div>
      </div>
    </div>

    <!-- 報告一覧 -->
    <div class="card" id="repCard" style="display:none">
      <h2>報告の履歴</h2>
      <p class="sub">「公開する」を押すとお客様URLに表示されます。</p>
      <div id="repList"></div>
      <div class="row" style="margin-top:14px">
        <button class="btn" onclick="newReport(true)">＋ 新規報告（前回をコピー）</button>
        <button class="btn btn-o" onclick="newReport(false)">＋ 白紙から作る</button>
      </div>
    </div>

    <!-- エディタ -->
    <div class="card" id="editor" style="display:none">
      <h2 id="edTitle">報告書の作成</h2>

      <div class="grid3">
        <div><label class="f">報告日</label><input id="rDate" type="date"></div>
        <div><label class="f">工事ステータス</label>
          <select id="rStatus">
            <option>着工前</option><option>着工中</option><option>仕上げ工程</option>
            <option>試験・検査中</option><option>発電再開</option><option>完工</option>
          </select>
        </div>
        <div><label class="f">進捗率（％）</label><input id="rPct" type="number" min="0" max="100"></div>
      </div>

      <label class="f">お知らせ見出し（1行）</label>
      <input id="rLead" placeholder="工事は予定どおり進んでおります">
      <label class="f">見出しの補足</label>
      <textarea id="rLeadSub" placeholder="5月7日の着工より、資材の納品および更新工事を順調に進めております。"></textarea>

      <div class="sec-h">工程</div>
      <p class="hint">状態は「完了／実施中／これから」を選びます。</p>
      <div id="phaseList"></div>
      <button class="add" onclick="addPhase()">＋ 工程を追加</button>

      <div class="sec-h">今回実施した作業</div>
      <div id="workList"></div>
      <button class="add" onclick="addWork()">＋ 作業を追加</button>

      <div class="sec-h">今後の予定</div>
      <div id="schList"></div>
      <button class="add" onclick="addSch()">＋ 予定を追加</button>

      <div class="sec-h">各種手続き・試験</div>
      <div id="procList"></div>
      <button class="add" onclick="addProc()">＋ 手続きを追加</button>

      <div class="sec-h">ご確認事項・次回報告</div>
      <label class="f">ご確認事項（お客様にお願いしたいこと。無ければ空欄）</label>
      <textarea id="rNote"></textarea>
      <div class="grid2">
        <div><label class="f">次回報告日（必須）</label><input id="rNext" type="date"></div>
        <div><label class="f">公開状態</label>
          <select id="rPub"><option value="false">下書き（お客様には非表示）</option><option value="true">公開中</option></select>
        </div>
      </div>

      <div class="row" style="margin-top:20px">
        <button class="btn" onclick="saveReport()">保存する</button>
        <button class="btn btn-o" onclick="preview()">プレビュー</button>
        <button class="btn btn-o" onclick="closeEditor()">閉じる</button>
      </div>
    </div>

  </div>
</div>

<!-- プレビュー -->
<div id="modal">
  <div class="box">
    <div class="mh">
      <span>報告書プレビュー</span>
      <button class="btn btn-s" onclick="printPreview()">PDF保存・印刷</button>
      <button class="btn btn-o" onclick="closeModal()">閉じる</button>
    </div>
    <iframe id="pvFrame"></iframe>
  </div>
</div>

<div id="toast"></div>

<script>
/* ================= 接続 ================= */
const SUPABASE_URL = "https://aakofrzurgwrkctunthw.supabase.co";
const SUPABASE_KEY = "sb_publishable_yAUGrTJjqg56S16D7BI2oQ_pbt1olLa";
/* 認証済みの共通クライアントを使う（ログインした社員の権限で読み書きする） */
const sb = (window.EC&&EC.supabase) ? EC.supabase : supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let projects=[], curProj=null, reports=[], curRep=null;

/* ================= 認証 ================= */
/* ===== 認証ゲート：会社のGoogleアカウントでログイン ===== */
(async()=>{
  await EC.guard({ allow:['admin','manager','sales','field'] });
  const {data:{session}} = await sb.auth.getSession();
  enterApp(session);
})();

/* doLogin は廃止。会社のGoogleアカウントでログインします（ec-auth.js） */
async function doLogout(){ EC.signOut(); }
function enterApp(session){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('whoami').textContent=(window.EC&&EC.me)?(EC.me.full_name||EC.me.email):(session&&session.user?session.user.email:'');
  loadProjects();
}

/* ================= 案件 ================= */
async function loadProjects(){
  const {data,error}=await sb.from('progress_projects').select('*').order('created_at',{ascending:false});
  if(error){ toast("案件を読み込めませんでした："+error.message); return; }
  projects=data||[];
  const el=document.getElementById('projList'); el.innerHTML='';
  if(!projects.length){ el.innerHTML='<div class="empty">案件がまだありません。下のボタンから登録してください。</div>'; return; }
  projects.forEach(p=>{
    const d=document.createElement('div'); d.className='proj-line';
    d.innerHTML=`<div class="nm">${esc(p.name)}<div class="hint">${esc(p.customer_name||'顧客名 未設定')}　${esc(p.construction_period||'')}</div></div>
      <button class="btn ${curProj&&curProj.id===p.id?'':'btn-o'}" onclick="selectProj('${p.id}')">${curProj&&curProj.id===p.id?'選択中':'この案件を開く'}</button>`;
    el.appendChild(d);
  });
}
function toggleNewProj(){
  const n=document.getElementById('newProj');
  n.style.display = n.style.display==='none' ? 'block' : 'none';
}
async function createProj(){
  const name=document.getElementById('npName').value.trim();
  if(!name){ toast("発電所名を入力してください。"); return; }
  const {data,error}=await sb.from('progress_projects').insert({
    name, customer_name:document.getElementById('npCust').value.trim(),
    construction_period:document.getElementById('npPeriod').value.trim()
  }).select().single();
  if(error){ toast("登録できませんでした："+error.message); return; }
  document.getElementById('npName').value=document.getElementById('npCust').value=document.getElementById('npPeriod').value='';
  toggleNewProj(); toast("案件を登録しました");
  await loadProjects(); selectProj(data.id);
}
function selectProj(id){
  curProj=projects.find(p=>p.id===id); if(!curProj) return;
  document.getElementById('curCard').style.display='block';
  document.getElementById('repCard').style.display='block';
  document.getElementById('curName').textContent=curProj.name;
  document.getElementById('curSub').textContent=[curProj.customer_name,curProj.construction_period].filter(Boolean).join('　／　');
  document.getElementById('viewUrl').textContent=viewUrl(curProj.token);
  closeEditor(); loadProjects(); loadReports();
  document.getElementById('curCard').scrollIntoView({behavior:'smooth',block:'start'});
}
function viewUrl(token){ return new URL('progress_view.html',location.href).href+'?t='+token; }
function copyUrl(){
  const t=document.getElementById('viewUrl').textContent;
  navigator.clipboard.writeText(t).then(()=>toast("URLをコピーしました")).catch(()=>toast("コピーできませんでした。URLを手で選択してください。"));
}

/* ================= 報告一覧 ================= */
async function loadReports(){
  const {data,error}=await sb.from('progress_reports').select('*')
    .eq('project_id',curProj.id).order('report_date',{ascending:false});
  if(error){ toast("報告を読み込めませんでした："+error.message); return; }
  reports=data||[];
  const el=document.getElementById('repList'); el.innerHTML='';
  if(!reports.length){ el.innerHTML='<div class="empty">報告がまだありません。下のボタンから1件目を作成してください。</div>'; return; }
  reports.forEach(r=>{
    const row=document.createElement('div'); row.className='rep-row';
    row.innerHTML=`<div class="rep-meta">
        <span class="d">${fmt(r.report_date)}</span>
        <span class="badge ${r.published?'pub':'draft'}">${r.published?'公開中':'下書き'}</span>
        <div class="hint">進捗 ${r.progress_pct||0}％・${esc(r.status||'')}　／　次回報告 ${r.next_report_date?fmt(r.next_report_date):'未入力'}</div>
      </div>
      <div class="rep-actions">
        <button class="btn btn-o" onclick="openReport('${r.id}')">編集</button>
        <button class="btn btn-o" onclick="openReport('${r.id}',true)">プレビュー</button>
        <button class="btn ${r.published?'btn-o':'btn-s'}" onclick="togglePub('${r.id}')">${r.published?'非公開にする':'公開する'}</button>
        <button class="btn btn-d" onclick="delReport('${r.id}')">削除</button>
      </div>`;
    el.appendChild(row);
  });
}
async function togglePub(id){
  const r=reports.find(x=>x.id===id);
  if(!r.published && !r.next_report_date){ toast("次回報告日を入力してから公開してください。"); return; }
  const {error}=await sb.from('progress_reports')
    .update({published:!r.published,updated_at:new Date().toISOString()}).eq('id',id);
  if(error){ toast("変更できませんでした："+error.message); return; }
  toast(!r.published?"公開しました（お客様URLに表示されます）":"非公開にしました");
  loadReports();
}
async function delReport(id){
  if(!confirm("この報告を削除します。元に戻せません。よろしいですか？")) return;
  const {error}=await sb.from('progress_reports').delete().eq('id',id);
  if(error){ toast("削除できませんでした："+error.message); return; }
  toast("削除しました"); closeEditor(); loadReports();
}

/* ================= エディタ ================= */
const BLANK_PHASES=[
  {title:"着工前準備・資材納品",period:"",note:"",status:"next"},
  {title:"更新工事",period:"",note:"",status:"next"},
  {title:"仕上げ工事・各種試験",period:"",note:"",status:"next"},
  {title:"発電再開・遠隔監視設定",period:"",note:"",status:"next"}
];
function newReport(copy){
  if(!curProj){ toast("先に案件を開いてください。"); return; }
  const base = copy && reports.length ? JSON.parse(JSON.stringify(reports[0])) : null;
  curRep={
    id:null, project_id:curProj.id, report_date:today(),
    status: base?base.status:'着工中',
    progress_pct: base?base.progress_pct:0,
    lead_text: base?base.lead_text:'', lead_sub: base?base.lead_sub:'',
    phases: base&&base.phases&&base.phases.length?base.phases:JSON.parse(JSON.stringify(BLANK_PHASES)),
    works: base?[]:[], note: base?base.note:'',
    schedules: base?base.schedules||[]:[], procedures: base?base.procedures||[]:[],
    next_report_date:'', published:false
  };
  fillEditor();
  document.getElementById('edTitle').textContent = copy?"新規報告（前回をコピー）":"新規報告";
}
function openReport(id,pv){
  curRep=JSON.parse(JSON.stringify(reports.find(r=>r.id===id)));
  fillEditor();
  document.getElementById('edTitle').textContent="報告書の編集（"+fmt(curRep.report_date)+"）";
  if(pv) preview();
}
function closeEditor(){ document.getElementById('editor').style.display='none'; curRep=null; }

function fillEditor(){
  document.getElementById('editor').style.display='block';
  setv('rDate',curRep.report_date||today()); setv('rStatus',curRep.status||'着工中');
  setv('rPct',curRep.progress_pct??0); setv('rLead',curRep.lead_text||'');
  setv('rLeadSub',curRep.lead_sub||''); setv('rNote',curRep.note||'');
  setv('rNext',curRep.next_report_date||''); setv('rPub',String(!!curRep.published));
  drawPhases(); drawWorks(); drawSch(); drawProc();
  document.getElementById('editor').scrollIntoView({behavior:'smooth',block:'start'});
}

/* --- 工程 --- */
function drawPhases(){
  const el=document.getElementById('phaseList'); el.innerHTML='';
  (curRep.phases||[]).forEach((p,i)=>{
    const d=document.createElement('div'); d.className='item';
    d.innerHTML=`<div class="top"><span class="no">${i+1}</span>
        <input value="${esc(p.title||'')}" oninput="curRep.phases[${i}].title=this.value" placeholder="工程名">
        <button class="x" onclick="curRep.phases.splice(${i},1);drawPhases()">削除</button></div>
      <div class="grid3">
        <div><label class="f">期間</label><input value="${esc(p.period||'')}" oninput="curRep.phases[${i}].period=this.value" placeholder="5/7〜5/20"></div>
        <div><label class="f">状態</label>
          <select onchange="curRep.phases[${i}].status=this.value">
            <option value="done"${p.status==='done'?' selected':''}>完了</option>
            <option value="now"${p.status==='now'?' selected':''}>実施中</option>
            <option value="next"${(!p.status||p.status==='next')?' selected':''}>これから</option>
          </select></div>
        <div><label class="f">補足</label><input value="${esc(p.note||'')}" oninput="curRep.phases[${i}].note=this.value"></div>
      </div>`;
    el.appendChild(d);
  });
}
function addPhase(){ curRep.phases=curRep.phases||[]; curRep.phases.push({title:"",period:"",note:"",status:"next"}); drawPhases(); }

/* --- 作業 --- */
function drawWorks(){
  const el=document.getElementById('workList'); el.innerHTML='';
  (curRep.works||[]).forEach((w,i)=>{
    const d=document.createElement('div'); d.className='item';
    d.innerHTML=`<div class="top"><span class="no">${i+1}</span>
      <input value="${esc(w||'')}" oninput="curRep.works[${i}]=this.value" placeholder="パワーコンディショナ交換　ほか">
      <button class="x" onclick="curRep.works.splice(${i},1);drawWorks()">削除</button></div>`;
    el.appendChild(d);
  });
}
function addWork(){ curRep.works=curRep.works||[]; curRep.works.push(""); drawWorks(); }

/* --- 予定 --- */
function drawSch(){
  const el=document.getElementById('schList'); el.innerHTML='';
  (curRep.schedules||[]).forEach((s,i)=>{
    const d=document.createElement('div'); d.className='item';
    d.innerHTML=`<div class="top"><span class="no">${i+1}</span>
        <input value="${esc(s.title||'')}" oninput="curRep.schedules[${i}].title=this.value" placeholder="予定の内容">
        <button class="x" onclick="curRep.schedules.splice(${i},1);drawSch()">削除</button></div>
      <div class="grid3">
        <div><label class="f">時期</label><input value="${esc(s.date||'')}" oninput="curRep.schedules[${i}].date=this.value" placeholder="6月上旬"></div>
        <div><label class="f">補足</label><input value="${esc(s.note||'')}" oninput="curRep.schedules[${i}].note=this.value"></div>
        <div><label class="f">強調</label>
          <select onchange="curRep.schedules[${i}].highlight=(this.value==='1')">
            <option value="0"${s.highlight?'':' selected'}>通常</option>
            <option value="1"${s.highlight?' selected':''}>重要（色付き）</option>
          </select></div>
      </div>`;
    el.appendChild(d);
  });
}
function addSch(){ curRep.schedules=curRep.schedules||[]; curRep.schedules.push({title:"",date:"",note:"",highlight:false}); drawSch(); }

/* --- 手続き --- */
function drawProc(){
  const el=document.getElementById('procList'); el.innerHTML='';
  (curRep.procedures||[]).forEach((p,i)=>{
    const d=document.createElement('div'); d.className='item';
    d.innerHTML=`<div class="top"><span class="no">${i+1}</span>
        <input value="${esc(p.title||'')}" oninput="curRep.procedures[${i}].title=this.value" placeholder="経済産業省 事業計画変更届出">
        <button class="x" onclick="curRep.procedures.splice(${i},1);drawProc()">削除</button></div>
      <div class="grid2">
        <div><label class="f">結果・状況</label><input value="${esc(p.result||'')}" oninput="curRep.procedures[${i}].result=this.value" placeholder="受理済み／申請中"></div>
        <div><label class="f">補足</label><input value="${esc(p.note||'')}" oninput="curRep.procedures[${i}].note=this.value"></div>
      </div>`;
    el.appendChild(d);
  });
}
function addProc(){ curRep.procedures=curRep.procedures||[]; curRep.procedures.push({title:"",result:"",note:""}); drawProc(); }

/* ================= 保存 ================= */
function collect(){
  curRep.report_date=gv('rDate'); curRep.status=gv('rStatus');
  curRep.progress_pct=parseInt(gv('rPct')||0,10);
  curRep.lead_text=gv('rLead'); curRep.lead_sub=gv('rLeadSub');
  curRep.note=gv('rNote'); curRep.next_report_date=gv('rNext')||null;
  curRep.published=(gv('rPub')==='true');
  curRep.works=(curRep.works||[]).filter(w=>String(w).trim()!=='');
  return curRep;
}
async function saveReport(){
  const r=collect();
  if(!r.report_date){ toast("報告日を入力してください。"); return; }
  if(r.published && !r.next_report_date){ toast("公開する場合は次回報告日を入力してください。"); return; }
  const payload={
    project_id:curProj.id, report_date:r.report_date, status:r.status,
    progress_pct:r.progress_pct, lead_text:r.lead_text, lead_sub:r.lead_sub,
    phases:r.phases, works:r.works, note:r.note,
    schedules:r.schedules, procedures:r.procedures,
    next_report_date:r.next_report_date, published:r.published,
    updated_at:new Date().toISOString()
  };
  let res;
  if(r.id) res=await sb.from('progress_reports').update(payload).eq('id',r.id).select().single();
  else res=await sb.from('progress_reports').insert(payload).select().single();
  if(res.error){ toast("保存できませんでした："+res.error.message); return; }
  curRep.id=res.data.id;
  toast(r.published?"保存しました（公開中）":"保存しました（下書き）");
  loadReports();
}

/* ================= プレビュー ================= */
function preview(){
  const r=collect();
  document.getElementById('modal').style.display='block';
  document.getElementById('pvFrame').srcdoc=reportHTML(curProj,r);
}
function printPreview(){ document.getElementById('pvFrame').contentWindow.print(); }
function closeModal(){ document.getElementById('modal').style.display='none'; }

/* ================= 報告書レンダラ（ビューアと同一） ================= */
function reportHTML(proj,r){
  const ph=(r.phases||[]).map((p,i)=>{
    const lab={done:'完了',now:'実施中',next:'これから'}[p.status||'next'];
    return `<div class="ph ${p.status||'next'}">
      <div class="ph-dot">${i+1}</div>
      <div class="ph-body">
        <div class="ph-t">${esc(p.title||'')}<span class="ph-s">${lab}</span></div>
        ${p.period?`<div class="ph-p">${esc(p.period)}</div>`:''}
        ${p.note?`<div class="ph-n">${esc(p.note)}</div>`:''}
      </div></div>`;
  }).join('');
  const wk=(r.works||[]).filter(Boolean).map(w=>`<li>${esc(w)}</li>`).join('');
  const sc=(r.schedules||[]).map(s=>`<tr class="${s.highlight?'hl':''}">
      <td class="w">${esc(s.date||'')}</td><td>${esc(s.title||'')}</td><td class="n">${esc(s.note||'')}</td></tr>`).join('');
  const pr=(r.procedures||[]).map(p=>`<tr>
      <td>${esc(p.title||'')}</td><td class="w">${esc(p.result||'')}</td><td class="n">${esc(p.note||'')}</td></tr>`).join('');
  const pct=Math.max(0,Math.min(100,r.progress_pct||0));

  return `<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工事進捗報告書｜${esc(proj.name)}</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho+B1:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2A2A26;--soft:#7C7C70;--line:#E5E3D9;--pine:#1F4A3C;--pinesoft:#EAF1ED;--sun:#E3B23C;--alert:#B5442F;}
*{box-sizing:border-box;}
body{margin:0;background:#F3F2EC;font-family:'Zen Kaku Gothic New',sans-serif;color:var(--ink);line-height:1.85;font-size:14px;}
.sheet{max-width:820px;margin:22px auto;background:#fff;padding:40px 44px 48px;}
h1,h2{font-family:'Shippori Mincho B1',serif;margin:0;letter-spacing:.05em;}
.head{border-bottom:2px solid var(--pine);padding-bottom:16px;}
.head .eyebrow{font-size:11px;letter-spacing:.3em;color:var(--sun);font-weight:700;}
.head h1{font-size:24px;color:var(--pine);margin-top:6px;}
.head .meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:12px;font-size:12px;color:var(--soft);}
.status{margin-top:24px;background:var(--pinesoft);border-radius:12px;padding:18px 20px;}
.status .st{font-size:11px;color:var(--pine);font-weight:700;letter-spacing:.14em;}
.status .lead{font-family:'Shippori Mincho B1',serif;font-size:18px;color:var(--pine);margin-top:4px;line-height:1.6;}
.status .sub{font-size:13px;margin-top:8px;}
.bar{margin-top:14px;height:9px;background:#fff;border-radius:999px;overflow:hidden;}
.bar > span{display:block;height:100%;background:var(--pine);}
.bar-l{display:flex;justify-content:space-between;font-size:11px;color:var(--pine);margin-top:5px;font-weight:700;}
h2{font-size:15px;color:var(--pine);margin:34px 0 4px;padding-bottom:7px;border-bottom:1px solid var(--line);}
.ph{display:flex;gap:13px;padding:13px 0;border-bottom:1px dashed var(--line);}
.ph:last-child{border-bottom:none;}
.ph-dot{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:#F2F1EA;color:var(--soft);}
.ph.done .ph-dot{background:var(--pine);color:#fff;}
.ph.now .ph-dot{background:var(--sun);color:#3A2A08;}
.ph-t{font-weight:700;}
.ph-s{font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 9px;margin-left:9px;background:#F2F1EA;color:var(--soft);}
.ph.done .ph-s{background:var(--pinesoft);color:var(--pine);}
.ph.now .ph-s{background:#FBF1D8;color:#7A5A12;}
.ph-p{font-size:12px;color:var(--soft);}
.ph-n{font-size:12.5px;margin-top:3px;}
ul{margin:10px 0 0;padding-left:1.15em;}
li{margin-bottom:5px;}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px;}
td{border-bottom:1px solid var(--line);padding:9px 6px;vertical-align:top;}
td.w{white-space:nowrap;color:var(--pine);font-weight:700;width:1%;}
td.n{color:var(--soft);font-size:12px;}
tr.hl td{background:#FBF6E7;}
.note{margin-top:12px;background:#FBEDE9;border-left:3px solid var(--alert);border-radius:0 10px 10px 0;padding:13px 16px;font-size:13px;}
.next{margin-top:30px;background:var(--pine);color:#fff;border-radius:12px;padding:15px 20px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;align-items:center;}
.next .l{font-size:11px;letter-spacing:.2em;opacity:.75;}
.next .d{font-family:'Shippori Mincho B1',serif;font-size:17px;}
.foot{margin-top:30px;padding-top:15px;border-top:1px solid var(--line);font-size:11.5px;color:var(--soft);text-align:center;}
.empty{color:var(--soft);font-size:13px;margin-top:8px;}
@media print{body{background:#fff;}.sheet{margin:0;padding:0 6mm;max-width:none;}@page{size:A4;margin:12mm;}}
@media(max-width:640px){.sheet{margin:0;padding:24px 18px 34px;}.head h1{font-size:20px;}}
</style></head><body>
<div class="sheet">
  <div class="head">
    <div class="eyebrow">EARTHCOM　CONSTRUCTION REPORT</div>
    <h1>${esc(proj.name)}　工事進捗報告書</h1>
    <div class="meta">
      <span>${esc(proj.customer_name||'')}${proj.customer_name?'　':''}${proj.construction_period?'工事期間　'+esc(proj.construction_period):''}</span>
      <span>報告日　${fmt(r.report_date)}</span>
    </div>
  </div>

  <div class="status">
    <div class="st">現在の状況　／　${esc(r.status||'')}</div>
    <div class="lead">${esc(r.lead_text||'工事の状況をご報告いたします')}</div>
    ${r.lead_sub?`<div class="sub">${esc(r.lead_sub)}</div>`:''}
    <div class="bar"><span style="width:${pct}%"></span></div>
    <div class="bar-l"><span>着工</span><span>進捗 ${pct}％</span><span>完工</span></div>
  </div>

  ${ph?`<h2>工程の状況</h2>${ph}`:''}
  ${wk?`<h2>今回実施した作業</h2><ul>${wk}</ul>`:''}
  ${sc?`<h2>今後の予定</h2><table>${sc}</table>`:''}
  ${pr?`<h2>各種手続き・試験</h2><table>${pr}</table>`:''}
  ${r.note?`<h2>ご確認事項</h2><div class="note">${esc(r.note).replace(/\n/g,'<br>')}</div>`:''}

  <div class="next"><span class="l">次回のご報告</span><span class="d">${r.next_report_date?fmt(r.next_report_date):'追ってご連絡いたします'}</span></div>

  <div class="foot">株式会社アースコム　／　本報告に関するお問い合わせは担当者までご連絡ください。</div>
</div>
</body></html>`;
}

/* ================= ユーティリティ ================= */
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(d){ if(!d) return ''; const p=String(d).split('-'); return p.length<3?String(d):`${+p[0]}年${+p[1]}月${+p[2]}日`; }
function today(){ const t=new Date(); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`; }
function gv(id){ return document.getElementById(id).value; }
function setv(id,v){ document.getElementById(id).value=v; }
let tt;
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),2800); }
</script>
</body>
</html>
