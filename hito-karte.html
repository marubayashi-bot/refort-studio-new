<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ひとカルテ｜社員理解・育成支援</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script>window.__noEC = false;</script>
<script src="ec-auth.js" onerror="window.__noEC=true"></script>
<style>
:root{
  --ink:#1E2940; --ink2:#46506A; --muted:#6B7488;
  --paper:#F2F4F1; --panel:#FFFFFF; --line:#DAE0D8; --line2:#C9D1C7;
  --sage:#2F6B55; --sage-2:#E1ECE5;
  --fact:#2F5E8E; --fact-2:#E6EEF7;
  --stmt:#2F6B55; --stmt-2:#E1ECE5;
  --interp:#8A6219; --interp-2:#F6EDDA;
  --alert:#A33B2B; --alert-2:#F8E4E0;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans",sans-serif;color:var(--ink);background:var(--paper);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif;font-weight:700;line-height:1.35;margin:0}
h1{font-size:26px} h2{font-size:19px} h3{font-size:16px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fact);outline-offset:2px}
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--ink);color:#E7EBF2;padding:24px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{padding:0 10px 18px;border-bottom:1px solid #34405C;margin-bottom:10px}
.brand b{font-family:"Zen Kaku Gothic New",sans-serif;font-size:22px;letter-spacing:.04em;display:block}
.brand small{color:#A9B3C6;font-size:12px}
.nav{all:unset;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;color:#CDD4E1;font-size:14px}
.nav:hover{background:#2A3552;color:#fff}
.nav.on{background:#EEF2EC;color:var(--ink);font-weight:700}
.nav .cnt{margin-left:auto;background:var(--alert);color:#fff;border-radius:10px;font-size:11px;padding:0 7px;line-height:18px}
.side .me{margin-top:auto;padding:12px 10px 0;border-top:1px solid #34405C;font-size:12px;color:#A9B3C6}
.side .me b{color:#fff;display:block;font-size:13px}
.side select{width:100%;margin-top:6px;background:#2A3552;border:1px solid #3B4866;color:#fff;border-radius:6px;padding:4px}
.main{padding:30px clamp(16px,4vw,48px) 80px;max-width:1200px;width:100%}
.pagehead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.pagehead .sub{color:var(--muted);font-size:13px;margin-top:4px}
.pagehead .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--sage);border-color:var(--sage);color:#fff}
.btn.pri:hover{background:#265846}
.btn.ghost{background:transparent;border-color:transparent;color:var(--fact);padding:4px 8px}
.btn.ghost:hover{text-decoration:underline}
.btn.sm{font-size:12.5px;padding:4px 10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.panel + .panel{margin-top:16px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2)}
.field input,.field select,.field textarea,.inp{border:1px solid var(--line2);border-radius:7px;padding:7px 10px;background:#fff;font-size:14px;color:var(--ink);width:100%}
textarea{resize:vertical;min-height:64px;line-height:1.6}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag{display:inline-block;font-size:11.5px;padding:0 8px;border-radius:20px;background:#EDF0EC;color:var(--ink2);line-height:20px;white-space:nowrap}
.tag.alert{background:var(--alert-2);color:var(--alert)}
.tag.sage{background:var(--sage-2);color:var(--sage)}
.tag.fact{background:var(--fact-2);color:var(--fact)}
.tag.interp{background:var(--interp-2);color:var(--interp)}
.empty{padding:36px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--r);background:#FAFBF9}
.empty .btn{margin-top:12px}

/* people list */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .inp{max-width:280px}
.plist{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.prow{display:grid;grid-template-columns:minmax(160px,1.4fr) 1fr 1fr 1fr 110px;gap:12px;padding:13px 18px;border-top:1px solid var(--line);align-items:center;cursor:pointer}
.prow:first-child{border-top:0}
.prow:hover{background:#F7F9F6}
.prow.hd{cursor:default;background:#F7F9F6;font-size:12px;color:var(--muted);padding:8px 18px}
.prow .nm b{font-size:15px;display:block}
.prow .nm span{font-size:12px;color:var(--muted)}
.dots{display:flex;gap:4px}
.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;border:1px solid var(--line2);color:var(--line2)}
.dot.on{border-color:var(--ink);color:#fff;background:var(--ink)}

/* karte */
.kh{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start}
.kh h1{font-size:30px;letter-spacing:.02em}
.kh .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--ink2);font-size:13.5px;margin-top:6px}
.viewas{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;font-size:12.5px}
.viewas button{all:unset;padding:5px 12px;cursor:pointer;color:var(--ink2)}
.viewas button.on{background:var(--ink);color:#fff}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:14px 0 4px}
.legend span{display:flex;align-items:center;gap:7px}
.sw{width:16px;height:14px;display:inline-block;background:#fff}
.sw.fact{border-left:4px solid var(--fact);background:var(--fact-2)}
.sw.statement{border-left:6px double var(--stmt);background:var(--stmt-2)}
.sw.interpretation{border-left:4px dashed var(--interp);background:var(--interp-2)}
.kgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.kblock{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 12px}
.kblock h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.kblock h3 .n{font-size:12px;color:var(--muted);font-weight:500}
.it{padding:8px 10px 8px 12px;margin-bottom:8px;border-radius:4px;background:#FBFCFA}
.it.fact{border-left:4px solid var(--fact);background:var(--fact-2)}
.it.statement{border-left:6px double var(--stmt);background:var(--stmt-2)}
.it.interpretation{border-left:4px dashed var(--interp);background:var(--interp-2)}
.it.hidden{opacity:.45}
.it .lb{font-weight:700;font-size:13.5px}
.it .vl{font-weight:700;color:var(--fact);margin-left:6px}
.it .tx{font-size:14px}
.it .ct{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.it .ctl{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.it .ctl button{all:unset;cursor:pointer;font-size:11px;border:1px solid var(--line2);border-radius:12px;padding:0 8px;line-height:19px;background:#fff;color:var(--ink2)}
.it .ctl button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.layers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}
.layers h3{font-size:14px;margin-bottom:8px}
.srcs{display:flex;flex-direction:column;gap:6px}
.src{display:flex;gap:10px;align-items:center;font-size:13.5px;flex-wrap:wrap}
.sec-title{display:flex;align-items:center;gap:10px;margin:28px 0 10px}
.sec-title h2{font-size:17px}
.mtg{border-top:1px solid var(--line);padding:12px 0}
.mtg:first-child{border-top:0;padding-top:0}
.acts{margin:6px 0 0;padding-left:18px;font-size:13.5px}

/* import */
.steps{display:flex;gap:0;margin-bottom:18px;font-size:13px;flex-wrap:wrap}
.steps span{padding:6px 16px;border:1px solid var(--line2);margin-left:-1px;background:#fff;color:var(--muted)}
.steps span:first-child{border-radius:8px 0 0 8px;margin-left:0}
.steps span:last-child{border-radius:0 8px 8px 0}
.steps span.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.steps span.done{color:var(--sage)}
.kinds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kind{border:1.5px solid var(--line2);border-radius:var(--r);padding:14px;cursor:pointer;background:#fff}
.kind.on{border-color:var(--sage);box-shadow:inset 0 0 0 1px var(--sage);background:#F6FAF7}
.kind b{display:block;font-family:"Zen Kaku Gothic New",sans-serif;font-size:15px}
.kind span{font-size:12.5px;color:var(--muted)}
.drop{display:block;border:1.5px dashed var(--line2);border-radius:var(--r);padding:22px;text-align:center;background:#FAFBF9;cursor:pointer}
.drop.has{border-style:solid;border-color:var(--sage);background:#F6FAF7}
.maptbl{width:100%;border-collapse:collapse;font-size:13.5px}
.maptbl th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
.maptbl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.maptbl .snip{color:var(--muted);font-size:12px;max-width:340px}
.rv{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:#fff}
.rv.fact{border-left:4px solid var(--fact)}
.rv.statement{border-left:6px double var(--stmt)}
.rv.interpretation{border-left:4px dashed var(--interp)}
.rv.ex{opacity:.45}
.rv-head{display:grid;grid-template-columns:150px 170px 1fr 160px;gap:8px}
.rv textarea{margin-top:6px}
.rv details{font-size:12.5px;color:var(--muted);margin-top:4px}
.rv .orig{background:#F6F7F5;padding:6px 10px;border-radius:6px;color:var(--ink2);white-space:pre-wrap}
.rv-flags{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;margin-top:8px;align-items:center}
.rv-flags label{display:flex;gap:4px;align-items:center;cursor:pointer}
.notice{border-radius:8px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.notice.warn{background:var(--interp-2);color:#5E4413}
.notice.alert{background:var(--alert-2);color:var(--alert)}
.notice.info{background:var(--fact-2);color:#244a70}

/* meeting */
.mgrid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;align-items:start}
.mgrid .ref{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
.qcard{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:#fff}
.qcard .basis{font-size:12px;color:var(--muted);margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;border:1px solid var(--line2);border-radius:16px;padding:2px 12px;font-size:13px;background:#fff}
.chip.on{background:var(--sage);color:#fff;border-color:var(--sage)}
.arow{display:grid;grid-template-columns:1fr 110px 150px 30px;gap:8px;margin-bottom:6px}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi b{font-family:"Zen Kaku Gothic New",sans-serif;font-size:26px;display:block;line-height:1.2}
.kpi span{font-size:12.5px;color:var(--muted)}
.dtbl{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--panel)}
.dtbl th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:8px 12px;border-bottom:1px solid var(--line);background:#F7F9F6}
.dtbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.bar{height:8px;border-radius:4px;background:var(--sage-2);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--sage)}
.wrap-x{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}

/* charts */
.viz{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;margin-top:14px}
.vcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.vcard.wide{grid-column:1/-1}
.vcard h3{font-size:14.5px;margin-bottom:12px;display:flex;align-items:baseline;gap:8px}
.vcard h3 small{font-weight:500;color:var(--muted);font-size:12px;font-family:"Noto Sans JP",sans-serif}
.vcap{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6}
.nsrc{font-size:12px;color:var(--ink2);margin:12px 0 6px;font-weight:700}
.nsrc:first-of-type{margin-top:0}
.nrow{display:grid;grid-template-columns:130px minmax(0,1fr) 70px;gap:10px;align-items:center;margin-bottom:7px;font-size:13.5px}
.nrow .nl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nbar{height:10px;background:#E7EBE5;border-radius:5px;overflow:hidden}
.nbar i{display:block;height:100%;background:var(--fact);border-radius:5px}
.nv{text-align:right;font-weight:700;color:var(--fact);white-space:nowrap}
.nv small{font-weight:400;color:var(--muted);font-size:11px}
.gscale{display:flex;gap:3px}
.gscale span{flex:1;text-align:center;font-size:11.5px;border-radius:4px;background:#EEF1EC;color:#9AA3B2;line-height:20px}
.gscale span.on{background:var(--fact);color:#fff;font-weight:700}
.comp{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.clegend div{display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:5px}
.clegend b{margin-left:auto;padding-left:10px}
.swc{width:12px;height:12px;border-radius:3px;display:inline-block;flex-shrink:0}
.stackrows{margin-top:14px}
.srow{display:grid;grid-template-columns:150px minmax(0,1fr) 26px;gap:8px;align-items:center;font-size:12.5px;margin-bottom:6px}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:#EEF1EC}
.stack i{display:block;height:100%}
.s-fact{background:var(--fact)} .s-statement{background:var(--stmt)}
.s-interpretation{background:repeating-linear-gradient(45deg,#B08A3E 0 4px,#D2B477 4px 8px)}
.tl{width:100%;height:auto;display:block}
.tlwrap{overflow-x:auto}
.tlwrap .tl{min-width:640px}
.gscale span{white-space:nowrap;overflow:hidden}
.tl text{font-family:"Noto Sans JP",sans-serif}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;margin-bottom:10px}
.prog .bar{flex:1;height:10px}
.acts.chk{list-style:none;padding-left:0}
.acts.chk li{display:flex;gap:8px;align-items:flex-start;margin-bottom:4px}
.acts.chk input{margin-top:6px}
.acts .over{color:var(--alert);font-size:11.5px;margin-left:4px}
.heat{border-collapse:collapse;font-size:12.5px;width:100%}
.heat th{font-weight:500;color:var(--muted);padding:6px;text-align:center;white-space:nowrap}
.heat th:first-child{text-align:left}
.heat td{padding:3px}
.heat td div{border-radius:5px;text-align:center;line-height:30px;font-weight:700;min-width:44px}
.dgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-top:16px}
.dgrid .vcard.wide{grid-column:1/-1}

/* marco polo */
.wave{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.wv-f{min-width:0}
.wv-bars{position:relative;height:150px;display:flex;align-items:flex-end;gap:5px;border-bottom:1px solid #C9D1C7;background:repeating-linear-gradient(to top,#fff 0,#fff 29px,#EEF1EC 29px,#EEF1EC 30px)}
.wv-avg{position:absolute;left:-4px;right:-4px;border-top:2px dashed #8A93A5;z-index:2}
.wv-c{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.wv-b{width:100%;max-width:26px;background:#AFC3D8;border-radius:3px 3px 0 0}
.wv-c.hi .wv-b{background:var(--fact)} .wv-c.lo .wv-b{background:#C0574A}
.wv-n{font-size:11px;color:var(--ink2);line-height:1.3}
.wv-c.hi .wv-n{color:var(--fact);font-weight:700} .wv-c.lo .wv-n{color:#A33B2B;font-weight:700}
.wv-ls{display:flex;gap:5px;margin-top:4px}
.wv-l{flex:1;writing-mode:vertical-rl;font-size:11.5px;color:var(--ink2);height:92px;display:flex;align-items:flex-start;justify-content:center;letter-spacing:.02em}
.wv-fn{border-top:1px solid var(--line);margin-top:4px;padding-top:4px;text-align:center;font-size:12.5px;font-weight:700}
.wv-fn b{display:block;font-size:17px;color:var(--ink)}
.wv-read{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.wv-read.one{grid-template-columns:1fr}
.wv-read div{background:#F6F8F5;border-radius:8px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:2px}
.wv-read b{font-size:13.5px}
.nbar.dual{position:relative;overflow:visible}
.nrow.long{grid-template-columns:minmax(0,1fr) 64px;row-gap:2px}
.nrow.long .nl{grid-column:1/-1;white-space:normal}
.wv-l{height:112px!important}
.nbar.dual i.req{position:absolute;top:-4px;bottom:-4px;width:2px;background:#1E2940;border-radius:1px;z-index:2}
.soc{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:12px;align-items:center}
.soc-svg{width:100%;height:auto}
.soc-main{font-family:"Zen Kaku Gothic New",sans-serif;font-size:22px;font-weight:700}
.tips{display:grid;gap:6px;margin-top:10px}
.tips div{font-size:13px;background:#F6F8F5;border-radius:8px;padding:8px 12px}
.tips b{display:inline-block;min-width:78px;color:var(--sage)}
.cul{display:grid;grid-template-columns:130px minmax(0,1fr) 130px;gap:10px;align-items:center;margin-bottom:4px;font-size:12px}
.cul .cl{text-align:right;color:var(--ink2)} .cul .cr{color:var(--ink2)}
.cul .cn{grid-column:2;font-size:11.5px;color:var(--muted);text-align:center;margin:-2px 0 6px}
.cul .cn em{font-style:normal;color:var(--alert);font-weight:700;margin-left:6px}
.ctrack{position:relative;height:22px;background:#F1F4F0;border-radius:11px}
.cmid{position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed #9AA3B2}
.cgap{position:absolute;top:8px;height:6px;background:#CBD5CA;border-radius:3px}
.cul.x .cgap{background:#E7B3AA}
.cm{position:absolute;top:0;transform:translateX(-50%);font-style:normal;font-size:12px;line-height:22px}
.cm.co{color:#2F5E8E} .cm.pe{color:#C0574A}
.role{display:grid;grid-template-columns:90px 1fr auto;gap:8px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.role span{color:var(--muted)} .role em{font-style:normal;font-weight:700}
.mp-how{margin-top:10px;font-size:13px}
.mp-how summary{cursor:pointer;color:var(--fact)}
.mp-how ul{margin:6px 0 0;padding-left:20px;color:var(--ink2)}
.mped-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:8px}
.mped-g div{display:flex;flex-direction:column;gap:4px;font-size:12.5px;background:#F6F8F5;border-radius:8px;padding:8px}
.mped-g label,.mped-l label{display:flex;justify-content:space-between;align-items:center;gap:6px}

<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* =========================================================
   ひとカルテ — 社員理解・育成支援
   資料を根拠付きで整理し、本人との対話と育成行動につなげる。
   採用・異動・昇格の結論を自動で決める機能は持たない。
   ver.2026.10.18a：社員マスタ（組織設計アプリと共通。所属・役職・直属上司は社員マスタが正）と連携。
   組織図からは ?emp=共通社員ID で開く。異動の目的と7/30/90日の確認、上司との関わり方、職務要件の見直し版を追加。
   ========================================================= */
const CONFIG = {
  SUPABASE_URL: 'https://aakofrzurgwrkctunthw.supabase.co',
  SUPABASE_KEY: 'sb_publishable_yAUGrTJjqg56S16D7BI2oQ_pbt1olLa',
  AI_URL: 'https://aakofrzurgwrkctunthw.supabase.co/functions/v1/ai',
  APP_ID: 'hito-karte',
  BUCKET: 'hr-docs',
  MIN_GROUP: 3,              // これ未満の人数の集計は表示しない
  ALLOWED_DOMAIN: 'earthcom-eco.jp',
};
const DEMO = new URLSearchParams(location.search).has('demo');

const KINDS = {
  marcopolo: { label:'マルコポーロ面接シート', short:'マルコポーロ', accept:'.pdf', hint:'PDFを一人ずつ登録。適性・動機・性格特性を項目別に抽出します。' },
  milme:     { label:'ミルメバイタル', short:'ミルメ', accept:'.pdf', hint:'PDFを一人ずつ登録。画像主体のため、読み取った数値は原本と照合してから登録します。' },
  torisetsu: { label:'従業員トリセツ', short:'トリセツ', accept:'.docx,.pdf,.txt', hint:'DOCX推奨。複数人分の文書は氏名ごとに分割候補を出し、確認してから紐づけます。' },
};
const LAYERS = {
  fact:           { label:'確認できる数値', desc:'資料に記載された数値・診断結果' },
  statement:      { label:'本人の発言・実績', desc:'本人の記述、実際の行動や成果' },
  interpretation: { label:'資料の解釈', desc:'診断や作成者による解釈。本人に確かめる前提で扱う' },
};
const CATS = ['強み','力を発揮しやすい条件','指示・報告の工夫','育成テーマ','動機','性格特性','処理能力','注意点','その他'];
const KARTE_MAIN = ['強み','力を発揮しやすい条件','指示・報告の工夫','育成テーマ'];
const THEMES = ['報連相','計画・段取り','顧客折衝','専門知識','数値管理','主体性','チーム連携','部下育成','働き方'];
const DEPT_SUGGEST = ['営業','開発','CS','O&M','エネルギーアセット','管理部'];

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const z2 = n => String(n).padStart(2,'0');
const today = () => { const d=new Date(); return `${d.getFullYear()}-${z2(d.getMonth()+1)}-${z2(d.getDate())}`; };
const addDays = (s,n) => { const d=new Date(s); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${z2(d.getMonth()+1)}-${z2(d.getDate())}`; };
const daysSince = s => s ? (Date.now() - new Date(s).getTime())/864e5 : Infinity;
const fmtDT = s => s ? new Date(s).toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
const norm = s => String(s||'').normalize('NFKC').replace(/\s+/g,'').replace(/(さん|様|氏|くん|君)$/,'');
const lower = s => String(s||'').trim().toLowerCase();
let toastTimer;
function toast(msg, err){ const t=$('#toast'); t.textContent=msg; t.className=err?'err':''; t.style.display='block'; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.style.display='none', err?6000:2600); }
function openModal(html){ $('#modal').innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`; const f=$('#modal input,#modal textarea,#modal select'); f&&f.focus(); }
function closeModal(){ $('#modal').innerHTML=''; }
function busy(btn, on, text){ if(!btn) return; if(on){ btn.dataset.t=btn.innerHTML; btn.disabled=true; btn.innerHTML=`<span class="spin"></span>${text||'処理中'}`; } else { btn.disabled=false; if(btn.dataset.t) btn.innerHTML=btn.dataset.t; } }
function fileToBase64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=()=>rej(new Error('ファイルを読み込めませんでした')); r.readAsDataURL(file); }); }

/* ---------- state ---------- */
const S = { me:null, hr:null, people:[], view:'people', pid:null, viewAs:'hr', showOriginal:false, openCorrections:0, filter:{q:'',dept:''} };
let DB;

function relOf(p){
  if(!p || !S.me) return null;
  if(S.hr) return 'hr';
  const e = lower(S.me.email);
  if(lower(p.manager_email) === e) return 'manager';
  if(lower(p.self_email) === e) return 'self';
  return null;
}
const REL_LABEL = { hr:'人事・経営層', manager:'直属上司', self:'本人' };

/* =========================================================
   データ層（Supabase）
   ========================================================= */
function makeSupabaseDB(){
  const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
  const t = n => sb.from(n);
  const ok = ({data,error}) => { if(error) throw new Error(error.message); return data; };
  const now = () => new Date().toISOString();
  return {
    sb,
    async session(){ const {data}=await sb.auth.getSession(); return data.session; },
    async token(){ const s=await this.session(); return s?.access_token; },
    async login(){ await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: location.href.split('#')[0], queryParams:{ hd: CONFIG.ALLOWED_DOMAIN } } }); },
    async logout(){ await sb.auth.signOut(); },
    async hrLevel(email){ const {data,error}=await t('hr_access').select('level').ilike('email',email).limit(1); if(error){ console.warn('hr_access',error); return null; } return data&&data[0]?data[0].level:null; },
    async people(){ return ok(await t('hr_people').select('*').order('department').order('full_name')); },
    async savePerson(p){ const {id,...rest}=p; rest.updated_at=now(); return id ? ok(await t('hr_people').update(rest).eq('id',id).select().single()) : ok(await t('hr_people').insert(rest).select().single()); },
    async sources(pid){ return ok(await t('hr_sources').select('id,person_id,kind,file_name,file_path,diagnosed_on,created_by,created_at').eq('person_id',pid).order('created_at',{ascending:false})); },
    async sourceMeta(){ return ok(await t('hr_sources').select('person_id,kind')); },
    async addSource(s){ return ok(await t('hr_sources').insert(s).select().single()); },
    async items(pid){ return ok(await t('hr_items').select('*').eq('person_id',pid).order('created_at')); },
    async addItems(rows){ return rows.length ? ok(await t('hr_items').insert(rows).select()) : []; },
    async updateItem(id,patch){ patch.updated_at=now(); return ok(await t('hr_items').update(patch).eq('id',id).select().single()); },
    async meetings(pid){ return ok(await t('hr_meetings').select('*').eq('person_id',pid).order('held_on',{ascending:false})); },
    async allMeetings(){ return ok(await t('hr_meetings').select('person_id,held_on,themes')); },
    async saveMeeting(m){ const {id,...rest}=m; rest.updated_at=now(); return id ? ok(await t('hr_meetings').update(rest).eq('id',id).select().single()) : ok(await t('hr_meetings').insert(rest).select().single()); },
    async corrections(pid){ let q=t('hr_corrections').select('*').order('created_at',{ascending:false}); if(pid) q=q.eq('person_id',pid); return ok(await q); },
    async addCorrection(c){ return ok(await t('hr_corrections').insert(c).select().single()); },
    async updateCorrection(id,patch){ return ok(await t('hr_corrections').update(patch).eq('id',id).select().single()); },
    async audit(){ return ok(await t('hr_audit').select('*').order('at',{ascending:false}).limit(300)); },
    async log(action,target_type,target_id,detail){ try{ await t('hr_audit').insert({actor_email:S.me.email,action,target_type,target_id:String(target_id||''),detail:detail||null}); }catch(e){ console.warn('audit',e); } },
    async upload(path,file){ const {error}=await sb.storage.from(CONFIG.BUCKET).upload(path,file,{upsert:false,contentType:file.type||undefined}); if(error) throw new Error('原本の保存に失敗しました: '+error.message); return path; },
    async signedUrl(path){ const {data,error}=await sb.storage.from(CONFIG.BUCKET).createSignedUrl(path,300); if(error) throw new Error(error.message); return data.signedUrl; },
    async list(tb, eq={}){ let q=t(tb).select('*'); for(const [k,v] of Object.entries(eq)) q=q.eq(k,v); return ok(await q); },
    async insert(tb,row){ return ok(await t(tb).insert(row).select().single()); },
    async update(tb,id,patch){ patch.updated_at=now(); return ok(await t(tb).update(patch).eq('id',id).select().single()); },
    async remove(tb,id){ ok(await t(tb).delete().eq('id',id)); },
    async ecList(tb,eq={}){ return this.list(tb,eq); },

  const TBK = { hr_actions:'person', hr_results:'person', hr_confirm_points:'mgr', hr_relations:'mgr' };
  const demoCan = (tb,row,write) => { if(tb==='hr_shine'){ const r=rel(row.person_id); if(write||r!=='self') return r==='hr'||r==='manager'; return !!(row.share_with_self&&row.status==='confirmed'); } const k=TBK[tb]; if(!k) return !!S.hr; const r=rel(row.person_id); if(k==='mgr'||write) return r==='hr'||r==='manager'; return !!r; };
  seedDemoV2(st, uid);
  return {
    async session(){ return {access_token:'demo'}; }, async token(){ return 'demo'; },
    async logout(){ location.search=''; },
    async hrLevel(){ return S.me.hr; },
    async people(){ return C(st.people.filter(p=>relOf(p))); },
    async savePerson(p){ if(p.id){ const x=st.people.find(q=>q.id===p.id); Object.assign(x,p); return C(x);} const n={...p,id:uid()}; st.people.push(n); return C(n); },
    async sources(pid){ return rel(pid)==='hr' ? C(st.sources.filter(s=>s.person_id===pid)) : []; },
    async sourceMeta(){ return C(st.sources.map(s=>({person_id:s.person_id,kind:s.kind}))); },
    async addSource(s){ const n={...s,id:uid(),created_at:new Date().toISOString()}; st.sources.unshift(n); return C(n); },
    async items(pid){ const r=rel(pid); return C(st.items.filter(i=>i.person_id===pid && vis(i,r))); },
    async addItems(rows){ const n=rows.map(r=>({...r,id:uid(),created_at:new Date().toISOString()})); st.items.push(...n); return C(n); },
    async updateItem(id,patch){ const x=st.items.find(i=>i.id===id); Object.assign(x,patch); return C(x); },
    async meetings(pid){ return C(st.meetings.filter(m=>m.person_id===pid).sort((a,b)=>String(b.held_on).localeCompare(a.held_on))); },
    async allMeetings(){ return C(st.meetings); },
    async saveMeeting(m){ if(m.id){ const x=st.meetings.find(q=>q.id===m.id); Object.assign(x,m); return C(x);} const n={...m,id:uid()}; st.meetings.push(n); return C(n); },
    async corrections(pid){ return C(st.corrections.filter(c=>(!pid||c.person_id===pid) && (S.hr || lower(c.requester_email)===lower(S.me.email)))); },
    async addCorrection(c){ const n={...c,id:uid(),status:'open',created_at:new Date().toISOString()}; st.corrections.unshift(n); return C(n); },
    async updateCorrection(id,patch){ const x=st.corrections.find(c=>c.id===id); Object.assign(x,patch); return C(x); },
    async audit(){ return C(st.audit); },
    async log(action,target_type,target_id,detail){ st.audit.unshift({id:uid(),actor_email:S.me.email,action,target_type,target_id,detail,at:new Date().toISOString()}); },
    async upload(path){ return path; },
    async signedUrl(){ throw new Error('デモでは原本ファイルを保存していません'); },
    async list(tb, eq={}){ const arr = tb==='hr_items' ? (S.hr?st.items:[]) : (st[tb]||[]).filter(r=>demoCan(tb,r)); return C(arr.filter(r=>Object.entries(eq).every(([k,v])=>r[k]===v))); },
    async insert(tb,row){ if(!demoCan(tb,row,true)) throw new Error('この操作の権限がありません'); const n={...row,id:uid(),created_at:new Date().toISOString(),updated_at:new Date().toISOString()}; (st[tb] ||= []).push(n); return C(n); },
    async ecList(tb,eq={}){ return C((st[tb]||[]).filter(r=>Object.entries(eq).every(([k,v])=>r[k]===v))); },
    async ecUpdate(tb,id,patch,version){ const x=(st[tb]||[]).find(r=>r.id===id); if(!x) throw new Error('対象が見つかりません'); if((x.version||1)!==version){ const e=new Error('ほかの人が先に更新しました'); e.conflict=true; throw e; } Object.assign(x,patch,{version:(x.version||1)+1,updated_at:new Date().toISOString()}); return C(x); },
    async updateIf(tb,id,patch,col,val){ const arr=tb==='hr_people'?st.people:(st[tb]||[]); const x=arr.find(r=>r.id===id); if(x&&(x[col]||null)!==(val||null)){ const e=new Error('ほかの人が先に更新しました。画面を開き直して確認してください（入力内容はこの画面に残っています）'); e.conflict=true; throw e; } return this.update(tb,id,patch); },
    async update(tb,id,patch){ const arr = tb==='hr_items'?st.items:tb==='hr_people'?st.people:(st[tb]||[]); const x=arr.find(r=>r.id===id); if(!x) throw new Error('対象が見つかりません'); if(tb!=='hr_items'&&!demoCan(tb,x,true)) throw new Error('この操作の権限がありません'); Object.assign(x,patch,{updated_at:new Date().toISOString()}); return C(x); },
    async remove(tb,id){ st[tb]=(st[tb]||[]).filter(r=>r.id!==id); },
  };
}

/* =========================================================
   AI呼び出し（Edge Function ai 経由。APIキーはサーバー側）
   ========================================================= */
async function callAI({ system, prompt, documents, images, max_tokens=4000, timeoutSec=180 }){
  if(DEMO) return mockAI(system, prompt);
  const token = await DB.token();
  if(!token) throw new Error('ログインの有効期限が切れています。ページを再読み込みしてログインし直してください。');
  const ctl = new AbortController();
  const timer = setTimeout(()=>ctl.abort(), timeoutSec*1000);
  let res, raw;
  try{
    res = await fetch(CONFIG.AI_URL, {
      method:'POST', signal: ctl.signal,
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token, 'apikey':CONFIG.SUPABASE_KEY },
      body: JSON.stringify({ system, prompt, max_tokens, ...(documents?{documents}:{}), ...(images?{images}:{}) }),
    });
    raw = await res.text();
  }catch(e){
    if(e.name==='AbortError') throw new Error(`AIの応答が${timeoutSec}秒以内に返ってきませんでした。ページ数の多いPDFは時間がかかります。もう一度お試しいただき、続く場合はPDFを必要なページだけにしてください。`);
    throw new Error('AIに接続できませんでした（通信エラー）。ネット接続を確認して、もう一度お試しください。');
  }finally{ clearTimeout(timer); }
  if(!res.ok){
    console.error('AI error', res.status, raw);
    let msg = raw; try{ const j=JSON.parse(raw); msg = j.error?.error?.message || j.error?.message || (typeof j.error==='string'?j.error:'') || j.message || raw; }catch{}
    const hint = res.status===401 ? '（ログインを確認してください）' : res.status===413 ? '（ファイルが大きすぎます）' : res.status===529||res.status===429 ? '（AIが混み合っています。少し待ってから再実行してください）' : res.status>=500 ? '（AI中継サーバーのエラー。SupabaseのEdge Function「ai」のLogsで詳細を確認できます）' : '';
    throw new Error(`AIの呼び出しに失敗しました（${res.status}）${hint}　${String(msg).slice(0,200)}`);
  }
  let j; try { j = JSON.parse(raw); } catch { return raw; }
  if(typeof j === 'string') return j;
  if(j.text) return j.text;
  if(Array.isArray(j.content)) return j.content.filter(c=>c.type==='text').map(c=>c.text).join('\n');
  if(j.completion) return j.completion;
  if(j.result) return typeof j.result==='string' ? j.result : JSON.stringify(j.result);
  if(j.items || j.segments || j.questions) return JSON.stringify(j);
  return raw;
}
function parseJSON(text){
  const s = String(text).replace(/```json|```/g,'');
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if(a<0) { console.error('AI raw', text); const sn=String(text||'').replace(/\s+/g,' ').trim().slice(0,160); throw new Error(sn ? `AIが読み取り結果の形式で答えませんでした。AIの返答：「${sn}」` : 'AIから空の返答が返りました。もう一度お試しください。'); }
  try { return JSON.parse(s.slice(a,b+1)); } catch(e){
    // 出力が途中で切れた場合：最後の完全な項目までで閉じる
    const body = s.slice(a); const cut = body.lastIndexOf('},');
    if(cut>0){ for(const tail of [']}', '}]}']){ try{ return JSON.parse(body.slice(0,cut+1)+tail); }catch{} } }
    console.error('AI raw', text);
    throw new Error('AIの応答を読み取れませんでした。もう一度お試しください。');
  }
}

/* ---------- PDF → ページ画像＋文字（どのEdge Function版でも読めるよう画像で渡す） ---------- */
const PDFJS_VER = '3.11.174';
const PDFJS_BASE = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VER}`;
async function loadPdfJs(){
  if(window.pdfjsLib) return window.pdfjsLib;
  await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=`${PDFJS_BASE}/pdf.min.js`; s.onload=res; s.onerror=()=>rej(new Error('PDFを開く部品を読み込めませんでした。ネット接続を確認してください。')); document.head.appendChild(s); });
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = `${PDFJS_BASE}/pdf.worker.min.js`;
  return window.pdfjsLib;
}
async function pdfToInputs(file, maxPages=6){
  const lib = await loadPdfJs();
  let pdf;
  try{ pdf = await lib.getDocument({ data: await file.arrayBuffer(), cMapUrl:`${PDFJS_BASE}/cmaps/`, cMapPacked:true }).promise; }
  catch(e){ throw new Error('PDFを開けませんでした。パスワード付きや破損したPDFでないか確認してください。'); }
  const used = Math.min(pdf.numPages, maxPages);
  const images = []; let text = '';
  for(let i=1;i<=used;i++){
    const page = await pdf.getPage(i);
    try{ const tc = await page.getTextContent(); text += `\n--- ${i}ページ ---\n` + tc.items.map(t=>t.str+(t.hasEOL?'\n':'')).join(''); }catch{}
    const vp0 = page.getViewport({scale:1});
    const vp = page.getViewport({ scale: Math.min(2.2, 1500/vp0.width) });
    const c = document.createElement('canvas'); c.width=Math.floor(vp.width); c.height=Math.floor(vp.height);
    const ctx = c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
    await page.render({ canvasContext:ctx, viewport:vp }).promise;
    images.push({ media_type:'image/jpeg', data: c.toDataURL('image/jpeg',0.85).split(',')[1] });
  }
  return { text:text.trim(), images, pages:pdf.numPages, used };
}

async function boot(){
  DB = DEMO ? makeDemoDB() : makeSupabaseDB();
  try{
    if(DEMO){ S.me = {...DEMO_USERS.hr}; S.hr = S.me.hr; }
    else {
      if(window.EC && !window.__noEC && typeof EC.guard==='function'){
        try { await EC.guard({ allow:['admin','manager','sales','field','viewer'] }); } catch(e){ console.warn('EC.guard', e); }
      }
      const s = await DB.session();
      if(!s){ renderLogin(); return; }
      const email = s.user.email || '';
      if(!email.endsWith('@'+CONFIG.ALLOWED_DOMAIN)){ renderLogin('会社のGoogleアカウント（@'+CONFIG.ALLOWED_DOMAIN+'）でログインしてください。'); return; }
      S.me = { email, name: s.user.user_metadata?.full_name || email };
      S.hr = await DB.hrLevel(email);
      if(window.EC && typeof EC.mountBadge==='function'){ try{ EC.mountBadge(); }catch{} }
    }
    await reloadPeople();
    const mine = S.people.find(p=>lower(p.self_email)===lower(S.me.email));
    const reports = S.people.filter(p=>relOf(p)==='manager');
    if(!S.hr && !reports.length && mine){ S.view='karte'; S.pid=mine.id; }
    // 組織設計アプリの「人材カルテを開く」から：共通社員IDで開く（氏名では探さない）
    const empQ = new URLSearchParams(location.search).get('emp');
    if(empQ){ const tg=S.people.find(p=>p.employee_id===empQ); if(tg){ S.view='karte'; S.pid=tg.id; } else { S.view='people'; S.empMissing=true; } }
    render();
  }catch(e){ console.error(e); renderLogin('読み込みに失敗しました: '+e.message); }
}

async function savePerson(btn,pid){
  const v = id => $('#'+id).value.trim();
  if(!v('pf_name')) return toast('氏名を入力してください', true);
  const no = v('pf_no');
  const orig = S.people.find(x=>x.id===pid);
  if(!orig?.employee_id && no && S.people.some(p=>p.employee_no===no && p.id!==pid)) return toast('この社員番号はすでに登録されています', true);
  busy(btn,true,'保存中');
  try{
    const save = o => pid ? DB.updateIf('hr_people', pid, (({id,...r})=>r)(o), 'updated_at', orig?.updated_at||null) : DB.savePerson(o);
    const p = await save({ ...(pid?{id:pid}:{}), full_name:v('pf_name'), employee_no:no||null, department:v('pf_dept')||null, position:v('pf_pos')||null, self_email:lower(v('pf_self'))||null, manager_email:lower(v('pf_mgr'))||null, desired_role:v('pf_wish')||null, current_job:v('pf_role')||null, experience:v('pf_exp')||null });
    await DB.log(pid?'edit_person':'add_person','person',p.id,{name:p.full_name});
    closeModal(); await reloadPeople(); toast('保存しました'); render();
  }catch(e){ busy(btn,false); toast(schemaError(e).message,true); }
}

function normalizeMP(mp){
  mp = mp || {};
  const grp = (src, def) => def.map(([f,subs])=>{ const g=(src||[]).find(x=>norm(x.factor||x.name)===norm(f))||{}; return { factor:f, score:num(g.score), subs:subs.map(s=>{ const x=(g.subs||[]).find(y=>norm(y.name)===norm(s))||{}; return {name:s, score:num(x.score)}; }) }; });
  const list = (src, def, keep) => { const arr=(src||[]).map(x=>({name:x.name, score:num(x.score), required:num(x.required)})).filter(x=>x.name); if(!keep) return def.map(n=>{ const x=arr.find(y=>norm(y.name)===norm(n)); return x?{...x,name:n}:null; }).filter(Boolean); return arr; };
  const soc = mp.social || {};
  return {
    version: mp.version || '',
    reliability: { inconsistency: mp.reliability?.inconsistency||'', falsehood: mp.reliability?.falsehood||'', extremity: mp.reliability?.extremity||'' },
    fit: { job:(mp.fit?.job||[]).map(x=>({model:x.model||'', shokushitsu:num(x.shokushitsu), fudo:num(x.fudo), sogo:num(x.sogo)})).filter(x=>x.model), hp:(mp.fit?.hp||[]).map(x=>({model:x.model||'', shokushitsu:num(x.shokushitsu), fudo:num(x.fudo), sogo:num(x.sogo)})).filter(x=>x.model) },
    big5: grp(mp.big5, MPDEF.BIG5),
    bbig5: grp(mp.bbig5, MPDEF.BBIG5),
    motives: MPDEF.MOTIVES.map(n=>{ const x=(mp.motives||[]).find(y=>norm(y.name)===norm(n))||{}; return {name:n, score:num(x.score), required:num(x.required)}; }),
    traits: list(mp.required_traits||mp.traits, MPDEF.TRAITS, true),
    org: list(mp.org_behaviors||mp.org, MPDEF.ORG, false),
    exec: list(mp.executive||mp.exec, MPDEF.EXEC, true),
    sense: list(mp.business_sense||mp.sense, MPDEF.SENSE, false),
    cautions: list(mp.cautions, MPDEF.CAUTIONS, true),
    culture: MPDEF.CULTURE.map(([a])=>{ const x=(mp.culture||[]).find(y=>String(y.axis||'').toUpperCase().startsWith(a))||{}; return {axis:a, company:num(x.company), person:num(x.person)}; }),
    roles: (mp.roles||[]).map(r=>({name:r.name||'', left:r.left||'', right:r.right||'', result:r.result||''})).filter(r=>r.name),
    type16: { code:String(mp.type16?.code||mp.type16||'').toUpperCase().replace(/[^IERNLFAO]/g,'').slice(0,4), label: mp.type16?.label||'' },
    social: { suppress:num(soc.suppress), express:num(soc.express), listen:num(soc.listen), assert:num(soc.assert), driver:num(soc.driver), analytical:num(soc.analytical), expressive:num(soc.expressive), amiable:num(soc.amiable), cell: soc.cell||'' },
    mental_flag: mp.mental_flag===0||mp.mental_flag ? num(mp.mental_flag) : null,
  };

function mpReliabilityNote(r){
  const out=[];
  if(r.inconsistency==='要注意') out.push({lv:'alert', t:'非一貫性が「要注意」です。回答に一貫性がなく、この結果はほぼ参考にできません。再受検を検討してください。'});

  if(r.falsehood==='要注意') out.push({lv:'alert', t:'虚偽性が「要注意」です。自分をよく見せようとした回答の可能性が高く、かなり慎重に読む必要があります。'});

  return out;
}

function mpWaveHTML(title, groups){
  const subs = groups.flatMap(g=>g.subs).filter(s=>s.score!=null);
  if(!subs.length) return '';
  const avg = subs.reduce((a,s)=>a+s.score,0)/subs.length;
  const sorted = [...subs].sort((a,b)=>b.score-a.score);
  const hiSet = new Set(sorted.slice(0,3).map(s=>s.name)), loSet = new Set(sorted.slice(-3).map(s=>s.name));
  const fac = groups.filter(g=>g.score!=null).sort((a,b)=>b.score-a.score);
  const hiF = fac[0], loF = fac[fac.length-1];
  return `<div class="vcard wide"><h3>${esc(title)}<small>本人の中での高低（波形）で読みます</small></h3>
    <div class="wave">${groups.map(g=>`<div class="wv-f">
      <div class="wv-bars"><i class="wv-avg" style="bottom:${avg}%" title="本人の平均 ${avg.toFixed(0)}"></i>
        ${g.subs.map(s=>`<div class="wv-c ${hiSet.has(s.name)?'hi':loSet.has(s.name)?'lo':''}"><span class="wv-n">${s.score??'—'}</span><div class="wv-b" style="height:${s.score??0}%"></div></div>`).join('')}</div>
      <div class="wv-ls">${g.subs.map(s=>`<span class="wv-l">${esc(s.name)}</span>`).join('')}</div>
      <div class="wv-fn">${esc(g.factor)}<b>${g.score??'—'}</b></div></div>`).join('')}</div>

   ========================================================= */
const LCOL = { fact:'#2F5E8E', statement:'#2F6B55', interpretation:'#B08A3E' };
function parseScore(v){
  const s = String(v||'').normalize('NFKC').trim();
  let m = s.match(/^(-?\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)/);
  if(m) return { type:'num', n:+m[1], max:+m[2] };
  m = s.match(/^(-?\d+(?:\.\d+)?)\s*%$/);
  if(m) return { type:'num', n:+m[1], max:100 };
  m = s.match(/^(-?\d+(?:\.\d+)?)\s*(点|pt|件|回|秒|個)?$/i);
  if(m) return { type:'raw', n:+m[1] };   // 満点が資料に書かれていない数値は、目盛りを推測しない
  m = s.match(/^([SABCDE])[+\-]?$/i);
  if(m) return { type:'grade', g:m[1].toUpperCase() };
  const lv = ['低','やや低','中','やや高','高'];
  if(lv.includes(s)) return { type:'level', g:s, lv };
  return null;
}
function scoreRow(it){
  const sc = parseScore(it.value);
  if(!sc) return '';
  let viz, val;
  if(sc.type==='num'){ const w=Math.max(0,Math.min(100,sc.n/sc.max*100)); viz=`<div class="nbar"><i style="width:${w}%"></i></div>`; val=`${esc(it.value.replace(/\s*\/.*$/,''))}<small>/${sc.max}</small>`; }
  else if(sc.type==='raw'){ viz='<span></span>'; val=esc(it.value); }
  else if(sc.type==='grade'){ const gs=(sc.g==='S'?['S']:[]).concat(['A','B','C','D','E']); viz=`<div class="gscale">${gs.map(g=>`<span class="${g===sc.g?'on':''}">${g}</span>`).join('')}</div>`; val=esc(it.value); }
  else { viz=`<div class="gscale">${sc.lv.map(g=>`<span class="${g===sc.g?'on':''}">${g}</span>`).join('')}</div>`; val=esc(it.value); }
  const lbl = cleanLabel(it);
  return `<div class="nrow" title="${esc((it.summary||'')+'　'+(KINDS[it.source_kind]?.short||'')+' '+(it.diagnosed_on||''))}"><span class="nl">${esc(lbl)}</span>${viz}<span class="nv">${val}</span></div>`;
}
function cleanLabel(it){
  const l = String(it.label||''), v = String(it.value||'').trim();
  if(v && l.endsWith(v)) return l.slice(0, -v.length).trim() || l;
  return l.replace(/[\s:：]*-?\d+(\.\d+)?%?$/,'').trim() || l;
}
function numericProfileHTML(items){
  const facts = items.filter(i=>i.layer==='fact' && i.status!=='hidden' && parseScore(i.value));
  if(!facts.length) return '';
  const groups = {};
  facts.forEach(i=>{ const k=`${KINDS[i.source_kind]?.short||'資料'}${i.diagnosed_on?'（'+i.diagnosed_on+'）':''}`; (groups[k] ||= []).push(i); });
  const anyRaw = facts.some(i=>parseScore(i.value).type==='raw');
  return `<div class="vcard"><h3>数値プロフィール<small>資料に記載された数値・評価</small></h3>
    ${Object.entries(groups).map(([k,xs])=>`<p class="nsrc">${esc(k)}</p>${xs.map(scoreRow).join('')}`).join('')}
    <p class="vcap">目盛りは資料ごとに異なります。${anyRaw?'満点が資料に書かれていない数値は、バーを描かずに数値だけ表示しています。':''}ほかの人や別の資料の数値とは並べて比べないでください。</p></div>`;
}
function donutSVG(segs, size=132, th=20, unit='件'){
  const tot = segs.reduce((a,s)=>a+s.v,0);
  const r=(size-th)/2, C=2*Math.PI*r, c=size/2; let off=0;
  const arcs = tot ? segs.filter(s=>s.v>0).map(s=>{ const len=s.v/tot*C; const el=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${s.c}" stroke-width="${th}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${c} ${c})"/>`; off+=len; return el; }).join('') : `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#EEF1EC" stroke-width="${th}"/>`;
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="${segs.map(s=>s.l+' '+s.v+unit).join('、')}">${arcs}<text x="${c}" y="${c-6}" text-anchor="middle" font-size="24" font-weight="700" fill="#1E2940">${tot}</text><text x="${c}" y="${c+15}" text-anchor="middle" font-size="11" fill="#6B7488">${unit}</text></svg>`;
}
function compositionHTML(items){
  const vis = items.filter(i=>i.status!=='hidden');

  const segs = Object.keys(LAYERS).map(k=>({ l:LAYERS[k].label, v:cnt(k), c:LCOL[k], k }));
  const cats = CATS.filter(c=>vis.some(i=>i.category===c));
  const interpRate = Math.round(cnt('interpretation')/vis.length*100);
  return `<div class="vcard"><h3>記載の内訳<small>何を根拠にしたカルテか</small></h3>

    <p class="vcap">${interpRate>=50?`記載の${interpRate}%が資料の解釈です。本人の実感と合っているか、1on1で確かめる余地が大きいカルテです。`:`${cnt('statement')?'数値と本人の発言・実績':'資料の数値'}が中心のカルテです（解釈は${interpRate}%）。${cnt('statement')?'':'本人の発言や実績はまだ記録されていません。1on1で聞いた内容を残すと、カルテの根拠が厚くなります。'}`}</p></div>`;
}
function timelineHTML(sources, items, meetings){
  const ev = [];
  const seen = new Set();
  (sources.length ? sources.map(s=>({d:s.diagnosed_on||String(s.created_at||'').slice(0,10), k:s.kind})) : items.map(i=>({d:i.diagnosed_on, k:i.source_kind})))
    .forEach(s=>{ if(!s.d) return; const key=s.k+s.d; if(seen.has(key)) return; seen.add(key); ev.push({d:s.d, t:'src', l:KINDS[s.k]?.short||'資料'}); });
  meetings.forEach(m=>{ if(m.held_on) ev.push({d:m.held_on, t:'mtg', l:'1on1'}); });
  const nextOn = meetings[0]?.next_on;
  if(nextOn && nextOn>=today()) ev.push({d:nextOn, t:'plan', l:'次回予定'});
  if(!ev.length) return '';
  ev.sort((a,b)=>a.d.localeCompare(b.d));
  const W=900, H=150, pad=60, y=78;
  const t0 = new Date(ev[0].d).getTime(), tEnd = Math.max(new Date(ev[ev.length-1].d).getTime(), Date.now());
  const span = Math.max(tEnd-t0, 864e5*30);
  const X = d => pad + (new Date(d).getTime()-t0)/span*(W-pad*2);
  const months = []; const m0=new Date(ev[0].d); m0.setDate(1);
  for(let d=new Date(m0); d.getTime()<=t0+span; d.setMonth(d.getMonth()+1)){ if(d.getTime()>=t0-1) months.push(new Date(d)); }
  const step = Math.ceil(months.length/8);
  const tx = X(today());
  const marks = ev.map((e,i)=>{
    const x=X(e.d), up=i%2===0, ly=up?y-24:y+34;
    const shape = e.t==='src' ? `<rect x="${x-6}" y="${y-6}" width="12" height="12" rx="2" fill="${LCOL.fact}"/>`
      : e.t==='mtg' ? `<circle cx="${x}" cy="${y}" r="7" fill="${LCOL.statement}"/>`
      : `<circle cx="${x}" cy="${y}" r="7" fill="#fff" stroke="${LCOL.statement}" stroke-width="2" stroke-dasharray="3 2"/>`;
    return `<line x1="${x}" x2="${x}" y1="${up?y-16:y+8}" y2="${up?y-8:y+20}" stroke="#C9D1C7"/>${shape}<text x="${x}" y="${ly}" text-anchor="middle" font-size="12" fill="#1E2940">${esc(e.l)}</text><text x="${x}" y="${ly+(up?-14:14)}" text-anchor="middle" font-size="10.5" fill="#6B7488">${esc(e.d.slice(5).replace('-','/'))}</text>`;
  }).join('');
  return `<div class="vcard wide"><h3>経過タイムライン<small>資料の診断日・1on1・次回予定</small></h3>
    <div class="tlwrap"><svg class="tl" viewBox="0 0 ${W} ${H}" role="img" aria-label="経過タイムライン">
      <line x1="${pad}" x2="${W-pad}" y1="${y}" y2="${y}" stroke="#C9D1C7" stroke-width="2"/>
      ${months.filter((_,i)=>i%step===0).map(d=>{ const x=X(`${d.getFullYear()}-${z2(d.getMonth()+1)}-01`); return `<text x="${x}" y="${H-4}" text-anchor="middle" font-size="10.5" fill="#9AA3B2">${d.getFullYear()%100}/${d.getMonth()+1}</text><line x1="${x}" x2="${x}" y1="${H-18}" y2="${H-14}" stroke="#C9D1C7"/>`; }).join('')}
      <line x1="${tx}" x2="${tx}" y1="${y-44}" y2="${y+44}" stroke="#A33B2B" stroke-dasharray="3 3"/><text x="${tx}" y="${y-48}" text-anchor="middle" font-size="10.5" fill="#A33B2B">今日</text>
      ${marks}
    </svg></div>
    <div class="row small muted" style="gap:16px"><span class="row" style="gap:6px"><span class="swc s-fact"></span>資料</span><span class="row" style="gap:6px"><span class="swc" style="background:${LCOL.statement};border-radius:50%"></span>1on1</span><span class="row" style="gap:6px"><span class="swc" style="border:2px dashed ${LCOL.statement};border-radius:50%"></span>次回予定</span></div></div>`;
}

const SYS_CONFLICT = `[CONFLICT] 同じ社員について、複数の資料（マルコポーロ・ミルメバイタル・従業員トリセツなど）の要約が与えられます。

async function openPageViewer(sourceId, page){
  const src = (window._sources||[]).find(s=>s.id===sourceId) || (window._vsources||[]).find(s=>s.id===sourceId);
  PV.sourceId=sourceId; PV.page=Math.max(1, parseInt(String(page||'1').replace(/\D/g,''))||1); PV.pdf=null;

    <div class="row" style="margin:8px 0"><button class="btn sm" onclick="pvGo(-1)">前のページ</button><span id="pv_n" class="small"></span><button class="btn sm" onclick="pvGo(1)">次のページ</button></div>
    <div id="pv_body" class="pv-body"><p class="muted small"><span class="spin"></span>読み込み中</p></div></div>`);
  document.querySelector('#modal .modal').classList.add('wide');
  try{
    if(!src?.file_path) throw new Error(DEMO?'デモでは原本ファイルを保存していません。実運用では、ここに該当ページの画像が表示されます。':'この資料の原本は保存されていません（貼り付け文章など）。');
    if(!/\.pdf$/i.test(src.file_path)) { const url=await DB.signedUrl(src.file_path); $('#pv_body').innerHTML=`<a class="btn" href="${esc(url)}" target="_blank" rel="noopener">原本を開く</a>`; return; }
    const url = await DB.signedUrl(src.file_path); await DB.log('open_original','source',sourceId,{page:PV.page});
    const lib = await loadPdfJs();
    PV.pdf = await lib.getDocument({ url, cMapUrl:`${PDFJS_BASE}/cmaps/`, cMapPacked:true }).promise;
    PV.page = Math.min(PV.page, PV.pdf.numPages); pvRender();
  }catch(e){ $('#pv_body').innerHTML=`<div class="notice warn">${esc(e.message)}</div>`; }
}
async function pvRender(){
  if(!PV.pdf) return;
  const page = await PV.pdf.getPage(PV.page);
  const vp0 = page.getViewport({scale:1}); const box=$('#pv_body'); const w=Math.min(1100, (box?.clientWidth||800));
  const vp = page.getViewport({ scale: w/vp0.width * (window.devicePixelRatio||1) });
  const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height; c.style.width='100%';
  await page.render({canvasContext:c.getContext('2d'), viewport:vp}).promise;
  box.innerHTML=''; box.appendChild(c); $('#pv_n').textContent=`${PV.page} / ${PV.pdf.numPages} ページ`;
}
function pvGo(d){ if(!PV.pdf) return; PV.page=Math.max(1,Math.min(PV.pdf.numPages,PV.page+d)); pvRender(); }

const SYS_PLACE = `[PLACEMENT] 人事が配置・育成を検討するための下書きを作ります。
- 職務要件ごとに、本人について「分かっている事実（経験・実績・本人の発言）」と「まだ分からないこと」を分けて書く。
- 事実が無い要件は、推測で埋めずに「確認すべき点」として質問にする。
- 診断結果（マルコポーロなど）は、確認の観点として触れるだけにし、根拠の中心にしない。点数で向き不向きや順位を決めない。
- 異動・昇格・適性の結論は出さない。
- 職種の条件と本人の活かしどころ（強みが出る条件）がずれている要素は、「その条件を整えられるか（役割の切り方・上司の関わり方）」を確認すべき点と育成案に含める。本人のつまずきやすい点が出やすい条件の職種なら、防ぐ条件づくりを育成案に入れる。
- plan は、要件とのギャップを埋める育成案（具体的な行動・担当・期間）。本人の希望と食い違う場合は、まず本人と話す案にする。
出力はJSONのみ: {"check_points":[{"requirement":"","known":"","unknown":"","question":""}],"plan":[{"action":"","why":"","owner":"本人|上司|人事","period":""}]}`;
let PLC = { tab:'review', pid:'', jobId:'', draft:null };
async function viewPlacement(){
  if(!S.hr){ $('#main').innerHTML='<div class="empty">人事・経営層のみ利用できます。</div>'; return; }
  const jobs = await soft(DB.list('hr_jobs',{}),[]); jobs.sort((a,b)=>(a.sort||0)-(b.sort||0)||String(a.name).localeCompare(b.name));
  window._jobs = jobs;
  const tabs = `<div class="viewas" style="margin-bottom:16px"><button class="${PLC.tab==='review'?'on':''}" onclick="PLC.tab='review';viewPlacement()">配置・育成の検討</button><button class="${PLC.tab==='jobs'?'on':''}" onclick="PLC.tab='jobs';viewPlacement()">職務要件の編集</button></div>`;
  const head = `<div class="pagehead"><div><h1>配置・育成検討</h1><p class="sub">職務要件と、本人の経験・実績・希望・面談内容を並べて「確認すべき点」と「育成案」を整理します。</p></div></div>
    <div class="notice info">診断点数だけで適職の順位付けや、異動・昇格の決定はしません。AIの出力は下書きです。人が確認・編集してから確定してください。</div>${tabs}`;
  if(PLC.tab==='jobs'){
    $('#main').innerHTML = head + `${jobs.length?'':`<div class="empty">職務要件がまだありません。<br><button class="btn pri" onclick="seedJobs(this)">職務の初期案（FS・IS・発電所・蓄電池開発・用地開拓・許認可・設計・工程管理・品質・CS・O&M・エネルギーアセット・管理部門）を読み込む</button></div>`}
      ${jobsHeadHTML(jobs)}${jobs.map(jobCardHTML).join('')}
      <button class="btn" style="margin-top:12px" onclick="editJob('')">職種を追加</button>`;
    return;
  }
  const p = S.people.find(x=>x.id===PLC.pid); const j = jobs.find(x=>x.id===PLC.jobId);
  let body = '';
  if(p && j){
    const [items, results, actions, meetings, reviews, shs] = await Promise.all([ DB.items(p.id), soft(DB.list('hr_results',{person_id:p.id}),[]), soft(DB.list('hr_actions',{person_id:p.id}),[]), DB.meetings(p.id).catch(()=>[]), soft(DB.list('hr_placement_reviews',{person_id:p.id}),[]), soft(DB.list('hr_shine',{person_id:p.id}),[]) ]);
    shs.sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));
    const facts = items.filter(i=>i.status==='active'&&isConfirmedItem(i)&&i.category!==MP_CAT&&!i.sensitive);
    PLC.ctx = { p, j, facts, results, actions, meetings, mp:mpSummaryForAI(items.filter(isConfirmedItem)), shine:shs[0]||null };
    const d = PLC.draft;
    body = `<div class="plc">
      <div class="panel"><h3>${esc(j.name)} の職務要件</h3>${j.basis!=='official'?'<span class="tag interp">初期案（会社の正式基準ではありません）</span>':''}${j.responsibility?`<p class="small" style="margin-top:6px"><span class="muted">役割と結果責任</span>　${esc(j.responsibility)}</p>`:''}<ul class="acts">${(j.requirements||[]).map(r=>`<li><b>${esc(r.label)}</b>：${esc(r.behavior||'')}</li>`).join('')}</ul>${j.experience?`<p class="small" style="margin-top:6px"><span class="muted">望ましい経験</span>　${esc(j.experience)}</p>`:''}</div>
      <div class="panel"><h3>${esc(p.full_name)} について分かっていること</h3>
        <p class="small"><span class="muted">現在の役割</span>　${esc(p.current_job||p.position||'未登録')}　<span class="muted">希望</span>　${esc(p.desired_role||'本人に確認')}</p>
        <p class="small" style="margin-top:4px"><span class="muted">経験</span>　${esc(p.experience||'未登録')}</p>
        <p class="small" style="margin-top:4px"><span class="muted">成果</span>　${results.length?results.slice(0,3).map(r=>esc(`${r.period||fmtD(r.created_at)}：${r.body}`)).join('<br>'):'未登録'}</p>
        <p class="small" style="margin-top:4px"><span class="muted">育成行動の結果</span>　${actions.filter(a=>a.result).slice(0,3).map(a=>esc(`${a.action} → ${a.result}${a.helpful?'（'+A_HELP[a.helpful]+'）':''}`)).join('<br>')||'記録なし'}</p>
        <p class="small" style="margin-top:4px"><span class="muted">面談での本人の希望</span>　${meetings.filter(m=>m.wish).slice(0,2).map(m=>esc(`${m.held_on}：${m.wish}`)).join('<br>')||'記録なし'}</p>
        <p class="small" style="margin-top:4px"><span class="muted">本人の発言・実績（資料）</span>　${facts.filter(i=>i.layer==='statement').slice(0,4).map(i=>esc(i.summary||i.label)).join('／')||'なし'}</p>
        ${PLC.ctx.mp?`<details class="small" style="margin-top:6px"><summary>確認の観点（診断）</summary><pre class="mpsum">${esc(PLC.ctx.mp)}</pre></details>`:''}</div>
    </div>
    ${condMatchHTML(j, shs[0])}

async function genRoleQuestions(btn){

/* =========================================================
   輝き方の設計：①つまずきやすい点（未完成） ②伸び筋 ③活かしどころ
   人に○×を付けるのではなく、どこを磨き、どんな条件を整えれば輝くかを言葉にする
   ========================================================= */
const SHINE_SCENES = { 判断:'決められない／決めすぎる', 対人:'強く出る／引きすぎる', 実行:'詰めが甘い／着手が遅い／やり切れない', 負荷:'抱え込む／投げる／感情が荒れる／萎縮する' };
const COND_AXES = [
  { key:'role_new',   group:'役割',       opts:['新規','既存'] },
  { key:'role_span',  group:'役割',       opts:['短距離（すぐ成果）','長距離（仕組みづくり）'] },
  { key:'role_team',  group:'役割',       opts:['個人戦','チーム戦'] },
  { key:'discretion', group:'裁量',       opts:['自由度が高い','枠（ルール・手順）がある'] },
  { key:'evaluation', group:'評価軸',     opts:['量・スピード','質・再現性'] },
  { key:'boss',       group:'上司の関わり', opts:['任せる','詰める','伴走する'] },
  { key:'team',       group:'チーム環境', opts:['ぶつかり合いがある','安定している'] },
];
const SH_ST = { hypothesis:'仮説', confirmed:'確認済み', differs:'本人の認識と違う' };
const LENS = { stumble:'つまずきを防ぐ条件づくり', growth:'伸び筋を伸ばす', condition:'活かしどころに置く（役割・環境）' };
const shTag = s => `<span class="tag ${s==='confirmed'?'sage':s==='differs'?'alert':'interp'}">${SH_ST[s]||'仮説'}</span>`;
function emptyShine(){ return { stumbles:[], growth:[], conditions:{}, shine_where:'', dull_where:'', share_with_self:false }; }
function normShine(x){
  x = x||{}; const S0=emptyShine();
  return { ...S0, ...x,
    stumbles:(x.stumbles||[]).map(s=>({ scene:SHINE_SCENES[s.scene]!==undefined?s.scene:'実行', pattern:s.pattern||'', when:s.when||'', prevent:s.prevent||'', basis:s.basis||'', status:s.status||'hypothesis' })),
    growth:(x.growth||[]).map(g=>({ strength:g.strength||'', near_gap:g.near_gap||'', how:g.how||'', basis:g.basis||'', status:g.status||'hypothesis' })),
    conditions:Object.fromEntries(COND_AXES.map(a=>{ const c=(x.conditions||{})[a.key]||{}; return [a.key,{ value:a.opts.includes(c.value)?c.value:'', basis:c.basis||'', status:c.status||'hypothesis' }]; })) };
}
function shineCounts(sh){ const all=[...sh.stumbles, ...sh.growth, ...Object.values(sh.conditions).filter(c=>c.value)]; return { n:all.length, hyp:all.filter(x=>x.status==='hypothesis').length, conf:all.filter(x=>x.status==='confirmed').length }; }

      <section class="sh-col lv"><h3><span>③</span>活かしどころ<small>強みが出る条件</small></h3>
        ${conds.length?`<div class="conds">${conds.map(a=>{ const c=sh.conditions[a.key]; return `<div class="cond"><span class="cg">${a.group}</span><b>${esc(c.value)}</b>${c.status!=='confirmed'?`<em>${SH_ST[c.status]}</em>`:''}</div>`; }).join('')}</div>`:'<p class="small muted">条件は未登録</p>'}
        ${sh.shine_where?`<p class="sh-where ok"><i>ここに置けば光る</i>${esc(sh.shine_where)}</p>`:''}${sh.dull_where?`<p class="sh-where ng"><i>ここだと鈍る</i>${esc(sh.dull_where)}</p>`:''}</section>
    </div></div>`;
}

function shSet(path, v){ const ks=path.split('.'); let o=SH.data; for(let i=0;i<ks.length-1;i++) o=o[ks[i]]; o[ks[ks.length-1]]=v; }
async function saveShine(btn, status){
  const d = SH.data;
  d.stumbles = d.stumbles.filter(s=>s.pattern.trim()); d.growth = d.growth.filter(g=>g.strength.trim()||g.near_gap.trim());

  if(bad && !confirm('断定的・否定的な表現が含まれています。「条件が悪いと出やすいクセ」として書き直さずに保存しますか？')) return;
  if(status==='confirmed' && d.share_with_self && shineCounts(d).hyp && !confirm('本人未確認の仮説が残っています。この状態で本人にも表示しますか？')) return;

  try{ await DB.insert('hr_shine',{ person_id:SH.pid, stumbles:d.stumbles, growth:d.growth, conditions:d.conditions, shine_where:d.shine_where||null, dull_where:d.dull_where||null, share_with_self:!!d.share_with_self, status, created_by:S.me.email });

const SYS_SHINE = `[SHINE] 社員一人ひとりの「輝き方」を設計するための仮説を作ります。人に○×を付けるためではありません。
3つの視点で書く:
① stumbles つまずきやすい点（未完成）：能力不足ではなく、状況や負荷がかかったときに出やすい“つまずき方のクセ”。場面（判断・対人・実行・負荷）、出やすい条件、整える条件をセットで書く。
② growth 伸び筋：研修で一律に伸ばす話ではなく、上司の任せ方・課題の出し方・振り返り方の設計で伸びるところ。「強みの近くにある未完成」を狙う（例：決断が速い→根拠の共有を教える）。
③ conditions 活かしどころ：強みが出る条件。役割（新規/既存、短距離/長距離、個人戦/チーム戦）、裁量、評価軸、上司の関わり、チーム環境から選ぶ。根拠が無い要素は空にする。

- 実績・1on1での本人の発言・育成行動の結果を優先し、診断結果だけに基づくものは basis に「診断（仮説）」と書く。
- 「欠点」「向いていない」「能力が低い」などの断定・否定の言葉は使わない。条件で表現する。
- 私生活・健康・メンタルには触れない。
- 各要素は2〜3件まで。
出力はJSONのみ: {"stumbles":[{"scene":"判断|対人|実行|負荷","pattern":"","when":"","prevent":"","basis":""}],"growth":[{"strength":"","near_gap":"","how":"","basis":""}],"conditions":{"role_new":{"value":"新規|既存","basis":""},"role_span":{"value":"短距離（すぐ成果）|長距離（仕組みづくり）","basis":""},"role_team":{"value":"個人戦|チーム戦","basis":""},"discretion":{"value":"自由度が高い|枠（ルール・手順）がある","basis":""},"evaluation":{"value":"量・スピード|質・再現性","basis":""},"boss":{"value":"任せる|詰める|伴走する","basis":""},"team":{"value":"ぶつかり合いがある|安定している","basis":""}},"shine_where":"","dull_where":""}`;

function shineHypList(sh){

  d.stumbles.forEach((s,i)=>{ if(s.status==='hypothesis') out.push({ key:`stumbles.${i}`, label:`つまずきやすい点（${s.scene}）`, text:`${s.pattern}${s.when?`（${s.when}に出やすい）`:''}` }); });
  d.growth.forEach((g,i)=>{ if(g.status==='hypothesis') out.push({ key:`growth.${i}`, label:'伸び筋', text:`${g.strength} → ${g.near_gap}${g.how?`（伸ばし方：${g.how}）`:''}` }); });
  COND_AXES.forEach(a=>{ const c=d.conditions[a.key]; if(c.value && c.status==='hypothesis') out.push({ key:`conditions.${a.key}`, label:`活かしどころ（${a.group}）`, text:c.value }); });

function matchPerson(name, no){

function prepItems(items, kind){

    const strong = STRONG_WORDS.test(x.original||'') || STRONG_WORDS.test(x.summary||'');
    const it = { layer: LAYERS[x.layer]?x.layer:'interpretation', category: CATS.includes(x.category)?x.category:'その他', label:cleanLabel({label:String(x.label||'').slice(0,40), value:x.value||''}), value:x.value||'', original:x.original||'', summary: STRONG_WORDS.test(x.summary||'') ? '' : (x.summary||''), page:x.page||'', sensitive:!!x.sensitive||strong, strong, needs_check: kind==='milme' ? (x.layer==='fact'||!!x.value) : !!x.needs_check, exclude:false };
    applyVisibilityDefaults(it); return it;
  });
}
function applyVisibilityDefaults(it){
  if(it.sensitive){ it.visible_to_manager=false; it.visible_to_self=false; return; }
  it.visible_to_manager = true;
  it.visible_to_self = it.layer!=='interpretation';

function startTicker(btn, label){

  const tick = ()=>{ const s=Math.floor((Date.now()-t0)/1000); btn.innerHTML=`<span class="spin"></span>${label} ${s}秒${s>=20?'（画像のPDFは1〜2分かかります）':''}`; };
  tick(); return setInterval(tick, 1000);

async function runImport(btn){
  const k = IMP.kind;
  if(IMP.method==='paste' ? !IMP.text.trim() : !IMP.file) return toast(IMP.method==='paste'?'文章を貼り付けてください':'ファイルを選んでください', true);
  const err = $('#imp_err'); if(err) err.innerHTML='';
  busy(btn,true,'読み取り中');
  const ticker = startTicker(btn,'読み取り中');
  try{
    IMP.queue=[]; IMP.qi=0; IMP.filePath=null;
    const isPdf = IMP.file && /\.pdf$/i.test(IMP.file.name);
    if(k!=='torisetsu' || isPdf){
      if(DEMO){ const pp=S.people.find(p=>p.id===IMP.presetPid); IMP.demoName = pp?pp.full_name:''; }
      const pin = DEMO ? {text:'',images:[],pages:1,used:1} : await pdfToInputs(IMP.file);
      const hasText = pin.text.replace(/\s|-|\d|ページ/g,'').length > 40;
      const prompt = `${KIND_HINT[k]}\n\n資料はPDFをページ画像にして添付しています（全${pin.pages}ページ中${pin.used}ページ）。`
        + (hasText ? `\n参考として、PDFから取り出した文字も付けます。画像と食い違う場合は画像を優先してください。\n<PDFの文字>\n${pin.text.slice(0,20000)}\n</PDFの文字>` : '');
      const out = parseJSON(await callAI({ system: k==='marcopolo'?SYS_MP:SYS_EXTRACT, prompt, images:pin.images, max_tokens: k==='marcopolo'?12000:8000, timeoutSec: k==='marcopolo'?240:180 }));
      if((!out.items || !out.items.length) && !out.mp && out.error) throw new Error('AIが読み取れませんでした：' + out.error);
      const m = IMP.presetPid ? {id:IMP.presetPid, how:'登録時に指定'} : matchPerson(out.subject_name, out.employee_no);
      IMP.queue.push({ subject_name:out.subject_name||'', employee_no:out.employee_no||'', diagnosed_on: IMP.diagnosed_on || out.diagnosed_on || '', personId:m.id, how:m.how, raw_text:'', items:prepItems(out.items,k), checked:false, mp: k==='marcopolo' && out.mp ? normalizeMP(out.mp) : null, saveMental:false });
      IMP.step='review';
    } else {
      let text = IMP.text;
      if(IMP.method!=='paste'){
        if(/\.docx$/i.test(IMP.file.name)){ const ab = await IMP.file.arrayBuffer(); text = (await mammoth.extractRawText({arrayBuffer:ab})).value; }
        else text = await IMP.file.text();
        IMP.text = text;
      }
      if(!text.trim()) throw new Error('文書から文字を読み取れませんでした');
      const out = parseJSON(await callAI({ system:SYS_SPLIT, prompt:text.slice(0,60000), max_tokens:2000 }));
      IMP.segments = splitByAnchors(text, out.segments||[]);
      if(!IMP.segments.length) IMP.segments = [{ name:'', employee_no:'', text, found:true }];
      IMP.segments.forEach(s=>{ const m=matchPerson(s.name,s.employee_no); s.personId = m.id || (s.name?'__new':''); s.how=m.how; });
      IMP.step='map';
    }
    clearInterval(ticker); viewImport();
  }catch(e){ clearInterval(ticker); busy(btn,false); console.error(e); showImportError(e.message); }
}
function splitByAnchors(text, segs){
  const found = [];
  let from = 0;
  segs.forEach(s=>{
    let pos = s.anchor ? text.indexOf(s.anchor, from) : -1;
    if(pos<0 && s.anchor) pos = text.indexOf(s.anchor.trim().slice(0,12), from);
    if(pos<0 && s.name) pos = text.indexOf(s.name, from);
    found.push({ ...s, pos, found: pos>=0 });
    if(pos>=0) from = pos+1;
  });
  const ok = found.filter(s=>s.found).sort((a,b)=>a.pos-b.pos);
  const res = ok.map((s,i)=>({ name:s.name, employee_no:s.employee_no, text:text.slice(s.pos, i+1<ok.length?ok[i+1].pos:text.length).trim(), found:true }));
  found.filter(s=>!s.found).forEach(s=>res.push({ name:s.name, employee_no:s.employee_no, text:'', found:false }));
  return res;
}

  const targets = IMP.segments.filter(s=>s.personId && s.found);

      btn.innerHTML = `<span class="spin"></span>抽出中 ${i+1}/${targets.length}`;
      IMP.demoName = s.name;

async function registerCurrent(btn){

      if(c.saveMental && mental_flag!=null) mpRows.push({ person_id:pid, source_id:src.id, source_kind:IMP.kind, source_name:src.file_name, diagnosed_on:c.diagnosed_on||null, layer:'fact', category:MP_CAT, label:'メンタルフラグ', summary:'人事・経営層のみ', data:{mental_flag}, sensitive:true, needs_check:false, status:'active', visible_to_manager:false, visible_to_self:false, updated_by:S.me.email });
      try{ await DB.addItems(mpRows); }
      catch(e){ if(/data/.test(e.message)) throw new Error('マルコポーロの数値を保存する列がまだありません。Supabaseで「alter table hr_items add column if not exists data jsonb;」を実行してから、もう一度登録してください。'); throw e; }
    }

let M = null;
const SYS_ACTIONS = `[ACTIONS] 1on1で決める「育成行動」の案を作ります。案は上司と本人が話し合って直す前提の下書きです。
- 2〜3件。仕事上の具体的な課題に対して、次の確認日までに試せる小さな行動にする。
- 性格を直す行動ではなく、行動・やり方・環境を変える内容にする。
- metric は成果を確認する指標。baseline は与えられた事実から分かる実施前の状態。分からなければ「本人に確認」と書く。数値を作らない。
- 前回の行動の結果がある場合は、それを踏まえる（役に立たなかったものは繰り返さない）。
- 診断結果だけを根拠にしない。事実・本人の希望・前回の結果を優先する。
- 輝き方の設計がある場合は、行動のねらい lens を選ぶ：stumble＝つまずきやすい点が出ないよう条件を整える（多くは上司の関わり方・進め方の工夫）、growth＝伸び筋を伸ばす（強みの近くの未完成を、任せ方・課題の出し方・振り返り方で伸ばす）、condition＝活かしどころに置く（強みが出る役割・環境をつくる）。
出力はJSONのみ: {"actions":[{"issue":"","action":"","owner":"本人|上司|人事","theme":"","lens":"stumble|growth|condition","metric":"","baseline":"","due_in_days":30}]}`;
async function startMeeting(pid, mid){
  const [meetings, actions, points] = await Promise.all([ DB.meetings(pid).catch(()=>[]), soft(DB.list('hr_actions',{person_id:pid}),[]), soft(DB.list('hr_confirm_points',{person_id:pid}),[]) ]);
  const ex = mid ? meetings.find(m=>m.id===mid) : null;
  const prev = meetings.find(m=>m.id!==mid && (!ex || String(m.held_on)<=String(ex.held_on)));
  M = ex ? { ...ex, questions:ex.questions||[], try_actions:ex.try_actions||[], themes:ex.themes||[] }
         : { person_id:pid, held_on:today(), interviewer_email:S.me.email, focus:'', questions:[], try_actions:[], wish:'', themes:[], next_on:addDays(today(),30) };
  // 振り返り対象：この面談で振り返った行動（既存）＋ まだ判断していない行動
  const reviewedIds = new Set((ex?.reviews||[]).map(r=>r.action_id));
  M._reviewList = actions.filter(a=> reviewedIds.has(a.id) || (!ex && needsReview(a) && a.meeting_id!==mid));
  M._rv = {}; M._reviewList.forEach(a=>{ const r=(ex?.reviews||[]).find(x=>x.action_id===a.id)||{}; M._rv[a.id]={ status:r.status??a.status, reaction:r.reaction??(ex?a.reaction:''), result:r.result??(ex?a.result:''), helpful:r.helpful??(ex?a.helpful:''), decision:r.decision??(ex?a.decision:''), decision_note:r.decision_note??(ex?a.decision_note:''), next_check_on:r.next_check_on||'' }; });
  const answered = new Set((ex?.confirm_answers||[]).map(c=>c.point_id));
  M._cpList = points.filter(x=> answered.has(x.id) || (!ex && x.status==='open'));
  M._cp = {}; M._cpList.forEach(x=>{ const c=(ex?.confirm_answers||[]).find(y=>y.point_id===x.id)||{}; M._cp[x.id]={ status:c.status??x.status, answer:c.answer??(x.answer||'') }; });
  M._drafts = actions.filter(a=>ex && a.meeting_id===ex.id).map(a=>({...a, _existing:true}));
  M._prev = prev||null; M._allActions = actions;
  const mf = await loadMeetingFollowups(S.people.find(x=>x.id===pid), M.held_on); M._fus = ex ? [] : mf.fus; M._trs = mf.trs; M._fuRec = {};
  const shs = await soft(DB.list('hr_shine',{person_id:pid}),[]); shs.sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));
  M._shine = shs[0]||null; M._shRv = {};
  (ex?.confirm_answers||[]).filter(c=>c.shine_key).forEach(c=>M._shRv[c.shine_key]=c.status==='agreed'?'confirmed':'differs');
  go('meeting', pid);
}

function meetingContext(p){
  const lines = M._items.map(i=>`- [${LAYERS[i.layer].label}／${i.category}] ${i.label}${i.value?'：'+i.value:''}　${i.summary||''}（${KINDS[i.source_kind]?.short||''} ${i.diagnosed_on||''}）`).join('\n');
  const rv = M._reviewList.map(a=>{ const r=M._rv[a.id]; return `- 行動「${a.action}」（課題：${a.issue||'—'}／指標：${a.metric||'—'}／実施前：${a.baseline||'—'}）状況：${A_STATUS[r.status]||'—'}、結果：${r.result||a.result||'未記録'}、役立ち：${A_HELP[r.helpful]||'未記録'}、判断：${A_DEC[r.decision]||'未判断'}`; }).join('\n');
  const cp = M._cpList.map(x=>`- ${x.topic}：${x.detail||''}`).join('\n');
  const mpSum = mpSummaryForAI(M._mp||[]);
  let myStyle=''; try{ myStyle=localStorage.getItem('hk_my_style')||''; }catch{}
  return `対象：${p.full_name}（${p.department||''}）\n現在の役割：${p.current_job||p.position||'未登録'}\n本人の希望する役割：${p.desired_role||'未確認'}\n直近の成果：${M._results[0]?.body||'未登録'}\n今回話したいこと：${M.focus||'特になし'}\n\nカルテ（確認済みの記載。解釈は本人未確認）:\n${lines||'（なし）'}\n\n${mpSum?mpSum+'\n\n':''}${myStyle?`面談者のソーシャルスタイル：${myStyle}\n\n`:''}前回からの育成行動:\n${rv||'（なし）'}\n\n本人に確認する事項:\n${cp||'（なし）'}\n\n前回の本人の希望：${M._prev?.wish||'記録なし'}${M._shine?'\n\n'+shineSummaryForAI(M._shine):''}`;
}
async function genQuestions(btn){
  const p = S.people.find(x=>x.id===S.pid);
  busy(btn,true,'作成中');
  try{
    const out = parseJSON(await callAI({ system:SYS_QUESTIONS, prompt:meetingContext(p), max_tokens:2000 }));
    M.questions = (out.questions||[]).slice(0,5).map(q=>({ q:q.q||'', basis:q.basis||'', aim:q.aim||'', answer:'' }));
    M.try_actions = (out.try_actions||[]).slice(0,3);
    await DB.log('generate_questions','person',p.id);
    viewMeeting();
  }catch(e){ busy(btn,false); toast(e.message,true); }
}
async function genActionDrafts(btn){
  const p = S.people.find(x=>x.id===S.pid);
  busy(btn,true,'作成中');
  try{
    const ans = M.questions.filter(q=>q.answer).map(q=>`Q:${q.q}\nA:${q.answer}`).join('\n');
    const out = parseJSON(await callAI({ system:SYS_ACTIONS, prompt:meetingContext(p)+(ans?`\n\n今日の対話:\n${ans}`:'')+(M.wish?`\n本人の希望・気づき：${M.wish}`:''), max_tokens:2000 }));
    (out.actions||[]).slice(0,3).forEach(a=>M._drafts.push({ issue:a.issue||'', action:a.action||'', owner:OWNERS.includes(a.owner)?a.owner:'本人', theme:THEMES.includes(a.theme)?a.theme:'', lens:LENS[a.lens]?a.lens:'', start_on:M.held_on, due_on:addDays(M.held_on, Math.min(90,Math.max(7,+a.due_in_days||30))), metric:a.metric||'', baseline:a.baseline||'本人に確認', ai_suggested:true }));
    await DB.log('generate_actions','person',p.id);
    viewMeeting();
  }catch(e){ busy(btn,false); toast(e.message,true); }
}
async function saveMeeting(btn){
  const p = S.people.find(x=>x.id===S.pid);
  if(!M.held_on) return toast('実施日を入力してください', true);
  const drafts = M._drafts.filter(d=>(d.action||'').trim());
  if(M._drafts.some(d=>!(d.action||'').trim() && ((d.issue||'').trim()||(d.metric||'').trim()))) return toast('「試す行動」が空の行動案があります。入力するか削除してください', true);
  const unconfirmedAI = drafts.filter(d=>d.ai_suggested && !d._edited && !d._existing);
  if(unconfirmedAI.length && !confirm(`AIの提案のまま確定していない行動が${unconfirmedAI.length}件あります。この内容で本人と合意済みとして保存しますか？`)) return;
  busy(btn,true,'保存中');
  try{
    const reviews = M._reviewList.map(a=>({ action_id:a.id, action:a.action, ...M._rv[a.id] })).filter(r=>r.status||r.result||r.reaction||r.helpful||r.decision);
    const confirm_answers = M._cpList.map(x=>({ point_id:x.id, topic:x.topic, ...M._cp[x.id] })).filter(c=>c.status!=='open'||c.answer);
    const shHyp = shineHypList(M._shine);
    Object.entries(M._shRv).filter(([,v])=>v).forEach(([k,v])=>{ const x=shHyp.find(y=>y.key===k)||{label:'輝き方',text:k}; confirm_answers.push({ point_id:null, shine_key:k, topic:`輝き方：${x.label} ${x.text}`, status:v==='confirmed'?'agreed':'differs', answer:'' }); });
    const rec = { person_id:M.person_id, held_on:M.held_on, interviewer_email:M.interviewer_email||S.me.email, focus:M.focus||null, questions:M.questions.filter(q=>q.q&&q.q.trim()), try_actions:M.try_actions, wish:M.wish||null, themes:M.themes, next_on:M.next_on||null,
      next_actions: drafts.map(d=>({ what:d.action, who:d.owner, due:d.due_on, done:false })), reviews, confirm_answers };
    if(M.id) rec.id = M.id;
    let saved;
    try{ saved = await DB.saveMeeting(rec); }catch(e){ throw schemaError(e); }
    M.id = saved.id;
    // 1) 振り返った行動を更新（経過を残す）
    for(const r of reviews){
      const a = M._reviewList.find(x=>x.id===r.action_id);
      const hist = (a.history||[]).filter(h=>h.meeting_id!==saved.id);
      hist.push({ meeting_id:saved.id, date:M.held_on, event:'review', status:r.status, reaction:r.reaction, result:r.result, helpful:r.helpful, decision:r.decision, decision_note:r.decision_note, by:S.me.email });
      const patch = { status:r.status||a.status, reaction:r.reaction||null, result:r.result||null, helpful:r.helpful||null, decision:r.decision||null, decision_note:r.decision_note||null, history:hist };
      if(r.decision) patch.decided_on = M.held_on;
      if(r.decision==='continue'){ patch.decision=null; patch.decided_on=null; if(r.next_check_on) patch.due_on=r.next_check_on; if(patch.status==='done') patch.status='doing'; hist[hist.length-1].decision='continue'; }
      await DB.update('hr_actions', a.id, patch);
    }
    // 2) 新しい行動（仮説）
    for(const d of drafts){
      const row = { issue:d.issue||null, action:d.action.trim(), owner:d.owner||'本人', theme:d.theme||null, lens:d.lens||null, start_on:d.start_on||M.held_on, due_on:d.due_on||null, metric:d.metric||null, baseline:d.baseline||null };
      if(d._existing) await DB.update('hr_actions', d.id, row);
      else await DB.insert('hr_actions', { ...row, person_id:M.person_id, meeting_id:saved.id, status:'planned', ai_suggested:!!d.ai_suggested, history:[{ meeting_id:saved.id, date:M.held_on, event:'created', by:S.me.email, from:d._from||null }], created_by:S.me.email });
    }
    // 3) 本人確認の結果
    const shChanges = Object.entries(M._shRv).filter(([,v])=>v);
    if(M._shine && shChanges.length){ const d=normShine(M._shine); shChanges.forEach(([k,v])=>{ const ks=k.split('.'); const o = ks[0]==='conditions' ? d.conditions[ks[1]] : d[ks[0]][+ks[1]]; if(o) o.status=v; });
      await DB.insert('hr_shine',{ person_id:M.person_id, stumbles:d.stumbles, growth:d.growth, conditions:d.conditions, shine_where:d.shine_where||null, dull_where:d.dull_where||null, share_with_self:!!M._shine.share_with_self, status:M._shine.status, created_by:S.me.email }); }
    for(const c of confirm_answers.filter(c=>c.point_id)) await DB.update('hr_confirm_points', c.point_id, { status:c.status, answer:c.answer||null, answered_on:c.status!=='open'?M.held_on:null, meeting_id:saved.id });
    const wr = $('#m_wish_role');
    if(relOf(p)==='hr' && wr && wr.value.trim() !== (p.desired_role||'')){ await DB.savePerson({ id:p.id, desired_role:wr.value.trim()||null }); await reloadPeople(); }
    const fuMsgs = await saveMeetingFollowups(saved.id);
    await DB.log('save_meeting','meeting',saved.id,{person_id:p.id, reviews:reviews.length, new_actions:drafts.length, followups:(M._fus||[]).length});
    M = null; toast(fuMsgs.length?'1on1の記録を保存しました。'+fuMsgs.join('／'):'1on1の記録を保存しました', fuMsgs.length>0); go('karte', p.id);
  }catch(e){ busy(btn,false); toast(schemaError(e).message,true); }
}

async function masterOf(p){
  if(!p || !p.employee_id) return null;
  const r = await soft(DB.ecList('ec_employees',{id:p.employee_id}),[]); const e = r[0]; if(!e) return null;
  if(e.manager_id){ const m = await soft(DB.ecList('ec_employees',{id:e.manager_id}),[]); e._manager = m[0]?.full_name || ''; }
  return e;
}
async function transfersOf(p){
  if(!p || !p.employee_id) return { trs:[], fus:[] };
  const trs = (await soft(DB.ecList('ec_transfers',{employee_id:p.employee_id}),[])).filter(t=>t.status!=='cancelled').sort((a,b)=>String(b.effective_date).localeCompare(String(a.effective_date)));
  const fus = (await soft(DB.ecList('ec_transfer_followups',{employee_id:p.employee_id}),[])).sort((a,b)=>a.stage-b.stage);
  return { trs, fus };
}

const SYS_REL = `[RELATION] 直属上司と部下の「関わり方の案」を作ります。
- 観点は6つ：instruction=指示の出し方、report=報告の頻度、discretion=裁量の持たせ方、understanding=理解確認の方法、friction=衝突しやすい場面、try=双方が試す具体的な行動。
- 与えられた情報（本人の発言・実績、確認済みの資料の要約、輝き方の設計、上司側の情報）だけを根拠にする。資料の解釈や仮説は「〜かもしれないので確認」と書く。

出力はJSONのみ: {"items":{"instruction":"","report":"","discretion":"","understanding":"","friction":"","try":""}}`;
async function genRelation(btn, pid){
  const p = S.people.find(x=>x.id===pid); const rel = relOf(p); if(!(rel==='hr'||rel==='manager')) return;
  busy(btn,true,'作成中');
  try{
    // 送る情報は、この利用者が閲覧できる範囲（サーバーの権限で取得したもの）に限る
    const items = (await DB.items(pid)).filter(i=>i.status==='active' && isConfirmedItem(i) && !i.sensitive && i.category!==MP_CAT && (rel==='hr' || i.visible_to_manager));
    const shs = await soft(DB.list('hr_shine',{person_id:pid}),[]); shs.sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));
    const boss = S.people.find(x=>x.self_email && lower(x.self_email)===lower(p.manager_email));
    let bossTxt = '上司側の情報：なし（閲覧権限の範囲外、または未登録）';
    if(boss && relOf(boss)){ const bs = await soft(DB.list('hr_shine',{person_id:boss.id}),[]); bs.sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at))); if(bs[0]) bossTxt = '上司側の情報：\n'+shineSummaryForAI(bs[0]); }
