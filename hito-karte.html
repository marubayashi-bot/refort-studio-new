<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ひとカルテ｜社員理解・育成支援</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script>window.__noEC = false;</script>

<style>
:root{
  --ink:#1E2940; --ink2:#46506A; --muted:#6B7488;
  --paper:#F2F4F1; --panel:#FFFFFF; --line:#DAE0D8; --line2:#C9D1C7;
  --sage:#2F6B55; --sage-2:#E1ECE5;
  --fact:#2F5E8E; --fact-2:#E6EEF7;
  --stmt:#2F6B55; --stmt-2:#E1ECE5;
  --interp:#8A6219; --interp-2:#F6EDDA;
  --alert:#A33B2B; --alert-2:#F8E4E0;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans",sans-serif;color:var(--ink);background:var(--paper);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif;font-weight:700;line-height:1.35;margin:0}
h1{font-size:26px} h2{font-size:19px} h3{font-size:16px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fact);outline-offset:2px}
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--ink);color:#E7EBF2;padding:24px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{padding:0 10px 18px;border-bottom:1px solid #34405C;margin-bottom:10px}
.brand b{font-family:"Zen Kaku Gothic New",sans-serif;font-size:22px;letter-spacing:.04em;display:block}
.brand small{color:#A9B3C6;font-size:12px}
.nav{all:unset;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;color:#CDD4E1;font-size:14px}
.nav:hover{background:#2A3552;color:#fff}
.nav.on{background:#EEF2EC;color:var(--ink);font-weight:700}
.nav .cnt{margin-left:auto;background:var(--alert);color:#fff;border-radius:10px;font-size:11px;padding:0 7px;line-height:18px}
.side .me{margin-top:auto;padding:12px 10px 0;border-top:1px solid #34405C;font-size:12px;color:#A9B3C6}
.side .me b{color:#fff;display:block;font-size:13px}
.side select{width:100%;margin-top:6px;background:#2A3552;border:1px solid #3B4866;color:#fff;border-radius:6px;padding:4px}
.main{padding:30px clamp(16px,4vw,48px) 80px;max-width:1200px;width:100%}
.pagehead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.pagehead .sub{color:var(--muted);font-size:13px;margin-top:4px}
.pagehead .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--sage);border-color:var(--sage);color:#fff}
.btn.pri:hover{background:#265846}
.btn.ghost{background:transparent;border-color:transparent;color:var(--fact);padding:4px 8px}
.btn.ghost:hover{text-decoration:underline}
.btn.sm{font-size:12.5px;padding:4px 10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.panel + .panel{margin-top:16px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2)}
.field input,.field select,.field textarea,.inp{border:1px solid var(--line2);border-radius:7px;padding:7px 10px;background:#fff;font-size:14px;color:var(--ink);width:100%}
textarea{resize:vertical;min-height:64px;line-height:1.6}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag{display:inline-block;font-size:11.5px;padding:0 8px;border-radius:20px;background:#EDF0EC;color:var(--ink2);line-height:20px;white-space:nowrap}
.tag.alert{background:var(--alert-2);color:var(--alert)}
.tag.sage{background:var(--sage-2);color:var(--sage)}
.tag.fact{background:var(--fact-2);color:var(--fact)}
.tag.interp{background:var(--interp-2);color:var(--interp)}
.empty{padding:36px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--r);background:#FAFBF9}
.empty .btn{margin-top:12px}

/* people list */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .inp{max-width:280px}
.plist{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.prow{display:grid;grid-template-columns:minmax(160px,1.4fr) 1fr 1fr 1fr 110px;gap:12px;padding:13px 18px;border-top:1px solid var(--line);align-items:center;cursor:pointer}
.prow:first-child{border-top:0}
.prow:hover{background:#F7F9F6}
.prow.hd{cursor:default;background:#F7F9F6;font-size:12px;color:var(--muted);padding:8px 18px}
.prow .nm b{font-size:15px;display:block}
.prow .nm span{font-size:12px;color:var(--muted)}
.dots{display:flex;gap:4px}
.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;border:1px solid var(--line2);color:var(--line2)}
.dot.on{border-color:var(--ink);color:#fff;background:var(--ink)}

/* karte */
.kh{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start}
.kh h1{font-size:30px;letter-spacing:.02em}
.kh .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--ink2);font-size:13.5px;margin-top:6px}
.viewas{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;font-size:12.5px}
.viewas button{all:unset;padding:5px 12px;cursor:pointer;color:var(--ink2)}
.viewas button.on{background:var(--ink);color:#fff}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:14px 0 4px}
.legend span{display:flex;align-items:center;gap:7px}
.sw{width:16px;height:14px;display:inline-block;background:#fff}
.sw.fact{border-left:4px solid var(--fact);background:var(--fact-2)}
.sw.statement{border-left:6px double var(--stmt);background:var(--stmt-2)}
.sw.interpretation{border-left:4px dashed var(--interp);background:var(--interp-2)}
.kgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.kblock{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 12px}
.kblock h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.kblock h3 .n{font-size:12px;color:var(--muted);font-weight:500}
.it{padding:8px 10px 8px 12px;margin-bottom:8px;border-radius:4px;background:#FBFCFA}
.it.fact{border-left:4px solid var(--fact);background:var(--fact-2)}
.it.statement{border-left:6px double var(--stmt);background:var(--stmt-2)}
.it.interpretation{border-left:4px dashed var(--interp);background:var(--interp-2)}
.it.hidden{opacity:.45}
.it .lb{font-weight:700;font-size:13.5px}
.it .vl{font-weight:700;color:var(--fact);margin-left:6px}
.it .tx{font-size:14px}
.it .ct{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.it .ctl{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.it .ctl button{all:unset;cursor:pointer;font-size:11px;border:1px solid var(--line2);border-radius:12px;padding:0 8px;line-height:19px;background:#fff;color:var(--ink2)}
.it .ctl button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.layers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}
.layers h3{font-size:14px;margin-bottom:8px}
.srcs{display:flex;flex-direction:column;gap:6px}
.src{display:flex;gap:10px;align-items:center;font-size:13.5px;flex-wrap:wrap}
.sec-title{display:flex;align-items:center;gap:10px;margin:28px 0 10px}
.sec-title h2{font-size:17px}
.mtg{border-top:1px solid var(--line);padding:12px 0}
.mtg:first-child{border-top:0;padding-top:0}
.acts{margin:6px 0 0;padding-left:18px;font-size:13.5px}

/* import */
.steps{display:flex;gap:0;margin-bottom:18px;font-size:13px;flex-wrap:wrap}
.steps span{padding:6px 16px;border:1px solid var(--line2);margin-left:-1px;background:#fff;color:var(--muted)}
.steps span:first-child{border-radius:8px 0 0 8px;margin-left:0}
.steps span:last-child{border-radius:0 8px 8px 0}
.steps span.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.steps span.done{color:var(--sage)}
.kinds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kind{border:1.5px solid var(--line2);border-radius:var(--r);padding:14px;cursor:pointer;background:#fff}
.kind.on{border-color:var(--sage);box-shadow:inset 0 0 0 1px var(--sage);background:#F6FAF7}
.kind b{display:block;font-family:"Zen Kaku Gothic New",sans-serif;font-size:15px}
.kind span{font-size:12.5px;color:var(--muted)}
.drop{border:1.5px dashed var(--line2);border-radius:var(--r);padding:22px;text-align:center;background:#FAFBF9;cursor:pointer}
.drop.has{border-style:solid;border-color:var(--sage);background:#F6FAF7}
.maptbl{width:100%;border-collapse:collapse;font-size:13.5px}
.maptbl th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
.maptbl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.maptbl .snip{color:var(--muted);font-size:12px;max-width:340px}
.rv{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:#fff}
.rv.fact{border-left:4px solid var(--fact)}
.rv.statement{border-left:6px double var(--stmt)}
.rv.interpretation{border-left:4px dashed var(--interp)}
.rv.ex{opacity:.45}
.rv-head{display:grid;grid-template-columns:150px 170px 1fr 160px;gap:8px}
.rv textarea{margin-top:6px}
.rv details{font-size:12.5px;color:var(--muted);margin-top:4px}
.rv .orig{background:#F6F7F5;padding:6px 10px;border-radius:6px;color:var(--ink2);white-space:pre-wrap}
.rv-flags{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;margin-top:8px;align-items:center}
.rv-flags label{display:flex;gap:4px;align-items:center;cursor:pointer}
.notice{border-radius:8px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.notice.warn{background:var(--interp-2);color:#5E4413}
.notice.alert{background:var(--alert-2);color:var(--alert)}
.notice.info{background:var(--fact-2);color:#244a70}

/* meeting */
.mgrid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;align-items:start}
.mgrid .ref{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
.qcard{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:#fff}
.qcard .basis{font-size:12px;color:var(--muted);margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;border:1px solid var(--line2);border-radius:16px;padding:2px 12px;font-size:13px;background:#fff}
.chip.on{background:var(--sage);color:#fff;border-color:var(--sage)}
.arow{display:grid;grid-template-columns:1fr 110px 150px 30px;gap:8px;margin-bottom:6px}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi b{font-family:"Zen Kaku Gothic New",sans-serif;font-size:26px;display:block;line-height:1.2}
.kpi span{font-size:12.5px;color:var(--muted)}
.dtbl{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--panel)}
.dtbl th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:8px 12px;border-bottom:1px solid var(--line);background:#F7F9F6}
.dtbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.bar{height:8px;border-radius:4px;background:var(--sage-2);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--sage)}
.wrap-x{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}

/* modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(30,41,64,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:12px;max-width:560px;width:100%;padding:22px;max-height:90vh;overflow:auto}
.modal h2{margin-bottom:14px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;z-index:60;display:none;max-width:90vw}
#toast.err{background:var(--alert)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .panel{max-width:420px;text-align:center}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top,0px));overflow-x:auto;z-index:20}
  .brand{border:0;padding:0 10px 0 4px;margin:0}
  .brand small{display:none}
  .brand b{font-size:17px;white-space:nowrap}
  .brand{flex-shrink:0}
  .viewas button{padding:5px 8px;white-space:nowrap}
  .viewas{overflow-x:auto;max-width:100%}
  .nav{white-space:nowrap;padding:6px 10px}
  .side .me{display:none}
  .kgrid,.layers,.grid3,.kinds,.mgrid{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .prow{grid-template-columns:1fr 1fr}
  .prow.hd{display:none}
  .rv-head{grid-template-columns:1fr 1fr}
  .kh{grid-template-columns:1fr}
  .mgrid .ref{position:static;max-height:none}
  .arow{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>

<script>
/* =========================================================
   ひとカルテ — 社員理解・育成支援
   資料を根拠付きで整理し、本人との対話と育成行動につなげる。
   採用・異動・昇格の結論を自動で決める機能は持たない。
   ========================================================= */
const CONFIG = {
  SUPABASE_URL: 'https://aakofrzurgwrkctunthw.supabase.co',
  SUPABASE_KEY: 'sb_publishable_yAUGrTJjqg56S16D7BI2oQ_pbt1olLa',
  AI_URL: 'https://aakofrzurgwrkctunthw.supabase.co/functions/v1/ai',
  APP_ID: 'hito-karte',
  BUCKET: 'hr-docs',
  MIN_GROUP: 3,              // これ未満の人数の集計は表示しない
  ALLOWED_DOMAIN: 'earthcom-eco.jp',
};
const DEMO = new URLSearchParams(location.search).has('demo');

const KINDS = {
  marcopolo: { label:'マルコポーロ面接シート', short:'マルコポーロ', accept:'.pdf', hint:'PDFを一人ずつ登録。適性・動機・性格特性を項目別に抽出します。' },
  milme:     { label:'ミルメバイタル', short:'ミルメ', accept:'.pdf', hint:'PDFを一人ずつ登録。画像主体のため、読み取った数値は原本と照合してから登録します。' },
  torisetsu: { label:'従業員トリセツ', short:'トリセツ', accept:'.docx,.pdf,.txt', hint:'DOCX推奨。複数人分の文書は氏名ごとに分割候補を出し、確認してから紐づけます。' },
};
const LAYERS = {
  fact:           { label:'確認できる数値', desc:'資料に記載された数値・診断結果' },
  statement:      { label:'本人の発言・実績', desc:'本人の記述、実際の行動や成果' },
  interpretation: { label:'資料の解釈', desc:'診断や作成者による解釈。本人に確かめる前提で扱う' },
};
const CATS = ['強み','力を発揮しやすい条件','指示・報告の工夫','育成テーマ','動機','性格特性','処理能力','注意点','その他'];
const KARTE_MAIN = ['強み','力を発揮しやすい条件','指示・報告の工夫','育成テーマ'];
const THEMES = ['報連相','計画・段取り','顧客折衝','専門知識','数値管理','主体性','チーム連携','部下育成','働き方'];
const DEPT_SUGGEST = ['営業','開発','CS','O&M','エネルギーアセット','管理部'];

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const z2 = n => String(n).padStart(2,'0');
const today = () => { const d=new Date(); return `${d.getFullYear()}-${z2(d.getMonth()+1)}-${z2(d.getDate())}`; };
const addDays = (s,n) => { const d=new Date(s); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${z2(d.getMonth()+1)}-${z2(d.getDate())}`; };
const daysSince = s => s ? (Date.now() - new Date(s).getTime())/864e5 : Infinity;
const fmtDT = s => s ? new Date(s).toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
const norm = s => String(s||'').normalize('NFKC').replace(/\s+/g,'').replace(/(さん|様|氏|くん|君)$/,'');
const lower = s => String(s||'').trim().toLowerCase();
let toastTimer;
function toast(msg, err){ const t=$('#toast'); t.textContent=msg; t.className=err?'err':''; t.style.display='block'; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.style.display='none', err?6000:2600); }
function openModal(html){ $('#modal').innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`; const f=$('#modal input,#modal textarea,#modal select'); f&&f.focus(); }
function closeModal(){ $('#modal').innerHTML=''; }
function busy(btn, on, text){ if(!btn) return; if(on){ btn.dataset.t=btn.innerHTML; btn.disabled=true; btn.innerHTML=`<span class="spin"></span>${text||'処理中'}`; } else { btn.disabled=false; if(btn.dataset.t) btn.innerHTML=btn.dataset.t; } }
function fileToBase64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=()=>rej(new Error('ファイルを読み込めませんでした')); r.readAsDataURL(file); }); }

/* ---------- state ---------- */
const S = { me:null, hr:null, people:[], view:'people', pid:null, viewAs:'hr', showOriginal:false, openCorrections:0, filter:{q:'',dept:''} };
let DB;

function relOf(p){
  if(!p || !S.me) return null;
  if(S.hr) return 'hr';
  const e = lower(S.me.email);
  if(lower(p.manager_email) === e) return 'manager';
  if(lower(p.self_email) === e) return 'self';
  return null;
}
const REL_LABEL = { hr:'人事・経営層', manager:'直属上司', self:'本人' };

/* =========================================================
   データ層（Supabase）
   ========================================================= */
function makeSupabaseDB(){
  const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
  const t = n => sb.from(n);
  const ok = ({data,error}) => { if(error) throw new Error(error.message); return data; };
  const now = () => new Date().toISOString();
  return {
    sb,
    async session(){ const {data}=await sb.auth.getSession(); return data.session; },
    async token(){ const s=await this.session(); return s?.access_token; },

/* =========================================================
   AI呼び出し（Edge Function ai 経由。APIキーはサーバー側）
   ========================================================= */
async function callAI({ system, prompt, documents, max_tokens=4000 }){
  if(DEMO) return mockAI(system, prompt);
  const token = await DB.token();
  const res = await fetch(CONFIG.AI_URL, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token, 'apikey':CONFIG.SUPABASE_KEY },
    body: JSON.stringify({ system, prompt, max_tokens, documents }),
  });
  const raw = await res.text();
  if(!res.ok) throw new Error(`AIの呼び出しに失敗しました（${res.status}）。${raw.slice(0,160)}`);
  let j; try { j = JSON.parse(raw); } catch { return raw; }
  if(typeof j === 'string') return j;
  if(j.text) return j.text;
  if(Array.isArray(j.content)) return j.content.filter(c=>c.type==='text').map(c=>c.text).join('\n');
  if(j.completion) return j.completion;
  if(j.result) return typeof j.result==='string' ? j.result : JSON.stringify(j.result);
  if(j.items || j.segments || j.questions) return JSON.stringify(j);
  return raw;
}
function parseJSON(text){
  const s = String(text).replace(/```json|```/g,'');
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if(a<0 || b<0) throw new Error('AIの応答を読み取れませんでした。もう一度お試しください。');
  return JSON.parse(s.slice(a,b+1));
}

/* =========================================================
   起動・ログイン
   ========================================================= */
async function boot(){
  DB = DEMO ? makeDemoDB() : makeSupabaseDB();
  try{
    if(DEMO){ S.me = {...DEMO_USERS.hr}; S.hr = S.me.hr; }
    else {
      if(window.EC && !window.__noEC && typeof EC.guard==='function'){
        try { await EC.guard({ allow:['admin','manager','sales','field','viewer'] }); } catch(e){ console.warn('EC.guard', e); }
      }
      const s = await DB.session();
      if(!s){ renderLogin(); return; }
      const email = s.user.email || '';
      if(!email.endsWith('@'+CONFIG.ALLOWED_DOMAIN)){ renderLogin('会社のGoogleアカウント（@'+CONFIG.ALLOWED_DOMAIN+'）でログインしてください。'); return; }
      S.me = { email, name: s.user.user_metadata?.full_name || email };
      S.hr = await DB.hrLevel(email);
      if(window.EC && typeof EC.mountBadge==='function'){ try{ EC.mountBadge(); }catch{} }
    }
    await reloadPeople();
    const mine = S.people.find(p=>lower(p.self_email)===lower(S.me.email));
    const reports = S.people.filter(p=>relOf(p)==='manager');
    if(!S.hr && !reports.length && mine){ S.view='karte'; S.pid=mine.id; }
    render();
  }catch(e){ console.error(e); renderLogin('読み込みに失敗しました: '+e.message); }
}
function renderLogin(msg){
  $('#app').innerHTML = `<div class="login"><div class="panel">
    <h1 style="margin-bottom:6px">ひとカルテ</h1>
    <p class="muted small" style="margin-bottom:18px">社員理解・育成支援</p>
    ${msg?`<div class="notice alert">${esc(msg)}</div>`:''}
    <button class="btn pri" onclick="DB.login()">会社のGoogleアカウントでログイン</button>
    <p class="small muted" style="margin-top:16px"><a href="?demo=1">デモデータで操作を試す</a></p>
  </div></div>`;
}
async function reloadPeople(){
  S.people = await DB.people();

function go(view, pid){ S.view=view; if(pid!==undefined) S.pid=pid; if(view==='karte' && !S.hr) S.viewAs=null; render(); window.scrollTo(0,0); }
async function switchDemoUser(k){ S.me={...DEMO_USERS[k]}; S.hr=S.me.hr; S.viewAs='hr'; await reloadPeople(); const mine=S.people.find(p=>lower(p.self_email)===lower(S.me.email)); if(k==='self'&&mine){ S.view='karte'; S.pid=mine.id; } else S.view='people'; render(); }

  const mine = S.people.find(p=>lower(p.self_email)===lower(S.me.email));
  const hasReports = S.people.some(p=>relOf(p)==='manager');
  const nav = [];

/* =========================================================

   ========================================================= */
const IMP = {
  kind:'marcopolo', method:'file', file:null, text:'', diagnosed_on:'', presetPid:'', step:'select',
  segments:[], queue:[], qi:0, filePath:null, busy:false, demoName:'',
  reset(pid){ Object.assign(this,{ method:'file', file:null, text:'', diagnosed_on:'', presetPid:pid||'', step:'select', segments:[], queue:[], qi:0, filePath:null, demoName:'' }); },
};
function matchPerson(name, no){
  if(no){ const hit = S.people.filter(p=>p.employee_no && norm(p.employee_no)===norm(no)); if(hit.length===1) return {id:hit[0].id, how:'社員番号が一致'}; }
  if(name){ const hit = S.people.filter(p=>norm(p.full_name)===norm(name)); if(hit.length===1) return {id:hit[0].id, how:'氏名が一致'}; if(hit.length>1) return {id:'', how:'同姓同名が複数います'}; }
  return {id:'', how: name?'一致する社員がいません':''};
}
async function viewImport(){
  if(!S.hr){ $('#main').innerHTML='<div class="empty">資料の登録は人事・経営層のみが行えます。</div>'; return; }
  const st = IMP.step;
  const steps = [['select','資料を選ぶ'],['map','氏名で分割'],['review','抽出を確認'],['done','登録完了']].filter(s=>IMP.kind==='torisetsu'&&IMP.method!=='single'||s[0]!=='map');

async function runImport(btn){

  try{
    IMP.queue=[]; IMP.qi=0; IMP.filePath=null;
    const isPdf = IMP.file && /\.pdf$/i.test(IMP.file.name);
    if(k!=='torisetsu' || isPdf){
      const b64 = await fileToBase64(IMP.file);
      if(DEMO){ const pp=S.people.find(p=>p.id===IMP.presetPid); IMP.demoName = pp?pp.full_name:''; }
      const out = parseJSON(await callAI({ system:SYS_EXTRACT, prompt:extractPrompt(k,''), documents:[{ name:IMP.file.name, media_type:'application/pdf', data:b64 }], max_tokens:6000 }));
      const m = IMP.presetPid ? {id:IMP.presetPid, how:'登録時に指定'} : matchPerson(out.subject_name, out.employee_no);
      IMP.queue.push({ subject_name:out.subject_name||'', employee_no:out.employee_no||'', diagnosed_on: IMP.diagnosed_on || out.diagnosed_on || '', personId:m.id, how:m.how, raw_text:'', items:prepItems(out.items,k), checked:false });

      let text = IMP.text;
      if(IMP.method!=='paste'){
        if(/\.docx$/i.test(IMP.file.name)){ const ab = await IMP.file.arrayBuffer(); text = (await mammoth.extractRawText({arrayBuffer:ab})).value; }
        else text = await IMP.file.text();
        IMP.text = text;
      }
      if(!text.trim()) throw new Error('文書から文字を読み取れませんでした');
      const out = parseJSON(await callAI({ system:SYS_SPLIT, prompt:text.slice(0,60000), max_tokens:2000 }));
      IMP.segments = splitByAnchors(text, out.segments||[]);
      if(!IMP.segments.length) IMP.segments = [{ name:'', employee_no:'', text, found:true }];
      IMP.segments.forEach(s=>{ const m=matchPerson(s.name,s.employee_no); s.personId = m.id || (s.name?'__new':''); s.how=m.how; });
      IMP.step='map';
    }
    viewImport();
  }catch(e){ busy(btn,false); console.error(e); toast(e.message,true); }
}
function splitByAnchors(text, segs){
  const found = [];
  let from = 0;
  segs.forEach(s=>{
    let pos = s.anchor ? text.indexOf(s.anchor, from) : -1;
    if(pos<0 && s.anchor) pos = text.indexOf(s.anchor.trim().slice(0,12), from);
    if(pos<0 && s.name) pos = text.indexOf(s.name, from);
    found.push({ ...s, pos, found: pos>=0 });
    if(pos>=0) from = pos+1;
  });
  const ok = found.filter(s=>s.found).sort((a,b)=>a.pos-b.pos);
  const res = ok.map((s,i)=>({ name:s.name, employee_no:s.employee_no, text:text.slice(s.pos, i+1<ok.length?ok[i+1].pos:text.length).trim(), found:true }));
  found.filter(s=>!s.found).forEach(s=>res.push({ name:s.name, employee_no:s.employee_no, text:'', found:false }));
  return res;
}

}

      <aside class="panel ref">
        <h3 style="margin-bottom:8px">カルテの要点</h3>
        ${KARTE_MAIN.map(c=>{ const xs=items.filter(i=>i.category===c); return xs.length?`<p class="small muted" style="margin-top:10px">${c}</p>${xs.map(i=>`<div class="it ${i.layer}"><span class="lb">${esc(i.label)}</span>${i.value?`<span class="vl">${esc(i.value)}</span>`:''}<div class="tx small">${esc(i.summary||'')}</div></div>`).join('')}`:''; }).join('') || '<p class="small muted">確認済みの記載がありません。質問はテーマから作れます。</p>'}
        ${prevActs.length?`<p class="small muted" style="margin-top:14px">前回（${esc(M._prev.held_on)}）決めた行動</p><ul class="acts">${prevActs.map(a=>`<li>${esc(a.what)}（${esc(a.who||'')}）</li>`).join('')}</ul>`:''}
        ${M._prev?.wish?`<p class="small muted" style="margin-top:10px">前回の本人の希望</p><p class="small">${esc(M._prev.wish)}</p>`:''}
      </aside>
      <div>
        <div class="panel">
          <div class="grid2"><label class="field">実施日<input type="date" value="${esc(M.held_on)}" onchange="M.held_on=this.value"></label>
          <label class="field">今回話したいこと（任意）<input value="${esc(M.focus||'')}" placeholder="例：次期の担当エリア、後輩育成" onchange="M.focus=this.value"></label></div>
          <div class="row" style="margin-top:12px"><button class="btn pri" onclick="genQuestions(this)">${M.questions.length?'質問を作り直す':'質問を提案'}</button><button class="btn" onclick="M.questions.push({q:'',basis:'自分で追加',aim:'',answer:''});viewMeeting()">質問を追加</button></div>
        </div>
        ${M.try_actions.length?`<div class="panel"><h3 style="margin-bottom:6px">次の面談までに試す関わり方</h3><ul class="acts">${M.try_actions.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div>`:''}
        ${M.questions.length?`<div style="margin-top:16px">${M.questions.map((q,i)=>`<div class="qcard">
            <div class="row" style="align-items:flex-start;flex-wrap:nowrap"><textarea class="inp" rows="2" aria-label="質問" onchange="M.questions[${i}].q=this.value">${esc(q.q)}</textarea><button class="btn ghost sm" aria-label="削除" onclick="M.questions.splice(${i},1);viewMeeting()">削除</button></div>
            ${q.basis||q.aim?`<p class="basis">根拠：${esc(q.basis||'—')}${q.aim?'　ねらい：'+esc(q.aim):''}</p>`:''}
            <textarea class="inp" rows="2" style="margin-top:6px" placeholder="本人の回答" onchange="M.questions[${i}].answer=this.value">${esc(q.answer||'')}</textarea>
          </div>`).join('')}</div>`:''}
        <div class="panel" style="margin-top:16px">
          <label class="field">本人の希望・気づき<textarea rows="3" onchange="M.wish=this.value" placeholder="本人の言葉で記録">${esc(M.wish||'')}</textarea></label>
          <p class="field" style="margin-top:14px">次の行動</p>
          ${M.next_actions.map((a,i)=>`<div class="arow"><input class="inp" value="${esc(a.what)}" placeholder="何をするか" onchange="M.next_actions[${i}].what=this.value"><select class="inp" onchange="M.next_actions[${i}].who=this.value">${['本人','上司','人事'].map(w=>`<option ${w===a.who?'selected':''}>${w}</option>`).join('')}</select><input class="inp" type="date" value="${esc(a.due||'')}" onchange="M.next_actions[${i}].due=this.value"><button class="btn ghost sm" aria-label="削除" onclick="M.next_actions.splice(${i},1);viewMeeting()">×</button></div>`).join('')}
          <button class="btn sm" onclick="M.next_actions.push({what:'',who:'本人',due:addDays(M.held_on||today(),14),done:false});viewMeeting()">行動を追加</button>
          <p class="field" style="margin-top:14px">育成テーマ（全社集計に使います）</p>
          <div class="chips">${THEMES.map(t=>`<button class="chip ${M.themes.includes(t)?'on':''}" onclick="M.themes.includes('${t}')?M.themes.splice(M.themes.indexOf('${t}'),1):M.themes.push('${t}');this.classList.toggle('on')">${t}</button>`).join('')}</div>
          <div class="grid2" style="margin-top:14px"><label class="field">次回の予定日<input type="date" value="${esc(M.next_on||'')}" onchange="M.next_on=this.value"></label>
          <label class="field">本人の希望職種（カルテに反映）<input id="m_wish_role" value="${esc(p.desired_role||'')}" ${rel==='hr'?'':'disabled title="基本情報は人事が更新します"'}></label></div>
          <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" onclick="go('karte','${p.id}')">戻る</button><button class="btn pri" onclick="saveMeeting(this)">記録を保存</button></div>
        </div>
      </div>
    </div>`;
}
async function genQuestions(btn){
  const p = S.people.find(x=>x.id===S.pid);
  const lines = M._items.map(i=>`- [${LAYERS[i.layer].label}／${i.category}] ${i.label}${i.value?'：'+i.value:''}　${i.summary||''}（${KINDS[i.source_kind]?.short||''} ${i.diagnosed_on||''}）`).join('\n');
  const prev = M._prev ? `前回1on1（${M._prev.held_on}）\n本人の希望：${M._prev.wish||'なし'}\n決めた行動：${(M._prev.next_actions||[]).map(a=>a.what).join('／')||'なし'}` : '前回の1on1記録なし';
  const prompt = `対象：${p.full_name}（${p.department||''} ${p.position||''}）\n本人の希望職種：${p.desired_role||'未確認'}\n今回話したいこと：${M.focus||'特になし'}\n\nカルテ（確認済みの記載）:\n${lines||'（なし）'}\n\n${prev}`;
  busy(btn,true,'作成中');
  try{
    const out = parseJSON(await callAI({ system:SYS_QUESTIONS, prompt, max_tokens:2000 }));
    M.questions = (out.questions||[]).slice(0,5).map(q=>({ q:q.q||'', basis:q.basis||'', aim:q.aim||'', answer:'' }));
    M.try_actions = (out.try_actions||[]).slice(0,3);
    await DB.log('generate_questions','person',p.id);
    viewMeeting();
  }catch(e){ busy(btn,false); toast(e.message,true); }
}
async function saveMeeting(btn){
  const p = S.people.find(x=>x.id===S.pid);
  if(!M.held_on) return toast('実施日を入力してください', true);
  busy(btn,true,'保存中');
  try{
    const { _prev, _items, ...rec } = M;
    rec.next_actions = rec.next_actions.filter(a=>a.what && a.what.trim());
    rec.questions = rec.questions.filter(q=>q.q && q.q.trim());
    const saved = await DB.saveMeeting(rec);
    M.id = saved.id;
    const wr = $('#m_wish_role');
    if(relOf(p)==='hr' && wr && wr.value.trim() !== (p.desired_role||'')){ await DB.savePerson({ id:p.id, desired_role:wr.value.trim()||null }); await reloadPeople(); }
    await DB.log('save_meeting','meeting',saved.id,{person_id:p.id});
    toast('1on1の記録を保存しました'); go('karte', p.id);
  }catch(e){ busy(btn,false); toast(e.message,true); }
}

/* =========================================================
   全社ダッシュボード（個人名なし・少人数は非表示）
   ========================================================= */
async function viewDashboard(){
  if(!S.hr){ $('#main').innerHTML='<div class="empty">人事・経営層のみ閲覧できます。</div>'; return; }
  const [meta, mtgs, corr] = await Promise.all([DB.sourceMeta(), DB.allMeetings(), DB.corrections()]);
  const people = S.people;
  const withDocs = new Set(meta.map(s=>s.person_id));
  const recent = {}; mtgs.forEach(m=>{ if(daysSince(m.held_on)<=90) recent[m.person_id]=true; });
  const depts = {};
  people.forEach(p=>{ const d=p.department||'未設定'; (depts[d] ||= []).push(p); });
  const ids = new Set(people.map(p=>p.id));
  const themeAll = {}; mtgs.filter(m=>daysSince(m.held_on)<=180 && ids.has(m.person_id)).forEach(m=>(m.themes||[]).forEach(t=>themeAll[t]=(themeAll[t]||0)+1));
  const rate = people.length ? Math.round(people.filter(p=>recent[p.id]).length/people.length*100) : 0;
  const MIN = CONFIG.MIN_GROUP;
  const rows = Object.entries(depts).sort((a,b)=>b[1].length-a[1].length).map(([d,ps])=>{
    const small = ps.length < MIN;
    const pidSet = new Set(ps.map(p=>p.id));
    const th = {}; mtgs.filter(m=>pidSet.has(m.person_id)&&daysSince(m.held_on)<=180).forEach(m=>(m.themes||[]).forEach(t=>th[t]=(th[t]||0)+1));
    const topTh = Object.entries(th).filter(([,n])=>n>=MIN).sort((a,b)=>b[1]-a[1]).slice(0,3);
    const done = ps.filter(p=>recent[p.id]).length;
    const wishes = {}; ps.forEach(p=>{ if(p.desired_role) wishes[p.desired_role]=(wishes[p.desired_role]||0)+1; });
    const topW = Object.entries(wishes).filter(([,n])=>n>=MIN).sort((a,b)=>b[1]-a[1]).slice(0,2);
    if(small) return `<tr><td><b>${esc(d)}</b></td><td>${ps.length}人</td><td colspan="4" class="muted small">${MIN}人未満のため、個人が推測されないよう集計を表示しません</td></tr>`;
    return `<tr><td><b>${esc(d)}</b></td><td>${ps.length}人</td>
      <td><div class="row" style="flex-wrap:nowrap"><div class="bar" style="flex:1"><i style="width:${Math.round(done/ps.length*100)}%"></i></div><span class="small">${Math.round(done/ps.length*100)}%</span></div></td>
      <td>${ps.filter(p=>withDocs.has(p.id)).length}人</td>
      <td>${topTh.map(([t,n])=>`<span class="tag sage">${esc(t)} ${n}</span>`).join(' ')||'<span class="small muted">集計対象なし</span>'}</td>
      <td>${topW.map(([t,n])=>`<span class="tag">${esc(t)} ${n}</span>`).join(' ')||'<span class="small muted">—</span>'}</td></tr>`;
  }).join('');
  const thSorted = Object.entries(themeAll).filter(([,n])=>n>=MIN).sort((a,b)=>b[1]-a[1]);
  const maxT = Math.max(1,...thSorted.map(x=>x[1]));
  $('#main').innerHTML = `
    <div class="pagehead"><div><h1>全社ダッシュボード</h1><p class="sub">個人名は表示しません。${MIN}人未満（${MIN}件未満）の集計は非表示にしています。</p></div></div>
    <div class="kpis">
      <div class="kpi"><b>${people.length}</b><span>登録社員</span></div>
      <div class="kpi"><b>${withDocs.size}</b><span>資料登録済み</span></div>
      <div class="kpi"><b>${rate}%</b><span>1on1実施率（直近90日）</span></div>
      <div class="kpi"><b>${corr.filter(c=>c.status==='open').length}</b><span>対応待ちの訂正依頼</span></div>
    </div>
    <div class="wrap-x"><table class="dtbl"><thead><tr><th>部署</th><th>人数</th><th>1on1実施（90日）</th><th>資料登録</th><th>主な育成テーマ（180日）</th><th>希望職種</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="muted">社員が登録されていません</td></tr>'}</tbody></table></div>
    <div class="sec-title"><h2>全社の育成テーマ（直近180日の1on1）</h2></div>
    <div class="panel">${thSorted.length?thSorted.map(([t,n])=>`<div class="row" style="margin-bottom:8px;flex-wrap:nowrap"><span style="width:120px" class="small">${esc(t)}</span><div class="bar" style="flex:1;height:12px"><i style="width:${n/maxT*100}%"></i></div><span class="small" style="width:40px;text-align:right">${n}</span></div>`).join(''):'<p class="small muted">表示できる件数に達したテーマはまだありません。</p>'}</div>`;
}

/* =========================================================
   訂正依頼（人事）
   ========================================================= */
async function viewCorrections(){
  if(!S.hr){ $('#main').innerHTML='<div class="empty">人事・経営層のみ閲覧できます。</div>'; return; }
  const list = await DB.corrections();
  const name = pid => (S.people.find(p=>p.id===pid)||{}).full_name || '—';
  $('#main').innerHTML = `<div class="pagehead"><div><h1>訂正依頼</h1><p class="sub">本人からの訂正・補足。カルテを修正したうえで回答してください。</p></div></div>
    ${list.length?`<div class="panel">${list.map(c=>`<div class="mtg">
      <div class="row"><span class="tag ${c.status==='open'?'alert':'sage'}">${c.status==='open'?'対応待ち':c.status==='done'?'反映済み':'見送り'}</span><b>${esc(name(c.person_id))}</b><span class="small">${esc(c.item_label||'カルテ全体')}</span><span class="small muted">${esc(fmtDT(c.created_at))}</span>
        <button class="btn ghost sm" style="margin-left:auto" onclick="S.viewAs='hr';go('karte','${c.person_id}')">カルテを開く</button></div>
      <p style="margin-top:6px">${esc(c.body)}</p>
      ${c.status==='open'?`<div class="row" style="margin-top:8px;flex-wrap:nowrap"><input class="inp" id="rsp_${c.id}" placeholder="本人への回答"><button class="btn sm pri" onclick="resolveCorr('${c.id}','done')">反映済みにする</button><button class="btn sm" onclick="resolveCorr('${c.id}','declined')">見送る</button></div>`:c.response?`<p class="small muted">回答：${esc(c.response)}</p>`:''}
    </div>`).join('')}</div>`:'<div class="empty">訂正依頼はありません。</div>'}`;
}
async function resolveCorr(id,status){
  const response = ($('#rsp_'+id)||{}).value||'';
  if(status==='declined' && !response.trim()) return toast('見送る場合は理由を回答してください', true);
  try{ await DB.updateCorrection(id,{status,response,resolved_by:S.me.email,resolved_at:new Date().toISOString()}); await DB.log('resolve_correction','correction',id,{status}); await reloadPeople(); render(); }catch(e){ toast(e.message,true); }
}

/* =========================================================
   閲覧・操作履歴
   ========================================================= */
const ACTION_LABEL = { view_karte:'カルテを閲覧', import_source:'資料を登録', update_item:'表示設定を変更', edit_item:'記載を修正', open_original:'原本を開く', save_meeting:'1on1を記録', generate_questions:'質問を生成', request_correction:'訂正を依頼', resolve_correction:'訂正に回答', add_person:'社員を追加', edit_person:'基本情報を編集' };
async function viewAudit(){
  if(!S.hr){ $('#main').innerHTML='<div class="empty">人事・経営層のみ閲覧できます。</div>'; return; }
  const list = await DB.audit();
  const pname = id => (S.people.find(p=>p.id===id)||{}).full_name;
  $('#main').innerHTML = `<div class="pagehead"><div><h1>閲覧・操作履歴</h1><p class="sub">資料の登録・修正・閲覧をすべて記録しています（直近300件）</p></div></div>
    ${list.length?`<div class="wrap-x"><table class="dtbl"><thead><tr><th>日時</th><th>操作した人</th><th>操作</th><th>対象</th></tr></thead><tbody>
    ${list.map(a=>`<tr><td class="small">${esc(fmtDT(a.at))}</td><td class="small">${esc(a.actor_email)}</td><td>${esc(ACTION_LABEL[a.action]||a.action)}</td><td class="small">${esc(pname(a.target_id) || pname(a.detail?.person_id) || a.detail?.name || a.target_type)}</td></tr>`).join('')}
    </tbody></table></div>`:'<div class="empty">まだ履歴がありません。</div>'}`;
}

boot();
