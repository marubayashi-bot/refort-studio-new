<!--
  EARTHCOM ORG DESIGN Ver.1
  ・組織図／社員カード／ドラッグ＆ドロップ異動（PC:ドラッグ、スマホ・タブレット:長押し→移動）
  ・正式組織は「下書き→承認→反映」、シナリオ（未来組織）は自由に組替え
  ・異動履歴（監査ログ）／異動CARE（7日・30日・90日フォロー）／組織診断（ルール＋AI）
  ・表・Excelの貼り付け取込、JSONバックアップ、PDF出力（印刷）
  保存先: Supabase テーブル org_design_state（id='main' の1行にJSONで保存）
  認証: ec-auth.js（会社Googleアカウント）。読込めない環境ではプレビューモードで動作（保存されません）
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ec-auth.js" onerror="void 0"></script>
<style>
:root{
  --ink:#12233A;        /* パネルの濃紺（ソーラーパネルの枠） */
  --cell:#1F4E79;       /* セルの青 */
  --sky:#EEF3F8;        /* 図面の地 */
  --grid:#D9E3EE;       /* 方眼 */
  --paper:#FFFFFF;
  --sun:#E3A23B;        /* 日射のアンバー（アクセントはここだけ） */
  --leaf:#2F8A5B;
  --warn:#C4533A;
  --muted:#5E7188;
  --line:#8FA6BF;
  --r-s:6px; --r-m:10px;
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--ink);background:var(--sky)}
body{display:grid;grid-template-rows:auto auto auto 1fr auto;grid-template-columns:minmax(0,1fr);height:100dvh;overflow:hidden;font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
[hidden]{display:none!important}

/* ヘッダー */
header{background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:8px}
.brand b{font-weight:900;font-size:18px;letter-spacing:.04em}
.brand small{font-size:11px;color:#AFC2D6}
.hsp{flex:1}
.hbtn{background:transparent;border:1px solid #3C5675;color:#fff;border-radius:var(--r-s);padding:6px 12px;white-space:nowrap}
.hbtn:hover{background:#1C3452}
.hbtn.ai{border-color:var(--sun);color:var(--sun)}
.search{background:#1C3452;border:1px solid #3C5675;border-radius:var(--r-s);color:#fff;padding:6px 10px;width:180px}
.search::placeholder{color:#8FA6BF}
.scnsel{background:#1C3452;border:1px solid #3C5675;color:#fff;border-radius:var(--r-s);padding:6px 8px;max-width:230px}
.me{font-size:12px;color:#AFC2D6}

/* 指標帯 */
.stats{display:flex;gap:0;background:var(--paper);border-bottom:1px solid var(--grid);overflow-x:auto}
.st{padding:8px 18px;border-right:1px solid var(--grid);min-width:112px}
.st span{display:block;font-size:11px;color:var(--muted)}
.st b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.st i{font-style:normal;font-size:12px;margin-left:4px}
.st i.up{color:var(--leaf)} .st i.dn{color:var(--warn)}
.scnbar{display:flex;align-items:center;gap:10px;padding:8px 16px;background:#FFF7E8;border-bottom:1px solid #F0D9AE;flex-wrap:wrap;font-size:13px}
.scnbar b{font-weight:700}
.sample{padding:8px 16px;background:#FFF7E8;border-bottom:1px solid #F0D9AE;font-size:13px}

/* 本体 */
main{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:0;min-width:0}
aside{background:var(--paper);border-right:1px solid var(--grid);display:flex;flex-direction:column;min-height:0}
.aside-h{padding:12px 14px 6px;font-weight:700;font-size:13px;color:var(--muted)}
.dlist{overflow:auto;flex:1;padding:0 6px 8px}
.dlist button{display:flex;justify-content:space-between;width:100%;border:0;background:none;text-align:left;padding:5px 8px;border-radius:var(--r-s)}
.dlist button:hover{background:var(--sky)}
.dlist button em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.tray{border-top:1px solid var(--grid);padding:10px;max-height:40%;overflow:auto;min-height:92px}
.tray.over{background:#FFF3DC}
.tray .card{width:100%}

.work{display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:flex;gap:2px;padding:8px 12px 0;overflow-x:auto;flex-shrink:0;background:var(--sky);border-bottom:1px solid var(--grid)}
.tabs button{white-space:nowrap;flex-shrink:0;border:1px solid transparent;border-bottom:0;background:none;padding:7px 14px;border-radius:var(--r-s) var(--r-s) 0 0;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--paper);border-color:var(--grid);color:var(--ink);font-weight:700;margin-bottom:-1px}
.tabs .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--sun);color:var(--ink);font-size:11px;font-weight:700}
.tabs .zoom{margin-left:auto;display:flex;gap:4px;align-items:center;padding-bottom:6px}
.tabs .zoom button{border:1px solid var(--grid);background:var(--paper);border-radius:var(--r-s);padding:2px 10px;color:var(--ink)}
.pane{flex:1;min-height:0;overflow:auto}

.canvas{background-image:
  linear-gradient(rgba(31,78,121,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(31,78,121,.055) 1px,transparent 1px);
  background-size:24px 24px;padding:28px 28px 80px;min-width:max-content;min-height:100%}
.tree ul{display:flex;justify-content:center;padding:24px 0 0;margin:0;position:relative}
.tree>ul{padding-top:0}
.tree li{list-style:none;position:relative;padding:24px 8px 0;display:flex;flex-direction:column;align-items:center}
.tree>ul>li{padding-top:0}
.tree li::before,.tree li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:24px;border-top:2px solid var(--line)}
.tree li::after{right:auto;left:50%;border-left:2px solid var(--line)}
.tree li:only-child::before,.tree li:only-child::after{display:none}
.tree li:only-child{padding-top:0}
.tree li:first-child::before,.tree li:last-child::after{border:0}
.tree li:last-child::before{border-right:2px solid var(--line);border-radius:0 6px 0 0}
.tree li:first-child::after{border-radius:6px 0 0 0}
.tree ul ul::before{content:"";position:absolute;top:0;left:50%;height:24px;border-left:2px solid var(--line)}
.tree>ul>li::before,.tree>ul>li::after{display:none}

.dept{backdrop-filter:saturate(1.1)}
.dept{background:var(--paper);border:1px solid #C6D4E3;border-top:4px solid var(--hue);border-radius:var(--r-s);width:210px;box-shadow:0 1px 0 #C6D4E3;transition:box-shadow .12s,border-color .12s}
.dept.over{border-color:var(--sun);box-shadow:0 0 0 3px var(--sun)}
.dept.flash{animation:flash 1.2s}
@keyframes flash{0%,60%{box-shadow:0 0 0 4px var(--sun)}100%{box-shadow:0 1px 0 #C6D4E3}}
.dh{display:flex;align-items:center;gap:6px;padding:8px 8px 6px 10px}
.dn{font-weight:700;flex:1;font-size:14px}
.dc{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dm{border:0;background:none;padding:0 6px;border-radius:4px;color:var(--muted);font-weight:900}
.dm:hover{background:var(--sky)}
.dbody{padding:0 8px 8px;display:flex;flex-direction:column;gap:6px;min-height:40px}
.empty{font-size:12px;color:var(--muted);border:1px dashed #C6D4E3;border-radius:var(--r-s);padding:10px;text-align:center}

.card{background:#F7FAFD;border:1px solid #D5E0EB;border-radius:var(--r-s);padding:7px 9px;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.card:hover{border-color:var(--cell)}
.card.lead{background:#fff;border-left:3px solid var(--cell)}
.cn{font-weight:700;font-size:14px}
.cm{font-size:12px;color:var(--muted)}
.cm .head{font-weight:700;color:var(--cell)}
.cs{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--leaf)}
.dot.s-off{background:#A0AEBD}.dot.s-ret{background:#D5DCE4}.dot.s-new{background:var(--sun)}.dot.s-slot{background:transparent;border:1.5px dashed var(--muted)}
.tag{color:#8A5A0B}
.card.slot{background:transparent;border:1.5px dashed #9FB3C8}
.card.slot .cn{color:var(--muted);font-weight:500}
.card.pend{border-color:var(--sun);background:#FFF9EE}
.pb{font-size:11px;font-weight:700;color:#8A5A0B;margin-top:3px}
.card.dim{opacity:.28}
.card.hit{box-shadow:0 0 0 2px var(--sun)}
.card.lifted{opacity:.35}
.ro .card{cursor:pointer}
.ghost{position:fixed;z-index:90;pointer-events:none;width:190px;transform:rotate(-2deg);box-shadow:0 10px 24px rgba(18,35,58,.25);opacity:.95}

/* 一覧系ペイン */
.sheet{padding:20px 24px 80px;max-width:1080px}
.sheet h2{font-size:18px;margin:0 0 4px}
.sheet p.lead{color:var(--muted);margin:0 0 16px}
table{border-collapse:collapse;width:100%;background:var(--paper);border:1px solid var(--grid)}
th,td{padding:8px 10px;border-bottom:1px solid var(--grid);text-align:left;vertical-align:top;font-size:13px}
th{background:#F3F7FB;font-weight:700;color:var(--muted);white-space:nowrap}
.arrow{color:var(--muted);padding:0 4px}
.nodata{padding:28px;background:var(--paper);border:1px dashed #C6D4E3;border-radius:var(--r-m);color:var(--muted);text-align:center}
.carewrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.care{background:var(--paper);border:1px solid var(--grid);border-radius:var(--r-m);padding:14px}
.care h4{margin:0;font-size:15px}
.care .sub{font-size:12px;color:var(--muted);margin-bottom:8px}
.bar{height:6px;background:var(--grid);border-radius:3px;overflow:hidden;margin:6px 0 10px}
.bar i{display:block;height:100%;background:var(--leaf)}
.care label{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:13px}
.care label small{margin-left:auto;color:var(--muted);white-space:nowrap}
.care label.late small{color:var(--warn);font-weight:700}
.care label.done span{color:var(--muted);text-decoration:line-through}
.diag{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.dg{background:var(--paper);border:1px solid var(--grid);border-left:4px solid var(--sun);border-radius:var(--r-s);padding:10px 14px}
.dg.info{border-left-color:var(--cell)}
.dg b{display:block}
.dg span{font-size:13px;color:var(--muted)}
.aiout{background:var(--paper);border:1px solid var(--grid);border-radius:var(--r-m);padding:16px 18px;white-space:pre-wrap;line-height:1.8;max-width:78ch}
.note{font-size:12px;color:var(--muted)}

/* ボタン */
.btn{border:1px solid #C6D4E3;background:var(--paper);border-radius:var(--r-s);padding:7px 14px}
.btn:hover{border-color:var(--cell)}
.btn.pri{background:var(--cell);border-color:var(--cell);color:#fff}
.btn.sun{background:var(--sun);border-color:var(--sun);color:var(--ink);font-weight:700}
.btn.del{color:var(--warn);border-color:#E8BDB3}
.btn.sm{padding:3px 10px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* フッター */

/* ========== データ操作 ========== */
const org=()=>V.scn==='official'?D.official:(D.scenarios.find(s=>s.id===V.scn)||D.official);
const isOfficial=()=>V.scn==='official'||!D.scenarios.find(s=>s.id===V.scn);
const deptById=(id,o=org())=>o.depts.find(d=>d.id===id);
const deptName=(id,o=org())=>id?(deptById(id,o)?.name||'（削除済み部署）'):'未配置';
const person=id=>org().people.find(p=>p.id===id);
const children=(id,o=org())=>o.depts.filter(d=>d.parentId===id);
const roots=(o=org())=>o.depts.filter(d=>!d.parentId||!o.depts.find(x=>x.id===d.parentId));
const descendants=id=>{const out=[];const walk=x=>children(x).forEach(c=>{out.push(c.id);walk(c.id)});walk(id);return out};
const rank=t=>TITLES.indexOf(t);
const sortPeople=(a,b)=>(b.isHead-a.isHead)||((a.status==='採用予定')-(b.status==='採用予定'))||(rank(b.title)-rank(a.title))||a.name.localeCompare(b.name,'ja');
const isActive=p=>p.status==='在籍'||p.status==='休職';
const pendingOf=pid=>isOfficial()?D.pending.find(x=>x.personId===pid):null;

function stats(o){
  const act=o.people.filter(isActive);
  const mgr=act.filter(p=>MGR.has(p.title)).length;
  let spans=[];
  o.depts.forEach(d=>{const mem=o.people.filter(p=>p.deptId===d.id&&isActive(p));const heads=mem.filter(p=>p.isHead);
    if(heads.length){const sub=mem.length-heads.length+children(d.id,o).length;spans.push(sub)}});
  return {head:act.length,mgr,span:spans.length?(spans.reduce((a,b)=>a+b,0)/spans.length):0,depts:o.depts.length,
    hire:o.people.filter(p=>p.status==='採用予定'||p.status==='内定').length,
    unassigned:o.people.filter(p=>!p.deptId||!deptById(p.deptId,o)).length};
}

/* ========== 組織診断（ルール） ========== */
function diagnose(o=org()){
  const out=[];
  o.depts.forEach(d=>{
    const mem=o.people.filter(p=>p.deptId===d.id&&isActive(p));const heads=mem.filter(p=>p.isHead);const kids=children(d.id,o).length;
    const sub=mem.length-heads.length+kids;
    if(heads.length&&sub>SPAN_LIMIT)out.push({lv:'warn',t:`${d.name}：部門長1名に対して直属${sub}名`,s:'マネジメント負荷が高い可能性があります。チーム分割や係長・主任の配置を検討できます。'});
    if(!heads.length&&mem.length)out.push({lv:'warn',t:`${d.name}：部門長が未設定`,s:'結果責任を持つ人が組織図上で決まっていません。'});
    if(mem.length===1&&!kids)out.push({lv:'warn',t:`${d.name}：1名体制`,s:'キーパーソン依存度が高く、休職・退職時に機能が止まるリスクがあります。'});
    if(!mem.length&&!kids)out.push({lv:'info',t:`${d.name}：在籍者なし`,s:'採用予定枠や兼務での手当てが必要か確認してください。'});
    const hire=o.people.filter(p=>p.deptId===d.id&&p.status==='採用予定').length;
    if(hire)out.push({lv:'info',t:`${d.name}：採用予定枠 ${hire}名`,s:'採用計画と入社時期の確認対象です。'});
  });
  const un=o.people.filter(p=>!p.deptId||!deptById(p.deptId,o)).length;
  if(un)out.push({lv:'warn',t:`未配置 ${un}名`,s:'所属部署が決まっていない社員がいます。'});
  const s=stats(o);
  if(s.head&&s.mgr/s.head<0.1)out.push({lv:'info',t:`管理職比率 ${Math.round(s.mgr/s.head*100)}%`,s:'今後の人数増に対して、課長以上の育成・登用計画が必要になる水準です。'});
  return out;
}

    ${V.aiText?`<div class="aiout">${esc(V.aiText)}</div>`:''}</div>`;

async function runAI(){
  const o=org();
  const summary=o.depts.map(d=>{const mem=o.people.filter(p=>p.deptId===d.id);
    return {部署:d.name,上位部署:deptName(d.parentId,o),在籍:mem.filter(isActive).length,部門長:mem.filter(p=>p.isHead).map(p=>p.title).join('/')||'なし',
      役職構成:TITLES.map(t=>`${t}${mem.filter(p=>p.title===t&&isActive(p)).length}`).filter(x=>!x.endsWith('0')).join(' '),採用予定:mem.filter(p=>p.status==='採用予定').length}});
  const sc=isOfficial()?null:o;
  const system='あなたは再生可能エネルギー企業「株式会社アースコム」の組織設計アドバイザーです。識学の考え方（責任と権限の明確化、1上司1部下の指揮系統、部門長の結果責任）を前提に、組織構造上の論点と改善案を日本語で示します。個人の評価・昇格・降格は判断しません。';
  const prompt=`以下の組織データを診断し、次の構成でプレーンテキスト（Markdown記号・HTMLタグは使わない）で回答してください。\n■ 全体所見（3行以内）\n■ 優先度の高い論点（最大4つ。各「論点／理由／打ち手」）\n■ 組織案の提案（1〜2案）\n全体で1,200字以内にまとめること。\n${sc?`\nシナリオ名：${sc.name}／対象時期：${sc.when||'未設定'}／目標人数：${sc.target||'未設定'}`:''}\nルール診断の結果：${JSON.stringify(diagnose().map(x=>x.t))}\n組織データ：${JSON.stringify(summary)}`;
  V.aiText='AIが診断しています…';renderPane();
  try{V.aiText=await callAI(prompt,system)}catch(e){V.aiText='AIの診断ができませんでした（'+e.message+'）。少し時間をおいて、もう一度「AIに改善案を出してもらう」を押してください。続く場合はログインし直してください。'}
  renderPane();
}
/* AIの応答から本文だけを取り出す（thinkingブロックや空のtextは除外。データのまま表示しない） */
function aiText(j){
  if(!j)return '';
  if(typeof j==='string')return j.trim();
  if(typeof j.text==='string'&&j.text.trim())return j.text.trim();
  const blocks=Array.isArray(j.content)?j.content:Array.isArray(j.data?.content)?j.data.content:[];
  const t=blocks.filter(c=>c&&c.type==='text'&&c.text).map(c=>c.text).join('\n').trim();
  if(t)return t;
  for(const k of ['result','output','answer','message'])if(typeof j[k]==='string'&&j[k].trim())return j[k].trim();
  return '';
}
async function callAI(prompt,system){
  const tries=[8000,16000];let last='';
  for(const max of tries){
    let j;
    if(sb&&mode==='live'){
      const {data:{session}}=await sb.auth.getSession();
      const r=await fetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+(session?.access_token||SB_KEY)},body:JSON.stringify({prompt,system,max_tokens:max})});
      if(!r.ok)throw new Error('HTTP '+r.status);
      j=await r.json();
    }else{
      const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,system,messages:[{role:'user',content:prompt}]})});
      j=await r.json();
    }
    if(j&&j.error)throw new Error(j.error.message||String(j.error));
    const t=aiText(j);if(t)return t;
    last=j?.stop_reason||j?.data?.stop_reason||'';
    if(!(sb&&mode==='live'))break;
  }
  throw new Error(last==='max_tokens'?'回答が長くなりすぎて途中で止まりました':'AIから回答が返ってきませんでした');
}

   ・閲覧できるのは MILME_VIEWERS の氏名（スペース無視）または MILME_EMAILS のメールのログイン者だけ
   ・読み込んだExcelのデータはこの端末の localStorage にだけ保存し、Supabase（共有データ）には入れない */
const MILME_VIEWERS=['丸林信宏','丸林綾子'];
const MILME_EMAILS=[];
const MILME_KEY='ecod_milme_v1';
const nkey=t=>String(t||'').replace(/[\s\u3000]/g,'');
const canMilme=()=>mode==='preview'||MILME_VIEWERS.includes(nkey(me.name))||MILME_EMAILS.includes(String(me.email||'').toLowerCase());

function milmeMap(){const d=milmeData();const m=new Map();(d?.rows||[]).forEach(r=>m.set(nkey(r.name),r));return m}
async function loadXLSX(){
  if(window.XLSX)return;
  await new Promise((ok,ng)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=ok;sc.onerror=()=>ng(new Error('読込ライブラリを取得できませんでした'));document.head.appendChild(sc)});
}
async function importMilme(file){
  if(!canMilme())return;
  try{
    await loadXLSX();
    const buf=await file.arrayBuffer();let wb;
    if(/\.csv$/i.test(file.name)){let t=new TextDecoder('utf-8').decode(buf);if(t.includes('\ufffd'))t=new TextDecoder('shift_jis').decode(buf);wb=XLSX.read(t,{type:'string'})}
    else wb=XLSX.read(buf,{type:'array'});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
    const hi=rows.findIndex(r=>r.some(c=>/受検者名|氏名/.test(String(c))));
    if(hi<0)throw new Error('「受検者名」の列が見つかりません');
    const H=rows[hi].map(h=>String(h).trim());const col=re=>H.findIndex(h=>re.test(h));
    const ci={name:col(/受検者名|氏名/),kind:col(/^区分$/),basic:col(/【基礎】点数/),fail:col(/【応用】失敗平均/),fp:col(/【応用】FP率平均/)};
    const procCols=H.map((h,i)=>{const m=h.match(/【応用(\d)】処理数/);return m?{i,n:m[1]}:null}).filter(Boolean);
    const miss=[!(ci.basic>=0)&&'【基礎】点数',!procCols.length&&'【応用1〜3】処理数',!(ci.fail>=0)&&'【応用】失敗平均',!(ci.fp>=0)&&'【応用】FP率平均'].filter(Boolean);
    if(miss.length)throw new Error('列が見つかりません：'+miss.join('、'));
    const num=v=>{const x=parseFloat(String(v).replace(/,/g,''));return isFinite(x)?x:null};
    const out=rows.slice(hi+1).filter(r=>String(r[ci.name]||'').trim()).map(r=>{
      let best=null,which='';procCols.forEach(c=>{const v=num(r[c.i]);if(v!=null&&(best==null||v>best)){best=v;which='応用'+c.n}});
      return {name:String(r[ci.name]).trim(),kind:ci.kind>=0?String(r[ci.kind]).trim():'',basic:num(r[ci.basic]),procMax:best,procWhich:which,fail:num(r[ci.fail]),fp:num(r[ci.fp])}});
    if(!out.length)throw new Error('受検者のデータがありません');
    localStorage.setItem(MILME_KEY,JSON.stringify({file:file.name,at:new Date().toISOString(),rows:out}));
    const m=new Set(D.official.people.map(p=>nkey(p.name)));
    toast(`${out.length}名を読み込みました（組織図と一致 ${out.filter(r=>m.has(nkey(r.name))).length}名）`);
  }catch(e){toast('読み込めませんでした：'+e.message)}
  render();
}
function milmePairs(){
  const mm=milmeMap(),o=D.official;const pairs=[];
  o.people.filter(p=>p.status!=='採用予定'&&p.status!=='退職').forEach(p=>{
    let b=bossOf(p,o),rel='直属上司';
    if(!b&&MV.auto){const save=V.scn;V.scn='official';b=findBoss(p);V.scn=save;rel='部署上の上位者'}
    if(!b)return;
    const ms=mm.get(nkey(p.name)),mb=mm.get(nkey(b.name));
    const gap=ms&&mb&&ms.procMax!=null&&mb.procMax!=null?mb.procMax-ms.procMax:null;
    pairs.push({p,b,rel,ms,mb,gap,bad:gap!=null&&Math.abs(gap)>=MV.th});
  });
  return pairs;
}

function findBoss(p){
  const o=org();let d=deptById(p.deptId);
  if(!d)return null;
  if(!p.isHead){const h=o.people.find(x=>x.deptId===d.id&&x.isHead&&x.id!==p.id);if(h)return h}
  let pd=deptById(d.parentId);
  while(pd){const h=o.people.find(x=>x.deptId===pd.id&&x.isHead);if(h)return h;pd=deptById(pd.parentId)}
  return null;
}
/* ========== 直属上司 ========== */
const bossOf=(p,o=org())=>p&&p.bossId?o.people.find(x=>x.id===p.bossId)||null:null;
const subsOf=(id,o=org())=>o.people.filter(x=>x.bossId===id&&x.id!==id);
function subTree(id,o=org()){const out=new Set(),st=[id];while(st.length){const c=st.pop();o.people.forEach(x=>{if(x.bossId===c&&!out.has(x.id)){out.add(x.id);st.push(x.id)}})}return out}
const pLabel=(x,o=org())=>`${x.name}｜${x.title}${x.roleName?'・'+x.roleName:''}｜${deptName(x.deptId,o)}`;
/* 検索つきプルダウン（自分自身と自分の部下は候補に出さない） */
function bossPicker({self,sel,attr,o=org(),extra=''}){
  const ex=self?subTree(self,o):new Set();
  const list=o.people.filter(x=>x.id!==self&&!ex.has(x.id)&&((x.status!=='採用予定'&&x.status!=='退職')||x.id===sel))
    .sort((a,b)=>(rank(b.title)-rank(a.title))||a.name.localeCompare(b.name,'ja'));
  const opts=`<option value="" ${sel===''?'selected':''}>未設定</option>${extra}`+list.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(pLabel(x,o))}</option>`).join('');
  return `<div class="bpick"><input class="bsq" type="search" placeholder="氏名・役職・部署で絞り込み" aria-label="上司候補を絞り込み" ${/disabled/.test(attr)?'disabled':''}><select ${attr}>${opts}</select></div>`;
}
document.addEventListener('input',e=>{
  const q=e.target.closest('.bsq');if(!q)return;const sel=q.parentNode.querySelector('select');if(!sel)return;
  if(!sel._all)sel._all=[...sel.options].map(o=>({v:o.value,t:o.textContent}));
  const k=q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);const cur=sel.value;
  sel.innerHTML=sel._all.filter(o=>o.v===''||o.v==='__keep'||o.v===cur||k.every(w=>o.t.toLowerCase().includes(w)))
    .map(o=>`<option value="${esc(o.v)}" ${o.v===cur?'selected':''}>${esc(o.t)}</option>`).join('');
});
/* 上司の変更（正式組織では上司変更履歴に記録） */
function setBoss(p,newId,reason,opt={}){
  const o=opt.o||org();newId=newId||null;
  if(newId&&!o.people.find(x=>x.id===newId))newId=null;
  if((p.bossId||null)===newId)return '';
  if(newId&&(newId===p.id||subTree(p.id,o).has(newId))){toast('自分自身や自分の部下は上司に設定できません');return ''}
  const nm=id=>id?(o.people.find(x=>x.id===id)?.name||'（削除済み）'):'未設定';
  const from=nm(p.bossId),to=nm(newId);p.bossId=newId;
  if(o===D.official)(D.bossHistory=D.bossHistory||[]).push({id:uid('b'),personId:p.id,name:p.name,from,to,date:opt.date||today(),reason:reason||'',by:opt.by||me.name||me.email,at:new Date().toISOString()});
  return `${from} → ${to}`;
}
const bossChanges=x=>x&&x.bossTo!==undefined&&x.bossTo!=='__keep';
function bossChangeText(x,p){
  if(!bossChanges(x))return '';const o=D.official;
  const cur=bossOf(p,o)?.name||'未設定',nx=x.bossTo?(o.people.find(y=>y.id===x.bossTo)?.name||'（削除済み）'):'未設定';
  return cur===nx?'':`<div class="note">直属上司：${esc(cur)} → <b>${esc(nx)}</b></div>`;
}
async function warnSubs(p,what){
  const subs=subsOf(p.id);if(!subs.length)return true;
  const r=await modal({title:'直属の部下がいます',body:`<div class="bwarn"><b>${esc(p.name)}</b>さんには直属の部下が${subs.length}名います。<br>${subs.map(x=>esc(x.name)).join('、')}</div><div class="note" style="margin-top:8px">${what}</div>`,
    actions:[{label:'やめる',key:null},{label:'このまま進める',key:'ok',kind:'del'}]});
  return !!r.key;
}
function closeDrawer(){V.sel=null;const dr=$('#drawer');dr.classList.remove('open');dr.setAttribute('aria-hidden','true')}
$('#drawer').addEventListener('change',e=>{
  const f=e.target.dataset.f;if(!f)return;const p=person(V.sel);if(!p)return;
  if(f==='deptId'){const to=e.target.value||null;e.target.value=p.deptId||'';requestMove(p.id,to);return}
  if(f==='bossId'){if(!canEdit())return;const ch=setBoss(p,e.target.value||null,'社員情報の編集');if(ch){dirty();toast('直属上司を変更しました：'+ch)}render();renderDrawer();return}
  if(f==='status'&&e.target.value==='退職'&&p.status!=='退職'){const v=e.target.value;e.target.value=p.status;
    warnSubs(p,'退職にしても部下の直属上司は自動では外れません。部下の詳細から新しい上司を設定してください。').then(ok=>{if(!ok)return;p.status=v;dirty();render();renderDrawer()});return}
  let v=e.target.type==='checkbox'?e.target.checked:e.target.value;
  if(f==='tags')v=v.split(/[、,，\s]+/).filter(Boolean);
  p[f]=v;dirty();render();
});

/* ========== 異動 ========== */
let roWarned=false;
function warnReadOnly(){
  if(roWarned)return;roWarned=true;
  toast('閲覧のみの権限のため、配置を変更できません（編集には管理者・マネージャー権限が必要です）');
}
async function requestMove(pid,to){
  const p=person(pid);if(!p||(p.deptId||null)===(to||null))return;
  if(!canEdit()){warnReadOnly();return}
  const off=isOfficial();const from=p.deptId;
  const body=`<div class="movebox"><b>${esc(p.name)}</b>さんを<br>${esc(deptName(from))} → <b>${esc(deptName(to))}</b> へ${off?'異動しますか？':'移動しますか？'}</div>
    ${off?`<label>異動日<input name="date" type="date" value="${nextMonth1()}"></label><label>理由・メモ（任意）<input name="reason" placeholder="例：東京支社立上げのため"></label>`:''}
    <label>異動後の直属上司</label>${bossPicker({self:p.id,sel:'__keep',attr:'name="bossTo"',extra:`<option value="__keep" selected>変更しない（現在：${esc(bossOf(p)?.name||'未設定')}）</option>`})}
    ${p.isHead?`<div class="note">部門長のため、異動後は部門長の設定が外れます。</div>`:''}
    ${off?`<div class="note">【承認して反映】異動日が今日以前ならカードがその場で移動、未来日なら異動日に自動で反映されます（所属部署と直属上司を同時に更新）。異動履歴と異動CAREに記録されます。<br>【異動予定に登録】組織図は変わりません。異動予定タブに承認待ちとして残り、あとで【承認】できます。</div>`:''}`;
  const acts=off?[{label:'やめる',key:null},
                  {label:'異動予定に登録（組織図はまだ動かない）',key:'draft',kind:canApprove()?null:'pri'},
                  ...(canApprove()?[{label:'承認して反映',key:'now',kind:'pri'}]:[])]
               :[{label:'やめる',key:null},{label:'移動する',key:'move',kind:'pri'}];
  const r=await modal({title:off?'異動の確認':'シナリオ内で移動',body,actions:acts});
  if(!r.key)return;
  const bossTo=r.form.bossTo??'__keep';
  if(r.key==='move'){p.deptId=to;p.isHead=false;if(bossTo!=='__keep')setBoss(p,bossTo,'シナリオ内の移動')}
  else if(r.key==='draft'){
    D.pending=D.pending.filter(x=>x.personId!==pid);
    D.pending.push({id:uid('m'),personId:pid,from,to,bossTo,date:r.form.date||today(),reason:r.form.reason||'',by:me.name||me.email,at:new Date().toISOString(),status:'draft'});
    toast('異動予定（下書き）に追加しました');
  }else if(r.key==='now'){
    const x={id:uid('m'),personId:pid,from,to,bossTo,date:r.form.date||today(),reason:r.form.reason||'',by:me.name||me.email,at:new Date().toISOString(),status:'draft'};
    D.pending=D.pending.filter(y=>y.personId!==pid);D.pending.push(x);
    toast(approvePending(x)==='now'?'承認して組織図に反映しました':`承認しました。${fmtMD(x.date)}に組織図へ反映します`)}
  dirty();render();
}
function applyMove(pid,to,date,reason,o=D.official,opt={}){
  const p=o.people.find(x=>x.id===pid);if(!p)return;
  const from=p.deptId;const fromN=deptName(from,o),toN=deptName(to,o);
  p.deptId=to||null;p.isHead=false;
  const by=opt.by||me.name||me.email;
  const bc=bossChanges(opt)?setBoss(p,opt.bossTo,'異動に伴う変更',{o,date,by}):'';
  D.pending=D.pending.filter(x=>x.personId!==pid);
  D.history.push({id:uid('h'),personId:pid,name:p.name,from:fromN,to:toN,boss:bc,date,reason:reason||'',kind:opt.kind||'反映',by,at:new Date().toISOString()});
  if(!opt.noCare&&p.status!=='採用予定')D.care.push({id:uid('c'),personId:pid,name:p.name,from:fromN,to:toN,boss:bossOf(p,o)?.name||'',date,items:CARE_TPL.map(([label,off])=>({label,due:addDays(date,off),done:false}))});
}
/* 承認：異動日が今日以前→即時反映／未来日→承認済みとして保持し異動日に自動反映。履歴・CAREは承認時点で記録 */
function approvePending(x){
  if(!x||x.status==='approved')return null;
  const o=D.official;const p=o.people.find(y=>y.id===x.personId);
  if(!p){D.pending=D.pending.filter(y=>y.id!==x.id);return null}
  const by=me.name||me.email;
  if(x.date<=today()){applyMove(x.personId,x.to,x.date,x.reason,o,{kind:'承認・反映',by,bossTo:x.bossTo});return 'now'}
  const fromN=deptName(p.deptId,o),toN=deptName(x.to,o);
  const curB=bossOf(p,o)?.name||'未設定',nxB=bossChanges(x)?(x.bossTo?(o.people.find(y=>y.id===x.bossTo)?.name||'未設定'):'未設定'):curB;
  x.status='approved';x.approvedBy=by;x.approvedAt=new Date().toISOString();x.from=p.deptId||null;
  D.history.push({id:uid('h'),personId:p.id,name:p.name,from:fromN,to:toN,boss:curB!==nxB?`${curB} → ${nxB}`:'',date:x.date,reason:x.reason||'',kind:'承認',by,at:x.approvedAt});
  if(p.status!=='採用予定'){D.care=D.care.filter(c=>c.pendingId!==x.id);
    D.care.push({id:uid('c'),pendingId:x.id,personId:p.id,name:p.name,from:fromN,to:toN,boss:nxB==='未設定'?'':nxB,date:x.date,items:CARE_TPL.map(([label,off])=>({label,due:addDays(x.date,off),done:false}))})}
  return 'later';
}
/* 異動日を迎えた承認済みの異動を組織図へ反映（CAREは承認時に作成済み） */
function applyDueMoves(){
  const t=today();const due=D.pending.filter(x=>x.status==='approved'&&x.date<=t);
  due.forEach(x=>{if(!D.official.people.find(y=>y.id===x.personId)){D.pending=D.pending.filter(y=>y.id!==x.id);return}
    applyMove(x.personId,x.to,x.date,x.reason,D.official,{kind:'反映',by:'自動反映（承認：'+(x.approvedBy||'')+'）',noCare:true,bossTo:x.bossTo})});
  return due.length;
}
function runDue(){if(!D)return;const n=applyDueMoves();if(n){if(canEdit())dirty();render();toast(`異動日を迎えた${n}件を組織図に反映しました`)}}

/* ========== ドラッグ＆ドロップ（マウス／タッチ長押し） ========== */
let drag=null;
document.addEventListener('pointerdown',e=>{
  const c=e.target.closest('.card');if(!c||e.button>0)return;
  drag={pid:c.dataset.pid,el:c,x:e.clientX,y:e.clientY,type:e.pointerType,on:false,moved:false,timer:null};
  if(canEdit()&&e.pointerType!=='mouse')drag.timer=setTimeout(()=>startDrag(e.clientX,e.clientY),420);
});
document.addEventListener('pointermove',e=>{
  if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y,dist=Math.hypot(dx,dy);
  if(!drag.on){
    if(dist>8){drag.moved=true;clearTimeout(drag.timer);
      if(drag.type==='mouse'){ if(canEdit())startDrag(e.clientX,e.clientY); else {warnReadOnly();drag=null} }
      else if(drag.type!=='mouse'){ if(!canEdit())warnReadOnly(); drag=null } }
    return;
  }
  moveGhost(e.clientX,e.clientY);
});
document.addEventListener('pointerup',e=>{
  if(!drag)return;clearTimeout(drag.timer);const d=drag;drag=null;
  if(d.on){endDrag(e.clientX,e.clientY,d);return}
  if(!d.moved){V.sel=d.pid;renderDrawer()}
});
document.addEventListener('pointercancel',()=>{if(drag&&!drag.on){clearTimeout(drag.timer);drag=null}});
document.addEventListener('touchmove',e=>{if(drag&&drag.on)e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',e=>{if(e.target.closest('.card'))e.preventDefault()});
function startDrag(x,y){
  if(!drag)return;drag.on=true;drag.moved=true;
  const g=drag.el.cloneNode(true);g.classList.add('ghost');g.classList.remove('dim','hit');document.body.appendChild(g);drag.ghost=g;
  drag.el.classList.add('lifted');if(navigator.vibrate)navigator.vibrate(15);moveGhost(x,y);
}
function moveGhost(x,y){
  drag.ghost.style.left=(x-95)+'px';drag.ghost.style.top=(y-20)+'px';
  document.querySelectorAll('.over').forEach(n=>n.classList.remove('over'));
  const t=document.elementFromPoint(x,y)?.closest('[data-drop]');if(t)t.classList.add('over');drag.target=t?.dataset.drop;
  const pane=$('#pane'),r=pane.getBoundingClientRect(),m=50;
  if(x>r.right-m)pane.scrollLeft+=14;else if(x<r.left+m&&x>r.left)pane.scrollLeft-=14;
  if(y>r.bottom-m)pane.scrollTop+=14;else if(y<r.top+m&&y>r.top)pane.scrollTop-=14;
}
function endDrag(x,y,d){
  d.ghost?.remove();d.el.classList.remove('lifted');
  document.querySelectorAll('.over').forEach(n=>n.classList.remove('over'));
  const t=document.elementFromPoint(x,y)?.closest('[data-drop]');
  if(t)requestMove(d.pid,t.dataset.drop==='__none'?null:t.dataset.drop);
}
document.addEventListener('keydown',e=>{
  const c=e.target.closest?.('.card');
  if(c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();V.sel=c.dataset.pid;renderDrawer()}
  if(e.key==='Escape'&&V.sel&&$('#modal').hidden)closeDrawer();
});

/* ========== 取込（表の貼り付け） ========== */
async function importTable(){
  const r=await modal({title:'社員データを取込',body:`<div class="note">スプレッドシート・Excelの表を、見出し行ごとコピーして貼り付けてください。<br>使う列：部署（所属）・氏名・役職・役割・上位部署・上司（直属上司）・入社・勤務地。役割定義シートのように1人が複数行ある表でも、氏名ごとに1人にまとめます。役割に「部門長」を含む人は部門長になります。</div>
    <textarea name="txt" placeholder="部署&#9;役職&#9;氏名&#9;役割"></textarea>
    <label>取込み方<select name="how"><option value="replace">今の組織を置き換える</option><option value="add">今の組織に追加する</option></select></label>
    <div class="note">取込先：${isOfficial()?'正式組織':'シナリオ「'+esc(org().name)+'」'}</div>`,
    actions:[{label:'やめる',key:null},{label:'取り込む',key:'ok',kind:'pri'}]});
  if(!r.key||!r.form.txt.trim())return;
  const rows=r.form.txt.trim().split(/\r?\n/).map(l=>{const sep=l.includes('\t')?'\t':',';return l.split(sep).map(s=>s.trim().replace(/^"|"$/g,''))});
  const H=rows.shift();const col=re=>H.findIndex(h=>re.test(h));
  const ci={dept:col(/部署|所属|部門/),name:col(/氏名|名前|社員名/),title:col(/役職/),role:col(/^役割$|役割名/),parent:col(/上位|親部署/),boss:col(/上司/),joined:col(/入社/),loc:col(/勤務地|拠点/)};
  if(ci.name<0){toast('「氏名」の列が見つかりません。見出し行も一緒に貼り付けてください');return}
  const o=org();
  if(r.form.how==='replace'){o.depts=[{id:'top',name:'代表取締役',parentId:null,hue:0}];o.people=[];D.pending=isOfficial()?[]:D.pending}
  const byName=new Map(o.depts.map(d=>[d.name,d]));const seen=new Map(o.people.map(p=>[p.name,p]));
  const getDept=(name,parent)=>{if(!name)return null;if(byName.has(name))return byName.get(name).id;
    let pid='top';if(parent){pid=getDept(parent,null)}if(!deptById(pid,o))pid=roots(o)[0]?.id||null;
    const d={id:uid('d'),name,parentId:pid,hue:o.depts.length};o.depts.push(d);byName.set(name,d);return d.id};
  let lastDept='',added=0;const bossNm=new Map();

    o.people.push(p);seen.set(nm,p);added++;if(g(ci.boss))bossNm.set(p,g(ci.boss));
  });
  bossNm.forEach((bn,p)=>{const b=seen.get(bn)||o.people.find(x=>x.name.replace(/\s/g,'')===bn.replace(/\s/g,''));if(b&&b.id!==p.id)setBoss(p,b.id,'取込')});
  D.isSample=false;dirty();render();toast(`${added}名を取り込みました`);
}

/* ========== 共通UI ========== */
function modal({title,body,actions}){
  return new Promise(res=>{
    const m=$('#modal');const prev=document.activeElement;
    m.innerHTML=`<div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt">${title}</h3><div class="mbody">${body}</div>
      <div class="mact">${actions.map((a,i)=>`<button class="btn ${a.kind||''}" data-i="${i}">${a.label}</button>`).join('')}</div></div>`;
    m.hidden=false;(m.querySelector('input,select,textarea')||m.querySelector('.mact .pri')||m.querySelector('button')).focus();
    const done=v=>{m.hidden=true;m.onclick=m.onkeydown=null;prev?.focus?.();res(v)};
    m.onclick=e=>{const b=e.target.closest('[data-i]');
      if(b){const a=actions[+b.dataset.i];if(a.key&&a.validate&&!a.validate(m)){m.querySelector('input')?.focus();return}
        const form={};m.querySelectorAll('[name]').forEach(el=>form[el.name]=el.type==='checkbox'?el.checked:el.value);done({key:a.key,form})}
      else if(e.target===m)done({key:null})};
    m.onkeydown=e=>{if(e.key==='Escape')done({key:null});if(e.key==='Enter'&&e.target.tagName==='INPUT'){m.querySelector('.mact .pri')?.click()}};
  });
}
let toastT;function toast(t){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.appendChild(d);clearTimeout(toastT);toastT=setTimeout(()=>d.remove(),2600)}
function flashDept(id){V.tab='chart';renderPane();requestAnimationFrame(()=>{const n=$('#dept-'+id);if(!n)return;n.scrollIntoView({behavior:'smooth',block:'center',inline:'center'});n.classList.remove('flash');void n.offsetWidth;n.classList.add('flash')})}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

 {id:'news',grp:'更新',title:'最近の更新',since:'',body:()=>`
  <p class="note">このマニュアルはアプリと一体になっていて、アプリが更新されると同時に更新されます。新しく変わった項目には <span class="newtag">NEW</span> が付きます。</p>
  <div class="clwrap">${changelogHTML(CHANGELOG.slice(0,5))}</div>`}
];
const NEW_SET=new Set(CHANGELOG.slice(0,2).map(c=>c[0]));
const isNewSec=m=>m.since&&NEW_SET.has(m.since);
function renderManual(q=''){
  const box=$('#manual');const k=q.trim();
  const secs=MANUAL.filter(m=>!m.show||m.show()).map(m=>({...m,html:m.body()}));
  const strip=h=>h.replace(/<[^>]+>/g,'');
  const hits=k?secs.filter(m=>(m.title+strip(m.html)).includes(k)):secs;
  const hl=h=>k?h.replace(/>([^<]+)</g,(a,t)=>'>'+t.split(k).join(`<mark>${esc(k)}</mark>`)+'<'):h;
  let g='';const toc=hits.map(m=>{const head=m.grp!==g?`<div class="grp">${esc(m.grp)}</div>`:'';g=m.grp;
    return head+`<button data-msec="${m.id}">${esc(m.title)}${isNewSec(m)?' <span class="newtag">NEW</span>':''}</button>`}).join('');
  box.querySelector('.mtoc').innerHTML=toc||'<div class="grp">該当なし</div>';
  box.querySelector('.mcont').innerHTML=`<div class="mver">マニュアル版：${esc(APP_VERSION)}（アプリと同時に自動更新）</div>`+
    (hits.map(m=>`<section id="ms-${m.id}"><h2>${esc(m.title)}${isNewSec(m)?'<span class="newtag">NEW</span>':''}</h2>${hl(m.html)}</section>`).join('')||`<section><p>「${esc(k)}」に当てはまる項目はありません。</p></section>`);
}
function openManual(sec){
  const box=$('#manual');
  box.innerHTML=`<div class="mh"><b>活用マニュアル</b><small>EARTHCOM ORG DESIGN ／ ${esc(APP_VERSION)}</small>
    <input type="search" id="mq" placeholder="キーワードで探す（例：承認、上司）" aria-label="マニュアル内検索">
    <button class="hbtn" id="mPrint">印刷・PDF</button><button class="hbtn" id="mClose">閉じる</button></div>
    <div class="mbodyw"><nav class="mtoc" aria-label="目次"></nav><div class="mcont"></div></div>`;
  box.hidden=false;renderManual();
  $('#mq').oninput=e=>renderManual(e.target.value);
  $('#mClose').onclick=closeManual;
  $('#mPrint').onclick=()=>{document.body.classList.add('printing-manual');setTimeout(()=>{window.print();document.body.classList.remove('printing-manual')},100)};
  box.querySelector('.mtoc').onclick=e=>{const b=e.target.closest('[data-msec]');if(b)$('#ms-'+b.dataset.msec)?.scrollIntoView({behavior:'smooth'})};
  box.onkeydown=e=>{if(e.key==='Escape')closeManual()};
  if(sec)requestAnimationFrame(()=>$('#ms-'+sec)?.scrollIntoView());
  $('#mq').focus();
}
function closeManual(){const b=$('#manual');b.hidden=true;b.innerHTML='';$('#manualBtn').focus()}
$('#manualBtn').onclick=()=>openManual();


/* ========== イベント ========== */
document.addEventListener('click',async e=>{
  const go=e.target.closest('[data-go]');if(go){if(innerWidth<=820)$('#aside').classList.remove('open');flashDept(go.dataset.go);document.querySelectorAll('.tabs [data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab==='chart'));return}
  const tab=e.target.closest('[data-tab]');if(tab){V.tab=tab.dataset.tab;render();return}
  const cb=e.target.closest('[data-care]');if(cb){const c=D.care.find(x=>x.id===cb.dataset.care);if(c){c.items[+cb.dataset.k].done=cb.checked;dirty();renderPane();render()}return}
  const a=e.target.closest('[data-act]');if(!a)return;const id=a.dataset.id;
  switch(a.dataset.act){
    case 'deptMenu':deptMenu(id);break;
    case 'closeDrawer':closeDrawer();break;
    case 'delPerson':{const p=person(V.sel);const subs=subsOf(p.id);
      const r=await modal({title:'社員を削除',body:`<div>${esc(p.name)}さんを組織から削除します。異動履歴は残ります。</div>${subs.length?`<div class="bwarn"><b>直属の部下が${subs.length}名います。</b><br>${subs.map(x=>esc(x.name)).join('、')}<br>削除すると、この${subs.length}名の直属上司は「未設定」になります（上司変更履歴に記録）。</div>`:''}`,actions:[{label:'やめる',key:null},{label:'削除する',key:'ok',kind:'del'}]});
      if(r.key){const o=org();subs.forEach(x=>setBoss(x,null,`上司（${p.name}）の削除により解除`));
        o.people=o.people.filter(x=>x.id!==p.id);D.pending=D.pending.filter(x=>x.personId!==p.id);closeDrawer();dirty();render()}break}
    case 'milmeDel':{const r=await modal({title:'ミルメのデータを削除',body:'<div>この端末に保存しているミルメのデータを削除します。Excelファイル自体は消えません。</div>',actions:[{label:'やめる',key:null},{label:'削除する',key:'ok',kind:'del'}]});
      if(r.key){try{localStorage.removeItem(MILME_KEY)}catch(e){}render();toast('削除しました')}break}
    case 'openPerson':{if(person(id)){V.sel=id;renderDrawer();$('#drawer').scrollTop=0;const b=$('#drawer .body');if(b)b.scrollTop=0}break}
    case 'bossCsv':{const lines=[['変更日','氏名','変更前の上司','変更後の上司','理由','記録者','記録日時'],...(D.bossHistory||[]).map(h=>[h.date,h.name,h.from,h.to,h.reason,h.by,h.at])];
      download(`上司変更履歴_${today()}.csv`,'\ufeff'+lines.map(l=>l.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv');break}
    case 'approve':{if(!canApprove())break;const x=D.pending.find(y=>y.id===id);if(!x)break;
      const p=D.official.people.find(y=>y.id===x.personId);const fut=x.date>today();
      const r=await modal({title:'異動を承認',body:`<div class="movebox"><b>${esc(p?.name||'')}</b>さんを<br>${esc(deptName(p?.deptId,D.official))} → <b>${esc(deptName(x.to,D.official))}</b><br>異動日 ${esc(x.date)}</div>${bossChangeText(x,p)}
        <div class="note">${fut?'異動日が未来のため、承認済みとして保持し、異動日に自動で組織図へ反映します。':'異動日が今日以前のため、承認するとすぐに組織図へ反映します。'}<br>異動履歴と異動CAREに記録されます。</div>`,
        actions:[{label:'やめる',key:null},{label:fut?'承認する（異動日に反映）':'承認して反映',key:'ok',kind:'pri'}]});
      if(!r.key)break;const res=approvePending(x);dirty();render();
      toast(res==='now'?'承認して組織図に反映しました':`承認しました。${fmtMD(x.date)}に組織図へ反映します`);break}
    case 'approveAll':{if(!canApprove())break;let now=0,later=0;D.pending.filter(x=>x.status!=='approved').forEach(x=>{const r=approvePending(x);if(r==='now')now++;else if(r==='later')later++});
      dirty();render();toast(`承認しました（即時反映 ${now}件／異動日に反映 ${later}件）`);break}
    case 'cancelPend':{const x=D.pending.find(y=>y.id===id);if(!x)break;
      if(x.status==='approved'){const r=await modal({title:'承認済みの異動を取消',body:'<div>承認済みの異動予定を取り消します。作成済みの異動CAREも削除し、異動履歴に「取消」を記録します。</div>',actions:[{label:'やめる',key:null},{label:'取り消す',key:'ok',kind:'del'}]});
        if(!r.key)break;const p=D.official.people.find(y=>y.id===x.personId);
        D.care=D.care.filter(c=>c.pendingId!==x.id);
        D.history.push({id:uid('h'),personId:x.personId,name:p?.name||'',from:deptName(p?.deptId,D.official),to:deptName(x.to,D.official),date:x.date,reason:x.reason||'',kind:'取消',by:me.name||me.email,at:new Date().toISOString()})}
      D.pending=D.pending.filter(y=>y.id!==id);dirty();render();break}
    case 'histCsv':{const lines=[['異動日','区分','氏名','異動元','異動先','直属上司の変更','理由','記録者','記録日時'],...D.history.map(h=>[h.date,h.kind||'反映',h.name,h.from,h.to,h.boss||'',h.reason,h.by,h.at])];
      download(`異動履歴_${today()}.csv`,'\ufeff'+lines.map(l=>l.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv');break}
    case 'aiRun':runAI();break;
    case 'scnEdit':scnForm(org());break;
    case 'scnDel':{const r=await modal({title:'シナリオを削除',body:`<div>「${esc(org().name)}」を削除します。正式組織には影響しません。</div>`,actions:[{label:'やめる',key:null},{label:'削除する',key:'ok',kind:'del'}]});
      if(r.key){D.scenarios=D.scenarios.filter(s=>s.id!==V.scn);V.scn='official';dirty();render()}break}
    case 'scnAdopt':adoptScenario();break;
  }
});

$('#pdfBtn').onclick=()=>{V.tab='chart';render();setTimeout(()=>window.print(),150)};
$('#saveBtn').onclick=()=>save(true);
$('#backupBtn').onclick=async()=>{
  const r=await modal({title:'バックアップ',body:`<div class="note">全データ（正式組織・シナリオ・異動予定・履歴・上司変更履歴・CARE）をJSONファイルで書き出し／読み込みできます。</div>${canEdit()?`<label>読み込むファイル<input name="file" type="file" accept=".json"></label>`:''}`,
    actions:[{label:'閉じる',key:null},...(canEdit()?[{label:'読み込む',key:'in'}]:[]),{label:'書き出す',key:'out',kind:'pri'}]});
  if(r.key==='out')download(`org-design_${today()}.json`,JSON.stringify(D,null,1),'application/json');
  if(r.key==='in'){const f=$('#modal [name=file]')?.files?.[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!j.official)throw 0;D=j;V.scn='official';dirty();render();toast('読み込みました')}catch{toast('このファイルは読み込めません。書き出したJSONを選んでください')}}
};

/* ========== 保存（Supabase） ========== */
let saveT=null,saving=false;
function dirty(){setSave('未保存の変更があります');clearTimeout(saveT);saveT=setTimeout(()=>save(),1500)}
function setSave(t,err){const s=$('#saveState');s.textContent=t;s.classList.toggle('err',!!err)}
async function save(manual){
  clearTimeout(saveT);
  if(mode!=='live'){setSave('プレビュー表示（保存されません）');if(manual)toast('プレビューでは保存されません。公開URLから開いてください');return}
  if(saving){saveT=setTimeout(()=>save(),800);return}
  saving=true;setSave('保存中…');
  const {error}=await sb.from(TABLE).upsert({id:ROW,data:D,updated_at:new Date().toISOString(),updated_by:me.email});
  saving=false;
  if(error)setSave('保存できませんでした：'+error.message,true);
  else{setSave('保存済み '+new Date().toTimeString().slice(0,5));if(manual)toast('保存しました')}
}
async function boot(){
  try{
    if(window.EC&&window.supabase){
      if(EC.guard)await EC.guard({allow:['admin','manager','sales','field','viewer']});
      const m=typeof EC.me==='function'?await EC.me():EC.me;
      if(m)me={email:m.email,name:m.full_name||m.name||m.email,role:m.role||'viewer'};
      sb=EC.sb||EC.client||window.supabase.createClient(SB_URL,SB_KEY);
      const {data,error}=await sb.from(TABLE).select('data').eq('id',ROW).maybeSingle();
      if(error)throw error;
      D=data?.data||sample();mode='live';
      setSave(data?'保存済み':'サンプルを表示中（まだ保存されていません）');
    }else throw new Error('preview');
  }catch(e){
    D=D||sample();mode='preview';setSave(e.message==='preview'?'プレビュー表示（保存されません）':'データを読み込めませんでした：'+e.message,e.message!=='preview');
  }
  ['scenarios','pending','history','care','bossHistory'].forEach(k=>D[k]=D[k]||[]);
  D.pending.forEach(x=>{if(!x.status)x.status='draft'});
  const nDue=applyDueMoves();if(nDue&&canEdit())dirty();
  render();
  if(nDue)setTimeout(()=>toast(`異動日を迎えた${nDue}件を組織図に反映しました`),600);
  setInterval(runDue,10*60*1000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)runDue()});
  setTimeout(()=>showWhatsNew(true),350);
}
boot();
</script>
