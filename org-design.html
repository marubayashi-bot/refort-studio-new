<!--
  EARTHCOM ORG DESIGN Ver.1
  ・組織図／社員カード／ドラッグ＆ドロップ異動（PC:ドラッグ、スマホ・タブレット:長押し→移動）
  ・正式組織は「下書き→承認→反映」、シナリオ（未来組織）は自由に組替え
  ・異動履歴（監査ログ）／異動CARE（7日・30日・90日フォロー）／組織診断（ルール＋AI）
  ・表・Excelの貼り付け取込、JSONバックアップ、PDF出力（印刷）
  保存先: Supabase テーブル org_design_state（id='main' の1行にJSONで保存。版番号つき RPC org_design_save）
  社員マスタ: ec_employees（社員番号・氏名・所属・役職・直属上司・在籍・適用開始日）は両アプリ共通。正式な異動は ec_transfers で
              申請→承認→適用日に反映（サーバー関数・毎日0:05自動）。SQL未適用の環境では従来どおりに動作します。
  認証: ec-auth.js（会社Googleアカウント）。読込めない環境ではプレビューモードで動作（保存されません）
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ec-auth.js" onerror="void 0"></script>
<style>
:root{
  --ink:#12233A;        /* パネルの濃紺（ソーラーパネルの枠） */
  --cell:#1F4E79;       /* セルの青 */
  --sky:#EEF3F8;        /* 図面の地 */
  --grid:#D9E3EE;       /* 方眼 */
  --paper:#FFFFFF;
  --sun:#E3A23B;        /* 日射のアンバー（アクセントはここだけ） */
  --leaf:#2F8A5B;
  --warn:#C4533A;
  --muted:#5E7188;
  --line:#8FA6BF;
  --r-s:6px; --r-m:10px;
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--ink);background:var(--sky)}
body{display:grid;grid-template-rows:auto auto auto 1fr auto;grid-template-columns:minmax(0,1fr);height:100dvh;overflow:hidden;font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
[hidden]{display:none!important}

/* ヘッダー */
header{background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:8px}
.brand b{font-weight:900;font-size:18px;letter-spacing:.04em}
.brand small{font-size:11px;color:#AFC2D6}
.hsp{flex:1}
.hbtn{background:transparent;border:1px solid #3C5675;color:#fff;border-radius:var(--r-s);padding:6px 12px;white-space:nowrap}
.hbtn:hover{background:#1C3452}
.hbtn.ai{border-color:var(--sun);color:var(--sun)}
.search{background:#1C3452;border:1px solid #3C5675;border-radius:var(--r-s);color:#fff;padding:6px 10px;width:180px}
.search::placeholder{color:#8FA6BF}
.scnsel{background:#1C3452;border:1px solid #3C5675;color:#fff;border-radius:var(--r-s);padding:6px 8px;max-width:230px}
.me{font-size:12px;color:#AFC2D6}

/* 指標帯 */
.stats{display:flex;gap:0;background:var(--paper);border-bottom:1px solid var(--grid);overflow-x:auto}
.st{padding:8px 18px;border-right:1px solid var(--grid);min-width:112px}
.st span{display:block;font-size:11px;color:var(--muted)}
.st b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.st i{font-style:normal;font-size:12px;margin-left:4px}
.st i.up{color:var(--leaf)} .st i.dn{color:var(--warn)}
.scnbar{display:flex;align-items:center;gap:10px;padding:8px 16px;background:#FFF7E8;border-bottom:1px solid #F0D9AE;flex-wrap:wrap;font-size:13px}
.scnbar b{font-weight:700}
.sample{padding:8px 16px;background:#FFF7E8;border-bottom:1px solid #F0D9AE;font-size:13px}

/* 本体 */
main{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:0;min-width:0}
aside{background:var(--paper);border-right:1px solid var(--grid);display:flex;flex-direction:column;min-height:0}
.aside-h{padding:12px 14px 6px;font-weight:700;font-size:13px;color:var(--muted)}
.dlist{overflow:auto;flex:1;padding:0 6px 8px}
.dlist button{display:flex;justify-content:space-between;width:100%;border:0;background:none;text-align:left;padding:5px 8px;border-radius:var(--r-s)}
.dlist button:hover{background:var(--sky)}
.dlist button em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.tray{border-top:1px solid var(--grid);padding:10px;max-height:40%;overflow:auto;min-height:92px}
.tray.over{background:#FFF3DC}
.tray .card{width:100%}

.work{display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:flex;gap:2px;padding:8px 12px 0;overflow-x:auto;flex-shrink:0;background:var(--sky);border-bottom:1px solid var(--grid)}
.tabs button{white-space:nowrap;flex-shrink:0;border:1px solid transparent;border-bottom:0;background:none;padding:7px 14px;border-radius:var(--r-s) var(--r-s) 0 0;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--paper);border-color:var(--grid);color:var(--ink);font-weight:700;margin-bottom:-1px}
.tabs .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--sun);color:var(--ink);font-size:11px;font-weight:700}
.tabs .zoom{margin-left:auto;display:flex;gap:4px;align-items:center;padding-bottom:6px}
.tabs .zoom button{border:1px solid var(--grid);background:var(--paper);border-radius:var(--r-s);padding:2px 10px;color:var(--ink)}
.pane{flex:1;min-height:0;overflow:auto}

/* 組織図（方眼の設計図） */

.canvas{background-image:
  linear-gradient(rgba(31,78,121,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(31,78,121,.055) 1px,transparent 1px);
  background-size:24px 24px;padding:28px 28px 80px;min-width:max-content;min-height:100%}
.tree ul{display:flex;justify-content:center;padding:24px 0 0;margin:0;position:relative}
.tree>ul{padding-top:0}
.tree li{list-style:none;position:relative;padding:24px 8px 0;display:flex;flex-direction:column;align-items:center}
.tree>ul>li{padding-top:0}
.tree li::before,.tree li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:24px;border-top:2px solid var(--line)}
.tree li::after{right:auto;left:50%;border-left:2px solid var(--line)}
.tree li:only-child::before,.tree li:only-child::after{display:none}
.tree li:only-child{padding-top:0}
.tree li:first-child::before,.tree li:last-child::after{border:0}
.tree li:last-child::before{border-right:2px solid var(--line);border-radius:0 6px 0 0}
.tree li:first-child::after{border-radius:6px 0 0 0}
.tree ul ul::before{content:"";position:absolute;top:0;left:50%;height:24px;border-left:2px solid var(--line)}
.tree>ul>li::before,.tree>ul>li::after{display:none}

.dept{backdrop-filter:saturate(1.1)}
.dept{background:var(--paper);border:1px solid #C6D4E3;border-top:4px solid var(--hue);border-radius:var(--r-s);width:210px;box-shadow:0 1px 0 #C6D4E3;transition:box-shadow .12s,border-color .12s}
.dept.over{border-color:var(--sun);box-shadow:0 0 0 3px var(--sun)}
.dept.flash{animation:flash 1.2s}
@keyframes flash{0%,60%{box-shadow:0 0 0 4px var(--sun)}100%{box-shadow:0 1px 0 #C6D4E3}}
.dh{display:flex;align-items:center;gap:6px;padding:8px 8px 6px 10px}
.dn{font-weight:700;flex:1;font-size:14px}
.dc{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dm{border:0;background:none;padding:0 6px;border-radius:4px;color:var(--muted);font-weight:900}
.dm:hover{background:var(--sky)}
.dbody{padding:0 8px 8px;display:flex;flex-direction:column;gap:6px;min-height:40px}
.empty{font-size:12px;color:var(--muted);border:1px dashed #C6D4E3;border-radius:var(--r-s);padding:10px;text-align:center}

.card{background:#F7FAFD;border:1px solid #D5E0EB;border-radius:var(--r-s);padding:7px 9px;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.card:hover{border-color:var(--cell)}
.card.lead{background:#fff;border-left:3px solid var(--cell)}
.cn{font-weight:700;font-size:14px}
.cm{font-size:12px;color:var(--muted)}
.cm .head{font-weight:700;color:var(--cell)}
.cs{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--leaf)}
.dot.s-off{background:#A0AEBD}.dot.s-ret{background:#D5DCE4}.dot.s-new{background:var(--sun)}.dot.s-slot{background:transparent;border:1.5px dashed var(--muted)}
.tag{color:#8A5A0B}
.card.slot{background:transparent;border:1.5px dashed #9FB3C8}
.card.slot .cn{color:var(--muted);font-weight:500}
.card.pend{border-color:var(--sun);background:#FFF9EE}
.pb{font-size:11px;font-weight:700;color:#8A5A0B;margin-top:3px}
.card.dim{opacity:.28}
.card.hit{box-shadow:0 0 0 2px var(--sun)}
.card.lifted{opacity:.35}
.ro .card{cursor:pointer}
.ghost{position:fixed;z-index:90;pointer-events:none;width:190px;transform:rotate(-2deg);box-shadow:0 10px 24px rgba(18,35,58,.25);opacity:.95}

/* 一覧系ペイン */
.sheet{padding:20px 24px 80px;max-width:1080px}
.sheet h2{font-size:18px;margin:0 0 4px}
.sheet p.lead{color:var(--muted);margin:0 0 16px}
table{border-collapse:collapse;width:100%;background:var(--paper);border:1px solid var(--grid)}
th,td{padding:8px 10px;border-bottom:1px solid var(--grid);text-align:left;vertical-align:top;font-size:13px}
th{background:#F3F7FB;font-weight:700;color:var(--muted);white-space:nowrap}
.arrow{color:var(--muted);padding:0 4px}
.nodata{padding:28px;background:var(--paper);border:1px dashed #C6D4E3;border-radius:var(--r-m);color:var(--muted);text-align:center}
.carewrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.care{background:var(--paper);border:1px solid var(--grid);border-radius:var(--r-m);padding:14px}
.care h4{margin:0;font-size:15px}
.care .sub{font-size:12px;color:var(--muted);margin-bottom:8px}
.bar{height:6px;background:var(--grid);border-radius:3px;overflow:hidden;margin:6px 0 10px}
.bar i{display:block;height:100%;background:var(--leaf)}
.care label{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:13px}
.care label small{margin-left:auto;color:var(--muted);white-space:nowrap}
.care label.late small{color:var(--warn);font-weight:700}
.care label.done span{color:var(--muted);text-decoration:line-through}
.diag{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.dg{background:var(--paper);border:1px solid var(--grid);border-left:4px solid var(--sun);border-radius:var(--r-s);padding:10px 14px}
.dg.info{border-left-color:var(--cell)}
.dg b{display:block}
.dg span{font-size:13px;color:var(--muted)}
.aiout{background:var(--paper);border:1px solid var(--grid);border-radius:var(--r-m);padding:16px 18px;white-space:pre-wrap;line-height:1.8;max-width:78ch}
.note{font-size:12px;color:var(--muted)}

/* ボタン */
.btn{border:1px solid #C6D4E3;background:var(--paper);border-radius:var(--r-s);padding:7px 14px}
.btn:hover{border-color:var(--cell)}
.btn.pri{background:var(--cell);border-color:var(--cell);color:#fff}

/* ========== データ操作 ========== */
const org=()=>V.scn==='official'?D.official:(D.scenarios.find(s=>s.id===V.scn)||D.official);
const isOfficial=()=>V.scn==='official'||!D.scenarios.find(s=>s.id===V.scn);
const deptById=(id,o=org())=>o.depts.find(d=>d.id===id);
const deptName=(id,o=org())=>id?(deptById(id,o)?.name||'（削除済み部署）'):'未配置';
const person=id=>org().people.find(p=>p.id===id);
const children=(id,o=org())=>o.depts.filter(d=>d.parentId===id);
const roots=(o=org())=>o.depts.filter(d=>!d.parentId||!o.depts.find(x=>x.id===d.parentId));
const descendants=id=>{const out=[];const walk=x=>children(x).forEach(c=>{out.push(c.id);walk(c.id)});walk(id);return out};
const rank=t=>TITLES.indexOf(t);
const sortPeople=(a,b)=>(b.isHead-a.isHead)||((a.status==='採用予定')-(b.status==='採用予定'))||(rank(b.title)-rank(a.title))||a.name.localeCompare(b.name,'ja');
const isActive=p=>p.status==='在籍'||p.status==='休職';
const pendingOf=pid=>{if(!isOfficial())return null;const l=D.pending.find(x=>x.personId===pid);if(l||!MS.on)return l||null;
  const p=D.official.people.find(x=>x.id===pid);const t=p&&p.empId?openTransferOf(p.empId):null;
  return t?{to:t.to_dept_id,date:t.effective_date,status:t.status==='approved'?'approved':'draft',bossTo:t.change_manager?(personByEmp(t.to_manager_id)?.id||''):'__keep'}:null};

function stats(o){
  const act=o.people.filter(isActive);
  const mgr=act.filter(p=>MGR.has(p.title)).length;
  let spans=[];
  o.depts.forEach(d=>{const mem=o.people.filter(p=>p.deptId===d.id&&isActive(p));const heads=mem.filter(p=>p.isHead);
    if(heads.length){const sub=mem.length-heads.length+children(d.id,o).length;spans.push(sub)}});
  const direct=act.map(m=>act.filter(x=>x.bossId===m.id).length).filter(n=>n>0);if(direct.length)spans=direct;
  return {head:act.length,mgr,span:spans.length?(spans.reduce((a,b)=>a+b,0)/spans.length):0,depts:o.depts.length,
    hire:o.people.filter(p=>p.status==='採用予定'||p.status==='内定').length,
    unassigned:o.people.filter(p=>!p.deptId||!deptById(p.deptId,o)).length};
}

/* ========== 組織診断（ルール） ========== */
function diagnose(o=org()){
  const out=[];
  o.depts.forEach(d=>{
    const mem=o.people.filter(p=>p.deptId===d.id&&isActive(p));const heads=mem.filter(p=>p.isHead);const kids=children(d.id,o).length;
    const sub=mem.length-heads.length+kids;
    if(heads.length&&sub>SPAN_LIMIT)out.push({lv:'warn',t:`${d.name}：部門長1名に対して直属${sub}名`,s:'マネジメント負荷が高い可能性があります。チーム分割や係長・主任の配置を検討できます。'});
    if(!heads.length&&mem.length)out.push({lv:'warn',t:`${d.name}：部門長が未設定`,s:'結果責任を持つ人が組織図上で決まっていません。'});
    if(mem.length===1&&!kids)out.push({lv:'warn',t:`${d.name}：1名体制`,s:'キーパーソン依存度が高く、休職・退職時に機能が止まるリスクがあります。'});
    if(!mem.length&&!kids)out.push({lv:'info',t:`${d.name}：在籍者なし`,s:'採用予定枠や兼務での手当てが必要か確認してください。'});
    const hire=o.people.filter(p=>p.deptId===d.id&&p.status==='採用予定').length;
    if(hire)out.push({lv:'info',t:`${d.name}：採用予定枠 ${hire}名`,s:'採用計画と入社時期の確認対象です。'});
  });
  const un=o.people.filter(p=>!p.deptId||!deptById(p.deptId,o)).length;
  if(un)out.push({lv:'warn',t:`未配置 ${un}名`,s:'所属部署が決まっていない社員がいます。'});
  const s=stats(o);
  if(s.head&&s.mgr/s.head<0.1)out.push({lv:'info',t:`管理職比率 ${Math.round(s.mgr/s.head*100)}%`,s:'今後の人数増に対して、課長以上の育成・登用計画が必要になる水準です。'});
  return out;
}

  V.aiText='AIが診断しています…';renderPane();
  try{V.aiText=await callAI(prompt,system)}catch(e){V.aiText='AIの診断ができませんでした（'+e.message+'）。少し時間をおいて、もう一度「AIに改善案を出してもらう」を押してください。続く場合はログインし直してください。'}
  renderPane();

/* AIの応答から本文だけを取り出す（thinkingブロックや空のtextは除外。データのまま表示しない） */
function aiText(j){
  if(!j)return '';
  if(typeof j==='string')return j.trim();
  if(typeof j.text==='string'&&j.text.trim())return j.text.trim();
  const blocks=Array.isArray(j.content)?j.content:Array.isArray(j.data?.content)?j.data.content:[];
  const t=blocks.filter(c=>c&&c.type==='text'&&c.text).map(c=>c.text).join('\n').trim();
  if(t)return t;
  for(const k of ['result','output','answer','message'])if(typeof j[k]==='string'&&j[k].trim())return j[k].trim();
  return '';
}
async function callAI(prompt,system){
  const tries=[8000,16000];let last='';
  for(const max of tries){
    let j;
    if(sb&&mode==='live'){
      const {data:{session}}=await sb.auth.getSession();
      const r=await fetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+(session?.access_token||SB_KEY)},body:JSON.stringify({prompt,system,max_tokens:max})});
      if(!r.ok)throw new Error('HTTP '+r.status);
      j=await r.json();
    }else{
      const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,system,messages:[{role:'user',content:prompt}]})});
      j=await r.json();
    }
    if(j&&j.error)throw new Error(j.error.message||String(j.error));
    const t=aiText(j);if(t)return t;
    last=j?.stop_reason||j?.data?.stop_reason||'';
    if(!(sb&&mode==='live'))break;
  }
  throw new Error(last==='max_tokens'?'回答が長くなりすぎて途中で止まりました':'AIから回答が返ってきませんでした');
}


/* ========== ミルメ比較（社長・副社長のみ） ==========
   ・閲覧できるのは MILME_VIEWERS の氏名（スペース無視）または MILME_EMAILS のメールのログイン者だけ
   ・読み込んだExcelのデータはこの端末の localStorage にだけ保存し、Supabase（共有データ）には入れない */
const MILME_VIEWERS=['丸林信宏','丸林綾子'];
const MILME_EMAILS=[];
const MILME_KEY='ecod_milme_v1';
const nkey=t=>String(t||'').replace(/[\s\u3000]/g,'');
const canMilme=()=>MS.on?MS.canSens:(mode==='preview'||MILME_VIEWERS.includes(nkey(me.name))||MILME_EMAILS.includes(String(me.email||'').toLowerCase()));
const MV={only:false,auto:true,th:25};
function milmeData(){if(!canMilme())return null;try{return JSON.parse(localStorage.getItem(MILME_KEY)||'null')}catch(e){return null}}
function milmeMap(){const d=milmeData();const m=new Map();(d?.rows||[]).forEach(r=>m.set(nkey(r.name),r));return m}
async function loadXLSX(){
  if(window.XLSX)return;
  await new Promise((ok,ng)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=ok;sc.onerror=()=>ng(new Error('読込ライブラリを取得できませんでした'));document.head.appendChild(sc)});
}
async function importMilme(file){
  if(!canMilme())return;
  try{
    await loadXLSX();
    const buf=await file.arrayBuffer();let wb;
    if(/\.csv$/i.test(file.name)){let t=new TextDecoder('utf-8').decode(buf);if(t.includes('\ufffd'))t=new TextDecoder('shift_jis').decode(buf);wb=XLSX.read(t,{type:'string'})}
    else wb=XLSX.read(buf,{type:'array'});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
    const hi=rows.findIndex(r=>r.some(c=>/受検者名|氏名/.test(String(c))));
    if(hi<0)throw new Error('「受検者名」の列が見つかりません');
    const H=rows[hi].map(h=>String(h).trim());const col=re=>H.findIndex(h=>re.test(h));
    const ci={name:col(/受検者名|氏名/),kind:col(/^区分$/),basic:col(/【基礎】点数/),fail:col(/【応用】失敗平均/),fp:col(/【応用】FP率平均/)};
    const procCols=H.map((h,i)=>{const m=h.match(/【応用(\d)】処理数/);return m?{i,n:m[1]}:null}).filter(Boolean);
    const miss=[!(ci.basic>=0)&&'【基礎】点数',!procCols.length&&'【応用1〜3】処理数',!(ci.fail>=0)&&'【応用】失敗平均',!(ci.fp>=0)&&'【応用】FP率平均'].filter(Boolean);
    if(miss.length)throw new Error('列が見つかりません：'+miss.join('、'));
    const num=v=>{const x=parseFloat(String(v).replace(/,/g,''));return isFinite(x)?x:null};
    const out=rows.slice(hi+1).filter(r=>String(r[ci.name]||'').trim()).map(r=>{
      let best=null,which='';procCols.forEach(c=>{const v=num(r[c.i]);if(v!=null&&(best==null||v>best)){best=v;which='応用'+c.n}});
      return {name:String(r[ci.name]).trim(),kind:ci.kind>=0?String(r[ci.kind]).trim():'',basic:num(r[ci.basic]),procMax:best,procWhich:which,fail:num(r[ci.fail]),fp:num(r[ci.fp])}});
    if(!out.length)throw new Error('受検者のデータがありません');
    localStorage.setItem(MILME_KEY,JSON.stringify({file:file.name,at:new Date().toISOString(),rows:out}));
    const m=new Set(D.official.people.map(p=>nkey(p.name)));
    toast(`${out.length}名を読み込みました（組織図と一致 ${out.filter(r=>m.has(nkey(r.name))).length}名）`);
  }catch(e){toast('読み込めませんでした：'+e.message)}
  render();
}
function milmePairs(){
  const mm=milmeMap(),o=D.official;const pairs=[];
  o.people.filter(p=>p.status!=='採用予定'&&p.status!=='退職').forEach(p=>{
    let b=bossOf(p,o),rel='直属上司';

    pairs.push({p,b,rel,ms,mb,gap,bad:gap!=null&&Math.abs(gap)>MV.th});

  return pairs;

function findBoss(p){
  const o=org();let d=deptById(p.deptId);
  if(!d)return null;
  if(!p.isHead){const h=o.people.find(x=>x.deptId===d.id&&x.isHead&&x.id!==p.id);if(h)return h}
  let pd=deptById(d.parentId);
  while(pd){const h=o.people.find(x=>x.deptId===pd.id&&x.isHead);if(h)return h;pd=deptById(pd.parentId)}
  return null;
}

function subTree(id,o=org()){const out=new Set(),st=[id];while(st.length){const c=st.pop();o.people.forEach(x=>{if(x.bossId===c&&!out.has(x.id)){out.add(x.id);st.push(x.id)}})}return out}

function applyMove(pid,to,date,reason,o=D.official,opt={}){
  const p=o.people.find(x=>x.id===pid);if(!p)return;
  const from=p.deptId;const fromN=deptName(from,o),toN=deptName(to,o);
  p.deptId=to||null;p.isHead=false;
  const by=opt.by||me.name||me.email;
  const bc=bossChanges(opt)?setBoss(p,opt.bossTo,'異動に伴う変更',{o,date,by}):'';
  D.pending=D.pending.filter(x=>x.personId!==pid);
  D.history.push({id:uid('h'),personId:pid,name:p.name,from:fromN,to:toN,boss:bc,date,reason:reason||'',kind:opt.kind||'反映',by,at:new Date().toISOString()});
  if(!opt.noCare&&p.status!=='採用予定')D.care.push({id:uid('c'),personId:pid,name:p.name,from:fromN,to:toN,boss:bossOf(p,o)?.name||'',date,items:CARE_TPL.map(([label,off])=>({label,due:addDays(date,off),done:false}))});
}
/* 承認：異動日が今日以前→即時反映／未来日→承認済みとして保持し異動日に自動反映。履歴・CAREは承認時点で記録 */
function approvePending(x){
  if(!x||x.status==='approved')return null;
  const o=D.official;const p=o.people.find(y=>y.id===x.personId);
  if(!p){D.pending=D.pending.filter(y=>y.id!==x.id);return null}
  const by=me.name||me.email;
  if(x.date<=today()){applyMove(x.personId,x.to,x.date,x.reason,o,{kind:'承認・反映',by,bossTo:x.bossTo});return 'now'}
  const fromN=deptName(p.deptId,o),toN=deptName(x.to,o);
  const curB=bossOf(p,o)?.name||'未設定',nxB=bossChanges(x)?(x.bossTo?(o.people.find(y=>y.id===x.bossTo)?.name||'未設定'):'未設定'):curB;
  x.status='approved';x.approvedBy=by;x.approvedAt=new Date().toISOString();x.from=p.deptId||null;
  D.history.push({id:uid('h'),personId:p.id,name:p.name,from:fromN,to:toN,boss:curB!==nxB?`${curB} → ${nxB}`:'',date:x.date,reason:x.reason||'',kind:'承認',by,at:x.approvedAt});
  if(p.status!=='採用予定'){D.care=D.care.filter(c=>c.pendingId!==x.id);
    D.care.push({id:uid('c'),pendingId:x.id,personId:p.id,name:p.name,from:fromN,to:toN,boss:nxB==='未設定'?'':nxB,date:x.date,items:CARE_TPL.map(([label,off])=>({label,due:addDays(x.date,off),done:false}))})}
  return 'later';
}
/* 異動日を迎えた承認済みの異動を組織図へ反映（CAREは承認時に作成済み） */
function applyDueMoves(){
  const t=today();const due=D.pending.filter(x=>x.status==='approved'&&x.date<=t);
  due.forEach(x=>{if(!D.official.people.find(y=>y.id===x.personId)){D.pending=D.pending.filter(y=>y.id!==x.id);return}
    applyMove(x.personId,x.to,x.date,x.reason,D.official,{kind:'反映',by:'自動反映（承認：'+(x.approvedBy||'')+'）',noCare:true,bossTo:x.bossTo})});
  return due.length;
}
function runDue(){if(!D)return;
  if(MS.on){(async()=>{try{const n=await BK().applyDue();await masterReload();const c=syncOfficialFromMaster();if(n||c){if(canEdit())dirty();render();if(n)toast(`異動日を迎えた${n}件を正式組織に反映しました`)}}catch(e){console.warn(e)}})();return}
  const n=applyDueMoves();if(n){if(canEdit())dirty();render();toast(`異動日を迎えた${n}件を組織図に反映しました`)}}

/* ========== ドラッグ＆ドロップ（マウス／タッチ長押し） ========== */
let drag=null;
document.addEventListener('pointerdown',e=>{
  const c=e.target.closest('.card');if(!c||e.button>0)return;if(e.target.closest('.kbtn'))return;
  drag={pid:c.dataset.pid,el:c,x:e.clientX,y:e.clientY,type:e.pointerType,on:false,moved:false,timer:null};
  if(canEdit()&&e.pointerType!=='mouse')drag.timer=setTimeout(()=>startDrag(e.clientX,e.clientY),420);
});
document.addEventListener('pointermove',e=>{
  if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y,dist=Math.hypot(dx,dy);
  if(!drag.on){
    if(dist>8){drag.moved=true;clearTimeout(drag.timer);
      if(drag.type==='mouse'){ if(canEdit())startDrag(e.clientX,e.clientY); else {warnReadOnly();drag=null} }
      else if(drag.type!=='mouse'){ if(!canEdit())warnReadOnly(); drag=null } }
    return;
  }
  moveGhost(e.clientX,e.clientY);
});
document.addEventListener('pointerup',e=>{
  if(!drag)return;clearTimeout(drag.timer);const d=drag;drag=null;
  if(d.on){endDrag(e.clientX,e.clientY,d);return}
  if(!d.moved){V.sel=d.pid;renderDrawer()}
});
document.addEventListener('pointercancel',()=>{if(drag&&!drag.on){clearTimeout(drag.timer);drag=null}});
document.addEventListener('touchmove',e=>{if(drag&&drag.on)e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',e=>{if(e.target.closest('.card'))e.preventDefault()});
function startDrag(x,y){
  if(!drag)return;drag.on=true;drag.moved=true;
  const g=drag.el.cloneNode(true);g.classList.add('ghost');g.classList.remove('dim','hit');document.body.appendChild(g);drag.ghost=g;
  drag.el.classList.add('lifted');if(navigator.vibrate)navigator.vibrate(15);moveGhost(x,y);
}
function moveGhost(x,y){
  drag.ghost.style.left=(x-95)+'px';drag.ghost.style.top=(y-20)+'px';
  document.querySelectorAll('.over').forEach(n=>n.classList.remove('over'));
  const t=document.elementFromPoint(x,y)?.closest('[data-drop]');if(t)t.classList.add('over');drag.target=t?.dataset.drop;
  const pane=$('#pane'),r=pane.getBoundingClientRect(),m=50;
  if(x>r.right-m)pane.scrollLeft+=14;else if(x<r.left+m&&x>r.left)pane.scrollLeft-=14;
  if(y>r.bottom-m)pane.scrollTop+=14;else if(y<r.top+m&&y>r.top)pane.scrollTop-=14;
}
function endDrag(x,y,d){
  d.ghost?.remove();d.el.classList.remove('lifted');
  document.querySelectorAll('.over').forEach(n=>n.classList.remove('over'));
  const t=document.elementFromPoint(x,y)?.closest('[data-drop]');
  if(t)requestMove(d.pid,t.dataset.drop==='__none'?null:t.dataset.drop);
}
document.addEventListener('keydown',e=>{
  const c=e.target.closest?.('.card');
  if(c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();V.sel=c.dataset.pid;renderDrawer()}
  if(e.key==='Escape'&&V.sel&&$('#modal').hidden)closeDrawer();
});

async function importTable(){
  const r=await modal({title:'社員データを取込',body:`<div class="note">スプレッドシート・Excelの表を、見出し行ごとコピーして貼り付けてください。<br>使う列：部署（所属）・氏名・役職・役割・上位部署・上司（直属上司）・入社・勤務地。役割定義シートのように1人が複数行ある表でも、氏名ごとに1人にまとめます。役割に「部門長」を含む人は部門長になります。</div>
    <textarea name="txt" placeholder="部署&#9;役職&#9;氏名&#9;役割"></textarea>
    <label>取込み方<select name="how"><option value="replace">今の組織を置き換える</option><option value="add">今の組織に追加する</option></select></label>
    <div class="note">取込先：${isOfficial()?'正式組織':'シナリオ「'+esc(org().name)+'」'}</div>`,
    actions:[{label:'やめる',key:null},{label:'取り込む',key:'ok',kind:'pri'}]});
  if(!r.key||!r.form.txt.trim())return;
  const rows=r.form.txt.trim().split(/\r?\n/).map(l=>{const sep=l.includes('\t')?'\t':',';return l.split(sep).map(s=>s.trim().replace(/^"|"$/g,''))});
  const H=rows.shift();const col=re=>H.findIndex(h=>re.test(h));
  const ci={dept:col(/部署|所属|部門/),name:col(/氏名|名前|社員名/),title:col(/役職/),role:col(/^役割$|役割名/),parent:col(/上位|親部署/),boss:col(/上司/),joined:col(/入社/),loc:col(/勤務地|拠点/)};
  if(ci.name<0){toast('「氏名」の列が見つかりません。見出し行も一緒に貼り付けてください');return}
  const o=org();
  if(r.form.how==='replace'){o.depts=[{id:'top',name:'代表取締役',parentId:null,hue:0}];o.people=[];D.pending=isOfficial()?[]:D.pending}
  const byName=new Map(o.depts.map(d=>[d.name,d]));const seen=new Map(o.people.map(p=>[p.name,p]));
  const getDept=(name,parent)=>{if(!name)return null;if(byName.has(name))return byName.get(name).id;
    let pid='top';if(parent){pid=getDept(parent,null)}if(!deptById(pid,o))pid=roots(o)[0]?.id||null;
    const d={id:uid('d'),name,parentId:pid,hue:o.depts.length};o.depts.push(d);byName.set(name,d);return d.id};
  let lastDept='',added=0;const bossNm=new Map();

    const dn=g(ci.dept)||lastDept;lastDept=dn;const nm=g(ci.name);if(!nm)return;
    const role=g(ci.role);
    if(seen.has(nm)){const p=seen.get(nm);if(/部門長/.test(role))p.isHead=true;return}
    const t=TITLES.find(x=>g(ci.title).includes(x))||(g(ci.title).includes('リーダー')?'係長':'一般');
    const p=newPerson({name:nm,deptId:dn==='代表取締役'?'top':getDept(dn,g(ci.parent)),title:t,isHead:/部門長/.test(role),roleName:role&&!/部門長/.test(role)&&role.length<20?role:'',joined:g(ci.joined),location:g(ci.loc)||'越谷本社'});
    o.people.push(p);seen.set(nm,p);added++;if(g(ci.boss))bossNm.set(p,g(ci.boss));
  });
  bossNm.forEach((bn,p)=>{const b=seen.get(bn)||o.people.find(x=>x.name.replace(/\s/g,'')===bn.replace(/\s/g,''));if(b&&b.id!==p.id)setBoss(p,b.id,'取込')});

}

    const nm=id=>id?(sc.people.find(x=>x.id===id)?.name||'（削除済み）'):'未設定';
    (D.bossHistory=D.bossHistory||[]).push({id:uid('b'),personId:p.id,name:p.name,from:nm(op.bossId),to:nm(p.bossId),date,reason:'シナリオ「'+sc.name+'」を採用',by:me.name||me.email,at:new Date().toISOString()})});
  D.official={depts:nextDepts,people:nextPeople};D.pending=[];V.scn='official';
  dirty();render();toast('正式組織に反映しました');
}

/* ========== 共通UI ========== */
function modal({title,body,actions}){
  return new Promise(res=>{
    const m=$('#modal');const prev=document.activeElement;
    m.innerHTML=`<div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt">${title}</h3><div class="mbody">${body}</div>
      <div class="mact">${actions.map((a,i)=>`<button class="btn ${a.kind||''}" data-i="${i}">${a.label}</button>`).join('')}</div></div>`;
    m.hidden=false;(m.querySelector('input,select,textarea')||m.querySelector('.mact .pri')||m.querySelector('button')).focus();
    const done=v=>{m.hidden=true;m.onclick=m.onkeydown=null;prev?.focus?.();res(v)};
    m.onclick=e=>{const b=e.target.closest('[data-i]');
      if(b){const a=actions[+b.dataset.i];if(a.key&&a.validate&&!a.validate(m)){m.querySelector('input')?.focus();return}
        const form={};m.querySelectorAll('[name]').forEach(el=>{if(el.type==='radio'){if(el.checked)form[el.name]=el.value;return}form[el.name]=el.type==='checkbox'?el.checked:el.value});done({key:a.key,form})}
      else if(e.target===m)done({key:null})};
    m.onkeydown=e=>{if(e.key==='Escape')done({key:null});if(e.key==='Enter'&&e.target.tagName==='INPUT'){m.querySelector('.mact .pri')?.click()}};
  });
}
let toastT;function toast(t){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.appendChild(d);clearTimeout(toastT);toastT=setTimeout(()=>d.remove(),2600)}
function flashDept(id){V.tab='chart';renderPane();requestAnimationFrame(()=>{const n=$('#dept-'+id);if(!n)return;n.scrollIntoView({behavior:'smooth',block:'center',inline:'center'});n.classList.remove('flash');void n.offsetWidth;n.classList.add('flash')})}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

/* ========== 更新履歴（開いたときに新版だけ案内） ========== */
function seenVersion(){try{return localStorage.getItem(SEEN_KEY)||''}catch(e){return ''}}
function markSeen(){try{localStorage.setItem(SEEN_KEY,APP_VERSION)}catch(e){}}
function changelogHTML(list){
  return list.map(([v,d,items])=>`<div class="cl">
    <div class="clv"><b>${esc(v)}</b><span>${esc(d)}</span></div>
    <ul>${items.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`).join('');
}
async function showWhatsNew(onlyNew){
  const seen=seenVersion();
  const list=onlyNew?CHANGELOG.slice(0,Math.max(1,CHANGELOG.findIndex(c=>c[0]===seen))):CHANGELOG;
  if(onlyNew&&seen===APP_VERSION)return;
  const r=await modal({
    title:onlyNew?'アプリが新しくなりました':'更新履歴',
    body:`<div class="clwrap">${changelogHTML(list)}</div>
      <div class="note">現在のバージョン ${esc(APP_VERSION)}${onlyNew?'　／　ヘッダーの【更新履歴】からいつでも見られます':''}</div>`,
    actions:[{label:'マニュアルを見る',key:'man'},{label:onlyNew?'確認しました':'閉じる',key:'ok',kind:'pri'}]});
  markSeen();
  if(r.key==='man')openManual('news');
}
$('#whatsNew').onclick=()=>showWhatsNew(false);

  <div class="warn">「正式組織にする」と、今の正式組織は上書きされ、所属が変わる人全員の異動履歴・異動CAREが作られます。承認待ちの異動予定はクリアされます。実行前にバックアップを取っておくと安心です。</div>`},
 {id:'diag',grp:'計画',title:'組織診断・AI組織診断',since:'ver.2026.09.29a',body:()=>`
  <p>「組織診断」タブでは、次のような論点をルールで自動チェックします。</p>
  <ul><li>直属部下数が基準（全社 ${spanDefault()}名・部署ごとに変更可）を超える上司（管理負荷）。部署の人数ではなく、直属上司として設定された部下の数で数えます</li><li>部門長が未設定の部署</li><li>1名体制の部署（キーパーソン依存）</li><li>在籍者のいない部署、採用予定枠のある部署</li><li>未配置の社員、管理職比率が低い状態</li></ul>
  <p>ヘッダーの <kbd>AI組織診断</kbd> を押すと、識学の考え方（責任と権限の明確化、部門長の結果責任）をもとに、全体所見・優先論点・組織案をAIが文章で出します。シナリオ表示中ならそのシナリオを診断します。</p>
  <p class="note">AIは組織構造を診断するもので、個人の評価・昇格の判断はしません。</p>`},
 {id:'milme',grp:'計画',title:'ミルメ比較（社長・副社長のみ）',since:'ver.2026.10.01e',show:()=>canMilme(),body:()=>`
  <p>このページは社長・副社長のログイン時だけ表示されます。他の社員のマニュアルには載りません。</p>
  <ol><li>「ミルメ比較 🔒」タブを開く</li><li>【Excelを読み込む】で、ミルメの従業員データ（xlsx／csv）を選ぶ</li><li>受検者名と組織図の氏名を突き合わせて、自動で表示</li></ol>
  <h3>表示する数字</h3><ul><li>【基礎】点数</li><li>【応用】処理数の最高値（応用1〜3のうち一番高い回。どの回かも表示）</li><li>【応用】失敗平均</li><li>【応用】FP率平均</li></ul>
  <h3>上司と部下の比較</h3><p>上司の処理数（最高値）から部下の処理数（最高値）を引いた差を出します。<b>差の絶対値が基準を「超える」組み合わせ</b>（基準25なら26以上。25ちょうどは対象外）を<b>「関わり方の確認対象」</b>として表示します。相性の良し悪しを示すものではありません。直属上司が未設定の人は、チェックを入れると部署上の上位者と比べます。</p>
  <p>社員マスタ導入後は、閲覧できる人をサーバー側で制限し（ec_sensitive_viewers）、受検日・検査条件・出典・確認者つきで共通保存します。検査条件が違う結果同士は比較せず、未受検・未確認は0点として扱いません。基準は管理者が出典つきで変更できます。</p>
  <div class="warn">社員マスタ導入前の環境では、読み込んだデータはその端末の中だけに保存されます。導入後は【確認して共通保存に移す】で受検日と検査条件を確認して移せます。</div>
  <p>社員の詳細画面にも、ミルメの数字と直属上司との差が表示されます（社長・副社長のログイン時のみ）。</p>`},
 {id:'import',grp:'データ',title:'スプレッドシートから取り込む',since:'ver.2026.10.01b',body:()=>`
  <ol><li>役割定義シートなどの表を、<b>見出し行ごと</b>コピー</li><li>ヘッダーの <kbd>取込</kbd> に貼り付け</li><li>「今の組織を置き換える」か「今の組織に追加する」を選んで【取り込む】</li></ol>
  <p>使える列：部署（所属）・氏名・役職・役割・上位部署・<b>上司（直属上司）</b>・入社・勤務地。1人が複数行ある表でも氏名でまとめます。役割に「部門長」を含む人は部門長になります。上司列は氏名で突き合わせて自動設定します。</p>`},
 {id:'save',grp:'データ',title:'保存・PDF・バックアップ',since:'ver.2026.10.18a',body:()=>`
  <ul><li><b>保存</b>：変更すると約1.5秒後に自動保存されます。フッターに「保存済み 時刻」が出ていれば完了です。</li>
   <li><b>同時に編集したとき</b>：ほかの人が先に保存していた場合、重ならない変更は自動で統合します。同じ項目を両方が変えていた場合は、どちらを残すか選ぶ画面が出ます（黙って上書きしません）。</li>
   <li><b>保存に失敗したとき</b>：「保存済み」とは表示されず、フッターに赤字で理由と【保存を再試行】が出ます。入力内容は画面と端末内に保持され、次に開いたときにも復元を案内します。</li>
   <li><b>PDF出力</b>：組織図を印刷用に整えて出力します。部門長会議や社内掲示に。</li>
   <li><b>バックアップ</b>：正式組織・シナリオ・異動予定・履歴・上司変更履歴・CAREをまとめてJSONファイルに書き出し／読み込みできます。大きな組織改編の前に書き出しておきましょう。</li></ul>`},
 {id:'use',grp:'活用',title:'活用シーン別の使い方',since:'ver.2026.10.01b',body:()=>`
  <h3>期首・四半期の組織改編</h3>
  <ol><li>シナリオで新体制案をつくる → AI組織診断で論点チェック</li><li>幹部会議で画面を見せながら決める（PDF出力も可）</li><li>決定したら「正式組織にする」→ 異動CAREで定着フォロー</li></ol>
  <h3>月次の異動運用</h3>
  <ol><li>マネージャーがドラッグで「異動予定に登録」（異動日・新しい上司を入れる）</li><li>管理者が異動予定タブで内容を確認して【承認】</li><li>異動日に自動反映 → 異動CAREの面談・1on1を期日どおりに実施</li></ol>
  <h3>採用計画</h3>
  <p>部署に採用予定枠を置き、シナリオの目標人数と比べて「あと何人必要か」を確認。内定者は在籍状況「内定」で管理します。</p>
  <h3>1on1・評価の準備</h3>
  <p>上司ごとの部下一覧は、上司の詳細画面の「直属の部下」で確認できます。部下がいない上司・上司未設定の人がいないかを定期的に見直しましょう。</p>`},
 {id:'faq',grp:'活用',title:'よくある質問',since:'ver.2026.10.01d',body:()=>`
  <h3>カードを動かしても何も起きない</h3><p>閲覧系の権限では配置を変更できません（画面下にメッセージが出ます）。「あなたの権限でできること」を確認してください。</p>
  <h3>承認ボタンが押せない</h3><p>承認は管理者・マネージャー権限が必要です。それ以外の権限ではグレー表示になります。</p>
  <h3>未来日の異動がまだ反映されない</h3><p>反映は異動日の0時以降、アプリを開いたとき（開いている間は10分ごと）に行われます。異動予定タブで「承認済み」になっているか確認してください。「承認待ち」のままでは反映されません。</p>
  <h3>上司の候補に出てこない人がいる</h3><p>自分自身、自分の部下（孫部下を含む）、採用予定枠、退職者は候補に出ません。</p>
  <h3>AI組織診断の結果が出ない</h3><p>AIの混雑などで回答が返らないことがあります。少し時間をおいて、もう一度押してください。アプリ側で1回は自動でやり直します。続く場合はログインし直してください。</p>
  <h3>「プレビュー表示（保存されません）」と出る</h3><p>公開URLから会社のGoogleアカウントでログインして開いてください。</p>`},
 {id:'todo',grp:'はじめに',title:'要対応一覧（社長・管理者向け）',since:'ver.2026.10.18a',body:()=>`
  <p>管理者で開くと最初に表示されます。いま判断や手当てが必要な項目を、次の7つに分けて並べます。</p>
  <table><tbody><tr><th>承認待ちの異動</th><td>申請されて承認されていない異動</td></tr><tr><th>責任者不在の部署</th><td>部門長が不在、直属上司が未設定の人がいる部署</td></tr>
   <tr><th>管理負荷の確認対象</th><td>直属部下数が基準を超える上司</td></tr><tr><th>採用・育成で補う役割</th><td>未来組織計画の未充足、採用予定枠</td></tr>
   <tr><th>期限を過ぎた異動後レビュー</th><td>7日・30日・90日の確認が期日を過ぎて未記録</td></tr><tr><th>未実施の上司の支援行動</th><td>人材カルテに登録された上司の行動で、期限を過ぎて実施中・未着手のもの</td></tr>
   <tr><th>配置検討に必要な情報の不足</th><td>社員番号・直属上司・職務（結果責任）・メール・人材カルテ連携の未登録</td></tr></tbody></table>
  <ol><li>項目名を押すと、該当の画面（異動予定・組織図の部署・社員の詳細・人材カルテなど）へ移動します</li>
   <li>【変更】で担当者・期限・次の行動を決めます（全員で共有）。対応済みにしても、元の状態が解消されるまでは「対応済みも表示」で確認できます</li></ol>`},
 {id:'master',grp:'基本操作',title:'社員マスタ（人材カルテとの共通化）',since:'ver.2026.10.18a',body:()=>`
  <p>社員番号・氏名・所属部署・役職・直属上司・在籍状況・適用開始日は、人材カルテと共通の<b>社員マスタ</b>で管理します。二重に管理しないため、どちらのアプリでも同じ値が表示されます。</p>
  <h3>はじめに（移行時の1回だけ）</h3>
  <ol><li>「社員マスタ」タブを開く</li><li>① 組織図の社員ごとに社員番号を入れる（人材カルテに同じ氏名の人がいれば候補が出ますが、<b>氏名だけでは自動で紐付けません</b>。確認して【この番号を入力】）</li>
   <li>【連携】または【まとめて連携】。社員マスタの氏名と違う場合は「確認して連携」になり、同じ人かを確認します</li>
   <li>② 人材カルテの社員を、社員番号が1対1で一致するものだけ連携。同姓同名や番号違いは確認一覧に残ります</li>
   <li>③ メール未登録の人のメールを入れる／組織図の直属上司を社員マスタへ初期登録（管理者）</li></ol>
  <h3>その後の更新元</h3>
  <table><tbody><tr><th>所属部署・直属上司</th><td>異動申請 → 承認 → 適用日に反映（訂正は管理者のみ直接可）</td></tr><tr><th>氏名・役職・在籍</th><td>社員の詳細で編集（社員マスタを直接更新）</td></tr>
   <tr><th>役割名・タグ・スキル等</th><td>この組織設計アプリの中だけの情報</td></tr><tr><th>本人の希望・成果・面談</th><td>人材カルテ</td></tr></tbody></table>
  <div class="warn">社員マスタに登録済みの社員は削除できません（履歴を守るため）。退職は在籍状況を「退職」にしてください。</div>`},
 {id:'karte',grp:'基本操作',title:'組織図から人材カルテを開く',since:'ver.2026.10.18a',body:()=>`
  <p>社員カードの <kbd>カルテ</kbd>、または社員の詳細画面の【人材カルテを開く】で、その社員の人材カルテが新しいタブで開きます（共通社員IDで開くので、同姓同名でも取り違えません）。</p>
  <p>詳細画面には、まず<b>「何を任せ、どう支援するか」</b>が分かる要約を出します：現在の役割と結果責任／直近の成果／本人が希望する役割／強みが発揮される条件／現在の育成テーマ／上司が試している関わり方／次回の面談日。診断の数値や根拠は、人材カルテの「詳細：資料と診断」で必要なときに確認します。</p>
  <p class="note">表示されるのは、あなたの閲覧権限の範囲内の情報だけです（人事・経営層、または直属上司・本人）。権限がない場合はその旨が表示されます。</p>`},
 {id:'transfer2',grp:'異動',title:'異動申請に書くこと（目的と検証）',since:'ver.2026.10.18a',body:()=>`
  <p>社員マスタ導入後の異動は、カードをドラッグ（スマホは長押し）すると申請画面が開きます。配置して終わりにせず、<b>なぜ動かし、何を期待し、どう確かめるか</b>を残します。</p>
  <table><tbody>${PLAN_FIELDS.map(([k,l,r])=>`<tr><th>${l}</th><td>${r?'必須':'任意'}</td></tr>`).join('')}<tr><th>確認担当者</th><td>必須。7日・30日・90日の確認を行う人</td></tr></tbody></table>
  <ul><li>【申請する】承認待ちになります。正式組織はまだ動きません</li><li>【申請して承認】承認権限がある人のみ。異動日が今日以前なら即時、未来日なら異動日にサーバーが自動で反映します（アプリを開いていなくても反映）</li>
   <li>直属上司だけを変える場合も、詳細画面の「直属上司」を選ぶと同じ申請画面になります</li><li>シナリオ（未来組織）での移動は、正式組織に反映されません</li></ul>`},
 {id:'care2',grp:'異動',title:'異動後の検証（7日・30日・90日）',since:'ver.2026.10.18a',body:()=>`
  <table><thead><tr><th>時期</th><th>確認すること</th></tr></thead><tbody><tr><td>7日後</td><td>役割の理解（本人の発言）・引継ぎの状況（事実）・困りごと（本人の発言）</td></tr>
   <tr><td>30日後</td><td>成果指標の結果（事実・数値）・本人の手応え（本人の発言）・上司の支援状況（事実）</td></tr>
   <tr><td>90日後</td><td>成果指標の結果・本人の手応え・判断（継続／役割調整／追加育成／配置再検討）と理由</td></tr></tbody></table>
  <p>どの時期も<b>「何が改善したか」「何が未解決か」</b>を必ず書きます。申請時の30日・90日の目標と異動前の指標が画面に出るので、比べながら記録できます。</p>
  <p>人材カルテの1on1で、期日が近い確認項目があると「異動後の確認」欄が出ます。1on1と一緒に記録すれば、ここにも同時に反映されます（二重入力は不要）。同じ項目を同時に記録した場合は、内容を比べて選べます。</p>`},
 {id:'load',grp:'計画',title:'管理負荷（直属部下数）の見方',since:'ver.2026.10.18a',body:()=>`
  <p>組織診断の「管理負荷」は、部署の人数ではなく<b>直属上司として設定されている部下の数</b>で数えます。基準は全社 ${spanDefault()}名（組織診断の【変更】）で、部署ごとに部署の ⋯ から変えられます。</p>
  <ul><li>新入社員（入社12か月以内・内定）、異動フォロー中の部下、兼務も並べて、育成の負荷が重なっていないかを見ます</li>
   <li>部門長不在・直属上司未設定（責任者未設定）・1名体制（一人依存）・負荷集中を論点として出し、【該当箇所へ】で移動できます</li></ul>`},
 {id:'plan',grp:'計画',title:'未来組織計画（経営目標とつなぐ）',since:'ver.2026.10.18a',body:()=>`
  <ol><li>【＋シナリオ】で、案の種別（現状維持案／社内異動案／採用追加案）、対象期間、責任者、1人あたり想定年間人件費と前提を入れて作る</li>
   <li>「未来組織計画」タブで、部署ごとに目標・想定業務量・必要な役割と人数（1行に「FS 4」のように）を入れる</li>
   <li>現在の人数（正式組織）との差に対して、採用・異動・育成で補う人数を入れる → 未充足が出ます</li>
   <li>上の比較表で、案ごとの必要人数・差・未充足・追加人件費を比べる</li></ol>
  <div class="tip">人件費は「採用人数 × 1人あたり想定年間人件費」の概算で、計算式と前提を画面に表示します。診断結果から売上を予測することはしません。</div>`},
 {id:'news',grp:'更新',title:'最近の更新',since:'',body:()=>`
  <p class="note">このマニュアルはアプリと一体になっていて、アプリが更新されると同時に更新されます。新しく変わった項目には <span class="newtag">NEW</span> が付きます。</p>
  <div class="clwrap">${changelogHTML(CHANGELOG.slice(0,5))}</div>`}
];
const NEW_SET=new Set(CHANGELOG.slice(0,2).map(c=>c[0]));
const isNewSec=m=>m.since&&NEW_SET.has(m.since);
function renderManual(q=''){
  const box=$('#manual');const k=q.trim();
  const secs=MANUAL.filter(m=>!m.show||m.show()).map(m=>({...m,html:m.body()}));
  const strip=h=>h.replace(/<[^>]+>/g,'');
  const hits=k?secs.filter(m=>(m.title+strip(m.html)).includes(k)):secs;
  const hl=h=>k?h.replace(/>([^<]+)</g,(a,t)=>'>'+t.split(k).join(`<mark>${esc(k)}</mark>`)+'<'):h;
  let g='';const toc=hits.map(m=>{const head=m.grp!==g?`<div class="grp">${esc(m.grp)}</div>`:'';g=m.grp;
    return head+`<button data-msec="${m.id}">${esc(m.title)}${isNewSec(m)?' <span class="newtag">NEW</span>':''}</button>`}).join('');
  box.querySelector('.mtoc').innerHTML=toc||'<div class="grp">該当なし</div>';
  box.querySelector('.mcont').innerHTML=`<div class="mver">マニュアル版：${esc(APP_VERSION)}（アプリと同時に自動更新）</div>`+
    (hits.map(m=>`<section id="ms-${m.id}"><h2>${esc(m.title)}${isNewSec(m)?'<span class="newtag">NEW</span>':''}</h2>${hl(m.html)}</section>`).join('')||`<section><p>「${esc(k)}」に当てはまる項目はありません。</p></section>`);
}
function openManual(sec){
  const box=$('#manual');
  box.innerHTML=`<div class="mh"><b>活用マニュアル</b><small>EARTHCOM ORG DESIGN ／ ${esc(APP_VERSION)}</small>
    <input type="search" id="mq" placeholder="キーワードで探す（例：承認、上司）" aria-label="マニュアル内検索">
    <button class="hbtn" id="mPrint">印刷・PDF</button><button class="hbtn" id="mClose">閉じる</button></div>
    <div class="mbodyw"><nav class="mtoc" aria-label="目次"></nav><div class="mcont"></div></div>`;
  box.hidden=false;renderManual();
  $('#mq').oninput=e=>renderManual(e.target.value);
  $('#mClose').onclick=closeManual;
  $('#mPrint').onclick=()=>{document.body.classList.add('printing-manual');setTimeout(()=>{window.print();document.body.classList.remove('printing-manual')},100)};
  box.querySelector('.mtoc').onclick=e=>{const b=e.target.closest('[data-msec]');if(b)$('#ms-'+b.dataset.msec)?.scrollIntoView({behavior:'smooth'})};
  box.onkeydown=e=>{if(e.key==='Escape')closeManual()};

function findBossIn(p,o){const d=o.depts.find(x=>x.id===p.deptId);if(!d)return null;
  if(!p.isHead){const h=o.people.find(x=>x.deptId===d.id&&x.isHead&&x.id!==p.id);if(h)return h}
  let pd=o.depts.find(x=>x.id===d.parentId);while(pd){const h=o.people.find(x=>x.deptId===pd.id&&x.isHead);if(h)return h;pd=o.depts.find(x=>x.id===pd.parentId)}return null}

function syncOfficialFromMaster(){
  if(!MS.on)return 0;let n=0;const o=D.official;
  const t2p=new Map(o.people.filter(p=>p.empId).map(p=>[p.empId,p]));
  o.people.forEach(p=>{

    const set=(k,v)=>{if(v!==undefined&&p[k]!==v){p[k]=v;n++}};
    set('name',e.full_name);set('empNo',e.employee_no||'');
    if(e.position&&TITLES.includes(e.position))set('title',e.position);
    if(STATUS.includes(e.status))set('status',e.status);
    if(e.department_id&&o.depts.some(d=>d.id===e.department_id)){if(p.deptId!==e.department_id){p.deptId=e.department_id;p.isHead=!!(p.headAfterMove&&p.headAfterMove.dept===e.department_id);delete p.headAfterMove;n++}}

    <label>何が未解決か <b style="color:var(--warn)">必須</b>${ta('unresolved',r.unresolved,'なければ「なし」と記入')}</label>
    <div class="note">人材カルテの1on1で記録すると、この項目にも同時に記録されます（二重入力は不要です）。${f.meeting_id?'この記録は1on1記録と紐付いています。':''}</div>`;
  const val=m=>{const need=['improved','unresolved'].concat(f.stage===90?['decision']:[]);const miss=need.filter(k=>!m.querySelector(`[name=${k}]`).value.trim());if(miss.length){toast('「何が改善したか」「何が未解決か」'+(f.stage===90?'「判断」':'')+'を入力してください');return false}return true};
  const res=await modal({title:`異動後の確認（${f.stage}日後）`,body,actions:[{label:'閉じる',key:null},{label:'一時保存',key:'save'},{label:'記録して完了',key:'done',kind:'pri',validate:val}]});
  if(!res.key)return; // 更新できるかはサーバー側（RLS）で判定する
  const rec={...r};['checked_on','improved','unresolved','decision','decision_note',...FU_FIELDS[f.stage].map(x=>x[0])].forEach(k=>{if(res.form[k]!==undefined)rec[k]=String(res.form[k]).trim()});
  rec.recorded_by=me.name||me.email;rec.recorded_at=jstNow();
  const patch={record:rec};if(res.key==='done'){patch.status='done';patch.done_by=me.email;patch.done_at=jstNow()}
  await once('fu-'+id,async()=>{
    try{await BK().updateFollowup(id,patch,f.version);await masterReload();render();toast(res.key==='done'?'記録しました':'一時保存しました')}
    catch(err){
      if(err.conflict){const s=err.server.record||{};
        const c=await modal({title:'ほかの人が先に記録しています',body:`<div class="note">あなたが開いた後に、この確認項目が更新されました。内容を比べて選んでください（あなたの入力は消えていません）。</div>
          <table><thead><tr><th>項目</th><th>先に保存された内容</th><th>あなたの入力</th></tr></thead><tbody>${['improved','unresolved','decision',...FU_FIELDS[f.stage].map(x=>x[0])].filter(k=>(s[k]||'')!==(rec[k]||'')).map(k=>`<tr><td>${esc(k==='improved'?'改善したこと':k==='unresolved'?'未解決のこと':k==='decision'?'判断':(FU_FIELDS[f.stage].find(x=>x[0]===k)||[k,k])[1])}</td><td>${esc(s[k]||'')}</td><td>${esc(rec[k]||'')}</td></tr>`).join('')}</tbody></table>`,
          actions:[{label:'先に保存された内容を残す',key:null},{label:'あなたの入力で上書き',key:'mine',kind:'pri'}]});
        if(c.key==='mine'){try{await BK().updateFollowup(id,patch,err.server.version);toast('記録しました')}catch(e2){toast('保存できませんでした：'+e2.message)}}
        await masterReload();render();
      }else toast('保存できませんでした（入力内容は画面に残っていません。もう一度開いて入力してください）：'+err.message);
    }
  });
}

const MV2={hr:null,hrErr:'',input:{}};
async function loadHrForMaster(){if(MV2.hr!==null)return;const r=await BK().hrPeople();MV2.hr=r||[];MV2.hrErr=r?'':'人材カルテの社員一覧を読む権限がありません（人事・経営層の権限が必要です）'}
function orgLinkRows(){
  const o=D.official;const ppl=o.people.filter(p=>p.status!=='採用予定');
  const nos={};ppl.forEach(p=>{const n=(p.empNo||MV2.input[p.id]||'').trim();if(n)(nos[n]=nos[n]||[]).push(p)});
  const linkedEmp=new Map(ppl.filter(p=>p.empId).map(p=>[p.empId,p]));
  return ppl.map(p=>{
    if(p.empId){const e=empOf(p);return {p,st:e?'linked':'broken',msg:e?'連携済み':'連携先が社員マスタにありません',e}}
    const no=(MV2.input[p.id]||'').trim();
    const sameName=(MV2.hr||[]).filter(h=>nkey(h.full_name)===nkey(p.name)&&(h.employee_no||'').trim());
    const sugg=sameName.length===1?sameName[0].employee_no:'';
    const amb=sameName.length>1;
    if(!no)return {p,st:'nono',msg:'社員番号が未登録',sugg,amb};
    if(nos[no]&&nos[no].length>1)return {p,st:'dup',msg:'社員番号が組織図の中で重複'};
    const e=MS.emps.find(x=>x.employee_no===no);
    if(e&&linkedEmp.has(e.id))return {p,st:'taken',msg:`この社員番号は ${linkedEmp.get(e.id).name} さんに連携済み`};
    if(e&&nkey(e.full_name)!==nkey(p.name))return {p,st:'namediff',msg:`社員マスタの氏名が違います（${e.full_name}）。表記違いか別人か確認してください`,e};
    if(e)return {p,st:'ready',msg:'社員マスタと一致。連携できます',e};
    return {p,st:'new',msg:'社員マスタに新規登録して連携します'};
  });
}
function hrLinkRows(){
  const hr=MV2.hr||[];const cnt={};hr.forEach(h=>{const n=(h.employee_no||'').trim();if(n)cnt[n]=(cnt[n]||0)+1});
  return hr.map(h=>{
    if(h.employee_id){const e=empById(h.employee_id);return {h,st:'linked',msg:e?`連携済み（${e.employee_no||''}）`:'連携先が見つかりません'}}
    const n=(h.employee_no||'').trim();
    if(!n){const nm=MS.emps.filter(e=>nkey(e.full_name)===nkey(h.full_name));return {h,st:'nono',msg:nm.length>1?'社員番号が未登録（同姓同名あり。氏名では紐付けません）':'社員番号が未登録（人材カルテの基本情報で登録してください）'}}
    if(cnt[n]>1)return {h,st:'dup',msg:'人材カルテ内で社員番号が重複'};
    const e=MS.emps.find(x=>x.employee_no===n);
    if(!e)return {h,st:'nomaster',msg:'この社員番号は社員マスタにありません'};
    if(hr.some(x=>x.employee_id===e.id))return {h,st:'taken',msg:'この社員は別の人材カルテと連携済み'};
    if(nkey(e.full_name)!==nkey(h.full_name))return {h,st:'namediff',msg:`社員番号は一致・氏名が違います（マスタ：${e.full_name}）`,e};
    return {h,st:'ready',msg:'社員番号が1対1で一致。連携できます',e};
  });
}

/* =====================================================================
   ミルメ比較（共通保存・権限つき）
   ・絶対差が基準を「超えた」場合だけ確認対象（25点基準なら 25 は対象外、26 は対象）
   ・検査条件が違う結果同士は比較しない／未受検・未確認は0点として扱わない
   ・表示は「関わり方の確認対象」。相性の良し悪しを断定しない
   ===================================================================== */
const milmeTh=()=>{const s=MS.settings.milme_gap_threshold;const v=s?Number(s.value):25;return isFinite(v)&&v>0?v:25};
function milmeJudge(gap,th){if(gap==null||!isFinite(gap))return 'na';return Math.abs(gap)>th?'check':'ok'}
function milmeLatest(eid){return MS.milme.filter(r=>r.employee_id===eid&&r.match_status==='linked'&&r.confirmed_by&&r.metrics&&r.metrics.proc_max!=null).sort((a,b)=>String(b.test_date||'').localeCompare(String(a.test_date||''))||String(b.imported_at||'').localeCompare(String(a.imported_at||'')))[0]||null}
function milmeCompare(sub,boss){
  const a=milmeLatest(sub),b=milmeLatest(boss);
  if(!a||!b)return {state:'na',why:!a&&!b?'双方とも未受検・未確認':!a?'部下が未受検・未確認':'上司が未受検・未確認',ra:a,rb:b};
  if(a.test_version!==b.test_version)return {state:'incomparable',why:`検査条件が違うため比較しません（${a.test_version}／${b.test_version}）`,ra:a,rb:b};
  const gap=Number(b.metrics.proc_max)-Number(a.metrics.proc_max);
  return {state:milmeJudge(gap,milmeTh()),gap,ra:a,rb:b};
}

async function parseMilmeFile(file){
  await loadXLSX();const buf=await file.arrayBuffer();let wb;
  if(/\.csv$/i.test(file.name)){let t=new TextDecoder('utf-8').decode(buf);if(t.includes('\ufffd'))t=new TextDecoder('shift_jis').decode(buf);wb=XLSX.read(t,{type:'string'})}else wb=XLSX.read(buf,{type:'array'});
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
  const hi=rows.findIndex(r=>r.some(c=>/受検者名|氏名/.test(String(c))));if(hi<0)throw new Error('「受検者名」の列が見つかりません');
  const H=rows[hi].map(h=>String(h).trim());const col=re=>H.findIndex(h=>re.test(h));
  const ci={name:col(/受検者名|氏名/),no:col(/社員番号|社員コード|従業員番号|受検者ID|受検者番号/),date:col(/受検日|実施日|受験日/),kind:col(/^区分$/),basic:col(/【基礎】点数/),fail:col(/【応用】失敗平均/),fp:col(/【応用】FP率平均/)};
  const procCols=H.map((h,i)=>{const m=h.match(/【応用(\d)】処理数/);return m?{i,n:m[1]}:null}).filter(Boolean);
  const miss=[!(ci.basic>=0)&&'【基礎】点数',!procCols.length&&'【応用1〜3】処理数',!(ci.fail>=0)&&'【応用】失敗平均',!(ci.fp>=0)&&'【応用】FP率平均'].filter(Boolean);
  if(miss.length)throw new Error('列が見つかりません：'+miss.join('、'));
  const num=v=>{const x=parseFloat(String(v).replace(/,/g,''));return isFinite(x)?x:null};
  const dt=v=>{if(v===''||v==null)return '';if(typeof v==='number'){const d=new Date(Math.round((v-25569)*864e5));return ymd(d)}const m=String(v).match(/(\d{4})[\/\-年.](\d{1,2})[\/\-月.](\d{1,2})/);return m?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:''};
  const labels={basic:H[ci.basic],proc:procCols.map(c=>H[c.i]).join('・'),fail:H[ci.fail],fp:H[ci.fp]};
  return {labels,rows:rows.slice(hi+1).filter(r=>String(r[ci.name]||'').trim()).map(r=>{let best=null,which='';procCols.forEach(c=>{const v=num(r[c.i]);if(v!=null&&(best==null||v>best)){best=v;which='応用'+c.n}});
    return {name:String(r[ci.name]).trim(),no:ci.no>=0?String(r[ci.no]).trim():'',date:ci.date>=0?dt(r[ci.date]):'',kind:ci.kind>=0?String(r[ci.kind]).trim():'',basic:num(r[ci.basic]),procMax:best,procWhich:which,fail:num(r[ci.fail]),fp:num(r[ci.fp])}})};
}

const spanDefault=()=>{const v=+(D.settings&&D.settings.spanDefault);return v>0?v:SPAN_LIMIT};
const spanOf=d=>{const v=+(d&&d.spanLimit);return v>0?v:spanDefault()};
function isNewcomer(p){if(p.status==='内定')return true;if(!p.joined)return false;const [y,m]=p.joined.split('-').map(Number);if(!y)return false;const t=new Date();return (t.getFullYear()-y)*12+(t.getMonth()+1-m)<12}
function loadAnalysis(o=org()){
  const act=o.people.filter(isActive);
  const careOpen=new Set();if(MS.on&&o===D.official){MS.fu.filter(f=>f.status!=='done').forEach(f=>{const p=personByEmp(f.employee_id);if(p)careOpen.add(p.id)})}
  (D.care||[]).filter(c=>c.items.some(i=>!i.done)).forEach(c=>careOpen.add(c.personId));
  const mgrs=act.filter(p=>act.some(x=>x.bossId===p.id)).map(m=>{
    const subs=act.filter(x=>x.bossId===m.id);const d=deptById(m.deptId,o);const lim=spanOf(d);
    const nw=subs.filter(isNewcomer).length,cr=subs.filter(x=>careOpen.has(x.id)).length;
    const heads=o.depts.filter(dd=>o.people.some(x=>x.deptId===dd.id&&x.isHead&&x.id===m.id)).length+(m.concurrent?1:0);
    return {m,subs:subs.length,lim,nw,cr,conc:m.concurrent?deptName(m.concurrent,o):'',heads,load:subs.length+nw+cr,over:subs.length>lim};
  }).sort((a,b)=>b.load-a.load);
  const depts=o.depts.map(d=>{const mem=act.filter(p=>p.deptId===d.id);const head=mem.find(p=>p.isHead);
    const conc=act.filter(p=>p.concurrent===d.id).length;const noBoss=mem.filter(p=>!p.isHead&&!p.bossId).length;
    return {d,n:mem.length,head,direct:head?act.filter(x=>x.bossId===head.id).length:null,lim:spanOf(d),conc,nw:mem.filter(isNewcomer).length,cr:mem.filter(x=>careOpen.has(x.id)).length,noBoss,kids:children(d.id,o).length}});
  return {mgrs,depts};
}

function planOf(sc,did){sc.plans=sc.plans||{};return sc.plans[did]=sc.plans[did]||{goal:'',workload:'',roles:'',hire:0,move:0,develop:0,owner:''}}
const roleNeed=t=>String(t||'').split(/\n/).map(l=>{const m=l.match(/(\d+)\s*(名|人)?\s*$/);return m?+m[1]:0}).reduce((a,b)=>a+b,0);
function scenarioCalc(sc){
  const off=D.official;const rows=sc.depts.map(d=>{const pl=(sc.plans||{})[d.id]||{};const cur=off.people.filter(p=>p.deptId===d.id&&isActive(p)).length;
    const inScn=sc.people.filter(p=>p.deptId===d.id&&isActive(p)).length;const need=roleNeed(pl.roles);
    const gap=need?need-cur:0;const fill=(+pl.hire||0)+(+pl.move||0)+(+pl.develop||0);
    return {d,pl,cur,inScn,need,gap,fill,rest:need?Math.max(0,gap-fill):0}});
  const sum=k=>rows.reduce((a,r)=>a+(+r[k]||0),0);
  const hire=rows.reduce((a,r)=>a+(+r.pl.hire||0),0),move=rows.reduce((a,r)=>a+(+r.pl.move||0),0),dev=rows.reduce((a,r)=>a+(+r.pl.develop||0),0);
  const unit=+sc.unitCost||0;
  return {rows,need:sum('need'),cur:sum('cur'),gap:rows.reduce((a,r)=>a+(r.need?r.gap:0),0),hire,move,dev,rest:sum('rest'),unit,cost:unit?hire*unit:null};
}

const FIELD_JA={name:'氏名',deptId:'所属',title:'役職',isHead:'部門長',roleName:'役割名',status:'在籍状況',bossId:'直属上司',tags:'タグ',skills:'スキル・資格',growth:'育成テーマ',career:'キャリア希望',concurrent:'兼務',joined:'入社年月',location:'勤務地',empType:'雇用区分',parentId:'上位部署',spanLimit:'管理人数の基準',plans:'計画',items:'CARE項目',people:'配置',depts:'部署'};
function merge3(base,mine,theirs){
  const conflicts=[];const out=clone(theirs);
  const get=(o,p)=>p.reduce((a,k)=>a?a[k]:undefined,o);
  const setp=(o,p,v)=>{let x=o;p.slice(0,-1).forEach(k=>{x[k]=x[k]||{};x=x[k]});x[p[p.length-1]]=v};
  ARR_PATHS.forEach(path=>{
    const b=get(base,path)||[],m=get(mine,path)||[],t=get(theirs,path)||[];
    const B=new Map(b.map(x=>[x.id,x])),M=new Map(m.map(x=>[x.id,x])),T=new Map(t.map(x=>[x.id,x]));
    const ids=[...t.map(x=>x.id),...m.map(x=>x.id).filter(id=>!T.has(id))];const res=[];
    ids.forEach(id=>{const bb=B.get(id),mm=M.get(id),tt=T.get(id);
      const label=(mm||tt||bb||{}).name||id;
      if(!bb){res.push(mm&&tt?mergeObj(bb||{},mm,tt,label,conflicts):(mm||tt));return}
      if(!mm&&!tt)return;
      if(!mm){if(eqv(bb,tt))return;conflicts.push({label,field:'（削除）',mine:'削除した',theirs:'他の人が変更',apply:c=>{if(c==='mine'){const i=res.indexOf(tt);if(i>=0)res.splice(i,1)}}});res.push(tt);return}
      if(!tt){if(eqv(bb,mm))return;const obj=mm;conflicts.push({label,field:'（削除）',mine:'変更した',theirs:'他の人が削除',apply:c=>{if(c==='theirs'){const i=res.indexOf(obj);if(i>=0)res.splice(i,1)}}});res.push(mm);return}
      res.push(mergeObj(bb,mm,tt,label,conflicts));
    });
    setp(out,path,res);
  });
  ['settings','todoMeta'].forEach(k=>{const b=base[k]||{},m=mine[k]||{},t=theirs[k]||{};out[k]=mergeObj(b,m,t,k==='settings'?'設定':'要対応の担当',conflicts)});
  out.isSample=mine.isSample&&theirs.isSample;
  return {merged:out,conflicts};
}
function mergeObj(b,m,t,label,conflicts){
  const o={...t};new Set([...Object.keys(m),...Object.keys(t)]).forEach(k=>{
    if(eqv(m[k],t[k])){o[k]=m[k];return}if(eqv(b[k],m[k])){o[k]=t[k];return}if(eqv(b[k],t[k])){o[k]=m[k];return}
    o[k]=m[k];conflicts.push({label,field:FIELD_JA[k]||k,mine:m[k],theirs:t[k],apply:c=>{o[k]=c==='mine'?m[k]:t[k]}});
  });return o;
}
const showVal=v=>v==null||v===''?'（空）':typeof v==='object'?JSON.stringify(v).slice(0,60):String(v);
async function resolveConflict(){
  const srv=await BK().loadState();
  const {merged,conflicts}=merge3(BASE||{},D,srv.data||{});
  if(conflicts.length){
    const r=await modal({title:'ほかの人の変更と重なっています',body:`<div class="note">あなたが開いている間に、ほかの人が同じデータを保存しました。重ならない変更は自動で統合しました。次の${conflicts.length}件はどちらを残すか選んでください。</div>
      <div style="overflow:auto;max-height:50dvh"><table><thead><tr><th>対象</th><th>項目</th><th>あなたの変更</th><th>ほかの人の変更</th></tr></thead><tbody>${conflicts.map((c,i)=>`<tr><td>${esc(c.label)}</td><td>${esc(c.field)}</td>
        <td><label class="chk"><input type="radio" name="c${i}" value="mine" checked>${esc(showVal(c.mine))}</label></td><td><label class="chk"><input type="radio" name="c${i}" value="theirs">${esc(showVal(c.theirs))}</label></td></tr>`).join('')}</tbody></table></div>`,
      actions:[{label:'あとで（保存しない）',key:null},{label:'選んだ内容で保存',key:'ok',kind:'pri'}]});
    if(!r.key){stash();setSave('ほかの人の変更と重なっています（未保存）',true);showRetry(true);return false}
    const box=document.querySelectorAll('#modal input[type=radio]');// modal は閉じた後なので form から読む
    conflicts.forEach((c,i)=>c.apply(r.form['c'+i]==='theirs'?'theirs':'mine'));
  }
  D=merged;BASE=clone(srv.data||{});SVER=srv.version;
  if(MS.on)syncOfficialFromMaster();
  render();toast(conflicts.length?'選んだ内容で統合しました':'ほかの人の変更と自動で統合しました');
  return true;
}

async function migrateLegacyPending(){
  let ok=0,skip=0;
  for(const x of (D.pending||[]).slice()){
    const p=D.official.people.find(y=>y.id===x.personId);if(!p||!p.empId){skip++;continue}
    try{
      const bp=x.bossTo&&x.bossTo!=='__keep'?D.official.people.find(y=>y.id===x.bossTo):null;
      const t=await BK().requestTransfer({employee_id:p.empId,to_dept_id:x.to||null,to_dept_name:x.to?deptName(x.to,D.official):'未配置',effective_date:x.date||today(),
        change_manager:!!(x.bossTo!==undefined&&x.bossTo!=='__keep'),to_manager_id:bp?.empId||null,plan:{purpose:x.reason||'（社員マスタ導入前の異動予定を移行）',migrated_from:x.id},reason:x.reason||''});

      D.pending=D.pending.filter(y=>y.id!==x.id);ok++;

  await masterReload();dirty();render();toast(`新しい申請に移しました ${ok}件${skip?`（移せなかった ${skip}件：社員マスタ未連携など）`:''}`);

async function adoptScenarioMaster(){
  const sc=org();const offById=new Map(D.official.people.map(p=>[p.id,p]));
  const moves=sc.people.filter(sp=>{const op=offById.get(sp.id);return op&&op.empId&&((sp.deptId||null)!==(op.deptId||null)||(sp.bossId||null)!==(op.bossId||null))});
  const unlinkedMoves=sc.people.filter(sp=>{const op=offById.get(sp.id);return op&&!op.empId&&op.status!=='採用予定'&&(sp.deptId||null)!==(op.deptId||null)});
  const r=await modal({title:'シナリオを正式組織にする',body:`<div>「${esc(sc.name)}」の部署構成を正式組織に反映し、所属・上司が変わる<b>${moves.length}名</b>は異動として申請・承認します（異動日に自動反映、7・30・90日フォローを作成）。</div>
    ${unlinkedMoves.length?`<div class="bwarn">社員マスタ未連携の ${unlinkedMoves.length}名（${unlinkedMoves.map(x=>esc(x.name)).join('、')}）は異動できないため、元の所属のままになります。</div>`:''}
    <label>異動日<input name="date" type="date" value="${nextMonth1()}"></label><label>解決したい組織課題（全員共通）<input name="issue" value="${esc(sc.name)}"></label>`,
    actions:[{label:'やめる',key:null},{label:'正式組織にする',key:'ok',kind:'sun'}]});
  if(!r.key)return;const date=r.form.date||today();
  await once('adopt',async()=>{
    D.official.depts=clone(sc.depts);
    const next=[];sc.people.forEach(sp=>{const op=offById.get(sp.id);
      if(op&&op.empId){next.push({...clone(sp),deptId:op.deptId,bossId:op.bossId,name:op.name,title:op.title,status:op.status,empId:op.empId,empNo:op.empNo,isHead:(sp.deptId||null)===(op.deptId||null)?sp.isHead:op.isHead,headAfterMove:sp.isHead&&(sp.deptId||null)!==(op.deptId||null)?{dept:sp.deptId}:undefined})}
      else if(op&&!op.empId&&op.status!=='採用予定'){next.push({...clone(sp),deptId:op.deptId,bossId:op.bossId})}
      else next.push(clone(sp))});
    D.official.people.filter(op=>op.empId&&!sc.people.some(x=>x.id===op.id)).forEach(op=>next.push(op));
    D.official.people=next;let ok=0;const errs=[];
    for(const sp of moves){const op=next.find(x=>x.id===sp.id);
      try{const bp=sp.bossId?next.find(x=>x.id===sp.bossId):null;const bossCh=(sp.bossId||null)!==(op.bossId||null);
        const t=await BK().requestTransfer({employee_id:op.empId,to_dept_id:sp.deptId||null,to_dept_name:sp.deptId?deptName(sp.deptId,D.official):'未配置',effective_date:date,change_manager:bossCh,to_manager_id:bossCh?(bp?.empId||null):null,
          plan:{issue:r.form.issue||sc.name,purpose:`シナリオ「${sc.name}」を採用`,role:sp.roleName||'',expected:'',checker:me.name||me.email,checker_email:(me.email||'').toLowerCase()},reason:`シナリオ「${sc.name}」を採用`});
        await BK().approve(t.id);ok++}catch(e){errs.push(`${sp.name}：${e.message}`)}}
    D.pending=[];V.scn='official';await masterReload();dirty();render();
    toast(`正式組織にしました（異動 ${ok}件を承認${errs.length?`／失敗 ${errs.length}件`:''}）`);if(errs.length)modal({title:'異動にできなかった社員',body:`<ul class="mini">${errs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`,actions:[{label:'閉じる',key:null}]});
  });
}

    case 'diagGo':{const g=JSON.parse(a.dataset.go||'{}');if(g.dept){flashDept(g.dept)}else if(g.person){V.sel=g.person;renderDrawer()}else if(g.tab){V.tab=g.tab;render()}break}
    case 'retrySave':save(true);break;
  }
});

/* ========== イベント ========== */
document.addEventListener('click',async e=>{
  const go=e.target.closest('[data-go]');if(go){if(innerWidth<=820)$('#aside').classList.remove('open');flashDept(go.dataset.go);document.querySelectorAll('.tabs [data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab==='chart'));return}
  const tab=e.target.closest('[data-tab]');if(tab){V.tab=tab.dataset.tab;render();return}
  const cb=e.target.closest('[data-care]');if(cb){const c=D.care.find(x=>x.id===cb.dataset.care);if(c){c.items[+cb.dataset.k].done=cb.checked;dirty();renderPane();render()}return}
  const a=e.target.closest('[data-act]');if(!a)return;const id=a.dataset.id;
  switch(a.dataset.act){
    case 'deptMenu':deptMenu(id);break;
    case 'closeDrawer':closeDrawer();break;
    case 'delPerson':{const p=person(V.sel);const subs=subsOf(p.id);
      if(MS.on&&isOfficial()&&p.empId){await modal({title:'削除できません',body:`<div>${esc(p.name)}さんは社員マスタに登録されているため、削除できません（異動・面談の履歴を守るため）。退職の場合は在籍状況を「退職」にしてください。</div>`,actions:[{label:'閉じる',key:null}]});break}
      const r=await modal({title:'社員を削除',body:`<div>${esc(p.name)}さんを組織から削除します。異動履歴は残ります。</div>${subs.length?`<div class="bwarn"><b>直属の部下が${subs.length}名います。</b><br>${subs.map(x=>esc(x.name)).join('、')}<br>削除すると、この${subs.length}名の直属上司は「未設定」になります（上司変更履歴に記録）。</div>`:''}`,actions:[{label:'やめる',key:null},{label:'削除する',key:'ok',kind:'del'}]});
      if(r.key){const o=org();subs.forEach(x=>setBoss(x,null,`上司（${p.name}）の削除により解除`));
        o.people=o.people.filter(x=>x.id!==p.id);D.pending=D.pending.filter(x=>x.personId!==p.id);closeDrawer();dirty();render()}break}
    case 'milmeDel':{const r=await modal({title:'ミルメのデータを削除',body:'<div>この端末に保存しているミルメのデータを削除します。Excelファイル自体は消えません。</div>',actions:[{label:'やめる',key:null},{label:'削除する',key:'ok',kind:'del'}]});
      if(r.key){try{localStorage.removeItem(MILME_KEY)}catch(e){}render();toast('削除しました')}break}
    case 'openPerson':{if(person(id)){V.sel=id;renderDrawer();$('#drawer').scrollTop=0;const b=$('#drawer .body');if(b)b.scrollTop=0}break}
    case 'bossCsv':{const lines=[['変更日','氏名','変更前の上司','変更後の上司','理由','記録者','記録日時'],...(D.bossHistory||[]).map(h=>[h.date,h.name,h.from,h.to,h.reason,h.by,h.at])];
      download(`上司変更履歴_${today()}.csv`,'\ufeff'+lines.map(l=>l.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv');break}
    case 'approve':{if(!canApprove())break;const x=D.pending.find(y=>y.id===id);if(!x)break;
      const p=D.official.people.find(y=>y.id===x.personId);const fut=x.date>today();
      const r=await modal({title:'異動を承認',body:`<div class="movebox"><b>${esc(p?.name||'')}</b>さんを<br>${esc(deptName(p?.deptId,D.official))} → <b>${esc(deptName(x.to,D.official))}</b><br>異動日 ${esc(x.date)}</div>${bossChangeText(x,p)}
        <div class="note">${fut?'異動日が未来のため、承認済みとして保持し、異動日に自動で組織図へ反映します。':'異動日が今日以前のため、承認するとすぐに組織図へ反映します。'}<br>異動履歴と異動CAREに記録されます。</div>`,
        actions:[{label:'やめる',key:null},{label:fut?'承認する（異動日に反映）':'承認して反映',key:'ok',kind:'pri'}]});
      if(!r.key)break;const res=approvePending(x);dirty();render();
      toast(res==='now'?'承認して組織図に反映しました':`承認しました。${fmtMD(x.date)}に組織図へ反映します`);break}
    case 'approveAll':{if(!canApprove())break;let now=0,later=0;D.pending.filter(x=>x.status!=='approved').forEach(x=>{const r=approvePending(x);if(r==='now')now++;else if(r==='later')later++});
      dirty();render();toast(`承認しました（即時反映 ${now}件／異動日に反映 ${later}件）`);break}
    case 'cancelPend':{const x=D.pending.find(y=>y.id===id);if(!x)break;
      if(x.status==='approved'){const r=await modal({title:'承認済みの異動を取消',body:'<div>承認済みの異動予定を取り消します。作成済みの異動CAREも削除し、異動履歴に「取消」を記録します。</div>',actions:[{label:'やめる',key:null},{label:'取り消す',key:'ok',kind:'del'}]});
        if(!r.key)break;const p=D.official.people.find(y=>y.id===x.personId);
        D.care=D.care.filter(c=>c.pendingId!==x.id);
        D.history.push({id:uid('h'),personId:x.personId,name:p?.name||'',from:deptName(p?.deptId,D.official),to:deptName(x.to,D.official),date:x.date,reason:x.reason||'',kind:'取消',by:me.name||me.email,at:new Date().toISOString()})}
      D.pending=D.pending.filter(y=>y.id!==id);dirty();render();break}
    case 'histCsv':{const lines=[['異動日','区分','氏名','異動元','異動先','直属上司の変更','理由','記録者','記録日時'],...D.history.map(h=>[h.date,h.kind||'反映',h.name,h.from,h.to,h.boss||'',h.reason,h.by,h.at])];
      download(`異動履歴_${today()}.csv`,'\ufeff'+lines.map(l=>l.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv');break}
    case 'aiRun':runAI();break;
    case 'scnEdit':scnForm(org());break;
    case 'scnDel':{const r=await modal({title:'シナリオを削除',body:`<div>「${esc(org().name)}」を削除します。正式組織には影響しません。</div>`,actions:[{label:'やめる',key:null},{label:'削除する',key:'ok',kind:'del'}]});
      if(r.key){D.scenarios=D.scenarios.filter(s=>s.id!==V.scn);V.scn='official';dirty();render()}break}
    case 'scnAdopt':adoptScenario();break;
  }
});
$('#scnSel').onchange=e=>{V.scn=e.target.value;closeDrawer();V.aiText='';render()};
$('#newScn').onclick=()=>scnForm(null);
$('#addPerson').onclick=addPerson;
$('#addDept').onclick=()=>addDept('top');
$('#importBtn').onclick=importTable;
$('#aiBtn').onclick=()=>{V.tab='diag';render()};
$('#menuBtn').onclick=()=>$('#aside').classList.toggle('open');
$('#q').oninput=e=>{V.q=e.target.value;V.tab='chart';render();const h=document.querySelector('.card.hit');h&&h.scrollIntoView({behavior:'smooth',block:'center',inline:'center'})};
$('#zIn').onclick=()=>{V.zoom=Math.min(1.6,+(V.zoom+.1).toFixed(1));renderPane()};
$('#zOut').onclick=()=>{V.zoom=Math.max(.4,+(V.zoom-.1).toFixed(1));renderPane()};
$('#zReset').onclick=()=>{V.zoom=1;renderPane()};
$('#pdfBtn').onclick=()=>{V.tab='chart';render();setTimeout(()=>window.print(),150)};
$('#saveBtn').onclick=()=>save(true);
$('#backupBtn').onclick=async()=>{
  const r=await modal({title:'バックアップ',body:`<div class="note">全データ（正式組織・シナリオ・異動予定・履歴・上司変更履歴・CARE）をJSONファイルで書き出し／読み込みできます。${MS.on?'社員マスタ（所属・上司・在籍）・異動申請・フォロー・ミルメはサーバー側で管理しているため、このファイルには含まれず、読み込んでも上書きされません。':''}</div>${canEdit()?`<label>読み込むファイル<input name="file" type="file" accept=".json"></label>`:''}`,
    actions:[{label:'閉じる',key:null},...(canEdit()?[{label:'読み込む',key:'in'}]:[]),{label:'書き出す',key:'out',kind:'pri'}]});
  if(r.key==='out')download(`org-design_${today()}.json`,JSON.stringify(D,null,1),'application/json');
  if(r.key==='in'){const f=$('#modal [name=file]')?.files?.[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!j.official)throw 0;D=j;V.scn='official';dirty();render();toast('読み込みました')}catch{toast('このファイルは読み込めません。書き出したJSONを選んでください')}}
};

/* ========== 保存（Supabase：版番号つき。競合は差分を確認。失敗時は端末に保持して再試行） ========== */
let saveT=null,saving=false,resolving=false;
function dirty(){setSave('未保存の変更があります');clearTimeout(saveT);saveT=setTimeout(()=>save(),1500)}
function setSave(t,err){const s=$('#saveState');s.textContent=t;s.classList.toggle('err',!!err)}
async function save(manual){
  clearTimeout(saveT);
  if(mode!=='live'){setSave('プレビュー表示（保存されません）');if(manual)toast('プレビューでは保存されません。公開URLから開いてください');return}
  if(!canEdit()){setSave('閲覧のみ（保存されません）');return}
  if(saving||resolving){saveT=setTimeout(()=>save(manual),1200);return}
  saving=true;setSave('保存中…');showRetry(false);
  try{
    let snap=stripForSave(D);
    if(STATE_RPC){
      let r=await Live.saveState(snap,SVER);
      if(r&&r.conflict){
        resolving=true;let ok=false;
        try{ok=await resolveConflict()}finally{resolving=false}
        if(!ok)return;
        snap=stripForSave(D);r=await Live.saveState(snap,SVER);
        if(r&&r.conflict)throw new Error('ほかの人の保存が続いています。少し待ってから【保存を再試行】を押してください');
      }
      if(!r||!r.ok)throw new Error('サーバーが保存を確認できませんでした');
      SVER=r.version;
    }else{
      const {error}=await sb.from(TABLE).upsert({id:ROW,data:snap,updated_at:new Date().toISOString(),updated_by:me.email});
      if(error)throw error;
    }
    BASE=snap;clearStash();
    setSave('保存済み '+new Date().toTimeString().slice(0,5));if(manual)toast('保存しました');
  }catch(e){
    stash();setSave('保存できませんでした：'+(e.message||e)+'（入力内容は保持しています）',true);showRetry(true);
  }finally{saving=false}
}
window.addEventListener('beforeunload',e=>{if(mode==='live'&&canEdit()&&/未保存|保存できません|重なって/.test($('#saveState').textContent)){stash();e.preventDefault();e.returnValue=''}});
async function restoreStash(){
  let st=null;try{st=JSON.parse(localStorage.getItem(STASH_KEY)||'null')}catch(e){}
  if(!st||!st.data||mode!=='live'||st.by!==me.email||!canEdit())return;
  const r=await modal({title:'保存できなかった変更があります',body:`<div>${esc(String(st.at).slice(0,16).replace('T',' '))} に保存できなかった変更が、この端末に残っています。</div><div class="note">【復元して保存】を押すと、いまのサーバーのデータと比べて統合します。同じ項目をほかの人も変えていた場合は、どちらを残すか選べます。</div>`,
    actions:[{label:'破棄する',key:'drop',kind:'del'},{label:'復元して保存',key:'ok',kind:'pri'}]});
  if(r.key==='ok'){D=st.data;BASE=st.base||BASE;SVER=typeof st.ver==='number'?st.ver:SVER;render();await save(true)}
  else if(r.key==='drop')clearStash();
}
async function boot(){
  try{
    if(window.EC&&window.supabase){
      if(EC.guard)await EC.guard({allow:['admin','manager','sales','field','viewer']});
      const m=typeof EC.me==='function'?await EC.me():EC.me;
      if(m)me={email:m.email,name:m.full_name||m.name||m.email,role:m.role||'viewer'};
      sb=EC.sb||EC.client||window.supabase.createClient(SB_URL,SB_KEY);
      let r=await sb.from(TABLE).select('data,version').eq('id',ROW).maybeSingle();
      if(r.error&&isSchemaErr(r.error)){r=await sb.from(TABLE).select('data').eq('id',ROW).maybeSingle();STATE_RPC=false}
      else STATE_RPC=true;
      if(r.error)throw r.error;
      D=r.data?.data||sample();SVER=r.data?.version||0;BASE=clone(r.data?.data||{});mode='live';
      setSave(r.data?'保存済み':'サンプルを表示中（まだ保存されていません）');
    }else throw new Error('preview');
  }catch(e){
    D=D||sample();mode='preview';setSave(e.message==='preview'?'プレビュー表示（保存されません）':'データを読み込めませんでした：'+e.message,e.message!=='preview');
  }
  ['scenarios','pending','history','care','bossHistory'].forEach(k=>D[k]=D[k]||[]);
  D.settings=D.settings||{};D.todoMeta=D.todoMeta||{};
  D.pending.forEach(x=>{if(!x.status)x.status='draft'});
  await masterInit();
  let nDue=0;
  if(MS.on){
    try{nDue=await BK().applyDue();if(nDue)await masterReload()}catch(e){console.warn(e)}
    // 社員マスタ導入前の機密メモを管理者専用の保存先へ移す（共有データから消す前に必ず退避）
    if(me.role==='admin'){for(const p of D.official.people.filter(p=>p.secret&&!MS.secrets[p.id])){try{await BK().saveSecret(p.id,p.secret);MS.secrets[p.id]={memo:p.secret}}catch(e){}}}
    if(syncOfficialFromMaster()&&canEdit()&&mode==='live')dirty();
  }else{nDue=applyDueMoves();if(nDue&&canEdit())dirty()}
  if(me.role==='admin')V.tab='todo';
  render();
  if(nDue)setTimeout(()=>toast(`異動日を迎えた${nDue}件を正式組織に反映しました`),600);
  setInterval(runDue,10*60*1000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)runDue()});
  await restoreStash();
  setTimeout(()=>showWhatsNew(true),350);
}
boot();
</script>
