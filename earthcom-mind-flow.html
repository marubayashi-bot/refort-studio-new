<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>EARTHCOM MIND FLOW</title>
<meta name="app-version" content="3.2.0">
<meta name="theme-color" content="#07152D">
<meta name="description" content="MIND FLOW — PERSONAL STRATEGIC CALENDAR｜時間を管理するのではなく、未来を設計する。">
<link rel="icon" type="image/png" sizes="32x32" href="nm-icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="nm-icon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="nm-icon-180.png">
<link rel="manifest" href="mindflow.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MIND FLOW">
<link rel="preload" as="image" href="nm-bg-1280.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{
  /* ブランドトークン（色はここでのみ定義する） */
  --midnight:#07152D; --deep-navy:#10264B; --gold:#C9A84C; --pale-gold:#F2D785;
  --accent-blue:#3978F6; --bg-white:#F7F9FC; --green:#28B487; --orange:#F2A93B; --red:#E65757;
  /* 既存コンポーネント用のエイリアス */
  --navy:var(--midnight); --navy2:var(--deep-navy); --navy3:#1B3663;
  --gold-l:var(--pale-gold); --blue:var(--accent-blue); --blue-l:#EAF0FE;
  --bg:var(--bg-white); --surface:#FFFFFF; --line:#E2E7EF;
  --ink:#14213A; --ink2:#57647E; --ink3:#8B96AA;
  --r:14px; --r-s:9px; --r-l:18px;
  --shadow:0 1px 2px rgba(7,21,45,.05), 0 8px 24px rgba(7,21,45,.07);
  --side:250px;
  --bg-img:url('nm-bg-1280.webp');
  --font-ja:"Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,system-ui,sans-serif;
  --font-en:"Inter","Noto Sans JP",system-ui,sans-serif;
  color-scheme:light;
}
@media (min-width:1200px){ :root{ --bg-img:url('nm-bg-1920.webp'); } }
@media (max-width:900px){ :root{ --bg-img:url('nm-bg-mobile.webp'); } }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--font-ja);
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.6;
  overscroll-behavior:none;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--blue)}
h1,h2,h3,h4{margin:0;font-weight:700;line-height:1.35}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- login ---------- */
#login{position:fixed;inset:0;background:linear-gradient(160deg,#0C1527 0%,#16233F 55%,#1E2F52 100%);display:flex;align-items:center;justify-content:center;padding:24px;z-index:80}
.login-card{width:100%;max-width:420px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:34px 28px;backdrop-filter:blur(6px)}
.brand{display:flex;align-items:baseline;gap:10px;color:#fff}
.brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(140deg,var(--gold),#9C7A2C);display:grid;place-items:center;color:#101B33;font-weight:800;font-size:17px;align-self:center}
.brand b{font-size:19px;letter-spacing:.04em}
.brand span{color:var(--gold-l);font-size:12px;letter-spacing:.18em}
.login-card p.tag{color:#C9D2E2;margin:18px 0 26px;font-size:13.5px}
.login-card label{display:block;color:#9FAEC6;font-size:12px;margin:14px 0 6px}
.login-card input{width:100%;padding:11px 13px;border-radius:var(--r-s);border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff}
.login-card input::placeholder{color:#7D8CA6}
.btn-g{width:100%;margin-top:18px;padding:12px;border-radius:var(--r-s);background:var(--gold);color:#16202F;font-weight:700}
.btn-w{width:100%;margin-top:10px;padding:12px;border-radius:var(--r-s);background:#fff;color:#16202F;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.login-note{color:#7D8CA6;font-size:11.5px;margin-top:18px;line-height:1.7}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100%}
.side{width:var(--side);flex:0 0 var(--side);background:var(--navy);color:#C9D2E2;padding:16px 12px 28px;position:sticky;top:0;height:100vh;overflow:auto}
.side .brand{margin:6px 8px 20px}
.side .brand b{font-size:15px}
.nav-h{font-size:11px;color:#6C7C97;margin:18px 10px 6px;letter-spacing:.08em}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-s);color:#C9D2E2;text-decoration:none;font-size:13.5px}
.nav a .ic{width:18px;text-align:center;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:rgba(200,160,70,.16);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.nav a .n{margin-left:auto;background:rgba(255,255,255,.12);border-radius:20px;padding:1px 7px;font-size:11px}
.nav a .n.warn{background:var(--red);color:#fff}
.side .me{margin-top:22px;padding:10px;border-top:1px solid rgba(255,255,255,.1);font-size:12px;color:#9FAEC6}
.side .me b{display:block;color:#fff;font-size:13px}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:56px;display:flex;align-items:center;gap:10px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar h1{font-size:16px}
.topbar .sp{flex:1}
.view{padding:20px;max-width:1180px;width:100%}
.view.wide{max-width:1500px}
.view.full{padding:0;max-width:none;flex:1;min-height:0}

/* ---------- generic ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.sec-h{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.sec-h h3{font-size:14px}
.sec-h .sp{flex:1}
.muted{color:var(--ink2)}
.small{font-size:12px}
.kpi{padding:14px 16px}
.kpi .lab{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.kpi .num{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin-top:2px}
.kpi .num.red{color:var(--red)} .kpi .num.orange{color:var(--orange)} .kpi .num.green{color:var(--green)}
.kpi .sub{font-size:11.5px;color:var(--ink3)}
.btn{padding:8px 13px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#F2F4F8}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.pri:hover{background:var(--navy2)}
.btn.gold{background:var(--gold);color:#16202F;border-color:var(--gold)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.danger{color:var(--red);border-color:#F0C9C6}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600;background:#EEF1F6;color:var(--ink2);white-space:nowrap}
.chip.red{background:#FBE9E8;color:var(--red)} .chip.orange{background:#FDF0E0;color:#A8641A}
.chip.green{background:#E4F5EE;color:#146B49} .chip.blue{background:var(--blue-l);color:#1A4FB5}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11.5px;color:var(--ink2)}
.chain b{color:var(--ink);font-size:13px}
.chain i{color:var(--ink3);font-style:normal}
.dotc{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px}
.chip.gold{background:#F8F0DC;color:#8A6A17} .chip.grey{background:#EEF1F6;color:var(--ink2)}
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;color:var(--ink2);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-s);background:#fff}
.field textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.empty{text-align:center;padding:30px 16px;color:var(--ink2)}
.empty .big{font-size:26px;margin-bottom:6px;opacity:.6}
.empty .btn{margin-top:12px}
.err{background:#FBE9E8;border:1px solid #F0C9C6;color:#8E2F27;padding:10px 12px;border-radius:var(--r-s);font-size:12.5px;margin-bottom:12px}
.ok{background:#E4F5EE;border:1px solid #BFE6D6;color:#146B49;padding:10px 12px;border-radius:var(--r-s);font-size:12.5px;margin-bottom:12px}
.load{padding:26px;text-align:center;color:var(--ink3);font-size:12.5px}
.list-item{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:none}
.list-item .t{flex:1;min-width:0}
.list-item .t b{font-weight:600;font-size:13.5px;display:block}
.list-item .meta{font-size:11.5px;color:var(--ink3);display:flex;gap:8px;flex-wrap:wrap;margin-top:3px}
.bar{height:6px;border-radius:6px;background:#EDF0F5;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue)}
.bar i.gold{background:var(--gold)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11.5px;color:var(--ink2);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line)}

/* ---------- mindmap ---------- */
.mm-wrap{display:flex;flex:1;min-height:0}
.mm-stage{position:relative;flex:1;min-width:0;overflow:hidden;background:
  radial-gradient(circle at 1px 1px, #DCE1E9 1px, transparent 0) 0 0/22px 22px, var(--bg);touch-action:none}
.mm-canvas{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
.mm-edges{position:absolute;top:0;left:0;overflow:visible;pointer-events:none;transform-origin:0 0}
.node{position:absolute;width:200px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ink3);
  border-radius:10px;padding:8px 10px;box-shadow:var(--shadow);cursor:grab;user-select:none}
.node.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,160,70,.3),var(--shadow)}
.node.hit{box-shadow:0 0 0 3px var(--blue)}
.node.dim{opacity:.35}
.node.root{width:230px;background:var(--navy);color:#fff;border-color:var(--navy);border-left-color:var(--gold)}
.node.root .n-meta{color:#9FAEC6}
.node .n-top{display:flex;align-items:flex-start;gap:6px}
.node .n-ic{font-size:12px;line-height:1.5}
.node .n-title{font-size:13px;font-weight:600;word-break:break-word;flex:1}
.node .n-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;font-size:10.5px;color:var(--ink3)}
.node .n-meta .m{display:inline-flex;gap:3px;align-items:center}
.node .n-meta .m.over{color:var(--red);font-weight:700}
.node .n-bar{height:4px;border-radius:4px;background:#EDF0F5;margin-top:6px;overflow:hidden}
.node .n-bar i{display:block;height:100%;background:var(--green)}
.node .tog{position:absolute;right:-11px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;
  background:#fff;border:1px solid var(--line);font-size:11px;line-height:18px;text-align:center;color:var(--ink2);box-shadow:var(--shadow)}
.node input.n-edit{width:100%;font-size:13px;font-weight:600;border:1px solid var(--blue);border-radius:5px;padding:2px 4px;background:#fff;color:var(--ink)}
.mm-tools{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:6}
.mm-tools .btn{background:rgba(255,255,255,.95);backdrop-filter:blur(4px)}
.mm-zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:6}
.mm-zoom .btn{width:36px;height:36px;justify-content:center;background:rgba(255,255,255,.95)}
.mm-hint{position:absolute;left:12px;bottom:12px;font-size:11px;color:var(--ink3);background:rgba(255,255,255,.9);padding:5px 9px;border-radius:20px;z-index:5}
.detail{width:320px;flex:0 0 320px;border-left:1px solid var(--line);background:var(--surface);overflow:auto;height:100%}
.detail .dh{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:8px;z-index:2}
.detail .db{padding:14px}
.kind-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kind-grid button{border:1px solid var(--line);border-radius:var(--r-s);padding:6px 4px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;background:#fff}
.kind-grid button.on{border-color:var(--navy);background:#F2F5FB;font-weight:700}
.kind-grid .dot{width:10px;height:10px;border-radius:3px}

/* ---------- gtd board ---------- */
.board{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 20px;align-items:flex-start}
.col{flex:0 0 262px;background:#EFF1F5;border-radius:var(--r);padding:10px;min-height:120px}
.col.over{background:#E3EBFB;outline:2px dashed var(--blue)}
.col h4{font-size:12.5px;display:flex;align-items:center;gap:6px;margin-bottom:8px;color:var(--ink2)}
.col h4 .n{margin-left:auto;background:#fff;border-radius:20px;padding:0 7px;font-size:11px}
.tcard{background:#fff;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:var(--r-s);padding:9px 10px;margin-bottom:8px;box-shadow:0 1px 2px rgba(16,27,51,.05);cursor:pointer}
.tcard.drag{opacity:.4}
.tcard b{font-size:13px;font-weight:600;display:block;word-break:break-word}
.tcard .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:11px;color:var(--ink3)}
.tcard.p1{border-left-color:var(--red)} .tcard.p2{border-left-color:var(--orange)}
.tcard.p4{border-left-color:var(--ink3)}
.tcard.done b{text-decoration:line-through;color:var(--ink3)}

/* ---------- modal / sheet ---------- */
.mask{position:fixed;inset:0;background:rgba(16,27,51,.42);z-index:60;display:flex;align-items:center;justify-content:center;padding:18px}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:520px;max-height:86vh;overflow:auto;box-shadow:0 20px 60px rgba(16,27,51,.28)}
.modal .mh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;position:sticky;top:0;background:#fff}
.modal .mb{padding:18px}
.modal .mf{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:#fff}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.quick button{border:1px solid var(--line);border-radius:var(--r);padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:600;background:#fff}
.quick button .ic{font-size:22px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:22px;font-size:13px;z-index:90;box-shadow:0 8px 24px rgba(16,27,51,.3);max-width:88vw}
.toast.err{background:var(--red)}
.sugg{border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;margin-bottom:8px;background:#FBFCFE}
.sugg .s-t{font-size:13px;font-weight:600}
.sugg .s-a{display:flex;gap:6px;margin-top:8px}

/* ---------- ブランド背景 ---------- */
body::before{content:"";position:fixed;inset:0;z-index:-2;background:var(--midnight) var(--bg-img) center/cover no-repeat}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:rgba(247,249,252,.88)}
.shell{background:transparent}
.main{background:transparent}
.topbar{background:rgba(255,255,255,.78);backdrop-filter:blur(12px);border-bottom:1px solid rgba(16,38,75,.10)}
.card{border-color:rgba(16,38,75,.09);border-radius:var(--r-l);background:rgba(255,255,255,.96)}
.card.sel,.card.on{border-color:var(--gold)}
.glass{position:relative;border-radius:20px;overflow:hidden;color:#fff;border:1px solid rgba(201,168,76,.35);
  background:linear-gradient(105deg,rgba(7,21,45,.93) 0%,rgba(16,38,75,.72) 48%,rgba(16,38,75,.42) 100%), var(--bg-img);
  background-size:cover;background-position:right center;box-shadow:0 10px 34px rgba(7,21,45,.28)}
.glass .sub{color:#C5D0E3}
.glass .gold{color:var(--pale-gold)}
.hero{padding:22px 24px;margin-bottom:16px}
.hero .tag{font-family:var(--font-en);font-weight:400;letter-spacing:.18em;font-size:11px;color:var(--pale-gold)}
.hero h2{font-size:22px;font-weight:700;margin:8px 0 2px;letter-spacing:.01em}
.hero .lead{font-weight:300;letter-spacing:.14em;font-size:13px;color:#C5D0E3}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:16px}
.hero-stats .s .k{font-size:10.5px;letter-spacing:.1em;color:#9FB0CA}
.hero-stats .s .v{font-family:var(--font-en);font-size:24px;font-weight:700;line-height:1.25}
.hero-stats .s .v small{font-size:12px;font-weight:400;color:#C5D0E3;margin-left:3px}
.gold-line{height:1px;background:linear-gradient(90deg,rgba(201,168,76,0),var(--gold) 35%,var(--pale-gold) 65%,rgba(201,168,76,0));margin:14px 0}
/* ---------- サイドバー ---------- */
.side{background:linear-gradient(180deg,#07152D 0%,#0B1D3A 100%);border-right:1px solid rgba(201,168,76,.18)}
.brandbox{display:flex;gap:11px;align-items:center;padding:6px 8px 18px}
.brandbox img{width:38px;height:38px;border-radius:11px;box-shadow:0 4px 14px rgba(0,0,0,.45)}
.brandbox .bn{font-family:var(--font-en);font-weight:700;font-size:15px;letter-spacing:.10em;color:#fff;line-height:1.2}
.brandbox .bs{font-family:var(--font-en);font-size:8.5px;letter-spacing:.16em;color:var(--gold);margin-top:3px}
.nav a .ic{display:inline-flex;width:18px;height:18px;align-items:center;justify-content:center;opacity:.75}
.nav a.on .ic{opacity:1;color:var(--pale-gold)}
.nav a.on{background:rgba(201,168,76,.12);box-shadow:inset 3px 0 0 var(--gold)}
.side .me{border-top:1px solid rgba(255,255,255,.10)}
.side .owner{font-family:var(--font-en);font-size:9.5px;letter-spacing:.16em;color:var(--gold);margin-top:12px;padding:0 10px}
/* ---------- ログイン・起動画面 ---------- */
#login{background:var(--midnight) var(--bg-img) center/cover no-repeat}
#login::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(7,21,45,.92),rgba(7,21,45,.55))}
.login-card{position:relative;background:rgba(9,24,48,.62);border:1px solid rgba(201,168,76,.28);border-radius:20px;backdrop-filter:blur(10px)}
.login-card .lg-ic{width:64px;height:64px;border-radius:18px;display:block;margin:0 auto 14px;box-shadow:0 8px 26px rgba(0,0,0,.5)}
.login-card .lg-n{font-family:var(--font-en);font-weight:700;font-size:22px;letter-spacing:.16em;text-align:center;color:#fff}
.login-card .lg-s{font-family:var(--font-en);font-size:9.5px;letter-spacing:.24em;text-align:center;color:var(--gold);margin-top:6px}
.login-card p.tag{text-align:center;font-weight:300;letter-spacing:.1em;color:#C5D0E3;margin:18px 0 24px}
.btn-g{background:linear-gradient(120deg,var(--gold),#A8863A);color:#0B1B36}
#splash{position:fixed;inset:0;z-index:120;background:var(--midnight);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:opacity .45s}
#splash.out{opacity:0;pointer-events:none}
#splash img{width:92px;height:92px;border-radius:24px;box-shadow:0 10px 40px rgba(0,0,0,.55);animation:sp-in .7s ease-out both}

<script>
"use strict";
/* =========================================================================
   EARTHCOM MIND FLOW  —  実行型マインドマップ + GTD
   単一HTML / Vanilla JS。保存層(Store)・AI層(AI)・連携層(Integrations)を分離。
   ========================================================================= */
const CONFIG = {
  AI_ENDPOINT: 'https://aakofrzurgwrkctunthw.supabase.co/functions/v1/ai',
  AI_KEY: 'sb_publishable_yAUGrTJjqg56S16D7BI2oQ_pbt1olLa',
  KEY: 'ecmf.db.v1'
};

/* ---------- 基本ユーティリティ ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const uid = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toISOString().slice(0, 10);
const addDays = (d, n) => { const t = new Date(d + 'T00:00:00'); t.setDate(t.getDate() + n); return t.toISOString().slice(0, 10); };
const daysLeft = d => d ? Math.round((new Date(d + 'T00:00:00') - new Date(today() + 'T00:00:00')) / 86400000) : null;
const fmtDate = d => d ? d.slice(5).replace('-', '/') : '';
const isMobile = () => window.innerWidth <= 900;
function toast(msg, kind) {
  const el = document.createElement('div');
  el.className = 'toast' + (kind === 'err' ? ' err' : ''); el.textContent = msg;
  $('#toastHost').appendChild(el); setTimeout(() => el.remove(), 2600);
}
/* ブラウザ保存が使えない環境（プレビュー等）でも落ちないラッパー */
const LS = (() => {
  let mem = {}, ok = true;
  try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); } catch (e) { ok = false; }
  return {
    ok, get(k) { try { return ok ? localStorage.getItem(k) : (mem[k] ?? null); } catch (e) { return mem[k] ?? null; } },
    set(k, v) { try { ok ? localStorage.setItem(k, v) : (mem[k] = v); } catch (e) { mem[k] = v; } }
  };
})();

/* ---------- マスタ定義 ---------- */
const KINDS = {
  topic:     { label: '中央テーマ',       icon: '●', color: '#101B33' },
  goal:      { label: 'ゴール',           icon: '◆', color: '#C8A046' },
  strategy:  { label: '戦略',             icon: '▲', color: '#1B2A4A' },
  project:   { label: 'プロジェクト',     icon: '■', color: '#7B5EA7' },
  next:      { label: '次にとるべき行動', icon: '▶', color: '#2F6FED' },
  calendar:  { label: '予定',             icon: '📅', color: '#2F6FED' },
  waiting:   { label: '連絡待ち',         icon: '⏳', color: '#E08A25' },
  someday:   { label: 'いつかやる',       icon: '○', color: '#8A93A6' },
  risk:      { label: '課題・リスク',     icon: '⚠', color: '#D6453C' },
  idea:      { label: 'アイデア',         icon: '💡', color: '#E8C33A' },
  decision:  { label: '決定事項',         icon: '✔', color: '#1F9D6B' },
  reference: { label: '資料・参考情報',   icon: '📄', color: '#5B6B85' },
  done:      { label: '完了',             icon: '✅', color: '#1F9D6B' }
};
const GTD = {
  inbox:     { label: '000 Inbox',          icon: '📥' },
  today:     { label: '今日やる',            icon: '⭐' },
  next:      { label: '次にとるべき行動',    icon: '▶' },
  project:   { label: 'プロジェクト',        icon: '■' },
  waiting:   { label: '連絡待ち',            icon: '⏳' },
  someday:   { label: 'いつかやる／多分やる', icon: '○' },
  calendar:  { label: 'カレンダー',          icon: '📅' },
  reference: { label: '資料・参考情報',      icon: '📄' },
  done:      { label: '完了・振り返り',      icon: '✅' }
};
const BOARD_COLS = ['inbox', 'today', 'next', 'project', 'waiting', 'someday', 'done'];
const PRIO = { 1: { l: '最重要', c: 'red' }, 2: { l: '重要', c: 'orange' }, 3: { l: '通常', c: 'grey' }, 4: { l: '低', c: 'grey' } };
const ROLES = { admin: '管理者', exec: '経営者', manager: '部門長', staff: '一般社員', viewer: '閲覧者' };
const SHARE = { private: '非公開', members: '指定メンバーのみ', dept: '部門共有', company: '全社共有', link: 'URLを知っている人が閲覧' };

/* ---------- データストア（Supabase等へ差し替え可能な単一窓口） ---------- */
const Store = {
  db: null,
  empty() {
    return {
      version: 1, user: null,
      maps: [], nodes: [], projects: [], tasks: [], comments: [], attachments: [],
      calendar_events: [], external_links: [], integrations: [], sync_logs: [],
      activity_logs: [], notifications: [], reviews: [],
      strategy: { years: [], quarters: [], months: [], weeks: [], days: [], roadmap: [] },
      ai_inputs: [], ai_plans: [], goals: [], goal_metrics: [], opportunities: [],
      pipeline_snapshots: [], ai_recommendations: [], plan_approvals: [], daily_reviews: [],
      capacity: { start: '08:00', end: '19:00', bufferPct: 20 },
      settings: { theme: 'light', role: 'admin' }
    };
  },
  load() {
    try { this.db = JSON.parse(LS.get(CONFIG.KEY) || 'null'); } catch (e) { this.db = null; }
    if (!this.db || !this.db.version) this.db = this.empty();
    for (const k of Object.keys(this.empty())) if (this.db[k] === undefined) this.db[k] = this.empty()[k];
    return this.db;
  },
  _t: null,
  save(now) {
    clearTimeout(this._t);
    const run = () => { try { LS.set(CONFIG.KEY, JSON.stringify(this.db)); setSaved(); } catch (e) { toast('保存できませんでした: ' + e.message, 'err'); } };
    now ? run() : (this._t = setTimeout(run, 400));
  },
  log(action, target) {
    this.db.activity_logs.unshift({ id: uid(), action, target, at: new Date().toISOString(), by: (this.db.user || {}).name || '-' });
    this.db.activity_logs = this.db.activity_logs.slice(0, 200);

const nodesOf = m => DB.nodes.filter(n => n.map_id === m);
const childrenOf = n => DB.nodes.filter(x => x.parent_id === n.id).sort((a, b) => (a.order || 0) - (b.order || 0));

const nodeById = id => DB.nodes.find(n => n.id === id);
const taskById = id => DB.tasks.find(t => t.id === id);
const projectById = id => DB.projects.find(p => p.id === id);

const isDescendant = (a, b) => { // b が a の子孫か
  let cur = nodeById(b); let guard = 0;
  while (cur && cur.parent_id && guard++ < 200) { if (cur.parent_id === a) return true; cur = nodeById(cur.parent_id); }
  return false;
};
function projectProgress(p) {
  const ts = DB.tasks.filter(t => t.project_id === p.id);
  if (!ts.length) return p.progress || 0;
  return Math.round(ts.filter(t => t.gtd === 'done').length / ts.length * 100);
}
function stalledProjects(days) {

/* ---------- 生成 ---------- */
function newMap(title, share) {
  const m = { id: uid(), title: title || '新しいマップ', owner: (DB.user || {}).email || '', share: share || 'private',
    created_at: new Date().toISOString(), updated_at: new Date().toISOString() };
  DB.maps.unshift(m);
  DB.nodes.push(mkNode(m.id, null, title || '中央テーマ', 'topic'));
  Store.log('マップ作成', m.title); Store.save();
  return m;
}
function mkNode(map_id, parent_id, title, kind, extra) {
  const sib = DB.nodes.filter(n => n.map_id === map_id && n.parent_id === parent_id);
  return Object.assign({
    id: uid(), map_id, parent_id: parent_id || null, title: title || '新しいノード',
    detail: '', kind: kind || 'idea', status: 'open', owner: '', start: '', due: '',
    priority: 3, progress: 0, tags: [], url: '', evernote_url: '',
    gcal_event_id: '', gtask_id: '', task_id: '', project_id: '',
    collapsed: false, manual: false, x: 0, y: 0, order: sib.length,
    created_at: new Date().toISOString(), updated_at: new Date().toISOString()
  }, extra || {});
}
function addNode(parent, kind) {
  const n = mkNode(parent.map_id, parent.id, '新しいノード', kind || 'idea');
  DB.nodes.push(n); touchMap(parent.map_id); return n;
}
function deleteNode(n) {
  const kill = [n.id]; let i = 0;
  while (i < kill.length) { DB.nodes.filter(x => x.parent_id === kill[i]).forEach(c => kill.push(c.id)); i++; }
  DB.nodes = DB.nodes.filter(x => !kill.includes(x.id));
  DB.tasks.forEach(t => { if (kill.includes(t.node_id)) t.node_id = ''; });
  touchMap(n.map_id);
}
function touchMap(id) { const m = DB.maps.find(x => x.id === id); if (m) m.updated_at = new Date().toISOString(); Store.save(); }

function mkTask(o) {
  const t = Object.assign({
    id: uid(), title: '無題のタスク', gtd: 'inbox', node_id: '', map_id: '', project_id: '',
    owner: '', due: '', start: '', priority: 3, progress: 0, notes: '', source: 'manual',
    gtask_id: '', gcal_event_id: '', evernote_url: '', url: '',
    created_at: new Date().toISOString(), updated_at: new Date().toISOString(), done_at: ''
  }, o || {});
  DB.tasks.unshift(t); Store.log('タスク作成', t.title); Store.save();
  return t;
}
function setGtd(t, g) {
  const was = t.gtd;
  t.gtd = g; t.updated_at = new Date().toISOString();
  t.done_at = g === 'done' ? new Date().toISOString() : '';
  if (g === 'done' && was !== 'done') Integrations.syncDone(t, true);
  if (was === 'done' && g !== 'done') Integrations.syncDone(t, false);
  if (t.node_id) { const n = nodeById(t.node_id); if (n) { n.kind = gtdToKind(g, n.kind); n.progress = g === 'done' ? 100 : n.progress; } }
  if (t.project_id) { const p = projectById(t.project_id); if (p) p.updated_at = new Date().toISOString(); }
  Store.save();
}
function gtdToKind(g, cur) {
  const map = { next: 'next', today: 'next', waiting: 'waiting', someday: 'someday', calendar: 'calendar', done: 'done', project: 'project', reference: 'reference' };
  return map[g] || cur || 'idea';
}
function nodeToTask(n, gtd) {
  if (n.task_id && taskById(n.task_id)) { toast('このノードは既にタスク化されています'); return taskById(n.task_id); }
  const t = mkTask({ title: n.title, gtd: gtd || 'next', node_id: n.id, map_id: n.map_id, owner: n.owner,
    due: n.due, start: n.start, priority: n.priority, notes: n.detail, url: n.url, evernote_url: n.evernote_url,
    project_id: n.project_id || nearestProject(n), source: 'map' });
  n.task_id = t.id; n.kind = gtdToKind(t.gtd, n.kind); touchMap(n.map_id);
  return t;
}
function nearestProject(n) {
  let cur = nodeById(n.parent_id), g = 0;
  while (cur && g++ < 60) { if (cur.project_id) return cur.project_id; cur = nodeById(cur.parent_id); }
  return '';
}
function nodeToProject(n) {
  if (n.project_id && projectById(n.project_id)) return projectById(n.project_id);
  const p = { id: uid(), title: n.title, node_id: n.id, map_id: n.map_id, purpose: n.detail || '',
    done_condition: '', owner: n.owner, due: n.due, progress: n.progress || 0, status: 'active',
    created_at: new Date().toISOString(), updated_at: new Date().toISOString() };
  DB.projects.unshift(p); n.project_id = p.id; n.kind = 'project';
  Store.log('プロジェクト化', p.title); touchMap(n.map_id);
  return p;
}

/* ---------- AIマネージャー（提案→承認で反映） ---------- */
const AI = {
  available: true,
  async ask(prompt, system, max) {
    const r = await fetch(CONFIG.AI_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + CONFIG.AI_KEY },
      body: JSON.stringify({ prompt, system: system || '', max_tokens: max || 1200 })
    });
    if (!r.ok) throw new Error('AI応答エラー (' + r.status + ')');
    const d = await r.json();
    if (typeof d === 'string') return d;
    if (d.text) return d.text;
    if (Array.isArray(d.content)) return d.content.map(c => c.text || '').join('\n');
    if (d.completion) return d.completion;
    throw new Error('AI応答の形式が想定と違います');
  },
  async json(prompt, system) {
    const raw = await this.ask(prompt, (system || '') + ' 必ずJSONのみを返し、前置き・コードフェンスを付けないこと。', 1500);
    const s = raw.replace(/```json|```/g, '').trim();
    const a = s.indexOf('{') >= 0 ? s.indexOf('{') : s.indexOf('[');
    const b = Math.max(s.lastIndexOf('}'), s.lastIndexOf(']'));
    return JSON.parse(s.slice(a, b + 1));
  }
};

  if (!out.length) out.push({ t: '整理は行き届いています', d: '今日の最重要ゴールに集中してください。', a: '', fn: null });
  return out;
}

const MM = { mapId: '', sel: '', view: { tx: 60, ty: 60, s: 1 }, undo: [], redo: [], q: '', editing: false };
const NW = 200, NH = 58, GX = 88, GY = 16;

function mmLayout() {
  const root = rootOf(MM.mapId); if (!root) return;
  let cursor = 0;
  const place = (n, depth) => {
    const h = n._h || NH;
    const kids = n.collapsed ? [] : childrenOf(n);
    if (!kids.length) { n._x = depth * (NW + GX); n._y = cursor; cursor += h + GY; return n._y + h / 2; }
    const cs = kids.map(k => place(k, depth + 1));
    n._x = depth * (NW + GX);
    n._y = (cs[0] + cs[cs.length - 1]) / 2 - h / 2;
    return n._y + h / 2;
  };
  place(root, 0);
  nodesOf(MM.mapId).forEach(n => { if (n.manual) { n._x = n.x; n._y = n.y; } });
}
function visibleNodes() {
  const out = []; const root = rootOf(MM.mapId); if (!root) return out;
  const walk = n => { out.push(n); if (!n.collapsed) childrenOf(n).forEach(walk); };
  walk(root); return out;
}
function mmRender(skipMeasure) {
  const cv = $('#canvas'), sv = $('#edges'); if (!cv) return;
  const vis = visibleNodes();
  const q = MM.q.toLowerCase();
  cv.style.transform = 'translate(' + MM.view.tx + 'px,' + MM.view.ty + 'px) scale(' + MM.view.s + ')';
  sv.style.transform = cv.style.transform;
  sv.setAttribute('width', 4000); sv.setAttribute('height', 4000);

  let paths = '';
  vis.forEach(n => {
    if (n.collapsed) return;
    childrenOf(n).forEach(c => {
      if (!vis.includes(c)) return;
      const x1 = n._x + (n._w || NW), y1 = n._y + (n._h || NH) / 2,
            x2 = c._x, y2 = c._y + (c._h || NH) / 2, mx = (x1 + x2) / 2;
      paths += '<path d="M' + x1 + ',' + y1 + ' C' + mx + ',' + y1 + ' ' + mx + ',' + y2 + ' ' + x2 + ',' + y2 +
        '" fill="none" stroke="#C6CDDA" stroke-width="2"/>';
    });
  });
  sv.innerHTML = paths;

  cv.innerHTML = vis.map(n => {
    const k = KINDS[n.kind] || KINDS.idea;
    const kids = childrenOf(n).length;
    const dl = daysLeft(n.due);
    const dim = q && !(n.title + n.detail).toLowerCase().includes(q) ? ' dim' : '';
    const sel = n.id === MM.sel ? ' sel' : '';
    const root = !n.parent_id ? ' root' : '';
    return '<div class="node' + root + sel + dim + '" data-id="' + n.id + '" style="left:' + n._x + 'px;top:' + n._y + 'px;border-left-color:' + k.color + '">' +
      '<div class="n-top"><span class="n-ic">' + k.icon + '</span><span class="n-title">' + esc(n.title) + '</span></div>' +
      '<div class="n-meta">' +
        '<span class="m">' + esc(k.label) + '</span>' +
        (n.owner ? '<span class="m">👤' + esc(n.owner) + '</span>' : '') +
        (n.due ? '<span class="m' + (dl < 0 ? ' over' : '') + '">📅' + fmtDate(n.due) + (dl < 0 ? '超過' : '') + '</span>' : '') +
        (n.task_id ? '<span class="m">🗂タスク</span>' : '') +
        (n.project_id ? '<span class="m">■案件</span>' : '') +
        (n.evernote_url ? '<span class="m">🐘</span>' : '') +
      '</div>' +
      (n.progress ? '<div class="n-bar"><i style="width:' + n.progress + '%"></i></div>' : '') +
      (kids ? '<button class="tog" data-tog="' + n.id + '">' + (n.collapsed ? kids : '−') + '</button>' : '') +
      '</div>';
  }).join('');
  if (!skipMeasure) requestAnimationFrame(mmMeasure);
}
/* ノードは文字数で高さが変わるため、実寸を測ってから枝を組み直す */
function mmMeasure() {
  let changed = false;
  $$('#canvas .node').forEach(el => {
    const n = nodeById(el.dataset.id); if (!n) return;
    const h = el.offsetHeight, w = el.offsetWidth;
    if (!h) return;
    if (Math.abs((n._h || NH) - h) > 1 || Math.abs((n._w || NW) - w) > 1) { n._h = h; n._w = w; changed = true; }
  });
  if (changed) { mmLayout(); mmRender(true); }
}
function mmSelect(id) { MM.sel = id; mmRender(); renderDetail(); }
function selNode() { return nodeById(MM.sel); }

/* --- 操作 --- */
function mmSnap() { MM.undo.push(JSON.stringify(nodesOf(MM.mapId))); if (MM.undo.length > 40) MM.undo.shift(); MM.redo = []; }
function mmRestore(json) {
  DB.nodes = DB.nodes.filter(n => n.map_id !== MM.mapId).concat(JSON.parse(json));
  Store.save(); mmLayout(); mmRender(); renderDetail();
}
function mmUndo() { if (!MM.undo.length) return toast('元に戻す操作がありません'); MM.redo.push(JSON.stringify(nodesOf(MM.mapId))); mmRestore(MM.undo.pop()); }
function mmRedo() { if (!MM.redo.length) return toast('やり直す操作がありません'); MM.undo.push(JSON.stringify(nodesOf(MM.mapId))); mmRestore(MM.redo.pop()); }
function mmAddChild() {
  if (!requireEdit()) return;
  const p = selNode() || rootOf(MM.mapId); if (!p) return;
  mmSnap(); p.collapsed = false;
  const n = addNode(p); mmLayout(); mmSelect(n.id); startRename(n.id);
}
function mmAddSibling() {
  if (!requireEdit()) return;
  const s = selNode(); if (!s || !s.parent_id) return mmAddChild();
  mmSnap(); const n = addNode(nodeById(s.parent_id), s.kind); mmLayout(); mmSelect(n.id); startRename(n.id);
}
function mmAddFromToolbar() { selNode() ? mmAddChild() : (mmSelect((rootOf(MM.mapId) || {}).id), mmAddChild()); }
function mmDelete() {
  const n = selNode(); if (!n || !requireEdit()) return;
  if (!n.parent_id) return toast('中央テーマは削除できません', 'err');
  if (!confirm('「' + n.title + '」と、その下のノードを削除します。よろしいですか？')) return;
  mmSnap(); const p = n.parent_id; deleteNode(n); mmLayout(); mmSelect(p);
}
function mmDuplicate() {
  const n = selNode(); if (!n || !n.parent_id || !requireEdit()) return;
  mmSnap();
  const clone = (src, parent) => {
    const c = mkNode(src.map_id, parent, src.title + '（複製）', src.kind, { detail: src.detail, owner: src.owner, due: src.due, priority: src.priority });
    DB.nodes.push(c); childrenOf(src).forEach(k => clone(k, c.id)); return c;
  };
  const c = clone(n, n.parent_id); touchMap(n.map_id); mmLayout(); mmSelect(c.id);
}
function mmArrange() { mmSnap(); nodesOf(MM.mapId).forEach(n => n.manual = false); Store.save(); mmLayout(); mmRender(); toast('枝を自動整列しました'); }
function mmZoom(f, cx, cy) {
  const st = $('#stage'); if (!st) return;
  const r = st.getBoundingClientRect();
  cx = cx == null ? r.width / 2 : cx; cy = cy == null ? r.height / 2 : cy;
  const s2 = Math.min(2.2, Math.max(0.25, MM.view.s * f));
  MM.view.tx = cx - (cx - MM.view.tx) * (s2 / MM.view.s);
  MM.view.ty = cy - (cy - MM.view.ty) * (s2 / MM.view.s);
  MM.view.s = s2; mmRender();
}
function mmFit() {
  const st = $('#stage'); if (!st) return;
  const vis = visibleNodes(); if (!vis.length) return;
  const xs = vis.map(n => n._x), ys = vis.map(n => n._y);
  const w = Math.max(...vis.map(n => n._x + (n._w || NW))) - Math.min(...xs);
  const h = Math.max(...vis.map(n => n._y + (n._h || NH))) - Math.min(...ys);
  const r = st.getBoundingClientRect();
  const s = Math.min(1.1, Math.max(0.25, Math.min((r.width - 60) / w, (r.height - 90) / h)));
  MM.view.s = s;
  MM.view.tx = (r.width - w * s) / 2 - Math.min(...xs) * s;
  MM.view.ty = (r.height - h * s) / 2 - Math.min(...ys) * s;
  mmRender();
}
function startRename(id) {
  const el = $('.node[data-id="' + id + '"]'); const n = nodeById(id); if (!el || !n || !Can.edit()) return;
  const t = $('.n-title', el); if (!t) return;
  MM.editing = true;
  t.innerHTML = '<input class="n-edit" value="' + esc(n.title) + '">';
  const inp = $('input', t); inp.focus(); inp.select();
  const commit = ok => {
    if (!MM.editing) return; MM.editing = false;
    if (ok) { const v = inp.value.trim(); if (v && v !== n.title) { mmSnap(); n.title = v; n.updated_at = new Date().toISOString();
      const tk = taskById(n.task_id); if (tk) tk.title = v; touchMap(n.map_id); } }
    mmRender(); renderDetail();
  };
  inp.addEventListener('blur', () => commit(true));
  inp.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); commit(true); }
    if (e.key === 'Escape') { e.preventDefault(); commit(false); }
  });
}
function mmShare() {

/* --- ステージ操作（PC:マウス / スマホ:タッチ 共通のPointer Events） --- */
function bindStage() {
  const st = $('#stage'); if (!st) return;
  let mode = null, sx = 0, sy = 0, node = null, ox = 0, oy = 0, moved = false, lastTap = 0, pinch = 0;
  const pts = new Map();

  st.addEventListener('pointerdown', e => {
    if (e.target.closest('.mm-tools, .mm-zoom, .mm-mobile')) return; // ツールバー操作は無視
    const tog = e.target.closest('[data-tog]');
    if (tog) { const n = nodeById(tog.dataset.tog); mmSnap(); n.collapsed = !n.collapsed; Store.save(); mmLayout(); mmRender(); e.preventDefault(); return; }
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) { mode = 'pinch'; pinch = pDist(pts); return; }
    const el = e.target.closest('.node');
    sx = e.clientX; sy = e.clientY; moved = false;
    if (el) {
      node = nodeById(el.dataset.id); mmSelect(node.id);
      ox = node._x; oy = node._y; mode = 'node';
      const now = Date.now();
      if (now - lastTap < 320) { startRename(node.id); mode = null; }
      lastTap = now;
    } else { mode = 'pan'; ox = MM.view.tx; oy = MM.view.ty; }
    st.setPointerCapture(e.pointerId);
  });

  st.addEventListener('pointermove', e => {
    if (pts.has(e.pointerId)) pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (mode === 'pinch' && pts.size === 2) {
      const d = pDist(pts); if (pinch) mmZoom(d / pinch); pinch = d; return;
    }
    if (!mode || MM.editing) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (!moved && Math.abs(dx) + Math.abs(dy) < 5) return;
    if (!moved && mode === 'node') mmSnap();
    moved = true;
    if (mode === 'pan') { MM.view.tx = ox + dx; MM.view.ty = oy + dy; mmRender(); }
    else if (mode === 'node' && node && Can.edit()) {
      node.manual = true; node.x = ox + dx / MM.view.s; node.y = oy + dy / MM.view.s;
      node._x = node.x; node._y = node.y; mmRender();
      const over = dropTarget(e.clientX, e.clientY, node.id);
      $$('.node.hit').forEach(x => x.classList.remove('hit'));
      if (over) over.classList.add('hit');
    }
  });

  const end = e => {
    pts.delete(e.pointerId);
    if (mode === 'node' && node && moved) {
      const over = dropTarget(e.clientX, e.clientY, node.id);
      if (over) {
        const t = nodeById(over.dataset.id);
        if (t && t.id !== node.parent_id && !isDescendant(node.id, t.id)) {
          node.parent_id = t.id; node.manual = false; t.collapsed = false;
          node.order = childrenOf(t).length; toast('「' + t.title + '」の下に移しました');
        }
      }
      touchMap(MM.mapId); mmLayout(); mmRender();
      $$('.node.hit').forEach(x => x.classList.remove('hit'));
    }
    if (mode === 'node' && node && !moved && isMobile()) openDetail();
    mode = null; node = null; pinch = 0;
  };
  st.addEventListener('pointerup', end);
  st.addEventListener('pointercancel', end);
  st.addEventListener('wheel', e => { e.preventDefault(); const r = st.getBoundingClientRect(); mmZoom(e.deltaY < 0 ? 1.1 : 1 / 1.1, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
  st.addEventListener('dblclick', e => { const el = e.target.closest('.node'); if (el) startRename(el.dataset.id); });
}
function pDist(pts) { const a = Array.from(pts.values()); return Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y); }
function dropTarget(x, y, selfId) {
  const els = document.elementsFromPoint(x, y);
  for (const el of els) { const n = el.closest && el.closest('.node'); if (n && n.dataset.id !== selfId) return n; }
  return null;
}
document.addEventListener('keydown', e => {
  if (route.name !== 'map' || MM.editing) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (['input', 'textarea', 'select'].includes(tag)) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? mmRedo() : mmUndo(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd') { e.preventDefault(); mmDuplicate(); return; }
  if (!MM.sel) return;
  if (e.key === 'Tab') { e.preventDefault(); mmAddChild(); }
  else if (e.key === 'Enter') { e.preventDefault(); mmAddSibling(); }
  else if (e.key === 'F2') { e.preventDefault(); startRename(MM.sel); }
  else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); mmDelete(); }
  else if (e.key === ' ') { e.preventDefault(); const n = selNode(); if (childrenOf(n).length) { n.collapsed = !n.collapsed; Store.save(); mmLayout(); mmRender(); } }
});

const Gas = {
  url() { return (DB.settings.gas_url || '').trim(); },
  secret() { return (DB.settings.gas_secret || 'earthcom-mindflow').trim(); },
  ready() { return !!this.url(); },
  async call(mode, payload) {
    if (!this.ready()) throw new Error('GASのURLが未設定です');
    let res;
    try {
      res = await fetch(this.url(), {
        method: 'POST', redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ mode: mode, secret: this.secret() }, payload || {}))
      });
    } catch (e) { throw new Error('GASに接続できません。URLとデプロイ設定（アクセス＝全員）を確認してください'); }
    if (!res.ok) throw new Error('通信エラー (' + res.status + ')');
    const txt = await res.text();
    let d;
    try { d = JSON.parse(txt); }
    catch (e) { throw new Error('応答を読み取れません。デプロイの「アクセスできるユーザー」が全員か確認してください'); }
    if (!d.ok) throw new Error(d.error || '処理に失敗しました');
    return d;
  }
};

const Integrations = {
  get(kind) { return DB.integrations.find(i => i.kind === kind) || { kind, status: 'disconnected', last_sync: '' }; },
  connected(kind) { return this.get(kind).status === 'connected'; },
  mark(kind) { const i = DB.integrations.find(x => x.kind === kind); if (i) { i.status = 'connected'; i.last_sync = new Date().toISOString(); } },
  log(kind, status, message, title) {
    DB.sync_logs.unshift({ id: uid(), kind, at: new Date().toISOString(), status, message, payload_title: title || '' });
    DB.sync_logs = DB.sync_logs.slice(0, 100); Store.save();
  },
  connect(kind) { this.toggle(kind); },
  toggle(kind) {
    const i = DB.integrations.find(x => x.kind === kind); if (!i) return;
    if (i.status === 'connected') {
      if (confirm(i.name + 'の連携を解除しますか？　登録済みのデータは消えません。')) { i.status = 'disconnected'; Store.save(true); render(); }
      return;
    }
    if (kind === 'evernote') {
      i.status = 'connected'; i.last_sync = new Date().toISOString(); Store.save(true); render();
      toast('EvernoteのURL登録とインポートを有効にしました'); return;
    }
    if (!Gas.ready()) { toast('先に「GAS中継の設定」でURLを保存してください', 'err'); go('settings'); return; }
    i.status = 'connected'; i.last_sync = new Date().toISOString(); Store.save(true); render();
    toast(i.name + 'を連携しました');
  },
  /* --- カレンダー --- */
  async sendEvent(ev) {
    if (!this.connected('google_calendar') || !Gas.ready()) {
      ev.sync = 'pending'; this.log('google_calendar', 'queued', '未連携のためアプリ内に保留しました', ev.title);
      Store.save(true); toast('未連携のため、アプリ内に保存しました'); render(); return;
    }
    try {
      const d = await Gas.call('createEvent', { title: ev.title, start: ev.start, end: ev.end,
        location: ev.location, guests: ev.guests, detail: ev.detail, reminder: ev.reminder, map_url: ev.map_url });
      ev.gcal_event_id = d.eventId; ev.sync = 'synced';
      const n = nodeById(ev.node_id); if (n) n.gcal_event_id = d.eventId;
      this.mark('google_calendar'); this.log('google_calendar', 'sent', 'Googleカレンダーに登録しました', ev.title);
      Store.save(true); toast('Googleカレンダーに登録しました'); render();
    } catch (e) {
      ev.sync = 'error'; this.log('google_calendar', 'error', e.message, ev.title);
      Store.save(true); toast('カレンダー登録に失敗: ' + e.message, 'err'); render();
    }
  },
  async todayEvents() {
    const d = await Gas.call('listEvents', { date: today() });
    this.mark('google_calendar'); Store.save();
    return d.events || [];
  },
  /* --- Google ToDo --- */
  async sendToTasks(t) {
    if (t.gtask_id && !String(t.gtask_id).startsWith('pending-')) { toast('このタスクは送信済みです（重複作成しません）'); return; }
    if (!this.connected('google_tasks') || !Gas.ready()) {
      t.gtask_id = 'pending-' + t.id; this.log('google_tasks', 'queued', '未連携のためアプリ内に保留しました', t.title);
      Store.save(true); toast('未連携のため、アプリ内に保存しました'); return;
    }
    try {
      const d = await Gas.call('createTask', { title: t.title, due: t.due, notes: t.notes,
        map_url: location.origin + location.pathname + (t.map_id ? '#/map/' + t.map_id : '#/board') });
      t.gtask_id = d.taskId;
      this.mark('google_tasks'); this.log('google_tasks', 'sent', 'Google ToDoへ送信しました', t.title);
      Store.save(true); toast('Google ToDoへ送信しました'); render();
    } catch (e) {
      this.log('google_tasks', 'error', e.message, t.title); Store.save(true);
      toast('ToDo送信に失敗: ' + e.message, 'err');
    }
  },
  async syncDone(t, done) {
    if (!t.gtask_id || String(t.gtask_id).startsWith('pending-')) return;
    if (!this.connected('google_tasks') || !Gas.ready()) return;
    try {
      await Gas.call('completeTask', { taskId: t.gtask_id, done: done });
      this.mark('google_tasks'); this.log('google_tasks', 'sent', done ? 'ToDoを完了にしました' : 'ToDoを未完了に戻しました', t.title);
      Store.save();
    } catch (e) { this.log('google_tasks', 'error', e.message, t.title); Store.save(); }
  },
  /* Google ToDo側で完了したものをアプリへ取り込む */
  async pullTasks() {
    if (!Gas.ready()) { toast('GASのURLが未設定です', 'err'); return; }
    try {
      const d = await Gas.call('listTasks', {});
      let n = 0;
      (d.tasks || []).forEach(g => {
        const t = DB.tasks.find(x => x.gtask_id === g.id);
        if (!t) return;
        if (g.status === 'completed' && t.gtd !== 'done') { setGtd(t, 'done'); n++; }
      });
      this.mark('google_tasks'); Store.save(true); render();
      toast(n ? n + '件をToDo側の完了に合わせました' : '反映する変更はありませんでした');
    } catch (e) { toast('取得に失敗: ' + e.message, 'err'); }
  },
  /* 保留・失敗分の再送 */
  async resyncAll() {
    if (!Gas.ready()) { toast('GASのURLが未設定です', 'err'); return; }
    const evs = DB.calendar_events.filter(e => e.sync !== 'synced');
    const ts = DB.tasks.filter(t => String(t.gtask_id || '').startsWith('pending-'));
    if (!evs.length && !ts.length) { toast('再同期する保留はありません'); return; }
    for (const e of evs) await this.sendEvent(e);
    for (const t of ts) { t.gtask_id = ''; await this.sendToTasks(t); }
    toast('再同期しました');
  },
  push(kind, payload) { this.log(kind, 'queued', 'アプリ内に保存しました', payload.title || ''); }
};
async function saveGas() {
  DB.settings.gas_url = $('#gasU').value.trim();
  DB.settings.gas_secret = $('#gasS').value.trim() || 'earthcom-mindflow';
  Store.save(true);
  if (!Gas.ready()) { toast('URLを入力してください', 'err'); return; }
  toast('接続を確認しています…');
  try {
    const d = await Gas.call('ping', {});
    Integrations.mark('google_calendar'); Integrations.mark('google_tasks');
    Integrations.log('gas', 'sent', '接続テストに成功しました（' + (d.tz || '') + '）', '');
    Store.save(true); render(); toast('接続できました。カレンダーとToDoを連携済みにしました');
  } catch (e) {
    Integrations.log('gas', 'error', e.message, ''); Store.save(true); render();
    toast('接続できません: ' + e.message, 'err');
  }
}

function bindBoard() {
  let dragId = '';
  $$('#board .tcard').forEach(el => {
    el.addEventListener('dragstart', e => { dragId = el.dataset.id; el.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; });
    el.addEventListener('dragend', () => { el.classList.remove('drag'); dragId = ''; });
  });
  $$('#board .col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', () => col.classList.remove('over'));
    col.addEventListener('drop', e => {
      e.preventDefault(); col.classList.remove('over');
      const t = taskById(dragId); if (!t || !requireEdit()) return;

function quickVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('この端末は音声入力に未対応です。テキストで入力してください', 'err'); quickText(); return; }
  openModal('音声で入力', '<div class="load" id="vS">🎙 話してください…</div><div class="field"><label>認識結果</label><textarea id="vT"></textarea></div>',
    [{ label: 'Inboxに入れる', cls: 'pri', fn: () => {

      mkTask({ title: v, gtd: 'inbox', source: 'voice' }); closeModal(); render(); toast('Inboxに入れました');
    } }]);
  try {
    const r = new SR(); r.lang = 'ja-JP'; r.interimResults = true; r.continuous = true;
    r.onresult = e => { let s = ''; for (let i = 0; i < e.results.length; i++) s += e.results[i][0].transcript; const el = $('#vT'); if (el) el.value = s; };
    r.onerror = ev => { const el = $('#vS'); if (el) el.textContent = '音声を取得できませんでした（' + ev.error + '）。テキストで入力してください。'; };
    r.onend = () => { const el = $('#vS'); if (el) el.textContent = '認識を終了しました。内容を確認して登録してください。'; };
    r.start(); window._sr = r;
  } catch (e) { toast('音声入力を開始できませんでした', 'err'); }

function quickFile(kind) {
  const inp = document.createElement('input'); inp.type = 'file';
  if (kind === 'camera') { inp.accept = 'image/*'; inp.capture = 'environment'; }
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const a = { id: uid(), name: f.name, size: f.size, type: f.type, at: new Date().toISOString(), data: '' };
    const done = () => {
      DB.attachments.unshift(a);
      const t = mkTask({ title: f.name, gtd: 'inbox', source: kind, notes: '添付: ' + f.name });
      t.attachment_id = a.id; Store.save(true); closeModal(); render(); toast('Inboxに入れました');
    };
    if (f.type.startsWith('image/') && f.size < 400000) { const r = new FileReader(); r.onload = () => { a.data = r.result; done(); }; r.readAsDataURL(f); }
    else done();
  };
  inp.click();
}

function decEnt(t) {
  return String(t).replace(/<!\[CDATA\[|\]\]>/g, '')
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"')
    .replace(/&#39;|&apos;/g, "'").replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&');
}
let _enex = [];
function parseEnex(txt, fname) {
  _enex = [];
  const re = /<note>([\s\S]*?)<\/note>/g; let m;
  while ((m = re.exec(txt)) && _enex.length < 2000) {
    const blk = m[1];
    const t = (blk.match(/<title>([\s\S]*?)<\/title>/) || [])[1] || '（無題）';
    const c = (blk.match(/<content>([\s\S]*?)<\/content>/) || [])[1] || '';
    const u = (blk.match(/<source-url>([\s\S]*?)<\/source-url>/) || [])[1] || '';
    const d = (blk.match(/<created>([\s\S]*?)<\/created>/) || [])[1] || '';
    _enex.push({
      title: decEnt(t).trim() || '（無題）',
      body: decEnt(c.replace(/<[^>]+>/g, ' ')).replace(/\s+/g, ' ').trim().slice(0, 300),
      url: decEnt(u).trim(),
      created: d ? d.slice(0, 4) + '-' + d.slice(4, 6) + '-' + d.slice(6, 8) : ''
    });
  }
  closeModal();
  if (!_enex.length) { toast('ノートが見つかりませんでした。ENEX形式で書き出されているか確認してください', 'err'); return; }
  openModal('取り込みの確認',

    '<div class="small muted" style="margin-bottom:6px">先頭10件のプレビュー</div>' +
    '<div style="max-height:34vh;overflow:auto">' + _enex.slice(0, 10).map(n =>
      '<div class="sugg"><div class="s-t">' + esc(n.title) + '</div><div class="small muted">' + esc(n.body.slice(0, 70)) + '</div></div>').join('') + '</div>',
    [{ label: 'この内容で取り込む', cls: 'pri', fn: () => {
      const g = $('#enG').value, withBody = $('#enB').value === '1';
      _enex.forEach(n => mkTask({ title: n.title, gtd: g, notes: withBody ? n.body : '',
        evernote_url: n.url, source: 'evernote' }));
      Store.save(true); closeModal(); render(); toast(_enex.length + '件を' + GTD[g].label + 'に取り込みました'); _enex = [];
    } }, { label: 'やめる', fn: () => { _enex = []; closeModal(); } }]);
}

/* ---- 期・期間の計算 ---- */
function fiscalOf(d) {                       // 'YYYY-MM-DD' → {fy, q, term}
  const y = +d.slice(0, 4), m = +d.slice(5, 7);
  const fy = m >= 12 ? y + 1 : y;
  const q = Math.floor(((m - 12 + 12) % 12) / 3) + 1;
  return { fy: fy, q: q, term: fy - 2008 };
}
function fyMonths(fy) {                      // 期首12月からの12ヶ月 ['2025-12', ...]
  const out = [];
  for (let i = 0; i < 12; i++) { const m = (11 + i) % 12; const y = m >= 11 ? fy - 1 : fy; out.push(y + '-' + String(m + 1).padStart(2, '0')); }
  return out;
}
function quarterMonths(fy, q) { return fyMonths(fy).slice((q - 1) * 3, (q - 1) * 3 + 3); }
function monthDays(ym) {
  const y = +ym.slice(0, 4), m = +ym.slice(5, 7), last = new Date(y, m, 0).getDate(), out = [];
  for (let d = 1; d <= last; d++) out.push(ym + '-' + String(d).padStart(2, '0'));
  return out;
}
function mondayOf(d) { const t = new Date(d + 'T00:00:00'); const w = (t.getDay() + 6) % 7; t.setDate(t.getDate() - w); return t.toISOString().slice(0, 10); }
function weekDays(mon) { return [0, 1, 2, 3, 4, 5, 6].map(i => addDays(mon, i)); }
function wdName(d) { return ['月', '火', '水', '木', '金', '土', '日'][(new Date(d + 'T00:00:00').getDay() + 6) % 7]; }
function hm(t) { return (t || '').slice(11, 16); }
function minOf(t) { const s = hm(t); return s ? +s.slice(0, 2) * 60 + +s.slice(3, 5) : 0; }
function dOf(t) { return (t || '').slice(0, 10); }
function addMin(t, n) {
  const d = new Date(t.replace(' ', 'T')); d.setMinutes(d.getMinutes() + n);
  const p = x => String(x).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function durMin(ev) { return Math.max(0, (new Date(ev.end.replace(' ', 'T')) - new Date(ev.start.replace(' ', 'T'))) / 60000); }

function calInit() {
  if (!DB.strategy) DB.strategy = { years: [], quarters: [], months: [], weeks: [], days: [], roadmap: [] };
  const s = DB.strategy;
  ['years', 'quarters', 'months', 'weeks', 'days', 'roadmap'].forEach(k => { if (!Array.isArray(s[k])) s[k] = []; });
  if (!DB.capacity) DB.capacity = {};
  DB.capacity = Object.assign({ start: '08:00', end: '19:00', bufferPct: 20, dayStart: 4, dayEnd: 23,
    workDays: [1, 2, 3, 4, 5], importFrom: '', importTo: '' }, DB.capacity);
  DAY_START = Math.max(0, Math.min(12, +DB.capacity.dayStart || 4));
  DAY_END = Math.max(DAY_START + 4, Math.min(24, +DB.capacity.dayEnd || 23));
  DB.calendar_events.forEach(evNorm);
}
function evNorm(e) {
  if (!e.type) e.type = e.source === 'google' ? 'google' : 'meeting';
  if (!e.internal_event_id) e.internal_event_id = e.id;
  if (!e.google_calendar_id) e.google_calendar_id = 'primary';

/* ---- 予定の取得 ---- */
function evOfDay(d) { return DB.calendar_events.filter(e => dOf(e.start) === d).sort((a, b) => minOf(a.start) - minOf(b.start)); }
function evOfRange(from, to) { return DB.calendar_events.filter(e => dOf(e.start) >= from && dOf(e.start) <= to); }
function evOfMonth(ym) { return DB.calendar_events.filter(e => (e.start || '').slice(0, 7) === ym); }

/* ---- 重複・競合・入力ミスの検査 ---- */
function normTitle(t) { return String(t || '').replace(/[\s　・（）()【】]/g, '').toLowerCase(); }
function checkEvent(ev) {
  const dups = [], conf = [], warns = [];
  const others = DB.calendar_events.filter(e => e.id !== ev.id);
  const s = minOf(ev.start), e2 = minOf(ev.end), d = dOf(ev.start);

  others.forEach(o => {
    if (ev.google_event_id && o.google_event_id && ev.google_event_id === o.google_event_id) dups.push({ ev: o, why: '同じGoogleイベントIDです' });
    else if (o.content_hash === evHash(ev)) dups.push({ ev: o, why: 'タイトル・日時・参加者が同一です' });
    else if (dOf(o.start) === d && normTitle(o.title) === normTitle(ev.title)) dups.push({ ev: o, why: '同じ日に同じ内容の予定があります' });
    else if (dOf(o.start) === d && normTitle(o.title).length > 3 &&
      (normTitle(o.title).includes(normTitle(ev.title)) || normTitle(ev.title).includes(normTitle(o.title)))) dups.push({ ev: o, why: 'タイトルが似ています' });
  });

  evOfDay(d).filter(o => o.id !== ev.id && o.type !== 'deadline' && o.type !== 'reminder').forEach(o => {
    const os = minOf(o.start), oe = minOf(o.end);
    if (s < oe && e2 > os) conf.push({ ev: o, why: (s === os && e2 === oe) ? '完全に重なっています' : '時間が一部重なっています' });
    else if (ev.type !== 'move' && o.type !== 'move') {
      const gap = s >= oe ? s - oe : os - e2;
      if (gap >= 0 && gap < 15 && (o.location || ev.location) && (o.location || '') !== (ev.location || '')) conf.push({ ev: o, why: '場所が違うのに移動時間が' + gap + '分しかありません' });
      else if (gap >= 0 && gap < 5) conf.push({ ev: o, why: '前後に余白がありません（連続' + gap + '分）' });
    }
    if (o.url_online && ev.url_online) {
      const gap = s >= oe ? s - oe : os - e2;
      if (gap >= 0 && gap < 10) conf.push({ ev: o, why: 'オンライン会議が連続しています' });
    }
  });

  if (e2 <= s) warns.push('終了時間が開始時間より前、または同じです');
  if (d < today()) warns.push('過去の日付に登録しようとしています');
  if (e2 - s > 480) warns.push('所要時間が8時間を超えています');
  const wd = wdName(d);
  const m = String(ev.title).match(/([月火水木金土日])曜/);
  if (m && m[1] !== wd) warns.push('タイトルに「' + m[1] + '曜」とありますが、選んだ日は' + wd + '曜です');
  if (!ev.purpose) warns.push('目的が未設定です（何のための予定か分からなくなります）');
  if (!ev.goal_ref && !ev.project_id) warns.push('関連する目標・プロジェクトが未設定です');
  if (!ev.owner) warns.push('担当者が未設定です');
  if (['meeting', 'sales'].includes(ev.type) && !ev.location && !ev.url_online) warns.push('場所またはオンラインURLが未設定です');
  if (!ev.reminder) warns.push('通知が未設定です');
  const cap = DB.capacity;
  if (hm(ev.start) < cap.start || hm(ev.end) > cap.end) warns.push('稼働時間（' + cap.start + '〜' + cap.end + '）の外です');
  return { dups: dups, conf: conf, warns: warns };
}

/* ---- キャパシティ ---- */
function capacityOf(days) {
  const cut = 12 * 60;   /* 終日・12時間超の予定は「枠」ではないので時間に数えない */
  const evs = DB.calendar_events.filter(e => days.includes(dOf(e.start)) && !['deadline', 'reminder'].includes(e.type) &&
    !e.allDay && durMin(e) > 0 && durMin(e) <= cut);
  const by = {}; let total = 0;
  evs.forEach(e => { const m = durMin(e); by[e.type] = (by[e.type] || 0) + m; total += m; });
  const cap = DB.capacity;
  const perDay = (+cap.end.slice(0, 2) * 60 + +cap.end.slice(3)) - (+cap.start.slice(0, 2) * 60 + +cap.start.slice(3));
  const wd = cap.workDays || [1, 2, 3, 4, 5];
  const avail = perDay * days.filter(d => wd.includes(new Date(d + 'T00:00:00').getDay())).length;
  const need = unplacedTasks().filter(t => days.includes(t.due)).length * 60;
  const allday = DB.calendar_events.filter(e => days.includes(dOf(e.start)) && (e.allDay || durMin(e) > cut)).length;
  return { by: by, total: total, avail: avail, rate: avail ? Math.round(total / avail * 100) : 0,
    free: Math.max(0, avail - total), need: need, allday: allday };
}
/* 期限はあるが、実行する時間が確保されていないタスク */
function unplacedTasks() {
  return DB.tasks.filter(t => t.gtd !== 'done' && ['next', 'today', 'calendar', 'project'].includes(t.gtd) &&
    !DB.calendar_events.some(e => e.task_id === t.id));
}

/* ---- 四半期 ---- */
function calQuarter(cur) {
  const f = fiscalOf(cur), q = qOf(f.fy, f.q), ms = quarterMonths(f.fy, f.q);
  const evs = evOfRange(ms[0] + '-01', monthDays(ms[2]).slice(-1)[0]).filter(e => !['deadline', 'reminder', 'private'].includes(e.type));
  const unlinked = evs.filter(e => !e.project_id && !e.goal_ref);

        '<div><div class="small muted">今月達成すべき成果</div><div style="white-space:pre-wrap">' + (m.outcomes ? esc(m.outcomes) : '<span class="small muted">未設定</span>') + '</div></div>' +

/* ---- 週間（実行管理の中心） ---- */
function calWeek(cur) {
  const mon = mondayOf(cur), days = weekDays(mon), w = wOf(mon), cap = capacityOf(days);
  const evs = evOfRange(mon, addDays(mon, 6)).filter(evVisible);
  const od = overdue(), wait = tasksIn('waiting'), un = unplacedTasks();
  const hours = [];
  for (let h = DAY_START; h <= DAY_END; h++) hours.push(h);

  const col = d => {
    const list = evs.filter(e => dOf(e.start) === d);
    return '<div class="wk-col' + (d === today() ? ' today' : '') + '" data-day="' + d + '" ondragover="event.preventDefault();this.classList.add(\'over\')" ondragleave="this.classList.remove(\'over\')" ondrop="dropWeek(event,this)">' +
      hours.map(h => '<div class="wk-slot" data-h="' + h + '"></div>').join('') +
      list.map(e => {
        const top = (minOf(e.start) - DAY_START * 60) / 60 * SLOT_H;
        const hgt = Math.max(18, durMin(e) / 60 * SLOT_H - 2);
        const t = ETYPE[e.type] || ETYPE.meeting;
        const g = e.type === 'google';
        return '<div class="wk-ev' + (g ? ' gg' : '') + '" style="top:' + top + 'px;height:' + hgt + 'px;background:' + (g ? '#fff' : t.c) + ';' +
          (g ? 'border:1px solid var(--blue);color:var(--ink)' : '') + '" onclick="openEvent(\'' + e.id + '\')">' +
          '<b>' + hm(e.start) + ' ' + esc(e.title) + '</b>' +
          (hgt > 40 ? '<span>' + esc(t.l) + (e.location ? ' / ' + esc(e.location) : '') + '</span>' : '') + '</div>';
      }).join('') + '</div>';
  };

  return '<div class="grid g4 keep2" style="margin-bottom:12px">' +
      '<div class="card pad" style="grid-column:span 2"><div class="small muted">今週の最重要ゴール</div>' +
        '<b style="font-size:16px">' + (w.goal ? esc(w.goal) : '未設定') + '</b>' +
        '<div class="small muted" style="margin-top:8px">今週完了させる3つの成果</div>' +
        '<div style="white-space:pre-wrap" class="small">' + (w.three ? esc(w.three) : '未設定') + '</div>' +
        '<button class="btn sm" style="margin-top:8px" onclick="editWeek()">編集</button></div>' +
      '<div class="card kpi"><div class="lab">稼働率</div><div class="num ' + (cap.rate > 85 ? 'red' : cap.rate > 60 ? 'orange' : 'green') + '">' + (cap.avail ? cap.rate + '%' : '—') + '</div>' +
        '<div class="sub">' + (cap.avail ? '空き ' + Math.round(cap.free / 60) + 'h ／ 推奨バッファ ' + DB.capacity.bufferPct + '%' : 'この週に稼働日がありません（期間設定で変更）') + '</div></div>' +
      '<div class="card kpi"><div class="lab">要注意</div><div class="num ' + (od.length ? 'red' : '') + '">' + od.length + '</div>' +
        '<div class="sub">期限超過 ／ 連絡待ち' + wait.length + ' ／ 未配置' + un.length + '</div></div>' +
    '</div>' +
    (cap.avail && cap.rate > 85 ? '<div class="err">今週の稼働率が' + cap.rate + '%です。予定を詰めすぎると、突発対応で計画が崩れます。' + DB.capacity.bufferPct + '%は空けてください。' +
      (cap.allday ? '（終日・長時間の予定' + cap.allday + '件は時間に数えていません）' : '') + '</div>' : '') +
    '<div class="wk-wrap"><div class="wk-side">' +
      '<div class="small muted" style="margin-bottom:6px">未配置タスク（実行時間が未確保）</div>' +
      (un.length ? un.slice(0, 20).map(t => '<div class="wk-chip' + (DB.settings.pickTask === t.id ? ' pick' : '') + '" draggable="true" data-tid="' + t.id + '" onclick="pickTask(\'' + t.id + '\')">' +
        esc(t.title) + '<span class="small muted">' + (t.due ? '期限 ' + fmtDate(t.due) : '期限なし') + '</span></div>').join('')
        : '<div class="small muted">すべて時間が確保されています</div>') +
      '<div class="small muted" style="margin-top:10px">' + (isMobile() ? 'タップして選び、置きたい時間をタップ' : 'ドラッグして時間枠へ置く') + '</div>' +
      '</div>' +
      '<div class="wk-grid">' +
        '<div class="wk-hours"><div class="wk-corner"></div>' + hours.map(h => '<div class="wk-h">' + h + ':00</div>').join('') + '</div>' +
        '<div class="wk-cols"><div class="wk-heads">' + days.map(d => '<div class="wk-head' + (d === today() ? ' today' : '') + '" onclick="jumpTo(\'day\',\'' + d + '\')">' +
          wdName(d) + ' <span>' + (+d.slice(8)) + '</span></div>').join('') + '</div>' +
          '<div class="wk-body">' + days.map(col).join('') + '</div></div>' +
      '</div>' +
    '</div>' +
    '<div class="small muted" style="margin-top:8px">' + Object.keys(ETYPE).map(k => '<span class="chip" style="background:' + ETYPE[k].c + (k === 'google' ? ';border:1px solid var(--blue)' : '') + ';color:' + (['buffer', 'google', 'private', 'tentative'].includes(k) ? 'var(--ink)' : '#fff') + '">' + ETYPE[k].l + '</span>').join(' ') + '</div>';
}
function pickTask(id) { DB.settings.pickTask = DB.settings.pickTask === id ? '' : id; Store.save(); render(); }
function bindWeek() {
  $$('.wk-chip').forEach(el => el.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', 't:' + el.dataset.tid)));
  $$('.wk-col').forEach(col => col.addEventListener('click', e => {
    if (e.target.closest('.wk-ev')) return;
    const r = col.getBoundingClientRect();
    const h = Math.floor((e.clientY - r.top) / SLOT_H) + DAY_START;
    const tid = DB.settings.pickTask;
    if (tid) { placeTask(tid, col.dataset.day, h); DB.settings.pickTask = ''; }
    else openEvent('', col.dataset.day, h);
  }));
}
function dropWeek(e, col) {
  e.preventDefault(); col.classList.remove('over');
  const data = e.dataTransfer.getData('text/plain') || '';
  const r = col.getBoundingClientRect();
  const h = Math.floor((e.clientY - r.top) / SLOT_H) + DAY_START;
  if (data.startsWith('t:')) placeTask(data.slice(2), col.dataset.day, h);
}
function placeTask(tid, day, hour) {
  const t = taskById(tid); if (!t || !requireEdit()) return;
  const start = day + 'T' + String(Math.max(DAY_START, Math.min(DAY_END - 1, hour))).padStart(2, '0') + ':00';
  openEvent('', day, hour, {
    title: t.title, type: 'focus', task_id: t.id, project_id: t.project_id, owner: t.owner || (DB.user || {}).name || '',
    purpose: t.notes || '', start: start, end: addMin(start, 60)
  });
}

function imPreset(k) {

async function pullRange(from, to, silent) {
  if (!Gas.ready()) { closeModal(); toast('GASのURLが未設定です', 'err'); go('settings'); return { added: 0, updated: 0, err: 1 }; }
  if (!from || !to || to < from) { toast('期間を正しく指定してください', 'err'); return { added: 0, updated: 0, err: 1 }; }
  const days = [];
  for (let d = from; d <= to && days.length < 186; d = addDays(d, 1)) days.push(d);
  DB.capacity.importFrom = from; DB.capacity.importTo = to; Store.save();
  let added = 0, updated = 0, err = 0, i = 0;
  const prog = () => { const el = $('#imProg'); if (el) el.innerHTML = '<div class="load">' + i + ' / ' + days.length + ' 日を確認中… 追加' + added + '件</div>'; if (silent && i % 20 === 0) toast('同期中… ' + i + '/' + days.length + '日'); };
  prog();
  for (const d of days) {
    i++;
    try {
      const r = await Gas.call('listEvents', { date: d });
      (r.events || []).forEach(g => {
        const ex = DB.calendar_events.find(x => x.google_event_id === g.id);
        if (ex) {
          if (ex.start !== g.start || ex.end !== g.end || ex.title !== g.title) {
            if (ex.source === 'google') { ex.title = g.title; ex.start = g.start; ex.end = g.end; ex.location = g.location || ''; }
            else { ex.sync_status = 'gchanged'; ex.google_snapshot = g; }
            updated++;
          }
          return;
        }
        DB.calendar_events.unshift(evNorm({ id: uid(), title: g.title, start: g.start, end: g.end, location: g.location || '',
          type: 'google', source: 'google', google_event_id: g.id, sync_status: 'synced', sync: 'synced', owner: '',
          purpose: '', allDay: !!g.allDay, last_synced_at: new Date().toISOString() }));
        added++;
      });
    } catch (e) { err++; }
    if (i % 5 === 0) { prog(); Store.save(); }
  }
  Integrations.mark('google_calendar');
  Integrations.log('google_calendar', err ? 'error' : 'sent', fmtDate(from) + '〜' + fmtDate(to) + ' を取り込み（追加' + added + '・更新' + updated + '・失敗' + err + '）', '');
  DB.capacity.lastSync = new Date().toISOString();
  Store.save(true);
  if (!silent) { closeModal(); render(); toast(fmtDate(from) + '〜' + fmtDate(to) + '：追加' + added + '件・更新' + updated + '件' + (err ? '・失敗' + err + '日' : '')); }
  return { added: added, updated: updated, err: err };
}

/* ---- ワンボタン同期：取り込み・送信・ToDo完了反映をまとめて実行 ---- */
function syncRange() {
  const c = DB.capacity || {};
  if (c.syncMode === 'fixed' && c.syncFrom && c.syncTo) return { from: c.syncFrom, to: c.syncTo };
  const back = c.syncBack == null ? 14 : +c.syncBack, ahead = c.syncAhead == null ? 60 : +c.syncAhead;
  return { from: addDays(today(), -back), to: addDays(today(), ahead) };
}
let _syncing = false;
async function syncNow(silent) {
  calInit();
  if (_syncing) return;
  if (!Gas.ready()) { toast('GASのURLが未設定です', 'err'); go('settings'); return; }
  if (!Integrations.connected('google_calendar')) Integrations.mark('google_calendar');
  _syncing = true;
  const btn = $('#syncBtn'); if (btn) { btn.classList.add('spin'); btn.textContent = '同期中…'; }
  const r = syncRange();
  if (!silent) toast(fmtDate(r.from) + '〜' + fmtDate(r.to) + ' を同期しています…');
  let pushed = 0, failed = 0;
  try {
    /* ① MIND FLOW → Google（未同期・保留・失敗分） */
    const outbox = DB.calendar_events.filter(e => e.source !== 'google' && e.sync_to_google !== false &&
      ETYPE[e.type] && ETYPE[e.type].sync && ['local', 'pending', 'error'].includes(e.sync_status) &&
      dOf(e.start) >= r.from && dOf(e.start) <= r.to);
    for (const e of outbox) { await syncEvent(e); (e.sync_status === 'synced' ? pushed++ : failed++); }
    /* ② Google → MIND FLOW */
    const pull = await pullRange(r.from, r.to, true);
    /* ③ Google ToDo の完了を取り込む */
    let doneN = 0;
    if (Integrations.connected('google_tasks')) {
      try {
        const d = await Gas.call('listTasks', {});
        (d.tasks || []).forEach(g => {
          const t = DB.tasks.find(x => x.gtask_id === g.id);
          if (t && g.status === 'completed' && t.gtd !== 'done') { setGtd(t, 'done'); doneN++; }
        });
      } catch (e) { failed++; }
    }
    DB.capacity.lastSync = new Date().toISOString();
    Integrations.mark('google_calendar');
    Integrations.log('google_calendar', failed ? 'error' : 'sent',
      '同期 ' + fmtDate(r.from) + '〜' + fmtDate(r.to) + '（送信' + pushed + '・取込' + pull.added + '・更新' + pull.updated + '・ToDo完了' + doneN + (failed ? '・失敗' + failed : '') + '）', '');
    Store.save(true); render();
    toast('同期しました：送信' + pushed + '件／取込' + pull.added + '件／更新' + pull.updated + '件' + (doneN ? '／ToDo完了' + doneN + '件' : ''));
  } catch (e) {
    toast('同期に失敗: ' + e.message, 'err');
  }
  _syncing = false;
}

function calConflicts() {

  });

    for (let j = i + 1; j < evs.length; j++) {

      if (['deadline', 'reminder'].includes(e.type) || ['deadline', 'reminder'].includes(o.type)) continue;
      if (minOf(e.start) < minOf(o.end) && minOf(e.end) > minOf(o.start)) confs.push([e, o]);

    '<div style="flex:1;min-width:180px"><b>' + esc(a.title) + '</b><div class="small muted">' + fmtDate(dOf(a.start)) + ' ' + hm(a.start) + '〜' + hm(a.end) + ' ／ ' + esc(ETYPE[a.type].l) + ' ／ ' + syncLabel(a) + '</div></div>' +

function wdDate(w) {                       // 「月曜日」→ 直近の未来のその曜日（過去日にしない）
  const i = ['月', '火', '水', '木', '金', '土', '日'].indexOf(w);
  if (i < 0) return today();
  let d = addDays(mondayOf(today()), i);
  if (d < today()) d = addDays(d, 7);
  return d;
}
function relDate(t) {                      // 相対表現 → 具体日付
  if (/今日|本日/.test(t)) return today();
  if (/明日/.test(t)) return addDays(today(), 1);
  if (/明後日/.test(t)) return addDays(today(), 2);
  if (/今週末|週末/.test(t)) { const d = addDays(mondayOf(today()), 5); return d < today() ? addDays(d, 7) : d; }
  if (/今週/.test(t)) { const d = addDays(mondayOf(today()), 4); return d < today() ? addDays(d, 7) : d; }
  if (/来週/.test(t)) return addDays(mondayOf(today()), 11);
  if (/今月末|月末/.test(t)) return monthDays(today().slice(0, 7)).slice(-1)[0];
  const m = t.match(/(\d{1,2})月(\d{1,2})日/);
  if (m) return today().slice(0, 4) + '-' + String(+m[1]).padStart(2, '0') + '-' + String(+m[2]).padStart(2, '0');
  const w = t.match(/([月火水木金土日])曜/);
  if (w) return wdDate(w[1]);
  return '';
}

  const t = text.replace(/\s+/g, ' ');

  const NG = /蓄電池|太陽光|セカンダリ|リフォート|ReFort|開発|各自|合計|目標|売上|粗利|受注|利益|案件|有効|以上|今週|来週|今月|今期|全社|会社/;
  const re = /([一-龥]{2,5}|[ァ-ヶ]{2,6})\s*(?:が|は)?\s*([\d.]+)\s*億/g; let m;
  while ((m = re.exec(t))) {
    const nm = m[1];
    if (NG.test(nm)) continue;
    if (owners.some(o => o.name === nm)) continue;
    owners.push({ name: nm, amount: +m[2] });

  const theme = (t.match(/(蓄電池|ReFort|セカンダリー|太陽光|開発|採用)/) || ['案件'])[0];

  const plan = blankPlan(text);

    amount: o.amount, done_condition: (judge[0] || '申込書受領') + '・' + (judge[1] || '契約書締結') + 'のいずれかを' + fmtDate(due) + 'までに満たす',
    start: today(), due: due, risks: '有効案件の不足／決裁者に会えない', backup: 'バックアップ案件を' + Math.max(1, Math.round(o.amount)) + '件確保する' }));

  const weekPlan = [
    ['月', '案件一覧を抽出し、A・B・Cへ分類する', 120, 1, '分類済みリストと商談日程が確定している'],

    ['水', '契約書案を送付する', 60, 2, '契約書案の送付が完了している'],

  plan.todos = [];

      count_to: o.name, joint: false, assumed: ['name', 'amount', 'decider'] });

  return plan;
}

/* ---- AI解析（失敗時はルールベースへフォールバック） ---- */

    if (d && d.goal && Array.isArray(d.todos) && d.todos.length) {
      const p = blankPlan(text); p.engine = 'ai';
      p.goal = Object.assign({ judge: [], constraints: [] }, d.goal);
      p.owners = d.owners || base.owners; p.kpis = d.kpis || []; p.pipeline = d.pipeline || base.pipeline;
      p.projects = (d.projects || base.projects).map((x, i) => Object.assign({ tmp: 'p' + i }, x));
      p.todos = d.todos.map((x, i) => Object.assign({ tmp: 't' + i, minutes: 60, priority: 2, to_gtasks: true, to_cal: true, assumed: [] }, x));

}
/* ---- 空き時間へ配置 ---- */
function placeEvents(plan) {
  plan.events.forEach(ev => {
    if (ev.type === 'deadline') return;
    if (ev.start) return;
    const d = ev.date || today();
    const dur = ev.minutes || 60;
    let put = '';
    for (let h = 9; h <= 17 && !put; h++) {
      for (const mm of [0, 30]) {
        const s = h * 60 + mm, e = s + dur;
        if (e > 18 * 60) continue;
        const busy = evOfDay(d).some(o => !['deadline', 'reminder'].includes(o.type) && s < minOf(o.end) && e > minOf(o.start));
        const taken = plan.events.some(o => o !== ev && o.date === d && o.start && (s < minOf(d + 'T' + o.start) + (o.minutes || 60) && e > minOf(d + 'T' + o.start)));
        if (!busy && !taken) { put = String(h).padStart(2, '0') + ':' + String(mm).padStart(2, '0'); break; }
      }
    }
    ev.start = put || '09:00';
    if (!put) ev.warn = 'その日に空きがありません（要調整）';
  });
  return plan;
}
/* ---- 承認前チェック ---- */
function planCheck(plan) {
  const dups = [], confs = [];
  plan.todos.forEach(t => {
    const hit = DB.tasks.find(x => x.gtd !== 'done' && normTitle(x.title) === normTitle(t.title) && (x.owner || '') === (t.owner || ''));
    if (hit) dups.push({ kind: 'ToDo', title: t.title, why: '同じ行動が既に登録されています' });
  });
  plan.events.forEach(ev => {
    const start = ev.date + 'T' + (ev.start || '09:00');
    const cand = { id: 'tmp', title: ev.title, start: start, end: addMin(start, ev.minutes || 60), type: ev.type, location: '', guests: '' };
    const r = checkEvent(cand);
    r.dups.forEach(x => dups.push({ kind: '予定', title: ev.title, why: x.why + '（' + x.ev.title + '）' }));
    r.conf.forEach(x => confs.push({ kind: '予定', title: ev.title, why: x.why + '：' + x.ev.title }));
  });
  const owners = {};
  plan.opps.forEach(o => { const k = normTitle(o.name); owners[k] = (owners[k] || 0) + 1; });
  Object.keys(owners).forEach(k => { if (owners[k] > 1) dups.push({ kind: '案件', title: k, why: '同じ案件名が複数あり、二重計上のおそれがあります' }); });
  const days = Array.from(new Set(plan.events.map(e => e.date)));
  const need = plan.todos.reduce((a, t) => a + (t.minutes || 0), 0);
  const cap = capacityOf(days.length ? days : [today()]);
  return { dups: dups, confs: confs, needH: Math.round(need / 6) / 10, freeH: Math.round(cap.free / 6) / 10, rate: cap.rate };
}

function planItem(tmp) {
  return PLAN.todos.find(x => x.tmp === tmp) || PLAN.events.find(x => x.tmp === tmp) ||
    PLAN.projects.find(x => x.tmp === tmp) || PLAN.opps.find(x => x.tmp === tmp);
}
function planSel(tmp, on) { PLAN.selected[tmp] = on; Store.save(); }
function planEdit(tmp, f, v) {
  const it = planItem(tmp); if (!it) return;
  it[f] = (['minutes', 'priority', 'amount', 'prob'].includes(f)) ? (+v || 0) : v;
  if (it.assumed) it.assumed = it.assumed.filter(a => a !== f);
  if (f === 'rank' && RANK[v]) it.prob = RANK[v].p;
  const ev = PLAN.events.find(e => e.todo === tmp);
  if (ev) { if (f === 'due') ev.date = v; if (f === 'minutes') ev.minutes = +v; if (f === 'title') ev.title = v; }
  Store.save();
}
function planRePlace() { PLAN.events.forEach(e => { if (e.type !== 'deadline') e.start = ''; }); placeEvents(PLAN); Store.save(true); render(); toast('空き時間へ再配置しました'); }
function planAddOpp() {
  const tmp = 'o' + uid();
  PLAN.opps.push({ tmp: tmp, name: '', owner: PLAN.owners[0] ? PLAN.owners[0].name : '', amount: 0, rank: 'B', prob: 45,
    phase: '棚卸し', decider: '', next_action: '', next_meeting: '', contract_date: '', payment_date: '', count_to: PLAN.owners[0] ? PLAN.owners[0].name : '', joint: false, assumed: [] });
  PLAN.selected[tmp] = true; Store.save(true); render();
}
function planDraft() { PLAN.status = 'draft'; Store.save(true); toast('下書きとして保存しました'); }

/* ---- STEP4：承認 ---- */
function aiStep4() {
  if (!PLAN) return aiStep2();
  const c = planCheck(PLAN);
  const n = k => PLAN[k].filter(x => PLAN.selected[x.tmp]).length;
  const evs = PLAN.events.filter(x => PLAN.selected[x.tmp]);
  const sum = [['ゴール', PLAN.goal.title ? 1 : 0], ['KPI', PLAN.kpis.length], ['プロジェクト', n('projects')], ['案件', n('opps')],
    ['ToDo', n('todos')], ['カレンダー予定', evs.filter(e => e.type !== 'deadline').length], ['締切', evs.filter(e => e.type === 'deadline').length],
    ['未確定項目', PLAN.missing.length], ['重複候補', c.dups.length], ['時間競合', c.confs.length]];
  return (PLAN.status === 'approved' ? '<div class="ok">この計画は' + (PLAN.approved_at || '').slice(0, 16).replace('T', ' ') + 'に承認済みです。再承認すると差分だけが追加されます。</div>' : '') +
