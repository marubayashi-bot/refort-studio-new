function planApprove() {
  if (!requireEdit()) return;
  const sync = $('#apSync') ? $('#apSync').value === '1' : true;
  const idmap = {}, res = { projects: 0, opps: 0, todos: 0, events: 0, skipped: 0 };
  /* ゴールとKPI */
  const goal = { id: uid(), plan_id: PLAN.id, title: PLAN.goal.title, amount: PLAN.goal.amount, due: PLAN.goal.due,
    owner: PLAN.goal.owner, judge: PLAN.goal.judge || [], created_at: new Date().toISOString() };
  DB.goals.unshift(goal);
  PLAN.kpis.forEach(k => DB.goal_metrics.unshift({ id: uid(), goal_id: goal.id, name: k.name, target: k.target, basis: k.basis, owner: k.owner, actual: 0 }));
  /* プロジェクト */
  PLAN.projects.filter(p => PLAN.selected[p.tmp]).forEach(p => {
    let ex = DB.projects.find(x => normTitle(x.title) === normTitle(p.title));
    if (!ex) {
      ex = { id: uid(), title: p.title, node_id: '', map_id: '', purpose: PLAN.goal.title, done_condition: p.done_condition,
        owner: p.owner, due: p.due, progress: 0, status: 'active', goal_id: goal.id, amount: p.amount,
        created_at: new Date().toISOString(), updated_at: new Date().toISOString() };
      DB.projects.unshift(ex); res.projects++;
    } else res.skipped++;
    idmap[p.tmp] = ex.id;
  });
  /* 案件 */
  PLAN.opps.filter(o => PLAN.selected[o.tmp]).forEach(o => {
    if (DB.opportunities.some(x => normTitle(x.name) === normTitle(o.name))) { res.skipped++; return; }
    const rec = Object.assign({ id: uid(), goal_id: goal.id, project_id: idmap[PLAN.projects.find(p => p.owner === o.owner) ? PLAN.projects.find(p => p.owner === o.owner).tmp : ''] || '',
      status: 'open', created_at: new Date().toISOString(), updated_at: new Date().toISOString() }, o);
    delete rec.tmp; DB.opportunities.unshift(rec); res.opps++;
  });
  /* ToDo */
  PLAN.todos.filter(t => PLAN.selected[t.tmp]).forEach(t => {
    if (DB.tasks.some(x => x.gtd !== 'done' && normTitle(x.title) === normTitle(t.title) && (x.owner || '') === (t.owner || ''))) { res.skipped++; return; }
    const task = mkTask({ title: t.title, gtd: t.due === today() ? 'today' : 'next', owner: t.owner, due: t.due,
      priority: +t.priority || 2, notes: (t.done_condition ? '完了条件: ' + t.done_condition : '') + (t.depends ? '\n前提: ' + t.depends : ''),
      project_id: idmap[t.project] || '', source: 'ai_plan', plan_id: PLAN.id, minutes: t.minutes });
    idmap[t.tmp] = task.id; res.todos++;
    if (sync && t.to_gtasks) Integrations.sendToTasks(task);
  });
  /* カレンダー */
  PLAN.events.filter(e => PLAN.selected[e.tmp]).forEach(e => {
    const start = (e.date || today()) + 'T' + (e.start || '09:00');
    const cand = evNorm({ id: uid(), title: e.title, type: e.type, start: start, end: addMin(start, e.minutes || 60),
      owner: e.owner || PLAN.goal.owner, purpose: PLAN.goal.title, outcome: '', goal_ref: 'g:' + goal.id,
      project_id: idmap[PLAN.todos.find(t => t.tmp === e.todo) ? (PLAN.todos.find(t => t.tmp === e.todo).project) : ''] || '',
      task_id: idmap[e.todo] || '', reminder: 10, location: '', guests: '', url_online: '', notes: '',
      sync_to_google: sync && ETYPE[e.type].sync, sync_status: 'local', source: 'ai_plan', plan_id: PLAN.id });
    const chk = checkEvent(cand);
    if (chk.dups.length) { res.skipped++; return; }
    DB.calendar_events.unshift(cand); res.events++;
    if (cand.sync_to_google) syncEvent(cand);
  });
  PLAN.status = 'approved'; PLAN.approved_at = new Date().toISOString(); PLAN.result = res;
  DB.plan_approvals = DB.plan_approvals || [];
  DB.plan_approvals.unshift({ id: uid(), plan_id: PLAN.id, at: PLAN.approved_at, by: (DB.user || {}).name || '', result: res });
  Store.log('AI計画を承認', PLAN.goal.title); Store.save(true);
  openModal('登録が完了しました',
    '<div class="ok">プロジェクト' + res.projects + '件／案件' + res.opps + '件／ToDo' + res.todos + '件／予定' + res.events + '件を登録しました。' +
    (res.skipped ? '重複のため' + res.skipped + '件はスキップしました。' : '') + '</div>' +
    '<div class="small muted">この計画はAI計画一覧から再確認できます。未達のときは「計画を立て直す」で作り直せます。</div>',
    [{ label: 'GTDボードを見る', cls: 'pri', fn: () => { closeModal(); go('board'); } },
     { label: '週間カレンダーを見る', fn: () => { closeModal(); jumpToCal('week'); } },
     { label: '閉じる', fn: closeModal }]);
  render();
}

async function planRebuild() {

function oppWeighted(o) { return (+o.amount || 0) * ((+o.prob || RANK[o.rank].p) / 100); }
function pipelineStats() {
  aiInit();
  const goal = DB.goals[0] || {};
  const open = DB.opportunities.filter(o => o.status !== 'lost');
  const won = open.filter(o => o.status === 'won').reduce((a, o) => a + (+o.amount || 0), 0);
  const gross = open.reduce((a, o) => a + (+o.amount || 0), 0);
  const weighted = open.reduce((a, o) => a + oppWeighted(o), 0);
  const byRank = r => open.filter(o => o.rank === r).reduce((a, o) => a + (+o.amount || 0), 0);
  const best = byRank('A') * 0.9 + byRank('B') * 0.6 + byRank('C') * 0.2;
  const worst = byRank('A') * 0.7;
  const target = +goal.amount || 0;
  const owners = {};
  open.forEach(o => { const k = o.count_to || o.owner || '未設定'; owners[k] = owners[k] || { gross: 0, w: 0, target: 0 };
    owners[k].gross += (+o.amount || 0); owners[k].w += oppWeighted(o); });
  (DB.goal_metrics || []).filter(m => /受注目標/.test(m.name)).forEach(m => {
    const k = m.owner || ''; if (owners[k]) owners[k].target = parseFloat(m.target) || 0;
  });
  return { goal: goal, target: target, won: won, gross: gross, weighted: Math.round(weighted * 100) / 100,
    best: Math.round(best * 100) / 100, worst: Math.round(worst * 100) / 100,
    gap: Math.round((target - weighted) * 100) / 100, owners: owners, open: open };
}

function oppAlerts() {

  const stale = o.filter(x => (x.updated_at || '').slice(0, 10) < addDays(today(), -10));
  if (stale.length) out.push({ t: '10日以上動いていない案件が' + stale.length + '件', d: stale.slice(0, 3).map(x => x.name).join(' / '), a: '案件一覧を開く', fn: () => go('pipeline') });
  const p = pipelineStats();
  if (p.target && p.gap > 0) out.push({ t: '有効案件が' + p.gap + '億円不足しています', d: '紹介依頼' + Math.max(3, Math.ceil(p.gap * 2)) + '件と休眠顧客' + Math.max(5, Math.ceil(p.gap * 4)) + '件への再接触が必要です。', a: 'この行動をToDoに入れる', fn: () => makeBackupTasks(p.gap) });
  const keys = {};
  o.forEach(x => { const k = normTitle(x.name); keys[k] = (keys[k] || 0) + 1; });
  const dup = Object.keys(keys).filter(k => keys[k] > 1);

function flowFinish(kind) {

  const applyAct = () => { if (act) { t.notes = (t.notes ? t.notes + '\n' : '') + '元の内容: ' + t.title; t.title = act; } };
  const who = () => ($('#fwWho') || {}).value || '';
  const due = () => ($('#fwDue') || {}).value || '';

  if (kind === 'delete') {
    DB.tasks = DB.tasks.filter(x => x.id !== t.id);
    const n = nodeById(t.node_id); if (n) n.task_id = '';
    flowResult('削除しました', '見返す必要のないものを手放しました。'); return;
  }
  if (kind === 'reference') { setGtd(t, 'reference'); flowResult('資料・参考情報に入れました', '行動はしません。必要なときに参照します。'); return; }
  if (kind === 'someday') { setGtd(t, 'someday'); flowResult('いつかやる／多分やるに入れました', 'ウィークリーレビューで見直します。'); return; }
  if (kind === 'done') { applyAct(); setGtd(t, 'done'); flowResult('完了にしました', '2分以内のものは、その場で終わらせるのがいちばん速い。'); return; }
  if (kind === 'waiting') {
    applyAct(); t.owner = who(); t.due = due();
    t.notes = (t.notes ? t.notes + '\n' : '') + '依頼日: ' + today() + (t.owner ? ' / 依頼先: ' + t.owner : '');
    setGtd(t, 'waiting'); flowResult('連絡待ちに入れました', (t.owner || '相手') + 'からの返事を' + fmtDate(t.due) + 'に確認します。'); return;
  }
  if (kind === 'today') { applyAct(); t.due = today(); setGtd(t, 'today'); flowResult('今日やるに入れました', '今日のうちに手をつけます。'); return; }
  if (kind === 'next') {
    applyAct(); t.owner = who(); t.due = due(); t.priority = +(($('#fwP') || {}).value || 3);
    setGtd(t, 'next'); flowResult('次にとるべき行動に入れました', '期限 ' + fmtDate(t.due) + ' ／ 担当 ' + (t.owner || '未設定')); return;
  }
  if (kind === 'calendar') {
    applyAct();
    const ev = { id: uid(), node_id: t.node_id, map_id: t.map_id, title: t.title, start: ($('#fwS') || {}).value || '',
      end: ($('#fwE') || {}).value || '', location: ($('#fwL') || {}).value || '', guests: '', detail: t.notes,
      reminder: 10, map_url: location.origin + location.pathname + (t.map_id ? '#/map/' + t.map_id : '#/board'), sync: 'pending', gcal_event_id: '' };
    DB.calendar_events.unshift(ev);
    t.due = (ev.start || '').slice(0, 10); setGtd(t, 'calendar');
    Integrations.sendEvent(ev);
    flowResult('カレンダーに入れました', (ev.start || '').replace('T', ' ') + ' に実行します。'); return;
  }
  if (kind === 'project') {
    const p = { id: uid(), title: t.title, node_id: t.node_id || '', map_id: t.map_id || '',
      purpose: t.notes || '', done_condition: ($('#fwDone') || {}).value || '', owner: who(), due: due(),
      progress: 0, status: 'active', created_at: new Date().toISOString(), updated_at: new Date().toISOString() };
    DB.projects.unshift(p); t.project_id = p.id; setGtd(t, 'project');
    const first = (($('#fwFirst') || {}).value || '').trim();
    if (first) mkTask({ title: first, gtd: 'next', owner: p.owner, due: addDays(today(), 3), project_id: p.id, map_id: p.map_id, source: 'flow' });
    Store.log('プロジェクト化', p.title);
    flowResult('プロジェクトにしました', first ? '最初の一手「' + first + '」を次にとるべき行動に入れました。' : '次にとるべき行動がまだありません。決まり次第、必ず1つ入れてください。');
    return;
  }
}

/* =========================================================================
   モーダル / 起動
   ========================================================================= */
let _modalBtns = [];
function openModal(title, body, buttons) {
  _modalBtns = buttons || [];
  $('#modalHost').innerHTML = '<div class="mask" onclick="if(event.target===this)closeModal()"><div class="modal">' +
    '<div class="mh"><b style="flex:1">' + esc(title) + '</b><button class="btn sm ghost" onclick="closeModal()">✕</button></div>' +
    '<div class="mb">' + body + '</div>' +
    (_modalBtns.length ? '<div class="mf">' + _modalBtns.map((b, i) => '<button class="btn ' + (b.cls || '') + '" onclick="modalBtn(' + i + ')">' + esc(b.label) + '</button>').join('') + '</div>' : '') +
    '</div></div>';
}
function modalBtn(i) { const b = _modalBtns[i]; if (b && b.fn) b.fn(); }
function closeModal() { $('#modalHost').innerHTML = ''; clearInterval(FLOW.timer); FLOW.timer = null; try { if (window._sr) window._sr.stop(); } catch (e) {} }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('.mask')) closeModal(); });

$('#fab').addEventListener('click', () => route.name === 'map' ? openMapFab() : openQuick());
function openMapFab() {
  openModal('追加', '<div class="quick">' +
    '<button onclick="closeModal();mmAddChild()"><span class="ic">➕</span>子ノードを追加</button>' +
    '<button onclick="closeModal();mmAddSibling()"><span class="ic">↔️</span>同階層に追加</button>' +
    '<button onclick="closeModal();openQuick()"><span class="ic">📥</span>Inboxに入れる</button>' +
    '<button onclick="closeModal();quickVoice()"><span class="ic">🎙</span>音声で入力</button></div>', []);
}

function start() {
  const lg = $('#login'), sh = $('#shell');
  lg.hidden = true; lg.style.display = 'none';
  sh.hidden = false; sh.style.display = 'flex';
  if (!location.hash) location.hash = '#/home';
  render();
}
function splash(done) {
  if (DB.settings.skipSplash) return done();
  const el = $('#splash'); el.hidden = false;
  setTimeout(() => { el.classList.add('out'); setTimeout(() => { el.hidden = true; done(); }, 420); }, 1150);
}
function boot() {
  DB = Store.load();
  splash(() => {});
  if (DB.user) { start(); return; }
  $('#btnGoogle').addEventListener('click', () => {
    Auth.signIn({ name: '丸林 信宏', email: 'hankyo@earthcom-eco.jp', provider: 'google' });
  });
  $('#btnMail').addEventListener('click', () => {
    const m = $('#liMail').value.trim(), n = $('#liName').value.trim();
    if (!m || !/.+@.+\..+/.test(m)) { $('#loginErr').innerHTML = '<div class="err">メールアドレスの形式を確認してください。</div>'; return; }
    Auth.signIn({ name: n || m.split('@')[0], email: m, provider: 'email' });
  });
  $('#liMail').addEventListener('keydown', e => { if (e.key === 'Enter') $('#btnMail').click(); });
}
window.addEventListener('error', e => { toast('エラー: ' + (e.message || '不明なエラー'), 'err'); });
window.addEventListener('resize', () => { if (route.name === 'map') { const d = $('#detail'); if (d && !isMobile()) d.hidden = false; mmRender(); } });
boot();
</script>
