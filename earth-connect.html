<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12202E; --ink2:#22384C; --paper:#F3F5F2; --card:#FFFFFF;
  --line:#D9DFD8; --muted:#5F6F7A;
  --sun:#E8A33D; --alert:#C8412F; --go:#2E7D5B; --sky:#2C6E9B;
  --r:10px; --sh:0 1px 2px rgba(18,32,46,.07), 0 6px 18px rgba(18,32,46,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  background:var(--paper); color:var(--ink); font-size:15px; line-height:1.7;
  -webkit-text-size-adjust:100%;
}
.num{font-family:"Roboto Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;}
button,input,select,textarea{font-family:inherit; font-size:15px; color:inherit}
button{cursor:pointer}
a{color:var(--sky)}
:focus-visible{outline:2px solid var(--sky); outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}

/* ---------- shell ---------- */
.shell{display:flex; min-height:100vh}
.rail{
  width:212px; flex:0 0 212px; background:var(--ink); color:#fff;
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
}
.brand{padding:18px 18px 14px; border-bottom:1px solid rgba(255,255,255,.12)}
.brand b{display:block; font-size:17px; font-weight:900; letter-spacing:.04em}
.brand span{display:block; font-size:11.5px; color:#9FB3C3; margin-top:2px; line-height:1.5}
.nav{flex:1; overflow:auto; padding:8px 0}
.nav button{
  display:flex; align-items:center; gap:9px; width:100%; background:none; border:0;
  color:#C7D5E0; text-align:left; padding:9px 18px; font-size:14px; font-weight:500;
  border-left:3px solid transparent;
}
.nav button:hover{background:rgba(255,255,255,.06); color:#fff}
.nav button.on{background:rgba(232,163,61,.14); color:#fff; border-left-color:var(--sun); font-weight:700}
.nav .ico{width:18px; text-align:center; font-size:15px}
.nav .cnt{margin-left:auto; font-size:11px; background:var(--alert); color:#fff; border-radius:9px; padding:0 6px; font-weight:700}
.me{padding:11px 18px; border-top:1px solid rgba(255,255,255,.12); font-size:12px; color:#9FB3C3}
.me b{color:#fff; font-weight:700; display:block; font-size:13px}
.sync{display:inline-flex; align-items:center; gap:5px; margin-top:6px; font-size:11px}
.dot{width:7px;height:7px;border-radius:50%;background:#6b7c89}
.dot.ok{background:#4BBF87} .dot.ng{background:var(--alert)} .dot.wait{background:var(--sun)}

.main{flex:1; min-width:0; display:flex; flex-direction:column}
.top{
  display:flex; align-items:center; gap:12px; padding:14px 22px;
  background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20;
}
.top h1{margin:0; font-size:18px; font-weight:900; letter-spacing:.02em}
.top .sub{font-size:12.5px; color:var(--muted)}
.top .sp{flex:1}
.wrap{padding:20px 22px 90px; max-width:1180px; width:100%}
@media(max-width:860px){
  .rail{display:none}
  .wrap{padding:14px 13px 96px}
  .top{padding:11px 14px}
  .top h1{font-size:16px}
}

/* ---------- bottom tabs (mobile) ---------- */
.tabs{display:none}
@media(max-width:860px){
  .tabs{
    display:grid; grid-template-columns:repeat(5,1fr); position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:var(--ink); padding-bottom:env(safe-area-inset-bottom);
  }
  .tabs button{background:none;border:0;color:#9FB3C3;padding:8px 2px 9px;font-size:10.5px;font-weight:700;position:relative}
  .tabs button i{display:block;font-style:normal;font-size:17px;margin-bottom:1px}
  .tabs button.on{color:var(--sun)}
  .tabs .cnt{position:absolute;top:3px;right:50%;transform:translateX(17px);background:var(--alert);color:#fff;border-radius:8px;font-size:9.5px;padding:0 4px}
}

/* ---------- primitives ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--sh)}
.pad{padding:15px 16px}
.h{font-size:14px; font-weight:900; margin:0 0 10px; display:flex; align-items:center; gap:8px}
.h .note{font-weight:500; font-size:12px; color:var(--muted)}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.sec{margin-bottom:18px}
.btn{
  border:1px solid var(--ink); background:var(--ink); color:#fff; border-radius:8px;
  padding:9px 15px; font-weight:700; font-size:14px;
}
.btn:hover{background:var(--ink2)}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--line)}
.btn.ghost:hover{background:#EDF0EC}
.btn.sun{background:var(--sun); border-color:var(--sun); color:#12202E}
.btn.sm{padding:6px 11px; font-size:12.5px; border-radius:7px}
.btn.wide{width:100%; justify-content:center}
.btn[disabled]{opacity:.45; cursor:not-allowed}
label.f{display:block; margin-bottom:11px}
label.f > span{display:block; font-size:12px; color:var(--muted); font-weight:700; margin-bottom:3px}
input[type=text],input[type=date],input[type=tel],input[type=email],input[type=number],select,textarea{
  width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:#fff;
}
textarea{min-height:74px; resize:vertical}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:0 12px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:0 12px}
@media(max-width:640px){.grid3{grid-template-columns:1fr 1fr}}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{
  border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 12px;
  font-size:13px; font-weight:500;
}
.chip.on{background:var(--ink); border-color:var(--ink); color:#fff; font-weight:700}
.chip.sun.on{background:var(--sun); border-color:var(--sun); color:#12202E}
.tag{display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; border:1px solid var(--line); background:#fff}
.rank{display:inline-flex; align-items:center; justify-content:center; min-width:26px; height:22px; border-radius:6px; font-weight:900; font-size:12.5px; color:#fff; padding:0 6px}
.rank.S{background:var(--alert)} .rank.A{background:var(--sun); color:#12202E}
.rank.B{background:var(--sky)} .rank.C{background:#7C8B96} .rank.保留{background:#B9C2C8; color:#31424E}
.kpi{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
@media(max-width:860px){.kpi{grid-template-columns:repeat(2,1fr)}}
.kpi .k{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:11px 13px}
.kpi .k span{display:block; font-size:11.5px; color:var(--muted); font-weight:700}
.kpi .k b{display:block; font-size:23px; font-weight:900; line-height:1.25}
.kpi .k.bad b{color:var(--alert)}
.kpi .k small{font-size:11px; color:var(--muted)}
.empty{padding:26px 16px; text-align:center; color:var(--muted); font-size:13.5px}
.empty b{display:block; color:var(--ink); font-size:15px; margin-bottom:4px}
table{width:100%; border-collapse:collapse; font-size:13.5px}
th{text-align:left; font-size:11.5px; color:var(--muted); font-weight:700; padding:7px 8px; border-bottom:1px solid var(--line); white-space:nowrap}
td{padding:9px 8px; border-bottom:1px solid #EDF0EC; vertical-align:middle}
tr.clickable:hover{background:#F7F9F6; cursor:pointer}
.scroll{overflow-x:auto}

/* ---------- 追客リスト ---------- */
.due{border-left:4px solid var(--line); background:var(--card); border:1px solid var(--line); border-left-width:4px; border-radius:var(--r); padding:12px 14px; margin-bottom:9px; display:flex; gap:12px; align-items:flex-start}
.due.over{border-left-color:var(--alert)}
.due.today{border-left-color:var(--sun)}
.due.soon{border-left-color:var(--sky)}
.due .body{flex:1; min-width:0}
.due .co{font-weight:900; font-size:15px}
.due .pn{font-size:12.5px; color:var(--muted)}
.due .act{margin-top:5px; font-size:13.5px}
.due .when{font-size:12px; font-weight:700; margin-top:3px}
.due .when.over{color:var(--alert)}
.due .side{display:flex; flex-direction:column; gap:6px; align-items:flex-end}

/* ---------- pipeline ---------- */
.pipe{display:grid; grid-template-columns:repeat(6,minmax(190px,1fr)); gap:10px; overflow-x:auto; padding-bottom:8px}
.col{background:#E9EDE8; border-radius:var(--r); padding:9px; min-height:170px}
.col.dragover{background:#DCE6DB; outline:2px dashed var(--go)}
.col h4{margin:0 0 8px; font-size:12.5px; font-weight:900; display:flex; justify-content:space-between}
.col h4 em{font-style:normal; color:var(--muted); font-weight:700}
.col .sum{font-size:11px; color:var(--muted); margin:-4px 0 8px}
.pc{background:#fff; border:1px solid var(--line); border-radius:8px; padding:9px 10px; margin-bottom:7px; cursor:grab}
.pc:active{cursor:grabbing}
.pc b{display:block; font-size:13.5px; line-height:1.4}
.pc .m{font-size:11.5px; color:var(--muted); display:flex; gap:6px; align-items:center; margin-top:3px; flex-wrap:wrap}

/* ---------- modal ---------- */
.mask{position:fixed; inset:0; background:rgba(18,32,46,.45); z-index:60; display:flex; align-items:flex-end; justify-content:center}
@media(min-width:861px){.mask{align-items:center}}
.sheet{background:var(--paper); width:100%; max-width:760px; max-height:92vh; overflow:auto; border-radius:14px 14px 0 0}
@media(min-width:861px){.sheet{border-radius:12px}}
.sheet .sh{position:sticky; top:0; background:var(--card); border-bottom:1px solid var(--line); padding:13px 16px; display:flex; align-items:center; gap:10px; z-index:2}
.sheet .sh b{font-size:16px; font-weight:900; flex:1; min-width:0}
.sheet .sb{padding:16px}
.x{border:0; background:#EDF0EC; width:30px; height:30px; border-radius:50%; font-size:16px; font-weight:700; line-height:1}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:78px; background:var(--ink); color:#fff; padding:10px 18px; border-radius:999px; z-index:80; font-size:13.5px; font-weight:700; box-shadow:var(--sh)}
.warnbox{background:#FDF3EA; border:1px solid #F0D3AE; border-radius:8px; padding:10px 12px; font-size:13px; margin-bottom:12px}
.warnbox.red{background:#FBEDEB; border-color:#EFC4BD}
.log{border-left:2px solid var(--line); padding:0 0 0 11px; margin:0}
.log li{list-style:none; margin-bottom:10px; font-size:13.5px}
.log .t{font-size:11.5px; color:var(--muted); font-weight:700}
.manual h3{font-size:15px; margin:20px 0 6px}
.manual h3:first-child{margin-top:0}
.manual ol,.manual ul{padding-left:20px; margin:6px 0}
.manual li{margin-bottom:4px; font-size:14px}
code{background:#EDF0EC; padding:1px 5px; border-radius:4px; font-family:"Roboto Mono",monospace; font-size:12.5px}
pre{background:var(--ink); color:#DCE6E9; padding:12px; border-radius:8px; overflow:auto; font-size:11.5px; line-height:1.6}
.hide{display:none!important}
.mobonly{display:none}
@media(max-width:860px){.mobonly{display:inline-block}}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand">
      <b>EARTH CONNECT</b>
      <span>名刺を集めるだけで終わらせない</span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="me">
      <b id="meName">読み込み中</b>
      <span id="meRole"></span>
      <div class="sync"><i class="dot" id="syncDot"></i><span id="syncTxt">接続確認中</span></div>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <div>
        <h1 id="ttl">ホーム</h1>
        <div class="sub" id="tsub"></div>
      </div>
      <div class="sp"></div>
      <button class="btn sun" onclick="openScan()">＋ 名刺を登録</button>
    </header>
    <div class="wrap" id="view"></div>
  </div>
</div>

<nav class="tabs" id="tabs"></nav>
<div id="modal"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./ec-auth.js"></script>
<script>
/* ===================================================================
   EARTH CONNECT — 名刺を商談・受注につなげる営業アプリ
   単一HTML / Supabase共有 / ec-auth.js 共通認証
   =================================================================== */
const SUPA_URL = 'https://aakofrzurgwrkctunthw.supabase.co';
const SUPA_KEY = 'sb_publishable_yAUGrTJjqg56S16D7BI2oQ_pbt1olLa';
const TABLE    = 'earthconnect_records';
const AI_URL   = SUPA_URL + '/functions/v1/ai';

const PHASES = [
  {id:'PH01', name:'見極め'},
  {id:'PH03', name:'ヒアリング'},
  {id:'PH04', name:'提案'},
  {id:'PH06', name:'条件調整'},
  {id:'PH08', name:'受注'},
  {id:'LOST', name:'見送り'}
];
const SERVICES = ['ReFort','ReFort CARE','高圧セカンダリー','発電所買取','低圧蓄電池','系統用蓄電池','営農型太陽光','現地視察・無料診断'];
const INTERESTS = ['発電量の改善','売却','買い増し','蓄電池','節税','O&M・保守','その他'];
const RANKS = ['S','A','B','C','保留'];
const RANK_RULE = {
  'S':{days:0,  text:'当日中に連絡＋役員共有'},
  'A':{days:1,  text:'24時間以内に連絡'},
  'B':{days:3,  text:'3日以内に連絡'},
  'C':{days:14, text:'定期フォロー'},
  '保留':{days:60,text:'メール配信で育成'}
};
const PLACES = ['PV EXPO','展示会（その他）','紹介','訪問','セミナー','来社','電話・問合せ'];

/* ---------- 汎用 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const today = () => new Date().toISOString().slice(0,10);
const addDays = (n,base) => { const d = base? new Date(base): new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const dayDiff = d => d ? Math.round((new Date(d+'T00:00:00') - new Date(today()+'T00:00:00'))/86400000) : null;
const man = n => (Number(n)||0).toLocaleString('ja-JP');
const oku = n => { const v=Number(n)||0; return v>=10000 ? (v/10000).toFixed(v%10000?1:0)+'億円' : man(v)+'万円'; };
function toast(msg){
  $('#toast').innerHTML = '<div class="toast">'+esc(msg)+'</div>';
  clearTimeout(window._tt); window._tt = setTimeout(()=>$('#toast').innerHTML='', 2400);
}
function jdate(d){ if(!d) return '—'; const t=new Date(d+'T00:00:00'); return (t.getMonth()+1)+'/'+t.getDate()+'（'+'日月火水木金土'[t.getDay()]+'）'; }
function jtime(iso){ if(!iso) return ''; const t=new Date(iso); return (t.getMonth()+1)+'/'+t.getDate()+' '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0'); }

/* ===================== データ層 ===================== */
const DB = {
  cards: [],
  sb: null,
  me: {name:'', email:'', role:'sales'},
  queue: JSON.parse(localStorage.getItem('ec_queue')||'[]'),
  online: false
};

function cacheSave(){ try{ localStorage.setItem('ec_cards', JSON.stringify(DB.cards)); }catch(e){} }
function cacheLoad(){ try{ DB.cards = JSON.parse(localStorage.getItem('ec_cards')||'[]'); }catch(e){ DB.cards=[]; } }
function qSave(){ localStorage.setItem('ec_queue', JSON.stringify(DB.queue)); }

function setSync(state, txt){
  const d=$('#syncDot'); if(!d) return;
  d.className = 'dot ' + state;
  $('#syncTxt').textContent = txt;
}

async function initSupabase(){
  try{
    DB.sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);
    const {data, error} = await DB.sb.from(TABLE).select('id,data,updated_at').eq('kind','card');
    if(error) throw error;
    const remote = (data||[]).map(r => Object.assign({}, r.data, {id:r.id, updatedAt:r.updated_at}));
    // ローカル未送信を優先してマージ
    const map = {}; remote.forEach(r => map[r.id]=r);
    DB.cards.forEach(l => { if(!map[l.id] || (l.updatedAt||'') > (map[l.id].updatedAt||'')) map[l.id]=l; });
    DB.cards = Object.values(map);
    cacheSave();
    DB.online = true;
    setSync('ok','共有中・最新');
    flushQueue();
    DB.sb.channel('ec').on('postgres_changes',{event:'*',schema:'public',table:TABLE}, p=>{
      if(!p.new || p.new.kind!=='card') return;
      const rec = Object.assign({}, p.new.data, {id:p.new.id, updatedAt:p.new.updated_at});
      const i = DB.cards.findIndex(c=>c.id===rec.id);
      if(i<0) DB.cards.push(rec); else DB.cards[i]=rec;
      cacheSave(); if(!$('#modal').innerHTML) render();
    }).subscribe();
  }catch(e){
    DB.online = false;
    setSync('ng','この端末のみ（未接続）');
    console.warn('Supabase接続なし:', e.message||e);
  }
}

async function push(card){
  if(!DB.online || !DB.sb){ DB.queue.push(card.id); qSave(); setSync('wait','未送信 '+DB.queue.length+'件'); return; }
  try{
    const {error} = await DB.sb.from(TABLE).upsert({
      id: card.id, kind:'card', data: card, updated_at: new Date().toISOString(), updated_by: DB.me.email||DB.me.name
    });
    if(error) throw error;
    setSync('ok','共有中・最新');
  }catch(e){
    DB.queue.push(card.id); qSave(); setSync('wait','未送信 '+DB.queue.length+'件');
  }
}
async function flushQueue(){
  if(!DB.online || !DB.queue.length) return;
  const ids = [...new Set(DB.queue)]; DB.queue=[]; qSave();
  for(const id of ids){ const c = DB.cards.find(x=>x.id===id); if(c) await push(c); }
}

function save(card, logText){
  card.updatedAt = new Date().toISOString();
  card.updatedBy = DB.me.name;
  if(logText){ card.logs = card.logs||[]; card.logs.unshift({at:card.updatedAt, by:DB.me.name, text:logText}); }
  const i = DB.cards.findIndex(c=>c.id===card.id);
  if(i<0) DB.cards.push(card); else DB.cards[i]=card;
  cacheSave(); push(card);
}

/* ===================== 見込みランク判定 ===================== */
function scoreCard(c){
  const h = c.hearing||{}; let s = 0; const why = [];
  if(h.authority==='あり'){ s+=15; why.push('決裁権あり +15'); }
  if(h.owns==='あり'){ s+=15; why.push('発電所を所有 +15'); }
  if(Number(h.plants)>=3){ s+=5; why.push('3基以上を所有 +5'); }
  if((h.voltage||[]).some(v=>v!=='低圧')){ s+=10; why.push('高圧・特別高圧 +10'); }
  if(h.sellIntent==='あり'){ s+=15; why.push('売却意向 +15'); }
  if(h.buyIntent==='あり'){ s+=15; why.push('購入意向 +15'); }
  if(h.battery==='あり'){ s+=10; why.push('蓄電池に関心 +10'); }
  if(h.tax==='あり'){ s+=10; why.push('節税ニーズ +10'); }
  if(h.decline==='あり'){ s+=10; why.push('発電量の低下 +10'); }
  if(h.pcs==='あり'){ s+=8;  why.push('パワコン交換予定 +8'); }
  const b = Number(h.budget)||0;
  if(b>=10000){ s+=20; why.push('投資可能額1億円以上 +20'); }
  else if(b>=3000){ s+=10; why.push('投資可能額3000万円以上 +10'); }
  if(h.timing==='3か月以内'){ s+=15; why.push('時期が3か月以内 +15'); }
  else if(h.timing==='半年以内'){ s+=8; why.push('時期が半年以内 +8'); }
  let rank;
  if(b>=10000 && h.authority==='あり' && h.timing==='3か月以内') rank='S';
  else if(s>=72) rank='S';
  else if(s>=48) rank='A';
  else if(s>=26) rank='B';
  else if(s>0)   rank='C';
  else rank='保留';
  return {score:s, rank, why};
}
function suggestServices(c){
  const h=c.hearing||{}; const out=[];
  if(h.decline==='あり'||h.pcs==='あり') out.push('ReFort');
  if(h.owns==='あり') out.push('ReFort CARE');
  if(h.sellIntent==='あり') out.push('発電所買取');
  if(h.buyIntent==='あり'){ out.push('高圧セカンダリー'); }
  if(h.battery==='あり'){ out.push('低圧蓄電池','系統用蓄電池'); }
  if(h.tax==='あり' && !out.includes('低圧蓄電池')) out.push('低圧蓄電池');
  if(h.owns==='あり' && !out.includes('現地視察・無料診断')) out.push('現地視察・無料診断');
  return [...new Set(out)];
}

/* ===================== 集計 ===================== */
const alive = () => DB.cards.filter(c=>c.phase!=='LOST');
function dueList(){
  return alive().filter(c=>c.nextDate).sort((a,b)=> (a.nextDate>b.nextDate?1:-1));
}
function overdue(){ return dueList().filter(c=> dayDiff(c.nextDate) < 0); }
function todayDue(){ return dueList().filter(c=> dayDiff(c.nextDate) === 0); }
function stalled(){
  return alive().filter(c=>{
    const last = (c.logs&&c.logs[0]&&c.logs[0].at) || c.updatedAt || c.createdAt;
    if(!last) return false;
    return (Date.now() - new Date(last).getTime())/86400000 >= 3 && ['S','A'].includes(c.rank);
  });
}
function grossOf(list){ return list.reduce((s,c)=> s + (Number(c.gross)||0), 0); }

function dueCard(c){
  const d = dayDiff(c.nextDate);
  const cls = d<0?'over': d===0?'today': d<=3?'soon':'';
  const when = d===null?'期限なし': d<0?`${-d}日 超過`: d===0?'今日':`あと${d}日`;
  return `<div class="due ${cls}">
    <span class="rank ${c.rank}">${c.rank}</span>
    <div class="body" onclick="openCard('${c.id}')" style="cursor:pointer">
      <div class="co">${esc(c.company||'（会社名なし）')}</div>
      <div class="pn">${esc(c.name||'')}${c.title?' ／ '+esc(c.title):''}　担当：${esc(c.owner||'未定')}</div>
      <div class="act">${esc(c.nextAction||'次の行動が未設定')}</div>
      <div class="when ${d<0?'over':''}"><span class="num">${jdate(c.nextDate)}</span>・${when}</div>
    </div>
    <div class="side">
      <button class="btn sm" onclick="doneAction('${c.id}')">連絡した</button>
      <button class="btn sm ghost" onclick="openCard('${c.id}')">開く</button>
    </div>
  </div>`;
}

        </div>`).join('') || '<div style="font-size:12px;color:var(--muted);padding:6px 2px">案件なし</div>'}
      </div>`;

  </div>

  </div>`;

function bindDrag(){}
function dropCard(ev, ph){
  ev.preventDefault();
  document.querySelectorAll('.col').forEach(c=>c.classList.remove('dragover'));
  const id = ev.dataTransfer.getData('text'); const c = DB.cards.find(x=>x.id===id);
  if(!c || c.phase===ph) return;
  const old = c.phase||'PH01'; c.phase = ph;
  save(c, `フェーズを ${old} → ${ph} に変更`);
  toast(`${c.company} を ${ph} へ移動しました`);
  render();
}

/* ===================== ダッシュボード ===================== */
function vDash(){
  const all = DB.cards, a = alive();
  const sa = a.filter(c=>['S','A'].includes(c.rank));
  const ph4 = a.filter(c=>['PH04','PH06','PH08'].includes(c.phase||''));
  const won = all.filter(c=>c.phase==='PH08');
  const lost = all.filter(c=>c.phase==='LOST');
  const contacted = all.filter(c=>(c.logs||[]).length>0);
  const rate = all.length? Math.round(contacted.length/all.length*100):0;
  const byOwner = {};
  a.forEach(c=>{ const o=c.owner||'担当未定'; byOwner[o]=byOwner[o]||{n:0,g:0,over:0,sa:0};
    byOwner[o].n++; byOwner[o].g+=Number(c.gross)||0;
    if(dayDiff(c.nextDate)<0) byOwner[o].over++;
    if(['S','A'].includes(c.rank)) byOwner[o].sa++; });
  const byPlace = {};
  all.forEach(c=>{ const p=c.metPlace||'その他'; byPlace[p]=(byPlace[p]||0)+1; });

  return `
  <div class="sec kpi">
    <div class="k"><span>名刺の総数</span><b class="num">${all.length}</b><small>今月 ${all.filter(c=>(c.createdAt||'').slice(0,7)===today().slice(0,7)).length}枚</small></div>
    <div class="k"><span>初回連絡の完了率</span><b class="num">${rate}%</b><small>${contacted.length}/${all.length}件</small></div>

    <div class="k"><span>PH04以降</span><b class="num">${ph4.length}</b><small>${oku(grossOf(ph4))}</small></div>
    <div class="k"><span>受注（PH08）</span><b class="num">${won.length}</b><small>粗利 ${oku(grossOf(won))}</small></div>
    <div class="k ${overdue().length?'bad':''}"><span>期限超過</span><b class="num">${overdue().length}</b><small>全社の滞留</small></div>
  </div>

  <div class="sec card pad">
    <h3 class="h">パイプライン <span class="note">フェーズ別の想定粗利</span></h3>
    ${PHASES.filter(p=>p.id!=='LOST').map(p=>{
      const l=a.filter(c=>(c.phase||'PH01')===p.id); const g=grossOf(l);
      const max=Math.max(1,...PHASES.map(x=>grossOf(a.filter(c=>(c.phase||'PH01')===x.id))));
      return `<div style="margin-bottom:9px">
        <div class="row" style="justify-content:space-between;font-size:13px"><span><b>${p.id}</b> ${p.name}<span style="color:var(--muted)"> ${l.length}件</span></span><b class="num">${oku(g)}</b></div>
        <div style="height:7px;background:#EDF0EC;border-radius:4px;overflow:hidden;margin-top:3px"><div style="height:100%;width:${Math.round(g/max*100)}%;background:var(--sun)"></div></div>
      </div>`;}).join('')}
  </div>

  <div class="sec card pad">
    <h3 class="h">担当者別 <span class="note">滞留が赤字</span></h3>
    <div class="scroll"><table>
      <tr><th>担当</th><th style="text-align:right">案件</th><th style="text-align:right">S・A</th><th style="text-align:right">想定粗利</th><th style="text-align:right">期限超過</th></tr>
      ${Object.entries(byOwner).sort((a,b)=>b[1].g-a[1].g).map(([o,v])=>`<tr>

        ||'<tr><td colspan="5" class="empty">データがありません</td></tr>'}
    </table></div>
  </div>

  <div class="sec card pad">
    <h3 class="h">獲得経路</h3>
    ${Object.entries(byPlace).sort((a,b)=>b[1]-a[1]).map(([p,v])=>
      `<div class="row" style="justify-content:space-between;border-bottom:1px solid #EDF0EC;padding:6px 0"><span>${esc(p)}</span><b class="num">${v}枚</b></div>`).join('')||'<div class="empty">データがありません</div>'}

    <button class="btn ghost" onclick="exportCSV()">全件CSV出力</button>
    <button class="btn ghost" onclick="exportJSON()">バックアップ（JSON）</button>
  </div>`;
}

/* ---------- AI読み取り ---------- */
function pickImg(input){
  const files = [...input.files].slice(0,2);
  files.forEach(f=>{
    const r = new FileReader();
    r.onload = () => {
      IMGS.push({media_type:f.type||'image/jpeg', data:String(r.result).split(',')[1]});
      if(IMGS.length>2) IMGS = IMGS.slice(-2);
      drawScan();
    };
    r.readAsDataURL(f);
  });
}
async function runOCR(){
  if(!IMGS.length) return;
  $('#ocrBtn').disabled = true;
  $('#ocrMsg').textContent = '読み取っています…';
  const sys = '名刺画像から情報を抽出する。JSONのみを返し、前置き・コードフェンスは書かない。';
  const prompt = 'この名刺画像から次のキーのJSONを作る。値が読み取れないキーは空文字にする。'+
    '{"company":"","name":"","kana":"","dept":"","title":"","tel":"","mobile":"","email":"","address":"","website":"","industry":""}';
  try{
    const res = await fetch(AI_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+SUPA_KEY},
      body: JSON.stringify({system:sys, prompt, max_tokens:800, images:IMGS})
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const j = await res.json();
    const txt = j.text || (Array.isArray(j.content)? j.content.filter(x=>x.type==='text').map(x=>x.text).join('') : '') || '';
    const m = txt.replace(/```json|```/g,'').match(/\{[\s\S]*\}/);
    if(!m) throw new Error('読み取り結果を解析できません');
    const o = JSON.parse(m[0]);
    ['company','name','kana','dept','title','tel','mobile','email','address','website','industry'].forEach(k=>{ if(o[k]) DRAFT[k]=o[k]; });
    drawScan();
    $('#ocrMsg').textContent = '読み取りました。間違いがあれば直してください。';
    toast('名刺を読み取りました');
  }catch(e){
    $('#ocrBtn').disabled = false;
    $('#ocrMsg').innerHTML = '<span style="color:var(--alert)">自動読み取りに失敗しました（'+esc(e.message)+'）。下の欄に手入力してください。</span>';
  }
}

function importJSON(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const arr = JSON.parse(r.result); if(!Array.isArray(arr)) throw new Error('形式が違います');
      let n=0;
      arr.forEach(c=>{ if(!c.id) c.id=uid(); if(!DB.cards.find(x=>x.id===c.id)){ DB.cards.push(c); push(c); n++; } });
      cacheSave(); render(); toast(n+'件を取り込みました');
    }catch(e){ toast('取り込めませんでした：'+e.message); }
  };
  r.readAsText(f);
}


/* ===================== EXPO GROWTH 360 からの取込 ===================== */
function parseCSV(text){
  text = text.replace(/^\uFEFF/,'');
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; }
      else cell+=ch;
    }else{
      if(ch==='"') q=true;
      else if(ch===','){ row.push(cell); cell=''; }
      else if(ch==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
      else if(ch!=='\r') cell+=ch;
    }
  }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(v=>String(v).trim()!==''));
}
const MAPFIELDS = [
  {k:'company', label:'会社名', cand:['会社','社名','企業','法人']},
  {k:'name',    label:'氏名',   cand:['氏名','名前','担当者名','来場者']},
  {k:'tel',     label:'電話',   cand:['電話','TEL','tel']},
  {k:'email',   label:'メール', cand:['メール','mail','Mail','E-']},
  {k:'address', label:'住所',   cand:['住所','所在']},
  {k:'owner',   label:'自社担当',cand:['担当','営業担当','アサイン']},
  {k:'rank',    label:'ランク', cand:['ランク','rank','見込み']},
  {k:'nextAction',label:'次の行動',cand:['次回行動','次のアクション','次回アクション','アクション']},
  {k:'nextDate',label:'次回期限',cand:['次回予定','予定日','期限','商談日','次回連絡日']},

  {k:'memo',    label:'メモ',   cand:['メモ','備考','ヒアリング','内容']}
];
let IMP = null;
function openMap(input){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    const rows=parseCSV(String(r.result));
    if(rows.length<2){ toast('データのある行が見つかりません'); return; }
    const head=rows[0].map(h=>String(h).trim());
    const map={}, used=new Set();
    MAPFIELDS.forEach(f2=>{
      const hit=head.findIndex((h,n)=>!used.has(n) && f2.cand.some(c=>h.includes(c)));
      map[f2.k]= hit>=0? hit : -1;
      if(hit>=0) used.add(hit);
    });
    IMP={head, body:rows.slice(1), map};
    drawMap();
  };
  r.readAsText(f,'UTF-8');
}

function pick(row,k){ const i=IMP.map[k]; return i>=0? String(row[i]??'').trim() : ''; }
function runImport(){
  const place=$('#impPlace').value, dueMode=$('#impDue').value;
  let added=0, skipped=0;
  IMP.body.forEach(r=>{
    const company=pick(r,'company'), name=pick(r,'name');

    if(DB.cards.some(c=>(c.company||'')===company && (c.name||'')===name)){ skipped++; return; }
    let rank=pick(r,'rank').toUpperCase().replace(/ランク/g,'').trim();
    if(!RANKS.includes(rank)) rank = rank==='保留'?'保留':'C';
    let nd=pick(r,'nextDate').replace(/\//g,'-');
    if(!/^\d{4}-\d{2}-\d{2}$/.test(nd)) nd = dueMode==='rank'? addDays(RANK_RULE[rank].days) : '';

      id:uid(), createdAt:new Date().toISOString(),
      company, name, kana:'', title:'', dept:'',

}
