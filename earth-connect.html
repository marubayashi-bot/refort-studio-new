<style>
:root{
  --navy:#0E2038; --navy2:#16304F; --ink:#12202E; --muted:#647585;
  --paper:#F2F5F8; --card:#FFFFFF; --line:#E2E8EE;
  --sun:#E8A33D; --sunl:#FDF1DE; --alert:#C8412F; --alertl:#FBE9E6;
  --go:#2E7D5B; --gol:#E4F2EB; --sky:#2C6E9B; --skyl:#E6F0F7;
  --r:14px; --sh:0 1px 2px rgba(14,32,56,.05), 0 8px 24px rgba(14,32,56,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  background:var(--paper); color:var(--ink); font-size:15px; line-height:1.7; -webkit-text-size-adjust:100%;
}
.num{font-family:"Roboto Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
button,input,select,textarea{font-family:inherit; font-size:15px; color:inherit}
button{cursor:pointer}
a{color:var(--sky)}
:focus-visible{outline:2px solid var(--sky); outline-offset:2px}
svg{flex:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.shell{display:flex; min-height:100vh}
.rail{
  width:246px; flex:0 0 246px; color:#fff; position:sticky; top:0; height:100vh;
  background:linear-gradient(178deg,#0E2038 0%,#16304F 100%);
  display:flex; flex-direction:column;
}
.brand{display:flex; align-items:center; gap:11px; padding:18px 18px 15px}
.brand img{width:38px; height:38px; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,.3)}
.brand b{display:block; font-size:15.5px; font-weight:900; letter-spacing:.06em; line-height:1.3}
.brand span{display:block; font-size:10.5px; color:#8FA7BD; letter-spacing:.02em}
.corp{margin:0 16px 14px; background:#fff; border-radius:11px; padding:11px 12px 9px; text-align:center}
.corp img{width:100%; max-width:150px; display:block; margin:0 auto}
.corp span{display:block; font-size:11px; color:#3B5266; font-weight:700; margin-top:5px}
.nav{flex:1; overflow:auto; padding:4px 10px}
.nav button{
  display:flex; align-items:center; gap:11px; width:100%; background:none; border:0;
  color:#B9CBDA; text-align:left; padding:10px 12px; font-size:14px; font-weight:500;
  border-radius:10px; margin-bottom:2px;
}
.nav button:hover{background:rgba(255,255,255,.07); color:#fff}
.nav button.on{background:rgba(255,255,255,.13); color:#fff; font-weight:700}
.nav button.on svg{color:var(--sun)}
.nav .cnt{margin-left:auto; font-size:11px; background:var(--alert); color:#fff; border-radius:9px; padding:1px 7px; font-weight:700}
.tagline{padding:0 20px 12px; font-size:11.5px; color:#7D95AB; line-height:1.6; border-top:1px solid rgba(255,255,255,.1); margin:0 16px; padding-top:13px}
.me{padding:11px 20px 14px; font-size:11.5px; color:#8FA7BD}
.me b{color:#fff; font-weight:700; display:block; font-size:13px}
.sync{display:inline-flex; align-items:center; gap:6px; margin-top:5px}
.dot{width:7px; height:7px; border-radius:50%; background:#6b7c89}
.dot.ok{background:#4BBF87} .dot.ng{background:#E4705F} .dot.wait{background:var(--sun)}

.main{flex:1; min-width:0; display:flex; flex-direction:column}
.top{
  display:flex; align-items:center; gap:18px; padding:13px 26px;
  background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20;
}
.top h1{margin:0; font-size:19px; font-weight:900; letter-spacing:.02em; line-height:1.3}
.top .sub{font-size:12.5px; color:var(--muted)}
.top .sp{flex:1}
.greet{display:flex; align-items:center; gap:9px; font-size:12.5px; color:var(--muted); white-space:nowrap}
.greet b{display:block; color:var(--ink); font-size:13.5px; font-weight:700}
.wk{border-left:1px solid var(--line); padding-left:18px; white-space:nowrap}
.wk span{font-size:11.5px; color:var(--muted); font-weight:700}
.wkbar{display:flex; align-items:center; gap:8px; margin-top:4px}
.wkbar .tr{width:104px; height:7px; background:#E7EDF2; border-radius:4px; overflow:hidden}
.wkbar .fi{height:100%; background:linear-gradient(90deg,#3FB98B,#2C9E9E); border-radius:4px}
.wrap{padding:22px 26px 96px; max-width:1240px; width:100%}
@media(max-width:1100px){.greet .wk{display:none}}
@media(max-width:900px){
  .rail{display:none}
  .wrap{padding:14px 13px 100px}
  .top{padding:10px 14px; gap:10px}
  .top h1{font-size:16.5px}
  .greet{display:none}
}

/* ---------- bottom tabs ---------- */
.tabs{display:none}
@media(max-width:900px){
  .tabs{display:grid; grid-template-columns:repeat(5,1fr); position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:var(--navy); padding-bottom:env(safe-area-inset-bottom); box-shadow:0 -2px 12px rgba(14,32,56,.2)}
  .tabs button{background:none; border:0; color:#96AEC4; padding:9px 2px 10px; font-size:10.5px; font-weight:700; position:relative;
    display:flex; flex-direction:column; align-items:center; gap:2px}
  .tabs button.on{color:var(--sun)}
  .tabs .cnt{position:absolute; top:4px; right:50%; transform:translateX(18px); background:var(--alert); color:#fff;
    border-radius:8px; font-size:9.5px; padding:0 4px; font-weight:700}
}

/* ---------- hero ---------- */
.hero{
  position:relative; overflow:hidden; border-radius:18px; background:linear-gradient(110deg,#FFFFFF 52%,#EAF3FA 100%);
  border:1px solid var(--line); box-shadow:var(--sh); display:flex; align-items:stretch; margin-bottom:16px;
}
.hero .txt{padding:22px 26px; flex:1; min-width:0; z-index:1}
.hero .eye{font-size:14px; font-weight:900; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.hero .eye em{font-style:normal; font-size:12px; font-weight:500; color:var(--muted)}
.hero h2{margin:6px 0 8px; font-size:32px; font-weight:900; line-height:1.25; letter-spacing:-.01em}
.hero h2 .n{color:var(--alert)}
.hero p{margin:0 0 16px; font-size:13.5px; color:var(--muted); max-width:46ch}
.hero .art{width:310px; flex:none; position:relative}
.hero .art .cap{position:absolute; top:26px; right:26px; text-align:right; z-index:2}
.hero .art .cap b{display:block; font-size:17px; font-weight:900; color:#1B4A78; line-height:1.5}
.hero .art .cap span{display:block; font-size:9.5px; letter-spacing:.18em; color:#7DA3C2; margin-top:7px; font-weight:700}
.hero .art svg{position:absolute; inset:0; width:100%; height:100%}
@media(max-width:900px){
  .hero{flex-direction:column}
  .hero h2{font-size:24px}
  .hero .txt{padding:18px 18px 16px}
  .hero .art{width:100%; height:112px; order:-1}
  .hero .art .cap{top:14px; right:16px}
  .hero .art .cap b{font-size:13.5px}
  .hero .art .cap span{font-size:8.5px}
}

/* ---------- primitives ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--sh)}
.pad{padding:16px 18px}
.h{font-size:14.5px; font-weight:900; margin:0 0 12px; display:flex; align-items:center; gap:9px}
.h .note{font-weight:500; font-size:12px; color:var(--muted)}
.h .lnk{margin-left:auto; font-size:12px; font-weight:700; color:var(--sky); background:none; border:0; padding:0}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.sec{margin-bottom:16px}
.cols{display:grid; grid-template-columns:1.15fr 1fr; gap:16px}
@media(max-width:1000px){.cols{grid-template-columns:1fr}}
.btn{border:1px solid var(--navy); background:var(--navy); color:#fff; border-radius:10px; padding:10px 17px; font-weight:700; font-size:14px;
  display:inline-flex; align-items:center; gap:7px}
.btn:hover{background:var(--navy2)}
.btn.ghost{background:#fff; color:var(--ink); border-color:var(--line)}
.btn.ghost:hover{background:#F5F8FA}
.btn.sun{background:var(--sun); border-color:var(--sun); color:#2A1B05; box-shadow:0 2px 10px rgba(232,163,61,.35)}
.btn.sun:hover{background:#DE9930}
.btn.sm{padding:6px 12px; font-size:12.5px; border-radius:8px}
.btn.wide{width:100%; justify-content:center}
.btn[disabled]{opacity:.45; cursor:not-allowed}
label.f{display:block; margin-bottom:12px}
label.f > span{display:block; font-size:12px; color:var(--muted); font-weight:700; margin-bottom:4px}
input[type=text],input[type=date],input[type=tel],input[type=email],input[type=number],select,textarea{
  width:100%; padding:10px 11px; border:1px solid var(--line); border-radius:9px; background:#fff}
textarea{min-height:76px; resize:vertical}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:0 13px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:0 13px}
@media(max-width:640px){.grid3{grid-template-columns:1fr 1fr}}
.chips{display:flex; flex-wrap:wrap; gap:7px}
.chip{border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 13px; font-size:13px; font-weight:500}

.rank.S{background:var(--alert)} .rank.A{background:var(--sun); color:#2A1B05}
.rank.B{background:var(--sky)} .rank.C{background:#7C8B96} .rank.保留{background:#C3CCD3; color:#31424E}

/* ---------- kpi ---------- */
.kpi{display:grid; grid-template-columns:repeat(4,1fr); gap:13px}

.kpi .k{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px 15px; box-shadow:var(--sh);
  display:flex; gap:12px; align-items:flex-start}
.kpi .k .ib{width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex:none}
.kpi .k .tx{min-width:0}

/* ---------- 追客リスト ---------- */
.due{border:1px solid var(--line); border-left:4px solid var(--line); background:var(--card); border-radius:11px;
  padding:12px 14px; margin-bottom:9px; display:flex; gap:12px; align-items:flex-start}
.due.over{border-left-color:var(--alert); background:linear-gradient(90deg,#FDF4F2,#fff 26%)}
.due.today{border-left-color:var(--sun); background:linear-gradient(90deg,#FEF8EE,#fff 26%)}

/* ---------- phase strip ---------- */

.phrow:last-child{border-bottom:0}
.phrow .pill{font-size:11.5px; font-weight:900; padding:4px 11px; border-radius:8px; letter-spacing:.02em; flex:none; min-width:58px; text-align:center}

const SUPA_KEY = 'sb_publishable_yAUGrTJjqg56S16D7BI2oQ_pbt1olLa';

const PHASES = [

/* ---------- アイコン ---------- */

};

/* ---------- 汎用 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const today = () => new Date().toISOString().slice(0,10);
const addDays = (n,base) => { const d = base? new Date(base): new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const dayDiff = d => d ? Math.round((new Date(d+'T00:00:00') - new Date(today()+'T00:00:00'))/86400000) : null;
const man = n => (Number(n)||0).toLocaleString('ja-JP');
const oku = n => { const v=Number(n)||0; return v>=10000 ? (v/10000).toFixed(v%10000?1:0)+'億円' : man(v)+'万円'; };
function toast(msg){
  $('#toast').innerHTML = '<div class="toast">'+esc(msg)+'</div>';
  clearTimeout(window._tt); window._tt = setTimeout(()=>$('#toast').innerHTML='', 2400);
}
function jdate(d){ if(!d) return '—'; const t=new Date(d+'T00:00:00'); return (t.getMonth()+1)+'/'+t.getDate()+'（'+'日月火水木金土'[t.getDay()]+'）'; }
function jtime(iso){ if(!iso) return ''; const t=new Date(iso); return (t.getMonth()+1)+'/'+t.getDate()+' '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0'); }
function fulldate(){ const t=new Date(); return t.getFullYear()+'年'+(t.getMonth()+1)+'月'+t.getDate()+'日（'+'日月火水木金土'[t.getDay()]+'）'; }
function greeting(){ const h=new Date().getHours(); return h<11?'おはようございます':h<17?'こんにちは':'お疲れさまです'; }

/* ===================== データ層 ===================== */
const DB = {
  cards: [],
  sb: null,
  me: {name:'', email:'', role:'sales'},
  queue: JSON.parse(localStorage.getItem('ec_queue')||'[]'),
  online: false
};

function cacheSave(){ try{ localStorage.setItem('ec_cards', JSON.stringify(DB.cards)); }catch(e){} }
function cacheLoad(){ try{ DB.cards = JSON.parse(localStorage.getItem('ec_cards')||'[]'); }catch(e){ DB.cards=[]; } }
function qSave(){ localStorage.setItem('ec_queue', JSON.stringify(DB.queue)); }

function setSync(state, txt){
  const d=$('#syncDot'); if(!d) return;
  d.className = 'dot ' + state;
  $('#syncTxt').textContent = txt;
}

async function initSupabase(){
  try{
    DB.sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);
    const {data, error} = await DB.sb.from(TABLE).select('id,data,updated_at').eq('kind','card');
    if(error) throw error;
    const remote = (data||[]).map(r => Object.assign({}, r.data, {id:r.id, updatedAt:r.updated_at}));
    // ローカル未送信を優先してマージ
    const map = {}; remote.forEach(r => map[r.id]=r);
    DB.cards.forEach(l => { if(!map[l.id] || (l.updatedAt||'') > (map[l.id].updatedAt||'')) map[l.id]=l; });
    DB.cards = Object.values(map);
    cacheSave();
    DB.online = true;
    setSync('ok','共有中・最新');
    flushQueue();
    DB.sb.channel('ec').on('postgres_changes',{event:'*',schema:'public',table:TABLE}, p=>{
      if(!p.new || p.new.kind!=='card') return;
      const rec = Object.assign({}, p.new.data, {id:p.new.id, updatedAt:p.new.updated_at});
      const i = DB.cards.findIndex(c=>c.id===rec.id);
      if(i<0) DB.cards.push(rec); else DB.cards[i]=rec;
      cacheSave(); if(!$('#modal').innerHTML) render();
    }).subscribe();
  }catch(e){
    DB.online = false;
    setSync('ng','この端末のみ（未接続）');
    console.warn('Supabase接続なし:', e.message||e);
  }
}

async function push(card){
  if(!DB.online || !DB.sb){ DB.queue.push(card.id); qSave(); setSync('wait','未送信 '+DB.queue.length+'件'); return; }
  try{
    const {error} = await DB.sb.from(TABLE).upsert({
      id: card.id, kind:'card', data: card, updated_at: new Date().toISOString(), updated_by: DB.me.email||DB.me.name
    });
    if(error) throw error;
    setSync('ok','共有中・最新');
  }catch(e){
    DB.queue.push(card.id); qSave(); setSync('wait','未送信 '+DB.queue.length+'件');
  }
}
async function flushQueue(){
  if(!DB.online || !DB.queue.length) return;
  const ids = [...new Set(DB.queue)]; DB.queue=[]; qSave();
  for(const id of ids){ const c = DB.cards.find(x=>x.id===id); if(c) await push(c); }
}

function save(card, logText){
  card.updatedAt = new Date().toISOString();
  card.updatedBy = DB.me.name;
  if(logText){ card.logs = card.logs||[]; card.logs.unshift({at:card.updatedAt, by:DB.me.name, text:logText}); }
  const i = DB.cards.findIndex(c=>c.id===card.id);
  if(i<0) DB.cards.push(card); else DB.cards[i]=card;
  cacheSave(); push(card);
}

/* ===================== 見込みランク判定 ===================== */
function scoreCard(c){
  const h = c.hearing||{}; let s = 0; const why = [];
  if(h.authority==='あり'){ s+=15; why.push('決裁権あり +15'); }
  if(h.owns==='あり'){ s+=15; why.push('発電所を所有 +15'); }
  if(Number(h.plants)>=3){ s+=5; why.push('3基以上を所有 +5'); }
  if((h.voltage||[]).some(v=>v!=='低圧')){ s+=10; why.push('高圧・特別高圧 +10'); }
  if(h.sellIntent==='あり'){ s+=15; why.push('売却意向 +15'); }
  if(h.buyIntent==='あり'){ s+=15; why.push('購入意向 +15'); }
  if(h.battery==='あり'){ s+=10; why.push('蓄電池に関心 +10'); }
  if(h.tax==='あり'){ s+=10; why.push('節税ニーズ +10'); }
  if(h.decline==='あり'){ s+=10; why.push('発電量の低下 +10'); }
  if(h.pcs==='あり'){ s+=8;  why.push('パワコン交換予定 +8'); }
  const b = Number(h.budget)||0;
  if(b>=10000){ s+=20; why.push('投資可能額1億円以上 +20'); }
  else if(b>=3000){ s+=10; why.push('投資可能額3000万円以上 +10'); }
  if(h.timing==='3か月以内'){ s+=15; why.push('時期が3か月以内 +15'); }
  else if(h.timing==='半年以内'){ s+=8; why.push('時期が半年以内 +8'); }
  let rank;
  if(b>=10000 && h.authority==='あり' && h.timing==='3か月以内') rank='S';
  else if(s>=72) rank='S';
  else if(s>=48) rank='A';
  else if(s>=26) rank='B';
  else if(s>0)   rank='C';
  else rank='保留';
  return {score:s, rank, why};
}
function suggestServices(c){
  const h=c.hearing||{}; const out=[];
  if(h.decline==='あり'||h.pcs==='あり') out.push('ReFort');
  if(h.owns==='あり') out.push('ReFort CARE');
  if(h.sellIntent==='あり') out.push('発電所買取');
  if(h.buyIntent==='あり'){ out.push('高圧セカンダリー'); }
  if(h.battery==='あり'){ out.push('低圧蓄電池','系統用蓄電池'); }
  if(h.tax==='あり' && !out.includes('低圧蓄電池')) out.push('低圧蓄電池');
  if(h.owns==='あり' && !out.includes('現地視察・無料診断')) out.push('現地視察・無料診断');
  return [...new Set(out)];
}

/* ===================== 集計 ===================== */
const alive = () => DB.cards.filter(c=>c.phase!=='LOST');
function dueList(){
  return alive().filter(c=>c.nextDate).sort((a,b)=> (a.nextDate>b.nextDate?1:-1));
}
function overdue(){ return dueList().filter(c=> dayDiff(c.nextDate) < 0); }
function todayDue(){ return dueList().filter(c=> dayDiff(c.nextDate) === 0); }
function stalled(){
  return alive().filter(c=>{
    const last = (c.logs&&c.logs[0]&&c.logs[0].at) || c.updatedAt || c.createdAt;
    if(!last) return false;
    return (Date.now() - new Date(last).getTime())/86400000 >= 3 && ['S','A'].includes(c.rank);
  });
}
function grossOf(list){ return list.reduce((s,c)=> s + (Number(c.gross)||0), 0); }

/* ===================== 画面切替 ===================== */
const NAVS = [
  {id:'home',  ico:'home',  label:'ホーム',          title:'ホーム',           sub:'今日やることから始める'},
  {id:'list',  ico:'list',  label:'顧客一覧',        title:'顧客一覧',         sub:'名刺から生まれた見込み客'},
  {id:'pipe',  ico:'pipe',  label:'商談パイプライン', title:'商談パイプライン', sub:'PH01 見極め → PH08 受注'},
  {id:'dash',  ico:'dash',  label:'ダッシュボード',   title:'ダッシュボード',   sub:'社長・部門長が見る数字'},
  {id:'manual',ico:'manual',label:'使い方',          title:'使い方',           sub:'運用ルール・取込・設定'}
];
let TAB = 'home';

function weekCount(){
  const t=new Date(); const mon=new Date(t); mon.setDate(t.getDate()-((t.getDay()+6)%7)); mon.setHours(0,0,0,0);
  return DB.cards.filter(c=> c.createdAt && new Date(c.createdAt) >= mon).length;
}
function drawNav(){
  const ov = overdue().length;
  $('#nav').innerHTML = NAVS.map(n=>
    `<button class="${n.id===TAB?'on':''}" onclick="go('${n.id}')">${SVGI(ICONS[n.ico])}${n.label}`+
    (n.id==='home'&&ov?`<span class="cnt num">${ov}</span>`:'')+`</button>`).join('');
  $('#tabs').innerHTML = NAVS.map(n=>
    `<button class="${n.id===TAB?'on':''}" onclick="go('${n.id}')">${SVGI(ICONS[n.ico],20)}${n.label}`+
    (n.id==='home'&&ov?`<span class="cnt num">${ov}</span>`:'')+`</button>`).join('');
  const w = weekCount(), pct = Math.min(100, Math.round(w/WEEK_TARGET*100));
  $('#greet').innerHTML = `
    <div>${SVGI(ICONS.check,22)}</div>
    <div><span class="num">${fulldate()}</span><b>${greeting()}！</b></div>
    <div class="wk"><span>今週の新規名刺</span>
      <div class="wkbar"><div class="tr"><div class="fi" style="width:${pct}%"></div></div>
      <span class="num">${w}/${WEEK_TARGET}件</span></div></div>`;
}
function go(id){ TAB=id; render(); window.scrollTo(0,0); }
function render(){
  const n = NAVS.find(x=>x.id===TAB);
  $('#ttl').textContent = n.title; $('#tsub').textContent = n.sub;
  drawNav();
  $('#view').innerHTML = ({home:vHome, list:vList, pipe:vPipe, dash:vDash, manual:vManual})[TAB]();
}

function kpiCard(icon, bg, color, label, value, sub, bad){

}
function dueCard(c){
  const d = dayDiff(c.nextDate);

  const when = d===null?'期限なし': d<0?`${-d}日 超過`: d===0?'今日':`あと${d}日`;
  return `<div class="due ${cls}">
    <span class="rank ${c.rank}">${c.rank}</span>
    <div class="body" onclick="openCard('${c.id}')">
      <div class="co">${esc(c.company||'（会社名なし）')}</div>
      <div class="pn">${esc(c.name||'')}${c.title?' ／ '+esc(c.title):''}　担当：${esc(c.owner||'未定')}</div>
      <div class="act">${esc(c.nextAction||'次の行動が未設定')}</div>
      <div class="when ${d<0?'over':''}"><span class="num">${jdate(c.nextDate)}</span>・${when}</div>
    </div>
    <div class="side">
      <button class="btn sm" onclick="doneAction('${c.id}')">連絡した</button>
      <button class="btn sm ghost" onclick="openCard('${c.id}')">開く</button>

}

/* ===================== 顧客一覧 ===================== */
let FIL = {q:'', rank:'', owner:'', phase:''};
function filtered(){
  let rows = DB.cards.slice();
  if(FIL.q){ const q=FIL.q.toLowerCase();
    rows = rows.filter(c=>[c.company,c.name,c.kana,c.email,c.tel,c.address,c.metPlace].join(' ').toLowerCase().includes(q)); }
  if(FIL.rank) rows = rows.filter(c=>c.rank===FIL.rank);
  if(FIL.owner) rows = rows.filter(c=>c.owner===FIL.owner);
  if(FIL.phase) rows = rows.filter(c=>c.phase===FIL.phase);
  return rows.sort((a,b)=> (RANKS.indexOf(a.rank)-RANKS.indexOf(b.rank)) || ((b.createdAt||'')>(a.createdAt||'')?1:-1));
}
function vList(){
  const owners = [...new Set(DB.cards.map(c=>c.owner).filter(Boolean))];
  return `
  <div class="sec card pad">
    <div class="row">
      <input type="text" placeholder="会社名・氏名・電話・場所で検索" value="${esc(FIL.q)}" style="flex:1;min-width:200px"
        oninput="FIL.q=this.value; document.getElementById('tbl').innerHTML=listTable(filtered())">
      <select onchange="FIL.rank=this.value; render()" style="width:auto"><option value="">ランク：すべて</option>${RANKS.map(r=>`<option ${FIL.rank===r?'selected':''}>${r}</option>`).join('')}</select>
      <select onchange="FIL.phase=this.value; render()" style="width:auto"><option value="">フェーズ：すべて</option>${PHASES.map(p=>`<option value="${p.id}" ${FIL.phase===p.id?'selected':''}>${p.id} ${p.name}</option>`).join('')}</select>
      <select onchange="FIL.owner=this.value; render()" style="width:auto"><option value="">担当：すべて</option>${owners.map(o=>`<option ${FIL.owner===o?'selected':''}>${esc(o)}</option>`).join('')}</select>
      <button class="btn ghost sm" onclick="exportCSV()">CSV出力</button>
    </div>
  </div>
  <div class="sec card"><div id="tbl">${listTable(filtered())}</div></div>`;
}
function listTable(rows){
  if(!rows.length) return `<div class="empty"><b>該当する顧客がいません</b>条件を変えるか、名刺を登録してください。</div>`;
  return `<div class="scroll"><table>
    <tr><th>ランク</th><th>会社・氏名</th><th>提案</th><th>フェーズ</th><th>次の行動</th><th>期限</th><th style="text-align:right">想定粗利</th><th>担当</th></tr>
    ${rows.map(c=>{
      const d = dayDiff(c.nextDate); const p = PHASES.find(x=>x.id===(c.phase||'PH01'))||PHASES[0];
      return `<tr class="clickable" onclick="openCard('${c.id}')">
        <td><span class="rank ${c.rank}">${c.rank}</span></td>
        <td><b>${esc(c.company||'—')}</b><br><span style="font-size:12px;color:var(--muted)">${esc(c.name||'')}</span></td>
        <td style="font-size:12px">${(c.services||[]).slice(0,2).map(s=>`<span class="tag">${esc(s)}</span>`).join(' ')||'—'}</td>
        <td><span class="pill" style="font-size:11px;font-weight:900;padding:3px 9px;border-radius:7px;background:${p.c};color:${p.t}">${p.id}</span></td>
        <td style="max-width:220px">${esc(c.nextAction||'未設定')}</td>
        <td class="num" style="color:${d<0?'var(--alert)':'inherit'};white-space:nowrap">${c.nextDate? jdate(c.nextDate):'—'}</td>
        <td class="num" style="text-align:right;white-space:nowrap">${c.gross?oku(c.gross):'—'}</td>
        <td style="font-size:12px;white-space:nowrap">${esc(c.owner||'未定')}</td>
      </tr>`;}).join('')}
  </table></div>`;
}

/* ===================== パイプライン ===================== */
function vPipe(){
  const byOwner = {};
  alive().forEach(c=>{ byOwner[c.owner||'担当未定'] = (byOwner[c.owner||'担当未定']||0)+(Number(c.gross)||0); });
  return `
  <div class="sec kpi">
    ${PHASES.filter(p=>p.id!=='LOST').slice(0,4).map(p=>{
      const l = DB.cards.filter(c=>(c.phase||'PH01')===p.id);
      return `<div class="k"><div class="ib" style="background:${p.c};color:${p.t};font-size:11.5px;font-weight:900">${p.id}</div>
        <div class="tx"><span>${p.name}</span><b class="num">${l.length}</b><small>${oku(grossOf(l))}</small></div></div>`;
    }).join('')}
  </div>
  <div class="sec pipe">
    ${PHASES.map(p=>{
      const l = DB.cards.filter(c=>(c.phase||'PH01')===p.id).sort((a,b)=>RANKS.indexOf(a.rank)-RANKS.indexOf(b.rank));
      return `<div class="col" data-ph="${p.id}" ondragover="event.preventDefault();this.classList.add('dragover')"
        ondragleave="this.classList.remove('dragover')" ondrop="dropCard(event,'${p.id}')">
        <h4><span class="pill" style="background:${p.c};color:${p.t};padding:3px 9px;border-radius:7px">${p.id}</span> ${p.name}<em class="num">${l.length}</em></h4>
        <div class="sum num">${oku(grossOf(l))}</div>
        ${l.map(c=>`<div class="pc" draggable="true" data-id="${c.id}" ondragstart="event.dataTransfer.setData('text',this.dataset.id)" onclick="openCard('${c.id}')">
          <b>${esc(c.company||'—')}</b>
          <div class="m"><span class="rank ${c.rank}">${c.rank}</span>${esc(c.owner||'担当未定')}${c.gross?' ・<span class="num">'+oku(c.gross)+'</span>':''}</div>
          ${c.nextDate?`<div class="m" style="color:${dayDiff(c.nextDate)<0?'var(--alert)':'var(--muted)'}">${jdate(c.nextDate)} ${esc((c.nextAction||'').slice(0,14))}</div>`:'<div class="m" style="color:var(--alert)">次の行動が未設定</div>'}
        </div>`).join('') || '<div style="font-size:12px;color:var(--muted);padding:6px 2px">案件なし</div>'}
      </div>`;
    }).join('')}
  </div>
  <div class="sec card pad">
    <h3 class="h">${SVGI(ICONS.dash,19)} 担当者別の想定粗利</h3>
    ${Object.entries(byOwner).sort((a,b)=>b[1]-a[1]).map(([o,v])=>
      `<div class="row" style="justify-content:space-between;border-bottom:1px solid #EEF2F5;padding:8px 0"><span>${esc(o)}</span><b class="num">${oku(v)}</b></div>`).join('')||'<div class="empty">案件がありません</div>'}
  </div>`;
}
function dropCard(ev, ph){
  ev.preventDefault();
  document.querySelectorAll('.col').forEach(c=>c.classList.remove('dragover'));
  const id = ev.dataTransfer.getData('text'); const c = DB.cards.find(x=>x.id===id);
  if(!c || c.phase===ph) return;
  const old = c.phase||'PH01'; c.phase = ph;
  save(c, `フェーズを ${old} → ${ph} に変更`);
  toast(`${c.company} を ${ph} へ移動しました`);
  render();
}

/* ===================== ダッシュボード ===================== */
function vDash(){
  const all = DB.cards, a = alive();
  const sa = a.filter(c=>['S','A'].includes(c.rank));
  const ph4 = a.filter(c=>['PH04','PH06','PH08'].includes(c.phase||''));
  const won = all.filter(c=>c.phase==='PH08');
  const lost = all.filter(c=>c.phase==='LOST');
  const contacted = all.filter(c=>(c.logs||[]).length>0);
  const rate = all.length? Math.round(contacted.length/all.length*100):0;
  const byOwner = {};
  a.forEach(c=>{ const o=c.owner||'担当未定'; byOwner[o]=byOwner[o]||{n:0,g:0,over:0,sa:0};
    byOwner[o].n++; byOwner[o].g+=Number(c.gross)||0;
    if(dayDiff(c.nextDate)<0) byOwner[o].over++;
    if(['S','A'].includes(c.rank)) byOwner[o].sa++; });
  const byPlace = {};
  all.forEach(c=>{ const p=c.metPlace||'その他'; byPlace[p]=(byPlace[p]||0)+1; });

  return `
  <div class="sec kpi">
    <div class="k"><span>名刺の総数</span><b class="num">${all.length}</b><small>今月 ${all.filter(c=>(c.createdAt||'').slice(0,7)===today().slice(0,7)).length}枚</small></div>
    <div class="k"><span>初回連絡の完了率</span><b class="num">${rate}%</b><small>${contacted.length}/${all.length}件</small></div>
    <div class="k"><span>S・Aランク</span><b class="num">${sa.length}</b><small>${oku(grossOf(sa))}</small></div>
    <div class="k"><span>無料診断の獲得</span><b class="num">${all.filter(c=>c.diag).length}</b></div>
    <div class="k"><span>現地視察の獲得</span><b class="num">${all.filter(c=>c.visit).length}</b></div>
    <div class="k"><span>PH04以降</span><b class="num">${ph4.length}</b><small>${oku(grossOf(ph4))}</small></div>
    <div class="k"><span>受注（PH08）</span><b class="num">${won.length}</b><small>粗利 ${oku(grossOf(won))}</small></div>
    <div class="k ${overdue().length?'bad':''}"><span>期限超過</span><b class="num">${overdue().length}</b><small>全社の滞留</small></div>
  </div>

  <div class="sec card pad">
    <h3 class="h">パイプライン <span class="note">フェーズ別の想定粗利</span></h3>
    ${PHASES.filter(p=>p.id!=='LOST').map(p=>{
      const l=a.filter(c=>(c.phase||'PH01')===p.id); const g=grossOf(l);
      const max=Math.max(1,...PHASES.map(x=>grossOf(a.filter(c=>(c.phase||'PH01')===x.id))));
      return `<div style="margin-bottom:9px">
        <div class="row" style="justify-content:space-between;font-size:13px"><span><b>${p.id}</b> ${p.name}<span style="color:var(--muted)"> ${l.length}件</span></span><b class="num">${oku(g)}</b></div>
        <div style="height:7px;background:#EDF0EC;border-radius:4px;overflow:hidden;margin-top:3px"><div style="height:100%;width:${Math.round(g/max*100)}%;background:var(--sun)"></div></div>
      </div>`;}).join('')}
  </div>

  <div class="sec card pad">
    <h3 class="h">担当者別 <span class="note">滞留が赤字</span></h3>
    <div class="scroll"><table>
      <tr><th>担当</th><th style="text-align:right">案件</th><th style="text-align:right">S・A</th><th style="text-align:right">想定粗利</th><th style="text-align:right">期限超過</th></tr>
      ${Object.entries(byOwner).sort((a,b)=>b[1].g-a[1].g).map(([o,v])=>`<tr>
        <td>${esc(o)}</td><td class="num" style="text-align:right">${v.n}</td><td class="num" style="text-align:right">${v.sa}</td>
        <td class="num" style="text-align:right">${oku(v.g)}</td>
        <td class="num" style="text-align:right;color:${v.over?'var(--alert)':'inherit'};font-weight:${v.over?700:400}">${v.over}</td></tr>`).join('')
        ||'<tr><td colspan="5" class="empty">データがありません</td></tr>'}
    </table></div>
  </div>

  <div class="sec card pad">
    <h3 class="h">獲得経路</h3>
    ${Object.entries(byPlace).sort((a,b)=>b[1]-a[1]).map(([p,v])=>
      `<div class="row" style="justify-content:space-between;border-bottom:1px solid #EDF0EC;padding:6px 0"><span>${esc(p)}</span><b class="num">${v}枚</b></div>`).join('')||'<div class="empty">データがありません</div>'}
    ${lost.length?`<div style="margin-top:12px;font-size:13px;color:var(--muted)">見送り ${lost.length}件（理由は各顧客の履歴に記録）</div>`:''}

/* ---------- AI読み取り ---------- */
function pickImg(input){
  const files = [...input.files].slice(0,2);
  files.forEach(f=>{
    const r = new FileReader();
    r.onload = () => {
      IMGS.push({media_type:f.type||'image/jpeg', data:String(r.result).split(',')[1]});
      if(IMGS.length>2) IMGS = IMGS.slice(-2);
      drawScan();
    };
    r.readAsDataURL(f);
  });
}
async function runOCR(){
  if(!IMGS.length) return;
  $('#ocrBtn').disabled = true;
  $('#ocrMsg').textContent = '読み取っています…';
  const sys = '名刺画像から情報を抽出する。JSONのみを返し、前置き・コードフェンスは書かない。';
  const prompt = 'この名刺画像から次のキーのJSONを作る。値が読み取れないキーは空文字にする。'+
    '{"company":"","name":"","kana":"","dept":"","title":"","tel":"","mobile":"","email":"","address":"","website":"","industry":""}';
  try{
    const res = await fetch(AI_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+SUPA_KEY},
      body: JSON.stringify({system:sys, prompt, max_tokens:800, images:IMGS})
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const j = await res.json();
    const txt = j.text || (Array.isArray(j.content)? j.content.filter(x=>x.type==='text').map(x=>x.text).join('') : '') || '';
    const m = txt.replace(/```json|```/g,'').match(/\{[\s\S]*\}/);
    if(!m) throw new Error('読み取り結果を解析できません');
    const o = JSON.parse(m[0]);
    ['company','name','kana','dept','title','tel','mobile','email','address','website','industry'].forEach(k=>{ if(o[k]) DRAFT[k]=o[k]; });
    drawScan();
    $('#ocrMsg').textContent = '読み取りました。間違いがあれば直してください。';
    toast('名刺を読み取りました');
  }catch(e){
    $('#ocrBtn').disabled = false;
    $('#ocrMsg').innerHTML = '<span style="color:var(--alert)">自動読み取りに失敗しました（'+esc(e.message)+'）。下の欄に手入力してください。</span>';
  }
}

function parseCSV(text){
  text = text.replace(/^\uFEFF/,'');
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; }
      else cell+=ch;
    }else{
      if(ch==='"') q=true;
      else if(ch===','){ row.push(cell); cell=''; }
      else if(ch==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
      else if(ch!=='\r') cell+=ch;
    }
  }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(v=>String(v).trim()!==''));
}

let IMP = null;
function openMap(input){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    const rows=parseCSV(String(r.result));
    if(rows.length<2){ toast('データのある行が見つかりません'); return; }
    const head=rows[0].map(h=>String(h).trim());
    const map={}, used=new Set();
    MAPFIELDS.forEach(f2=>{
      const hit=head.findIndex((h,n)=>!used.has(n) && f2.cand.some(c=>h.includes(c)));
      map[f2.k]= hit>=0? hit : -1;
      if(hit>=0) used.add(hit);
    });
    IMP={head, body:rows.slice(1), map};
    drawMap();
  };
  r.readAsText(f,'UTF-8');
}

  $('#appIcon').src = APP_ICON;
  $('#corpLogo').src = CORP_LOGO;
  cacheLoad();
  render();

    if(window.EC && EC.guard){
