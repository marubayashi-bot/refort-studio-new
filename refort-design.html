}

.kv dt{color:var(--sub)} .kv dd{margin:0}
.report h2{border-bottom:2px solid var(--ink);padding-bottom:4px;margin:18px 0 8px}

.lay-ed{border:1px solid var(--line);border-radius:var(--r-s);background:#fff;height:min(68vh,720px);touch-action:none;overflow:hidden}

.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;margin:2px 4px 8px;align-items:center}

.lay-view{border:1px solid var(--line);border-radius:var(--r-s);background:#fff}

  .check,.tally div{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

 (s.masters.panel||[]).forEach(x=>{if(x.w==null||x.h==null){const d=PANEL_DIM[x.id]; x.w=d?d[0]:null; x.h=d?d[1]:null}});
 (s.projects||[]).forEach(p=>{ if(!p.layoutBefore) p.layoutBefore={panelId:s.masters.panel[0]?.id,panels:[],locked:false,savedAt:null}; if(p.layoutBg===undefined) p.layoutBg=null });
 return s;
}
function load(){
 try{const raw=localStorage.getItem(KEY); if(raw) return migrate(JSON.parse(raw));}catch(e){}
 const s={projects:[],masters:defaultMasters(),settings:defaultSettings(),currentId:null};
 const demo=demoProject(); s.projects.push(demo); s.currentId=demo.id; return s;
}
function save(){
 try{localStorage.setItem(KEY,JSON.stringify(S)); return true}
 catch(e){toast('保存できませんでした。写真の容量が上限に近いため、データを書き出してから不要な写真を削除してください。'); return false}
}

function pcsCurrent(pcs,n,st){return n*pcs.kw*1000/(Math.sqrt(3)*pcs.acV*st.pf)}
function dropPct(I,L,cab,par,V,st){
 const cos=st.pf, sin=Math.sqrt(1-cos*cos);
 const dv=Math.sqrt(3)*I*(L/1000)*(cab.r*cos+cab.x*sin)/par; return {dv,pct:dv/V*100};
}

 return {C,metrics};
}
function maxSeries(pv,pcs,tMin){let n=1; while(pv.voc*(1+pv.tcVoc/100*(tMin-25))*(n+1)<=pcs.maxDcV && pv.vmp*(1+pv.tcVmp/100*(tMin-25))*(n+1)<=pcs.mpptMax) n++; return n}
function tally(C){const t={ok:0,ng:0,unk:0,na:0}; C.forEach(c=>t[c.v]++); return t}
function circuitVerdict(C,cid){let w='ok'; C.filter(c=>c.cid===cid).forEach(c=>{if(VRANK[c.v]>VRANK[w]) w=c.v}); return w}

/* ---------- 自動選定 ---------- */
function autoSelect(d){
 const st=S.settings,M=S.masters,pcs=byId(M.pcs,d.pcsId); if(!pcs) return 0;
 const cables=[...M.cable].sort((a,b)=>a.sq-b.sq), brs=[...M.breaker].sort((a,b)=>a.ratedA-b.ratedA); let changed=0;
 d.circuits.forEach(c=>{
  const n=c.type==='main'?d.pcsQty:(+c.pcsN||0); if(!n) return;
  const I=pcsCurrent(pcs,n,st), mf=st.methods[c.method]??1, br=brs.find(b=>b.ratedA>=I*st.breakerMargin); if(!br) return;
  let pick=null;
  for(let par=Math.max(1,+c.par||1); par<=st.maxPar && !pick; par++){
   for(const cab of cables){
    const allow=cab.amp*mf*par, pct=c.lenM?dropPct(I,+c.lenM,cab,par,pcs.acV,st).pct:0;
    if(allow>=br.ratedA && pct<=st.dropLimit){pick={cab,par};break}
   }
  }
  if(pick){ if(c.cableId!==pick.cab.id||+c.par!==pick.par||c.breakerId!==br.id) changed++; c.cableId=pick.cab.id;c.par=pick.par;c.breakerId=br.id }
 });
 return changed;
}
function pcsOptions(p,d){
 const st=S.settings,M=S.masters,pv=byId(M.panel,d.panelId); if(!pv) return [];
 const kva=sv(p,'trafo_kva'), v2=sv(p,'trafo_v2'), tMin=sv(p,'temp_min'); syncFromLayout(d); const pvKw=d._pvKw??pv.pmax*d.panelCount/1000;
 return M.pcs.map(pcs=>{
  const qMin=Math.ceil(pvKw/(pcs.kw*st.dcacMax)), qMax=kva!=null?Math.floor(kva*st.trafoMax*st.pf/pcs.kw):Infinity;
  let q=Math.ceil(pvKw/(pcs.kw*st.dcacTarget)); q=Math.max(q,qMin); if(q>qMax) q=qMax;
  const reasons=[]; let v='ok';
  if(qMin>qMax){v='ng';reasons.push('トランス容量内で過積載率の上限を守れない')}
  if(v2!=null && Math.abs(pcs.acV-v2)/v2>0.05){v='ng';reasons.push(`出力電圧${pcs.acV}Vが二次電圧${v2}Vと不一致`)}
  if(kva==null||v2==null){if(v==='ok')v='unk';reasons.push('トランス条件が未確認')}
  const sMax=tMin!=null?maxSeries(pv,pcs,tMin):null; let ser=sMax;
  if(sMax){for(let n=sMax;n>=Math.ceil(sMax*0.7);n--){if(d.panelCount%n===0){ser=n;break}}}
  const strings=ser?Math.floor(d.panelCount/ser):null;
  const spm=strings&&q>0?Math.ceil(strings/(q*pcs.nMppt)):null;
  if(spm&&pv.imp*spm>pcs.maxIin){if(v==='ok')v='ng';reasons.push(`MPPT入力電流超過（${f(pv.imp*spm)}A＞${pcs.maxIin}A）`)}
  if(tMin==null) reasons.push('最低気温が未確認のため直列数は未算出');
  return {pcs,q:Math.max(q,0),dcac:q>0?pvKw/(pcs.kw*q):null,trafo:kva?pcs.kw*q/st.pf/kva:null,ser,spm,v,reasons};
 });
}

function quantities(p,d){

 syncFromLayout(d);
 if(d._linked) Object.entries(d._byType).forEach(([id,n])=>{const x=byId(M.panel,id); if(x) rows.push({k:'パネル',name:x.name,q:n,u:'枚',price:x.price,note:'変更後レイアウトより'})});
 else if(pv) rows.push({k:'パネル',name:pv.name,q:d.panelCount,u:'枚',price:pv.price});
 if(pcs) rows.push({k:'PCS',name:pcs.name,q:d.pcsQty,u:'台',price:pcs.price});
 const cab={}; d.circuits.forEach(c=>{const x=byId(M.cable,c.cableId); if(!x||!c.lenM) return; cab[x.id]=(cab[x.id]||0)+c.lenM*Math.max(1,+c.par||1)});
 Object.entries(cab).forEach(([id,m])=>{const x=byId(M.cable,id); rows.push({k:'交流電線',name:x.name,q:Math.ceil(m*(1+st.allowance)),u:'m',price:x.price,note:`実長${f(m,0)}m＋余長${st.allowance*100}%`})});
 if(pv&&d.dcLen){const strings=Math.floor(d.panelCount/d.series); rows.push({k:'直流電線',name:'PV用ケーブル（往復）',q:Math.ceil(strings*2*d.dcLen*(1+st.allowance)),u:'m',price:0,note:`${strings}回路×2×平均${d.dcLen}m（概算）`})}
 const br={}; d.circuits.forEach(c=>{if(c.breakerId) br[c.breakerId]=(br[c.breakerId]||0)+1});

 rows.forEach(r=>r.cost=r.price>0?r.q*r.price:null);
 return rows;
}

function sld(p,d,C){

 const br=d.circuits.filter(c=>c.type!=='main'), main=d.circuits.find(c=>c.type==='main');
 const colW=150,n=Math.max(br.length,1),W=Math.max(340,n*colW+40),cx=W/2,H=440;
 const col=v=>({ok:'var(--ok)',ng:'var(--ng)',unk:'var(--unk)',na:'var(--na)'}[v]);
 const kva=sv(p,'trafo_kva'),v2=sv(p,'trafo_v2');
 const mv=main?circuitVerdict(C,main.id):'unk', mb=main&&byId(M.breaker,main.breakerId), mc=main&&byId(M.cable,main.cableId);
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="単線結線図">`;
 s+=`<text x="${cx}" y="14" text-anchor="middle" class="svg-t">受電点</text><line x1="${cx}" y1="20" x2="${cx}" y2="44" class="svg-ink" stroke-width="2"/>`;
 s+=`<circle cx="${cx}" cy="58" r="15" class="svg-ink" stroke-width="2"/><circle cx="${cx}" cy="78" r="15" class="svg-ink" stroke-width="2"/>`;
 s+=`<text x="${cx+24}" y="64" class="svg-t">トランス ${kva!=null?kva+'kVA':'容量未確認'}</text><text x="${cx+24}" y="78" class="svg-s">二次 ${v2!=null?v2+'V':'未確認'}</text>`;
 s+=`<line x1="${cx}" y1="93" x2="${cx}" y2="118" stroke="${col(mv)}" stroke-width="3"/>`;
 s+=`<rect x="${cx-9}" y="118" width="18" height="24" fill="var(--sheet)" stroke="${col(mv)}" stroke-width="2"/>`;
 s+=`<text x="${cx+16}" y="130" class="svg-t">${mb?mb.ratedA+'A':'遮断器未選択'}</text><text x="${cx+16}" y="143" class="svg-s">${mc?mc.name+'×'+(main.par||1)+' '+(main.lenM||'?')+'m':''}</text>`;
 s+=`<line x1="${cx}" y1="142" x2="${cx}" y2="170" stroke="${col(mv)}" stroke-width="3"/>`;
 const x0=20+colW/2, x1=20+colW*(n-1)+colW/2;
 s+=`<line x1="${Math.min(x0,cx)}" y1="172" x2="${Math.max(x1,cx)}" y2="172" class="svg-ink" stroke-width="5"/><text x="${Math.min(x0,cx)-6}" y="166" class="svg-s">集電盤</text>`;
 br.forEach((c,i)=>{
  const x=20+colW*i+colW/2, v=circuitVerdict(C,c.id), b=byId(M.breaker,c.breakerId), cb=byId(M.cable,c.cableId), k=col(v);
  s+=`<line x1="${x}" y1="172" x2="${x}" y2="196" stroke="${k}" stroke-width="3"/>`;
  s+=`<rect x="${x-9}" y="196" width="18" height="24" fill="var(--sheet)" stroke="${k}" stroke-width="2"/><text x="${x+14}" y="212" class="svg-t">${b?b.ratedA+'A':'—'}</text>`;
  s+=`<line x1="${x}" y1="220" x2="${x}" y2="300" stroke="${k}" stroke-width="3" ${v==='ng'?'stroke-dasharray="6 4"':''}/>`;
  s+=`<text x="${x+8}" y="250" class="svg-s">${cb?esc(cb.name):'電線未選択'}${(+c.par||1)>1?'×'+c.par:''}</text><text x="${x+8}" y="264" class="svg-s">${c.lenM||'?'}m ${esc(c.method)}</text>`;
  s+=`<rect x="${x-44}" y="300" width="88" height="40" rx="3" fill="var(--sheet)" stroke="${k}" stroke-width="2"/>`;
  s+=`<text x="${x}" y="318" text-anchor="middle" class="svg-t">PCS × ${c.pcsN||0}</text><text x="${x}" y="332" text-anchor="middle" class="svg-s">${pcs?pcs.kw+'kW':''}</text>`;
  s+=`<line x1="${x}" y1="340" x2="${x}" y2="360" class="svg-ink" stroke-width="1.5"/>`;
  for(let r=0;r<2;r++)for(let q=0;q<4;q++) s+=`<rect x="${x-34+q*17}" y="${360+r*13}" width="15" height="11" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1"/>`;
  s+=`<text x="${x}" y="402" text-anchor="middle" class="svg-t">${esc(c.name.replace(/（.*?）/,''))}</text>`;
 });
 s+=`<text x="10" y="${H-10}" class="svg-s">${pv?esc(pv.name)+' × '+d.panelCount+'枚／'+d.series+'直列':''}　線色：緑=適合 赤=要修正 黄=未確認</text>`;
 return s+'</svg>';
}

 return `<h1>設計</h1><p class="lead">①〜⑥はどこから直しても構いません。値を変えると、関連する計算と判定がその場で更新されます。</p>

function vVerify(p){
 const d=curDesign(p), {C}=evaluate(p,d), t=tally(C);
 const list=C.filter(c=>UI.filter==='all'||c.v===UI.filter).sort((a,b)=>VRANK[b.v]-VRANK[a.v]);
 const groups=['電気的な適合','発電性能','施工・保守'];
 return `<h1>検証結果</h1><p class="lead">${esc(d.name)}の判定です。容量・電圧・電流の判定は機器マスターの仕様値と計算式で行い、根拠を併記しています。</p>
 ${designSwitcher(p,d)}
 <div class="sheet"><div class="tally"><div class="ng"><b>${t.ng}</b><small>要修正</small></div><div class="unk"><b>${t.unk}</b><small>未確認</small></div><div class="ok"><b>${t.ok}</b><small>適合</small></div><div class="na"><b>${t.na}</b><small>対象外</small></div></div>
 <div class="chips">${[['all','すべて'],['ng','要修正'],['unk','未確認'],['ok','適合'],['na','対象外']].map(([k,l])=>`<button class="${UI.filter===k?'on':''}" data-act="filter" data-f2="${k}">${l}</button>`).join('')}</div>
 ${groups.map(g=>{const xs=list.filter(c=>c.g===g); return xs.length?`<h2 style="margin:16px 0 8px">${g}</h2>${xs.map(chk).join('')}`:''}).join('')||'<p class="muted">該当する項目はありません。</p>'}</div>`;
}

/* ---------- 案比較 ---------- */
function vCompare(p){
 const M=S.masters;
 const rows=p.designs.map(d=>{const {C,metrics:m}=evaluate(p,d),t=tally(C),q=quantities(p,d),pcs=byId(M.pcs,d.pcsId);
  const cost=q.reduce((a,r)=>a+(r.cost||0),0), priced=q.every(r=>r.cost!=null);
  const cab=q.filter(r=>r.k==='交流電線').reduce((a,r)=>a+r.q,0);
  return {d,t,m,pcs,cost,priced,cab}});
 const best=(fn,low=true)=>{const vals=rows.map(fn).filter(v=>v!=null&&!isNaN(v)); return vals.length?(low?Math.min(...vals):Math.max(...vals)):null};
 const line=(label,fn,fmt,low=true)=>{const b=best(fn,low); return `<tr><th>${label}</th>${rows.map(r=>{const v=fn(r); return `<td class="n" style="${v===b&&rows.length>1?'font-weight:700;color:var(--ok)':''}">${fmt(v,r)}</td>`}).join('')}</tr>`};
 return `<h1>案比較</h1><p class="lead">設計案を複製して条件を変えると、性能・施工性・資材量を並べて比較できます。最も良い値を緑で示します。</p>
 <div class="sheet bar"><button class="btn" data-act="dupDesign">現在の案を複製して新しい案を作る</button></div>
 <div class="sheet tw"><table><thead><tr><th></th>${rows.map(r=>`<th>${esc(r.d.name)}${r.d.id===p.activeDesign?'（編集中）':''}</th>`).join('')}</tr></thead><tbody>
  <tr><th>PCS構成</th>${rows.map(r=>`<td>${r.pcs?esc(r.pcs.name)+' × '+r.d.pcsQty:'—'}</td>`).join('')}</tr>
  ${line('要修正',r=>r.t.ng,v=>v)}${line('未確認',r=>r.t.unk,v=>v)}
  ${line('過積載率',r=>r.m.dcac,v=>f(v,2),false)}
  ${line('最大電圧上昇',r=>r.m.totalPct,v=>f(v,2)+'%')}
  ${line('交流配線損失',r=>r.m.lossPct,v=>f(v,2)+'%')}
  ${line('トランス負荷',r=>r.m.trafoRatio,v=>v!=null?f(v*100,0)+'%':'—')}
  ${line('交流電線 合計',r=>r.cab,v=>f(v,0)+'m')}
  ${line('概算資材費',r=>r.priced?r.cost:null,(v,r)=>r.priced?f(v,0)+'円':'単価未登録')}
  <tr><th></th>${rows.map(r=>`<td>${r.d.id===p.activeDesign?'':`<button class="btn ghost sm" data-act="useDesign" data-id="${r.d.id}">この案を編集</button>`}</td>`).join('')}</tr>
 </tbody></table></div>
 <p class="note">年間発電量による比較は第3段階で追加します。資材費は機器マスターに単価を登録すると表示されます。</p>`;
}

/* =========================================================
   レイアウト（既存／変更後／比較・出力）
   データ：既存＝p.layoutBefore、変更後＝設計案ごとの d.layoutAfter、背景画像＝p.layoutBg
   座標はメートル（x右・y下＝北が上）、パネルは中心座標＋回転角
   ========================================================= */
const LCOL={same:'#9DB4CC',add:'#2F9E5B',del:'#D0453B',move:'#E0A21B',type:'#6E56CF',sel:'#1D4E89',stroke:'#33475B'};
const LLABEL={same:'変更なし',add:'追加',del:'削除',move:'移動・回転',type:'型式変更'};
let ED={tool:'select',sel:new Set(),drag:null,undo:[],key:'',vb:null,showGhost:true};
function emptyLayout(pid){return {panelId:pid||S.masters.panel[0]?.id,panels:[],locked:false,savedAt:null}}
function panelOf(L,pnl){return byId(S.masters.panel,pnl.pid||L.panelId)}
function pdim(L,pnl){const m=panelOf(L,pnl); return {w:(m?.w||1000)/1000,h:(m?.h||1700)/1000}}
function layoutStats(L){const s={count:0,kw:0,byType:{}}; if(!L) return s;
 L.panels.forEach(x=>{const m=panelOf(L,x),id=x.pid||L.panelId; s.count++; s.kw+=(m?.pmax||0)/1000; s.byType[id]=(s.byType[id]||0)+1}); return s}
function syncFromLayout(d){
 const L=d.layoutAfter; d._linked=!!(L&&L.panels.length); d._pvKw=null; d._mixed=false; if(!d._linked) return;
 const s=layoutStats(L), dom=Object.entries(s.byType).sort((a,b)=>b[1]-a[1])[0][0];
 d.panelCount=s.count; d.panelId=dom; d._pvKw=s.kw; d._mixed=Object.keys(s.byType).length>1; d._byType=s.byType;
}
function diffLayouts(B,A){
 const bm=new Map((B?.panels||[]).map(x=>[x.id,x])), am=new Map((A?.panels||[]).map(x=>[x.id,x]));
 const cat=new Map(), from=new Map(); const n={add:0,del:0,move:0,type:0,same:0};
 (A?.panels||[]).forEach(a=>{const b=bm.get(a.id); let c;
  if(!b) c='add'; else{const moved=Math.abs(a.x-b.x)>0.005||Math.abs(a.y-b.y)>0.005||((a.rot||0)-(b.rot||0))%360!==0;
   const typ=(a.pid||A.panelId)!==(b.pid||B.panelId); c=moved?'move':typ?'type':'same'; if(moved) from.set(a.id,b)}
  cat.set(a.id,c); n[c]++});
 const removed=(B?.panels||[]).filter(b=>!am.has(b.id)); n.del=removed.length;
 return {cat,from,removed,n,bcat:new Map((B?.panels||[]).map(b=>[b.id,!am.has(b.id)?'del':(from.has(b.id)?'move':'same')]))};
}
function bboxOf(list){
 let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
 list.forEach(([L,pn])=>{const {w,h}=pdim(L,pn),r=Math.max(w,h)/2; x0=Math.min(x0,pn.x-r);y0=Math.min(y0,pn.y-r);x1=Math.max(x1,pn.x+r);y1=Math.max(y1,pn.y+r)});
 return x0===Infinity?null:{x0,y0,x1,y1};
}
function unionBox(p,d){
 const list=[]; (p.layoutBefore?.panels||[]).forEach(x=>list.push([p.layoutBefore,x])); (d?.layoutAfter?.panels||[]).forEach(x=>list.push([d.layoutAfter,x]));
 let b=bboxOf(list); const bg=p.layoutBg;
 if(bg){b=b||{x0:bg.x,y0:bg.y,x1:bg.x+bg.w,y1:bg.y+bg.h}; b={x0:Math.min(b.x0,bg.x),y0:Math.min(b.y0,bg.y),x1:Math.max(b.x1,bg.x+bg.w),y1:Math.max(b.y1,bg.y+bg.h)}}
 if(!b) b={x0:0,y0:0,x1:40,y1:24};
 const m=Math.max(2,(b.x1-b.x0)*0.05); return [b.x0-m,b.y0-m,(b.x1-b.x0)+2*m,(b.y1-b.y0)+2*m];
}
function panelShape(L,pn,fill,opt={}){
 const {w,h}=pdim(L,pn);
 return `<g transform="translate(${pn.x} ${pn.y}) rotate(${pn.rot||0})"><rect ${opt.attr||''} x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" fill="${fill}" fill-opacity="${opt.op??1}" stroke="${opt.stroke||LCOL.stroke}" stroke-width="${opt.sw||0.025}" ${opt.dash?`stroke-dasharray="${opt.dash}"`:''}/></g>`;
}
function bgShape(p,op){const bg=p.layoutBg; return bg?`<image href="${bg.img}" x="${bg.x}" y="${bg.y}" width="${bg.w}" height="${bg.h}" preserveAspectRatio="none" opacity="${op??bg.op??0.5}"/>`:''}
function gridShape(vb,step=5){let s='';const [x,y,w,h]=vb; for(let gx=Math.ceil(x/step)*step;gx<x+w;gx+=step) s+=`<line x1="${gx}" y1="${y}" x2="${gx}" y2="${y+h}" stroke="#9AA8B4" stroke-opacity=".25" stroke-width="${w/1500}"/>`;
 for(let gy=Math.ceil(y/step)*step;gy<y+h;gy+=step) s+=`<line x1="${x}" y1="${gy}" x2="${x+w}" y2="${gy}" stroke="#9AA8B4" stroke-opacity=".25" stroke-width="${w/1500}"/>`; return s}

/* 描画：既存側／変更後側（色分けあり） */
function drawBefore(p,d,diff,opt={}){
 const B=p.layoutBefore; return B.panels.map(x=>{const c=diff?diff.bcat.get(x.id):'same'; return panelShape(B,x,LCOL[c],{attr:opt.edit?`data-pid="${x.id}"`:'',stroke:opt.sel?.has(x.id)?LCOL.sel:undefined,sw:opt.sel?.has(x.id)?0.08:undefined})}).join('');
}
function drawAfter(p,d,diff,opt={}){
 const A=d.layoutAfter, B=p.layoutBefore; let s='';
 if(opt.ghost!==false) s+=diff.removed.map(x=>panelShape(B,x,LCOL.del,{op:0.15,stroke:LCOL.del,dash:'0.15 0.1',sw:0.04})).join('');
 s+=A.panels.map(x=>{const c=diff.cat.get(x.id); return panelShape(A,x,LCOL[c],{attr:opt.edit?`data-pid="${x.id}"`:'',stroke:opt.sel?.has(x.id)?LCOL.sel:undefined,sw:opt.sel?.has(x.id)?0.08:undefined})}).join('');
 if(opt.arrows!==false) diff.from.forEach((b,id)=>{const a=A.panels.find(x=>x.id===id); if(a&&(Math.abs(a.x-b.x)>0.3||Math.abs(a.y-b.y)>0.3)) s+=`<line x1="${b.x}" y1="${b.y}" x2="${a.x}" y2="${a.y}" stroke="${LCOL.move}" stroke-width="0.06" stroke-dasharray="0.2 0.12"/>`});
 return s;
}

/* ---------- 画面 ---------- */
function curLayoutKey(p,d){return UI.lmode==='before'?'B:'+p.id:'A:'+d.id}

   ${A&&!B.locked?'<span class="v unk">既存レイアウトが未確定です</span>':''}</div>`;
  if(!A) return head+top;
 }
 const L=editLayout(p,d), ro=readOnly(p,d), st=layoutStats(L), sel=[...ED.sel].map(id=>L.panels.find(x=>x.id===id)).filter(Boolean);
 const tools=[['select','選択・移動'],['add','1枚追加'],['array','まとめて配置'],['pan','表示移動']];
 const pOpts=(v)=>M.panel.map(x=>`<option value="${x.id}" ${x.id===v?'selected':''}>${esc(x.name)}${x.w&&x.h?'':'（寸法未登録）'}</option>`).join('');
 const ar=UI.arr||(UI.arr={rows:2,cols:10,orient:'縦',gx:0.02,gy:0.02});
 const diffNote=UI.lmode==='after'?(()=>{const df=diffLayouts(B,A); return `<div class="lg">${['same','add','move','type'].map(k=>`<span><i style="background:${LCOL[k]}"></i>${LLABEL[k]} ${df.n[k]}</span>`).join('')}<span><i style="background:${LCOL.del};opacity:.35;outline:1px dashed ${LCOL.del}"></i>削除 ${df.n.del}</span></div>`})():'';
 const side=`<aside class="side"><div class="sheet">
  <dl class="kv"><dt>枚数</dt><dd><b>${st.count.toLocaleString()}</b> 枚</dd><dt>合計容量</dt><dd><b>${f(st.kw,2)}</b> kW</dd>
   ${Object.entries(st.byType).map(([id,n])=>`<dt>${esc(byId(M.panel,id)?.name||id)}</dt><dd>${n}枚</dd>`).join('')}</dl>
  <label class="fld" style="margin-top:10px">このレイアウトの標準パネル<select data-act-change="lpanel" ${ro?'disabled':''}>${pOpts(L.panelId)}</select></label>

  ${sel.length?`<div class="bar"><button class="btn ghost sm" data-act="lrot" data-deg="90">90°回転</button><button class="btn ghost sm" data-act="lrot" data-deg="-15">−15°</button><button class="btn ghost sm" data-act="lrot" data-deg="15">＋15°</button><button class="btn danger sm" data-act="ldel">削除</button></div>
   <label class="fld" style="margin-top:8px">型式を変更<select data-act-change="lselpanel"><option value="">選択</option>${pOpts('')}</select></label>

  <h3 style="margin-top:14px">まとめて配置の設定</h3>

   <div class="bar" style="margin-top:6px"><button class="btn danger sm" data-act="bgdel">背景を削除</button></div>`
   :`<label class="btn ghost sm" style="cursor:pointer;display:inline-block">背景画像を読み込む<input type="file" accept="image/*" data-bg="1" hidden></label>`}
  <p class="muted">背景は既存・変更後・比較で共通です。図面の縮尺に合わせて実寸の幅を入力してください。</p>
 </div></aside>`;
 const toolbar=`<div class="sheet bar noprint" style="position:sticky;top:96px;z-index:5">
  ${ro?'<span class="muted">閲覧のみ</span>':`<div class="seg">${tools.map(([k,l])=>`<button class="${ED.tool===k?'on ok':''}" data-act="ltool" data-k="${k}">${l}</button>`).join('')}</div>

  ${UI.lmode==='after'?`<label class="muted"><input type="checkbox" data-act-change="lghost" ${ED.showGhost?'checked':''}> 削除したパネルを薄く表示</label>`:''}

function editorInner(p,d){
 const vb=ED.vb||(ED.vb=unionBox(p,d)), L=editLayout(p,d); let s=bgShape(p)+gridShape(vb);
 if(UI.lmode==='before') s+=drawBefore(p,d,null,{edit:true,sel:ED.sel});
 else s+=drawAfter(p,d,diffLayouts(p.layoutBefore,L),{edit:true,sel:ED.sel,ghost:ED.showGhost});
 if(ED.drag&&ED.drag.type==='marquee'){const m=ED.drag,x=Math.min(m.x0,m.x1),y=Math.min(m.y0,m.y1); s+=`<rect x="${x}" y="${y}" width="${Math.abs(m.x1-m.x0)}" height="${Math.abs(m.y1-m.y0)}" fill="${LCOL.sel}" fill-opacity=".1" stroke="${LCOL.sel}" stroke-width="${vb[2]/600}"/>`}
 s+=northArrow(vb);
 return s;
}
function northArrow(vb){const [x,y,w]=vb,u=w/40,cx=x+w-u*1.6,cy=y+u*1.8;
 return `<g><path d="M${cx} ${cy-u} L${cx+u*0.5} ${cy+u*0.6} L${cx} ${cy+u*0.25} L${cx-u*0.5} ${cy+u*0.6} Z" fill="#33475B"/><text x="${cx}" y="${cy-u*1.15}" text-anchor="middle" font-size="${u*0.8}" fill="#33475B">N</text></g>`}
function redrawEditor(){const p=cur(),d=curDesign(p),svg=document.querySelector('#layEd svg'); if(!svg) return; if(!ED.vb) ED.vb=unionBox(p,d); svg.setAttribute('viewBox',ED.vb.join(' ')); svg.innerHTML=editorInner(p,d)}
function svgPt(svg,e){const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse())}
const snap=v=>Math.round(v/0.05)*0.05;
function pushUndo(L){ED.undo.push(JSON.stringify(L.panels)); if(ED.undo.length>60) ED.undo.shift()}
function bindEditor(){
 const svg=document.querySelector('#layEd svg'); if(!svg) return; const p=cur(),d=curDesign(p); redrawEditor();
 const L=editLayout(p,d), ro=readOnly(p,d);
 svg.addEventListener('wheel',e=>{e.preventDefault(); const z=e.deltaY>0?1.15:1/1.15, pt=svgPt(svg,e), [x,y,w,h]=ED.vb; ED.vb=[pt.x-(pt.x-x)*z,pt.y-(pt.y-y)*z,w*z,h*z]; redrawEditor()},{passive:false});
 svg.addEventListener('pointerdown',e=>{
  const pt=svgPt(svg,e), hit=e.target.closest('[data-pid]');

  }else{ if(!e.shiftKey) ED.sel=new Set(); ED.drag={type:'marquee',x0:pt.x,y0:pt.y,x1:pt.x,y1:pt.y,add:e.shiftKey} }
  svg.setPointerCapture(e.pointerId); redrawEditor();
 });
 svg.addEventListener('pointermove',e=>{const g=ED.drag; if(!g) return;
  if(g.type==='pan'){ED.vb=[g.vb[0]-(e.clientX-g.cx)*g.k,g.vb[1]-(e.clientY-g.cy)*g.k,g.vb[2],g.vb[3]]; redrawEditor(); return}
  const pt=svgPt(svg,e);
  if(g.type==='move'){const dx=snap(pt.x-g.x0),dy=snap(pt.y-g.y0); if(dx||dy) g.moved=true; L.panels.forEach(x=>{const o=g.orig.get(x.id); if(o){x.x=+(o.x+dx).toFixed(3);x.y=+(o.y+dy).toFixed(3)}}); redrawEditor()}

 });
 svg.addEventListener('pointerup',()=>{const g=ED.drag; ED.drag=null; if(!g) return;
  if(g.type==='move'){ if(!g.moved) ED.undo.pop(); layoutChanged(); return }
  if(g.type==='marquee'){const x0=Math.min(g.x0,g.x1),x1=Math.max(g.x0,g.x1),y0=Math.min(g.y0,g.y1),y1=Math.max(g.y0,g.y1);

  redrawEditor();
 });

function placeArray(L,pt){
 const a=UI.arr, m=byId(S.masters.panel,L.panelId); if(!m){toast('標準パネルを選んでください');return}
 const pw=(m.w||1000)/1000, ph=(m.h||1700)/1000, rot=a.orient==='横'?90:0, cw=rot?ph:pw, chh=rot?pw:ph, g=+a.gx||0;
 const rows=Math.max(1,+a.rows|0), cols=Math.max(1,+a.cols|0); if(rows*cols>3000){toast('一度に配置できるのは3,000枚までです');return}
 pushUndo(L); const ids=new Set();
 for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){const id=uid(); ids.add(id); L.panels.push({id,x:+(snap(pt.x)+cw/2+c*(cw+g)).toFixed(3),y:+(snap(pt.y)+chh/2+r*(chh+g)).toFixed(3),rot})}
 ED.sel=ids; layoutChanged(); toast(`${rows*cols}枚を配置しました`);

function layoutChanged(){const p=cur(),d=curDesign(p); const L=editLayout(p,d); if(L) L.savedAt=new Date().toISOString(); touch(); render()}
function layoutKey(e){
 if(UI.view!=='layout'||UI.lmode==='compare') return; if(e.target.closest('input,select,textarea')) return;
 const p=cur(),d=curDesign(p); if(!p||readOnly(p,d)) return; const L=editLayout(p,d);
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault(); return layoutAct('lundo')}
 if(!ED.sel.size) return;
 if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault(); return layoutAct('ldel')}
 if(e.key==='r'||e.key==='R'){e.preventDefault(); return layoutAct('lrot',90)}
 const st=e.shiftKey?0.5:0.05, mv={ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,-st],ArrowDown:[0,st]}[e.key];
 if(mv){e.preventDefault(); pushUndo(L); L.panels.forEach(x=>{if(ED.sel.has(x.id)){x.x=+(x.x+mv[0]).toFixed(3);x.y=+(x.y+mv[1]).toFixed(3)}}); clearTimeout(ED.kt); redrawEditor(); ED.kt=setTimeout(layoutChanged,400)}
}
function layoutAct(a,arg){
 const p=cur(),d=curDesign(p),L=editLayout(p,d);
 if(a==='lundo'){const s=ED.undo.pop(); if(s){L.panels=JSON.parse(s); ED.sel=new Set([...ED.sel].filter(id=>L.panels.some(x=>x.id===id))); layoutChanged()} return}
 if(a==='ldel'){if(!ED.sel.size) return; pushUndo(L); const n=ED.sel.size; L.panels=L.panels.filter(x=>!ED.sel.has(x.id)); ED.sel=new Set(); layoutChanged(); toast(`${n}枚を削除しました`); return}
 if(a==='lrot'){if(!ED.sel.size) return; pushUndo(L); const deg=+arg;
  const sel=L.panels.filter(x=>ED.sel.has(x.id)), cx=sel.reduce((s,x)=>s+x.x,0)/sel.length, cy=sel.reduce((s,x)=>s+x.y,0)/sel.length, r=deg*Math.PI/180;
  sel.forEach(x=>{ if(sel.length>1){const dx=x.x-cx,dy=x.y-cy; x.x=+(cx+dx*Math.cos(r)-dy*Math.sin(r)).toFixed(3); x.y=+(cy+dx*Math.sin(r)+dy*Math.cos(r)).toFixed(3)} x.rot=(((x.rot||0)+deg)%360+360)%360 });
  layoutChanged(); return}
}

function vLayoutCompare(p,d){
 const B=p.layoutBefore, A=d.layoutAfter, M=S.masters;
 const sw=designSwitcher(p,d);
 if(!B.panels.length) return sw+`<div class="sheet empty">既存レイアウトがまだありません。「既存レイアウト」で作成してください。</div>`;
 const df=A?diffLayouts(B,A):null, sb=layoutStats(B), sa=layoutStats(A), vb=unionBox(p,d);
 const svgB=`<svg viewBox="${vb.join(' ')}" xmlns="http://www.w3.org/2000/svg">${bgShape(p)}${gridShape(vb)}${drawBefore(p,d,df)}${northArrow(vb)}</svg>`;
 const svgA=A?`<svg viewBox="${vb.join(' ')}" xmlns="http://www.w3.org/2000/svg">${bgShape(p)}${gridShape(vb)}${drawAfter(p,d,df)}${northArrow(vb)}</svg>`:'<div class="empty">この設計案には変更後レイアウトがありません。</div>';
 const diffRow=(a,b,u,dg)=>{const x=a-b; return `${x>0?'＋':x<0?'−':'±'}${f(Math.abs(x),dg)}${u}`};
 return sw+`<div class="sheet"><div class="lg">${['same','add','del','move','type'].map(k=>`<span><i style="background:${LCOL[k]}"></i>${LLABEL[k]}</span>`).join('')}<span class="muted">既存側：削除・移動するパネルを色分け／変更後側：削除したパネルは点線で表示</span></div>
  <div class="cmp"><div><h3>既存レイアウト${B.locked?'':'（未確定）'}</h3><div class="lay-view">${svgB}</div></div><div><h3>変更後レイアウト（${esc(d.name)}）</h3><div class="lay-view">${svgA}</div></div></div>
  <div class="tw" style="margin-top:12px"><table><thead><tr><th></th><th class="n">既存</th><th class="n">変更後</th><th class="n">差</th></tr></thead><tbody>
   <tr><th>パネル枚数</th><td class="n">${sb.count.toLocaleString()}枚</td><td class="n">${A?sa.count.toLocaleString()+'枚':'—'}</td><td class="n">${A?diffRow(sa.count,sb.count,'枚',0):'—'}</td></tr>
   <tr><th>合計容量</th><td class="n">${f(sb.kw,2)}kW</td><td class="n">${A?f(sa.kw,2)+'kW':'—'}</td><td class="n">${A?diffRow(sa.kw,sb.kw,'kW',2):'—'}</td></tr>
   ${A?`<tr><th>内訳</th><td class="n" colspan="3">追加 ${df.n.add}枚／削除 ${df.n.del}枚／移動・回転 ${df.n.move}枚／型式変更 ${df.n.type}枚／変更なし ${df.n.same}枚</td></tr>`:''}
  </tbody></table></div>
  <p class="note">容量は機器マスターに登録されたパネルの定格出力から計算しています。</p></div>
 <div class="sheet"><h2>出力</h2><p class="muted">出力には案件名・図面タイトル・作成日（出力した日）を記載します。PDFは印刷画面から「PDFに保存」を選んでください（A3横）。</p>
  <div class="tw"><table><tbody>
  ${[['before','既存レイアウト図'],['after','変更後レイアウト図'],['compare','変更前後比較図']].map(([k,l])=>`<tr><th>${l}</th><td><button class="btn ghost sm" data-act="lout" data-k="${k}" data-fmt="png" ${k!=='before'&&!A?'disabled':''}>画像（PNG）</button> <button class="btn ghost sm" data-act="lout" data-k="${k}" data-fmt="pdf" ${k!=='before'&&!A?'disabled':''}>PDF</button></td></tr>`).join('')}
  </tbody></table></div></div>`;
}
/* 出力用シート（A3横比率・色は固定値） */
function sheetSvg(p,d,kind){
 const W=1680,H=1188,B=p.layoutBefore,A=d.layoutAfter,df=A?diffLayouts(B,A):null,vb=unionBox(p,d),M=S.masters;
 const title={before:'既存レイアウト図',after:`変更後レイアウト図（${d.name}）`,compare:`変更前後比較図（${d.name}）`}[kind];
 const today=new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric'});
 const pad=40, top=110, bottom=190, areas=kind==='compare'?2:1, gap=30, aw=(W-pad*2-gap*(areas-1))/areas, ah=H-top-bottom;
 const sc=Math.min(aw/vb[2],ah/vb[3]);
 const tx=t=>esc(t);
 let s=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="'IBM Plex Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif"><rect width="${W}" height="${H}" fill="#fff"/>`;
 s+=`<rect x="20" y="20" width="${W-40}" height="${H-40}" fill="none" stroke="#16212C" stroke-width="2"/>`;
 s+=`<text x="${pad}" y="70" font-size="30" font-weight="700" fill="#16212C">${tx(title)}</text>`;
 s+=`<text x="${W-pad}" y="56" font-size="18" text-anchor="end" fill="#16212C">案件名：${tx(p.name)}</text><text x="${W-pad}" y="84" font-size="16" text-anchor="end" fill="#56636F">作成日：${today}</text>`;
 s+=`<line x1="20" y1="${top-14}" x2="${W-20}" y2="${top-14}" stroke="#16212C"/>`;
 const area=(i,label,inner)=>{const ax=pad+i*(aw+gap), w=vb[2]*sc, h=vb[3]*sc, ox=ax+(aw-w)/2, oy=top+(ah-h)/2;
  return `${label?`<text x="${ax}" y="${top+8}" font-size="18" font-weight="700" fill="#16212C">${tx(label)}</text>`:''}<rect x="${ox}" y="${oy}" width="${w}" height="${h}" fill="none" stroke="#C7D0D7"/>
   <g transform="translate(${ox} ${oy}) scale(${sc}) translate(${-vb[0]} ${-vb[1]})">${bgShape(p)}${gridShape(vb)}${inner}${northArrow(vb)}</g>`};
 if(kind==='before') s+=area(0,'',drawBefore(p,d,null));
 if(kind==='after') s+=area(0,'',drawAfter(p,d,df));
 if(kind==='compare'){s+=area(0,'既存',drawBefore(p,d,df)); s+=area(1,'変更後',drawAfter(p,d,df))}
 // 縮尺バー
 const nice=[1,2,5,10,20,50,100,200].find(m=>m*sc>=120)||200, by=H-bottom+40;
 s+=`<g><line x1="${pad}" y1="${by}" x2="${pad+nice*sc}" y2="${by}" stroke="#16212C" stroke-width="3"/><line x1="${pad}" y1="${by-6}" x2="${pad}" y2="${by+6}" stroke="#16212C" stroke-width="2"/><line x1="${pad+nice*sc}" y1="${by-6}" x2="${pad+nice*sc}" y2="${by+6}" stroke="#16212C" stroke-width="2"/><text x="${pad}" y="${by+26}" font-size="14" fill="#16212C">${nice} m</text></g>`;
 // 凡例・集計
 const sb=layoutStats(B), sa=layoutStats(A), ly=H-bottom+90;
 const keys=kind==='before'?['same']:kind==='after'?['same','add','move','type','del']:['same','add','del','move','type'];
 if(kind!=='before') s+=keys.map((k,i)=>`<rect x="${pad+i*150}" y="${ly-14}" width="22" height="16" fill="${LCOL[k]}" ${k==='del'&&kind==='after'?'fill-opacity=".2" stroke="'+LCOL.del+'" stroke-dasharray="4 3"':''}/><text x="${pad+i*150+30}" y="${ly}" font-size="15" fill="#16212C">${LLABEL[k]}</text>`).join('');
 const line=(t,i)=>`<text x="${W-pad}" y="${H-bottom+50+i*28}" font-size="16" text-anchor="end" fill="#16212C">${tx(t)}</text>`;
 const typeTxt=st=>Object.entries(st.byType).map(([id,n])=>`${byId(M.panel,id)?.name||id}×${n}`).join('、');
 const sign=(x,dg)=>(x>0?'＋':x<0?'−':'±')+f(Math.abs(x),dg);
 if(kind==='before') [ `パネル ${sb.count.toLocaleString()}枚　合計 ${f(sb.kw,2)}kW`, typeTxt(sb) ].forEach((t,i)=>s+=line(t,i));
 if(kind==='after') [ `パネル ${sa.count.toLocaleString()}枚　合計 ${f(sa.kw,2)}kW`, typeTxt(sa), `追加${df.n.add}／削除${df.n.del}／移動・回転${df.n.move}／型式変更${df.n.type}（枚）` ].forEach((t,i)=>s+=line(t,i));
 if(kind==='compare') [ `既存 ${sb.count.toLocaleString()}枚・${f(sb.kw,2)}kW　→　変更後 ${sa.count.toLocaleString()}枚・${f(sa.kw,2)}kW`, `差　${sign(sa.count-sb.count,0)}枚　${sign(sa.kw-sb.kw,2)}kW`, `追加${df.n.add}／削除${df.n.del}／移動・回転${df.n.move}／型式変更${df.n.type}（枚）` ].forEach((t,i)=>s+=line(t,i));
 s+=`<text x="${W-pad}" y="${H-32}" font-size="12" text-anchor="end" fill="#56636F">ReFort DESIGN　容量は機器マスター登録の定格出力から算出</text>`;
 return s+'</svg>';
}

  adopt:()=>{const d=curDesign(); d.pcsId=b.dataset.pcs; d.pcsQty=+b.dataset.q; if(b.dataset.ser) d.series=+b.dataset.ser;
   const br=d.circuits.filter(c=>c.type!=='main'); const per=Math.floor(d.pcsQty/br.length); br.forEach((c,i)=>c.pcsN=per+(i<d.pcsQty%br.length?1:0));
   touch(); render(); toast('PCS構成を採用しました。分岐回路のPCS台数を均等に振り分けています')},
  dupDesign:()=>{const d=curDesign(); const c=JSON.parse(JSON.stringify(d)); c.id=uid(); c.name=d.name+'（複製）'; c.circuits.forEach(x=>x.id=uid()); p.designs.push(c); p.activeDesign=c.id; touch(); render(); toast('案を複製しました')},
  delDesign:()=>{if(!confirm('この設計案を削除します。')) return; p.designs=p.designs.filter(x=>x.id!==p.activeDesign); p.activeDesign=p.designs[0].id; touch(); render()},
  useDesign:()=>{p.activeDesign=b.dataset.id; UI.view='design'; save(); render()},
  filter:()=>{UI.filter=b.dataset.f2; render()},
  goto:()=>{const g=b.dataset.go; if(g==='survey'){UI.view='survey';render();window.scrollTo(0,0)} else if(g==='master'){UI.view='master';render()} else {UI.view='design';render();document.getElementById(g)?.scrollIntoView({block:'start'})}},
  print:()=>window.print(),
  lmode:()=>{UI.lmode=b.dataset.k; render()},
  lockBefore:()=>{const B=p.layoutBefore; B.locked=true; B.savedAt=new Date().toISOString(); touch(); render(); toast('既存レイアウトとして確定しました')},
  unlockBefore:()=>{if(!confirm('既存レイアウトの確定を解除します。編集すると、変更後レイアウトとの比較結果も変わります。')) return; p.layoutBefore.locked=false; touch(); render()},
  copyAfter:()=>{const d=curDesign(); d.layoutAfter=JSON.parse(JSON.stringify(p.layoutBefore)); d.layoutAfter.locked=false; d.layoutAfter.savedAt=new Date().toISOString(); ED.key=''; touch(); render(); toast('既存レイアウトを複製しました')},
  recopyAfter:()=>{if(!confirm('変更後レイアウトを、既存レイアウトの複製で置き換えます。今の変更後レイアウトは失われます。')) return; A.copyAfter()},
  delAfter:()=>{if(!confirm('この設計案の変更後レイアウトを削除します。設計①のパネルは手入力に戻ります。')) return; delete curDesign().layoutAfter; touch(); render()},
  ltool:()=>{ED.tool=b.dataset.k; render()},
  lundo:()=>layoutAct('lundo'), ldel:()=>layoutAct('ldel'), lrot:()=>layoutAct('lrot',b.dataset.deg),
  lfit:()=>{ED.vb=null; redrawEditor()},
  lzoom:()=>{const z=+b.dataset.z,[x,y,w,h]=ED.vb; ED.vb=[x+w*(1-z)/2,y+h*(1-z)/2,w*z,h*z]; redrawEditor()},
  bgdel:()=>{if(!confirm('背景画像を削除します。')) return; p.layoutBg=null; ED.vb=null; touch(); render()},
  lout:()=>layoutOutput(b.dataset.k,b.dataset.fmt),
  csv:()=>exportCsv(),
  approve:()=>approve(),
  mtab:()=>{UI.mtab=b.dataset.k; render()},
  addMaster:()=>{const k=UI.mtab, o={id:k+'-'+uid(),src:'',rev:'',by:'',price:0}; MCOLS[k].forEach(([f2,,t])=>{if(!(f2 in o)) o[f2]=t?'新規':0}); S.masters[k].push(o); save(); render()},
  delMaster:()=>{const k=UI.mtab,i=+b.dataset.i,x=S.masters[k][i]; const used=S.projects.some(p=>p.designs.some(d=>[d.pcsId,d.panelId].includes(x.id)||d.circuits.some(c=>[c.cableId,c.breakerId].includes(x.id))));
   if(used){toast('設計案で使用中のため削除できません');return} if(!confirm(`「${x.name}」を削除します。`)) return; S.masters[k].splice(i,1); save(); render()},
  resetSettings:()=>{if(!confirm('判定基準を初期値に戻します。')) return; S.settings=defaultSettings(); save(); render()},
  export:()=>{const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}); dl(blob,`refort-design_${new Date().toISOString().slice(0,10)}.json`)},
  import:()=>document.getElementById('importFile').click()
 };
 if(A[a]) A[a]();
});
function dl(blob,name){const u=URL.createObjectURL(blob),x=document.createElement('a'); x.href=u; x.download=name; document.body.appendChild(x); x.click(); x.remove(); setTimeout(()=>URL.revokeObjectURL(u),1000)}
function zoom(src){const m=document.createElement('div'); m.className='modal'; m.innerHTML=`<img src="${src}" alt="拡大画像">`; m.onclick=()=>m.remove(); document.body.appendChild(m)}
function importData(file){ if(!file) return; const r=new FileReader(); r.onload=()=>{try{const s=JSON.parse(r.result); if(!s.projects||!s.masters) throw 0;
 if(!confirm('現在のデータを読み込んだデータに置き換えます。')) return; S=migrate(s); save(); render(); toast('読み込みました')}catch(e){toast('読み込めませんでした。ReFort DESIGNで書き出したJSONファイルを選んでください')}}; r.readAsText(file)}
function exportCsv(){const p=cur(),d=curDesign(),q=quantities(p,d);
 const lines=[['区分','品名','数量','単位','単価','金額','備考'],...q.map(r=>[r.k,r.name,r.q,r.u,r.price||'',r.cost??'',r.note||''])].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(','));
 dl(new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv'}),`数量表_${p.name}_${d.name}.csv`)}
function approve(){const p=cur(),d=curDesign(),{C}=evaluate(p,d),t=tally(C);
 const by=document.getElementById('ap_by').value.trim(), cm=document.getElementById('ap_comment').value.trim();
 if(t.ng){toast('要修正が残っているため承認できません');return} if(!by){toast('承認者を入力してください');return}
 if(t.unk&&!cm){toast('未確認事項の扱いをコメントに記入してください');return}
 p.approvals.push({ver:p.approvals.length+1,date:new Date().toISOString(),by,comment:cm,design:d.name,unk:t.unk,snapshot:JSON.parse(JSON.stringify(d))});
 p.status='承認済み'; touch(); render(); toast(`v${p.approvals.length} を確定しました`)}
function compress(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file); img.onload=()=>{const max=1280,s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
 c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg',0.72))}; img.onerror=rej; img.src=u})}

/* ---------- AI読み取り（社内共通Edge Function経由） ---------- */
let sb=null;
function sbClient(){ if(sb) return sb; try{ if(window.supabase) sb=window.supabase.createClient(SB_URL,SB_KEY) }catch(e){} return sb }
async function aiRead(key,btn){
 const p=cur(), it=p.survey[key], def=SURVEY_ITEM[key], targets=def.ai.map(k=>SURVEY_ITEM[k]);
 const c=sbClient(); let token=null;
 try{ const {data}=await c.auth.getSession(); token=data?.session?.access_token }catch(e){}
 if(!token){toast('AI読み取りには社内アカウントでのログインが必要です（社内アプリからログインしてから開いてください）');return}
 btn.disabled=true; btn.textContent='読み取り中…';
 const fields=targets.map(t=>`"${t.k}": ${t.l}${t.u?`（単位 ${t.u}、数値のみ）`:''}`).join('\n');
 const prompt=`この写真は太陽光発電所の「${def.l}」です。写真に明記されている値だけを読み取り、次のキーのJSONで返してください。読めない・写っていない項目は null にしてください。推測で埋めないでください。\n${fields}\nJSONのみを出力し、前置きやコードブロックは付けないでください。`;
 try{
  const r=await fetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,'apikey':SB_KEY},
   body:JSON.stringify({prompt,system:'あなたは電気設備の銘板を正確に読み取るアシスタントです。JSONのみで答えます。',max_tokens:600,images:[{media_type:'image/jpeg',data:it.photo.split(',')[1]}]})});
  const data=await r.json(); if(!r.ok) throw new Error(data.error||r.status);
  const text=typeof data==='string'?data:(data.text||data.result||(data.content||[]).map(x=>x.text||'').join('')||'');
  const obj=JSON.parse(text.replace(/```json|```/g,'').trim()); let n=0;
  targets.forEach(t=>{const v=obj[t.k]; if(v!=null&&v!==''){p.survey[t.k].v=String(v); p.survey[t.k].st='ai'; p.survey[t.k].src=key; n++}});
  touch(); render(); toast(n?`${n}項目を読み取りました。写真と照合して「確認済みにする」を押してください`:'読み取れる値がありませんでした。手入力してください');
 }catch(e){ btn.disabled=false; btn.textContent='AIで読み取る'; toast('読み取りに失敗しました：'+(e.message||e)) }
}

render();
</script>
