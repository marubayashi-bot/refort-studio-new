<style>
/* ============================================================
   経営計画書ポータル v2.0 — 社長AI × NAVY COMPASS
   背景：未来への方向を示す、アースコムの経営コンパス
   ============================================================ */
:root{
  --navy:#13233F; --navy-2:#1B3157; --blue:#2479BE; --green:#2E9F88; --gold:#C5A35A;
  --bg:#F4F7FA; --bg-2:#EAF3F8;
  --ink:#13233F; --ink-2:#3A4A66; --ink-3:#6B7A93;
  --paper:var(--bg); --card:#FFFFFF;
  --rule:#D5DDE7; --rule-2:#E6ECF2;
  --shu:#C0392B; --shu-bg:#FBEDEB;
  --midori:#2E9F88; --midori-bg:#E6F4F1;
  --brass:#A8883E;
  --disp:"Noto Sans JP",system-ui,sans-serif;
  --serif:"Shippori Mincho B1",serif;
  --body:"Noto Sans JP",system-ui,sans-serif;
  --mono:"Roboto Mono",ui-monospace,monospace;
  --rail:252px; --hd:64px;
  --shadow:0 1px 2px rgba(19,35,63,.05),0 4px 14px rgba(19,35,63,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--body);
  font-size:15px;line-height:1.85;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
a{color:var(--ink);text-underline-offset:3px}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
h1,h2,h3,h4{font-family:var(--disp);font-weight:700;letter-spacing:.02em;line-height:1.5;margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- 背景アート（透明度3〜6%／可読性優先） ---------- */
#bgart{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bgart svg{position:absolute;display:block}
#bgart .compass{top:-180px;right:-170px;width:620px;height:620px;opacity:.06}
#bgart .ray{top:0;left:0;width:100%;height:100%;opacity:.05}
#bgart .panels{left:0;bottom:0;width:100%;height:210px;opacity:.045}
#bgart .ridge{right:0;bottom:0;width:62%;max-width:900px;height:240px;opacity:.05}
#app{position:relative;z-index:1}

/* ---------- 機密保護 ---------- */
#viewer{
  position:fixed;left:14px;bottom:10px;z-index:40;pointer-events:none;
  font-size:10.5px;color:var(--ink-3);letter-spacing:.06em;opacity:.75;
}
.protect{user-select:none;-webkit-user-select:none}
@media print{
  body::after{
    content:"この文書は印刷できません。経営計画書ポータルでご覧ください。";
    position:fixed;inset:0;background:#fff;color:#000;font-size:20px;
    display:flex;align-items:center;justify-content:center;z-index:99999;
  }
  #app,#bgart,#fab,#chat{display:none!important}
}

/* ---------- ログインゲート ---------- */
#gate{
  position:fixed;inset:0;z-index:9500;color:#fff;
  background:linear-gradient(135deg,#13233F 0%,#173463 60%,#2479BE 130%);
  display:flex;align-items:center;justify-content:center;text-align:center;padding:32px;
}
#gate .box{max-width:400px}
#gate .icon{width:84px;height:84px;border-radius:20px;margin:0 auto 20px;display:block;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#gate h1{font-size:24px;color:#fff;margin-bottom:6px}
#gate .tag{font-family:var(--serif);letter-spacing:.14em;color:#E7D6A8;font-size:13px;margin-bottom:14px}
#gate p{color:#B9C6DB;font-size:13.5px;line-height:1.9}

/* ---------- ヘッダー ---------- */
header{
  position:sticky;top:0;z-index:60;background:var(--navy);color:#fff;
  padding:0 20px;display:flex;align-items:center;gap:18px;height:var(--hd);
  box-shadow:0 2px 12px rgba(19,35,63,.25);
}
.brand{display:flex;align-items:center;gap:9px;flex-shrink:0;padding-right:18px;border-right:1px solid #2C416A}
.brand img{width:34px;height:34px;display:block}
.brand .ec{font-family:"Noto Sans JP",sans-serif;font-weight:700;font-style:italic;font-size:21px;letter-spacing:.01em;color:#fff}
.appname{display:flex;align-items:center;gap:10px;flex-shrink:0}
.appname img{width:28px;height:28px;border-radius:7px;display:block}
.appname b{font-size:19px;font-weight:700;letter-spacing:.08em}
.appname .termlbl,.appname .rev{font-size:12.5px;color:#C4CFE0;letter-spacing:.04em}
.appname .rev{font-family:var(--mono)}
#searchbox{
  flex:1;max-width:560px;display:flex;align-items:center;gap:9px;margin-left:8px;
  background:#1D3259;border:1px solid #33497A;border-radius:8px;padding:0 13px;height:38px;
}
#searchbox svg{flex-shrink:0;opacity:.7}
#searchbox input{flex:1;background:none;border:0;outline:0;color:#fff;font-family:inherit;font-size:13.5px}
#searchbox input::placeholder{color:#8797B3}
.hbtn{
  background:none;border:1px solid #3B5282;color:#E3E9F3;height:38px;padding:0 16px;
  border-radius:8px;font-size:13px;white-space:nowrap;font-weight:500;
  display:inline-flex;align-items:center;justify-content:center;
}
.hbtn:hover{background:#1D3259}
.hbtn.alert{border-color:#E08A7F;color:#FFD3CC;background:#3A1F2A}
#me{display:flex;align-items:center;gap:10px;flex-shrink:0;margin-left:auto}
#me .av{width:36px;height:36px;border-radius:50%;background:#2B4574;border:1.5px solid #5470A0;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
#me .nm{line-height:1.3;font-size:13px}
#me .nm small{display:block;color:#9FB0CC;font-size:11px}
#burger{display:none;width:38px;padding:0}

/* ---------- レイアウト ---------- */
#app{display:none}
.wrap{display:grid;grid-template-columns:var(--rail) 1fr;min-height:calc(100vh - var(--hd))}
#rail{
  background:rgba(255,255,255,.86);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border-right:1px solid var(--rule-2);
  padding:14px 10px 70px;position:sticky;top:var(--hd);height:calc(100vh - var(--hd));overflow-y:auto;
}
.railhead{font-size:10.5px;letter-spacing:.2em;color:var(--ink-3);padding:14px 12px 6px;font-weight:700}
.tab,.navlink{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;
  border-radius:8px;padding:9px 12px;font-size:13.5px;color:var(--ink-2);line-height:1.45;
  position:relative;
}
.tab svg,.navlink svg{flex-shrink:0;color:var(--ink-3)}
.tab:hover,.navlink:hover{background:#EEF3F8}
.tab.on,.navlink.on{background:#E3EEF8;color:var(--navy);font-weight:700}
.tab.on svg,.navlink.on svg{color:var(--blue)}
.tab.on::before,.navlink.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--blue)}
.tab span,.navlink span.l{flex:1;white-space:pre-wrap}
.railsep{height:1px;background:var(--rule-2);margin:10px 8px}
.navlink .n{font-family:var(--mono);font-size:11px;background:var(--shu);color:#fff;border-radius:9px;padding:1px 7px;font-weight:700}
#syncbox{padding:6px 12px 0}

main{padding:26px 30px 120px;max-width:1220px;width:100%}

/* ---------- 共通パーツ ---------- */
.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--ink-3);font-weight:700;margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--rule-2);border-radius:12px;padding:20px 22px;box-shadow:var(--shadow)}
.card + .card{margin-top:14px}
.pagetag{font-family:var(--mono);font-size:11.5px;color:var(--brass);border:1px solid #E3D5AE;
  background:#FBF7EC;padding:1px 8px;border-radius:4px;white-space:nowrap}
.btn{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:13.5px;font-weight:500;
  display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{background:var(--navy-2)}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--rule)}
.btn.ghost:hover{background:#F0F5FA}
.btn.gold{background:linear-gradient(180deg,#D4B56E,#C5A35A);color:#1B2336;font-weight:700;box-shadow:0 3px 10px rgba(197,163,90,.35)}
.btn.gold:hover{background:linear-gradient(180deg,#DCBF7C,#CBAA62)}
.btn.line{background:rgba(19,35,63,.55);color:#fff;border:1px solid rgba(255,255,255,.75)}
.btn.line:hover{background:rgba(19,35,63,.8)}
.btn.shu{background:var(--shu)} .btn.shu:hover{background:#A82F23}
.btn.blue{background:var(--blue)} .btn.blue:hover{background:#1E68A6}
.btn:disabled{opacity:.45;cursor:default}
.muted{color:var(--ink-3);font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sechead{display:flex;align-items:center;gap:12px;margin:30px 0 12px}
.sechead h3{font-size:16px;padding-left:12px;border-left:3px solid var(--navy);line-height:1.3}
.sechead .line{flex:1;height:1px;background:var(--rule)}
.sechead .tagline{font-size:11.5px;color:var(--ink-3);letter-spacing:.14em;font-family:var(--serif)}

/* ---------- AI TODAY ---------- */
.aitoday{
  position:relative;border-radius:16px;overflow:hidden;color:#fff;
  background:linear-gradient(100deg,#13233F 0%,#162D55 42%,#1E5A98 78%,#2F86C8 100%);
  display:grid;grid-template-columns:minmax(0,1fr) 23%;min-height:310px;
  box-shadow:0 10px 28px rgba(19,35,63,.22);
}
.aitoday .deco{position:absolute;right:0;bottom:0;width:62%;height:62%;opacity:.14;pointer-events:none}
.at-main{position:relative;padding:24px 8px 24px 28px;z-index:1}
.at-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.at-head .ttl{display:flex;align-items:center;gap:12px}
.at-head .ttl::before{content:"";width:4px;height:30px;background:var(--gold);border-radius:2px}
.at-head h2{font-size:32px;letter-spacing:.03em;color:#fff;font-weight:700;line-height:1}
.at-head .sub{font-size:13px;color:#C8D5EA;padding-left:14px;border-left:1px solid rgba(255,255,255,.3)}
.at-cols{display:grid;grid-template-columns:1.15fr 1fr 1.15fr;border:1px solid rgba(255,255,255,.13);
  background:rgba(8,18,38,.25);border-radius:12px}
.at-col{padding:16px 18px;min-width:0}
.at-col + .at-col{border-left:1px solid rgba(255,255,255,.13)}
.at-col .lbl{display:flex;align-items:center;gap:8px;color:#E3C888;font-weight:700;font-size:13px;margin-bottom:8px}
.at-col .lbl svg{flex-shrink:0}
.at-col h3{font-size:19px;color:#fff;line-height:1.55;margin-bottom:6px}
.at-col p{margin:0;font-size:13px;color:#D6E0F0;line-height:1.85}
.at-col .shimmer{display:block;height:11px;border-radius:6px;background:rgba(255,255,255,.12);margin:7px 0}
.at-btns{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
.at-char{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-top:14px}
.at-char img.full{width:100%;max-width:230px;display:block;margin-top:auto;filter:drop-shadow(0 8px 16px rgba(0,0,0,.25))}
.at-char img.face{display:none}
.bubble{
  position:relative;background:#fff;color:var(--navy);font-size:12.5px;font-weight:500;line-height:1.6;
  padding:8px 12px;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.18);max-width:210px;text-align:center;
  transition:opacity .35s;
}
.at-char .bubble{margin:0 10px 6px}
.at-char .bubble::after{content:"";position:absolute;bottom:-6px;left:50%;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fff}
.nobu-brand{margin-left:auto;text-align:right;font-family:var(--serif);letter-spacing:.14em;
  font-size:11px;color:rgba(255,255,255,.78);line-height:1.6}
.nobu-brand b{display:block;font-size:12.5px;color:#fff}

/* ---------- 指標カード ---------- */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:16px}
.kpi{background:var(--card);border:1px solid var(--rule-2);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:flex-start}
.kpi .ic{width:42px;height:42px;border-radius:50%;background:var(--bg-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--navy)}
.kpi .body{flex:1;min-width:0}
.kpi .k{font-size:12.5px;color:var(--ink-2);font-weight:500}
.kpi .v{font-family:var(--mono);font-size:27px;font-weight:700;line-height:1.3}
.kpi .v small{font-family:var(--body);font-size:12px;color:var(--ink-3);font-weight:500;margin-left:3px}
.kpi .hint{font-size:10.5px;color:var(--ink-3);line-height:1.5}
.bar{height:6px;background:var(--rule-2);border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--green);border-radius:3px}
.bar.blue i{background:var(--blue)}
.kpi .bar{margin-top:8px}

/* 帯カード（用語集・お知らせ） */
.strip{display:flex;align-items:center;gap:16px;margin-top:14px;background:var(--card);border:1px solid var(--rule-2);
  border-radius:12px;padding:16px 20px;box-shadow:var(--shadow);border-left:4px solid var(--green)}
.strip .ic{color:var(--navy);flex-shrink:0}
.strip b{font-size:15.5px}
.strip.gold{border-left-color:var(--gold)}

/* 章カード */
.chap{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:1px solid var(--rule-2);
  border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);width:100%}
.chap:hover{border-color:#B9CBE0;transform:translateY(-1px);transition:.15s}
.chap .ic{width:44px;height:44px;border-radius:50%;background:var(--bg-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--navy)}
.chap .t{font-weight:700;font-size:15px;line-height:1.5}
.chap .p{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:12px;color:var(--ink-3)}
.chap .chev{color:var(--ink-3);flex-shrink:0}

/* 訂正アラート */
.alertbar{background:var(--shu-bg);border:1px solid #E9B7B0;border-left:4px solid var(--shu);border-radius:10px;
  padding:15px 18px;display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.alertbar .t{font-weight:700;font-size:15px;color:var(--shu)}

/* ---------- 本文 ---------- */
.crumb{font-size:11.5px;color:var(--ink-3);margin-bottom:6px}
.sectitle{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;
  border-bottom:2px solid var(--navy);padding-bottom:12px;margin-bottom:18px;flex-wrap:wrap}
.sectitle h2{font-size:22px;line-height:1.5}
.readpane{background:var(--card);border:1px solid var(--rule-2);border-radius:12px;padding:26px 30px;box-shadow:var(--shadow)}
.article{font-size:15px;line-height:2.05}
.article p{margin:0 0 1.1em}
.article li{margin:0 0 .5em 1.2em}
.article a{color:#1F5C9C}
.article img[data-kk-img]:not([src]){display:none}
.article img{max-width:100%;border:1px solid var(--rule);border-radius:6px;margin:8px 0}
.article .kk-table{border-collapse:collapse;width:100%;margin:12px 0;font-size:13px;display:block;overflow-x:auto}
.article .kk-table td{border:1px solid var(--rule);padding:7px 10px;vertical-align:top}
.article .kk-img-missing{color:var(--ink-3);font-size:12px}

.seclist{background:var(--card);border:1px solid var(--rule-2);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.secrow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;
  border-bottom:1px solid var(--rule-2);padding:13px 18px;text-align:left}
.secrow:last-child{border-bottom:0}
.secrow:hover{background:#F2F6FA}
.secrow .dot{width:8px;height:8px;border-radius:50%;background:var(--rule);flex-shrink:0}
.secrow.read .dot{background:var(--green)}
.secrow .tt{flex:1;font-size:14px;line-height:1.5}
.secrow.lv2 .tt{padding-left:18px;font-size:13.2px;color:var(--ink-2)}
.secrow.lv3 .tt{padding-left:36px;font-size:12.8px;color:var(--ink-3)}
.secrow .qz{font-size:10.5px;color:var(--green);border:1px solid #BFE3DA;border-radius:4px;padding:0 6px;white-space:nowrap}

/* 学習ブロック（理解度チェック・ケーススタディ） */
.learn{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.learn .card{margin:0}
.learn h4{font-size:15.5px;display:flex;align-items:center;gap:8px}
.nobu-line{display:flex;align-items:flex-start;gap:10px;margin:12px 0}
.nobu-line img{width:40px;height:40px;border-radius:50%;flex-shrink:0;border:1px solid var(--rule-2)}
.nobu-line .say{background:var(--bg-2);border:1px solid #D3E5F1;border-radius:4px 12px 12px 12px;padding:8px 12px;font-size:13px;line-height:1.75;color:var(--navy)}
.nobu-line .say .who{display:block;font-size:10.5px;color:var(--blue);font-weight:700;letter-spacing:.08em}
.qitem{border:1px solid var(--rule-2);border-radius:10px;padding:14px 16px;margin-top:12px;background:#FBFCFE}
.qitem .qn{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.qitem .qq{font-weight:700;font-size:14px;margin:2px 0 10px;line-height:1.7}
.choice{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--rule);border-radius:8px;
  padding:9px 12px;margin-bottom:7px;font-size:13.5px;line-height:1.6}
.choice:hover:not(:disabled){border-color:var(--blue);background:#F3F8FC}
.choice:disabled{cursor:default}
.choice.ok{border-color:var(--green);background:var(--midori-bg)}
.choice.ng{border-color:#D9B8B3;background:#FBF4F3}
.choice .mk{font-family:var(--mono);font-weight:700;margin-right:8px;color:var(--ink-3)}
.explain{font-size:13px;line-height:1.85;color:var(--ink-2);margin-top:6px}
.linkbtn{background:none;border:0;color:var(--blue);font-size:12.5px;padding:0;text-decoration:underline;text-underline-offset:3px}
textarea.in{width:100%;min-height:96px;border:1px solid var(--rule);border-radius:8px;padding:11px 13px;
  font-family:inherit;font-size:13.5px;line-height:1.8;resize:vertical;background:#FCFDFE}

/* メモ */
.memo{margin-top:18px}
.memo textarea{width:100%;min-height:96px;border:1px solid var(--rule);border-radius:8px;padding:11px 13px;
  font-family:inherit;font-size:13.5px;line-height:1.8;resize:vertical;background:#FCFDFE}

/* ---------- 空データ・エラー ---------- */
.empty{display:flex;align-items:center;gap:16px;background:var(--card);border:1px dashed #C9D6E4;border-radius:12px;padding:18px 20px}
.empty img{width:56px;height:56px;border-radius:50%;flex-shrink:0}
.empty b{display:block;font-size:14.5px;color:var(--navy)}
.empty span{font-size:12.5px;color:var(--ink-3);line-height:1.7}

/* ---------- 訂正票 ---------- */
.rel{border:1px solid var(--rule-2);border-radius:12px;background:var(--card);margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow)}
.rel .top{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--rule-2);flex-wrap:wrap}
.rel.required .top{background:var(--shu-bg)}
.rel.info .top{background:#EEF3F8}
.badge{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 9px;border-radius:4px;white-space:nowrap}
.badge.required{background:var(--shu);color:#fff}
.badge.info{background:#8895AB;color:#fff}
.rel .top .ttl{flex:1;font-weight:700;font-size:15.5px}
.rel .body{padding:16px 18px}
.diff{border:1px solid var(--rule-2);border-radius:8px;margin-bottom:12px;overflow:hidden}
.diff .h{display:flex;align-items:center;gap:10px;background:#F4F7FA;padding:8px 12px;border-bottom:1px solid var(--rule-2);font-size:12.5px;font-weight:700;flex-wrap:wrap}
.diff .old,.diff .new{padding:10px 13px;font-size:13px;line-height:1.85;white-space:pre-wrap}
.diff .old{background:#FBF1F0;color:#8C4A42;text-decoration:line-through;text-decoration-color:#D8A69F}
.diff .new{background:#EFF8F5}
.diff .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;display:block;margin-bottom:3px;opacity:.7}
.ackbar{display:flex;align-items:center;gap:14px;padding:14px 18px;background:#F7F9FB;border-top:1px solid var(--rule-2);flex-wrap:wrap}
.stamp{width:66px;height:66px;border:2.5px solid var(--green);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--green);font-family:var(--serif);font-weight:700;font-size:14px;line-height:1.25;letter-spacing:.06em;flex-shrink:0;transform:rotate(-6deg)}
.stamp .d{font-family:var(--mono);font-size:8.5px;letter-spacing:0;font-weight:400}
@keyframes press{0%{transform:scale(2.1) rotate(-14deg);opacity:0}55%{transform:scale(.93) rotate(-4deg);opacity:1}100%{transform:scale(1) rotate(-6deg);opacity:1}}
.stamp.pressed{animation:press .42s cubic-bezier(.2,.8,.3,1) forwards}

/* ---------- 検索 ---------- */
.hit{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--rule-2);border-radius:10px;padding:14px 16px;margin-bottom:9px;box-shadow:var(--shadow)}
.hit:hover{border-color:#B9CBE0}
.hit .p{font-size:11.5px;color:var(--ink-3);margin-bottom:3px}
.hit .t{font-weight:700;font-size:15px;margin-bottom:5px}
.hit .s{font-size:12.5px;color:var(--ink-2);line-height:1.75}
.hit mark{background:#F6E6B8;color:inherit;padding:0 1px}

/* ---------- 管理 ---------- */
table.adm{width:100%;border-collapse:collapse;font-size:13px;background:var(--card)}
table.adm th{background:#F4F7FA;text-align:left;font-weight:700;font-size:11.5px;letter-spacing:.08em;color:var(--ink-2);padding:9px 11px;border-bottom:1px solid var(--rule)}
table.adm td{padding:9px 11px;border-bottom:1px solid var(--rule-2);vertical-align:top}
table.adm input[type=text]{border:1px solid var(--rule);border-radius:4px;padding:4px 7px;font-family:var(--mono);font-size:12px;width:78px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--ink-2);margin-bottom:5px}
.field input[type=text],.field input[type=date],.field select,.field textarea{width:100%;border:1px solid var(--rule);border-radius:8px;padding:8px 11px;font-family:inherit;font-size:13.5px;background:#fff}
.chkrow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--rule-2)}
.scrollx{overflow-x:auto}

/* ---------- 用語集 ---------- */
.kanabar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.kana{width:40px;height:40px;border:1px solid var(--rule);background:var(--card);border-radius:8px;font-size:16px;font-weight:700;color:var(--ink-2)}
.kana:hover{background:#EEF3F8}
.kana.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.term{background:var(--card);border:1px solid var(--rule-2);border-radius:10px;margin-bottom:7px}
.term-h{display:flex;align-items:baseline;gap:14px;width:100%;background:none;border:0;padding:13px 16px;text-align:left}
.term-h:hover{background:#F4F7FA}
.term-n{font-weight:700;font-size:15px;flex-shrink:0;min-width:170px}
.term-s{font-size:12.5px;color:var(--ink-3);line-height:1.6;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.termlink{background:none;border:0;padding:0;font:inherit;color:inherit;border-bottom:1.5px dotted var(--gold);cursor:pointer}
.termlink:hover{background:#FBF7EC}
#termsheet{position:fixed;left:0;right:0;bottom:0;z-index:8000;background:var(--card);border-top:3px solid var(--navy);
  box-shadow:0 -8px 34px rgba(19,35,63,.2);transform:translateY(102%);transition:transform .24s cubic-bezier(.2,.8,.3,1);max-height:62vh;overflow-y:auto}
#termsheet.on{transform:translateY(0)}
.ts-inner{max-width:820px;margin:0 auto;padding:20px 26px 30px}
.ts-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;border-bottom:1px solid var(--rule-2);padding-bottom:12px;margin-bottom:14px}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(70px);background:var(--navy);color:#fff;padding:11px 22px;
  border-radius:8px;font-size:13.5px;z-index:9800;opacity:0;transition:.28s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- 経営コンパスAI：常設ボタン ---------- */
#fab{position:fixed;right:22px;bottom:22px;z-index:7000;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
#fab .pill{background:var(--navy);color:#fff;font-size:13px;font-weight:700;padding:9px 16px;border-radius:22px;
  box-shadow:0 6px 18px rgba(19,35,63,.28);border:1px solid rgba(197,163,90,.6);white-space:nowrap}
#fab .orb{position:relative;width:84px;height:84px;border-radius:50%;overflow:hidden;flex-shrink:0;
  background:radial-gradient(circle at 50% 35%,#2F6FB0 0%,#173463 62%,#13233F 100%);
  border:3px solid var(--gold);box-shadow:0 8px 22px rgba(19,35,63,.35),0 0 0 4px rgba(197,163,90,.18)}
#fab .orb svg{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);opacity:.55}
#fab .orb img{position:absolute;left:10%;bottom:-6%;width:80%;display:block}
#fab:hover .orb{transform:translateY(-2px);transition:.2s}
@keyframes guide{0%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}70%{transform:translateY(0)}}
#fab.hello .orb{animation:guide 1.1s ease 2}
body.chat-open #fab{display:none}

/* ---------- 経営コンパスAI：チャットパネル ---------- */
#chat{position:fixed;top:0;right:0;bottom:0;width:430px;max-width:100vw;z-index:8500;background:var(--bg);
  box-shadow:-10px 0 34px rgba(19,35,63,.22);transform:translateX(104%);transition:transform .26s cubic-bezier(.2,.8,.3,1);
  display:flex;flex-direction:column}
#chat.on{transform:translateX(0)}
.ch-head{background:linear-gradient(100deg,#13233F,#1E5A98);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;
  padding-top:calc(14px + env(safe-area-inset-top,0px))}
.ch-head img{width:34px;height:34px;border-radius:8px}
.ch-head .t{flex:1;line-height:1.35}
.ch-head .t b{display:block;font-size:15.5px}
.ch-head .t small{font-family:var(--serif);letter-spacing:.12em;color:#D9C28C;font-size:10.5px}
.ch-head button{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;height:32px;padding:0 10px;font-size:12px}
.ch-ctx{background:#FFF9EC;border-bottom:1px solid #EFE2BE;padding:8px 14px;font-size:12px;color:#6E5A2A;display:flex;align-items:center;gap:8px}
.ch-ctx b{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-body{flex:1;overflow-y:auto;padding:16px 16px 8px}
.msg-me{display:flex;justify-content:flex-end;margin:12px 0}
.msg-me div{background:var(--navy);color:#fff;border-radius:14px 14px 4px 14px;padding:9px 13px;font-size:13.5px;line-height:1.75;max-width:85%;white-space:pre-wrap}
.ans{background:#fff;border:1px solid var(--rule-2);border-radius:12px;padding:14px 16px;font-size:13.5px;line-height:1.9;box-shadow:var(--shadow);margin:4px 0 12px}
.ans ul{margin:4px 0 8px;padding-left:1.2em}
.ans p{margin:0 0 .7em}
.ans .cite{display:inline-block;font-family:var(--mono);font-size:10.5px;background:var(--bg-2);color:var(--blue);border-radius:4px;padding:0 5px;margin:0 1px;vertical-align:1px}
.srcs{margin-top:10px;border-top:1px dashed var(--rule);padding-top:8px}
.srcs .h{font-size:11px;color:var(--ink-3);font-weight:700;letter-spacing:.1em}
.src{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:5px 0;font-size:12.5px;color:var(--blue)}
.src .n{font-family:var(--mono);font-size:10.5px;background:var(--bg-2);border-radius:4px;padding:0 5px;flex-shrink:0}
.ans.warn{border-color:#EBD9A8;background:#FFFBF0}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);opacity:.4;animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,100%{opacity:.25}50%{opacity:.9}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px 50px}
.chip{background:#fff;border:1px solid #CFE0EE;color:var(--navy);border-radius:16px;padding:5px 11px;font-size:12px}
.chip:hover{background:#F0F6FB}
.ch-foot{border-top:1px solid var(--rule-2);background:#fff;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.ch-foot .row{display:flex;gap:8px;align-items:flex-end}
.ch-foot textarea{flex:1;border:1px solid var(--rule);border-radius:10px;padding:9px 12px;font-family:inherit;font-size:14px;line-height:1.6;resize:none;max-height:140px;min-height:44px}
.ch-foot .note{font-size:10.5px;color:var(--ink-3);margin-top:6px;line-height:1.5}
#scrim{position:fixed;inset:0;background:rgba(19,35,63,.28);z-index:8400;opacity:0;pointer-events:none;transition:.2s}
body.chat-open #scrim{opacity:1;pointer-events:auto}

/* ---------- レスポンシブ ---------- */
@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .brand .ec{display:none}
  .brand{padding-right:12px}
}
/* タブレット：キャラクターを小さく、カード右下へ */
@media (max-width:1100px){
  .aitoday{grid-template-columns:1fr}
  .at-main{padding:22px 150px 22px 24px}
  .at-char{position:absolute;right:6px;bottom:0;width:140px;padding:0}
  .at-char img.full{max-width:130px}
  .at-char .bubble{font-size:11.5px;max-width:140px;padding:6px 9px}
  .nobu-brand{display:none}
  .at-head .sub{border-left:0;padding-left:0;flex-basis:100%}
}
@media (max-width:1024px){
  .at-cols{grid-template-columns:1fr}
  .at-col + .at-col{border-left:0;border-top:1px solid rgba(255,255,255,.13)}
}
@media (max-width:900px){
  .at-cols{grid-template-columns:1fr}
  .at-col + .at-col{border-left:0;border-top:1px solid rgba(255,255,255,.13)}
  .learn{grid-template-columns:1fr}
}
@media (max-width:860px){
  :root{--hd:58px}
  .wrap{grid-template-columns:1fr}
  #rail{position:fixed;top:var(--hd);left:0;width:286px;z-index:70;height:calc(100vh - var(--hd));background:#fff;
    transform:translateX(-102%);transition:transform .22s;box-shadow:0 0 30px rgba(0,0,0,.18)}
  #rail.open{transform:translateX(0)}
  #burger{display:inline-flex;align-items:center;justify-content:center}
  main{padding:16px 14px 120px}
  header{gap:10px;padding:0 12px}
  .brand{border-right:0;padding-right:0}
  .appname .termlbl,.appname .rev,.appname img{display:none}
  .appname b{font-size:16px}
  #me .nm{display:none}
  #searchbox{margin-left:0}
  .hbtn{padding:0 10px}
  #btn-admin{display:none!important}
  .grid2{grid-template-columns:1fr}
  .readpane{padding:18px 16px}
}
/* スマートフォン：顔アイコンへ切り替え、文章の下に配置 */
@media (max-width:640px){
  #searchbox{display:none}
  .at-main{padding:20px 18px 12px}
  .at-head h2{font-size:26px}
  .at-head .sub{border-left:0;padding-left:0;font-size:12px;flex-basis:100%}
  .at-char{position:static;width:auto;flex-direction:row;justify-content:flex-start;gap:10px;padding:0 18px 18px}
  .at-char img.full{display:none}
  .at-char img.face{order:-1;display:block;width:48px;height:48px;border-radius:50%;border:2px solid rgba(255,255,255,.7);flex-shrink:0}
  .at-char .bubble{margin:0;text-align:left;max-width:none;font-size:12.5px}
  .at-char .bubble::after{left:-6px;top:50%;bottom:auto;margin:-6px 0 0;border:6px solid transparent;border-left:0;border-right-color:#fff}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:13px 14px;gap:10px}
  .kpi .ic{width:34px;height:34px}
  .kpi .v{font-size:22px}
  .strip{flex-wrap:wrap}
  #fab{right:14px;bottom:14px}
  #fab .pill{display:none}
  #fab .orb{width:66px;height:66px}
  #chat{width:100vw}
  .term-h{flex-direction:column;gap:4px}
  .term-n{min-width:0}
  .term-s{white-space:normal}
  .sechead .tagline{display:none}
  #viewer{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

/* ============================================================
   Supabase 最小クライアント
   ============================================================ */
async function sb(path, opt = {}) {
  const h = {
    apikey: CFG.SUPABASE_KEY,
    Authorization: 'Bearer ' + (window.EC?.token?.() || CFG.SUPABASE_KEY),
    'Content-Type': 'application/json',
    ...(opt.headers || {})
  };
  const res = await fetch(CFG.SUPABASE_URL + '/rest/v1/' + path, { ...opt, headers: h });
  if (!res.ok) throw new Error(await res.text());
  const t = await res.text();
  return t ? JSON.parse(t) : [];
}
const sbGet    = (t, q)        => sb(t + '?' + q);
const sbPost   = (t, rows)     => sb(t, { method:'POST', body:JSON.stringify(rows), headers:{Prefer:'return=representation'} });
const sbUpsert = (t, rows, k)  => sb(t + '?on_conflict=' + k, { method:'POST', body:JSON.stringify(rows), headers:{Prefer:'resolution=merge-duplicates,return=minimal'} });
const sbPatch  = (t, f, o)     => sb(t + '?' + f, { method:'PATCH', body:JSON.stringify(o), headers:{Prefer:'return=minimal'} });

async function signedImg(path) {
  try {
    const r = await fetch(`${CFG.SUPABASE_URL}/storage/v1/object/sign/${CFG.BUCKET}/${path}`, {
      method:'POST',
      headers:{ apikey:CFG.SUPABASE_KEY, Authorization:'Bearer '+(window.EC?.token?.()||CFG.SUPABASE_KEY), 'Content-Type':'application/json' },
      body: JSON.stringify({ expiresIn: 3600 })
    });
    if (!r.ok) return null;
    const j = await r.json();
    return CFG.SUPABASE_URL + '/storage/v1' + j.signedURL;
  } catch { return null; }
}

/** 原本の該当見出しを直接開くURL（見出しIDをそのままアンカーに使う） */
function docLink(sec) {
  const base = CFG.DOC_URLS[sec.source || 'keikaku'];
  if (!base) return null;
  const tab = sec.tab_id && /^t\./.test(sec.tab_id) ? `?tab=${encodeURIComponent(sec.tab_id)}` : '';
  const anc = /^h\./.test(sec.id || '') ? `#heading=${sec.id}` : '';
  return base + tab + anc;
}

/** ec-auth.js は Google のログイン基盤を非同期で立ち上げるため、EC が生えるまで待つ */
function waitForEC(ms = 8000) {
  return new Promise(resolve => {
    if (window.EC) return resolve(window.EC);
    const t0 = Date.now();
    const iv = setInterval(() => {
      if (window.EC)             { clearInterval(iv); resolve(window.EC); }
      else if (Date.now()-t0>ms) { clearInterval(iv); resolve(null); }
    }, 120);
  });
}

async function boot() {
  drawWatermarkPlaceholder();

  const EC = await waitForEC();
  if (!EC) {
    $('#gatemsg').textContent =
      '認証スクリプト（ec-auth.js）を読み込めませんでした。時間をおいて再読み込みしてください。';
    $('#gatebtn').textContent = '再読み込み';
    $('#gatebtn').onclick = () => location.reload();
    return;
  }

  // ec-auth.js が自前のログイン画面を出すので、こちらの画面は必ず先に消す。
  // （重ねたままだと ec-auth のログインボタンが押せなくなる）
  $('#gate').style.display = 'none';

  let me = null;
  try {
    me = await EC.guard({
      app: CFG.APP_ID,
      allow: ['admin', 'manager', 'sales', 'field', 'viewer']
    });
  } catch (e) {
    me = null;
  }
  if (!me) return;   // ec-auth 側がログイン画面／権限なし画面を表示している

  S.me = me;
  S.editor = CFG.EDITORS.includes((me.email || '').toLowerCase())
          || CFG.EDITOR_ROLES.includes(me.role);

  $('#app').style.display  = 'block';
  const nm = me.full_name || me.email;
  $('#me').innerHTML = `<div class="av">${esc((me.full_name || me.email || '?').trim().slice(0,1))}</div>
    <div class="nm">${esc(nm)}<small>${esc(me.dept || me.role || '')}</small></div>`;
  if (S.editor) $('#btn-admin').style.display = 'inline-flex';
  drawWatermark();

  await loadAll();
  await loadLearning();
  bindUI();
  bindChat();
  route();
}

async function loadAll() {
  const [tabs, secs, reads, notes, rels, acks, sync, updates, seen] = await Promise.all([
    sbGet('kk_tabs',     'select=*&order=sort_order'),
    sbGet('kk_sections', 'select=id,source,tab_id,parent_id,level,title,path,sort_order,body_html,body_text,page_no,updated_at&deleted_at=is.null&order=tab_id,sort_order'),
    sbGet('kk_reads',    `select=section_id&user_email=eq.${encodeURIComponent(S.me.email)}`),
    sbGet('kk_notes',    `select=section_id,body&user_email=eq.${encodeURIComponent(S.me.email)}`),
    sbGet('kk_releases', `select=*&term=eq.${CFG.TERM}&order=published_at.desc`),
    sbGet('kk_release_acks', `select=release_id&user_email=eq.${encodeURIComponent(S.me.email)}`),
    sbGet('kk_sync_log', 'select=*&order=started_at.desc&limit=1'),
    sbGet('kk_app_updates', 'select=*&order=released_at.desc,id.desc&limit=30').catch(()=>[]),
    sbGet('kk_manual_seen', `select=version&user_email=eq.${encodeURIComponent(S.me.email)}`).catch(()=>[])
  ]);
  S.updates  = updates || [];
  S.seenVer  = seen?.[0]?.version || null;
  const src = r => r.source || 'keikaku';
  S.tabs     = tabs.filter(t => src(t) === 'keikaku');
  S.sections = secs.filter(x => src(x) === 'keikaku');

  // 用語集：レベル3の見出しが1語。親（あ・い・う…）でまとめる。
  const yogo = secs.filter(x => src(x) === 'yougo');
  const kana = Object.fromEntries(yogo.filter(x => x.level === 1).map(x => [x.id, x.title.trim()]));
  S.terms = yogo.filter(x => x.level >= 3 || (x.level === 2 && x.body_text))
    .map(x => ({
      id: x.id,
      name: x.title.replace(/[【】\[\]]/g, '').trim(),
      raw:  x.title.trim(),
      kana: kana[x.parent_id] || 'その他',
      tabId: x.tab_id,
      html: x.body_html || '',
      text: x.body_text || ''
    }))
    .filter(t => t.name);
  S.termByName = {};
  S.terms.forEach(t => { if (!S.termByName[t.name]) S.termByName[t.name] = t; });
  buildTermMatcher();

  S.byId = Object.fromEntries(secs.map(s => [s.id, s]));
  S.reads = new Set(reads.map(r => r.section_id));
  S.notes = Object.fromEntries(notes.map(n => [n.section_id, n.body]));
  S.releases = rels;
  S.myAcks = new Set(acks.map(a => a.release_id));

  const maxRev = rels.reduce((m, r) => Math.max(m, r.rev), 0);
  $('#revchip').textContent = `Rev.${maxRev}`;
  $('#termlbl').textContent = `第${CFG.TERM}期`;

  const s = sync[0];
  $('#syncinfo').innerHTML = s
    ? `最終同期<br><b class="mono">${fmt(s.finished_at || s.started_at)}</b>　${s.status === 'ok' ? '最新' : esc(s.status || '')}`
    : '未同期';

  renderRail();
  updateCorrBadge();
  updateManualBadge();
}

function todaysPolicy() {
  const pool = S.sections.filter(s => s.level <= 2 && (s.body_text || '').length > 60);
  if (!pool.length) return null;
  const d = new Date();
  const seed = d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
  return pool[seed % pool.length];
}

      <div style="margin-top:9px;display:flex;gap:10px;align-items:center">

  wire(v);
  hydrateImages(v);
  linkTerms($('#art'));
  $('#secai').onclick = () => openChat({ sec:s });
  $('#quizgo').onclick = () => startQuiz(s, $('#quizbox'));
  $('#casego').onclick = () => startCase(s, $('#casebox'));

  $('#savememo').onclick = async () => {
    const body = $('#memo').value.trim();
    try {
      await sbUpsert('kk_notes', [{ user_email:S.me.email, section_id:s.id, body, updated_at:new Date().toISOString() }], 'user_email,section_id');
      S.notes[s.id] = body;
      $('#memostat').textContent = '保存しました';
    } catch { $('#memostat').textContent = '保存できませんでした。通信を確認してください。'; }
  };

  markRead(s.id);
  log('view', s.id);
}

async function hydrateImages(scope) {
  for (const img of scope.querySelectorAll('img[data-kk-img]')) {
    const u = await signedImg(img.dataset.kkImg);
    if (u) {
      img.src = u;
      img.onerror = () => img.replaceWith(Object.assign(
        document.createElement('span'), {className:'kk-img-missing', textContent:'［図］'}));
    } else {
      img.replaceWith(Object.assign(
        document.createElement('span'), {className:'kk-img-missing', textContent:'［図：表示できません］'}));
    }
  }
}

async function markRead(id) {
  if (S.reads.has(id)) return;
  S.reads.add(id);
  try { await sbUpsert('kk_reads', [{ user_email:S.me.email, section_id:id, read_at:new Date().toISOString() }], 'user_email,section_id'); } catch {}
}
async function log(action, sectionId, detail) {
  try { await sbPost('kk_access_log', [{ user_email:S.me.email, user_name:S.me.full_name||'', section_id:sectionId||null, action, detail:detail||null }]); } catch {}
}

async function viewCorrections(v) {
  v.innerHTML = '<p class="muted">読み込み中…</p>';
  const ids = S.releases.map(r => r.id);
  const changes = ids.length
    ? await sbGet('kk_changes', `select=*&release_id=in.(${ids.join(',')})&order=id`)
    : [];
  const byRel = {};
  changes.forEach(c => (byRel[c.release_id] ||= []).push(c));

  v.innerHTML = `
    <div class="eyebrow">訂正票</div>
    <div class="sectitle"><h2>お手元の経営計画書への反映</h2></div>
    <p class="muted" style="margin:-8px 0 20px">
      デジタル版が正です。<b style="color:var(--shu)">要修正</b>の訂正票は、紙の手帳を書き換えたうえで「反映しました」を押してください。
      表紙裏の訂正記録欄にRev.番号を記入すると、どこまで直したかが一目で分かります。
    </p>
    ${S.releases.length ? S.releases.map(r => relCard(r, byRel[r.id]||[])).join('')
      : emptyState('まだ訂正はありません', 'お手元の経営計画書は最新です。')}`;

  v.querySelectorAll('[data-ack]').forEach(b => b.onclick = () => ack(b.dataset.ack, b));
  wire(v);
}

function relCard(r, cs) {
  const done = S.myAcks.has(r.id);
  const req  = r.severity === 'required';
  return `
  <div class="rel ${req?'required':'info'}">
    <div class="top">
      <span class="badge ${req?'required':'info'}">${req?'要修正':'参　考'}</span>
      <span class="ttl">${esc(r.title)}</span>
      <span class="mono muted">${CFG.TERM}期 Rev.${r.rev}</span>
    </div>
    <div class="body">
      ${r.note ? `<p style="margin:0 0 14px">${esc(r.note)}</p>` : ''}
      ${cs.map(c => `
        <div class="diff">
          <div class="h">
            <span>${esc(c.section_title||'')}</span>
            ${c.page_no ? `<span class="pagetag">手帳 P.${esc(c.page_no)}</span>` : '<span class="muted" style="font-weight:400">ページ番号 未設定</span>'}
            <span style="flex:1"></span>
            <span class="muted mono" style="font-weight:400">${c.change_type==='added'?'追加':c.change_type==='removed'?'削除':'変更'}</span>
          </div>
          ${c.old_text ? `<div class="old"><span class="lbl">BEFORE</span>${esc(c.old_text)}</div>`:''}
          ${c.new_text ? `<div class="new"><span class="lbl">AFTER</span>${esc(c.new_text)}</div>`:''}
        </div>`).join('')}
    </div>
    <div class="ackbar">
      ${done
        ? `<div class="stamp"><span>反映済</span><span class="d">${fmtD(r.published_at)}</span></div>
           <div class="muted">紙への反映を報告済みです。</div>`
        : req
          ? `<button class="btn shu" data-ack="${r.id}">紙を修正しました</button>
             <div class="muted">${r.due_date?`期限 ${fmtD(r.due_date)}`:'期限の指定なし'}</div>`
          : `<div class="muted">参考情報です。紙の修正は不要です。</div>`}
      <span style="flex:1"></span>
      <span class="muted mono" style="font-size:11px">発行 ${fmtD(r.published_at)}</span>
    </div>
  </div>`;
}

async function ack(relId, btn) {
  btn.disabled = true;
  try {
    await sbPost('kk_release_acks', [{
      release_id:+relId, user_email:S.me.email,
      user_name:S.me.full_name||'', dept:S.me.dept||null
    }]);
  } catch (e) { /* 既に押されている場合も成功扱い */ }
  S.myAcks.add(+relId);
  const bar = btn.closest('.ackbar');
  bar.innerHTML = `<div class="stamp pressed"><span>反映済</span><span class="d">${fmtD(new Date())}</span></div>
                   <div class="muted">紙への反映を報告しました。訂正記録欄にRev.の記入もお願いします。</div>`;
  updateCorrBadge();
  toast('反映を報告しました');
}

    },
    {
      t:'探したい言葉から引く',
      b:`<p>上部の検索窓に言葉を入れるだけです。見出しだけでなく<b>本文も全部</b>探します。
         「経費」「懇親会」「サンキーパー」のように、思いついた単語を入れてください。</p>
         <p>結果には手帳のページ番号も出るので、紙で確認したいときはそのページを開けます。</p>`

  });

  return list;
}

async function addUpdate() {
  const version = $('#uver').value.trim(), title = $('#utitle').value.trim();
  if (!version || !title) return toast('バージョンと見出しを入れてください');
  try {
    await sbPost('kk_app_updates', [{ version, title, body:$('#ubody').value.trim()||null, created_by:S.me.email }]);
    await loadAll(); go('manual'); toast('お知らせを追加しました');
  } catch (e) { toast('追加できませんでした'); }
}
async function delUpdate(id) {
  try { await sb(`kk_app_updates?id=eq.${id}`, { method:'DELETE' }); await loadAll(); go('manual'); }
  catch { toast('削除できませんでした'); }
}

/* ------------------------------------------------------------
   用語集
   経営計画書＝何を実行するか／用語集＝なぜそうするか。
   方針の本文に出てくる語は自動でリンクになり、その場で定義が開く。
   ------------------------------------------------------------ */
const KANA_ROWS = [
  ['あ','あいうえお'],['か','かきくけこ'],['さ','さしすせそ'],['た','たちつてと'],
  ['な','なにぬねの'],['は','ひふへほは'],['ま','まみむめも'],['や','やゆよ'],
  ['ら','らりるれろ'],['わ','わをん']
];
function kanaGroup(k) {
  const row = KANA_ROWS.find(r => r[1].includes(k));
  return row ? row[0] : 'その他';
}

/** 本文中で自動リンクする語の正規表現を作る（長い語を優先） */
function buildTermMatcher() {
  const names = S.terms.map(t => t.name)
    .filter(n => n.length >= 2 && n.length <= 20)
    .sort((a, b) => b.length - a.length)
    .map(n => n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  S.termRe = names.length ? new RegExp('(' + names.join('|') + ')', 'g') : null;
}

/** 記事内のテキストに用語リンクを差し込む。1語につき最初の1回だけ。 */
function linkTerms(root) {
  if (!S.termRe || !root) return;
  const used = new Set();
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => (n.parentElement.closest('a,button,.termlink,table')) 
      ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT
  });
  const targets = [];
  let n; while ((n = walker.nextNode())) targets.push(n);

  targets.forEach(node => {
    const txt = node.nodeValue;
    if (!txt || txt.length < 2) return;
    S.termRe.lastIndex = 0;
    if (!S.termRe.test(txt)) return;
    S.termRe.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let last = 0, m;
    while ((m = S.termRe.exec(txt))) {
      const word = m[1];
      if (used.has(word)) continue;
      used.add(word);
      frag.appendChild(document.createTextNode(txt.slice(last, m.index)));
      const b = document.createElement('button');
      b.className = 'termlink';
      b.textContent = word;
      b.dataset.term = word;
      frag.appendChild(b);
      last = m.index + word.length;
    }
    if (!last) return;
    frag.appendChild(document.createTextNode(txt.slice(last)));
    node.parentNode.replaceChild(frag, node);
  });

  root.querySelectorAll('.termlink').forEach(b => b.onclick = () => openTerm(b.dataset.term));
}

function openTerm(name) {
  const t = S.termByName[name];
  if (!t) return;
  const box = $('#termsheet');
  box.innerHTML = `
    <div class="ts-inner">

        <div>
          <div class="eyebrow" style="margin:0">用語集</div>

        </div>

      </div>

      <div style="margin-top:14px"><button class="btn ghost" id="tsall">用語集をすべて見る</button></div>
    </div>`;
  box.classList.add('on');
  $('#tsclose').onclick = closeTerm;
  $('#tsall').onclick = () => { closeTerm(); go('yougo', t.kana); };
  linkTerms(box.querySelector('.article'));
  hydrateImages(box);

function viewGlossary(v) {
  const groups = {};
  S.terms.forEach(t => { const g = kanaGroup(t.kana); (groups[g] ||= []).push(t); });
  const rows = KANA_ROWS.map(r => r[0]).filter(g => groups[g]?.length);
  if (groups['その他']) rows.push('その他');
  const sel = rows.includes(S.route.arg) ? S.route.arg
            : rows.includes(kanaGroup(S.route.arg || '')) ? kanaGroup(S.route.arg) : rows[0];

  v.innerHTML = `
    <div class="eyebrow">用語集</div>
    <div class="sectitle">
      <h2>アースコム用語集</h2>
      <span class="muted mono">${S.terms.length}語</span>
    </div>

      経営計画書が「何を実行するか」なら、用語集は「なぜそうするか」です。方針の本文に出てくる語は、そのままタップすると意味が開きます。
    </p>
    <div class="kanabar">
      ${rows.map(g => `<button class="kana ${g===sel?'on':''}" data-kana="${esc(g)}">${esc(g)}</button>`).join('')}
    </div>
    <div id="termlist">
      ${(groups[sel]||[]).map(t => `
        <div class="term">

            <span class="term-s">${esc((t.text||'').slice(0,64))}</span>

        </div>`).join('') || '<p class="muted">この行に語がありません。</p>'}

function viewSearch(v) {
  const q = (S.route.arg || '').trim();
  if (!q) { v.innerHTML = '<p class="muted">検索したい語を入力してください。</p>'; return; }
  const lq = q.toLowerCase();
  const hits = S.sections.filter(s =>
    (s.title + ' ' + (s.body_text||'')).toLowerCase().includes(lq));
  const thits = S.terms.filter(t => (t.name + ' ' + t.text).toLowerCase().includes(lq));
  v.innerHTML = `
    <div class="eyebrow">検索</div>
    <div class="sectitle"><h2>「${esc(q)}」の検索結果</h2>
      <span class="muted mono">方針 ${hits.length}件／用語 ${thits.length}件</span></div>
    ${thits.length ? `<div class="card" style="margin-bottom:14px">
      <div class="eyebrow">用語集</div>
      ${thits.slice(0,8).map(t => `<button class="term-h" data-open="${esc(t.name)}" style="border-bottom:1px solid var(--rule-2)">
        <span class="term-n">${esc(t.raw)}</span>
        <span class="term-s">${esc((t.text||'').slice(0,70))}</span></button>`).join('')}
    </div>` : ''}
    ${hits.map(s => {
      const t = s.body_text || '';
      const i = t.toLowerCase().indexOf(q.toLowerCase());
      const snip = i >= 0 ? t.slice(Math.max(0,i-40), i+120) : t.slice(0,130);
      return `<button class="hit" data-sec="${esc(s.id)}">
        <div class="p">${esc(s.path)}${s.page_no?`　手帳 P.${esc(s.page_no)}`:''}</div>
        <div class="t">${esc(s.title)}</div>
        <div class="s">…${esc(snip).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), m=>`<mark>${m}</mark>`)}…</div>
      </button>`;
    }).join('') || (thits.length ? '' : emptyState('該当がありませんでした', '言い換えて試すか、右下の経営コンパスAIに相談してみてください。'))}`;
  wire(v);
  v.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openTerm(b.dataset.open));
  log('search', null, q);
}

async function publishRelease() {
  const ids = $$('.chg:checked').map(c => +c.value);
  const title = $('#rtitle').value.trim();
  if (!ids.length) return toast('発行する変更を選んでください');
  if (!title)      return toast('訂正票の見出しを入力してください');
  const rev = S.releases.reduce((m,r)=>Math.max(m,r.rev),0) + 1;
  try {
    const [r] = await sbPost('kk_releases', [{
      term:CFG.TERM, rev, severity:$('#rsev').value, title,
      note:$('#rnote').value.trim()||null,
      due_date:$('#rdue').value||null,
      published_by:S.me.email
    }]);
    await sbPatch('kk_changes', `id=in.(${ids.join(',')})`, { release_id:r.id });
    toast(`Rev.${rev} を発行しました`);
    await loadAll();
    go('admin');
  } catch (e) { toast('発行できませんでした：' + String(e).slice(0,60)); }
}

async function savePages() {
  const rows = $$('.pg').map(i => ({ id:i.dataset.id, page_no:i.value.trim()||null }));
  try {
    for (const r of rows) {
      const cur = S.byId[r.id];
      if (cur && (cur.page_no||'') !== (r.page_no||'')) {
        await sbPatch('kk_sections', `id=eq.${encodeURIComponent(r.id)}`, { page_no:r.page_no });
        cur.page_no = r.page_no;
      }
    }
    toast('ページ番号を保存しました');
  } catch { toast('保存できませんでした'); }
}

/* ------------------------------------------------------------
   同期実行
   ------------------------------------------------------------ */
async function runSync() {
  if (!CFG.SYNC_ENDPOINT) return toast('同期URLが未設定です（管理者に連絡してください）');
  const btn = $('#btn-sync');
  btn.disabled = true;

  // クリック前の最新ログIDを控え、これより新しい実行の完了を待つ
  let baseId = 0;
  try { baseId = (await sbGet('kk_sync_log', 'select=id&order=id.desc&limit=1'))[0]?.id || 0; } catch {}

  try {
    fetch(`${CFG.SYNC_ENDPOINT}?token=${encodeURIComponent(CFG.SYNC_TOKEN)}`, { mode:'no-cors' });
  } catch { btn.disabled = false; return toast('同期を開始できませんでした'); }

  const t0 = Date.now();
  const LIMIT = 12 * 60 * 1000;   // 取り込みは数分かかる。余裕をみて12分待つ。
  let started = false;

  const tick = async () => {
    const sec = Math.round((Date.now() - t0) / 1000);
    const mm = String(Math.floor(sec/60)), ss = String(sec%60).padStart(2,'0');
    $('#syncinfo').innerHTML = `同期しています…<br><b class="mono">${mm}:${ss} 経過</b>` +
      (started ? '<br><span class="muted">取り込み中</span>' : '');

    let row = null;
    try { row = (await sbGet('kk_sync_log', `select=*&id=gt.${baseId}&order=id.desc&limit=1`))[0]; } catch {}

    if (row) {
      started = true;
      if (row.finished_at) {
        btn.disabled = false;
        if (row.status === 'ok') {
          await loadAll();
          route();
          toast(`同期しました（追加${row.added||0}／変更${row.modified||0}／削除${row.removed||0}）`);
        } else {
          $('#syncinfo').innerHTML = '<b style="color:var(--shu)">同期に失敗しました</b>';
          toast('同期に失敗しました：' + String(row.message||'').slice(0,80));
        }
        return;
      }
    }
    if (Date.now() - t0 > LIMIT) {
      btn.disabled = false;
      $('#syncinfo').innerHTML = '同期の完了を確認できませんでした';
      toast(started ? '取り込みが長引いています。数分後に開き直してください' : '同期が始まりませんでした。設定を確認してください');
      return;
    }
    setTimeout(tick, 5000);
  };
  setTimeout(tick, 3000);
}

/* ============================================================
   イベント
   ============================================================ */
function wire(scope) {
  scope.querySelectorAll('[data-sec]').forEach(b => b.onclick = () => go('sec', b.dataset.sec));
  scope.querySelectorAll('[data-tab2]').forEach(b => b.onclick = () => go('tab', b.dataset.tab2));
  scope.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
}

function bindUI() {
  $('#tabs').onclick = e => { const b = e.target.closest('.tab'); if (b) go('tab', b.dataset.tab); };
  $$('#rail [data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  $('#btn-corr').onclick  = () => go('corr');
  $('#btn-admin').onclick = () => go('admin');
  $('#btn-sync').onclick  = runSync;
  $('#burger').onclick    = () => $('#rail').classList.toggle('open');

  let t;
  $('#q').addEventListener('input', e => {
    clearTimeout(t);
    const val = e.target.value;
    t = setTimeout(() => { if (val.trim()) go('search', val); }, 260);
  });

  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeTerm(); closeChat(); } });
  $('#termsheet').addEventListener('click', e => { if (e.target.id === 'termsheet') closeTerm(); });
  document.addEventListener('contextmenu', e => { if (e.target.closest('.article')) e.preventDefault(); });
  document.addEventListener('copy', e => {
    if (e.target.closest?.('.article') || window.getSelection().anchorNode?.parentElement?.closest?.('.article')) {
      e.preventDefault(); toast('この文書はコピーできません'); log('copy_attempt');
    }
  });
  window.addEventListener('beforeprint', () => log('print_attempt'));
}

/* ============================================================
   学習記録（理解度チェック・ケーススタディ）
   Supabase の kk_learning に保存。テーブル未作成でもブラウザ内に保存して動く。
   ============================================================ */
const LKEY = () => 'kk_learning_v1_' + (S.me?.email || 'anon');
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

async function loadLearning() {
  const local = lsGet(LKEY(), {});
  let remote = [];
  try {
    remote = await sbGet('kk_learning', `select=section_id,kind,score,total,detail,updated_at&user_email=eq.${encodeURIComponent(S.me.email)}`);
    S.learnRemote = true;
  } catch { S.learnRemote = false; }
  const m = { ...local };
  remote.forEach(r => { m[r.kind + ':' + r.section_id] = { kind:r.kind, section_id:r.section_id, score:r.score, total:r.total, detail:r.detail, at:r.updated_at }; });
  S.learning = m;
}
async function saveLearning(kind, sectionId, score, total, detail) {
  const key = kind + ':' + sectionId;
  const prev = S.learning[key];
  // 理解度は「最高点」を残す（何度でも安心して解き直せるように）
  if (kind === 'quiz' && prev && prev.total && prev.score / prev.total > score / total) { score = prev.score; total = prev.total; }
  const rec = { kind, section_id:sectionId, score, total, detail, at:new Date().toISOString() };
  S.learning[key] = rec;
  lsSet(LKEY(), S.learning);
  if (S.learnRemote !== false) {
    try {
      await sbUpsert('kk_learning', [{ user_email:S.me.email, user_name:S.me.full_name||'', section_id:sectionId, kind,
        score, total, detail, updated_at:rec.at }], 'user_email,section_id,kind');
    } catch {}
  }
  log(kind, sectionId, `${score}/${total}`);
}
function learnStats() {
  const recs = Object.values(S.learning || {});
  const q = recs.filter(r => r.kind === 'quiz');
  const sc = q.reduce((a, r) => a + (r.score || 0), 0), tt = q.reduce((a, r) => a + (r.total || 0), 0);
  const cases = recs.filter(r => r.kind === 'case').length;
  const memoN = Object.values(S.notes).filter(b => b && b.trim()).length;
  return {
    understand: tt ? Math.round(sc / tt * 100) : null,
    quizN: q.length,
    practice: S.reads.size ? Math.min(100, Math.round(memoN / S.reads.size * 100)) : 0,
    memoN, cases
  };
}

/* ============================================================
   経営コンパスAI（社長AI）
   AIの呼び出しは共通中継（Supabase Edge Function「ai」）経由。
   APIキーはEdge Function側にあり、このHTMLには書かない。
   ============================================================ */
async function aiCall({ system, messages, prompt, max_tokens = 1200 }) {
  const body = { system, max_tokens };
  if (messages) body.messages = messages; else body.prompt = prompt;
  const r = await fetch(CFG.AI_URL, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', apikey:CFG.SUPABASE_KEY,
      Authorization:'Bearer ' + (window.EC?.token?.() || CFG.SUPABASE_KEY) },
    body: JSON.stringify(body)
  });
  const t = await r.text();
  let j = {}; try { j = JSON.parse(t); } catch { j = { text:t }; }
  if (!r.ok) throw new Error((j.error && (j.error.message || JSON.stringify(j.error))) || ('HTTP ' + r.status));
  const txt = j.text ?? j.completion ?? j.result ??
    (Array.isArray(j.content) ? j.content.filter(x => x.type === 'text').map(x => x.text).join('') : '');
  return String(txt || '').trim();
}
function parseJSON(t) {
  const s = String(t).replace(/```json|```/g, '').trim();
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  return JSON.parse(a >= 0 ? s.slice(a, b + 1) : s);
}

/** 質問に近い方針・用語を集める（2文字の重なりで採点する簡易検索） */
function bigrams(s) {
  s = String(s || '').replace(/[\s、。・「」『』（）()？?！!,.:：\-ー]/g, '');
  const out = new Set();
  for (let i = 0; i < s.length - 1; i++) {
    const g = s.slice(i, i + 2);
    if (/^[ぁ-ん]{2}$/.test(g)) continue;   // ひらがなだけの組は助詞が多いので除く
    out.add(g);
  }
  return [...out];
}
function retrieve(query, { pin = null, k = 7 } = {}) {
  const grams = bigrams(query);
  const scored = S.sections.map(s => {
    const title = s.title || '', body = s.body_text || '';
    let sc = 0;
    for (const g of grams) {
      if (title.includes(g)) sc += 4;
      if (body.includes(g)) sc += 1 + Math.min(3, body.split(g).length - 2) * 0.3;
    }
    return { s, sc: sc / Math.sqrt(1 + body.length / 1500) };
  }).filter(x => x.sc > 0).sort((a, b) => b.sc - a.sc).slice(0, k).map(x => x.s);
  if (pin && !scored.includes(pin)) scored.unshift(pin);
  const terms = S.terms.map(t => {
    let sc = query.includes(t.name) ? 10 : 0;
    for (const g of grams) if (t.name.includes(g)) sc += 2;
    return { t, sc };
  }).filter(x => x.sc >= 4).sort((a, b) => b.sc - a.sc).slice(0, 4).map(x => x.t);
  return { secs: scored.slice(0, k), terms };
}
function buildContext({ secs, terms }) {
  const docs = [];
  secs.forEach(s => docs.push({ kind:'sec', id:s.id, title:s.title, path:s.path, page:s.page_no,
    text:(s.body_text || '').slice(0, 1600) }));
  terms.forEach(t => docs.push({ kind:'term', id:t.name, title:'用語：' + t.raw, path:'アースコム用語集', text:(t.text || '').slice(0, 700) }));
  const txt = docs.map((d, i) =>
    `<資料 番号="${i+1}" 出典="${d.path}${d.page ? '／手帳P.' + d.page : ''}">\n【${d.title}】\n${d.text}\n</資料>`).join('\n\n');
  return { docs, txt };
}

function mdLite(t) {
  const lines = esc(t).split('\n');
  let html = '', inList = false;
  for (let ln of lines) {
    ln = ln.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\[(\d{1,2})\]/g, '<span class="cite">$1</span>');
    const li = ln.match(/^\s*(?:・|-|\*|•)\s*(.+)$/);
    if (li) { if (!inList) { html += '<ul>'; inList = true; } html += `<li>${li[1]}</li>`; continue; }
    if (inList) { html += '</ul>'; inList = false; }
    if (ln.trim()) html += `<p>${ln.replace(/^#+\s*/, '')}</p>`;
  }
  if (inList) html += '</ul>';
  return html;
}

/* ---------- チャットパネル ---------- */
const CHAT = { hist:[], ctxSec:null, busy:false };

function chatSystem() { return NOBU_SYSTEM.replace('{{TERM}}', CFG.TERM); }

function openChat(opts = {}) {
  if (opts.sec !== undefined) CHAT.ctxSec = opts.sec;
  document.body.classList.add('chat-open');
  $('#chat').classList.add('on'); $('#chat').setAttribute('aria-hidden', 'false');
  renderCtx();
  if (!$('#ch-body').children.length) chatIntro();
  if (opts.ask) { $('#ch-in').value = opts.ask; sendChat(); }
  else setTimeout(() => $('#ch-in').focus(), 250);
  log('ai_open', CHAT.ctxSec?.id || null);
}
function closeChat() {
  document.body.classList.remove('chat-open');
  $('#chat').classList.remove('on'); $('#chat').setAttribute('aria-hidden', 'true');
}
function renderCtx() {
  const box = $('#ch-ctx'), s = CHAT.ctxSec;
  if (!s) { box.style.display = 'none'; return; }
  box.style.display = 'flex';
  box.innerHTML = `${IC(ICONS.doc,15)}<b>前提：${esc(s.title)}</b><button class="linkbtn" id="ctxoff">外す</button>`;
  $('#ctxoff').onclick = () => { CHAT.ctxSec = null; renderCtx(); };
}
function chatIntro() {
  const chips = CHAT.ctxSec
    ? ['この方針を自分の業務に落とすと？', 'この方針で迷いやすい場面は？', '新人に説明するならどう伝える？']
    : ['お客様対応で迷っています', '今日の方針を行動に変えるには？', '経費精算のルールを確認したい', '部下への伝え方に迷っています'];
  $('#ch-body').innerHTML = nobuSay('経営計画書をもとに、判断と行動を一緒に整理します。今日は何に迷っていますか？') +
    `<div class="chips">${chips.map(c => `<button class="chip">${esc(c)}</button>`).join('')}</div>`;
  $$('#ch-body .chip').forEach(b => b.onclick = () => { $('#ch-in').value = b.textContent; sendChat(); });
}
function chatScroll() { const b = $('#ch-body'); b.scrollTop = b.scrollHeight; }

async function sendChat() {
  const q = $('#ch-in').value.trim();
  if (!q || CHAT.busy) return;
  CHAT.busy = true; $('#ch-send').disabled = true;
  $('#ch-in').value = ''; autoGrow();
  $$('#ch-body .chips').forEach(c => c.remove());
  const body = $('#ch-body');
  body.insertAdjacentHTML('beforeend', `<div class="msg-me"><div>${esc(q)}</div></div>`);
  const wait = document.createElement('div');
  wait.innerHTML = nobuSay('<span class="typing"><i></i><i></i><i></i></span> 経営計画書を確認しています');
  body.appendChild(wait); chatScroll();

  const prevQ = CHAT.hist.filter(h => h.role === 'user').slice(-1).map(h => h.q).join(' ');
  const ctx = buildContext(retrieve(q + ' ' + prevQ, { pin: CHAT.ctxSec }));
  const userMsg = `${CHAT.ctxSec ? `（社員はいま「${CHAT.ctxSec.title}」を開いています）\n` : ''}<資料一覧>\n${ctx.txt || '（該当する資料なし）'}\n</資料一覧>\n\n社員からの相談：${q}`;
  const messages = [
    ...CHAT.hist.slice(-6).map(h => ({ role:h.role, content:h.content })),
    { role:'user', content:userMsg }
  ];

  let out = '', err = null;
  try { out = ctx.docs.length ? await aiCall({ system:chatSystem(), messages }) : 'NO_BASIS'; }
  catch (e) { err = e; }
  wait.remove();

  if (err) {
    body.insertAdjacentHTML('beforeend', nobuSay('いまは経営コンパスAIに接続できませんでした。少し時間をおいて、もう一度お試しください。') +
      `<div class="ans warn"><p class="muted" style="margin:0">詳細：${esc(String(err.message || err).slice(0,140))}</p></div>`);
  } else if (/^\s*NO_BASIS/.test(out) || !out) {
    body.insertAdjacentHTML('beforeend', nobuSay('一緒に確認してみましたが、今回は根拠となる記述が見つかりませんでした。') +
      `<div class="ans warn"><p style="margin:0">${esc(MSG_NOBASIS)}</p></div>`);
    CHAT.hist.push({ role:'user', content:userMsg, q }, { role:'assistant', content:'NO_BASIS' });
  } else {
    const lines = out.split('\n');
    let say = '方針から整理しました。';
    if (/^一言[：:]/.test(lines[0])) say = lines.shift().replace(/^一言[：:]\s*/, '');
    let cites = [];
    const li = lines.findIndex(l => /^根拠[：:]/.test(l.trim()));
    if (li >= 0) { cites = [...lines[li].matchAll(/(\d{1,2})/g)].map(m => +m[1]); lines.splice(li, 1); }
    const text = lines.join('\n').trim();
    [...text.matchAll(/\[(\d{1,2})\]/g)].forEach(m => cites.push(+m[1]));
    cites = [...new Set(cites)].filter(n => ctx.docs[n - 1]);
    body.insertAdjacentHTML('beforeend', nobuSay(esc(say)) +
      `<div class="ans">${mdLite(text)}
        ${cites.length ? `<div class="srcs"><div class="h">根拠（タップで方針を開く）</div>
          ${cites.map(n => { const d = ctx.docs[n-1];
            return `<button class="src" data-src="${esc(d.kind)}|${esc(d.id)}"><span class="n">${n}</span>${esc(d.title)}${d.page ? `　<span class="muted">手帳P.${esc(d.page)}</span>` : ''}</button>`; }).join('')}
        </div>` : ''}
      </div>`);
    body.querySelectorAll('[data-src]').forEach(b => b.onclick = () => {
      const [kind, id] = b.dataset.src.split('|');
      if (kind === 'term') openTerm(id); else { closeChat(); go('sec', id); }
    });
    CHAT.hist.push({ role:'user', content:userMsg, q }, { role:'assistant', content:out });
  }
  chatScroll();
  log('ai_ask', CHAT.ctxSec?.id || null, q.slice(0, 200));
  CHAT.busy = false; $('#ch-send').disabled = false;
}
function autoGrow() { const t = $('#ch-in'); t.style.height = 'auto'; t.style.height = Math.min(140, t.scrollHeight) + 'px'; }

function bindChat() {
  $('#fab').style.display = 'flex';
  $('#fab').onclick = () => openChat({ sec: S.route.name === 'sec' ? (S.byId[S.route.arg] || null) : null });
  $('#ch-close').onclick = closeChat;
  $('#scrim').onclick = closeChat;
  $('#ch-new').onclick = () => { CHAT.hist = []; $('#ch-body').innerHTML = ''; chatIntro(); };
  $('#ch-send').onclick = sendChat;
  $('#ch-in').addEventListener('input', autoGrow);
  $('#ch-in').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendChat(); }
  });
  setTimeout(() => $('#fab').classList.add('hello'), 900);
}

/* ---------- AI TODAY（考えてみましょう／おすすめのアクション） ---------- */
function todayKey(p) {
  const d = new Date();
  return `kk_today_${d.getFullYear()}${d.getMonth()+1}${d.getDate()}_${p.id}`;
}
async function fillToday(p) {
  if (!p) return;
  const k = todayKey(p);
  let v = lsGet(k, null);
  if (!v) {
    try {
      const out = await aiCall({
        system: '株式会社アースコムの社内AI「社長AI」として、経営計画書の方針を社員が今日の行動に移せるよう支援する。出力はJSONのみ。前置きやコードブロックは書かない。',
        prompt: `次の方針をもとに、社員向けの「今日の問い」と「おすすめのアクション」を作ってください。
条件：
- question：社員が自分の業務に引きつけて考えられる問い。60字以内、疑問形。
- action：今日中にできる具体的な行動。誰が・何をするかが分かる形で、80字以内。
- 方針に書かれていないことは付け加えない。
{"question":"...","action":"..."}

【方針】${p.title}
${(p.body_text || '').slice(0, 1400)}`,
        max_tokens: 400
      });
      v = parseJSON(out);
      if (v.question && v.action) lsSet(k, v); else v = null;
    } catch { v = null; }
  }
  if (!v) v = { question:'今、私たちにできる最も効果的な一歩は何でしょうか？',
                action:'該当する方針を読み、自社の現状と照らし合わせてアクションを検討しましょう。' };
  const q = $('#at-q'), a = $('#at-a');
  if (q) q.textContent = v.question;
  if (a) a.textContent = v.action;
}
let nobuTimer = null;
function rotateNobu() {
  clearInterval(nobuTimer);
  const el = $('#at-say'); if (!el) return;
  let i = new Date().getDate() % NOBU_LINES.length;
  el.textContent = NOBU_LINES[i];
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  nobuTimer = setInterval(() => {
    const e = $('#at-say'); if (!e) return clearInterval(nobuTimer);
    e.style.opacity = 0;
    setTimeout(() => { i = (i + 1) % NOBU_LINES.length; e.textContent = NOBU_LINES[i]; e.style.opacity = 1; }, 350);
  }, 9000);
}

/* ---------- 理解度チェック ---------- */
async function startQuiz(s, box) {
  box.innerHTML = nobuSay('<span class="typing"><i></i><i></i><i></i></span> この方針から問題を用意しています');
  let data;
  try {
    const out = await aiCall({
      system: '株式会社アースコムの社内AI「社長AI」。経営計画書の理解度チェック問題を作る。出力はJSONのみ。前置きやコードブロックは書かない。',
      prompt: `次の方針の本文だけを根拠に、4択問題を3問作ってください。
条件：
- 本文に書かれている内容だけで正解が1つに決まること。引っかけ問題にしない。
- 選択肢は現場で本当に迷いそうな、もっともらしいものにする。
- hint は答えを言わずに本文のどこを見ればよいかを示す（40字以内）。
- explain は正解の理由を本文に沿って説明（100字以内）。
- answer は正解の選択肢の番号（0〜3）。
{"questions":[{"q":"...","choices":["...","...","...","..."],"answer":0,"hint":"...","explain":"..."}]}

【方針】${s.title}
${(s.body_text || '').slice(0, 3000)}`,
      max_tokens: 1800
    });
    data = parseJSON(out);
    if (!data.questions?.length) throw new Error('empty');
  } catch (e) {
    box.innerHTML = nobuSay('いまは問題を用意できませんでした。少し時間をおいて、もう一度お試しください。') +
      `<button class="btn ghost" id="qretry">もう一度試す</button>`;
    $('#qretry').onclick = () => startQuiz(s, box);
    return;
  }
  const qs = data.questions.slice(0, 3);
  const res = new Array(qs.length).fill(null);
  box.innerHTML = nobuSay('この方針から3問、一緒に確認しましょう。間違えても大丈夫です。解説まで読むことが一番の学びになります。') +
    qs.map((q, i) => `
      <div class="qitem" data-qi="${i}">
        <div class="qn">Q${i+1} / ${qs.length}</div>
        <div class="qq">${esc(q.q)}</div>
        ${q.choices.map((c, j) => `<button class="choice" data-c="${j}"><span class="mk">${'ABCD'[j]}</span>${esc(c)}</button>`).join('')}
        <div class="qfoot"><button class="linkbtn" data-hint>ヒントを見る</button></div>
      </div>`).join('') + `<div id="qsum"></div>`;

  box.querySelectorAll('.qitem').forEach(el => {
    const i = +el.dataset.qi, q = qs[i];
    el.querySelector('[data-hint]').onclick = e => {
      e.target.replaceWith(Object.assign(document.createElement('div'), { innerHTML: nobuSay('ヒント：' + esc(q.hint || '本文をもう一度読んでみましょう。')) }));
    };
    el.querySelectorAll('.choice').forEach(b => b.onclick = () => {
      const c = +b.dataset.c, ok = c === +q.answer;
      res[i] = ok;
      el.querySelectorAll('.choice').forEach(x => {
        x.disabled = true;
        if (+x.dataset.c === +q.answer) x.classList.add('ok');
        else if (x === b) x.classList.add('ng');
      });
      const f = el.querySelector('.qfoot');
      f.innerHTML = nobuSay((ok ? 'その通りです。' : 'ここは見落としやすいところです。正解は ' + 'ABCD'[+q.answer] + ' です。') +
        `<div class="explain">${esc(q.explain || '')}</div>`, '解説');
      if (res.every(r => r !== null)) finishQuiz(s, res, box);
    });
  });
}
async function finishQuiz(s, res, box) {
  const sc = res.filter(Boolean).length, tt = res.length;
  await saveLearning('quiz', s.id, sc, tt, null);
  $('#qsum').innerHTML = `<div class="card" style="margin-top:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
    <div style="flex:1;min-width:200px"><b>${tt}問中 ${sc}問 正解</b>
      <div class="muted">${sc === tt ? '方針の要点をしっかり押さえられています。次はメモ欄に、自分の業務での実行方法を書いてみましょう。'
        : '解説を読み返してから、もう一度解いてみましょう。記録は一番よい結果が残ります。'}</div></div>
    <button class="btn ghost" id="qagain">別の問題で解き直す</button></div>`;
  $('#qagain').onclick = () => startQuiz(s, box);
}

/* ---------- ケーススタディ ---------- */
async function startCase(s, box) {
  box.innerHTML = nobuSay('<span class="typing"><i></i><i></i><i></i></span> 現場で起こりそうな場面を用意しています');
  let c;
  try {
    const out = await aiCall({
      system: '株式会社アースコム（太陽光発電・蓄電池・ReFort・セカンダリー太陽光）の社内AI「社長AI」。経営計画書の方針を使うケーススタディを作る。出力はJSONのみ。',
      prompt: `次の方針を実行する力を試す、アースコムの現場で起こりうる短いケースを1つ作ってください。
条件：
- situation：登場人物（役職のみ、実名なし）・状況・迷いどころが分かる150字程度
- question：「あなたならどう判断・行動しますか？」の形の問い
- 正解が方針から導けるケースにする
{"title":"...","situation":"...","question":"..."}

【方針】${s.title}
${(s.body_text || '').slice(0, 2500)}`,
      max_tokens: 700
    });
    c = parseJSON(out);
  } catch {
    box.innerHTML = nobuSay('いまはケースを用意できませんでした。少し時間をおいて、もう一度お試しください。') +
      `<button class="btn ghost" id="cretry">もう一度試す</button>`;
    $('#cretry').onclick = () => startCase(s, box);
    return;
  }
  box.innerHTML = nobuSay('こんな場面を考えてみましょう。正解探しではなく、方針に沿って自分の言葉で書くことが大切です。') + `
    <div class="qitem">
      <div class="qn">CASE</div>
      <div class="qq">${esc(c.title || 'ケース')}</div>
      <p style="margin:0 0 10px;font-size:13.5px;line-height:1.9">${esc(c.situation)}</p>
      <p style="margin:0 0 10px;font-weight:700;font-size:13.5px">${esc(c.question)}</p>
      <textarea class="in" id="cans" placeholder="自分ならどう判断し、何をするかを書いてください"></textarea>
      <div style="margin-top:9px;display:flex;gap:10px;align-items:center">
        <button class="btn blue" id="csend">社長AIに見てもらう</button>
        <button class="linkbtn" id="cskip">別のケースにする</button>
      </div>
      <div id="cfb"></div>
    </div>`;
  $('#cskip').onclick = () => startCase(s, box);
  $('#csend').onclick = async () => {
    const ans = $('#cans').value.trim();
    if (ans.length < 10) return toast('もう少し具体的に書いてみてください');
    $('#csend').disabled = true;
    $('#cfb').innerHTML = nobuSay('<span class="typing"><i></i><i></i><i></i></span> 方針と照らし合わせています');
    try {
      const fb = await aiCall({
        system: '株式会社アースコムの社内AI「社長AI」。社員のケーススタディ回答に、方針を根拠として前向きにフィードバックする。点数や優劣は付けない。責めない。方針に無いことは言わない。',
        prompt: `【方針】${s.title}\n${(s.body_text || '').slice(0, 2500)}\n\n【ケース】${c.situation}\n${c.question}\n\n【社員の回答】${ans}\n\n次の3見出しで、合計300字程度で書いてください。\n**よい点**\n**方針に照らして補うとよい点**\n**方針の該当箇所**（本文の言葉をそのまま短く引用）`,
        max_tokens: 900
      });
      $('#cfb').innerHTML = nobuSay('書いてくれてありがとうございます。方針と照らし合わせて整理しました。', '社長AI') +
        `<div class="ans" style="margin-left:0">${mdLite(fb)}</div>`;
      await saveLearning('case', s.id, 1, 1, (c.title || '').slice(0, 80));
    } catch {
      $('#cfb').innerHTML = nobuSay('いまは確認できませんでした。回答は消えていないので、少し時間をおいて、もう一度押してください。');
    }
    $('#csend').disabled = false;
  };
}

      return `<button class="hit" data-sec="${esc(s.id)}">

        <div class="s">${r.kind === 'quiz' ? `${r.total}問中 ${r.score}問 正解` : esc(r.detail || '取り組み済み')}</div></button>`; }).join('')
      : emptyState(MSG_EMPTY, '方針を開いて、理解度チェックかケーススタディに取り組むと、ここに記録されます。')}
    ${S.learnRemote === false && recs.length ? '<p class="muted" style="margin-top:12px">※記録はこの端末に保存されています。</p>' : ''}`;
  wire(v);
}
