<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>社員・権限管理 | EARTHCOM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1B2B; --ink-2:#2C3E52; --muted:#6B7C8F; --line:#DDE4EC;
  --paper:#F4F7FA; --card:#FFFFFF; --accent:#1F6B52; --accent-soft:#E4EFEA;
  --warn:#B4541F; --warn-soft:#FBEDE4;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans JP",system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;font-size:14px}
header{background:var(--ink);color:#fff;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
header .t{display:flex;align-items:baseline;gap:14px}
header .mark{font-size:10.5px;letter-spacing:.22em;color:#5FBFA0;font-weight:700}
header h1{font-size:16px;font-weight:700;margin:0;letter-spacing:.02em}
main{max-width:1080px;margin:0 auto;padding:26px 20px 80px}
.lead{color:var(--muted);font-size:12.5px;line-height:1.9;margin:0 0 24px}
section{margin-bottom:32px}
h2{font-size:13px;font-weight:700;margin:0 0 12px;letter-spacing:.04em;display:flex;align-items:center;gap:10px}
h2 .count{background:var(--warn-soft);color:var(--warn);font-size:11px;padding:2px 9px;border-radius:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pending{border-color:#E8C4A8;background:var(--warn-soft)}
.row{display:grid;grid-template-columns:1.4fr 1.6fr 130px 1fr 90px 84px;gap:14px;align-items:center;
  padding:13px 18px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.head{background:#EDF1F6;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.pending .row{border-bottom-color:#EDD6C2}
.name{font-weight:500}
.mail{color:var(--muted);font-size:12px;word-break:break-all}
select,input[type=text]{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;
  background:#fff;font-family:inherit;font-size:12.5px;color:var(--ink)}
select:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.areas{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11px;padding:3px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;
  cursor:pointer;user-select:none;color:var(--muted);font-family:inherit}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer}
.save{padding:7px 14px;border:0;border-radius:7px;background:var(--ink);color:#fff;font-size:12px;
  font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.save:hover{background:var(--ink-2)}
.save:disabled{opacity:.35;cursor:default}
.save.done{background:var(--accent)}
.tools{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.tools input{max-width:280px}
.empty{padding:26px 18px;color:var(--muted);font-size:12.5px;text-align:center}
.legend{margin-top:14px;font-size:11.5px;color:var(--muted);line-height:1.95}
.legend b{color:var(--ink-2)}
@media(max-width:860px){
  .row{grid-template-columns:1fr 1fr;gap:10px}
  .head{display:none}
  .row>*{min-width:0}
}
</style>
</head>
<body>

<header>
  <div class="t"><span class="mark">EARTHCOM</span><h1>社員・権限管理</h1></div>
  <div id="userBadge"></div>
</header>

<main>
  <p class="lead">
    社員が会社のGoogleアカウントで初めてログインすると、このページに「承認待ち」として表示されます。
    役割と担当エリアを設定すると、その範囲の案件が見えるようになります。
  </p>

  <section id="pendingSection" hidden>
    <h2>承認待ち <span class="count" id="pendingCount"></span></h2>
    <div class="card pending" id="pendingList"></div>
  </section>

  <section>
    <h2>社員一覧</h2>
    <div class="tools">
      <input type="text" id="q" placeholder="名前・メールで絞り込み">
    </div>
    <div class="card">
      <div class="row head">
        <div>名前</div><div>メールアドレス</div><div>役割</div>
        <div>担当エリア</div><div>状態</div><div></div>
      </div>
      <div id="list"><div class="empty">読み込み中</div></div>
    </div>
    <p class="legend">
      <b>管理者</b>＝全案件の閲覧・編集と、この画面での権限設定。　
      <b>幹部</b>＝全案件の閲覧・編集。　
      <b>営業</b>＝担当エリアと自分の案件のみ。　
      <b>現場</b>＝現調の入力と案件の閲覧のみ。　
      <b>未承認</b>＝何も見えません。<br>
      退職時は「停止」に切り替えてください。Google側でアカウントを止めれば同時にログインもできなくなります。
    </p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./ec-auth.js"></script>
<script>
/* 担当エリアの選択肢。実際の営業エリアに合わせて編集してください */
const AREAS = ['群馬','栃木','茨城','埼玉','千葉','東京','神奈川','福島'];
const ROLES = [
  ['admin','管理者'],['manager','幹部'],['sales','営業'],
  ['field','現場'],['viewer','未承認']
];

let users = [];

EC.guard({ allow: ['admin'] }).then(async () => {
  EC.mountBadge('#userBadge');
  document.getElementById('q').addEventListener('input', render);
  await load();
});

async function load(){
  const { data, error } = await EC.supabase
    .from('app_users')
    .select('id,email,full_name,role,areas,is_active,created_at')
    .order('created_at');
  if (error) {
    document.getElementById('list').innerHTML =
      '<div class="empty">読み込めませんでした: ' + esc(error.message) + '</div>';
    return;
  }
  users = data || [];
  render();
}

function render(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const pending = users.filter(u => u.role === 'viewer' && u.is_active);
  const rest = users
    .filter(u => !(u.role === 'viewer' && u.is_active))
    .filter(u => !q || (u.full_name||'').toLowerCase().includes(q) || u.email.toLowerCase().includes(q));

  const ps = document.getElementById('pendingSection');
  ps.hidden = pending.length === 0;
  document.getElementById('pendingCount').textContent = pending.length + '名';
  document.getElementById('pendingList').innerHTML = pending.map(rowHtml).join('');

  document.getElementById('list').innerHTML =
    rest.length ? rest.map(rowHtml).join('')
                : '<div class="empty">該当する社員がいません</div>';

  document.querySelectorAll('[data-chip]').forEach(el => {
    el.addEventListener('click', () => {
      el.setAttribute('aria-pressed', el.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
      markDirty(el.dataset.uid);
    });
  });
  document.querySelectorAll('[data-role],[data-active]').forEach(el => {
    el.addEventListener('change', () => markDirty(el.dataset.uid));
  });
  document.querySelectorAll('[data-save]').forEach(el => {
    el.addEventListener('click', () => save(el.dataset.save, el));
  });
}

function rowHtml(u){
  const chips = AREAS.map(a =>
    `<button type="button" class="chip" data-chip data-uid="${u.id}" data-area="${a}"
       aria-pressed="${(u.areas||[]).includes(a)}">${a}</button>`).join('');
  const opts = ROLES.map(([v,l]) =>
    `<option value="${v}"${u.role===v?' selected':''}>${l}</option>`).join('');
  return `<div class="row" data-row="${u.id}">
    <div class="name">${esc(u.full_name || '—')}</div>
    <div class="mail">${esc(u.email)}</div>
    <div><select data-role data-uid="${u.id}">${opts}</select></div>
    <div class="areas">${chips}</div>
    <div><label class="toggle"><input type="checkbox" data-active data-uid="${u.id}"
      ${u.is_active?'checked':''}>有効</label></div>
    <div><button class="save" data-save="${u.id}" disabled>保存</button></div>
  </div>`;
}

function markDirty(uid){
  const btn = document.querySelector(`[data-save="${uid}"]`);
  if (btn){ btn.disabled = false; btn.classList.remove('done'); btn.textContent = '保存'; }
}

async function save(uid, btn){
  const row = document.querySelector(`[data-row="${uid}"]`);
  const role = row.querySelector('[data-role]').value;
  const is_active = row.querySelector('[data-active]').checked;
  const areas = Array.from(row.querySelectorAll('[data-chip][aria-pressed="true"]'))
    .map(el => el.dataset.area);

  btn.disabled = true; btn.textContent = '保存中';
  const { error } = await EC.supabase.from('app_users')
    .update({ role, areas, is_active }).eq('id', uid);

  if (error){
    btn.disabled = false;
    btn.textContent = '再試行';
    alert('保存できませんでした: ' + error.message);
    return;
  }
  const u = users.find(x => x.id === uid);
  Object.assign(u, { role, areas, is_active });
  btn.textContent = '保存しました';
  btn.classList.add('done');
  if (u.role !== 'viewer') setTimeout(render, 900);
}

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
