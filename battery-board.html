<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系統用蓄電池 案件管理ボード｜全国</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- ===== EARTHCOM 共通認証（社員アカウント） ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./ec-auth.js"></script>
<style id="pageStyle">@page{size:A4 landscape;margin:0}</style>
<style>
:root{
  --ink:#1E2B27; --ink-sub:#5C6B66; --paper:#F3F5F2; --card:#FFFFFF; --line:#DDE4DF;
  --pine:#14463A; --pine-deep:#0D332A; --volt:#F0B429; --volt-soft:#FBEED0;
  /* フェーズ色（系統用蓄電池 5フェーズ＋運転開始） */
  --p1:#8C9A95; --p2:#3B82C4; --p3:#7A5CC0; --p4:#E2703A; --p5:#E8A93C; --p6:#2F9E63;
  /* 商談ステータス */
  --st-none:#9AA5A1; --st-prep:#6E8F86; --st-intro:#3B82C4; --st-nego:#E8A93C; --st-apply:#E2703A; --st-won:#2F9E63; --st-lost:#5B5B66;
  --own:#14463A; --other:#7A4E9E;
  --radius:10px; font-size:15px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",Meiryo,system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.55}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:.9rem}
:focus-visible{outline:2px solid var(--volt);outline-offset:2px}

/* ===== ヘッダー ===== */
header{background:linear-gradient(135deg,var(--pine-deep),var(--pine) 70%);color:#F4F7F3;padding:14px 20px 0;position:sticky;top:0;z-index:1100;box-shadow:0 2px 10px rgba(13,51,42,.25)}
.hd-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hd-title{display:flex;align-items:center;gap:10px}
.hd-batt{width:34px;height:18px;border:2px solid var(--volt);border-radius:4px;position:relative;display:inline-block}
.hd-batt::after{content:"";position:absolute;right:-6px;top:4px;width:4px;height:6px;background:var(--volt);border-radius:0 2px 2px 0}
.hd-batt i{position:absolute;left:2px;top:2px;bottom:2px;width:70%;background:var(--volt);border-radius:2px;animation:charge 3s ease-in-out infinite}
@keyframes charge{0%,100%{width:35%}50%{width:88%}}
@media (prefers-reduced-motion:reduce){.hd-batt i{animation:none;width:70%}}
h1{font-size:1.15rem;font-weight:700;letter-spacing:.03em}
.hd-sub{font-size:.75rem;opacity:.75;letter-spacing:.05em}
.hd-spacer{flex:1}
.hd-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 14px;color:#fff;font-size:.85rem;font-weight:600}
.hd-btn.pri{background:var(--volt);color:var(--pine-deep);border-color:var(--volt)}
.hd-btn.on{background:var(--volt);color:var(--pine-deep);border-color:var(--volt)}
.tabs{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
.tab{background:transparent;border:none;color:rgba(255,255,255,.65);padding:9px 18px;font-size:.92rem;font-weight:600;border-radius:8px 8px 0 0;white-space:nowrap}
.tab.act{background:var(--paper);color:var(--pine)}
.cust-banner{display:none;background:var(--volt);color:var(--pine-deep);text-align:center;font-size:.8rem;font-weight:700;padding:5px;letter-spacing:.08em}
body.customer .cust-banner{display:block}
body.customer .internal{display:none !important}
.sync-badge{font-size:.72rem;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);white-space:nowrap}
.sync-badge.ok{background:rgba(47,158,99,.35)} .sync-badge.err{background:rgba(180,67,46,.5)}

/* ===== 区分スイッチ＋フィルタ ===== */
.seg-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 20px 0;background:var(--card)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.seg button{border:none;background:transparent;padding:6px 14px;font-size:.84rem;font-weight:700;color:var(--ink-sub)}
.seg button.act{background:var(--pine);color:#fff}
.seg-lbl{font-size:.75rem;color:var(--ink-sub);font-weight:700}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 20px 12px;background:var(--card);border-bottom:1px solid var(--line)}
.filters select,.filters input[type=text]{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;min-width:110px}
.filters input[type=text]{min-width:170px}
.f-count{margin-left:auto;font-size:.85rem;color:var(--ink-sub);font-weight:600}

/* ===== ビュー ===== */
.view{display:none} .view.act{display:block}

/* --- 地図 --- */
#mapWrap{position:relative}
#map{height:calc(100vh - 262px);min-height:440px}
.map-tools{position:absolute;top:12px;right:12px;z-index:1000;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.map-btn{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:.82rem;font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.15);color:var(--ink)}
.map-btn.on{background:var(--pine);color:#fff;border-color:var(--pine)}
.geo-status{position:absolute;bottom:14px;left:12px;z-index:1000;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:.8rem;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.legend{position:absolute;bottom:14px;right:12px;z-index:1000;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:.78rem;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.legend div{display:flex;align-items:center;gap:6px;margin:2px 0}
.legend hr{border:none;border-top:1px solid var(--line);margin:5px 0}
.dot{width:11px;height:11px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25);display:inline-block}
.sq{width:11px;height:11px;border-radius:2px;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25);display:inline-block}
.leaflet-popup-content{font-size:.85rem;min-width:240px}
.pp-name{font-weight:700;font-size:.92rem;margin-bottom:4px;color:var(--pine)}
.pp-row{display:flex;justify-content:space-between;gap:10px;padding:2px 0;border-bottom:1px dashed var(--line)}
.pp-row b{font-weight:600;color:var(--ink-sub);white-space:nowrap}
.pp-links{margin-top:8px;display:flex;gap:10px;flex-wrap:wrap}
.pp-links a{color:var(--pine);font-weight:600}
.approx{font-size:.72rem;color:#B0722A;margin-top:6px}

/* --- バッジ --- */
.bdg{display:inline-block;font-size:.7rem;font-weight:700;border-radius:5px;padding:1px 6px;white-space:nowrap;line-height:1.5}
.bdg.own{background:#E1EEE9;color:var(--own)}
.bdg.other{background:#EEE6F5;color:var(--other)}
.bdg.v{background:#FFF4DA;color:#8A5A00}
.bdg.v.hv{background:#FDE3D8;color:#A2401A}
.ph-pill{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:700;white-space:nowrap}
.ph-pill i{width:9px;height:9px;border-radius:50%;display:inline-block}
.prog{height:5px;background:#E6ECE8;border-radius:3px;overflow:hidden;margin-top:4px;min-width:80px}
.prog b{display:block;height:100%;border-radius:3px}

/* --- 一覧 --- */
#listWrap{padding:16px 20px;overflow-x:auto}
.list-tools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tool-btn{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 14px;font-size:.82rem;font-weight:600;color:var(--ink)}
.tool-btn:hover{border-color:var(--pine);color:var(--pine)}
.tool-btn.pri{background:var(--pine);color:#fff;border-color:var(--pine)}
table.lst{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 4px rgba(20,70,58,.07)}
.lst th{background:var(--pine);color:#fff;font-size:.78rem;font-weight:600;padding:9px 10px;text-align:left;white-space:nowrap}
.lst td{padding:8px 10px;border-bottom:1px solid var(--line);font-size:.84rem;vertical-align:top}
.lst tr:hover td{background:#F6FAF7}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.site-name{font-weight:700;color:var(--pine);cursor:pointer}
.site-name:hover{text-decoration:underline}
.addr{color:var(--ink-sub);font-size:.78rem}
.lst td select{padding:4px 6px;border:1px solid var(--line);border-radius:6px;font-weight:600;max-width:140px}
.act-links a{color:var(--pine);font-weight:600;display:block;white-space:nowrap;font-size:.8rem}
.sub{font-size:.74rem;color:var(--ink-sub)}

/* --- フェーズボード（カンバン） --- */
#boardWrap{padding:16px 20px;overflow-x:auto}
.board{display:grid;grid-template-columns:repeat(6,minmax(210px,1fr));gap:10px;min-width:1290px}
.col{background:#E9EEEA;border-radius:var(--radius);padding:8px;min-height:300px;border-top:4px solid var(--c)}
.col.over{background:#DCE8E1}
.col-h{padding:4px 4px 8px}
.col-h .n{font-size:.72rem;font-weight:700;color:var(--c)}
.col-h .t{font-size:.9rem;font-weight:700}
.col-h .m{font-size:.72rem;color:var(--ink-sub);margin-top:2px}
.col-h .cnt{float:right;font-size:.8rem;font-weight:700;background:#fff;border-radius:999px;padding:0 9px}
.kc{background:#fff;border-radius:8px;padding:9px 10px;margin-bottom:8px;box-shadow:0 1px 3px rgba(20,70,58,.1);cursor:grab;border-left:4px solid var(--kc)}
.kc:active{cursor:grabbing}
.kc .nm{font-weight:700;font-size:.84rem;color:var(--pine);line-height:1.4;margin:3px 0}
.kc .ln{font-size:.74rem;color:var(--ink-sub);display:flex;justify-content:space-between;gap:6px}
.kc .nx{font-size:.72rem;margin-top:5px;color:var(--ink);background:#F6F8F6;border-radius:5px;padding:3px 6px}
.kc .nx b{color:var(--p4)}

/* --- ダッシュボード --- */
#dashWrap{padding:20px;max-width:1180px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:0 1px 4px rgba(20,70,58,.07);border-top:3px solid var(--pine)}
.kpi .lbl{font-size:.75rem;color:var(--ink-sub);font-weight:600}
.kpi .val{font-size:1.45rem;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .unit{font-size:.78rem;color:var(--ink-sub);font-weight:600}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.dash-grid{grid-template-columns:1fr}}
.panel{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:0 1px 4px rgba(20,70,58,.07)}
.panel.wide{grid-column:1/-1}
.panel h3{font-size:.95rem;color:var(--pine);margin-bottom:10px;border-left:4px solid var(--volt);padding-left:8px}
.bar-row{display:grid;grid-template-columns:120px 1fr 130px;gap:10px;align-items:center;margin:6px 0;font-size:.84rem}
.bar-bg{background:#EDF1EE;border-radius:6px;height:16px;overflow:hidden;display:flex}
.bar{height:100%}
.bar-val{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-sub);font-size:.8rem}
.mini-tbl{width:100%;border-collapse:collapse;font-size:.82rem}
.mini-tbl th{text-align:left;font-size:.74rem;color:var(--ink-sub);border-bottom:1px solid var(--line);padding:5px 6px;font-weight:600}
.mini-tbl td{padding:6px;border-bottom:1px solid var(--line)}
.empty{color:var(--ink-sub);font-size:.84rem;padding:6px 0}

footer{padding:14px 20px 30px;font-size:.75rem;color:var(--ink-sub);text-align:center}

/* ===== 案件編集 ===== */
#edOverlay{display:none;position:fixed;inset:0;z-index:2000;background:rgba(20,35,30,.55);overflow:auto;padding:24px 10px}
#edOverlay.open{display:block}
.ed{background:var(--paper);max-width:980px;margin:0 auto;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.35);overflow:hidden}
.ed-head{background:var(--pine);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:2}
.ed-head h2{font-size:1.05rem;flex:1}
.ed-body{padding:16px 20px 24px}
.ed-sec{background:#fff;border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,70,58,.06)}
.ed-sec h3{font-size:.92rem;color:var(--pine);margin-bottom:10px;border-left:4px solid var(--volt);padding-left:8px}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 14px}
.fg .w2{grid-column:span 2} .fg .w3{grid-column:1/-1}
@media(max-width:560px){.fg .w2{grid-column:1/-1}}
.fld label{display:block;font-size:.74rem;font-weight:700;color:var(--ink-sub);margin-bottom:3px}
.fld input,.fld select,.fld textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff}
.fld textarea{min-height:60px;resize:vertical}
.fld .hint{font-size:.7rem;color:var(--ink-sub);margin-top:2px}
.ph-steps{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.ph-step{flex:1;min-width:120px;border:2px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;text-align:left;font-size:.78rem;font-weight:700;color:var(--ink-sub)}
.ph-step small{display:block;font-weight:600;font-size:.68rem}
.ph-step.done{border-color:var(--c);color:var(--c)}
.ph-step.cur{background:var(--c);border-color:var(--c);color:#fff}
.ck-grp{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;overflow:hidden}
.ck-grp>summary{list-style:none;cursor:pointer;padding:8px 12px;font-weight:700;font-size:.86rem;display:flex;align-items:center;gap:8px;background:#F7F9F7}
.ck-grp>summary::-webkit-details-marker{display:none}
.ck-grp>summary .cnt{margin-left:auto;font-size:.76rem;color:var(--ink-sub)}
.ck-grp .pt{font-size:.74rem;color:var(--ink-sub);padding:8px 12px 0;line-height:1.6}
.ck{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:.85rem;border-top:1px dashed var(--line)}
.ck input[type=checkbox]{width:17px;height:17px;accent-color:var(--pine)}
.ck span{flex:1}
.ck .dt{font-size:.72rem;color:var(--ink-sub)}
.img-slots{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.img-slots{grid-template-columns:1fr}}
.img-slot{border:2px dashed var(--line);border-radius:8px;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#FAFBFA;position:relative;overflow:hidden;cursor:pointer;text-align:center;padding:8px}
.img-slot img{max-width:100%;max-height:220px;object-fit:contain}
.img-slot .cap{font-size:.78rem;font-weight:700;color:var(--ink-sub)}
.img-slot .rm{position:absolute;top:6px;right:6px;background:#fff;border:1px solid var(--line);border-radius:6px;font-size:.72rem;padding:2px 7px}
.ed-foot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:6px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 16px;font-weight:700;font-size:.86rem;color:var(--ink)}
.btn.pri{background:var(--volt);border-color:var(--volt);color:var(--pine-deep)}
.btn.dk{background:var(--pine);border-color:var(--pine);color:#fff}
.btn.del{color:#B4432E;border-color:#EBC9C1}

/* ===== 物件情報 1枚ペラ（A4横） ===== */
#sheetOverlay,#simOverlay{display:none;position:fixed;inset:0;z-index:2100;background:rgba(20,35,30,.6);overflow:auto;padding:24px 10px}
#sheetOverlay.open,#simOverlay.open{display:block}
.sheet-tools{max-width:297mm;margin:0 auto 10px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.sheet-tools label{color:#fff;font-size:.82rem;font-weight:600;display:flex;align-items:center;gap:5px;margin-right:6px}
.ps{background:#fff;width:297mm;height:210mm;margin:0 auto 14px;padding:9mm 11mm 8mm;box-shadow:0 4px 24px rgba(0,0,0,.35);color:#1A1A1A;display:flex;flex-direction:column;overflow:hidden;font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
.ps-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:3mm}
.ps-title{font-size:19pt;font-weight:800;color:#1F2A6B;letter-spacing:.01em;line-height:1.2}
.ps-conf{font-size:19pt;color:#E2231A;font-weight:500;white-space:nowrap}
.ps-tags{display:flex;gap:5px;margin-top:3px}
.ps-tags span{font-size:8pt;font-weight:700;border:1px solid #1F2A6B;color:#1F2A6B;border-radius:3px;padding:0 6px}
.ps-imgs{display:grid;grid-template-columns:1fr 1fr;gap:4mm;flex:1;min-height:0}
.ps-img{border:1px solid #BFC6D6;background:#F4F6FA;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.ps-img img{width:100%;height:100%;object-fit:contain;background:#fff}
.ps-img img.cover{object-fit:cover}
.ps-img .ph{color:#8A93A6;font-size:10pt;text-align:center;line-height:1.8}
.ps-img .smap{position:absolute;inset:0}
.ps-img .src{position:absolute;right:3px;bottom:2px;font-size:6pt;color:#fff;background:rgba(0,0,0,.45);padding:0 4px;z-index:500}
.ps-link{font-size:10pt;margin:2mm 0 3mm;min-height:4mm}
.ps-link a{color:#7A2B8E}
table.ps-tbl{width:100%;border-collapse:collapse;table-layout:fixed;font-size:9.5pt}
.ps-tbl th{background:#D9DDEA;color:#1A1A1A;font-weight:700;padding:2.2mm 1mm;border:1px solid #fff;text-align:center;font-size:9pt}
.ps-tbl td{background:#EEF0F6;padding:2.8mm 1mm;border:1px solid #fff;text-align:center;line-height:1.35;word-break:break-word}
.ps-foot{display:flex;justify-content:space-between;font-size:7pt;color:#666;margin-top:2mm}
@media(max-width:1150px){.ps{transform-origin:top left}}

/* ===== 投資シミュレーション（低圧） ===== */
.sim-tools{max-width:210mm;margin:0 auto 10px;display:flex;gap:8px;justify-content:flex-end}
.sheet{background:#fff;width:210mm;min-height:297mm;margin:0 auto;padding:13mm 14mm;box-shadow:0 4px 24px rgba(0,0,0,.35);color:var(--ink);font-size:9.5pt}
.sh-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--pine);padding-bottom:6px}
.sh-head .t1{font-size:8pt;letter-spacing:.2em;color:var(--pine);font-weight:700}
.sh-head h2{font-size:15pt;color:var(--pine)}
.sh-head .brand{text-align:right;font-size:8pt;color:var(--ink-sub);line-height:1.4}
.sh-head .brand b{color:var(--pine);font-size:10pt;letter-spacing:.1em}
.sh-prop{display:flex;gap:14px;flex-wrap:wrap;background:#F2F6F3;border-radius:6px;padding:7px 12px;margin:8px 0;font-size:9pt}
.sh-prop b{color:var(--ink-sub);font-weight:600;margin-right:5px}
.sh-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.sh-kpi{border:1px solid var(--line);border-top:3px solid var(--pine);border-radius:6px;padding:7px 9px}
.sh-kpi.gold{border-top-color:var(--volt)}
.sh-kpi .l{font-size:7.5pt;color:var(--ink-sub);font-weight:700}
.sh-kpi .v{font-size:13.5pt;font-weight:700;font-variant-numeric:tabular-nums;margin-top:1px}
.sh-kpi .u{font-size:8pt;color:var(--ink-sub);font-weight:600}
.sh-sec{font-size:10pt;color:var(--pine);font-weight:700;border-left:4px solid var(--volt);padding-left:7px;margin:10px 0 5px}
.sh-assump{font-size:8pt;color:var(--ink-sub);line-height:1.6;background:#FBFCFB;border:1px solid var(--line);border-radius:6px;padding:6px 10px}
#simChart{width:100%;height:auto;display:block;margin:2px 0}
table.sh-tbl{width:100%;border-collapse:collapse;font-size:8pt}
.sh-tbl th{background:var(--pine);color:#fff;padding:3.5pt 5pt;font-weight:600;text-align:right;white-space:nowrap}
.sh-tbl th:first-child{text-align:left}
.sh-tbl td{padding:3pt 5pt;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ================= データモデル ================= */
const DEF={category:"自社開発",voltage:"低圧",name:"",address:"",pref:"",gridArea:"",mapUrl:"",area:null,owner:"",developer:"",
 landStatus:"",houseDist:"",access:"",phase:1,checks:{},connStatus:"未申請",burden:null,burdenPay:"未確定",codMonth:"",codNote:"",
 commercial:"",cancelGrace:"",battMaker:"",battKwh:null,pcsMaker:"",pcsKw:null,ems:"",aggregator:"",om:"",
 landPrice:null,fee:null,pq:null,mq:null,landPhase:"",powerPhase:"",status:"未着手",customer:"",memo:"",updated:"",updatedBy:"",lat:null,lng:null,deleted:false};
function prefOf(addr){const a=(addr||"").replace(/〒?\d{3}[-−ー]?\d{4}\s*/,"").trim();return PREFS.find(p=>a.startsWith(p))||"";}
function norm(r){
  const p={...DEF,...r,checks:{...(r.checks||{})}};
  if(!p.pref)p.pref=prefOf(p.address);
  if(!p.gridArea)p.gridArea=AREA_OF[p.pref]||"";
  p.phase=Math.min(6,Math.max(1,+p.phase||1));
  return p;
}
/* Excel取込（旧形式）の物件をフェーズ管理用に変換 */
function fromLegacy(s,sale){
  const lp=s.landPhase||"", pp=s.powerPhase||"";
  const checks={p1_grid:1,p1_fs:1};
  let landStatus="交渉中";
  if(/合意書|条件承認/.test(lp)){checks.p1_land=1;landStatus="合意書取得";}
  if(/契約締結/.test(lp)){checks.p1_land=1;landStatus="契約締結";}
  let phase=1, conn="未申請";
  if(/電力協議|接続|申請/.test(pp)){phase=2;checks.p2_apply_lv=1;conn="接続検討申込済";}
  return norm({...s,category:"自社開発",voltage:"低圧",pcsKw:49.5,phase,checks,connStatus:conn,landStatus,
    status:(sale&&sale.status)||"未着手",customer:(sale&&sale.customer)||"",memo:(sale&&sale.memo)||"",updated:(sale&&sale.updated)||"",
    lat:sale&&sale.lat,lng:sale&&sale.lng});
}

const LS_P="battery_projects_v2", LS_GEO="battery_geo_v1";
let PROJECTS=(JSON.parse(localStorage.getItem(LS_P)||"null")||[]).map(norm);
let geoCache=JSON.parse(localStorage.getItem(LS_GEO)||"{}");
let imgs={...SEED_IMGS};
if(!PROJECTS.length) PROJECTS=[...SITES_EMBED.map(s=>fromLegacy(s,null)),...SEED_PROJECTS.map(norm)];
const live=()=>PROJECTS.filter(p=>!p.deleted);
const byId=id=>PROJECTS.find(p=>p.id===id);
const cacheLocal=()=>{try{localStorage.setItem(LS_P,JSON.stringify(PROJECTS));}catch(e){}};

/* ================= クラウド共有（Supabase） ================= */
const TBL="battery_board";
let sb=null, cloudOn=false, myName="";
function setBadge(txt,cls){const b=document.getElementById("syncBadge");b.textContent=txt;b.className="sync-badge internal "+(cls||"");}
async function boot(){
  const me=await EC.guard({allow:['admin','manager','sales']});
  sb=EC.supabase;
  if(me&&me.full_name) myName=me.full_name;
  if(document.getElementById("userBadge")) EC.mountBadge('#userBadge');
  cloudOn=true;
  await cloudLoad();
  geocodeAll();
}
async function cloudLoad(){
  if(!cloudOn)return;
  setBadge("☁ 読込中…");
  const {data,error}=await sb.from(TBL).select("key,value").not("key","like","img%");
  if(error){setBadge("☁ 読込エラー","err");console.error(error);return;}
  let legacy=null; const sales={}, prj={};
  (data||[]).forEach(r=>{
    if(r.key==="sites_data"&&r.value&&Array.isArray(r.value.sites)) legacy=r.value.sites;
    else if(r.key.startsWith("site_")) sales[+r.key.slice(5)]=r.value||{};
    else if(r.key.startsWith("prj_")) prj[r.key.slice(4)]=r.value||{};
  });
  const base=(legacy&&legacy.length?legacy:SITES_EMBED).map(s=>fromLegacy(s,sales[s.id]));
  const map=new Map(base.map(p=>[String(p.id),p]));
  SEED_PROJECTS.forEach(s=>{if(!map.has(String(s.id)))map.set(String(s.id),norm(s));});
  Object.entries(prj).forEach(([id,v])=>map.set(id,norm({...v,id:v.id??(isNaN(+id)?id:+id)})));
  PROJECTS=[...map.values()];
  cacheLocal(); initFilters();
  setBadge("☁ 共有中（"+new Date().toTimeString().slice(0,5)+" 取得）","ok");
  render();
}
function recOf(p){const {...r}=p;return r;}
async function saveProject(p){
  p.updated=new Date().toISOString().slice(0,10); p.updatedBy=myName||"";
  cacheLocal();
  if(!cloudOn)return;
  setBadge("☁ 保存中…");
  const now=new Date().toISOString();
  const rows=[{key:"prj_"+p.id,value:recOf(p),updated_at:now,updated_by:myName||"（未入力）"}];
  /* 旧形式との互換（他アプリの取込用に商談ステータスも従来キーへ保存） */
  if(typeof p.id==="number"&&p.id<1e9) rows.push({key:"site_"+p.id,value:{status:p.status,customer:p.customer,memo:p.memo,updated:p.updated,lat:p.lat,lng:p.lng},updated_at:now,updated_by:myName||"（未入力）"});
  const {error}=await sb.from(TBL).upsert(rows);
  setBadge(error?"☁ 保存エラー":"☁ 共有中（保存済み）",error?"err":"ok");
  if(error){console.error(error);alert("保存に失敗しました："+error.message);}
}
async function saveMany(list){
  cacheLocal(); if(!cloudOn||!list.length)return;
  setBadge("☁ 保存中…"); const now=new Date().toISOString();
  const {error}=await sb.from(TBL).upsert(list.map(p=>({key:"prj_"+p.id,value:recOf(p),updated_at:now,updated_by:myName||"（未入力）"})));
  setBadge(error?"☁ 保存エラー":"☁ 共有中（保存済み）",error?"err":"ok");
  if(error)console.error(error);
}
async function loadImgs(id){
  if(imgs[id]&&imgs[id]._loaded)return imgs[id];
  if(cloudOn){
    const {data}=await sb.from(TBL).select("value").eq("key","img_"+id).maybeSingle();
    if(data&&data.value) imgs[id]={...(imgs[id]||{}),...data.value};
  }
  imgs[id]={...(imgs[id]||{}),_loaded:true};
  return imgs[id];
}
async function saveImgs(id){
  if(!cloudOn)return;
  const {_loaded,...v}=imgs[id]||{};
  const {error}=await sb.from(TBL).upsert({key:"img_"+id,value:v,updated_at:new Date().toISOString(),updated_by:myName||"（未入力）"});
  if(error){console.error(error);alert("画像の保存に失敗しました："+error.message);}
}

/* ================= 表示ヘルパー ================= */
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const custName=n=>String(n||"").replace(/^(見込み\d+\/\d+買付|見込み買付|見込み|買付|【蓄電池】|【分筆あり】)+/g,"").trim();
const man=v=>v==null||v===""?"─":(v/10000).toLocaleString(undefined,{maximumFractionDigits:1})+"万円";
const nf=(v,d=0)=>v==null||v===""?"":(+v).toLocaleString(undefined,{maximumFractionDigits:d});
const codText=p=>p.codMonth?`${+p.codMonth.slice(0,4)}年${+p.codMonth.slice(5,7)}月${p.codNote||""}`:(p.codNote||"");
const catBdg=p=>`<span class="bdg ${p.category==="他社開発"?"other":"own"}">${p.category==="他社開発"?"他社":"自社"}</span>`;
const voltBdg=p=>`<span class="bdg v ${isHV(p)?"hv":""}">${esc(p.voltage)}</span>`;
const phPill=p=>`<span class="ph-pill" style="color:${cssColor(phC(p.phase))}"><i style="background:${cssColor(phC(p.phase))}"></i>${p.phase<6?"P"+p.phase+" ":""}${phK(p.phase)}</span>`;
function progBar(p){const g=phaseProg(p,p.phase<6?p.phase:null);return `<div class="prog" title="現フェーズのチェック ${g.d}/${g.n}"><b style="width:${p.phase>=6?100:g.pct}%;background:${cssColor(phC(p.phase))}"></b></div>`;}
function cssColor(v){if(!String(v).startsWith("var("))return v;return getComputedStyle(document.documentElement).getPropertyValue(v.slice(4,-1)).trim();}

function initFilters(){
  const opt=(id,vals,lab)=>{const el=document.getElementById(id),cur=el.value;
    el.innerHTML=`<option value="">${lab}：すべて</option>`+vals.map(v=>`<option value="${esc(v.v??v)}">${esc(v.t??v)}</option>`).join("");
    el.value=cur;};
  const L=live();
  opt("fArea",AREAS.filter(a=>L.some(p=>p.gridArea===a)).map(a=>({v:a,t:a+"エリア"})),"電力エリア");
  opt("fPref",PREFS.filter(x=>L.some(p=>p.pref===x)),"都道府県");
  opt("fPhase",PHASES.map(x=>({v:x.n,t:(x.n<6?"P"+x.n+" ":"")+x.k})),"フェーズ");
  opt("fOwner",[...new Set(L.map(p=>p.owner).filter(Boolean))],"担当");
  opt("fStatus",STATUSES.map(s=>s.k),"商談");
}
function filtered(){
  const a=fArea.value,pr=fPref.value,ph=fPhase.value,o=fOwner.value,st=fStatus.value,kw=fKw.value.trim();
  return live().filter(p=>{
    if(segCat&&p.category!==segCat)return false;
    if(segVolt==="低圧"&&isHV(p))return false;
    if(segVolt==="高圧・特高"&&!isHV(p))return false;
    if(a&&p.gridArea!==a)return false;
    if(pr&&p.pref!==pr)return false;
    if(!customer&&ph&&p.phase!==+ph)return false;
    if(!customer&&o&&p.owner!==o)return false;
    if(!customer&&st&&p.status!==st)return false;
    if(customer&&p.status==="見送り")return false;
    if(kw&&!(p.name+p.address+p.developer+p.aggregator).includes(kw))return false;
    return true;
  });
}

function drawMarkers(){
  const list=filtered(), ids=new Set(list.map(p=>String(p.id)));
  Object.entries(markers).forEach(([id,m])=>{if(!ids.has(id)){map.removeLayer(m);delete markers[id];}});
  list.forEach(p=>{
    const c=coordOf(p); if(!c)return;
    const icon=pinIcon(markerColor(p),p.category==="他社開発");
    const k=String(p.id);
    if(markers[k]){markers[k].setLatLng([c.lat,c.lng]);markers[k].setIcon(icon);markers[k].setPopupContent(popupHtml(p));return;}
    const mk=L.marker([c.lat,c.lng],{draggable:false,icon}).addTo(map);
    mk.bindPopup(()=>popupHtml(byId(p.id)||p));
    mk.on("dragend",e=>{const ll=e.target.getLatLng();const q=byId(p.id);q.lat=ll.lat;q.lng=ll.lng;saveProject(q);});
    if(fixOn)mk.dragging.enable();
    markers[k]=mk;
  });

/* ================= ジオコーディング（国土地理院API） ================= */
const cleanAddr=a=>String(a||"").replace(/〒\d{3}-?\d{4}\s*/,"").replace(/\s+/g,"").split(/[、,]/)[0];
async function gsiSearch(q){const r=await fetch("https://msearch.gsi.go.jp/address-search/AddressSearch?q="+encodeURIComponent(q));const j=await r.json();if(j&&j.length){const[lng,lat]=j[0].geometry.coordinates;return{lat,lng};}return null;}
let geoRunning=false;
async function geocodeAll(){
  if(geoRunning)return; geoRunning=true;
  const targets=live().filter(p=>p.address&&!geoCache[p.address]&&p.lat==null);
  let done=live().length-targets.length;
  for(const p of targets){
    const base=cleanAddr(p.address);
    const cands=[base,base.replace(/[0-9０-９\-−ー番地の]+$/,""),base.replace(/字.*$/,"")];
    let hit=null;
    for(const q of cands){if(!q)continue;try{hit=await gsiSearch(q);}catch(e){}if(hit)break;await new Promise(r=>setTimeout(r,120));}
    if(hit){
      const n=Object.values(geoCache).filter(c=>Math.abs(c.lat-hit.lat)<1e-4&&Math.abs(c.lng-hit.lng)<1e-4).length;
      if(n>0)hit={lat:hit.lat+0.0007*n,lng:hit.lng+0.0007*n};
      geoCache[p.address]=hit; localStorage.setItem(LS_GEO,JSON.stringify(geoCache));
    }
    done++; document.getElementById("geoStatus").textContent=`位置情報を取得中… ${done}/${live().length}`;
    drawMarkers();
  }
  geoRunning=false; updateGeoStatus(true); fitAll();
}
function updateGeoStatus(final){
  const L=live(), ok=L.filter(coordOf).length;
  if(final||ok===L.length||!geoRunning) document.getElementById("geoStatus").textContent=`表示中の案件：${filtered().filter(coordOf).length}件（位置取得 ${ok}/${L.length}）`;
}

let ed=null, edIsNew=false;
function fld(k,label,type,opts={}){
  const v=ed[k]??"";
  let inp;
  if(type==="select") inp=`<select data-k="${k}" onchange="edChange('${k}',this.value)">${(opts.list||[]).map(o=>`<option ${String(o)===String(v)?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
  else if(type==="textarea") inp=`<textarea data-k="${k}" oninput="edChange('${k}',this.value)" placeholder="${esc(opts.ph||"")}">${esc(v)}</textarea>`;
  else inp=`<input type="${type}" data-k="${k}" value="${esc(v)}" placeholder="${esc(opts.ph||"")}" ${type==="number"?'step="any" inputmode="decimal"':""} oninput="edChange('${k}',this.value,'${type}')">`;
  return `<div class="fld ${opts.w||""}" ${opts.id?`id="${opts.id}"`:""}><label>${label}</label>${inp}${opts.hint?`<div class="hint">${opts.hint}</div>`:""}</div>`;
}
function edChange(k,v,type){
  ed[k]=type==="number"?(v===""?null:+v):v;
  if(k==="address"&&!ed._prefTouched){const pr=prefOf(v);if(pr){ed.pref=pr;ed.gridArea=AREA_OF[pr]||ed.gridArea;syncEdField("pref");syncEdField("gridArea");}}
  if(k==="pref"){ed._prefTouched=true;if(AREA_OF[v]){ed.gridArea=AREA_OF[v];syncEdField("gridArea");}}
  if(k==="voltage"||k==="category"||k==="phase"){if(k==="phase")ed.phase=+v;drawEditor();}
}
function syncEdField(k){const e=document.querySelector(`#edBody [data-k="${k}"]`);if(e)e.value=ed[k]??"";}
function edCheck(id,on){
  ed.checks=ed.checks||{};
  if(on)ed.checks[id]=new Date().toISOString().slice(0,10);else delete ed.checks[id];
  /* チェックと項目の連動 */
  if(on&&id==="p4_pay")ed.burdenPay="支払済";
  if(on&&id==="p4_approve"&&CONN.indexOf(ed.connStatus)<4)ed.connStatus="供給承諾";
  if(on&&id==="p4_contract"&&CONN.indexOf(ed.connStatus)<3)ed.connStatus="契約申込済";
  if(on&&id==="p2_answer"&&CONN.indexOf(ed.connStatus)<2)ed.connStatus="接続検討回答済";
  if(on&&(id==="p2_apply"||id==="p2_apply_lv")&&CONN.indexOf(ed.connStatus)<1)ed.connStatus="接続検討申込済";
  if(on&&id==="p5_link")ed.connStatus="連系済";
  if(on&&id==="p1_land"&&(!ed.landStatus||ed.landStatus==="交渉中"))ed.landStatus="合意書取得";
  /* 現フェーズの項目がすべて完了したら次フェーズを提案 */
  const g=phaseProg(ed,ed.phase);
  if(on&&ed.phase<6&&g.d===g.n&&confirm(`P${ed.phase}「${phK(ed.phase)}」のチェックがすべて完了しました。\nフェーズを「${phK(ed.phase+1)}」へ進めますか？`))ed.phase++;
  drawEditor();
}

function drawImgSlots(){
  const box=document.getElementById("imgSlots"); if(!box||!ed)return;
  const im=imgs[ed.id]||{};
  box.innerHTML=[["aerial","航空写真（左）"],["layout","配置図・レイアウト（右）"]].map(([k,cap])=>`

      ${im[k]?`<img src="${im[k]}" alt="${cap}"><button class="rm" onclick="event.stopPropagation();rmImg('${k}')">✕ 外す</button>`:`<div style="font-size:1.6rem">🖼</div>`}
      <div class="cap">${cap}</div><div class="hint" style="font-size:.7rem;color:var(--ink-sub)">${im[k]?"クリックで差し替え":"クリックまたはドラッグ＆ドロップで登録"}</div>
    </div>`).join("");

let imgDirty=false;
function pickImg(k){const i=document.createElement("input");i.type="file";i.accept="image/*";i.onchange=()=>readImg(k,i.files[0]);i.click();}
function readImg(k,file){
  if(!file||!file.type.startsWith("image/"))return;
  const fr=new FileReader();
  fr.onload=()=>{const img=new Image();img.onload=()=>{
    const MAX=1400, s=Math.min(1,MAX/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    imgs[ed.id]={...(imgs[ed.id]||{}),[k]:c.toDataURL("image/jpeg",.82),_loaded:true};imgDirty=true;drawImgSlots();
  };img.src=fr.result;};
  fr.readAsDataURL(file);
}
function rmImg(k){if(imgs[ed.id]){delete imgs[ed.id][k];imgDirty=true;drawImgSlots();}}
async function saveEditor(thenSheet){
  if(!ed.name.trim()){alert("案件名を入力してください。");return;}
  const {_prefTouched,...rec}=ed; const p=norm(rec);
  const i=PROJECTS.findIndex(x=>x.id===p.id);
  if(i>=0){
    if(PROJECTS[i].address!==p.address&&p.lat!=null&&confirm("所在地が変わりました。手動で修正したピン位置をリセットしますか？\n（キャンセルで位置を維持）")){p.lat=null;p.lng=null;}
    PROJECTS[i]=p;}
  else PROJECTS.push(p);
  await saveProject(p);
  if(imgDirty){await saveImgs(p.id);imgDirty=false;}
  closeEditor(); initFilters(); render(); geocodeAll();
  if(thenSheet)openSheets([p.id]);
}
async function deleteProject(){
  if(!confirm(`「${ed.name}」を削除します。よろしいですか？`))return;
  const p=byId(ed.id); p.deleted=true; await saveProject(p);

}

function simCalc(inv){
  const cum=[];let c=-inv,be=null;
  SIM.net.forEach((n,i)=>{c+=n;cum.push(c);if(be===null&&c>=0)be=i;});
  const npv=r=>SIM.net.reduce((a,n,i)=>a+n/Math.pow(1+r,i+1),-inv);
  let lo=-0.9,hi=3;for(let i=0;i<200;i++){const m=(lo+hi)/2;(npv(m)>0)?lo=m:hi=m;}
  const totalNet=SIM.net.reduce((a,b)=>a+b,0);
  return {cum,be,irr:(lo+hi)/2,totalNet,finalCF:totalNet-inv,totalSales:SIM.sales.reduce((a,b)=>a+b,0),totalCost:SIM.cost.reduce((a,b)=>a+b,0)};
}
function simChartSVG(inv,cum){
  const W=740,H=190,padL=58,padR=8,padT=14,padB=24,vals=[-inv,...cum];
  const min=Math.min(...vals),max=Math.max(...vals),span=max-min||1;
  const x=i=>padL+(W-padL-padR)*i/(vals.length-1), y=v=>padT+(H-padT-padB)*(1-(v-min)/span), zero=y(0);
  let bars="",pts="";
  cum.forEach((v,i)=>{const xi=x(i+1),yi=y(v),h=Math.abs(yi-zero)||1;
    bars+=`<rect x="${xi-9}" y="${Math.min(yi,zero)}" width="18" height="${h}" rx="2" fill="${v>=0?"#2F9E63":"#C9CFCB"}"/>`;pts+=`${xi},${yi} `;
    if(i%2===0||i===cum.length-1)bars+=`<text x="${xi}" y="${H-6}" font-size="8.5" text-anchor="middle" fill="#5C6B66">${SIM.years[i]}</text>`;});
  const yl=[max,0,min].map(v=>`<text x="${padL-6}" y="${y(v)+3}" font-size="8.5" text-anchor="end" fill="#5C6B66">${(v/1e4).toLocaleString(undefined,{maximumFractionDigits:0})}万</text>`).join("");
  return `<svg id="simChart" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><line x1="${padL}" y1="${zero}" x2="${W-padR}" y2="${zero}" stroke="#1E2B27" stroke-width="1"/>${bars}<polyline points="${pts}" fill="none" stroke="#14463A" stroke-width="2"/>${yl}</svg>`;
}

  const inv=s.pq||30000000, r=simCalc(inv), today=new Date();

    <div class="sh-kpis">

      <div class="sh-kpi"><div class="l">年間収益（1年目）</div><div class="v">${(SIM.sales[0]/1e4).toLocaleString(undefined,{maximumFractionDigits:0})}<span class="u">万円</span></div></div>
      <div class="sh-kpi gold"><div class="l">15年累計CF（投資後・税前）</div><div class="v">${(r.finalCF/1e4).toLocaleString(undefined,{maximumFractionDigits:0})}<span class="u">万円</span></div></div>
      <div class="sh-kpi gold"><div class="l">表面IRR（税前）／ 黒字化</div><div class="v">${(r.irr*100).toFixed(1)}<span class="u">%　${r.be!==null?`${r.be+1}年目（${SIM.years[r.be]}年）`:"─"}</span></div></div>

      <tr class="total"><td>15年合計</td><td>${Math.round(r.totalSales).toLocaleString()}</td><td>${Math.round(r.totalCost).toLocaleString()}</td><td>${Math.round(r.totalNet).toLocaleString()}</td><td>${Math.round(r.finalCF).toLocaleString()}</td></tr></table>
    <div class="sh-assump" style="margin-top:6px">${SIM.assump}<br>売上内訳（15年計）：一次調整力市場 ${Math.round(SIM.ichiji.reduce((a,b)=>a+b,0)/1e4).toLocaleString()}万円 ／ スポット市場 ${Math.round(SIM.spot.reduce((a,b)=>a+b,0)/1e4).toLocaleString()}万円 ／ 容量市場 ${Math.round(SIM.cap.reduce((a,b)=>a+b,0)/1e4).toLocaleString()}万円</div>
    <div class="sh-note">※本シミュレーションはTensor Energyアグリゲーションデータおよび需給調整市場単価前提に基づく試算値であり、収益を保証するものではありません。実際の収益は市場動向・稼働状況により変動します。※金額は税別想定・税引前です。土地取得費・登記費用・租税公課等は含みません。詳細は担当者までお問い合わせください。<br>株式会社アースコム　〒343-0816 埼玉県越谷市</div>`;
  document.getElementById("simOverlay").classList.add("open");document.body.style.overflow="hidden";
}

/* ================= 物件Excel読み込み（部署予算進行MQ計上用フォーマット → 低圧・自社開発） ================= */
function importExcel(ev){
  const f=ev.target.files[0]; if(!f)return; ev.target.value="";
  const rd=new FileReader();
  rd.onload=async()=>{try{
    const wb=XLSX.read(rd.result,{type:"array"}), ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
    let cA=-1;
    for(const row of rows){const i=(row||[]).findIndex(v=>typeof v==="string"&&v.trim()==="所在地");if(i>=0){cA=i;break;}}
    if(cA<0){alert("「所在地」列が見つかりませんでした。「蓄電池：部署予算進行MQ計上用」形式のExcel（1シート目）をご利用ください。");return;}
    const cName=cA-1,cOwner=Math.max(0,cA-3),cUrl=cA+1,cLand=cA+2,cPower=cA+3,cPrice=cA+4,cFee=cA+5,cPq=cA+6,cMq=cA+7;
    const num=v=>{if(typeof v==="number")return v;if(v==null||v==="")return null;const n=+String(v).replace(/[,，円\s]/g,"");return isNaN(n)?null:n;};
    let owner="";const parsed=[];
    rows.forEach(row=>{
      if(!row)return;
      const b=row[cOwner]!=null?String(row[cOwner]).trim():"", name=row[cName]!=null?String(row[cName]).trim():"", addr=row[cA]!=null?String(row[cA]).trim():"";
      if(b&&b!=="小計"&&b!=="合計"&&!b.startsWith("物件:")&&!b.startsWith("蓄電池")&&!b.includes("生成者"))owner=b;
      if(!name||name==="合計"||b==="小計"||b==="合計")return;
      if(!/[都道府県]/.test(addr))return;
      parsed.push({owner,name,address:addr,mapUrl:row[cUrl]?String(row[cUrl]).trim():"",landPhase:row[cLand]?String(row[cLand]).trim():"",
        powerPhase:row[cPower]?String(row[cPower]).trim():"",landPrice:num(row[cPrice]),fee:num(row[cFee]),pq:num(row[cPq]),mq:num(row[cMq])});
    });
    if(!parsed.length){alert("物件データが見つかりませんでした。");return;}
    let upd=0,add=0;const changed=[];
    parsed.forEach((x,i)=>{
      const ex=live().find(p=>p.name===x.name);
      if(ex){Object.assign(ex,x);ex.updated=new Date().toISOString().slice(0,10);changed.push(ex);upd++;}
      else{const p=fromLegacy({id:Date.now()+i,...x},null);PROJECTS.push(p);changed.push(p);add++;}
    });
    await saveMany(changed); initFilters(); render(); geocodeAll();
    alert(`Excelを読み込みました。\n更新：${upd}件　新規追加：${add}件（低圧・自社開発として登録）\n※フェーズ・設備・商談の入力内容は保持しています。`);
  }catch(e){alert("Excelの読み込みに失敗しました："+e.message);}};
  rd.readAsArrayBuffer(f);
}

}
