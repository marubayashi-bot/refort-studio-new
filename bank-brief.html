<style>
:root{
  --ink:#172033; --sub:#56627A; --paper:#F1F3F6; --surface:#FFFFFF; --line:#D6DCE4;
  --ai:#23457A; --ai-soft:#E4EBF5; --shu:#B8322A;
  --good:#2F7A55; --warn:#A0660F; --bad:#B03A2E; --na:#8A93A3;
  --mincho:"Shippori Mincho",serif; --gothic:"BIZ UDPGothic",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--gothic);font-size:15px;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.num{font-variant-numeric:tabular-nums}

header.top{background:var(--ink);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
header.top .logo{width:44px;height:44px;border-radius:10px;display:block;flex:none}
header.top h1{font-family:var(--mincho);font-weight:800;font-size:22px;margin:0;letter-spacing:.04em}
header.top .meta{font-size:13px;color:#C5CCD8}
header.top .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--ai)}
.btn.primary{background:var(--ai);color:#fff;border-color:var(--ai)}
.btn.primary:hover{background:#1A3560}
.btn.ghost{background:transparent;color:#fff;border-color:#4A5670}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:13px}

.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 60px)}
nav.steps{background:var(--surface);border-right:1px solid var(--line);padding:20px 0}
nav.steps button{display:flex;gap:12px;align-items:baseline;width:100%;text-align:left;border:0;background:none;padding:12px 20px;cursor:pointer;border-left:4px solid transparent}
nav.steps button .n{font-family:var(--mincho);font-weight:800;font-size:18px;color:var(--na);width:18px}
nav.steps button.on{border-left-color:var(--ai);background:var(--ai-soft)}
nav.steps button.on .n{color:var(--ai)}
nav.steps button .t{font-weight:700}
nav.steps button .d{display:block;font-size:12px;color:var(--sub);font-weight:400}
nav.steps .foot{padding:16px 20px;font-size:12px;color:var(--sub);border-top:1px solid var(--line);margin-top:16px}

main{padding:28px 32px 80px;max-width:1180px}
h2{font-family:var(--mincho);font-weight:800;font-size:26px;margin:0 0 4px}
.lead{color:var(--sub);margin:0 0 24px;max-width:70ch}
h3{font-size:17px;margin:28px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label.f{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
input.t,select.t,textarea.t{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:#fff}
textarea.t{min-height:72px;resize:vertical}

.drop{border:2px dashed #AEB8C6;border-radius:10px;padding:34px;text-align:center;background:#FAFBFC;cursor:pointer}
.drop.over{border-color:var(--ai);background:var(--ai-soft)}
.drop strong{font-size:17px}
.doclist{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.doc{display:grid;grid-template-columns:1fr 120px 130px 90px auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.doc .name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc .st{font-size:13px}

/* 銀行評価のヘッダー：朱の検印 */
.verdict{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px 28px}

.pill.good{background:var(--good)} .pill.warn{background:var(--warn)} .pill.bad{background:var(--bad)} .pill.na{background:var(--na)}
.bar{height:6px;background:#E6E9EE;border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%}
.m details{font-size:13px;color:var(--sub);margin-top:4px}

.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}

.alerts{display:flex;flex-direction:column;gap:6px;margin-top:12px}

.upd{color:var(--good)} .dnd{color:var(--bad)}
table.tgt td{vertical-align:middle;white-space:nowrap}

.edit-list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:8px}
.item .row{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:start}

.busy{display:inline-flex;align-items:center;gap:8px;color:var(--ai);font-weight:700}
.busy::before{content:"";width:14px;height:14px;border:3px solid var(--ai-soft);border-top-color:var(--ai);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.outline{counter-reset:s;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.outline div{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:14px}
.outline div::before{counter-increment:s;content:counter(s);font-family:var(--mincho);font-weight:800;color:var(--ai);margin-right:8px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.on{opacity:1}
.empty{padding:40px;text-align:center;color:var(--sub);background:var(--surface);border:1px dashed var(--line);border-radius:8px}

.simwrap{margin:14px 0 22px}
.simgrid{display:grid;grid-template-columns:minmax(260px,1fr) 1.2fr;gap:22px;align-items:start;margin-top:10px}

.simrow span{display:flex;justify-content:space-between;gap:10px}
.simrow b{color:var(--ai)}
.simrow input{width:100%;accent-color:var(--ai)}
.simtbl{width:100%;border-collapse:collapse;font-size:14px;background:var(--surface)}
.simtbl th{background:var(--ink);color:#fff;font-weight:400;padding:6px 10px;text-align:right}

async function pdfText(file) {

    const page = await pdf.getPage(i);
    const c = await page.getTextContent();
    // 行ごとにまとめる（y座標でグループ化）
    const rows = {};
    c.items.forEach(it => { const y = Math.round(it.transform[5]); (rows[y] = rows[y] || []).push([it.transform[4], it.str]); });
    out += `\n[${i}ページ]\n` + Object.keys(rows).sort((a, b) => b - a).map(y => rows[y].sort((a, b) => a[0] - b[0]).map(x => x[1]).join(" ")).join("\n");
  }

async function extractDoc(d) {
  if (!d.file) throw new Error("PDFファイルがありません。もう一度追加してください");

  let text = "";
  try { text = await pdfText(d.file); } catch (e) { }
  const raw = await callAI({ system: EXTRACT_SYSTEM, prompt: extractPrompt(d), pdfBase64: b64, pdfText: text, maxTokens: 12000 });
  const j = parseJSON(raw);
  if (!j || !j.pl) throw new Error("数値を読み取れませんでした。ページの向きや解像度を確認してください");
  d.pl = {}; d.bs = {};
  KEYS.pl.forEach(k => d.pl[k] = n(j.pl[k]));
  KEYS.bs.forEach(k => d.bs[k] = n(j.bs?.[k]));
  if (!d.period_end && j.period_end) d.period_end = String(j.period_end).slice(0, 7);
  d.months = d.kind === "決算書" ? 12 : (n(j.months) || d.months || 12);
  d.notes = (j.notes || []).slice(0, 3);
  d.src = (j.src && typeof j.src === "object") ? j.src : {};
  if (j.company && !S.company) S.company = j.company;
}

/* ---------- AI呼び出し（プレビュー＝直接／本番＝Edge Function） ---------- */
async function getToken() {
  try {
    if (window.EC) {
      if (typeof EC.token === "function") { const t = await EC.token(); if (t) return t; }
      const cli = EC.sb || EC.supabase || EC.client;
      if (cli?.auth) { const { data } = await cli.auth.getSession(); if (data?.session?.access_token) return data.session.access_token; }
    }
  } catch (e) { }
  return CONFIG.SB_KEY;
}
async function callAI({ system, prompt, pdfBase64, pdfText, maxTokens }) {
  const content = pdfBase64
    ? [{ type: "document", source: { type: "base64", media_type: "application/pdf", data: pdfBase64 } }, { type: "text", text: prompt }]
    : prompt;

  if (CONFIG.MODE === "direct") {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 1000, system, messages: [{ role: "user", content }] })
    });
    const data = await res.json();
    if (data.error) throw new Error("AI呼び出しに失敗しました：" + (data.error.message || ""));
    return (data.content || []).filter(c => c.type === "text").map(c => c.text).join("\n");
  }

  const headers = { "Content-Type": "application/json", Authorization: "Bearer " + await getToken(), apikey: CONFIG.SB_KEY };
  // 1) PDFをそのまま渡す（Edge Functionを更新済みの場合）
  const trail = [];
  const post = async body => {
    const r = await fetch(CONFIG.EDGE_URL, { method: "POST", headers, body: JSON.stringify(body) });
    const raw = await r.text();
    let j = {}; try { j = JSON.parse(raw); } catch (e) { }
    const types = (j.content || []).map(b => b.type).join("+") || "なし";
    const err = j.error ? (typeof j.error === "string" ? j.error : (j.error.error?.message || JSON.stringify(j.error))) : "";
    trail.push(`状態${r.status}／中身:${types}${err ? "／" + err.slice(0, 160) : ""}${!j.text && !err && !j.content ? "／応答:" + raw.slice(0, 120) : ""}`);
    console.log("[AI]", r.status, j);
    return [r, j];
  };
  let [res, data] = await post({ system, max_tokens: maxTokens, messages: [{ role: "user", content }] });
  // 2) 旧版のEdge Functionなら、抽出テキストで再送
  if (!data.text && pdfBase64 && pdfText && pdfText.trim().length > 200) {
    [res, data] = await post({ system, max_tokens: maxTokens, prompt: prompt + "\n\n以下はPDFから抽出したテキストです。\n" + pdfText });
  }
  if (!pdfBase64 && !data.text) {
    [res, data] = await post({ system, max_tokens: maxTokens, prompt });
  }
  if (!data.text) {
    const cut = trail.some(t => /thinking/.test(t) && !/text/.test(t));
    throw new Error((cut ? "AIが答えを書き終える前に出力の上限に達しました。" : "AIから文章が返ってきませんでした。") + "【詳細】" + trail.join(" ｜ "));
  }
  return data.text;
}
function parseJSON(t) {
  if (!t) return null;
  const s = t.replace(/```json|```/g, "");
  const a = s.indexOf("{"), b = s.lastIndexOf("}");
  if (a < 0 || b < 0) return null;
  try { return JSON.parse(s.slice(a, b + 1)); } catch (e) { return null; }
}

   改善シミュレーター
   今期の数値を12か月に換算し、4つの打ち手を動かしたときの指標を出す

function annualDoc(d) {
  const f = 12 / (d.months || 12);
  return { ...d, months: 12, pl: Object.fromEntries(KEYS.pl.map(k => [k, n(d.pl[k]) === null ? null : d.pl[k] * f])) };
}
function simDoc(d) {
  const sm = S.sim, a = annualDoc(d), pl = { ...a.pl }, bs = { ...d.bs };
  const salesA = z(pl.sales), grossA = n(pl.gross) !== null ? pl.gross : salesA - z(pl.cogs);
  const gm = salesA ? grossA / salesA : 0;
  const nSales = salesA * (1 + sm.salesUp / 100);
  const nGross = nSales * (gm + sm.gmPt / 100);
  const sgaCut = sm.sgaCut * 1e6;
  const delta = (nGross - grossA) + sgaCut;
  pl.sales = nSales; pl.gross = nGross; pl.cogs = nSales - nGross;
  pl.sga = z(pl.sga) - sgaCut;
  pl.op = z(pl.op) + delta; pl.ordinary = z(pl.ordinary) + delta;
  if (pl.pretax !== null) pl.pretax += delta;
  // 運転資金の圧縮：在庫から先に減らし、残りを売上債権から。減った分は現預金に
  let wc = sm.wcCut * 1e6;
  const invCut = Math.min(wc, Math.max(0, z(bs.inventory))); bs.inventory = z(bs.inventory) - invCut; wc -= invCut;
  const recvCut = Math.min(wc, Math.max(0, z(bs.receivables))); bs.receivables = z(bs.receivables) - recvCut;
  bs.cash = z(bs.cash) + invCut + recvCut;

}

const f1 = v => n(v) === null ? "—" : Number(v).toLocaleString(undefined, { maximumFractionDigits: 1, minimumFractionDigits: 1 });
const f0 = v => n(v) === null ? "—" : Math.round(v).toLocaleString();

function numify(v) {

  if (v === null || v === undefined) return null;
  const s = String(v).replace(/[,，\s百万円倍年%％]/g, "").replace(/^△|^▲/, "-");

async function excelText(file) {
  if (!window.XLSX) throw new Error("Excel読み取りの部品を読み込めませんでした。通信環境を確認してください");
  const wb = XLSX.read(await file.arrayBuffer(), { type: "array", cellDates: true });
  let out = "";
  wb.SheetNames.forEach(name => {
    const csv = XLSX.utils.sheet_to_csv(wb.Sheets[name], { blankrows: false })
      .split("\n").map(l => l.replace(/,+$/, "")).filter(l => l.replace(/,/g, "").trim()).join("\n");
    if (csv) out += `\n### シート「${name}」\n${csv}\n`;
  });
  if (!out.trim()) throw new Error("Excelに読み取れる表がありませんでした");
  return out;
}
async function extractPlan(file) {
  if (!file) return;
  const isExcel = /\.(xlsx|xlsm|xls)$/i.test(file.name);
  if (!isExcel && !/\.pdf$/i.test(file.name) && file.type !== "application/pdf") { S.planMsg = "PDFかExcel（.xlsx）のファイルを選んでください"; step6(); return; }
  S.planBusy = true; S.planMsg = ""; step6();
  try {
    let reqA, reqB;
    if (isExcel) {
      const text = await excelText(file);
      if (text.length > 180000) toast("Excelが大きいため、一部のシートは読み取りから外れる場合があります");
      const body = "\n\n資料（Excelの各シートをCSVにしたもの。単位は表の表記に従う）：\n" + text.slice(0, 180000);
      reqA = { system: PLAN_EX_SYSTEM, prompt: PLAN_EX_A + body, maxTokens: 16000 };
      reqB = { system: PLAN_EX_SYSTEM, prompt: PLAN_EX_B + body, maxTokens: 12000 };
    } else {
      const b64 = await fileToBase64(file);
      const text = await pdfText(file).catch(() => "");
      reqA = { system: PLAN_EX_SYSTEM, prompt: PLAN_EX_A, pdfBase64: b64, pdfText: text, maxTokens: 16000 };
      reqB = { system: PLAN_EX_SYSTEM, prompt: PLAN_EX_B, pdfBase64: b64, pdfText: text, maxTokens: 12000 };
    }
    const [ra, rb] = await Promise.all([
      callAI(reqA),
      callAI(reqB).catch(e => { S.planMsg = "財務の表は読み取れませんでした（" + e.message + "）"; return ""; })
    ]);
    const ja = parseJSON(ra), jb = parseJSON(rb) || {};
    if (!ja || !Array.isArray(ja.periods) || !ja.periods.length) throw new Error("事業計画・利益計画のページを読み取れませんでした。PDFが長期事業計画書か確認してください");
    delete jb.periods;
    const oldTargets = S.plan?.targets || [];
    S.plan = normalizePlan({ ...ja, ...jb });
    S.plan.fileName = file.name;
    S.plan.targets = mergeTargets(suggestTargets(S.plan), oldTargets, S.plan);
    S.planSim = []; S.planAnalysis = null;
    toast("長期計画を読み取りました。数値を確認してください");
  } catch (e) {
    S.planMsg = e.message;
  }
  S.planBusy = false; step6();
}
function planSet(path, i, v) {
  const P = S.plan, x = numify(v), p = path.split(".");
  if (p[0] === "seg") P.segments[+p[1]][p[2]][i] = x;
  else if (p[0] === "staff") P.staff[i] = x;

}

function guessMetric(t) {
  const x = String(t || "");
  if (/労働分配率/.test(x)) return "laborShare";
  if (/経常利益率|売上高経常利益率/.test(x)) return "om";
  if (/粗利益率|粗利率/.test(x)) return "gm";
  if (/一人当たり|1人当たり/.test(x) && /人件費|給/.test(x)) return "personnelPer";
  if (/一人当たり|1人当たり/.test(x) && /粗利/.test(x)) return "grossPer";
  if (/人件費|給料|給与/.test(x)) return "personnelPer";
  if (/経常利益/.test(x)) return "ordinary";
  if (/営業利益/.test(x)) return "op";
  if (/粗利/.test(x)) return "gross";
  if (/売上/.test(x)) return "sales";
  if (/自己資本比率/.test(x)) return "eq";
  if (/償還/.test(x)) return "debtYears";
  if (/人員|社員数|従業員/.test(x)) return "staff";
  if (/現金|預金/.test(x)) return "cash";
  return "";
}
function suggestTargets(P) {
  const L = P.periods.length - 1;
  return (P.notes || []).filter(x => /[＊*]/.test(x.text)).map(x => ({
    label: (x.item ? x.item + "：" : "") + x.text, metric: guessMetric(x.item + " " + x.text), pi: L, value: null, source: "未定", noteText: x.text
  }));
}
function mergeTargets(fresh, old, P) {
  const L = P.periods.length - 1;
  const keep = old.filter(t => !t.noteText || n(t.value) !== null).map(t => ({ ...t, pi: Math.min(t.pi ?? L, L) }));
  return [...fresh.filter(f => !keep.some(k => k.noteText && k.noteText === f.noteText)), ...keep];
}
function tgtEval(P, t) {
  const M = TGT_METRICS[t.metric]; if (!M || n(t.value) === null) return null;
  const raw = M.get(P, t.pi); if (raw === null) return { tvTxt: `${f1(t.value)}${M.u}`, pvTxt: "—", met: null, gapTxt: "計画に数字なし" };
  const pv = M.pct ? raw * 100 : raw, met = M.hi ? pv >= t.value - 1e-9 : pv <= t.value + 1e-9;
  const gap = pv - t.value;
  return { pv, tvTxt: `${f1(t.value)}${M.u}${M.hi ? "以上" : "以下"}`, pvTxt: `${f1(pv)}${M.u}`, met, gapTxt: met ? "計画で届く" : `あと${f1(Math.abs(gap))}${M.u}`, gap };
}

function drawPlanCharts(P) {

const pdfCache = {};
let SRC = null;
async function getPdf(d) {
  if (!d.file || !window.pdfjsLib) return null;
  if (!pdfCache[d.id]) pdfCache[d.id] = await pdfjsLib.getDocument({ data: await d.file.arrayBuffer(), ...PDF_OPTS }).promise;
  return pdfCache[d.id];
}
function numKeys(v) {
  const a = Math.abs(v), out = new Set([String(Math.round(a)), String(Math.round(a / 1000)), String(Math.floor(a / 1000)), String(Math.ceil(a / 1000))]);
  if (a >= 1e8) out.add(String(Math.round(a / 1e6)));
  return [...out].filter(x => x.length >= 2);
}
const normNum = t => String(t).replace(/[,，\s円]/g, "").replace(/^[△▲\-−(（]/, "").replace(/[)）]$/, "");
async function locateSource(d, k) {
  const pdf = await getPdf(d), v = d.pl[k] ?? d.bs[k], src = (d.src || {})[k] || null;
  if (!pdf) return { page: src?.p || null, hit: null, noFile: true };
  const keys = n(v) === null ? [] : numKeys(v);
  const f = FIELDS.find(x => x.k === k);
  const labs = [((src?.t || "").replace(/[0-9０-９,，.△▲\-−\s円()（）＋+]/g, "")).slice(0, 4), f.l.replace(/（.*?）/g, "").slice(0, 3)].filter(x => x && x.length >= 2);
  const order = [...new Set([src?.p, ...Array.from({ length: pdf.numPages }, (_, i) => i + 1)])].filter(p => p >= 1 && p <= pdf.numPages);
  let noText = true;
  for (const p of order) {
    const items = (await (await pdf.getPage(p)).getTextContent()).items.filter(it => it.str && it.str.trim());
    if (items.length) noText = false;
    const hits = items.filter(it => keys.includes(normNum(it.str)));
    if (!hits.length) continue;
    const sameLine = h => items.filter(o => Math.abs(o.transform[5] - h.transform[5]) < 4).map(o => o.str.replace(/\s/g, "")).join("");
    const best = hits.find(h => labs.some(l => sameLine(h).includes(l)));
    return { page: p, hit: best || hits[0], labelMatch: !!best, count: hits.length };
  }
  return { page: src?.p || 1, hit: null, noText };
}

        <button class="btn sm x" onclick="closeSource()">閉じる（Esc）</button></div>

  const loc = await locateSource(d, k);

    $("srcStatus").innerHTML = `<span style="color:var(--warn)">元のPDFがこの画面にありません（保存データから開いたため）。下からPDFを選び直すと、該当ページを表示できます。</span>`;
    $("srcReattach").innerHTML = `<label class="btn sm" style="cursor:pointer">元のPDFを選び直す<input type="file" accept="application/pdf" hidden onchange="reattachPdf('${id}',this.files[0])"></label>`;
    $("srcPageLab").textContent = src?.p ? `${src.p}ページ` : "—";

  }
  SRC.page = loc.page; SRC.hit = loc.hit; SRC.hitPage = loc.page;

    ? `<span style="color:var(--good);font-weight:700">PDF上の数字と一致しました。</span><br>${loc.page}ページの黄色い枠の位置です。${loc.labelMatch ? "同じ行に科目名もあります。" : "同じ数字が他の行にもある場合は、科目名と見比べてください。"}`
    : loc.noText

      : `<span style="color:var(--warn)">同じ数字がPDFの中に見つかりませんでした。</span><br>複数の科目を合算した値か、単位の換算が違う可能性があります。AIが示した根拠と見比べてください。`;
  renderSrcPage();
}
async function renderSrcPage() {
  const d = S.docs.find(x => x.id === SRC.id), pdf = await getPdf(d); if (!pdf) return;
  SRC.page = Math.min(Math.max(1, SRC.page), pdf.numPages);
  $("srcPageLab").textContent = `${SRC.page} / ${pdf.numPages}ページ`;
  const page = await pdf.getPage(SRC.page), body = $("srcBody");
  const base = page.getViewport({ scale: 1 }), dpr = window.devicePixelRatio || 1;
  const scale = Math.max(0.6, (body.clientWidth - 28) / base.width), vp = page.getViewport({ scale: scale * dpr });
  const cv = $("srcCanvas"); cv.width = vp.width; cv.height = vp.height; cv.style.width = vp.width / dpr + "px"; cv.style.height = vp.height / dpr + "px";
  const ctx = cv.getContext("2d");
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  if (SRC.hit && SRC.hitPage === SRC.page) {
    const t = pdfjsLib.Util.transform(vp.transform, SRC.hit.transform), h = Math.hypot(t[2], t[3]);
    const x = t[4], y = t[5] - h, w = SRC.hit.width * vp.scale, pad = 5 * dpr;
    ctx.fillStyle = "rgba(255,205,0,.35)"; ctx.fillRect(x - pad, y - pad, w + pad * 2, h + pad * 2);
    ctx.strokeStyle = "#D23B2E"; ctx.lineWidth = 3 * dpr; ctx.strokeRect(x - pad, y - pad, w + pad * 2, h + pad * 2);
    body.scrollTop = Math.max(0, y / dpr - body.clientHeight / 2);

}
function srcPage(dx) { if (!SRC) return; SRC.page += dx; renderSrcPage(); }
function closeSource() { const m = $("srcModal"); if (m) m.style.display = "none"; SRC = null; }

  if (!file) return; const d = S.docs.find(x => x.id === id); d.file = file; delete pdfCache[id];
  showSource(SRC.id, SRC.s, SRC.k);
}

/* =========================================================
   面談モード：銀行訪問でそのまま見せる大きな画面
   ========================================================= */
let MEET = { i: 0 };
function meetingSlides() {
  const { d, prev } = getTarget(); if (!d) return [];
  const c = calc(d), cp = prev ? calc(prev) : null, A = S.analysis;
  const g = (cc, k) => cc.list.find(x => x.key === k);
  const kpi = (k, label) => {
    const x = g(c, k), px = cp ? g(cp, k) : null;
    return `<div class="${judge(x)}"><div class="l">${label}</div><div class="v">${fmtVal(x)}<small style="font-size:.45em">${x.v !== null && isFinite(x.v) ? x.unit : ""}</small></div><div class="s">${px ? `前回 ${fmtVal(px)}${px.v !== null && isFinite(px.v) ? px.unit : ""}` : ""}</div></div>`;
  };
  const M = v => fmtM(v) + "<small style=\"font-size:.45em\">百万円</small>";
  // 試算表は累計なので、比べるときは12か月に換算してから前回（通期）と並べる
  const ann = (x, k) => n(x.pl[k]) === null ? null : x.pl[k] * 12 / (x.months || 12);
  const cmpTxt = k => {
    const a = d.kind === "試算表" && d.months !== 12 ? `年換算 ${fmtM(ann(d, k))}百万円` : "";
    const b = prev ? `前回${prev.kind === "試算表" && prev.months !== 12 ? "（年換算）" : ""} ${fmtM(ann(prev, k))}百万円` : "";
    return [a, b].filter(Boolean).join("／");
  };
  const slides = [];
  slides.push({ t: "要旨", h: `<div class="hint" style="color:#9FD8C4;font-size:16px;margin-bottom:10px">${esc(docLabel(d))}</div>
    <h2>${esc(A?.headline || "業績のご報告")}</h2><p class="lead2">${esc(A?.summary || "（手順4で要旨をつくると、ここに表示されます）")}</p>` });
  slides.push({ t: "重要指標", h: `<h2>重要指標</h2><div class="kp">
    <div><div class="l">売上高${d.kind === "試算表" ? `（${d.months}か月累計）` : ""}</div><div class="v">${M(d.pl.sales)}</div><div class="s">${cmpTxt("sales")}</div></div>
    <div class="${z(d.pl.ordinary) > 0 ? "good" : "bad"}"><div class="l">経常利益${d.kind === "試算表" ? `（${d.months}か月累計）` : ""}</div><div class="v">${M(d.pl.ordinary)}</div><div class="s">${cmpTxt("ordinary")}</div></div>
    ${kpi("ordMargin", "売上高経常利益率")}${kpi("equity", "自己資本比率")}${kpi("repay", "債務償還年数")}${kpi("current", "流動比率")}</div>` });
  if (A && (A.concerns || []).filter(x => x.title).length) slides.push({ t: "課題と認識", h: `<h2>課題と、その認識</h2><div class="cards">${A.concerns.filter(x => x.title).map(x => `<div class="card"><h3>${esc(x.title)}</h3><p>${esc(x.evidence || "")}</p>${x.cause ? `<p style="margin-top:6px;color:#C9D6EA">要因：${esc(x.cause)}</p>` : ""}</div>`).join("")}</div>` });
  if (A && (A.actions || []).filter(x => x.title).length) slides.push({ t: "改善計画", h: `<h2>改善計画</h2><div class="cards">${A.actions.filter(x => x.title).map(x => `<div class="card"><h3>${esc(x.title)}</h3><p>${esc(x.detail || "")}</p>
    ${x.effect ? `<span class="tag">効果 ${esc(x.effect)}</span>` : ""}${x.deadline ? `<span class="tag">期限 ${esc(x.deadline)}</span>` : ""}${x.kpi ? `<span class="tag">確認する数字 ${esc(x.kpi)}</span>` : ""}</div>`).join("")}</div>` });
  if (simOn()) slides.push({ t: "改善後の見通し", h: `<h2>改善後の見通し（年換算の試算）</h2><table><thead><tr><th>項目</th><th>現状</th><th>改善後</th></tr></thead><tbody>${simRows(d).filter(r => !/格付け/.test(r[0])).map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td class="${r[3] > 1e-9 ? "up" : r[3] < -1e-9 ? "dn" : ""}">${r[2]}</td></tr>`).join("")}</tbody></table>
    <p style="color:#C9D6EA;margin-top:12px">打ち手：${esc(simText())}</p>` });
  if (A && (A.qa || []).filter(x => x.q).length) slides.push({ t: "ご質問への回答", h: `<h2>ご質問への回答</h2><div>${A.qa.filter(x => x.q).map((x, i) => `<div class="qa" id="qa${i}"><button onclick="this.parentNode.classList.toggle('open')">${esc(x.q)}</button><div class="a">${esc(x.a)}</div></div>`).join("")}</div>` });
  if (A?.closing) slides.push({ t: "今後に向けて", h: `<h2>今後に向けて</h2><p class="lead2">${esc(A.closing)}</p>` });
  return slides;
}
function openMeeting() {
  if (!getTarget().d) { toast("先に資料を読み込み、数値を確認してください"); return; }
  MEET.i = 0;
  let el = $("meet");
  if (!el) { el = document.createElement("div"); el.id = "meet"; el.setAttribute("role", "dialog"); el.setAttribute("aria-label", "面談モード"); document.body.appendChild(el);
    let sx = null;
    el.addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
    el.addEventListener("touchend", e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 60) meetGo(MEET.i + (dx < 0 ? 1 : -1)); sx = null; }); }
  el.style.display = "flex"; document.body.classList.add("meet-on");
  renderMeeting();
  if (!S.analysis) toast("手順4で改善計画と想定問答をつくると、面談モードに表示されます");
}
function renderMeeting() {
  const el = $("meet"), sl = meetingSlides(); MEET.i = Math.min(Math.max(0, MEET.i), sl.length - 1);

    <div class="mb">${cur.h}</div>

      <div class="dots">${sl.map((x, i) => `<button class="${i === MEET.i ? "on" : ""}" onclick="meetGo(${i})" aria-label="${esc(x.t)}"></button>`).join("")}</div>
      <button class="nb" onclick="meetGo(MEET.i+1)" ${MEET.i === sl.length - 1 ? "disabled style=\"opacity:.3\"" : ""}>次へ →</button></div>`;
}
function meetGo(i) { MEET.i = i; renderMeeting(); }
function closeMeeting() { const el = $("meet"); if (el) el.style.display = "none"; document.body.classList.remove("meet-on"); }
document.addEventListener("keydown", e => {
  const meetOpen = $("meet") && $("meet").style.display !== "none", srcOpen = $("srcModal") && $("srcModal").style.display !== "none";
  if (srcOpen && e.key === "Escape") { closeSource(); return; }
  if (!meetOpen) return;
  if (e.key === "Escape") closeMeeting();
  else if (e.key === "ArrowRight" || e.key === "PageDown" || (e.key === " " && e.target === document.body)) { e.preventDefault(); meetGo(MEET.i + 1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); meetGo(MEET.i - 1); }
});

/* ---------- 保存・読み込み ---------- */
function saveJSON() {
  const base = { ...S, docs: S.docs.map(({ file, ...r }) => r), _busy: false, planBusy: false };
  if (!canPlan()) { delete base.plan; delete base.planSim; delete base.planMemo; delete base.planAnalysis; }
  const data = JSON.stringify(base, null, 1);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([data], { type: "application/json" }));
  a.download = `銀行説明_${S.company}_${new Date().toISOString().slice(0, 10)}.json`; a.click();
  toast("分析を保存しました");
}
function loadJSON(inp) {
  const f = inp.files[0]; if (!f) return;
  f.text().then(t => { const j = JSON.parse(t); if (!canPlan()) { delete j.plan; delete j.planSim; delete j.planMemo; delete j.planAnalysis; } S = Object.assign(S, j, { _busy: false }); S.sim = Object.assign({}, SIM0, j.sim || {}); S.step = sortedDocs().length ? 3 : (S.plan ? 7 : 1); S.planBusy = false; render(); toast("保存データを開きました"); })
    .catch(() => toast("このファイルは開けません"));
  inp.value = "";
}
